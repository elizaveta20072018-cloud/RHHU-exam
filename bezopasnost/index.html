я прекращения горения — химический материал, к которому пристраивается первая помощь."}, {"q": "В чём методическая тонкость интеграции, которую стоит назвать самому?", "ok": "Требуется согласование логики, а не смешение содержания", "bad": ["Интегрированный урок должен длиться два академических часа", "Оценивать интегрированный урок должны оба учителя", "Интеграция обязательна для каждой темы курса"], "why": "Иначе получается урок, где два учителя рассказывают параллельно и ученик не понимает, что здесь главное."}, {"q": "Какой психологический эффект обеспечивают межпредметные связи?", "ok": "Перенос и обобщение способа действия", "bad": ["Снижение утомляемости на уроке", "Рост непроизвольного внимания", "Улучшение механического запоминания"], "why": "Знание, закреплённое только в одном предметном контексте, в другой не переносится, поэтому обобщение требует разных контекстов."}]}, {"n": 29, "title": "Причины и факторы неотложных состояний. Виды неотложных состояний", "kostyak": ["Начну с определения: неотложное состояние — это внезапное нарушение работы организма, при котором без быстрой помощи человек погибнет или получит стойкое повреждение здоровья. Ключевое слово — фактор времени.", "Причины делю на две большие группы: внешние и внутренние. Внешние — травмы, ожоги, отморожения, отравления, поражение электрическим током, утопление, укусы. Внутренние — обострение имеющихся болезней: инфаркт, инсульт, приступ астмы, гипогликемия у диабетика, эпилептический приступ, анафилаксия.", "Отдельно назову факторы, которые повышают риск в школе: физическая нагрузка на уроке физкультуры, жара и духота в кабинете, конфликтная ситуация как стрессовый триггер, доступ к бытовой химии в лаборантской, поведение самих детей на переменах.", "По механизму развития неотложные состояния сводятся к нескольким угрозам жизни: нарушение сознания, нарушение дыхания, нарушение кровообращения, массивная кровопотеря. На этом построен весь алгоритм осмотра пострадавшего.", "Для оказывающего первую помощь работает не медицинский диагноз, а перечень состояний из приказа Минздрава. Их восемь классических: отсутствие сознания; остановка дыхания и кровообращения; наружные кровотечения; инородные тела верхних дыхательных путей; травмы различных областей тела; ожоги и действие высокой температуры; отморожения и действие низкой температуры; отравления.", "Подчеркну разницу: врач ставит диагноз, а человек без медицинского образования распознаёт признаки состояния из этого перечня и выполняет мероприятия из другого перечня. Дальше начинается медицинская помощь, и это уже не наша зона.", "Закончу тем, что для педагога это означает: заранее знать, у кого из детей эпилепсия, диабет, астма или пищевая аллергия. Это профилактика неотложного состояния, а не его лечение."], "terms": ["неотложное состояние", "фактор времени", "внешние и внутренние причины", "угрожающие жизни состояния", "перечень состояний", "при которых оказывается первая помощь", "распознавание признаков", "а не постановка диагноза", "анафилаксия", "гипогликемия", "предрасполагающие факторы", "профилактика на уровне образовательной организации"], "follow": [{"q": "Чем неотложное состояние отличается от экстренного?", "a": "Экстренная форма помощи оказывается при явной угрозе жизни здесь и сейчас, неотложная — когда явной угрозы жизни нет, но помощь нужна быстро. Это градация из закона об охране здоровья, она относится к медицинской помощи; для первой помощи такого деления нет."}, {"q": "Кто в школе обязан оказывать первую помощь?", "a": "Педагогические работники — по закону об образовании, это прямо прописано в их обязанностях. Плюс любой гражданин имеет право её оказать, и закон это право защищает."}], "notes": [], "block": "Первая помощь", "bk": "pp", "tier": 3, "psy": false, "aid": true, "core": "Неотложное состояние — внезапное нарушение работы организма, при котором без быстрой помощи человек погибает или получает стойкое повреждение здоровья; ключевое — фактор времени. Тот, кто оказывает первую помощь, диагноз не ставит, а распознаёт признаки состояния из закрытого перечня.", "anchors": ["фактор времени", "внешние и внутренние причины", "четыре угрозы жизни", "перечень состояний", "профилактика в школе"], "simple": ["Неотложное состояние — это счёт на минуты: без быстрой помощи наступает гибель или стойкое повреждение здоровья.", "Причины делятся на две группы: внешние (травма, ожог, отморожение, отравление, ток, утопление, укус) и внутренние — обострение своих болезней (инфаркт, инсульт, приступ астмы, гипогликемия у диабетика, эпилептический приступ, анафилаксия).", "По механизму любое такое состояние сводится к угрозам жизни: нарушение сознания, дыхания, кровообращения, массивная кровопотеря — по ним и осматривают пострадавшего.", "Врач ставит диагноз, а человек без медицинского образования распознаёт признаки состояния из перечня и выполняет мероприятия из перечня — это две разные работы.", "Перечень состояний из приказа Минздрава насчитывает восемь пунктов: отсутствие сознания; остановка дыхания и кровообращения; наружные кровотечения; инородные тела дыхательных путей; травмы; ожоги; отморожения; отравления.", "Факторы риска в школе бытовые: нагрузка на физкультуре, жара и духота, конфликт как стрессовый триггер, бытовая химия в лаборантской, беготня на переменах."], "cards": [{"t": "неотложное состояние", "d": "внезапное нарушение работы организма, при котором без быстрой помощи наступает гибель или стойкое повреждение здоровья"}, {"t": "первая помощь", "d": "не медицинская помощь: её оказывают лица без медицинского образования до приезда скорой, и перечень мероприятий закрытый"}, {"t": "перечень состояний", "d": "восемь состояний из приказа Минздрава, при которых оказывается первая помощь"}, {"t": "распознавание, а не диагноз", "d": "человек без медобразования узнаёт признаки состояния из перечня, а диагноз ставит врач"}, {"t": "анафилаксия", "d": "бурная аллергическая реакция с отёком, удушьем и падением давления, разворачивается за минуты"}, {"t": "гипогликемия", "d": "резкое падение сахара крови у диабетика: слабость, потливость, спутанность, вплоть до потери сознания"}], "quiz": [{"q": "Чем первая помощь отличается от медицинской?", "ok": "Её оказывают лица без медицинского образования, и перечень мероприятий закрытый", "bad": ["Это та же медицинская помощь, только в сокращённом объёме", "Отличие в месте: первая помощь оказывается вне медицинской организации, а состав мероприятий любой", "Первая помощь — это начальный этап работы бригады скорой помощи"], "why": "Ключевое — субъект и закрытый перечень: чего в перечне нет, того делать нельзя. Объём и место тут вторичны."}, {"q": "Что делает человек без медицинского образования при неотложном состоянии?", "ok": "Распознаёт признаки состояния из перечня и выполняет мероприятия из перечня", "bad": ["Ставит предварительный диагноз и сообщает его диспетчеру", "Определяет тяжесть по шкале и решает, нужна ли скорая", "Подбирает пострадавшему лекарство по симптомам"], "why": "Диагноз и лекарства — зона врача. Типичная ошибка — думать, что «предварительный диагноз» разрешён."}, {"q": "Какие причины неотложных состояний относятся к внутренним?", "ok": "Инфаркт, инсульт, приступ астмы, гипогликемия", "bad": ["Ожоги, отморожения, поражение током", "Утопление и укусы животных", "Отравления бытовой химией"], "why": "Внутренние — это обострение собственных болезней. Всё, что прилетело извне, — внешняя причина, даже если яд действует внутри организма."}]}, {"n": 34, "title": "Первая помощь при ожогах и отморожениях", "kostyak": ["Оба состояния — из перечня приказа: «ожоги, эффекты воздействия высокой температуры и теплового излучения» и «отморожение и другие эффекты воздействия низких температур». Логика похожая: сначала прекратить действие фактора, потом всё остальное.", "Ожоги. По причине они бывают термические, химические, электрические и лучевые. По глубине — четыре степени: покраснение и боль; пузыри с прозрачным содержимым; поражение всей толщи кожи; обугливание с повреждением мышц и кости.", "Площадь оцениваю правилом девяток: голова и шея — девять процентов, каждая рука — девять, каждая нога — восемнадцать, передняя и задняя поверхность туловища — по восемнадцать, промежность — один. Небольшие участки удобнее считать правилом ладони: ладонь пострадавшего — примерно один процент его поверхности тела.", "Порядок помощи: прекратить действие тепла, снять с обожжённой зоны кольца и часы, охлаждать проточной прохладной водой пятнадцать–двадцать минут, наложить сухую чистую повязку, дать обезболивающее, если человек в сознании и препарат его собственный, обеспечить тёплое питьё при обширном ожоге.", "Чего делать нельзя, назову прямо: не отрывать прилипшую одежду, не вскрывать пузыри, не смазывать маслом, кремом, сметаной и мочой, не прикладывать лёд напрямую. Масло держит тепло в тканях и углубляет ожог.", "Обширный ожог опасен ожоговым шоком — это уже угроза жизни, здесь вызов скорой не обсуждается. Отдельно назову ожог дыхательных путей: копоть вокруг носа и рта, осипший голос, кашель. Такого человека везут в больницу даже при небольшой площади кожного ожога.", "Отморожения. Тоже четыре степени, но глубину в первые часы определить невозможно — это дореактивный период, когда всё выглядит легче, чем есть. Признаки: бледность, потеря чувствительности, чувство одеревенения.", "Помощь: убрать с холода, снять мокрое, наложить теплоизолирующую повязку, дать тёплое питьё, согревать организм изнутри и в целом. Растирать снегом и шерстью нельзя — травмируешь кожу и внесёшь инфекцию. Резко отогревать горячей водой и растирать спиртом тоже нельзя.", "Общее переохлаждение опаснее местного отморожения: при температуре тела ниже тридцати пяти градусов появляется сонливость и спутанность, а такого человека нельзя резко двигать и активно растирать — есть риск нарушения ритма сердца."], "terms": ["термический", "химический", "электрический и лучевой ожог", "четыре степени", "правило девяток и правило ладони", "ожоговый шок", "ожог дыхательных путей", "асептическая сухая повязка", "дореактивный и реактивный период отморожения", "теплоизолирующая повязка", "общее переохлаждение (гипотермия)", "согревание изнутри"], "follow": [{"q": "Химический ожог — что первым?", "a": "Смыть вещество большой струёй проточной воды не меньше пятнадцати–двадцати минут. Нейтрализовать кислоту щёлочью и наоборот нельзя: реакция даёт тепло и добавляет термический ожог. Исключение — негашёная известь, её сначала убирают сухой тканью."}, {"q": "Почему нельзя растирать отмороженную руку?", "a": "Кожа при отморожении хрупкая, растирание её повреждает и открывает ворота инфекции. Плюс холодная кровь из конечности резко уходит к сердцу, и это опасно."}], "notes": [], "block": "Первая помощь", "bk": "pp", "tier": 3, "psy": false, "aid": true, "core": "И при ожоге, и при отморожении первым делом прекращают действие фактора, а дальше работают вода нужной температуры и сухая чистая повязка. Мазать, растирать и вскрывать пузыри нельзя — этим углубляют поражение.", "anchors": ["прекратить фактор", "четыре степени", "девятки и ладонь", "охладить или утеплить", "чего не делать"], "simple": ["Логика общая для обоих состояний: сначала прекратить действие фактора — убрать тепло или увести с холода, потом всё остальное.", "Ожоги бывают термические, химические, электрические и лучевые; по глубине четыре степени: покраснение и боль — пузыри с прозрачным содержимым — поражение всей толщи кожи — обугливание с повреждением мышц и кости.", "Площадь считают правилом девяток: голова и шея 9%, рука 9%, нога 18%, передняя и задняя поверхность туловища по 18%, промежность 1%; мелкие участки — правилом ладони, ладонь пострадавшего примерно 1% его тела.", "Помощь при ожоге: охлаждать проточной прохладной водой пятнадцать–двадцать минут, наложить сухую чистую повязку, при обширном ожоге дать тёплое питьё; нельзя отрывать прилипшую одежду, вскрывать пузыри, мазать маслом или кремом, прикладывать лёд — масло держит тепло в тканях и углубляет ожог.", "Ожог дыхательных путей выдают копоть у носа и рта, осиплый голос, кашель после пожара — такого везут в больницу даже при малой площади кожного ожога; обширный ожог опасен ожоговым шоком.", "Отморожение коварно тем, что в первые часы выглядит легче, чем есть, — это дореактивный период: не растирать снегом и шерстью, не отогревать горячей водой, а наложить теплоизолирующую повязку и греть изнутри тёплым питьём; общее переохлаждение опаснее местного — человека с температурой тела ниже тридцати пяти нельзя резко двигать и растирать из-за риска аритмии."], "cards": [{"t": "четыре степени ожога", "d": "покраснение и боль; пузыри с прозрачным содержимым; поражение всей толщи кожи; обугливание с повреждением мышц и кости"}, {"t": "правило девяток и правило ладони", "d": "площадь ожога: голова и шея 9%, рука 9%, нога 18%, поверхность туловища 18%, промежность 1%; ладонь пострадавшего — около одного процента его тела"}, {"t": "ожоговый шок", "d": "угрожающее жизни состояние при обширном ожоге, при котором вызов скорой не обсуждается"}, {"t": "ожог дыхательных путей", "d": "копоть вокруг носа и рта, осиплый голос, кашель после пожара; госпитализация даже при малой площади кожного ожога"}, {"t": "дореактивный период", "d": "первые часы отморожения, когда глубину поражения определить невозможно и всё выглядит легче, чем есть"}, {"t": "теплоизолирующая повязка", "d": "многослойная повязка на отмороженный участок, которая даёт согреться постепенно и изнутри"}], "quiz": [{"q": "Чем охлаждать свежий термический ожог?", "ok": "Проточной прохладной водой пятнадцать–двадцать минут", "bad": ["Льдом, приложенным прямо на кожу", "Растительным маслом или жирным кремом", "Спиртовым раствором или водкой"], "why": "Вода уносит тепло и не травмирует. Лёд добавляет холодовое повреждение, жир держит тепло в тканях и углубляет ожог."}, {"q": "Как оценить площадь небольшого ожога?", "ok": "Ладонью пострадавшего: она примерно один процент площади его тела", "bad": ["Ладонью того, кто оказывает помощь", "Правилом девяток, оно точнее на малых участках", "По количеству пузырей на поверхности"], "why": "Ладонь именно пострадавшего, иначе процент поедет у ребёнка. Девятки — для крупных зон."}, {"q": "Что нельзя делать при отморожении кисти?", "ok": "Растирать снегом или шерстью и отогревать горячей водой", "bad": ["Наложить теплоизолирующую повязку", "Дать тёплое питьё", "Убрать человека с холода и снять мокрое"], "why": "Кожа при отморожении хрупкая, растирание её рвёт и открывает ворота инфекции, а резкое отогревание гонит холодную кровь к сердцу."}]}, {"n": 37, "title": "Первая помощь при отравлении угарным газом", "kostyak": ["Угарный газ — оксид углерода, вещество без цвета, вкуса и запаха. Именно поэтому человек не замечает отравления и часто теряет сознание раньше, чем понимает, что происходит.", "Механизм назову обязательно: угарный газ связывается с гемоглобином в сотни раз охотнее кислорода и образует карбоксигемоглобин. Кровь перестаёт переносить кислород, развивается гемическая гипоксия — крови много, а кислорода в ней нет.", "Типичные ситуации: пожар и задымление, неисправная печь или закрытая заслонка, работающий двигатель в гараже, газовая колонка при плохой тяге, мангал в закрытом помещении.", "Признаки по нарастанию: головная боль в висках и во лбу, шум в ушах, головокружение, тошнота, мышечная слабость — человек всё понимает, но не может встать и выйти. Дальше спутанность сознания, потеря сознания, судороги, остановка дыхания. Розовато-красный цвет кожи описывают как классический признак, но на практике он встречается не всегда.", "Первая помощь начинается с безопасности спасателя. Заходить в задымлённое помещение без защиты органов дыхания нельзя — так появляется второй пострадавший. Если возможно, вызываю профессионалов, открываю окна и двери, выключаю источник.", "Дальше: вынести пострадавшего на свежий воздух, расстегнуть одежду, обеспечить приток воздуха, вызвать скорую. Если человек без сознания, но дышит — устойчивое боковое положение и контроль дыхания. Если дыхания нет — сердечно-лёгочная реанимация.", "Настоящее лечение — кислород, поэтому скорая нужна в любом случае, даже если человек «пришёл в себя и говорит, что нормально». Отравление угарным газом даёт отсроченные неврологические осложнения через дни и недели.", "Полезная деталь, которая показывает, что человек в теме: пульсоксиметр при отравлении угарным газом показывает нормальные цифры, потому что не отличает карбоксигемоглобин от оксигемоглобина. Ориентироваться на него нельзя."], "terms": ["оксид углерода", "карбоксигемоглобин", "сродство к гемоглобину", "гемическая гипоксия", "безопасность спасателя", "вынос из очага", "свежий воздух и кислородотерапия", "отсроченные неврологические осложнения", "ложно нормальная сатурация на пульсоксиметре", "обязательная госпитализация"], "follow": [{"q": "Нашатырный спирт помогает?", "a": "Он может ненадолго привести в чувство, но отравление не лечит и в перечень мероприятий первой помощи не входит. Работает только вынос на воздух и кислород."}, {"q": "Почему при пожаре нужно двигаться пригнувшись?", "a": "Дым и горячие газы поднимаются вверх, у пола остаётся более пригодный для дыхания слой воздуха. Плюс дышать через влажную ткань."}], "notes": [], "block": "Первая помощь", "bk": "pp", "tier": 3, "psy": false, "aid": true, "core": "Угарный газ не виден и не пахнет, он связывается с гемоглобином вместо кислорода, и кровь перестаёт его переносить. Помощь одна — вынести на свежий воздух, но сначала не стать вторым пострадавшим; скорая нужна в любом случае.", "anchors": ["без цвета и запаха", "карбоксигемоглобин", "безопасность спасателя", "вынести и воздух", "госпитализация обязательна"], "simple": ["Угарный газ — оксид углерода, без цвета, вкуса и запаха, поэтому человек не замечает отравления и теряет сознание раньше, чем понимает, что происходит.", "Механизм: угарный газ связывается с гемоглобином в сотни раз охотнее кислорода и образует карбоксигемоглобин; крови много, а кислорода в ней нет — это гемическая гипоксия.", "Характерный признак — слабость при ясном сознании: человек всё понимает, но не может встать и выйти; розовато-красная кожа встречается не всегда.", "Помощь начинается с безопасности спасателя: в задымлённое помещение без защиты органов дыхания не заходят, иначе появляется второй пострадавший; по возможности открыть окна, выключить источник.", "Дальше вынести на свежий воздух, расстегнуть одежду, вызвать скорую; без сознания, но дышит — устойчивое боковое положение, нет дыхания — реанимация.", "Лечение — кислород, поэтому госпитализация обязательна даже при хорошем самочувствии: неврологические осложнения приходят через дни и недели. Пульсоксиметр при этом врёт — он не отличает карбоксигемоглобин от оксигемоглобина и показывает норму."], "cards": [{"t": "оксид углерода", "d": "угарный газ, вещество без цвета, вкуса и запаха, поэтому отравление не замечают"}, {"t": "карбоксигемоглобин", "d": "соединение угарного газа с гемоглобином, которое не переносит кислород"}, {"t": "гемическая гипоксия", "d": "кислородное голодание из-за того, что кровь потеряла способность переносить кислород"}, {"t": "безопасность спасателя", "d": "в задымлённое помещение без защиты органов дыхания не заходят, иначе появляется второй пострадавший"}, {"t": "ложно нормальная сатурация", "d": "пульсоксиметр при отравлении угарным газом показывает нормальные цифры и ориентироваться на него нельзя"}, {"t": "отсроченные осложнения", "d": "неврологические нарушения через дни и недели после отравления, поэтому госпитализация обязательна"}], "quiz": [{"q": "Почему при отравлении угарным газом развивается кислородное голодание?", "ok": "Угарный газ связывает гемоглобин и кровь перестаёт переносить кислород", "bad": ["Угарный газ разрушает ткань лёгких и мешает воздуху проходить", "Угарный газ вытесняет кислород из воздуха в помещении", "Угарный газ вызывает спазм дыхательных путей"], "why": "Проблема не в лёгких и не в воздухе, а в крови: гемоглобин занят карбоксигемоглобином. Отсюда и название — гемическая гипоксия."}, {"q": "Пострадавший вынесен на воздух, пришёл в себя и отказывается от скорой. Как правильно?", "ok": "Настоять на вызове скорой: нужен кислород, а осложнения бывают отсроченными", "bad": ["Отпустить домой, раз самочувствие восстановилось", "Дать нашатырный спирт и наблюдать час", "Дать крепкий сладкий чай и отпустить с сопровождающим"], "why": "Самочувствие ничего не говорит о полученной дозе, а неврологические осложнения приходят через дни. Нашатырь отравление не лечит."}, {"q": "Можно ли ориентироваться на пульсоксиметр при отравлении угарным газом?", "ok": "Нет, он не отличает карбоксигемоглобин от оксигемоглобина и показывает норму", "bad": ["Да, он точно отражает тяжесть отравления", "Да, но только в первые тридцать минут", "Да, если измерять на мочке уха, а не на пальце"], "why": "Прибор считает «занятый» гемоглобин нормальным. Нормальная цифра при отравлении угарным газом ничего не значит."}]}, {"n": 38, "title": "Первая помощь при пищевых отравлениях", "kostyak": ["Разделю понятия. Пищевая токсикоинфекция — отравление пищей, в которой размножились микробы и накопились их токсины. Отдельно стоят отравления ядовитыми грибами и растениями и отравления химическими веществами, попавшими в еду.", "Для школы это тема столовой, продлёнки, походов и «принёс из дома в жару». Классические причины — нарушение условий хранения, кремовые изделия, салаты с майонезом, яйца и молочное, немытые овощи.", "Признаки появляются через несколько часов после еды: тошнота, повторная рвота, боль в животе, понос, слабость, температура. Опасность — не сами симптомы, а обезвоживание, особенно у детей.", "Тревожные признаки, при которых скорая обязательна: многократная рвота, кровь в стуле, температура выше тридцати восьми с половиной, сухой язык и отсутствие мочи, спутанность сознания, отравление у ребёнка или пожилого, групповое заболевание в организации.", "Помощь взрослому в сознании: промывание желудка «ресторанным методом» — выпить несколько стаканов воды комнатной температуры и вызвать рвоту, повторить до чистых вод. Затем энтеросорбент и обязательно дробное выпаивание — регидратационный раствор или вода мелкими глотками часто.", "Чего не делаю: не вызываю рвоту у человека без сознания, у маленького ребёнка, при отравлении кислотой, щёлочью или нефтепродуктами. Не даю противодиарейные и обезболивающие — они смазывают картину, а при аппендиците или кишечной инфекции это опасно.", "Отдельно назову ботулизм, потому что он смертелен и выглядит иначе: домашние консервы, грибы, вяленая рыба, а признаки не кишечные, а неврологические — двоение в глазах, опущенное веко, сухость во рту, трудности с глотанием и речью. Здесь счёт на часы, нужна противоботулиническая сыворотка.", "Для образовательной организации добавлю профессиональный момент: при групповом отравлении сохраняют остатки пищи и суточные пробы, изолируют заболевших, сообщают руководителю и в Роспотребнадзор. Это уже противоэпидемические действия, но педагог должен знать порядок."], "terms": ["пищевая токсикоинфекция", "бактериальный токсин", "инкубационный период", "обезвоживание (дегидратация)", "промывание желудка «ресторанным методом»", "энтеросорбент", "оральная регидратация", "ботулизм и его неврологические признаки", "суточная проба", "групповая заболеваемость и уведомление Роспотребнадзора"], "follow": [{"q": "Марганцовкой промывать желудок можно?", "a": "Не рекомендуется: нерастворённые кристаллы дают химический ожог слизистой. Чистой воды достаточно."}, {"q": "Отравление грибами — что особенного?", "a": "Скрытый период при бледной поганке доходит до суток, за это время самочувствие может улучшиться, и человек расслабляется. Поэтому при любом подозрении на грибы — скорая сразу, независимо от того, как он себя чувствует."}], "notes": [], "block": "Первая помощь", "bk": "pp", "tier": 3, "psy": false, "aid": true, "core": "Пищевая токсикоинфекция — отравление пищей, в которой размножились микробы и накопились их токсины; убивает не рвота, а обезвоживание. Взрослому в сознании промывают желудок, дают сорбент и дробно выпаивают, а противодиарейные и обезболивающие не дают.", "anchors": ["токсикоинфекция", "обезвоживание", "промыть", "сорбент", "выпаивать", "тревожные признаки", "ботулизм отдельно"], "simple": ["Пищевая токсикоинфекция — это микробы и их токсины в еде, чаще всего из-за нарушения хранения: кремовые изделия, салаты с майонезом, яйца, молочное, немытые овощи, «принёс из дома в жару».", "Признаки появляются через несколько часов после еды: тошнота, повторная рвота, боль в животе, понос, слабость, температура; главная опасность — обезвоживание, особенно у детей.", "Тревожные признаки, при которых скорая обязательна: многократная рвота, кровь в стуле, температура выше тридцати восьми с половиной, сухой язык и отсутствие мочи, спутанность, ребёнок или пожилой, групповое заболевание.", "Помощь взрослому в сознании: промывание желудка «ресторанным методом» — выпить несколько стаканов воды комнатной температуры и вызвать рвоту, повторять до чистых вод; затем энтеросорбент и дробное выпаивание регидратационным раствором или водой мелкими глотками часто, а не стакан залпом.", "Нельзя вызывать рвоту у человека без сознания, у маленького ребёнка, при отравлении кислотой, щёлочью, нефтепродуктами; не давать противодиарейные и обезболивающие — они смазывают картину, а под ними может быть аппендицит.", "Ботулизм ведёт себя иначе — домашние консервы, грибы, вяленая рыба, а признаки неврологические: двоение в глазах, опущенное веко, сухость во рту, трудности с глотанием и речью; счёт на часы, нужна сыворотка. При групповом отравлении в школе сохраняют остатки пищи и суточные пробы, изолируют заболевших, сообщают руководителю и в Роспотребнадзор."], "cards": [{"t": "пищевая токсикоинфекция", "d": "отравление пищей, в которой размножились микробы и накопились их токсины"}, {"t": "обезвоживание (дегидратация)", "d": "главная опасность пищевого отравления, особенно у детей: сухой язык, отсутствие мочи, слабость"}, {"t": "промывание «ресторанным методом»", "d": "выпить несколько стаканов воды комнатной температуры и вызвать рвоту, повторять до чистых промывных вод"}, {"t": "оральная регидратация", "d": "дробное выпаивание регидратационным раствором или водой мелкими глотками часто"}, {"t": "энтеросорбент", "d": "препарат, связывающий токсины в кишечнике, даётся после промывания желудка"}, {"t": "ботулизм", "d": "тяжёлое отравление из домашних консервов, грибов, вяленой рыбы с неврологическими признаками: двоение, опущенное веко, сухость во рту, нарушение глотания и речи"}], "quiz": [{"q": "Чем опасно пищевое отравление у ребёнка в первую очередь?", "ok": "Обезвоживанием из-за повторной рвоты и поноса", "bad": ["Самой рвотой, которая травмирует пищевод", "Высокой температурой, которая держится несколько дней", "Болью в животе, вызывающей шок"], "why": "Ребёнок теряет воду быстрее взрослого, и именно потеря жидкости даёт тяжесть. Поэтому дробное выпаивание — обязательная часть помощи."}, {"q": "Что не дают при пищевом отравлении?", "ok": "Противодиарейные и обезболивающие препараты", "bad": ["Энтеросорбент", "Регидратационный раствор мелкими глотками", "Чистую воду комнатной температуры"], "why": "Они смазывают картину: под симптомами может скрываться аппендицит или кишечная инфекция, а боль — единственный ориентир для врача."}, {"q": "Какие признаки заставляют думать о ботулизме?", "ok": "Двоение в глазах, опущенное веко, сухость во рту, трудности с глотанием и речью", "bad": ["Многократный жидкий стул с температурой", "Сыпь по всему телу и зуд", "Резкая боль в правом боку и рвота"], "why": "Ботулизм бьёт по нервной системе, а не по кишечнику. Ждать «обычных» кишечных признаков здесь — потерять часы."}, {"q": "Групповое отравление в школьной столовой. Что делает работник организации?", "ok": "Сохраняет остатки пищи и суточные пробы, изолирует заболевших, сообщает руководителю и в Роспотребнадзор", "bad": ["Выбрасывает подозрительную еду, чтобы не отравился кто-то ещё", "Разбирается своими силами и сообщает только родителям", "Ждёт результатов анализов, прежде чем кого-то извещать"], "why": "Остатки пищи и суточные пробы — материал для поиска причины, выбросить их значит уничтожить доказательства. Извещение обязательно сразу."}]}, {"n": 39, "title": "Синдром длительного раздавливания. Укусы змей и ядовитых насекомых", "kostyak": ["Синдром длительного сдавления, он же краш-синдром, развивается когда часть тела была придавлена несколько часов, а потом её освободили. Возникает при обрушениях зданий, землетрясениях, ДТП, завалах.", "Механизм в двух фразах: в сдавленных мышцах нарушается кровоток и накапливаются продукты распада — миоглобин, калий, кислые продукты. Когда конечность освобождают, всё это разом уходит в общий кровоток. Развивается токсемия, миоглобин забивает почечные канальцы, начинается острая почечная недостаточность. Отсюда парадокс: пока человек придавлен, он может быть в сознании и разговаривать, а погибает после освобождения.", "Формы по тяжести определяются временем сдавления и объёмом тканей: лёгкая — примерно до четырёх часов, средней тяжести — четыре–шесть, тяжёлая — шесть–восемь, крайне тяжёлая — свыше восьми часов или сдавление обеих конечностей. В течении выделяют три периода: ранний, промежуточный с почечной недостаточностью, поздний.", "Первая помощь до освобождения: вызвать спасателей и скорую, обеспечить доступ воздуха, дать обильное щелочное питьё, если человек в сознании и нет травмы живота, согреть, поддерживать контакт разговором.", "Здесь важно честно оговорить спорный момент. Классические учебники требуют наложить жгут выше места сдавления до освобождения конечности. Современные рекомендации от этого отходят: жгут накладывают, только если есть артериальное кровотечение или конечность явно нежизнеспособна. В остальных случаях сразу после освобождения делают тугое бинтование от периферии к центру, охлаждают конечность, обездвиживают её как при переломе. Я бы на экзамене назвал оба подхода и сказал, что общее правило простое: снимать сдавление лучше в присутствии медиков, потому что человеку в этот момент нужна инфузионная терапия.", "Укусы змей. В России опасны гадюки. Признаки: две точечные ранки, быстро нарастающий отёк, боль, багровые пятна, слабость, тошнота.", "Помощь: покой и полная неподвижность, укушенную конечность обездвижить как при переломе и держать ниже уровня сердца, снять кольца и часы до отёка, наложить нетугую повязку, дать обильное питьё, срочно везти в больницу — там сыворотка.", "Чего не делать, назову списком, потому что тут все ошибаются: не разрезать ранку, не прижигать, не накладывать жгут, не давать алкоголь. Отсасывание яда ртом официально не рекомендуется — эффективность сомнительна, а риск для спасателя реален.", "Укусы насекомых. Одиночный укус пчелы или осы — вынуть жало скользящим движением, приложить холод, наблюдать. Главная опасность не яд, а анафилактическая реакция: отёк лица и языка, осиплость, затруднённое дыхание, сыпь, падение давления. Если у человека есть автоинъектор с адреналином — помочь его применить, это входит в помощь при приёме собственных препаратов. Дальше — скорая. Укусы в язык и шею опасны отёком независимо от аллергии."], "terms": ["синдром длительного сдавления (краш-синдром)", "ишемия и токсемия", "миоглобин", "острая почечная недостаточность", "периоды течения", "тугое бинтование от периферии", "транспортная иммобилизация", "антитоксическая противозмеиная сыворотка", "анафилактический шок", "автоинъектор с адреналином"], "follow": [{"q": "Почему при краш-синдроме нельзя резко освобождать конечность?", "a": "Потому что залповый выброс калия и миоглобина в кровь может дать остановку сердца и почечную недостаточность. Освобождение лучше синхронизировать с началом инфузии, а это уже медицинская помощь."}, {"q": "Как отличить укус гадюки от ужа?", "a": "У гадюки — две точки от ядовитых зубов и быстрый отёк. Уж оставляет ряд мелких царапин, отёка и общей реакции не даёт. Но на глаз определять змею не стоит: везти к врачу нужно в любом случае."}], "notes": [], "block": "Первая помощь", "bk": "pp", "tier": 3, "psy": false, "aid": true, "core": "При краш-синдроме человек погибает не под завалом, а после освобождения: продукты распада мышц разом уходят в кровь и бьют по почкам и сердцу. При укусе змеи главное — покой и быстрая доставка в больницу за сывороткой, а не разрезы, прижигания и жгут.", "anchors": ["сдавление и освобождение", "миоглобин и почки", "освобождать с медиками", "покой и ниже сердца", "анафилаксия важнее яда"], "simple": ["Синдром длительного сдавления (краш-синдром) развивается, когда часть тела была придавлена несколько часов, а потом её освободили: в сдавленных мышцах копятся миоглобин, калий, кислые продукты, и при освобождении всё это залпом уходит в кровь — начинается токсемия, миоглобин забивает почечные канальцы, развивается острая почечная недостаточность.", "Отсюда парадокс: под плитой человек в сознании и разговаривает, а погибает после того, как его вытащили.", "Тяжесть считают по времени и объёму тканей: до четырёх часов — лёгкая, четыре–шесть — средняя, шесть–восемь — тяжёлая, свыше восьми или обе конечности — крайне тяжёлая; течение делят на три периода: ранний, промежуточный с почечной недостаточностью, поздний.", "До освобождения: вызвать спасателей и скорую, дать доступ воздуха, обильное щелочное питьё, если человек в сознании и нет травмы живота, согреть и поддерживать контакт разговором — это уже психологическая поддержка из перечня; освобождать лучше при медиках, потому что нужна инфузионная терапия.", "Укус гадюки — две точечные ранки и быстро нарастающий отёк; помощь: покой и полная неподвижность, обездвижить конечность как при переломе и держать ниже уровня сердца, снять кольца и часы до отёка, обильное питьё, срочно в больницу за сывороткой; нельзя разрезать ранку, прижигать, накладывать жгут, давать алкоголь, отсасывание яда ртом официально не рекомендуется.", "При укусе пчелы или осы опаснее не яд, а анафилактическая реакция: отёк лица и языка, осиплость, удушье, сыпь, падение давления; если есть автоинъектор с адреналином — помочь применить, это входит в мероприятия первой помощи; укус в язык или шею опасен отёком сам по себе, даже без аллергии."], "cards": [{"t": "синдром длительного сдавления", "d": "краш-синдром: состояние после освобождения части тела, придавленной несколько часов"}, {"t": "миоглобин", "d": "белок из разрушенных мышц, который забивает почечные канальцы и вызывает острую почечную недостаточность"}, {"t": "жгут при краш-синдроме — спорное место", "d": "классические пособия требуют наложить жгут выше сдавления до освобождения, современные рекомендации — жгут только при артериальном кровотечении или явно нежизнеспособной конечности, в остальных случаях тугое бинтование от периферии, холод, иммобилизация"}, {"t": "отсасывание яда — спорное место", "d": "традиционно описывается как приём первой помощи, официально не рекомендуется: эффективность сомнительна, а риск для спасателя реален"}, {"t": "анафилактический шок", "d": "стремительная аллергическая реакция на укус: отёк лица и языка, осиплость, удушье, сыпь, падение давления"}, {"t": "автоинъектор с адреналином", "d": "собственное средство аллергика, помощь в его применении входит в мероприятия первой помощи"}], "quiz": [{"q": "Почему при краш-синдроме опасен именно момент освобождения конечности?", "ok": "Продукты распада мышц залпом попадают в кровоток и бьют по сердцу и почкам", "bad": ["Резко возобновляется кровотечение из повреждённых сосудов", "Конечность немедленно теряет чувствительность", "Возникает сильная боль, приводящая к остановке дыхания"], "why": "Пока сдавление держится, токсины заперты в конечности. Освобождение открывает шлюз, поэтому его лучше проводить при медиках с готовой инфузией."}, {"q": "Как определяют тяжесть краш-синдрома?", "ok": "По времени сдавления и объёму сдавленных тканей", "bad": ["По силе боли, которую испытывает пострадавший", "По цвету кожи освобождённой конечности", "По уровню сознания пострадавшего под завалом"], "why": "Человек под завалом может быть в ясном сознании и при этом иметь крайне тяжёлую форму. Считают часы и массу тканей."}, {"q": "Укус гадюки. Что из перечисленного делать нельзя?", "ok": "Разрезать ранку, прижигать её и накладывать жгут", "bad": ["Обездвижить конечность как при переломе", "Держать укушенную конечность ниже уровня сердца", "Снять кольца и часы и дать обильное питьё"], "why": "Разрезы и прижигания добавляют повреждение и инфекцию, жгут ухудшает кровоток в отравленной конечности. Работают покой, иммобилизация и скорая доставка к сыворотке."}, {"q": "Ребёнка ужалила оса, через несколько минут отекло лицо, осип голос, стало трудно дышать. Что это?", "ok": "Анафилактическая реакция, нужна скорая и помощь с автоинъектором, если он есть", "bad": ["Обычная местная реакция на яд, достаточно холода", "Ожог кожи от яда, нужна повязка", "Тепловой удар от нахождения на солнце"], "why": "Быстрый отёк лица и осиплость — признаки общей аллергической реакции, а не местной. Здесь опасен не яд, а сама реакция."}]}, {"n": 40, "title": "Первая помощь при утоплении и электротравме", "kostyak": ["Оба состояния объединяет одно: спасатель легко становится вторым пострадавшим. Поэтому начинаю с оценки обстановки, и это не формальность.", "Утопление. Различают три вида. Истинное, «синее» — вода попадает в лёгкие, кожа синюшная, изо рта пена. Асфиксическое, «сухое» — от спазма голосовой щели вода в лёгкие почти не проходит. Синкопальное — рефлекторная остановка сердца от холода или испуга, кожа бледная.", "Извлекать человека из воды без подготовки опасно. Сначала протягиваю предмет, бросаю плавучее, использую лодку. Вплавь — только если умеешь и подплываешь сзади.", "На берегу: проверяю сознание и дыхание. Время на «выливание воды» через колено тратить не нужно — это устаревший приём, и он отнимает минуты, которые решают.", "Особенность реанимации при утоплении назову обязательно: здесь причина остановки сердца — нехватка кислорода, поэтому начинают с пяти искусственных вдохов и только потом переходят к циклу тридцать на два.", "Дальше — согреть, снять мокрую одежду, укрыть. Даже если человек пришёл в себя, госпитализация нужна: через несколько часов возможен отёк лёгких. И помню про травму шейного отдела, если он нырял.", "Электротравма. Первым делом обесточить: выключить рубильник, вынуть вилку, отбросить провод сухим деревянным предметом. Голыми руками пострадавшего не трогать.", "При обрыве провода на улице работает шаговое напряжение — потенциал растекается по земле, и шаг между зонами разного напряжения даёт ток через тело. Выходить из опасной зоны нужно «гусиным шагом», не отрывая ступни друг от друга, и не бежать.", "У пострадавшего ищу метки тока — знаки входа и выхода, участки ожога. Ток вызывает фибрилляцию желудочков, поэтому основное мероприятие — сердечно-лёгочная реанимация и дефибриллятор, если он есть. Реанимировать при электротравме нужно долго и упорно, шансы здесь выше обычного.", "Даже при хорошем самочувствии человек после удара током едет в больницу: нарушения ритма появляются отсроченно."], "terms": ["истинное", "асфиксическое и синкопальное утопление", "аспирация воды", "отёк лёгких как отсроченное осложнение", "начинать с пяти искусственных вдохов", "травма шейного отдела при нырянии", "шаговое напряжение", "«гусиный шаг»", "метки тока", "фибрилляция желудочков", "обязательная госпитализация при электротравме"], "follow": [{"q": "Как долго реанимировать утонувшего в холодной воде?", "a": "Долго. Холод замедляет обмен и защищает мозг, известны случаи выживания после длительной остановки. Правило звучит так: пострадавший не считается погибшим, пока он не согрет."}, {"q": "Радиус опасной зоны при обрыве провода?", "a": "Ориентируются на восемь–десять метров, а при высоком напряжении — больше. Точную цифру лучше не называть: сказать «не менее восьми метров, уходить гусиным шагом» безопаснее."}], "notes": [], "block": "Первая помощь", "bk": "pp", "tier": 3, "psy": false, "aid": true, "core": "И в воде, и под током спасатель легко становится вторым пострадавшим, поэтому всё начинается с безопасности: сначала обесточить или подать предмет, потом помогать. При утоплении реанимацию начинают с пяти вдохов, потому что причина остановки сердца — нехватка кислорода.", "anchors": ["безопасность спасателя", "три вида утопления", "пять вдохов", "потом 30:2", "обесточить и гусиный шаг", "госпитализация обязательна"], "simple": ["Три вида утопления: истинное «синее» — вода в лёгких, синюшность и пена; асфиксическое «сухое» — спазм голосовой щели, вода почти не проходит; синкопальное — рефлекторная остановка сердца от холода или испуга, кожа бледная.", "Извлекать из воды без подготовки опасно: сначала протянуть предмет, бросить плавучее, использовать лодку; вплавь — только если умеешь и подплываешь сзади.", "На берегу проверяют сознание и дыхание; воду через колено не выливают — это устаревший приём, отнимающий минуты.", "Особенность реанимации при утоплении: начинают с пяти искусственных вдохов и только потом переходят к циклу тридцать на два; дальше согреть, снять мокрое, укрыть; госпитализация обязательна — через несколько часов возможен отёк лёгких, и помнить про травму шеи, если человек нырял.", "Электротравма начинается с обесточивания: выключить рубильник, вынуть вилку, отбросить провод сухим деревянным предметом, голыми руками пострадавшего не трогать.", "При обрыве провода работает шаговое напряжение — потенциал растекается по земле, разница между ступнями гонит ток через тело, поэтому уходят «гусиным шагом», не отрывая ступни друг от друга, и не бегут; ток вызывает фибрилляцию желудочков, значит главное мероприятие — СЛР и дефибриллятор, реанимируют долго и упорно, госпитализация обязательна даже при хорошем самочувствии."], "cards": [{"t": "три вида утопления", "d": "истинное «синее» — вода в лёгких, синюшность и пена; асфиксическое «сухое» — спазм голосовой щели; синкопальное — рефлекторная остановка сердца, кожа бледная"}, {"t": "пять искусственных вдохов", "d": "при утоплении реанимацию начинают с пяти вдохов, потому что причина остановки — нехватка кислорода, затем переходят на 30:2"}, {"t": "отёк лёгких как отсроченное осложнение", "d": "может развиться через несколько часов после спасения, поэтому госпитализация нужна даже при хорошем самочувствии"}, {"t": "шаговое напряжение", "d": "разность потенциалов между ступнями рядом с оборванным проводом, из зоны выходят «гусиным шагом», не отрывая ступни друг от друга"}, {"t": "метки тока", "d": "участки ожога в местах входа и выхода тока на теле пострадавшего"}, {"t": "фибрилляция желудочков", "d": "хаотичное сокращение сердца при электротравме, при котором нужны СЛР и дефибриллятор"}], "quiz": [{"q": "С чего начинают реанимацию утонувшего?", "ok": "С пяти искусственных вдохов, затем переходят к циклу 30:2", "bad": ["С тридцати компрессий, как в обычной СЛР", "С удаления воды из лёгких через колено", "С растирания и согревания пострадавшего"], "why": "Остановка при утоплении вызвана нехваткой кислорода, поэтому первым делом дают воздух. Выливание воды — устаревший приём, который отнимает минуты."}, {"q": "Человека ударило током, он лежит рядом с оборванным проводом. Первое действие?", "ok": "Обесточить: выключить рубильник, вынуть вилку или отбросить провод сухим деревянным предметом", "bad": ["Оттащить пострадавшего за одежду руками", "Сразу начать компрессии грудной клетки", "Проверить пульс на сонной артерии"], "why": "Пока цепь не разорвана, ток пойдёт и через спасателя. Помощь начинается только после обесточивания."}, {"q": "Как выходить из зоны шагового напряжения?", "ok": "«Гусиным шагом», не отрывая ступни друг от друга, не бегом", "bad": ["Быстрым бегом широкими шагами", "Прыжками на двух ногах", "Обычным шагом, глядя под ноги"], "why": "Ток идёт из-за разницы потенциалов между ступнями, поэтому ступни держат вместе. Широкий шаг и бег как раз создают эту разницу."}, {"q": "Пострадавший после удара током чувствует себя хорошо. Нужна ли больница?", "ok": "Да, нарушения ритма сердца появляются отсроченно", "bad": ["Нет, если нет ожогов и человек в сознании", "Нет, достаточно наблюдения в течение часа", "Да, но только при наличии видимых меток тока"], "why": "Ток бьёт по проводящей системе сердца, и аритмия может проявиться позже. Метки тока и самочувствие тяжесть не отражают."}]}, {"n": 44, "title": "Первая помощь при радиационной аварии и поражении АХОВ", "kostyak": ["Сразу оговорю термин: «диагностика» на уровне первой помощи означает распознавание признаков поражения и понимание, что человеку угрожает. Диагноз ставит врач, а лучевую болезнь подтверждают дозиметрией и анализом крови.", "Радиационная авария. Поражающие факторы: внешнее облучение, попадание радиоактивных веществ внутрь с воздухом, водой и пищей, загрязнение кожи и одежды.", "Признаки первичной реакции на облучение: тошнота, рвота, слабость, головная боль, покраснение кожи и слизистых, повышение температуры. Практический ориентир — время до начала рвоты: чем раньше она началась, тем больше полученная доза. Дальше идёт скрытый период мнимого благополучия, и это опасно тем, что человек считает себя здоровым.", "Помощь в очаге: надеть средства защиты органов дыхания и кожи, вывести или вынести человека из зоны по направлению, указанному службами, снять загрязнённую одежду, провести частичную санитарную обработку — обмыть открытые участки, промыть глаза и рот.", "Про йодную профилактику скажу аккуратно: препараты стабильного йода принимают только по решению органов власти и только при выбросе радиоактивного йода, эффект максимален до контакта или в первые часы. Самостоятельно пить йод «на всякий случай» вредно.", "Противорвотные, радиопротекторы и всё остальное — уже медицинская помощь, к первой помощи это не относится.", "Аварийно химически опасные вещества. По действию их делят на удушающие, общеядовитые, нейротропные, раздражающие, а также вещества с кожно-нарывным действием.", "Практическая вещь, которую нужно назвать: хлор тяжелее воздуха и скапливается внизу, в подвалах и низинах — уходить надо на верхние этажи. Аммиак легче воздуха — уходить вниз. Хлор пахнет отбеливателем, вызывает резь в глазах и кашель; аммиак резко пахнет нашатырём, вызывает слезотечение и удушье.", "Порядок помощи одинаковый: защитить себя, вывести пострадавшего из зоны перпендикулярно направлению ветра, снять заражённую одежду, обильно промыть глаза и кожу водой, обеспечить покой и тепло, вызвать помощь.", "Отдельно подчеркну самое важное: при отравлении удушающими веществами возможен токсический отёк лёгких со скрытым периодом в несколько часов. Такого человека нельзя заставлять идти и напрягаться — только покой и транспортировка в положении лёжа или полусидя. Физическая нагрузка после отравления хлором может убить.", "Антидоты в первую помощь не входят, их вводит медицинский персонал."], "terms": ["распознавание признаков", "а не постановка диагноза", "первичная реакция на облучение", "время до начала рвоты как ориентир тяжести", "скрытый период мнимого благополучия", "частичная санитарная обработка", "йодная профилактика по решению органов власти", "аварийно химически опасное вещество", "удушающие и общеядовитые вещества", "токсический отёк лёгких", "выход из зоны перпендикулярно ветру"], "follow": [{"q": "Какая повязка при выходе из зоны заражения?", "a": "Влажная ватно-марлевая: при хлоре её смачивают слабым раствором питьевой соды, при аммиаке — слабым раствором лимонной или уксусной кислоты. Это временная мера, полноценную защиту даёт только противогаз."}, {"q": "Чем опасно облучение для педагога-организатора эвакуации?", "a": "Тем, что решения приходится принимать в условиях паники. Здесь работает информирование и чёткая короткая команда — люди в состоянии острой стрессовой реакции не воспринимают длинные объяснения."}], "notes": [], "block": "Первая помощь", "bk": "pp", "tier": 3, "psy": false, "aid": true, "core": "И при радиационной аварии, и при выбросе химии первая помощь одна: защитить себя, вывести человека из зоны, снять заражённую одежду и обмыть. Признаки распознают, а диагноз, антидоты и препараты — уже медицинская помощь.", "anchors": ["защита спасателя", "вывод из зоны", "снять одежду и обмыть", "хлор вниз", "аммиак вверх", "скрытый период"], "simple": ["Распознавание здесь означает узнать признак поражения и понять, чем он грозит; лучевую болезнь подтверждают дозиметрией и анализом крови, и это работа врача.", "Первичная реакция на облучение похожа на отравление: тошнота, рвота, слабость, головная боль, покраснение кожи, температура; практический ориентир — чем раньше началась рвота, тем больше доза. Потом наступает скрытый период мнимого благополучия, когда человек чувствует себя здоровым, а процесс идёт.", "Помощь в очаге радиационной аварии: надеть средства защиты органов дыхания и кожи, вывести человека из зоны по указанному службами направлению, снять загрязнённую одежду, провести частичную санитарную обработку — обмыть открытые участки, промыть глаза и рот; препараты стабильного йода принимают только по решению органов власти и только при выбросе радиоактивного йода, самостоятельно пить йод «на всякий случай» вредно.", "Аварийно химически опасные вещества по действию делят на удушающие, общеядовитые, нейротропные, раздражающие и кожно-нарывные.", "Хлор тяжелее воздуха и скапливается внизу, в подвалах и низинах — уходить наверх; аммиак легче воздуха — уходить вниз; хлор пахнет отбеливателем, аммиак — нашатырём. Из зоны выходят перпендикулярно направлению ветра.", "Порядок помощи при АХОВ: защитить себя, вывести пострадавшего из зоны, снять заражённую одежду, обильно промыть глаза и кожу водой, покой и тепло, вызвать помощь; при отравлении удушающими возможен токсический отёк лёгких со скрытым периодом в несколько часов — такого человека нельзя заставлять идти и напрягаться, только покой и транспортировка лёжа или полусидя. Антидоты в первую помощь не входят."], "cards": [{"t": "первичная реакция на облучение", "d": "тошнота, рвота, слабость, головная боль, покраснение кожи; чем раньше началась рвота, тем больше доза"}, {"t": "скрытый период мнимого благополучия", "d": "промежуток, когда пострадавший чувствует себя здоровым, а поражение продолжает развиваться"}, {"t": "частичная санитарная обработка", "d": "снять загрязнённую одежду, обмыть открытые участки кожи, промыть глаза и рот"}, {"t": "йодная профилактика", "d": "приём препаратов стабильного йода только по решению органов власти и только при выбросе радиоактивного йода"}, {"t": "АХОВ", "d": "аварийно химически опасное вещество; по действию делят на удушающие, общеядовитые, нейротропные, раздражающие и кожно-нарывные"}, {"t": "токсический отёк лёгких", "d": "осложнение отравления удушающими веществами со скрытым периодом в несколько часов, поэтому нужен полный покой"}], "quiz": [{"q": "Произошёл выброс хлора. Куда уходить?", "ok": "На верхние этажи, потому что хлор тяжелее воздуха и скапливается внизу", "bad": ["В подвал, там воздух чище", "В низину подальше от здания", "На первый этаж ближе к выходу"], "why": "Хлор стелется по низу и заполняет подвалы и низины. С аммиаком правило обратное: он легче воздуха, и уходят вниз."}, {"q": "Человек отравился удушающим веществом, но идти может. Как его транспортировать?", "ok": "Только в покое, лёжа или полусидя, не давая напрягаться", "bad": ["Пусть идёт сам, так быстрее выйдет из зоны", "Быстрым бегом, чтобы сократить время в зоне", "Пешком с остановками на отдых"], "why": "Физическая нагрузка после отравления удушающими провоцирует токсический отёк лёгких, который развивается через часы. Хорошее самочувствие обманчиво."}, {"q": "Когда принимают препараты стабильного йода?", "ok": "Только по решению органов власти и только при выбросе радиоактивного йода", "bad": ["Заранее и регулярно, если живёшь рядом с АЭС", "При любой радиационной аварии сразу", "После появления первых признаков лучевого поражения"], "why": "Йод защищает щитовидную железу только от радиоактивного йода и только вовремя. Самостоятельный приём «на всякий случай» вредит."}, {"q": "Как выходить из зоны химического заражения?", "ok": "Перпендикулярно направлению ветра", "bad": ["Строго по ветру, чтобы облако не догнало", "Строго против ветра", "В любую сторону, лишь бы быстрее"], "why": "Перпендикулярный ход быстрее всего выводит из полосы облака. По ветру идёшь вместе с ним, против — навстречу источнику."}]}, {"n": 45, "title": "Первая помощь при катастрофах на пожаро- и взрывоопасных объектах", "kostyak": ["Особенность таких катастроф — комбинированные поражения. У одного человека сразу и ожоги, и механическая травма, и отравление продуктами горения, и баротравма от ударной волны. Поэтому осматривать нужно целиком, а не только то, что видно.", "Поражающие факторы назову по порядку: ударная волна, тепловое излучение и пламя, осколки и обломки конструкций, продукты горения, обрушение и последующее сдавление людей.", "Распознавание, что здесь ищем. Ожоги — оцениваю площадь правилом девяток и правилом ладони, глубину по степеням. Ожог дыхательных путей — копоть вокруг носа и рта, опалённые волосы в носу, осиплый голос, кашель, одышка. Отравление угарным газом — головная боль, спутанность, слабость.", "Взрывная травма: разрывы барабанных перепонок, кровь из уха, оглушённость, звон в ушах — характерный признак действия ударной волны. Баротравма лёгких — кровохарканье, одышка, боль в груди. Возможны внутренние повреждения при полном отсутствии наружных ран, это самое коварное.", "Порядок действий: сначала собственная безопасность и оценка угрозы повторного взрыва или обрушения, потом эвакуация из зоны, потом помощь. В зоне продолжающегося горения помощь не оказывают.", "По приоритетам: остановить наружное кровотечение, обеспечить проходимость дыхательных путей, при остановке дыхания — реанимация, затем ожоги и травмы, потом положение тела и согревание.", "Про ожоги повторю коротко: прекратить действие пламени, охладить водой пятнадцать–двадцать минут, сухая чистая повязка, тёплое питьё при обширном ожоге, не отрывать прилипшее, ничем не мазать.", "При большом числе пострадавших врачи применяют медицинскую сортировку — распределение по очерёдности помощи и эвакуации. Оговорю честно: сортировка относится к медицинской помощи, человек без медицинского образования её не проводит. Но принцип полезен: сначала подходят к тем, кто молчит, а не к тем, кто громче кричит.", "Придавленных обломками освобождают только со спасателями, потому что при длительном сдавлении развивается краш-синдром."], "terms": ["комбинированное поражение", "ударная волна", "баротравма лёгких и разрыв барабанных перепонок", "продукты горения", "ожог дыхательных путей", "правило девяток и правило ладони", "ожоговый шок", "медицинская сортировка как этап медицинской помощи", "безопасность спасателя и угроза повторного взрыва", "синдром длительного сдавления при разборе завала"], "follow": [{"q": "Почему пострадавший с ожогом дыхательных путей опаснее, чем выглядит?", "a": "Отёк гортани нарастает в течение часов и может полностью перекрыть дыхание. Внешне человек может выглядеть неплохо, поэтому его госпитализируют по факту признаков, не дожидаясь ухудшения."}, {"q": "Что первое при эвакуации из школы при пожаре?", "a": "Оповестить и вывести детей по плану эвакуации, пересчитать по списку, доложить о пропавших, встретить пожарных и передать информацию. Помощь пострадавшим оказывается уже за пределами опасной зоны."}], "notes": [], "block": "Первая помощь", "bk": "pp", "tier": 3, "psy": false, "aid": true, "core": "На пожаро- и взрывоопасном объекте поражения комбинированные: у одного человека сразу ожог, травма, отравление продуктами горения и баротравма, поэтому осматривают целиком. Помощь оказывают только после вывода из зоны и оценки угрозы повторного взрыва.", "anchors": ["комбинированное поражение", "ударная волна", "безопасность и повторный взрыв", "кровь", "дыхание", "реанимация", "сначала к тем", "кто молчит"], "simple": ["Особенность таких катастроф — комбинированные поражения: у одного человека сразу ожог, механическая травма, отравление продуктами горения и баротравма от ударной волны, поэтому осматривают целиком.", "Поражающих факторов пять: ударная волна, тепловое излучение и пламя, осколки и обломки конструкций, продукты горения, обрушение с последующим сдавлением.", "Что распознают: ожоги по площади (правило девяток и ладони) и глубине; ожог дыхательных путей — копоть у носа и рта, опалённые волосы, осиплый голос, кашель; отравление угарным газом; взрывную травму — разрыв барабанных перепонок, кровь из уха, звон в ушах, оглушённость; баротравму лёгких с кровохарканьем и одышкой. Внутренние повреждения бывают при целой коже — это самое коварное.", "Порядок действий: сначала собственная безопасность и оценка угрозы повторного взрыва или обрушения, потом эвакуация из зоны, потом помощь; в зоне продолжающегося горения помощь не оказывают.", "Приоритеты помощи по очереди: остановить наружное кровотечение, обеспечить проходимость дыхательных путей, при остановке дыхания — реанимация, затем ожоги и травмы, положение тела и согревание.", "Медицинская сортировка — распределение пострадавших по очерёдности помощи, это работа врачей; принцип таков: сначала подходят к тем, кто молчит, а не к тем, кто громче кричит, — кричащий дышит и в сознании. Придавленных обломками освобождают только со спасателями — там краш-синдром."], "cards": [{"t": "комбинированное поражение", "d": "сочетание у одного пострадавшего ожога, механической травмы, отравления продуктами горения и баротравмы"}, {"t": "ударная волна", "d": "поражающий фактор взрыва, дающий разрыв барабанных перепонок, оглушённость, звон в ушах, внутренние повреждения без наружных ран"}, {"t": "баротравма лёгких", "d": "повреждение от перепада давления: кровохарканье, одышка, боль в груди"}, {"t": "ожог дыхательных путей", "d": "копоть вокруг носа и рта, опалённые волосы в носу, осиплый голос, кашель, одышка; отёк гортани нарастает часами"}, {"t": "медицинская сортировка", "d": "распределение пострадавших по очерёдности помощи и эвакуации, относится к медицинс ение противоэпидемического режима, отстранение заболевших, информирование родителей, работа с паникой. Последнее — прямая зона психолога: в очаге инфекции люди боятся сильнее, чем требует реальная угроза, и паника сама становится поражающим фактором."], "terms": ["очаг биологического (бактериологического) заражения", "индикация возбудителя", "инкубационный период", "особо опасные инфекции", "средства индивидуальной защиты", "обсервация и карантин", "экстренная неспецифическая и специфическая профилактика", "бактериофаг", "дезинфекция", "дезинсекция", "дератизация", "противоэпидемический режим"], "follow": [{"q": "Чем карантин отличается от обсервации?", "a": "Обсервация — наблюдение с ограничениями, люди работают, но их проверяют и не выпускают из зоны. Карантин строже: полная изоляция территории с вооружённой охраной, запрет въезда и выезда. Карантин вводят при особо опасных инфекциях."}, {"q": "Кто принимает решение о карантине в школе?", "a": "Не школа сама. Решение принимается органами власти по предписанию санитарно-эпидемиологической службы, администрация организации его исполняет."}], "notes": [], "block": "Первая помощь", "bk": "pp", "tier": 3, "psy": false, "aid": true, "core": "Биологическое поражение по внешним признакам не распознать: возбудителя определяют лабораторно, это индикация. Задача оказывающего помощь — заподозрить неладное, защититься и не стать источником заражения.", "anchors": ["инкубационный период", "индикация", "СИЗ и изоляция", "обсервация и карантин", "паника как поражающий фактор"], "simple": ["Очаг биологического заражения — территория с людьми, животными и объектами, подвергшимися воздействию болезнетворных микроорганизмов или токсинов; от химического очага отличается тем, что поражение проявляется не сразу — есть инкубационный период от часов до недель.", "Что настораживает: массовое однотипное заболевание в короткий срок, необычная для местности инфекция, лихорадка и интоксикация у многих сразу, массовая гибель животных, следы рас // считаем календарные дни, а не доли суток: 19 июля → 28 июля это 9 дней, а не 10
function daysLeft() {
  const midnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diff = Math.round((midnight(EXAM) - midnight(new Date())) / 864e5);
  return Math.max(0, diff);
}

    el("rate").innerHTML = "Всё пройдено";
    el("hint").textContent = "Осталось гонять вслух и добивать карточки. Первую помощь повтори последней — алгоритмы забываются быстрее рассуждений.";
    el("queue").innerHTML = ""; return;
  }
  // последний день перед экзаменом оставляем под прогон вслух и тест
  const studyDays = Math.max(1, d - 1);
  const per = Math.ceil(left / studyDays);
  el("rate").innerHTML = per + " <span>" + plural(per, "тема", "темы", "тем") + " в день</span>";
  el("hint").textContent = d <= 1
    ? "Последний день. Гони вслух по каркасу и прогони тест, детали уже не успеть."
    : "Осталось " + left + " " + plural(left, "тема", "темы", "тем") + " и " + studyDays + " " +
      plural(studyDays, "рабочий день", "рабочих дня", "рабочих дней") +
      " по 26 июля включительно. 27-е — прогон вслух и тест, без новых тем.";
  el("queue").innerHTML = TOPICS.filter(t => !done.has(t.n)).slice(0, per)
    .map(t => '<span class="qchip">' + t.n + "</span>").join("");
}

function visible() {
  if (filter === "left") return TOPICS.filter(t => !done.has(t.n));
  if (filter === "aid")  return TOPICS.filter(t => t.aid);
  if (filter === "psy")  return TOPICS.filter(t => t.psy);
  return TOPICS;
}

function bodyHTML(t) {
  let h = "";
  // Сжатая выжимка — то, что надо запомнить и проговорить вслух
  if (t.core) h += '<div class="lbl">Суть — одной фразой</div><div class="core-box">' + esc(t.core) + "</div>";
  if (t.simple && t.simple.length) {
    h += '<div class="lbl">Запомни и перескажи</div><ul class="retell">' +
      t.simple.map(s => "<li>" + esc(s) + "</li>").join("") + "</ul>";
  }
  if (t.anchors && t.anchors.length) {
    h += '<div class="lbl">Крючки для памяти</div><div class="anchors">' +
      t.anchors.map(a => '<span class="anchor">' + esc(a) + "</span>").join("") + "</div>";
  }
  if (t.terms.length) {
    h += '<div class="lbl">Обязательно произнести</div><div class="terms">' +
      t.terms.map(x => '<span class="term">' + esc(x) + "</span>").join("") + "</div>";
  }
  // Длинный разбор — в справку, не мешает запоминанию
  h += '<details class="more"><summary>Развёрнутый ответ, куда развернуть и уточняющие вопросы</summary>';
  if (t.notes.length) {
    h += '<div class="lbl">Куда развернуть</div>' + t.notes.map(n =>
      '<div class="note"><b>' + esc(n.label) + "</b>" + esc(n.text) + "</div>").join("");
  }
  h += '<div class="lbl">Костяк ответа</div><ol class="kost">' +
    t.kostyak.map(k => "<li>" + esc(k) + "</li>").join("") + "</ol>";
  if (t.follow.length) {
    h += '<div class="lbl">Если спросят дальше</div>' + t.follow.map(f =>
      '<div class="fu"><q>' + esc(f.q) + "</q><div>" + esc(f.a) + "</div></div>").join("");
  }
  h += "</details>";
  return h;
}

function render() {
  const vis = visible(), box = el("list");
  if (!vis.length) { box.innerHTML = '<div class="empty">Здесь пусто — всё пройдено.</div>'; refreshHeader(); return; }
  let h = "";
  for (const tier of TIERS) {
    const rows = vis.filter(t => t.tier === tier.n);
    if (!rows.length) continue;
    const left = rows.filter(t => !done.has(t.n)).length;
    h += '<div class="tier"><h3>' + tier.name + " · " + rows.length + " " +
      plural(rows.length, "тема", "темы", "тем") +
      (left ? " · осталось " + left : " · пройдено") + "</h3><p>" + tier.note + "</p></div>";
    for (const t of rows) {
      const isDone = done.has(t.n);
      h += '<div class="item" data-tier="' + t.tier + '" data-done="' + (isDone ? 1 : 0) + '" data-n="' + t.n + '">' +
        '<div class="itemhead">' +
        '<button class="head" aria-expanded="false"><span class="num">' + t.n + "</span>" +
        '<span class="ttl">' + esc(t.title) +
        (t.core ? '<span class="core-line">' + esc(t.core) + "</span>" : "") +
        '<span class="flags">' +
          (t.tier === 1 ? '<span class="flag f-core">каркас</span>' : "") +
          (t.aid ? '<span class="flag f-aid">первая помощь</span>' : "") +
          (t.psy ? '<span class="flag f-psy">его поле</span>' : "") +
          (t.alias_of ? '<span class="flag f-core">дубль ' + t.alias_of + "</span>" : "") +
        "</span></span>" +
        '<span class="tick">' + (isDone ? "✓" : "") + "</span></button>" +
        '<button class="listen" data-listen="' + t.n + '" aria-pressed="false" aria-label="Прослушать вслух">🔊</button>' +
        "</div>" +
        '<div class="body">' + bodyHTML(t) +
          '<button class="done-btn' + (isDone ? "" : " primary") + '" data-done-for="' + t.n + '">' +
          (isDone ? "Вернуть в работу" : "Проговорил вслух — готово") + "</button>" +
        "</div></div>";
    }
  }
  box.innerHTML = h;
  refreshHeader();
  if (player.active) markPlaying(player.queue[player.qi]);
}

/* ── озвучка (Web Speech API, голос телефона) ── */
const synth = window.speechSynthesis;
const canSpeak = !!synth;
const byN = n => TOPICS.find(t => t.n === n);
let voice = null;
function pickVoice() {
  if (!canSpeak) return;
  const vs = synth.getVoices();
  const ru = vs.filter(v => /^ru/i.test(v.lang) || /russ/i.test(v.name));
  voice = ru.find(v => /Milena|Google|Katya|Alyona|Alena|Yuri|Russian/i.test(v.name)) || ru[0] || null;
}
if (canSpeak) { pickVoice(); synth.onvoiceschanged = pickVoice; }

const RATES = [1, 1.2, 1.4, 0.85];
const player = { queue: [], qi: 0, chunks: [], ci: 0, active: false, paused: false, rate: 1, gen: 0 };

const splitSent = s => String(s).replace(/\s+/g, " ").trim().split(/(?<=[.!?…])\s+/).filter(Boolean);
function chunksFor(t) {
  const out = ["Вопрос " + t.n + ". " + t.title + "."];
  if (t.core) { out.push("Суть."); out.push(...splitSent(t.core)); }
  if (t.simple && t.simple.length) { out.push("Перескажи так."); t.simple.forEach(s => out.push(...splitSent(s))); }
  if (t.anchors && t.anchors.length) { out.push("Крючки для памяти."); out.push(t.anchors.join(", ") + "."); }
  if (t.terms && t.terms.length) { out.push("Обязательно произнести."); out.push(t.terms.join(", ") + "."); }
  return out;
}

function markPlaying(n) {
  document.querySelectorAll('.item[data-playing="1"]').forEach(x => (x.dataset.playing = "0"));
  document.querySelectorAll(".listen").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.listen === n)));
  if (n == null) return;
  const it = document.querySelector('.item[data-n="' + n + '"]');
  if (it) {
    it.dataset.playing = "1"; it.dataset.open = "1";
    const hd = it.querySelector(".head"); if (hd) hd.setAttribute("aria-expanded", "true");
  }
}
function barUpdate() {
  if (!player.active) return;
  const t = byN(player.queue[player.qi]);
  el("pTitle").innerHTML = "<b>№" + t.n + "</b> " + esc(t.title);
  el("pPlay").textContent = player.paused ? "▶" : "⏸";
  el("pRate").textContent = player.rate + "×";
}
function speakNext(gen) {
  if (!player.active || gen !== player.gen) return;
  if (player.ci >= player.chunks.length) { loadTopic(player.qi + 1); return; }
  const u = new SpeechSynthesisUtterance(player.chunks[player.ci++]);
  u.lang = "ru-RU"; if (voice) u.voice = voice; u.rate = player.rate;
  const go = () => { if (gen === player.gen && player.active && !player.paused) speakNext(gen); };
  u.onend = go; u.onerror = go;
  synth.speak(u);
}
function loadTopic(qi) {
  if (qi < 0 || qi >= player.queue.length) { stopPlay(); return; }
  player.qi = qi; player.ci = 0; player.paused = false; player.gen++;
  const t = byN(player.queue[qi]);
  player.chunks = chunksFor(t);
  synth.cancel();
  barUpdate(); markPlaying(t.n);
  const it = document.querySelector('.item[data-n="' + t.n + '"]');
  if (it) it.scrollIntoView({ behavior: "smooth", block: "center" });
  speakNext(player.gen);
}
function startPlay(list) {
  if (!canSpeak) { alert("Синтез речи недоступен в этом браузере. Открой страницу в Safari или Chrome."); return; }
  if (!list.length) return;
  player.queue = list.map(t => t.n); player.active = true; player.paused = false;
  el("player").hidden = false;
  loadTopic(0);
}
function stopPlay() {
  player.active = false; player.paused = false; player.gen++;
  if (canSpeak) synth.cancel();
  el("player").hidden = true; markPlaying(null);
}
function togglePause() {
  if (!player.active) return;
  if (player.paused) {
    player.paused = false; synth.resume();
    if (!synth.speaking) speakNext(player.gen);
  } else { player.paused = true; synth.pause(); }
  barUpdate();
}
el("playAll").addEventListener("click", () => startPlay(visible()));
el("pPrev").addEventListener("click", () => loadTopic(player.qi - 1));
el("pNext").addEventListener("click", () => loadTopic(player.qi + 1));
el("pStop").addEventListener("click", stopPlay);
el("pPlay").addEventListener("click", togglePause);
el("pRate").addEventListener("click", () => {
  player.rate = RATES[(RATES.indexOf(player.rate) + 1) % RATES.length];
  barUpdate();
  if (player.active && !player.paused) { player.ci = Math.max(0, player.ci - 1); player.gen++; synth.cancel(); speakNext(player.gen); }
});

/* ── режимы ── */
const VIEWS = { topics: ["tTopics", "vTopics"], cards: ["tCards", "vCards"], quiz: ["tQuiz", "vQuiz"] };
function setView(v) {
  stopPlay();
  for (const [k, ids] of Object.entries(VIEWS)) {
    el(ids[0]).setAttribute("aria-pressed", String(k === v));
    el(ids[1]).dataset.on = k === v ? "1" : "0";
  }
  if (v === "cards") { if (!deck.length) buildDeck(); renderCard(); }
  if (v === "quiz") quizSetup();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
el("tTopics").addEventListener("click", () => setView("topics"));
el("tCards").addEventListener("click", () => setView("cards"));
el("tQuiz").addEventListener("click", () => setView("quiz"));

/* ── карточки ── */
let deck = [], deckPos = 0, flipped = false;
function buildDeck() {
  const pool = cardFilter === "left" ? ALL_CARDS.filter(c => !known.has(c.id)) : ALL_CARDS;
  deck = shuffle(pool); deckPos = 0; flipped = false;
}
function renderCard() {
  const box = el("cardArea");
  if (!deck.length) {
    box.innerHTML = '<div class="empty">Все карточки отмечены как выученные.<br>Нажми «Все карточки», чтобы пройти круг заново.</div>';
    return;
  }
  if (deckPos >= deck.length) {
    box.innerHTML = '<div class="qbox" style="text-align:center">' +
      '<div class="score">' + known.size + " / " + ALL_CARDS.length + "</div>" +
      '<p style="color:var(--muted);margin-top:6px">карточек отмечено как выученные</p>' +
      '<div class="tools" style="margin-top:18px;justify-content:center">' +
      '<button class="primary" id="cAgain">Пройти круг заново</button></div></div>';
    el("cAgain").addEventListener("click", () => { buildDeck(); renderCard(); });
    return;
  }
  const c = deck[deckPos];
  box.innerHTML =
    '<div class="flash" id="flashCard">' +
      '<div class="side">' + (flipped ? "Определение" : "Термин") + "</div>" +
      '<div class="front">' + esc(c.t) + "</div>" +
      (flipped ? '<div class="back">' + esc(c.d) + "</div>"
               : '<div class="tap">Нажми, чтобы проверить себя</div>') +
      '<div class="fromtopic">Вопрос ' + c.n + " · " + esc(c.title) + "</div>" +
    "</div>" +
    '<div class="grid2"><button id="cHard">Повторить ещё</button>' +
    '<button class="primary" id="cEasy">Знаю</button></div>' +
    '<p class="deckinfo">' + (deckPos + 1) + " из " + deck.length +
    " · отмечено " + known.size + " из " + ALL_CARDS.length + "</p>";

  el("flashCard").addEventListener("click", () => { flipped = !flipped; renderCard(); });
  el("cEasy").addEventListener("click", () => { known.add(c.id); saveC(); deckPos++; flipped = false; renderCard(); });
  el("cHard").addEventListener("click", () => { known.delete(c.id); saveC(); deckPos++; flipped = false; renderCard(); });
}
el("cAll").addEventListener("click", () => {
  cardFilter = "all";
  el("cAll").setAttribute("aria-pressed", "true"); el("cLeft").setAttribute("aria-pressed", "false");
  buildDeck(); renderCard();
});
el("cLeft").addEventListener("click", () => {
  cardFilter = "left";
  el("cLeft").setAttribute("aria-pressed", "true"); el("cAll").setAttribute("aria-pressed", "false");
  buildDeck(); renderCard();
});
el("cShuffle").addEventListener("click", () => { buildDeck(); renderCard(); });

/* ── тест ── */
let quiz = [], qPos = 0, qAnswered = false, wrong = [];
function quizSetup() {
  const aidNums = new Set(TOPICS.filter(t => t.aid).map(t => t.n));
  el("quizArea").innerHTML =
    '<div class="qbox"><div class="qtext">Тест</div>' +
    '<p style="color:var(--muted);font-size:15px;margin-bottom:16px">Четыре варианта, один верный. После ответа сразу разбор. В базе ' +
      ALL_QUIZ.length + " " + plural(ALL_QUIZ.length, "вопрос", "вопроса", "вопросов") + ".</p>" +
    '<div class="tools"><button class="primary" data-q="10">10 вопросов</button>' +
    '<button data-q="20">20 вопросов</button><button data-q="0">Все подряд</button></div>' +
    '<div class="tools" style="margin-bottom:0"><button data-q="10" data-tier="1">Только каркас</button>' +
    '<button data-q="12" data-aid="1">Только первая помощь</button></div></div>';

  el("quizArea").querySelectorAll("[data-q]").forEach(b =>
    b.addEventListener("click", () => {
      let pool = ALL_QUIZ;
      if (b.dataset.tier) pool = pool.filter(q => q.tier === +b.dataset.tier);
      if (b.dataset.aid) pool = pool.filter(q => aidNums.has(q.n));
      const n = +b.dataset.q;
      quiz = shuffle(pool);
      if (n) quiz = quiz.slice(0, n);
      quiz.forEach(q => { q._opts = shuffle([q.ok, ...q.bad]); });
      qPos = 0; wrong = []; qAnswered = false; renderQuiz();
    }));
}
function renderQuiz() {
  const box = el("quizArea");
  if (!quiz.length) { quizSetup(); return; }
  if (qPos >= quiz.length) {
    const right = quiz.length - wrong.length;
    const pct = Math.round(right / quiz.length * 100);
    box.innerHTML = '<div class="qbox"><div class="score">' + right + " / " + quiz.length + "</div>" +
      '<p style="color:var(--muted);margin:6px 0 0">' + pct + "% верных</p>" +
      (wrong.length
        ? '<div class="lbl" style="margin-top:20px">Разобрать заново</div>' +
          wrong.map(w => '<div class="wrongitem"><b>' + esc(w.q) + "</b><span>Верно: " +
            esc(w.ok) + ". " + esc(w.why) + "</span></div>").join("")
        : '<p style="margin-top:14px">Ошибок нет.</p>') +
      '<div class="tools" style="margin-top:18px;margin-bottom:0">' +
      '<button class="primary" id="qAgain">Ещё круг</button></div></div>';
    el("qAgain").addEventListener("click", quizSetup);
    return;
  }
  const q = quiz[qPos], opts = q._opts;
  box.innerHTML = '<div class="qbox">' +
    '<p style="font-family:var(--mono);font-size:12.5px;color:var(--muted);margin:0 0 8px">' +
      (qPos + 1) + " / " + quiz.length + " · вопрос " + q.n + "</p>" +
    '<div class="qtext">' + esc(q.q) + "</div>" +
    '<div class="opts">' + opts.map((o, i) =>
      '<button class="opt" data-i="' + i + '">' + esc(o) + "</button>").join("") + "</div>" +
    '<div id="whyBox"></div></div>';

  box.querySelectorAll(".opt").forEach(btn => btn.addEventListener("click", () => {
    if (qAnswered) return;
    qAnswered = true;
    const chosen = opts[+btn.dataset.i], right = chosen === q.ok;
    if (!right) wrong.push(q);
    box.querySelectorAll(".opt").forEach(b => {
      b.disabled = true;
      if (opts[+b.dataset.i] === q.ok) b.dataset.state = "ok";
      else if (b === btn) b.dataset.state = "err";
    });
    el("whyBox").innerHTML = '<div class="why"><b>' + (right ? "Верно." : "Мимо.") + "</b> " + esc(q.why) + "</div>" +
      '<div class="tools" style="margin-top:14px;margin-bottom:0"><button class="primary" id="qNext">' +
      (qPos + 1 >= quiz.length ? "Показать результат" : "Дальше") + "</button></div>";
    el("qNext").addEventListener("click", () => { qPos++; qAnswered = false; renderQuiz(); });
  }));
}

/* ── общее ── */
el("list").addEventListener("click", e => {
  const lb = e.target.closest(".listen");
  if (lb) {
    const n = +lb.dataset.listen;
    if (player.active && player.queue[player.qi] === n) stopPlay();
    else startPlay([byN(n)]);
    return;
  }
  const db = e.target.closest("[data-done-for]");
  if (db) {
    const n = +db.dataset.doneFor;
    done.has(n) ? done.delete(n) : done.add(n);
    save(); render(); return;
  }
  const head = e.target.closest(".head");
  if (head) {
    const item = head.closest(".item");
    const open = item.dataset.open === "1";
    item.dataset.open = open ? "0" : "1";
    head.setAttribute("aria-expanded", String(!open));
  }
});

const FBTN = { all: "fAll", left: "fLeft", aid: "fAid", psy: "fPsy" };
for (const [k, id] of Object.entries(FBTN)) {
  el(id).addEventListener("click", () => {
    filter = k;
    for (const [k2, id2] of Object.entries(FBTN)) el(id2).setAttribute("aria-pressed", String(k2 === k));
    render(); window.scrollTo({ top: 0, behavior: "smooth" });
  });
}

el("reset").addEventListener("click", () => {
  if (confirm("Сбросить отметки по темам и карточкам? Будет удалён прогресс по " + done.size +
              " темам и " + known.size + " карточкам.")) {
    done = new Set(); known = new Set(); save(); saveC(); buildDeck(); render();
  }
});

el("drillBtn").addEventListener("click", () => {
  const pool = TOPICS.filter(t => !done.has(t.n));
  const from = pool.length ? pool : TOPICS;
  const t = from[Math.floor(Math.random() * from.length)];
  filter = "all";
  for (const [k2, id2] of Object.entries(FBTN)) el(id2).setAttribute("aria-pressed", String(k2 === "all"));
  render();
  const target = document.querySelector('.item[data-n="' + t.n + '"]');
  if (target) {
    target.dataset.open = "1";
    target.querySelector(".head").setAttribute("aria-expanded", "true");
    target.scrollIntoView({ behavior: "smooth", block: "start" });
  }
});

buildDeck();
render();
</script>
</body>
</html>
