<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#0B0F0C" media="(prefers-color-scheme: dark)">
<meta name="description" content="Подготовка к вступительному испытанию РГСУ «Комплексная безопасность образовательной среды», 28 июля 2026. 66 тем, костяки устных ответов, расчёт нормы на день.">
<meta name="robots" content="noindex, nofollow">

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#128737;</text></svg>">
<title>Безопасность образовательной среды — подготовка к 28 июля</title>
<style>
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; }
  h1,h2,h3,p,ol,ul,figure { margin: 0; }
  ol,ul { padding: 0; list-style: none; }
  ol.kost { list-style: decimal; }
  button { font: inherit; color: inherit; }
  img { max-width: 100%; }
</style>
</head>
<body>
<style>
  :root {
    --ground: #EDF0EC;
    --card: #FFFFFF;
    --ink: #101711;
    --muted: #5B6A60;
    --line: #D2DAD3;
    --accent: #0E7A52;
    --accent-soft: #DCEBE2;
    --signal: #9C5B08;
    --signal-soft: #F5E7D2;
    --psy: #3B5C86;
    --psy-soft: #DEE7F2;
    --shadow: 0 1px 2px rgba(16,23,17,.06), 0 6px 16px rgba(16,23,17,.05);
    --r: 10px;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0B0F0C; --card: #141A15; --ink: #E4EAE5; --muted: #90A096;
      --line: #263028; --accent: #34B486; --accent-soft: #16301F;
      --signal: #D79A3C; --signal-soft: #302517;
      --psy: #8FB2DC; --psy-soft: #1B2634;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 16px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --ground: #0B0F0C; --card: #141A15; --ink: #E4EAE5; --muted: #90A096;
    --line: #263028; --accent: #34B486; --accent-soft: #16301F;
    --signal: #D79A3C; --signal-soft: #302517;
    --psy: #8FB2DC; --psy-soft: #1B2634;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 16px rgba(0,0,0,.3);
  }
  :root[data-theme="light"] {
    --ground: #EDF0EC; --card: #FFFFFF; --ink: #101711; --muted: #5B6A60;
    --line: #D2DAD3; --accent: #0E7A52; --accent-soft: #DCEBE2;
    --signal: #9C5B08; --signal-soft: #F5E7D2;
    --psy: #3B5C86; --psy-soft: #DEE7F2;
    --shadow: 0 1px 2px rgba(16,23,17,.06), 0 6px 16px rgba(16,23,17,.05);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--sans); font-size: 17px; line-height: 1.55;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 44rem; margin: 0 auto; padding: 0 14px 96px; }

  /* ── шапка ── */
  .top {
    position: sticky; top: 0; z-index: 20; background: var(--ground);
    border-bottom: 1px solid var(--line); margin: 0 -14px 16px; padding: 10px 14px 0;
  }
  .toprow { display: flex; align-items: baseline; gap: 10px; }
  .brand { font-size: 15px; font-weight: 680; letter-spacing: -.01em; }
  .countdown {
    margin-left: auto; font-family: var(--mono); font-size: 13px;
    font-variant-numeric: tabular-nums; color: var(--signal); font-weight: 600;
  }
  .bar { height: 3px; background: var(--line); margin-top: 9px; }
  .bar > i { display: block; height: 100%; background: var(--accent); transition: width .35s ease; }
  .barlbl {
    display: flex; justify-content: space-between; padding: 5px 0 8px;
    font-family: var(--mono); font-size: 11.5px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  /* ── карточка «сегодня» ── */
  .today {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
    padding: 15px 16px; box-shadow: var(--shadow); margin-bottom: 18px;
  }
  .today h2 {
    margin: 0 0 3px; font-size: 12px; font-weight: 640; text-transform: uppercase;
    letter-spacing: .1em; color: var(--muted);
  }
  .bignum { font-size: 40px; font-weight: 720; letter-spacing: -.035em; line-height: 1.05; }
  .bignum span { font-size: 17px; font-weight: 500; letter-spacing: 0; color: var(--muted); }
  .today p { margin: 8px 0 0; font-size: 14.5px; color: var(--muted); }
  .queue { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .qchip {
    font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums;
    background: var(--accent-soft); color: var(--accent); border-radius: 5px;
    padding: 3px 7px; font-weight: 600;
  }

  /* ── панель управления ── */
  .tools { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 16px; }
  button {
    font: inherit; font-size: 13.5px; cursor: pointer; border-radius: 7px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    padding: 7px 12px; transition: border-color .15s, background .15s;
  }
  button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
  .primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  :root[data-theme="dark"] .primary, .primary { color: #fff; }

  /* ── список тем ── */
  .tier { margin: 26px 0 10px; }
  .tier h3 { margin: 0; font-size: 16px; font-weight: 680; letter-spacing: -.01em; }
  .tier p { margin: 3px 0 0; font-size: 13.5px; color: var(--muted); }

  .item {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
    margin-bottom: 7px; overflow: hidden; position: relative;
  }
  /* полоса слева кодирует уровень: чем толще, тем больше тема держит остальных */
  .item::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0;
    background: var(--accent); opacity: .85;
  }
  .item[data-tier="1"]::before { width: 5px; }
  .item[data-tier="2"]::before { width: 3px; }
  .item[data-tier="3"]::before { width: 1.5px; opacity: .5; }
  .item[data-done="1"] { opacity: .58; }
  .item[data-done="1"]::before { background: var(--muted); }

  .head {
    display: flex; align-items: flex-start; gap: 10px; width: 100%;
    text-align: left; background: none; border: 0; border-radius: 0;
    padding: 12px 13px 12px 20px;
  }
  .head:hover { border-color: transparent; background: var(--accent-soft); }
  .num {
    font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums;
    color: var(--muted); min-width: 2.1em; padding-top: 2px; font-weight: 600;
  }
  .ttl { flex: 1; font-size: 15.5px; line-height: 1.4; font-weight: 520; }
  .flags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 5px; }
  .flag {
    font-size: 11px; font-weight: 640; letter-spacing: .03em; border-radius: 4px;
    padding: 2px 6px; text-transform: uppercase;
  }
  .f-aid { background: var(--signal-soft); color: var(--signal); }
  .f-psy { background: var(--psy-soft); color: var(--psy); }
  .f-core { background: var(--accent-soft); color: var(--accent); }
  .tick { font-size: 17px; color: var(--accent); padding-top: 1px; min-width: 1em; }

  /* ── раскрытая тема ── */
  .body { display: none; padding: 2px 15px 16px 20px; border-top: 1px solid var(--line); }
  .item[data-open="1"] .body { display: block; }
  .lbl {
    font-size: 11.5px; font-weight: 640; text-transform: uppercase; letter-spacing: .1em;
    color: var(--muted); margin: 16px 0 7px;
  }
  ol.kost { margin: 0; padding-left: 1.3em; }
  ol.kost li { margin-bottom: 9px; font-size: 15.5px; line-height: 1.52; }
  ol.kost li::marker { color: var(--accent); font-family: var(--mono); font-size: 13px; }
  .terms { display: flex; flex-wrap: wrap; gap: 5px; }
  .term {
    font-size: 13px; background: var(--ground); border: 1px solid var(--line);
    border-radius: 5px; padding: 3px 8px; color: var(--ink);
  }
  .note {
    border-left: 2px solid var(--psy); background: var(--psy-soft);
    padding: 9px 12px; border-radius: 0 6px 6px 0; margin-bottom: 8px; font-size: 14.5px;
  }
  .note b { display: block; font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--psy); margin-bottom: 3px; }
  .fu { border-top: 1px dashed var(--line); padding-top: 9px; margin-top: 9px; font-size: 14.5px; }
  .fu q { display: block; font-weight: 620; quotes: none; margin-bottom: 3px; }
  .fu q::before, .fu q::after { content: ""; }
  .fu div { color: var(--muted); }
  .done-btn { margin-top: 18px; width: 100%; }

  .empty { text-align: center; color: var(--muted); padding: 36px 0; font-size: 15px; }

  /* ── случайная тема ── */
  .drill { position: fixed; inset: 0; background: var(--ground); z-index: 40; display: none; overflow-y: auto; }
  .drill[data-on="1"] { display: block; }
  .drill .inner { max-width: 44rem; margin: 0 auto; padding: 22px 16px 60px; }
  .drill .kicker { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 640; }
  .drill h2 { font-size: 25px; line-height: 1.24; letter-spacing: -.02em; margin: 7px 0 20px; text-wrap: balance; }
  .reveal { margin-top: 20px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (min-width: 640px) { body { font-size: 17.5px; } .wrap { padding: 0 20px 96px; } }
</style>

<div class="wrap">
  <div class="top">
    <div class="toprow">
      <div class="brand">Безопасность образовательной среды</div>
      <div class="countdown" id="cd"></div>
    </div>
    <div class="bar"><i id="bar" style="width:0%"></i></div>
    <div class="barlbl"><span id="pct">0%</span><span id="cnt">0 из 66</span></div>
  </div>

  <div class="today">
    <h2>Норма на сегодня</h2>
    <div class="bignum" id="rate">—</div>
    <p id="hint"></p>
    <div class="queue" id="queue"></div>
  </div>

  <div class="tools">
    <button class="primary" id="drillBtn">Случайная тема</button>
    <button id="fAll" aria-pressed="true">Все</button>
    <button id="fLeft" aria-pressed="false">Не пройдено</button>
    <button id="fAid" aria-pressed="false">Первая помощь</button>
    <button id="fPsy" aria-pressed="false">Его темы</button>
    <button id="reset">Сбросить</button>
  </div>

  <div id="list"></div>
</div>

<div class="drill" id="drill">
  <div class="inner">
    <div class="kicker" id="dKick"></div>
    <h2 id="dTitle"></h2>
    <p style="color:var(--muted);font-size:15px">Проговори вслух полторы&nbsp;— две минуты. Потом открой костяк и сверься: что пропустил, какие термины не прозвучали.</p>
    <button class="primary" id="dShow">Показать костяк</button>
    <div class="reveal" id="dBody" hidden></div>
    <div class="tools" style="margin-top:22px">
      <button id="dNext">Следующая</button>
      <button id="dClose">Закрыть</button>
    </div>
  </div>
</div>

<script>
const TOPICS = [{"n": 1, "title": "Понятие «безопасность». Система «Природа – Общество – Человек»", "kostyak": ["«Безопасность — это состояние защищённости жизненно важных интересов человека, общества и государства от внутренних и внешних угроз. Это определение принято в отечественной науке и в законодательстве».", "«Второе прочтение, инженерное: безопасность — это состояние системы, при котором риск причинения вреда не превышает приемлемого уровня. То есть безопасность измерима через риск».", "«Ключевая мысль: безопасность — не отсутствие опасности, а её удержание в допустимых границах. Абсолютной безопасности не существует».", "«Система „Природа – Общество – Человек“ описывает три взаимодействующие среды. Человек одновременно и объект защиты, и источник угроз. Общество задаёт нормы и институты защиты. Природа — и ресурс, и источник опасностей, и сторона, страдающая от человека».", "«Объект безопасности — то, что защищаем: жизнь, здоровье, права личности, материальные и духовные ценности общества, конституционный строй и территориальная целостность государства».", "«Субъект безопасности — тот, кто обеспечивает защиту: государство, его органы, институты общества, сам человек. Отсюда важная деталь — человек и объект, и субъект собственной безопасности».", "«Предмет науки о безопасности — опасности, их источники, закономерности проявления и способы защиты. Методы: системный анализ, моделирование, статистический и вероятностный анализ, экспертные оценки, мониторинг и прогнозирование, нормирование».", "«Теория даёт понятийный аппарат и модели, практика — конкретные системы защиты. Системы безопасности выделяют по объекту: личная, коллективная, национальная, глобальная»."], "terms": ["жизненно важные интересы", "состояние защищённости", "объект и субъект безопасности", "приемлемый риск", "системный подход", "природно-социально-техническая среда", "мониторинг и прогнозирование", "нормирование"], "follow": [{"q": "Почему безопасность нельзя понимать как отсутствие опасности?", "a": "— Потому что любая деятельность потенциально опасна: это аксиома БЖД. Полностью убрать риск невозможно ни технически, ни экономически, поэтому цель — снижение до приемлемого уровня."}, {"q": "Человек — объект или субъект безопасности?", "a": "— И то, и другое. Его защищают, но и он сам через свою подготовку, поведение и решения обеспечивает или разрушает безопасность — свою и чужую."}], "notes": [], "block": "Теория, риск, ЗОЖ", "bk": "teor", "tier": 1, "psy": false, "aid": false}, {"n": 4, "title": "Понятие «опасность». Виды опасностей и их источники", "kostyak": ["«Опасность — свойство объектов, процессов или явлений причинять вред человеку, обществу или природной среде. Она существует всегда, вопрос только в вероятности реализации».", "«Отправная точка — аксиома о потенциальной опасности любой деятельности: не бывает деятельности с нулевым риском».", "«По происхождению опасности делят на природные, антропогенные, техногенные, социальные, биологические, экологические. Отдельно выделяют глобальные».", "«Природные — землетрясения, наводнения, ураганы, лесные пожары, оползни, эпидемии. Источник — процессы в природной среде, человек на них почти не влияет, но может усиливать последствия застройкой опасных территорий».", "«Антропогенные — вызванные непосредственно действием или бездействием человека: ошибка, нарушение правил, умысел, низкая квалификация».", "«Техногенные — связанные с работой технических систем: аварии на производстве, транспорте, энергетике, выбросы химически опасных и радиоактивных веществ. Причины — износ оборудования, конструктивные и технологические просчёты, отказ систем защиты».", "«Глобальные затрагивают человечество в целом: изменение климата, истощение ресурсов, загрязнение биосферы, пандемии, угроза применения оружия массового поражения».", "«Причины возникновения сводятся к трём группам: естественные процессы, несовершенство техники, человеческий фактор. И по статистике аварий человеческий фактор — ведущая группа причин»."], "terms": ["потенциальная опасность", "аксиома о потенциальной опасности деятельности", "номенклатура опасностей", "источник опасности", "человеческий фактор", "техногенная авария", "поражающий фактор", "глобальные опасности"], "follow": [{"q": "Чем антропогенная опасность отличается от техногенной?", "a": "— Антропогенная исходит непосредственно от человека и его действий, техногенная — от техники и технологий. Граница подвижная: авария по вине оператора техногенна по форме и антропогенна по причине."}, {"q": "Что такое номенклатура опасностей?", "a": "— Систематизированный перечень опасностей для конкретного объекта или вида деятельности. Составляется на этапе идентификации, чтобы ничего не пропустить при оценке риска."}], "notes": [], "block": "Теория, риск, ЗОЖ", "bk": "teor", "tier": 1, "psy": false, "aid": false}, {"n": 3, "title": "Вред, ущерб, риск: виды и характеристики", "kostyak": ["«Три понятия выстроены в цепочку. Вред — само неблагоприятное изменение: утрата здоровья, повреждение имущества, ухудшение состояния природной среды. Ущерб — вред, выраженный количественно, чаще всего в деньгах. Риск — мера возможности того, что вред наступит».", "«Виды вреда: физический — травма, заболевание, гибель; имущественный; моральный; экологический».", "«Ущерб делят на прямой и косвенный. Прямой — разрушенное и утраченное сразу. Косвенный — упущенная выгода, простой производства, затраты на восстановление, отдалённые последствия для здоровья».", "«Риск — количественная характеристика опасности. Считается как отношение числа неблагоприятных событий к общему числу возможных за определённый период, либо как произведение вероятности на тяжесть последствий».", "«Индивидуальный риск — вероятность поражения конкретного человека за год от конкретного фактора. Социальный, или групповой, риск — зависимость между числом пострадавших и вероятностью такого события; он показывает опасность катастроф с массовыми жертвами».", "«Приемлемый риск — уровень, с которым общество на данном этапе согласно мириться, потому что дальнейшее снижение слишком дорого либо технически невозможно».", "«Ещё различают мотивированный и немотивированный риск. Мотивированный — осознанный, ради спасения людей или значимого результата: работа спасателя, пожарного. Немотивированный — риск от небрежности, лихачества, нарушения правил без всякой выгоды».", "«Отдельно — профессиональный, экологический, техногенный риск: это уже деление по природе источника»."], "terms": ["вред", "ущерб", "риск", "прямой и косвенный ущерб", "индивидуальный риск", "социальный (групповой) риск", "приемлемый риск", "мотивированный и немотивированный риск", "тяжесть последствий", "упущенная выгода"], "follow": [{"q": "Зачем нужен именно социальный риск, если есть индивидуальный?", "a": "— Индивидуальный риск может быть низким, но событие способно унести сотни жизней разом. Общество воспринимает одну катастрофу с массовыми жертвами гораздо острее, чем ту же смертность, размазанную по годам. Социальный риск это отражает."}, {"q": "Мотивированный риск — это всегда оправданно?", "a": "— Нет. Он оправдан, когда ожидаемая польза превышает возможный вред и когда приняты меры защиты. Иначе это уже авантюра, а не профессиональный риск."}], "notes": [], "block": "Теория, риск, ЗОЖ", "bk": "teor", "tier": 1, "psy": false, "aid": false}, {"n": 43, "title": "Поражающие факторы ЧС: классификация и характеристика", "kostyak": ["«Поражающий фактор — составляющая опасного явления, которая непосредственно воздействует на людей, объекты и природную среду и вызывает поражение. Сама ЧС — событие, поражающий фактор — механизм причинения вреда».", "«По природе воздействия выделяют механические, тепловые, химические, радиационные, биологические, а также акустические, электромагнитные и психологические факторы».", "«Механические — ударная волна, обломки, обрушение конструкций, оползневые массы, поток воды. Результат — травмы, переломы, баротравма, гибель под завалами».", "«Тепловые — световое излучение, пламя, горячие газы. Вызывают ожоги кожи и дыхательных путей, тепловой удар, воспламенение материалов».", "«Химические — воздействие аварийно химически опасных веществ: отравления, поражение органов дыхания, ожоги, заражение местности и воды».", "«Радиационные — ионизирующее излучение: острая и хроническая лучевая болезнь, отдалённые последствия».", "«Биологические — патогенные микроорганизмы и токсины: инфекционные заболевания, эпидемии, эпизоотии».", "«Отдельно называю психологический фактор: острая реакция на стресс, паника, ступор, дезорганизация поведения. Он не оставляет физических следов, но резко увеличивает потери — из-за паники людей гибнет иногда больше, чем от самого поражающего явления».", "«По времени действия факторы делят на первичные и вторичные: землетрясение — первичный, а вызванный им пожар или разрушение плотины — вторичный. По длительности — мгновенные и пролонгированные»."], "terms": ["поражающий фактор", "первичные и вторичные факторы", "ударная волна", "световое излучение", "ионизирующее излучение", "АХОВ (аварийно химически опасные вещества)", "очаг поражения", "зона заражения", "санитарные и безвозвратные потери"], "follow": [{"q": "Приведите пример цепочки первичных и вторичных факторов.", "a": "— Землетрясение: первичный — сейсмический удар и обрушение зданий; вторичные — пожары от повреждённых сетей, утечка АХОВ с предприятия, затопление при разрушении гидросооружения, вспышка инфекций из-за нарушения водоснабжения."}, {"q": "Почему психологический фактор относят к поражающим?", "a": "— Потому что он самостоятельно приводит к потерям: паника вызывает давку, ступор мешает эвакуироваться, дезорганизация срывает действия спасателей."}], "notes": [], "block": "Теория, риск, ЗОЖ", "bk": "teor", "tier": 1, "psy": false, "aid": false}, {"n": 26, "title": "РСЧС: структура, организация, цели, задачи, деятельность. Программы обеспечения БЖД", "kostyak": ["РСЧС — это единая государственная система предупреждения и ликвидации чрезвычайных ситуаций. Она объединяет органы управления, силы и средства федеральных органов исполнительной власти, органов власти субъектов, органов местного самоуправления и организаций, в полномочия которых входит решение вопросов защиты населения и территорий от ЧС.", "Создана система была в начале девяностых годов сначала как Российская система предупреждения и действий в чрезвычайных ситуациях, а в середине девяностых преобразована в единую государственную систему. Правовая основа — федеральный закон «О защите населения и территорий от чрезвычайных ситуаций природного и техногенного характера».", "Цель системы — предупреждение возникновения и развития ЧС, снижение размеров ущерба и потерь, ликвидация чрезвычайных ситуаций.", "Задачи назову основные: разработка и реализация правовых и экономических норм в этой области; осуществление целевых и научно-технических программ по повышению устойчивости объектов; обеспечение готовности органов управления, сил и средств; сбор и обмен информацией; подготовка населения к действиям в ЧС; прогнозирование и оценка последствий; создание резервов финансовых и материальных ресурсов; ликвидация ЧС и социальная защита пострадавших.", "Теперь структура, это костяк вопроса. РСЧС состоит из функциональных и территориальных подсистем. Функциональные создаются федеральными органами исполнительной власти по отраслевому принципу — например, подсистема надзора в сфере защиты прав потребителей или подсистема Минздрава. Территориальные создаются в субъектах Российской Федерации и действуют в границах своих территорий.", "Система имеет пять уровней: федеральный, межрегиональный, региональный, муниципальный и объектовый.", "На каждом уровне создаются одни и те же типы органов и элементов. Координационные органы — это комиссии по предупреждению и ликвидации чрезвычайных ситуаций и обеспечению пожарной безопасности, сокращённо КЧС и ОПБ. Постоянно действующие органы управления — МЧС России, главные управления МЧС по субъектам, органы, специально уполномоченные на решение задач в области защиты населения. Органы повседневного управления — центры управления в кризисных ситуациях и единые дежурно-диспетчерские службы.", "Кроме органов, на каждом уровне есть силы и средства, резервы финансовых и материальных ресурсов, системы связи и оповещения и системы информационного обеспечения.", "Режимов функционирования три: режим повседневной деятельности при отсутствии угрозы; режим повышенной готовности при угрозе возникновения ЧС; режим чрезвычайной ситуации при её возникновении и ликвидации. Отдельно предусмотрены уровни реагирования, которые определяют, должностное лицо какого уровня руководит ликвидацией.", "Про программы. Обеспечение безопасности реализуется через государственные программы федерального уровня — прежде всего программу в области защиты населения и территорий от чрезвычайных ситуаций и обеспечения пожарной безопасности, которую ведёт МЧС России, — а на уровне субъектов через аналогичные региональные государственные программы. В муниципалитетах и организациях им соответствуют планы действий по предупреждению и ликвидации ЧС."], "terms": ["единая государственная система предупреждения и ликвидации ЧС", "федеральный закон «О защите населения и территорий от ЧС природного и техногенного характера»", "функциональные и территориальные подсистемы", "федеральный", "межрегиональный", "региональный", "муниципальный", "объектовый уровни", "координационные органы", "КЧС и ОПБ", "постоянно действующие органы управления", "органы повседневного управления", "ЕДДС", "центр управления в кризисных ситуациях", "режим повседневной деятельности", "режим повышенной готовности", "режим чрезвычайной ситуации", "резервы финансовых и материальных ресурсов"], "follow": [{"q": "Чем режим повышенной готовности отличается от режима ЧС?", "a": "Повышенная готовность вводится при угрозе возникновения ЧС: усиливается наблюдение и контроль, приводятся в готовность силы и средства, уточняются планы, при необходимости проводится упреждающая эвакуация. Режим ЧС вводится, когда ситуация уже возникла, и означает переход к ликвидации: развёртывание сил, проведение АСДНР, организацию жизнеобеспечения пострадавших."}, {"q": "Что такое ЕДДС и зачем она нужна?", "a": "Единая дежурно-диспетчерская служба муниципального образования. Это орган повседневного управления, который круглосуточно принимает сообщения об угрозах и происшествиях, оценивает их и координирует действия всех дежурных служб на территории. Именно она обеспечивает единый номер вызова экстренных служб."}], "notes": [{"label": "Разворот на школу", "text": "образовательная организация — это объектовое звено РСЧС. Отсюда объектовая комиссия по предупреждению и ликвидации ЧС и обеспечению пожарной безопасности, план действий по предупреждению и ликвидации ЧС, назначенный ответственный, тренировки и обучение работников. Школа — не сторонний наблюдатель системы, а её нижний уровень."}], "block": "ЧС, ГО, РСЧС", "bk": "chs", "tier": 1, "psy": false, "aid": false}, {"n": 19, "title": "Гражданская оборона: предназначение, задачи, организация управления", "kostyak": ["Гражданская оборона — это система мероприятий по подготовке к защите и по защите населения, материальных и культурных ценностей на территории Российской Федерации от опасностей, возникающих при военных конфликтах или вследствие этих конфликтов, а также при чрезвычайных ситуациях природного и техногенного характера. Определение дано федеральным законом «О гражданской обороне».", "Обращу внимание на важную деталь этого определения: с конца девяностых годов гражданская оборона решает задачи не только военного, но и мирного времени. Это принципиально, потому что именно здесь она смыкается с РСЧС.", "Исторически система идёт от местной противовоздушной обороны, МПВО, созданной в тридцатые годы. В шестьдесят первом году она была преобразована в гражданскую оборону страны, а в девяностые годы, после серии крупных техногенных аварий, руководство ею перешло к системе МЧС России.", "Задачи гражданской обороны перечислю по основным группам. Первая — подготовка населения в области ГО и оповещение о возникающих опасностях.", "Вторая — защита населения: эвакуация населения и материальных ценностей в безопасные районы, предоставление населению средств индивидуальной защиты и защитных сооружений.", "Третья — обеспечивающие мероприятия: световая и другие виды маскировки, борьба с пожарами, обнаружение и обозначение районов радиоактивного, химического и биологического заражения, санитарная обработка людей и обеззараживание техники, зданий и территорий.", "Четвёртая — восстановление и жизнеобеспечение: проведение аварийно-спасательных и других неотложных работ, первоочередное жизнеобеспечение пострадавшего населения, срочное восстановление функционирования коммунальных служб, поддержание порядка в пострадавших районах, срочное захоронение погибших, обеспечение устойчивости функционирования организаций в военное время.", "Теперь управление. Общее руководство гражданской обороной в стране осуществляет Правительство Российской Федерации. Федеральный орган, уполномоченный на решение задач в области ГО, — МЧС России.", "Далее по вертикали: в федеральных органах исполнительной власти и в организациях руководство ГО осуществляют их руководители, в субъектах и муниципальных образованиях — главы соответствующих администраций. Ключевой принцип: руководитель организации является по должности начальником гражданской обороны этой организации, эта обязанность не делегируется.", "Повседневное управление ведут органы, специально уполномоченные на решение задач в области гражданской обороны, — от главных управлений МЧС России по субъектам до структурных подразделений или отдельных работников в организациях."], "terms": ["федеральный закон «О гражданской обороне»", "МПВО", "МЧС России", "опасности", "возникающие при военных конфликтах", "защитные сооружения гражданской обороны", "световая маскировка", "АСДНР", "первоочередное жизнеобеспечение", "устойчивость функционирования организаций", "руководитель гражданской обороны", "орган", "уполномоченный на решение задач в области ГО"], "follow": [{"q": "Кто отвечает за гражданскую оборону в организации?", "a": "Руководитель организации по должности. Он отвечает за состояние ГО, а непосредственную работу ведёт назначенный им уполномоченный работник или структурное подразделение — в зависимости от численности и категории объекта."}, {"q": "Что такое нештатные формирования по обеспечению выполнения мероприятий по гражданской обороне?", "a": "Это формирования, создаваемые организациями из числа своих работников для выполнения мероприятий ГО на своей территории: обеспечение эвакуации, санитарная обработка, обслуживание защитных сооружений, восстановление коммуникаций. Они не входят в состав сил постоянной готовности, а комплектуются персоналом самой организации."}], "notes": [{"label": "Разворот на школу", "text": "директор школы — руководитель гражданской обороны образовательной организации. Из этого вырастает конкретный набор: приказ о назначении работника, уполномоченного на решение задач в области ГО и ЧС, план основных мероприятий по ГО на год, план гражданской обороны и защиты населения, обучение работников по программе ГО и объектовые тренировки."}], "block": "ЧС, ГО, РСЧС", "bk": "chs", "tier": 1, "psy": false, "aid": false}, {"n": 64, "title": "Обеспечение безопасности образовательного учреждения", "kostyak": ["Начну с определения: безопасность образовательной организации — состояние защищённости обучающихся, работников и материальных ценностей от угроз любого происхождения, обеспечивающее нормальный ход образовательного процесса. Обязанность создавать безопасные условия закреплена в Федеральном законе «Об образовании в Российской Федерации», ответственность несёт образовательная организация.", "Дальше разложу по направлениям — их принято выделять восемь.", "Антитеррористическая защищённость. Категорирование объекта, паспорт безопасности, контрольно-пропускной и внутриобъектовый режим, охрана, инженерно-технические средства: ограждение, видеонаблюдение, тревожная кнопка с выводом на пульт, система оповещения. Плюс тренировки и инструктажи по действиям при угрозе.", "Пожарная безопасность. Автоматическая пожарная сигнализация и система оповещения, первичные средства пожаротушения, содержание путей эвакуации, планы эвакуации, назначение ответственного, обучение мерам пожарной безопасности, регулярные объектовые тренировки по эвакуации.", "Охрана труда и техника безопасности. Специальная оценка условий труда, инструктажи — вводный, первичный, повторный, целевой; расследование несчастных случаев с обучающимися и работниками, требования к кабинетам повышенной опасности: химия, физика, технология, спортзал.", "Электро- и энергобезопасность, санитарно-эпидемиологическая безопасность. Соблюдение санитарных правил, режим занятий, питание, медицинское сопровождение.", "Информационная безопасность. Контентная фильтрация, защита персональных данных обучающихся, ответственный за информационную безопасность, профилактика деструктивного контента и кибербуллинга.", "Профилактика детского травматизма. Организация перемен и дежурства, безопасность оборудования и спортивных снарядов, профилактика дорожно-транспортного травматизма, инструктажи перед выездными мероприятиями.", "Гражданская оборона и защита от ЧС. Планы действий, объектовое звено РСЧС, обучение работников и обучающихся, средства индивидуальной защиты.", "Психологическая безопасность образовательной среды. Об этом отдельно и подробнее — я вижу это направление как ключевое. Субъекты и ответственность - Учредитель — создаёт условия и финансирует мероприятия по безопасности. - Руководитель организации — несёт персональную ответственность за безопасность обучающихся и работников, утверждает паспорт безопасности, назначает ответственных приказом. - Заместитель руководителя по безопасности — организует всю работу по направлениям. - Преподаватель-организатор основ безопасности и защиты Родины — ведёт учебный предмет ОБЗР, организует объектовые тренировки и эвакуации, готовит инструктажи, участвует в разработке документации по гражданской обороне и антитеррористической защищённости, ведёт военно-патриотическую работу и подготовку к учебным сборам. Фактически это связующая фигура между учебным процессом и системой безопасности объекта. - Педагог-психолог и социальный педагог — психологическая безопасность, профилактика буллинга и деструктивного поведения, работа с группами риска. - Классный руководитель — инструктажи, ежедневный контроль, взаимодействие с семьёй. - Каждый педагог — отвечает за жизнь и здоровье обучающихся во время занятия и мероприятия. - Внешние субъекты — Росгвардия и охранная организация, органы внутренних дел, МЧС, Роспотребнадзор, комиссия по делам несовершеннолетних. Психологическая безопасность образовательной среды — вывод, к которому веду весь ответ", "Техническая защита закрывает внешние угрозы, но значительная часть угроз в школе рождается внутри неё самой: травля, конфликты, эмоциональное насилие, отвержение ребёнка группой. На эти угрозы не действуют ни турникет, ни камера.", "Понятие психологической безопасности образовательной среды разработано в отечественной психологии, ключевое имя здесь — И. А. Баева. В её подходе психологическая безопасность среды определяется через защищённость участников образовательного процесса от психологического насилия и через удовлетворённость средой, которая обеспечивает референтную значимость среды для человека.", "Три основных критерия по этому подходу: отношение к образовательной среде, защищённость от психологического насилия во взаимодействии, референтность среды — то есть значимость её для человека и желание в ней находиться.", "Формы психологического насилия в школе: публичное унижение, игнорирование, угрозы, принуждение, высмеивание — причём как по линии «ученик — ученик», так и по линии «педагог — ученик».", "Практический выход: мониторинг психологической безопасности среды, антибуллинговые программы, обучение педагогов распознаванию травли, работа с классом как с группой, а не только с отдельным ребёнком, служба медиации в школе.", "Логика связки простая: физическая безопасность — необходимое условие, психологическая — то, что определяет качество среды и в конечном счёте влияет на риск тяжёлых происшествий, включая нападения, где в предыстории почти всегда обнаруживается длительная социальная изоляция подростка."], "terms": ["комплексная безопасность образовательной организации", "антитеррористическая защищённость", "категорирование объекта", "паспорт безопасности", "контрольно-пропускной и внутриобъектовый режим", "инженерно-технические средства охраны", "охрана труда", "инструктаж", "объектовая тренировка", "детский травматизм", "гражданская оборона", "преподаватель-организатор ОБЗР", "психологическая безопасность образовательной среды", "психологическое насилие", "референтность среды", "буллинг", "служба медиации", "И. А. Баева"], "follow": [{"q": "Кто отвечает за безопасность в школе?", "a": "Персональную ответственность несёт руководитель организации, но система работает только при распределённой ответственности: каждый педагог отвечает за детей на своём занятии, ответственные по направлениям назначаются приказом."}, {"q": "Что такое паспорт безопасности?", "a": "Документ по антитеррористической защищённости объекта, который составляется после категорирования и содержит характеристику объекта, оценку уязвимости, перечень мер и порядок действий при угрозе. Документ ограниченного доступа."}, {"q": "Почему психологическая безопасность — часть комплексной безопасности, а не отдельная тема?", "a": "Потому что угрозы, вызревающие внутри коллектива, не блокируются техническими средствами, и потому что состояние среды влияет на поведение людей в самой критической ситуации."}, {"q": "Как измерить психологическую безопасность среды?", "a": "Через опросные методики, оценивающие отношение к среде, защищённость от психологического насилия и референтность; в отечественной практике опираются на подход И. А. Баевой."}], "notes": [{"label": "Заходит от психологии", "text": "тут вся вторая часть ответа. Буллинг и его структура — агрессор, жертва, свидетели; роль наблюдателя как ключевая точка вмешательства. Групповая динамика класса. Диагностика психологической безопасности среды. Профилактика через работу с климатом группы, а не только через реагирование на инцидент."}], "block": "Социальные угрозы", "bk": "soc", "tier": 1, "psy": false, "aid": false}, {"n": 6, "title": "Предмет, цель и задачи БЖД и школьного курса ОБиЗР", "kostyak": ["Начну с разведения двух вещей: «Безопасность жизнедеятельности» — вузовская научная и учебная дисциплина, а «Основы безопасности и защиты Родины» — школьный предмет; у них общая идеология, но разный уровень и разные задачи.", "Предмет изучения БЖД — опасности среды обитания и способы защиты от них человека, то есть система «человек — среда обитания» и её взаимодействие.", "В основе дисциплины лежит аксиома о потенциальной опасности любой деятельности: абсолютной безопасности не бывает, любая деятельность несёт остаточный риск, и задача — управлять этим риском, а не устранять его полностью.", "Цель БЖД — сформировать у человека мышление, при котором безопасность рассматривается как условие любой деятельности; отсюда идея приемлемого риска вместо идеи нулевого риска.", "В школьном курсе цель звучит иначе — формирование культуры безопасности личности: не только знания, но и мотивы, ценности, готовность действовать. Это понятие в отечественной педагогике разрабатывали Мошкин и Гафнер.", "Задачи школьного курса я бы свёл к трём линиям: научить распознавать опасные и чрезвычайные ситуации, научить правильно действовать в них, включая первую помощь, и воспитать ответственное отношение к собственной жизни, здоровью и защите Отечества.", "С 2024 года к этим линиям добавилась военная составляющая: основы военной подготовки, элементы НВП, знакомство с современными средствами вооружённой борьбы. Это прямо следует из нового названия — «и защиты Родины».", "И последнее: результат курса измеряется не воспроизведением правил, а поведением в ситуации. Отсюда и специфика методики — акцент на практикумы, тренировки, ситуационные задачи."], "terms": ["система «человек — среда обитания»", "аксиома о потенциальной опасности деятельности", "приемлемый (остаточный) риск", "опасный фактор и поражающий фактор", "культура безопасности личности", "гомосфера и ноксосфера", "виктимность", "чрезвычайная ситуация", "федеральная рабочая программа", "компетентностный подход"], "follow": [{"q": "Чем ОБиЗР отличается от ОБЖ по содержанию?", "a": "Ядро сохранилось — ЧС, безопасность в быту, на транспорте, в природе, первая помощь, информационная безопасность. Добавились модули по военной подготовке и основам военных знаний, усилена линия противодействия экстремизму и терроризму, появились современные сюжеты вроде беспилотных систем."}, {"q": "Что такое приемлемый риск?", "a": "Уровень риска, который общество готово принять ради получаемой выгоды. Нулевого риска не бывает технически и экономически, поэтому нормирование строится на приемлемом значении, а не на полном исключении опасности."}], "notes": [{"label": "Заходит от психологии", "text": "культура безопасности — по структуре это классическая триада «когнитивный — эмоционально-ценностный — поведенческий компонент», и её можно развернуть через понятие установки. Плюс тема виктимного поведения: почему человек становится жертвой, как связаны тревожность, самооценка и рискованное поведение подростка."}], "block": "Методика", "bk": "met", "tier": 1, "psy": false, "aid": false}, {"n": 7, "title": "Требования ФГОС к результатам освоения курса ОБиЗР/ОБЖ", "kostyak": ["Обновлённые ФГОС основного и среднего общего образования, принятые в 2021 году, задают три группы результатов: личностные, метапредметные и предметные. Эта рамка сквозная для всех предметов, ОБиЗР не исключение.", "Личностные результаты во ФГОС описаны по направлениям воспитания — гражданское, патриотическое, духовно-нравственное, эстетическое, физическое, трудовое, экологическое, ценность научного познания. Для ОБиЗР ведущими будут гражданское, патриотическое и физическое — готовность к защите Отечества, ответственное отношение к своему здоровью, неприятие любых форм экстремизма.", "Важная методическая оговорка: личностные результаты не выносятся на персональную отметку. Они оцениваются неперсонифицированно, в ходе мониторингов, потому что оценивать ценности отметкой некорректно.", "Метапредметные результаты во ФГОС раскрыты через универсальные учебные действия трёх видов: познавательные, коммуникативные и регулятивные. Познавательные разделены на базовые логические, базовые исследовательские и работу с информацией.", "На материале ОБиЗР метапредметные результаты работают естественно: анализ ситуации, оценка достоверности источника, принятие решения в условиях дефицита времени, распределение ролей в группе при отработке эвакуации.", "Предметные результаты — то, что специфично именно для предмета. По ОБиЗР это владение алгоритмами действий в опасных и чрезвычайных ситуациях, знание порядка оказания первой помощи, понимание основ обороны государства и воинской обязанности, навыки безопасного поведения в информационном пространстве.", "На базовом уровне в средней школе акцент смещён к практическим умениям и к тому, что человек реально сделает: показать, а не пересказать. Формулировки предметных результатов в стандарте построены от действия — «применять», «оказывать», «оценивать».", "Конкретика по годам обучения задана уже не стандартом, а федеральной рабочей программой по ОБиЗР, которая входит в федеральную образовательную программу — учитель не сочиняет требования сам, он их детализирует."], "terms": ["ФГОС ООО и ФГОС СОО", "три группы результатов", "направления воспитания", "неперсонифицированная оценка личностных результатов", "универсальные учебные действия", "базовые логические и базовые исследовательские действия", "федеральная образовательная программа", "федеральная рабочая программа", "базовый и углублённый уровень", "системно-деятельностный подход"], "follow": [{"q": "Почему личностные результаты не оценивают отметкой?", "a": "Потому что отметка за ценностную позицию превращается в оценку личности и провоцирует имитацию. Стандарт предполагает мониторинг на уровне класса и школы, а не персональную аттестацию."}, {"q": "Что такое системно-деятельностный подход простыми словами?", "a": "Ученик не получает готовое знание, а получает задачу, которая заставляет это знание построить. Учитель организует деятельность и переводит ученика из позиции слушателя в позицию действующего."}], "notes": [{"label": "Заходит от психологии", "text": "методологическая основа ФГОС — системно-деятельностный подход, а он вырос из культурно-исторической теории Выготского и теории деятельности Леонтьева. Тезис «результат формируется только в собственной деятельности ученика, а не в трансляции» — это прямая линия от Гальперина и Эльконина, и её стоит проговорить своими словами."}], "block": "Методика", "bk": "met", "tier": 1, "psy": false, "aid": false}, {"n": 28, "title": "Типология уроков", "kostyak": ["Урок — основная форма организации обучения в классно-урочной системе, восходящей к Коменскому: постоянный состав класса, фиксированное время, единая программа.", "Классифицировать уроки можно по разным основаниям, но общепринятая типология строится по дидактической цели. Её разрабатывали Есипов, Онищук, Махмутов.", "Типы по дидактической цели: урок изучения нового материала; урок закрепления и совершенствования знаний и умений; урок обобщения и систематизации; урок контроля и коррекции; комбинированный урок. Отдельно выделяют урок формирования умений и навыков — практикум.", "Комбинированный урок самый распространённый в школе: он сочетает проверку домашнего, изучение нового, закрепление и задание на дом. Его сильная сторона — универсальность, слабая — дробность, каждому этапу достаётся мало времени.", "Структура зависит от типа. У урока изучения нового: мотивационный этап, актуализация опорных знаний, постановка учебной задачи, изучение нового, первичное закрепление, рефлексия, домашнее задание.", "В логике системно-деятельностного подхода типологию описывают иначе: урок открытия нового знания, урок рефлексии, урок построения системы знаний, урок развивающего контроля. Знать обе рамки полезно — вторая ближе к формулировкам ФГОС.", "По форме проведения уроки бывают традиционными и нестандартными: урок-практикум, урок-экскурсия, урок-конференция, урок-игра, урок-соревнование, интегрированный урок.", "Специфика ОБиЗР: доля практикумов выше, чем у большинства предметов. Отдельный формат — учебная тренировка по эвакуации, которая выходит за рамки одного класса, и практическое занятие по первой помощи с отработкой на манекене.", "Общий принцип: тип урока выбирается из цели, а не наоборот. Несовпадение типа и цели — типичная ошибка, которую как раз и ловит анализ урока."], "terms": ["классно-урочная система и Коменский", "дидактическая цель урока", "комбинированный урок", "урок изучения нового материала", "урок формирования умений и навыков", "урок обобщения и систематизации", "урок контроля и коррекции", "урок открытия нового знания", "нестандартные формы урока", "интегрированный урок", "практикум"], "follow": [{"q": "Обязателен ли этап проверки домашнего задания?", "a": "Нет, он есть в структуре комбинированного урока, но не в каждом типе. На уроке открытия нового знания его заменяет актуализация опорных знаний."}, {"q": "Что такое интегрированный урок?", "a": "Урок, где материал двух и более предметов объединён вокруг одного объекта. Для ОБиЗР это, например, тема отравлений вместе с химией или тема стихийных бедствий вместе с географией."}], "notes": [{"label": "Заходит от психологии", "text": "мотивационный этап урока — не формальность, а условие включения. Можно говорить о принятии учебной задачи как психологическом условии деятельности и о том, что без этапа принятия задачи весь остальной урок работает вхолостую. Также уместно про распределение нагрузки внутри урока с учётом динамики работоспособности: новое даём в первой трети, отработку — дальше."}], "block": "Методика", "bk": "met", "tier": 1, "psy": false, "aid": false}, {"n": 36, "title": "Терминальные состояния. Базовый комплекс СЛР. Оптимальное положение тела", "kostyak": ["Терминальные состояния — это обратимые стадии угасания жизни. Их последовательность: преагония, терминальная пауза, агония, клиническая смерть. За клинической смертью следует биологическая, и она уже необратима.", "Клиническая смерть длится примерно пять–шесть минут при обычной температуре. При переохлаждении срок удлиняется, поэтому утонувших в холодной воде реанимируют дольше и упорнее.", "Признаки клинической смерти для того, кто оказывает первую помощь, простые: нет сознания, нет нормального дыхания. Пульс на сонной артерии проверяют, но человек без медицинского образования не обязан на него ориентироваться — при сомнении начинают реанимацию.", "Признаки биологической смерти, при которых реанимацию не начинают: помутнение и высыхание роговицы, симптом «кошачьего глаза» — зрачок становится щелевидным при сдавлении глазного яблока, трупные пятна, трупное окоченение.", "Базовый комплекс СЛР. Убедиться в безопасности, проверить сознание, открыть дыхательные пути запрокидыванием головы и подъёмом подбородка, оценить дыхание за десять секунд, вызвать скорую по 103 или 112 и попросить принести дефибриллятор, начать компрессии.", "Цифры называю точно: руки на центр грудной клетки, на нижнюю половину грудины, компрессии на глубину пять–шесть сантиметров, с частотой сто–сто двадцать в минуту, с полным возвращением грудной клетки между нажатиями. Соотношение — тридцать компрессий на два вдоха.", "Если делать искусственное дыхание невозможно или неприятно, выполняются только непрерывные компрессии — это лучше, чем ничего. Спасатели меняются каждые две минуты, паузы минимальные. Реанимация продолжается до приезда бригады, до появления признаков жизни или до полного истощения сил.", "Отдельно назову автоматический наружный дефибриллятор. Его применение вошло в обновлённый порядок оказания первой помощи, прибор голосом ведёт человека по шагам, и использовать его может любой.", "Оптимальное положение тела — самостоятельное мероприятие из перечня. Без сознания, но дышит — устойчивое боковое положение. Кровопотеря и шок — на спине с приподнятыми ногами. Травма груди и одышка — полусидя. Травма живота — на спине с валиком под коленями. Травма таза — поза «лягушки». Подозрение на травму позвоночника — не трогать вообще."], "terms": ["преагония", "терминальная пауза", "агония", "клиническая смерть", "биологическая смерть", "симптом Белоглазова («кошачий глаз»)", "базовый комплекс сердечно-лёгочной реанимации", "компрессии грудной клетки 5–6 см", "частота 100–120 в минуту", "соотношение 30:2", "автоматический наружный дефибриллятор", "устойчивое боковое положение", "смена спасателя каждые две минуты"], "follow": [{"q": "У детей соотношение другое?", "a": "Для человека без медицинского образования допустимо использовать то же соотношение 30:2, глубина — примерно треть переднезаднего размера грудной клетки. У двух и более обученных спасателей для детей применяется 15:2, но это уже уровень профессиональной подготовки."}, {"q": "Прекардиальный удар делают?", "a": "В первой помощи — нет. Он не входит в перечень мероприятий и обычному человеку не рекомендуется."}], "notes": [], "block": "Первая помощь", "bk": "pp", "tier": 1, "psy": false, "aid": true}, {"n": 33, "title": "Первая помощь при отсутствии сознания, наружном кровотечении, инородном теле дыхательных путей", "kostyak": ["Все три состояния входят в перечень приказа Минздрава, и по каждому есть свой порядок. Общее у них одно — начинаем с оценки обстановки и собственной безопасности. Погибший спасатель никому не помог.", "Отсутствие сознания. Проверяю сознание: окликаю, аккуратно тормошу за плечи. Если реакции нет — запрокидываю голову, поднимаю подбородок и проверяю дыхание десять секунд: вижу движение груди, слышу, чувствую щекой. Если дыхание есть — вызываю скорую и перевожу человека в устойчивое боковое положение, чтобы язык не перекрыл дыхательные пути и он не захлебнулся рвотой. Дальше контролирую дыхание до приезда бригады.", "Если дыхания нет — это уже клиническая смерть, и я перехожу к сердечно-лёгочной реанимации.", "Наружное кровотечение. Сначала определяю вид: артериальное — алая кровь пульсирующей струёй, венозное — тёмная, течёт непрерывно, капиллярное — сочится по всей поверхности раны.", "Порядок остановки такой: прямое давление на рану, потом давящая повязка, при кровотечении из конечности — пальцевое прижатие артерии выше раны и максимальное сгибание конечности. Жгут — последнее средство, только при артериальном кровотечении из конечности, которое иначе не остановить.", "Про жгут скажу отдельно, потому что здесь чаще всего ошибаются. Жгут накладывается выше раны, поверх одежды или подкладки, до исчезновения пульса и остановки кровотечения. Обязательна записка со временем. Время — около часа в тёплое время года и до получаса на холоде. Неправильно наложенный жгут стоит человеку конечности, поэтому современный подход: сначала давление, жгут только когда без него не обойтись.", "Инородное тело верхних дыхательных путей. Если человек кашляет и может говорить — не мешаю, прошу кашлять. Если кашель беззвучный, он хватается за горло, синеет — наклоняю вперёд и делаю до пяти резких ударов между лопатками основанием ладони. Не помогло — приём Геймлиха: пять толчков в надчревную область снизу вверх. Чередую до эффекта или до потери сознания, после потери сознания — реанимация.", "У детей до года иначе: удары по спине в положении лицом вниз на предплечье и толчки в грудь двумя пальцами. Приём Геймлиха грудному ребёнку не делают."], "terms": ["оценка обстановки и обеспечение безопасных условий", "устойчивое боковое положение", "западение языка", "аспирация рвотных масс", "артериальное", "венозное", "капиллярное кровотечение", "прямое давление на рану", "давящая повязка", "пальцевое прижатие артерии", "кровоостанавливающий жгут и записка со временем", "приём Геймлиха", "полная и частичная обструкция дыхательных путей"], "follow": [{"q": "Что делать, если жгут наложен больше часа, а скорой нет?", "a": "Ослабить на несколько минут, прижав артерию пальцем, дать крови пройти, затем наложить снова чуть выше прежнего места и написать новое время. Это спорный момент, разные пособия дают разные интервалы, поэтому лучше честно сказать: главное — не забыть про жгут, зафиксировать время и передать эту информацию скорой."}, {"q": "Можно ли извлекать инородное тело пальцем?", "a": "Вслепую — нет, протолкнёшь глубже. Только если предмет виден и его реально захватить."}], "notes": [], "block": "Первая помощь", "bk": "pp", "tier": 1, "psy": false, "aid": true}, {"n": 9, "title": "Личность безопасного типа: социальная и психологическая характеристика", "kostyak": ["«Личность безопасного типа поведения — устоявшийся термин отечественной науки о безопасности. Его разработка связана с работами Мошкина, позже развивалась Гафнером, Кисляковым и другими авторами».", "«Определение: это человек, который безопасен для себя, для окружающих и для среды обитания, способен предвидеть опасности, избегать их, при необходимости грамотно действовать и не порождать опасности своим поведением».", "«Обращаю внимание на тройственность: безопасность для себя, для других, для природы. Человек, спасающий себя ценой риска для окружающих, к этому типу не относится».", "«Структуру раскрывают через компоненты. Мотивационно-ценностный: жизнь и здоровье как ценность, гуманистическая направленность, установка на ненасилие, ответственность».", "«Интеллектуальный, познавательный: знание опасностей и их источников, способность прогнозировать развитие ситуации, критичность мышления, устойчивость к манипуляциям и слухам».", "«Деятельностный: владение навыками безопасного поведения, первой помощи, самозащиты, действий при ЧС, доведённых до автоматизма».", "Заходит от психологии: «Психологическая характеристика — здесь я разверну подробнее. Эмоционально-волевая устойчивость и стрессоустойчивость, способность действовать при дефиците времени. Развитая саморегуляция и самоконтроль. Внутренний, интернальный локус контроля — человек считает, что исход зависит от него, а не от обстоятельств; это одна из наиболее устойчиво связанных с безопасным поведением черт. Адекватная самооценка: заниженная порождает беспомощность, завышенная — недооценку опасности. Зрелые копинг-стратегии, преобладание проблемно-ориентированного совладания. Низкая импульсивность и умеренная, а не повышенная склонность к риску. Развитая рефлексия и антиципация — способность предвосхищать последствия».", "Заходит от психологии: «Социальная характеристика: социальная зрелость и ответственность, эмпатия и готовность помогать, коммуникативная компетентность, способность к сотрудничеству и работе в группе, устойчивость к групповому давлению — умение сказать „нет“, когда группа склоняет к риску, толерантность и неагрессивность в конфликте».", "«Формирование — задача образования. Через содержание курса ОБЖ, через тренинги и практическую отработку действий, через уклад школы, через личный пример педагога. Формируется не знанием, а опытом безопасного поведения в реальных и моделируемых ситуациях».", "«Итоговая фраза, которую стоит сказать: личность безопасного типа — это цель воспитания в области безопасности, а культура безопасности личности из вопроса пятьдесят четыре — её содержательное наполнение. Понятия соотносятся как результат и его состав»."], "terms": ["личность безопасного типа поведения", "Мошкин", "Гафнер", "Кисляков", "мотивационно-ценностный", "интеллектуальный", "деятельностный компоненты", "интернальный локус контроля", "саморегуляция", "антиципация", "эмпатия", "устойчивость к групповому давлению", "рефлексия", "культура безопасности"], "follow": [{"q": "Чем личность безопасного типа отличается от просто осторожного человека?", "a": "— Осторожность — избегание. Личность безопасного типа не только избегает, но и действует: помогает другим, не создаёт опасности сама, способна принять решение в ситуации, где избежать уже нельзя. Плюс у неё есть ценностное основание, а не только страх."}, {"q": "Как это формировать в школе практически?", "a": "— Через деятельность: отработку алгоритмов эвакуации и первой помощи, ситуационные задачи и тренинги, проектную работу, обучение навыкам отказа и разрешения конфликтов, а также через среду, где безопасное поведение — норма взрослых, а не только требование к детям."}], "notes": [], "block": "Теория, риск, ЗОЖ", "bk": "teor", "tier": 1, "psy": true, "aid": false}, {"n": 47, "title": "Здоровье: характеристика, критерии, показатели, факторы", "kostyak": ["«Классическое определение Всемирной организации здравоохранения: здоровье — состояние полного физического, душевного и социального благополучия, а не только отсутствие болезней и физических дефектов».", "«Определение критикуют за идеальность: полного благополучия почти никто не достигает. Поэтому в науке используют динамическое понимание — здоровье как способность организма и личности адаптироваться к меняющимся условиям среды и сохранять функции».", "«Выделяют виды здоровья: соматическое, физическое, психическое и нравственное. Отдельно говорят о репродуктивном и профессиональном здоровье».", "«Уровни рассмотрения: индивидуальное здоровье, здоровье группы, общественное здоровье населения».", "«Критерии индивидуального здоровья: уровень и гармоничность физического развития, функциональное состояние систем организма, резервные возможности, уровень иммунной защиты, отсутствие хронических заболеваний, а также субъективное самочувствие».", "«Показатели общественного здоровья: демографические — рождаемость, смертность, продолжительность жизни; заболеваемость; инвалидность; физическое развитие населения».", "«Факторы, влияющие на здоровье, принято группировать в четыре блока: образ жизни, наследственность, состояние окружающей среды, уровень и качество медицинской помощи. Наибольший вклад отводят образу жизни — по разным оценкам около половины, точные проценты по источникам расходятся, поэтому назову порядок».", "Заходит от психологии: «Разверну психологическую составляющую. Психическое здоровье — сохранность психических функций, адекватность реакций, эмоциональная устойчивость. Психологическое здоровье, в традиции Дубровиной, шире: это гармония личности, способность к развитию и самореализации. Здесь работают понятия адаптации и дезадаптации, стрессоустойчивости, копинг-ресурсов, психологического благополучия. Отдельно назову понятие качества жизни, связанного со здоровьем: оно измеряется опросниками и включает субъективную оценку человеком своего состояния».", "«Для педагогики важна норма: здоровье школьника оценивают ещё и через уровень школьной адаптации, работоспособность и утомляемость в течение учебного дня»."], "terms": ["определение ВОЗ", "адаптация и дезадаптация", "соматическое", "психическое", "нравственное здоровье", "общественное здоровье", "резервы организма", "группы здоровья", "психологическое благополучие", "качество жизни", "стрессоустойчивость"], "follow": [{"q": "Почему определение ВОЗ критикуют?", "a": "— Оно описывает идеал, недостижимый в норме, статично и плохо операционализируется. Поэтому рядом с ним используют адаптационный подход и понятие функциональных резервов."}, {"q": "Чем психическое здоровье отличается от психологического?", "a": "— Психическое — медицинская категория, отсутствие расстройств и сохранность функций. Психологическое — характеристика личности: зрелость, гармония, способность справляться с трудностями и развиваться. Человек может не иметь диагноза и при этом иметь низкое психологическое благополучие."}], "notes": [], "block": "Теория, риск, ЗОЖ", "bk": "teor", "tier": 1, "psy": true, "aid": false}, {"n": 2, "title": "Национальная безопасность. Вероятностная оценка опасного события", "kostyak": ["«Национальная безопасность — защищённость личности, общества и государства от внутренних и внешних угроз, при которой обеспечиваются реализация конституционных прав, достойное качество жизни, суверенитет и устойчивое развитие страны».", "«Предмет национальной безопасности — угрозы национальным интересам и система мер по их нейтрализации. В России общий рамочный документ — Стратегия национальной безопасности Российской Федерации; точные реквизиты редакции я называть не берусь, но логика документа именно такая».", "«Традиционно выделяют виды: военная, государственная, экономическая, информационная, экологическая, продовольственная, общественная безопасность. Список в разных источниках варьируется».", "«Три уровня объектов принято разводить. Безопасность личности — жизнь, здоровье, права, свобода. Безопасность общества — материальные и духовные ценности, институты, социальная стабильность. Безопасность государства — суверенитет, конституционный строй, территориальная целостность».", "«Между ними бывает противоречие: усиление государственной безопасности может ограничивать свободы личности. Баланс этих уровней — самостоятельная задача политики безопасности».", "«Вероятностная оценка опасного события: опасность нельзя описать словом „есть или нет“, её описывают вероятностью реализации за единицу времени».", "«Базовая формула риска — вероятность события, умноженная на тяжесть последствий. Для расчёта используют статистику происшествий, дерево отказов и дерево событий, экспертные оценки, когда статистики нет».", "«Практический смысл: вероятностная оценка позволяет сравнивать разные по природе угрозы в одной шкале и распределять ресурсы туда, где ожидаемый ущерб выше»."], "terms": ["национальные интересы", "угроза", "вызов", "риск", "Стратегия национальной безопасности РФ", "суверенитет", "вероятность реализации опасности", "ожидаемый ущерб", "дерево отказов и дерево событий", "экспертная оценка"], "follow": [{"q": "Чем угроза отличается от опасности?", "a": "— Опасность потенциальна, это свойство среды или объекта причинить вред. Угроза — опасность, ставшая конкретной: есть источник, направленность и достаточная вероятность реализации."}, {"q": "Что делать, если статистики по событию нет?", "a": "— Переходить к экспертным методам и сценарному анализу: моделировать дерево событий, оценивать вероятности ветвей экспертно, брать консервативный сценарий."}], "notes": [], "block": "Теория, риск, ЗОЖ", "bk": "teor", "tier": 2, "psy": false, "aid": false}, {"n": 56, "title": "Уровни безопасности. «Безопасность» и «устойчивость». Основы управления рисками", "kostyak": ["«Уровни безопасности выстраивают по масштабу объекта: индивидуальная безопасность личности, безопасность малой группы и коллектива, общественная, национальная, региональная и глобальная».", "«Уровни связаны, но не сводятся друг к другу: безопасность государства не складывается автоматически из безопасности каждого гражданина, и наоборот».", "«Теперь соотношение категорий. Общее у безопасности и устойчивости в том, что обе описывают способность системы сохранять себя при внешнем воздействии, и обе оцениваются через риск».", "«Различие: безопасность — характеристика защищённости от вреда, взгляд от угрозы. Устойчивость — способность системы сохранять функционирование и восстанавливаться после воздействия, взгляд от самой системы».", "«Проще: безопасность отвечает на вопрос „не ударит ли“, устойчивость — „выдержим ли и восстановимся ли“. Объект может быть устойчив, но небезопасен для окружающих, — например, надёжно работающее химическое производство рядом с жилой застройкой».", "«Управление риском — циклический процесс из четырёх шагов: идентификация опасностей, оценка риска, выбор и реализация мер, контроль и пересмотр».", "«Методы воздействия на риск: устранение источника, снижение вероятности, снижение тяжести последствий, передача риска через страхование, принятие остаточного риска».", "«В социальных системах инструменты одни — нормы, обучение, информирование, социальная поддержка; в технических — резервирование, защитные системы, регламенты обслуживания; в природных — мониторинг, прогноз, инженерная защита и ограничение хозяйственной деятельности»."], "terms": ["уровни безопасности", "устойчивость системы", "остаточный риск", "идентификация опасностей", "оценка риска", "резервирование", "страхование риска", "управляющее воздействие", "обратная связь"], "follow": [{"q": "Можно ли считать устойчивость частью безопасности?", "a": "— В ряде подходов да: устойчивость рассматривают как условие безопасности, потому что система, теряющая функции от малого воздействия, защищённой быть не может. Но понятия не тождественны."}, {"q": "Что такое остаточный риск?", "a": "— Риск, сохраняющийся после всех принятых мер защиты. Он всегда больше нуля, и задача — довести его до приемлемого уровня и осознанно принять."}], "notes": [], "block": "Теория, риск, ЗОЖ", "bk": "teor", "tier": 2, "psy": false, "aid": false}, {"n": 66, "title": "Современные уровни риска опасных событий. Управление риском", "kostyak": ["«Начну с того, что риск сегодня — основной измеритель безопасности. Мировая практика перешла от концепции абсолютной безопасности к концепции приемлемого риска».", "«Концепция абсолютной безопасности предполагала: сделаем защиту такой, чтобы аварий не было вовсе. Практика показала, что это недостижимо: ресурсы конечны, а сложные системы всегда сохраняют остаточный риск».", "«Приемлемый риск — компромисс между уровнем защищённости и затратами на неё. Есть экономический предел: вкладывая всё в техническую защиту, мы отнимаем средства у здравоохранения, социальной сферы, и суммарный риск для населения растёт. Существует точка, где суммарный риск минимален, — это и есть ориентир».", "«По порядку величины индивидуальный риск гибели за год: приемлемым обычно считают уровень порядка десять в минус шестой степени, пренебрежимо малым — на порядок ниже, чрезмерным — порядка десять в минус третьей. Оговорюсь: конкретные значения различаются по странам, отраслям и источникам, я называю порядок величины, а не норматив».", "«Уровни риска в быту, на транспорте и в промышленности различаются на порядки, и субъективное восприятие риска не совпадает с расчётным: люди переоценивают редкие яркие опасности и недооценивают привычные».", "Заходит от психологии: «Это описано в психологии восприятия риска: работает эвристика доступности, и поэтому авиакатастрофа пугает сильнее, чем поездка на автомобиле, хотя расчётный риск говорит обратное. Для педагога это прямая практическая проблема: подросток недооценивает привычный риск — дорогу, воду, электричество — и переоценивает экзотический».", "«Управление риском — четыре шага: идентификация опасностей, оценка риска, выбор мер, контроль результата и пересмотр. Цикл повторяется».", "«Стратегии воздействия: устранение источника, снижение вероятности, снижение тяжести последствий, передача риска — страхование, и принятие остаточного риска. Плюс информирование населения и обучение как самостоятельный, самый дешёвый инструмент»."], "terms": ["концепция приемлемого риска", "концепция абсолютной безопасности", "остаточный риск", "экономический предел безопасности", "индивидуальный и социальный риск", "восприятие риска", "управление риском", "страхование как передача риска"], "follow": [{"q": "Кто решает, какой риск приемлем?", "a": "— Общество через государство: нормативы, экспертиза, общественное обсуждение. Это не чисто техническое решение, в нём есть ценностная составляющая — сколько общество готово платить за спасённую жизнь."}, {"q": "Почему нельзя просто вкладывать в безопасность больше?", "a": "— Потому что ресурсы ограничены и перераспределяются. Сверхзатраты на один вид защиты оголяют другие сферы, и суммарный риск для того же населения начинает расти."}], "notes": [], "block": "Теория, риск, ЗОЖ", "bk": "teor", "tier": 2, "psy": false, "aid": false}, {"n": 54, "title": "Культура безопасности личности и её компонентный состав", "kostyak": ["«Культура безопасности личности — устойчивая система ценностей, знаний, умений и привычек поведения, которая позволяет человеку предвидеть опасности, избегать их и грамотно действовать при их возникновении».", "«Понятие пришло в широкий оборот после анализа крупных техногенных аварий: выяснилось, что техника исправна, инструкции написаны, а люди действуют вопреки им. Значит, дело в культуре, а не только в регламенте».", "«Компонентный состав обычно раскрывают через четыре-пять блоков. Первый — ценностно-мотивационный: отношение к жизни и здоровью как к ценности, установка на безопасное поведение, ответственность за себя и окружающих».", "«Второй — когнитивный, или знаниевый: знание опасностей, их источников, правил поведения, порядка действий при ЧС, основ первой помощи».", "«Третий — деятельностный, операциональный: сформированные умения и навыки — эвакуироваться, оказать помощь, пользоваться средствами защиты, оценивать обстановку».", "«Четвёртый — эмоционально-волевой: способность сохранять самообладание, управлять страхом, действовать в условиях дефицита времени и информации».", "«Пятый, который выделяют не все авторы, — рефлексивный: умение анализировать собственный опыт и ошибки, прогнозировать последствия своих решений».", "«Формируется культура безопасности через образование, семью, среду и личный опыт. В школе — прежде всего через предмет ОБЖ и уклад образовательной организации; при этом знания без ценностной установки не работают, ученик знает правила и всё равно нарушает»."], "terms": ["культура безопасности", "ценностно-мотивационный компонент", "когнитивный компонент", "деятельностный компонент", "эмоционально-волевой компонент", "рефлексия", "безопасное поведение", "готовность к действиям в ЧС"], "follow": [{"q": "Как измерить культуру безопасности у школьника?", "a": "— Комплексно: тесты знаний, наблюдение за реальным поведением и учебными эвакуациями, опросники ценностных ориентаций и отношения к риску, анализ поведения в проблемных ситуациях. Только знаниевый срез недостаточен."}, {"q": "Почему знание правил не гарантирует безопасного поведения?", "a": "— Между знанием и поступком стоит мотивация, эмоциональное состояние и групповые нормы. Если в среде рискованное поведение поощряется, знания проигрывают."}], "notes": [], "block": "Теория, риск, ЗОЖ", "bk": "teor", "tier": 2, "psy": false, "aid": false}, {"n": 58, "title": "Причины проявления опасности. Человек как источник опасности", "kostyak": ["«Опасность существует потенциально, а проявляется при совпадении условий. Обычно называют три группы причин: естественные процессы, технические факторы и человеческий фактор».", "«Модель, которую удобно проговорить: опасность реализуется, когда совпали источник, условие реализации и незащищённый объект. Уберите любое звено — события не будет».", "«Человеческий фактор в статистике аварий — ведущая группа причин; по разным отраслям оценки различаются, но лидирующая роль признаётся повсеместно».", "«Разложу его. Первое — недостаток знаний и умений: человек не обучен, не понимает опасности процесса».", "«Второе — нарушение мотивации: человек знает и умеет, но не хочет соблюдать правила, потому что нарушение выгоднее — быстрее, удобнее, привычнее для коллектива».", "«Третье — психофизиологические причины: утомление, монотония, стресс, эмоциональная напряжённость, болезнь, алкогольное или наркотическое опьянение, снижение внимания».", "«Четвёртое — несоответствие человека требованиям деятельности: по скорости реакции, устойчивости внимания, темпераменту, состоянию здоровья».", "Заходит от психологии: «Здесь уместно назвать теорию склонности к несчастным случаям и работы по психологии труда: доля людей стабильно чаще попадает в происшествия, и это связывают с личностными чертами — импульсивностью, экстернальным локусом контроля, низкой самооценкой опасности, склонностью к риску. Отсюда практический вывод: профотбор, психологическое сопровождение, режим труда и отдыха работают на безопасность не хуже техники».", "«Итог: человек — источник опасности как оператор, как проектировщик, как руководитель, принимающий решения, и как участник социальной группы, задающей нормы поведения»."], "terms": ["человеческий фактор", "ошибочное действие", "нарушение против ошибки", "психофизиологическое состояние", "утомление и монотония", "локус контроля", "профессиональный отбор", "надёжность оператора", "склонность к риску"], "follow": [{"q": "Ошибка и нарушение — одно и то же?", "a": "— Нет, и это важное различие. Ошибка непреднамеренна, человек хотел сделать правильно. Нарушение осознанно, человек знает правило и сознательно его обходит. Меры разные: против ошибок — обучение и эргономика, против нарушений — мотивация, контроль и работа с нормами коллектива."}, {"q": "Как снизить влияние человеческого фактора?", "a": "— Проектировать технику под возможности человека, а не наоборот; нормировать режим труда и отдыха; вести профотбор и обучение; формировать культуру безопасности, где сообщать об ошибке безопаснее, чем скрывать."}], "notes": [], "block": "Теория, риск, ЗОЖ", "bk": "teor", "tier": 2, "psy": false, "aid": false}, {"n": 11, "title": "Опасные ЧС в природе: классификация, характеристика, закономерности", "kostyak": ["Начну с определения: чрезвычайная ситуация природного характера — это обстановка на определённой территории, сложившаяся в результате опасного природного явления, которое повлекло или может повлечь человеческие жертвы, ущерб здоровью, материальные потери и нарушение условий жизнедеятельности людей.", "Классифицируют такие ЧС прежде всего по генезису, то есть по происхождению самого явления. Первая группа — геофизические: землетрясения и извержения вулканов.", "Вторая группа — геологические, их ещё называют экзогенными: оползни, сели, обвалы, снежные лавины, карстовые провалы, эрозия почв.", "Третья — метеорологические и агрометеорологические: ураганы, бури, смерчи, крупный град, сильные ливни и снегопады, засуха, заморозки, сильные морозы.", "Четвёртая — гидрологические и морские гидрологические: наводнения, половодья и паводки, заторы и зажоры льда, цунами, тайфуны, ранний ледостав.", "Пятая — природные пожары: лесные, торфяные, степные, подземные пожары горючих ископаемых. И шестая группа — биолого-социальные: эпидемии и пандемии среди людей, эпизоотии у животных, эпифитотии у растений. Отдельно выделяют космические факторы — падение крупных метеоритов, магнитные бури.", "Отдельно назову закономерности проявления, это ключевая часть вопроса. Первая — пространственная приуроченность: каждому опасному явлению соответствуют определённые территории, землетрясения происходят в сейсмических поясах, а не где угодно.", "Вторая закономерность — обратная связь интенсивности и повторяемости: чем сильнее явление, тем реже оно случается. Третья — каждому явлению предшествуют предвестники, специфические признаки. Четвёртая — при всей внезапности природная ЧС поддаётся прогнозу, вероятностному или детерминированному. И пятая — практически всегда можно предусмотреть меры защиты, причём как активные, инженерные, так и пассивные, то есть уклонение от опасности.", "Практический вывод из этих закономерностей простой: прогноз и заблаговременная подготовка снижают ущерб сильнее, чем любые действия в момент самой ЧС."], "terms": ["генезис ЧС", "геофизические", "геологические (экзогенные)", "метеорологические", "гидрологические", "биолого-социальные", "эпизоотия", "эпифитотия", "пространственная приуроченность", "предвестники", "вероятностный прогноз", "активные и пассивные меры защиты"], "follow": [{"q": "Приведите пример эпизоотии и объясните, почему это ЧС.", "a": "Африканская чума свиней или ящур. Это ЧС, потому что массовое заболевание животных ведёт к уничтожению поголовья, карантину на территории, экономическому ущербу и риску перехода инфекции на человека при зоонозах."}, {"q": "Чем опасное природное явление отличается от чрезвычайной ситуации?", "a": "Явление — это сам физический процесс, землетрясение или паводок. Чрезвычайной ситуацией оно становится тогда, когда затрагивает людей: появляются пострадавшие, ущерб, нарушение условий жизнедеятельности. Землетрясение в безлюдной пустыне остаётся явлением."}], "notes": [{"label": "Разворот на школу", "text": "для образовательной организации это означает, что перечень отрабатываемых сценариев определяется географией. Школа в Приморье готовится к тайфунам и наводнениям, школа в Сибири — к сильным морозам и лесным пожарам, и планы действий должны быть привязаны к своей территории, а не написаны по шаблону."}], "block": "ЧС, ГО, РСЧС", "bk": "chs", "tier": 2, "psy": false, "aid": false}, {"n": 13, "title": "Классификация техногенных ЧС. ЧС на системах жизнеобеспечения", "kostyak": ["Техногенная чрезвычайная ситуация — это обстановка, вызванная аварией или катастрофой на объекте, созданном человеком. Ключевое отличие от природной ЧС в том, что источник находится внутри техносферы и почти всегда связан с человеческим фактором или износом оборудования.", "Классификация по типу источника выглядит так. Первое — транспортные аварии и катастрофы: железнодорожные, авиационные, на автодорогах, на водном транспорте, на магистральных трубопроводах, в метрополитене.", "Второе — пожары и взрывы на промышленных объектах, в зданиях с массовым пребыванием людей, на транспортных коммуникациях.", "Третье — аварии с выбросом аварийно химически опасных веществ, АХОВ. Четвёртое — аварии с выбросом радиоактивных веществ. Пятое — с выбросом биологически опасных веществ.", "Шестое — внезапное обрушение зданий и сооружений. Седьмое — гидродинамические аварии, то есть прорыв плотин с образованием волны прорыва и зоны катастрофического затопления.", "И восьмое, отдельная группа, — аварии на системах жизнеобеспечения. Это аварии на электроэнергетических системах, на коммунальных системах: водоснабжении, канализации, теплосетях, газоснабжении, а также на очистных сооружениях.", "Про системы жизнеобеспечения скажу подробнее, потому что это самый частый в реальной практике тип ЧС. Их особенность в том, что поражающий фактор здесь чаще не мгновенный, а отложенный: сама авария людей не убивает, но отключение
