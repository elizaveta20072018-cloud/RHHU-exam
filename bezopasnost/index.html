 тепла зимой в многоквартирном доме или прекращение подачи воды в больнице за несколько суток создаёт угрозу жизни и здоровью большого числа людей.", "Вторая особенность — каскадность. Отключение электроснабжения останавливает насосные станции, следом падает водоснабжение и отопление, и одна авария разворачивается в комплексную ЧС. Поэтому на объектах с массовым пребыванием людей предусматривают резервные источники питания и планируют устойчивость функционирования.", "По масштабу техногенные ЧС классифицируются так же, как и любые другие: локальная, муниципальная, межмуниципальная, региональная, межрегиональная и федеральная. Критерии — количество пострадавших, размер материального ущерба и границы зоны ЧС."], "terms": ["техносфера", "аварийно химически опасные вещества (АХОВ)", "зона химического заражения", "гидродинамическая авария", "волна прорыва", "системы жизнеобеспечения", "каскадный эффект", "устойчивость функционирования объекта", "локальная", "муниципальная", "межмуниципальная", "региональная", "межрегиональная", "федеральная ЧС"], "follow": [{"q": "Назовите примеры АХОВ и первичные действия при выбросе.", "a": "Хлор, аммиак, сернистый ангидрид, синильная кислота. Действия: защитить органы дыхания, выходить из зоны заражения перпендикулярно направлению ветра. При хлоре, который тяжелее воздуха, подниматься на верхние этажи, при аммиаке, который легче воздуха, наоборот, спускаться вниз."}, {"q": "Чем авария отличается от катастрофы?", "a": "Авария — это повреждение или разрушение технического объекта без гибели людей либо с единичными пострадавшими. Катастрофа — крупная авария с человеческими жертвами и значительным ущербом. Разница проводится по тяжести последствий, а не по причине."}], "notes": [{"label": "Разворот на школу", "text": "для школы техногенный риск номер один — это не авария на химкомбинате, а именно жизнеобеспечение: отключение отопления, прорыв теплотрассы, потеря электроснабжения. Отсюда паспорт безопасности объекта, план действий по предупреждению и ликвидации ЧС и заранее продуманный порядок роспуска или перевода детей на дистанционное обучение."}], "block": "ЧС, ГО, РСЧС", "bk": "chs", "tier": 2, "psy": false, "aid": false}, {"n": 14, "title": "Опасные и чрезвычайные ситуации социального характера", "kostyak": ["Начну с разграничения понятий: опасная ситуация — это условия, при которых возникает угроза жизни, здоровью или имуществу; чрезвычайная ситуация — обстановка на определённой территории, сложившаяся в результате события и повлёкшая жертвы, ущерб или нарушение условий жизнедеятельности.", "Ситуации социального характера отличаются от природных и техногенных источником: источником здесь выступает сам человек, социальные группы и общественные отношения.", "По природе воздействия их принято делить на четыре группы: психическое воздействие (шантаж, мошенничество, психологическое давление), физическое (разбой, террористический акт, захват заложников), экономическое (безработица, инфляция, коррупция) и ситуации, связанные с массовым поведением людей.", "По масштабу — от локальных и объектовых до региональных и федеральных; отдельно выделяют конфликты международного уровня.", "По длительности — кратковременные, вроде теракта или массовых беспорядков, и затяжные, вроде миграционных кризисов или наркотизации населения.", "Причины лежат в социальной сфере: расслоение общества, безработица, разрушение социальных институтов, межнациональная и религиозная напряжённость, снижение уровня правовой культуры.", "Защита строится по трём линиям: правовая, куда входит законодательство и деятельность правоохранительных органов; организационная — режимные меры, охрана объектов, единая система предупреждения и ликвидации ЧС; и индивидуальная — знание правил поведения, умение оценивать риск, отказ от виктимного поведения.", "В образовательной организации эта тема закрыта курсом «Основы безопасности и защиты Родины» и работой по формированию культуры безопасности."], "terms": ["чрезвычайная ситуация социального характера", "источник опасности", "классификация по природе воздействия", "масштаб ЧС", "РСЧС (единая государственная система предупреждения и ликвидации ЧС)", "виктимность", "культура безопасности жизнедеятельности", "социальная напряжённость", "превенция"], "follow": [{"q": "Чем социальные ЧС опаснее природных?", "a": "Тем, что источник разумен и адаптируется: он выбирает время, место и уязвимую цель, а значит защита не может быть только технической, нужна работа с человеком."}, {"q": "Что относят к социальным опасностям в школе?", "a": "Буллинг, вовлечение в деструктивные сообщества, распространение ПАВ, конфликты на межнациональной почве, угрозу вооружённого нападения."}], "notes": [{"label": "Заходит от психологии", "text": "виктимное поведение как фактор риска — часть социальных ЧС реализуется потому, что жертва сама подаёт сигналы уязвимости. Об этом можно сказать отдельно, это сильная деталь."}], "block": "Социальные угрозы", "bk": "soc", "tier": 2, "psy": false, "aid": false}, {"n": 12, "title": "Коллективная и индивидуальная защита при природных ЧС", "kostyak": ["Защита населения при природных ЧС строится по двум линиям — коллективная и индивидуальная, и обе опираются на заблаговременную подготовку.", "К коллективной защите относят инженерные сооружения и организационные меры. Инженерные — это защитные сооружения гражданской обороны: убежища, противорадиационные укрытия, укрытия простейшего типа, а также приспособленные заглублённые помещения, подвалы, подземные переходы.", "Но для природных ЧС специфика другая: здесь на первом месте инженерная защита территории. Дамбы и обвалование при наводнениях, берегоукрепление, селезащитные плотины и селепропускные каналы, противолавинные галереи и профилактический спуск лавин, сейсмостойкое строительство, минерализованные полосы и просеки против лесных пожаров.", "Вторая организационная мера коллективной защиты — эвакуация и рассредоточение населения из зоны опасности, а также временное размещение в пунктах временного размещения, ПВР.", "Третья — оповещение. Здесь работает комплексная система экстренного оповещения населения, сигнал «Внимание всем!» сиренами с последующим речевым сообщением, плюс СМС-рассылка и информирование через ОКСИОН.", "Индивидуальная защита при природных ЧС включает средства защиты органов дыхания — при задымлении от лесных и торфяных пожаров это фильтрующие противогазы, респираторы, самоспасатели, в простейшем варианте ватно-марлевая повязка.", "Сюда же относят средства защиты кожи и подручные средства, спасательные жилеты и подручные плавсредства при наводнении, а также медицинские средства защиты — индивидуальную аптечку и перевязочный пакет.", "Замечу важное: в природных ЧС ведущая роль принадлежит не столько технике, сколько знанию алгоритма поведения. Правильные действия при землетрясении, урагане или паводке спасают больше жизней, чем любые табельные средства."], "terms": ["защитные сооружения гражданской обороны", "противорадиационное укрытие", "укрытие простейшего типа", "инженерная защита территории", "обвалование", "рассредоточение", "пункт временного размещения", "сигнал «Внимание всем!»", "КСЭОН", "ОКСИОН", "СИЗ органов дыхания", "ватно-марлевая повязка"], "follow": [{"q": "Что такое сигнал «Внимание всем!» и как на него реагировать?", "a": "Это единый предупредительный сигнал, подаётся сиренами и прерывистыми гудками. По нему нужно немедленно включить телевизор, радио или проверить сообщение на телефоне и выслушать речевую информацию о том, что произошло и что делать. Сам звук сирены не говорит о характере угрозы, он только требует получить информацию."}, {"q": "Чем убежище отличается от противорадиационного укрытия?", "a": "Убежище защищает от полного комплекса поражающих факторов, включая ударную волну и отравляющие вещества, оно герметично и имеет фильтровентиляционное оборудование. Противорадиационное укрытие защищает в основном от ионизирующего излучения и радиоактивной пыли, герметичности такого уровня не имеет."}], "notes": [{"label": "Разворот на школу", "text": "в образовательной организации это прямо превращается в обучение. Инструктажи, отработка сигнала «Внимание всем!», плановые тренировки по эвакуации, курс «Основы безопасности и защиты Родины». Ребёнок, у которого алгоритм доведён до автоматизма, в реальной ситуации не теряет первые критические минуты."}], "block": "ЧС, ГО, РСЧС", "bk": "chs", "tier": 2, "psy": false, "aid": false}, {"n": 20, "title": "Эвакуация населения: организация, проведение, обязанности населения", "kostyak": ["Эвакуация населения — это организованный вывоз и вывод населения, материальных и культурных ценностей из зоны чрезвычайной ситуации или из зоны вероятной опасности в безопасный район с последующим размещением и первоочередным жизнеобеспечением.", "Отдельно назову смежный термин: рассредоточение — это вывоз в загородную зону тех работников, которые продолжают работать на объектах в зоне опасности и посменно возвращаются туда. Различие спрашивают часто.", "Классифицирую эвакуацию по нескольким основаниям. По охвату населения — общая, когда вывозятся все категории, и частичная, когда вывозится нетрудоспособное население, дети с образовательными организациями, пенсионеры.", "По срокам проведения — упреждающая, то есть заблаговременная, по прогнозу угрозы, и экстренная, безотлагательная, когда ЧС уже возникла.", "По масштабу — локальная, местная и региональная, в зависимости от того, вывозится ли население в пределах города, за пределы населённого пункта или в другой субъект.", "Организацией эвакуации занимаются эвакуационные органы: эвакуационные комиссии, сборные эвакуационные пункты, промежуточные пункты эвакуации, пункты посадки и высадки, приёмные эвакуационные пункты и эвакоприёмные комиссии в безопасных районах.", "Логика движения такая. Население получает сигнал и информацию через систему оповещения, прибывает на сборный эвакуационный пункт, где проходит регистрацию и распределяется по транспорту или пешим колоннам. Далее — движение по маршруту, при необходимости через промежуточный пункт эвакуации, затем прибытие на приёмный эвакуационный пункт и размещение в безопасном районе.", "Способы эвакуации — транспортный, пеший и комбинированный. Комбинированный считается основным, потому что позволяет вывезти нетранспортабельные и уязвимые категории транспортом, а остальных вывести пешими колоннами.", "Обязанности населения при эвакуации перечислю коротко: получив сигнал, выключить электроприборы, газ и воду, взять документы, деньги, лекарства, запас продуктов и воды на несколько суток, тёплые вещи и средства индивидуальной защиты. Личные вещи — в количестве, которое человек может нести сам, с биркой с фамилией и адресом.", "Далее — прибыть на сборный эвакуационный пункт в назначенное время, зарегистрироваться, не покидать колонну самовольно, выполнять указания старшего. Детям дошкольного возраста в карман вкладывается записка с фамилией, именем и адресом. Соседей и маломобильных людей по возможности оповестить."], "terms": ["эвакуация", "рассредоточение", "загородная зона", "безопасный район", "общая и частичная эвакуация", "упреждающая и экстренная эвакуация", "эвакуационная комиссия", "сборный эвакуационный пункт (СЭП)", "промежуточный пункт эвакуации", "приёмный эвакуационный пункт (ПЭП)", "комбинированный способ эвакуации", "первоочередное жизнеобеспечение"], "follow": [{"q": "Чем эвакуация отличается от рассредоточения?", "a": "Эвакуируемое население вывозится и остаётся в безопасном районе до особого распоряжения. Рассредоточиваемые работники размещаются в загородной зоне, но продолжают ездить на работу в зону опасности посменно. Разница в том, продолжает человек трудовую деятельность на объекте или нет."}, {"q": "Почему комбинированный способ считается основным?", "a": "Потому что транспорта на всё население одновременно не хватает, а время ограничено. Комбинированный способ позволяет использовать транспорт для тех, кто не может идти пешком, и одновременно выводить основную массу населения пешими колоннами, что резко сокращает общее время эвакуации."}], "notes": [{"label": "Разворот на школу", "text": "школа эвакуируется организованно, вместе с педагогами, списками детей и медицинской документацией. Учитель здесь становится старшим колонны и отвечает за поимённый учёт. Отдельная задача — передача детей родителям в безопасном районе строго по спискам, потому что при неразберихе именно на этом этапе теряются дети. И отдельно стоит различать эту эвакуацию и обычную пожарную эвакуацию из здания: у них разные сигналы, разные маршруты и разная продолжительность."}], "block": "ЧС, ГО, РСЧС", "bk": "chs", "tier": 2, "psy": false, "aid": false}, {"n": 21, "title": "Средства индивидуальной защиты в ЧС. Средства коллективной защиты", "kostyak": ["Средства индивидуальной защиты делятся на три группы: средства защиты органов дыхания, средства защиты кожи и медицинские средства защиты. Начну с органов дыхания, потому что через дыхательные пути поступает большинство поражающих веществ.", "Средства защиты органов дыхания бывают фильтрующие и изолирующие. Принцип фильтрующих — очистка вдыхаемого воздуха от вредных примесей при прохождении через фильтрующе-поглощающую коробку. Обязательное условие их применения — достаточное содержание кислорода в воздухе и известный состав примеси.", "К фильтрующим относятся гражданские противогазы типа ГП-7 и ГП-5, детские противогазы ПДФ, камера защитная детская для детей до полутора лет, промышленные противогазы, респираторы типа Р-2 и «Лепесток», а также простейшие средства — ватно-марлевая повязка и противопыльная тканевая маска.", "Изолирующие средства полностью отсекают человека от внешней среды и подают кислород из собственного источника — из регенеративного патрона или баллона. Применяются там, где фильтрующие бессильны: при недостатке кислорода, при очень высоких концентрациях, при неизвестном составе. Это изолирующие противогазы типа ИП, дыхательные аппараты пожарных, шланговые противогазы. Отдельная категория — самоспасатели для выхода из задымлённой зоны.", "Средства защиты кожи тоже делятся на фильтрующие и изолирующие. Фильтрующие — это защитная фильтрующая одежда, пропитанная специальным составом. Изолирующие — общевойсковой защитный комплект ОЗК и лёгкий защитный костюм Л-1, они изготовлены из прорезиненной ткани и не пропускают ни жидкости, ни пары. Плюс подручные средства — плащи, накидки, резиновые сапоги и перчатки.", "Медицинские средства защиты — это индивидуальная аптечка, индивидуальный противохимический пакет для обработки кожи при попадании отравляющих веществ, и индивидуальный перевязочный пакет для наложения повязки при ранениях и ожогах.", "Теперь коллективная защита. Основа — защитные сооружения гражданской обороны. Первый тип — убежища, они защищают от полного комплекса поражающих факторов: ударной волны, светового излучения, проникающей радиации, отравляющих веществ и биологических средств.", "Убежище имеет основные помещения для укрываемых и вспомогательные, тамбур-шлюз, фильтровентиляционную камеру, два выхода, один из которых аварийный, а также запасы воды и продовольствия. Вентиляция работает в трёх режимах: чистой вентиляции, фильтровентиляции и полной изоляции с регенерацией внутреннего воздуха.", "Второй тип — противорадиационные укрытия, защищающие от ионизирующего излучения и радиоактивной пыли. Третий — укрытия простейшего типа, то есть открытые и перекрытые щели. Дополнительно используются заглублённые помещения: подвалы, подземные переходы, горные выработки.", "Порядок применения общий: средства индивидуальной защиты выдаются заблаговременно, хранятся на объекте, а укрытие производится по сигналу «Внимание всем!» после получения речевой информации. Обязательное условие эффективности — подгонка противогаза по размеру и предварительная тренировка, иначе в реальной ситуации человек им не воспользуется."], "terms": ["СИЗ органов дыхания", "кожи", "медицинские средства защиты", "фильтрующие и изолирующие", "фильтрующе-поглощающая коробка", "противогаз ГП-7", "детский противогаз ПДФ", "камера защитная детская", "респиратор Р-2", "изолирующий противогаз", "самоспасатель", "защитная фильтрующая одежда", "ОЗК", "Л-1", "индивидуальный противохимический пакет", "перевязочный пакет", "убежище", "тамбур-шлюз", "режимы вентиляции: чистая вентиляция", "фильтровентиляция", "полная изоляция"], "follow": [{"q": "Когда фильтрующий противогаз применять нельзя?", "a": "При недостатке кислорода в воздухе, при очень высоких концентрациях опасного вещества, при неизвестном составе примеси, а также если вещество не задерживается данной маркой фильтра. Во всех этих случаях нужен изолирующий тип."}, {"q": "Что такое режим полной изоляции в убежище?", "a": "Режим, при котором наружный воздух не забирается вообще, а внутренний очищается от углекислого газа и обогащается кислородом с помощью регенеративных установок. Применяется при сильной задымлённости или загазованности снаружи, когда фильтры не справляются."}], "notes": [{"label": "Разворот на школу", "text": "в школе это выражается в отработке норматива надевания противогаза на уроках ОБЗР, в знании персоналом закреплённого защитного сооружения и маршрута к нему, а также в понимании, что для младших детей существуют отдельные средства — детские противогазы и защитные детские камеры, взрослый противогаз ребёнку не подходит."}], "block": "ЧС, ГО, РСЧС", "bk": "chs", "tier": 2, "psy": false, "aid": false}, {"n": 27, "title": "Организация АСДНР в зонах ЧС", "kostyak": ["АСДНР расшифровывается как аварийно-спасательные и другие неотложные работы. Это комплекс работ по спасению людей, материальных и культурных ценностей, локализации ЧС и подавлению или снижению до минимально возможного уровня воздействия поражающих факторов.", "Название состоит из двух частей, и их важно различать. Аварийно-спасательные работы — это разведка маршрутов и зон, локализация и тушение пожаров, розыск и извлечение пострадавших из завалов и повреждённых зданий, оказание первой помощи, эвакуация людей из опасной зоны, санитарная обработка и обеззараживание.", "Другие неотложные работы обеспечивают спасательные: прокладка колонных путей и устройство проездов в завалах, укрепление или обрушение конструкций, угрожающих обвалом, локализация аварий на коммунально-энергетических сетях, ремонт и восстановление линий связи, оборудование пунктов водоснабжения.", "Организационно работы разворачиваются по этапам. Первый — разведка зоны ЧС и оценка обстановки, определение границ и объёма работ. Второй — выдвижение и ввод сил, распределение по участкам и объектам. Третий — собственно спасательные работы, они ведутся непрерывно, посменно, днём и ночью, до полного завершения. Четвёртый — ликвидация последствий и передача объектов.", "Руководство работами осуществляет руководитель ликвидации чрезвычайной ситуации, и его решения на месте обязательны для всех. Это принципиальное положение: единоначалие в зоне ЧС.", "Теперь про специфику на заражённой территории. При радиоактивном заражении главное — фактор дозы. Работы ведутся с ограничением времени пребывания, с обязательным дозиметрическим контролем, посменно, в средствах индивидуальной защиты, с ведением радиационной разведки и обозначением границ зон заражения. Заключительный этап — дезактивация техники, зданий, территории и полная санитарная обработка личного состава.", "При заражении отравляющими и аварийно химически опасными веществами главное — химическая разведка и определение типа вещества, потому что от этого зависит выбор средств защиты и способ обеззараживания. Личный состав работает в изолирующих средствах защиты кожи и органов дыхания, проводится дегазация местности, техники и одежды, пострадавшим оказывается первая помощь с применением антидотов, а зона заражения обозначается и оцепляется.", "Обобщу термины обеззараживания, потому что их часто путают: дезактивация — удаление радиоактивных веществ, дегазация — обезвреживание отравляющих и АХОВ, дезинфекция — уничтожение болезнетворных микроорганизмов. Санитарная обработка людей бывает частичная, прямо в зоне, и полная, на специальных пунктах.", "При стихийных бедствиях содержание работ определяется характером бедствия. При землетрясении основное — разбор завалов и извлечение пострадавших, при наводнении — спасение людей на воде и с крыш, эвакуация плавсредствами, при лесных пожарах — локализация огня, устройство заградительных полос, эвакуация населённых пунктов, при снежных заносах — расчистка дорог и жизнеобеспечение отрезанных населённых пунктов.", "Отдельная составляющая всех этих работ — психологическая помощь пострадавшим и родственникам погибших. В структуре МЧС России для этого есть штатная психологическая служба, и это тот участок, где профессия психолога прямо смыкается с системой ликвидации ЧС."], "terms": ["аварийно-спасательные и другие неотложные работы", "разведка зоны ЧС", "руководитель ликвидации чрезвычайной ситуации", "единоначалие", "колонные пути", "дозиметрический контроль", "радиационная и химическая разведка", "дезактивация", "дегазация", "дезинфекция", "частичная и полная санитарная обработка", "антидот", "аварийно-спасательные формирования", "психологическая служба МЧС России"], "follow": [{"q": "Кто руководит ликвидацией ЧС?", "a": "Руководитель ликвидации ЧС, назначаемый в зависимости от уровня и масштаба ситуации — от руководителя объектового звена до должностного лица федерального уровня. По прибытии в зону он принимает полномочия на себя, и его указания обязательны для всех находящихся там граждан и организаций."}, {"q": "Почему при радиационной аварии работы ведутся посменно?", "a": "Потому что нормируется не только концентрация, но и суммарная полученная доза. Ограничение времени пребывания в зоне — основной способ не допустить превышения допустимой дозы облучения, поэтому смены рассчитываются по данным дозиметрического контроля."}], "notes": [{"label": "Разворот на школу", "text": "от школы никто не ждёт участия в АСДНР. Её задача — не создать спасателям дополнительную работу: обеспечить быструю и полную эвакуацию, дать точный поимённый учёт детей и работников, освободить подъезды для техники и передать прибывшим подразделениям информацию о том, кто и где может оставаться внутри."}], "block": "ЧС, ГО, РСЧС", "bk": "chs", "tier": 2, "psy": false, "aid": false}, {"n": 63, "title": "Кризисное управление в ЧС: РСЧС и гражданская оборона — структуры, задачи, функции", "kostyak": ["Кризисное управление в чрезвычайных ситуациях — это управление в условиях дефицита времени, неполноты информации и высокой цены ошибки. Отсюда три его особенности: жёсткая вертикаль и единоначалие, заранее заготовленные типовые решения в виде планов, и переход системы в особые режимы функционирования.", "В России такое управление обеспечивают две взаимосвязанные государственные системы — РСЧС и гражданская оборона. Обе замкнуты на МЧС России как федеральный орган и опираются на общую инфраструктуру.", "РСЧС — единая государственная система предупреждения и ликвидации ЧС. Работает в мирное время, при ЧС природного и техногенного характера. Пять уровней: федеральный, межрегиональный, региональный, муниципальный, объектовый. Две группы подсистем: функциональные, создаваемые федеральными органами по отраслям, и территориальные, создаваемые в субъектах.", "Управленческий каркас РСЧС состоит из трёх типов органов, и я специально разделю их по функции. Координационные органы — комиссии по предупреждению и ликвидации ЧС и обеспечению пожарной безопасности — принимают решения и согласовывают действия разных ведомств. Постоянно действующие органы управления ведут повседневную организацию работы. Органы повседневного управления — центры управления в кризисных ситуациях и единые дежурно-диспетчерские службы — обеспечивают круглосуточное реагирование и сбор информации.", "Гибкость управления в РСЧС достигается тремя режимами функционирования: повседневная деятельность, повышенная готовность, чрезвычайная ситуация. Смена режима — это управленческое решение, которое меняет полномочия должностных лиц и порядок работы всей системы на территории.", "Гражданская оборона — система защиты населения от опасностей, возникающих при военных конфликтах, а также при ЧС мирного времени. Общее руководство осуществляет Правительство Российской Федерации, в организациях — руководители по должности. Здесь вертикаль ещё жёстче, а перевод системы в готовность идёт по установленным степеням готовности гражданской обороны.", "Теперь сопоставление, это ядро вопроса. Различия в трёх пунктах. Первое — условия применения: РСЧС работает в мирное время, ГО ориентирована прежде всего на военное время. Второе — правовая основа: у РСЧС федеральный закон о защите населения и территорий от ЧС, у ГО — федеральный закон о гражданской обороне. Третье — характер управления: РСЧС ближе к межведомственной координации, ГО — к мобилизационной вертикали.", "Сходства при этом важнее различий. У систем общий федеральный орган — МЧС России, общие силы и средства, общий фонд защитных сооружений, единая система оповещения населения, во многом общие органы управления на местах и один и тот же обученный персонал. Практически это одна инфраструктура, работающая в двух правовых режимах.", "Отсюда логика перехода: при переводе страны на военное положение РСЧС не упраздняется, а её структура и силы используются в интересах гражданской обороны. Такое построение экономит ресурсы и избавляет от необходимости создавать вторую систему с нуля.", "И завершу выводом: эффективность кризисного управления определяется тем, что сделано до кризиса — планированием, обучением, созданием резервов и отработкой взаимодействия. В момент ЧС система только исполняет то, что было подготовлено заранее."], "terms": ["кризисное управление", "единоначалие", "режимы функционирования РСЧС", "уровни реагирования", "координационные органы", "КЧС и ОПБ", "центр управления в кризисных ситуациях", "ЕДДС", "функциональные и территориальные подсистемы", "степени готовности гражданской обороны", "единая инфраструктура двух систем", "заблаговременная подготовка"], "follow": [{"q": "Почему РСЧС и ГО не объединили в одну систему?", "a": "Потому что различаются правовые режимы и характер угроз. Гражданская оборона связана с военным положением, мобилизационной подготовкой и особыми полномочиями органов власти, а РСЧС действует в обычном правовом поле мирного времени. Разделение сохраняется юридически, при этом организационно системы опираются на общие органы управления, силы и средства."}, {"q": "Что в кризисном управлении важнее — техника или подготовка людей?", "a": "Подготовка. Техника определяет потолок возможностей, но реализует его человек. Основные потери в чрезвычайных ситуациях связаны с неправильными действиями в первые минуты — паникой, потерей времени, неверными решениями. Поэтому обучение населения — в законах о ГО и о защите населения оно стоит в числе основных задач обеих систем."}], "notes": [{"label": "Разворот на школу", "text": "на уровне образовательной организации обе системы сходятся в одном человеке. Директор одновременно руководитель гражданской обороны объекта и председатель объектовой комиссии по предупреждению и ликвидации ЧС. Документы тоже парные: по линии ГО — план гражданской обороны и план основных мероприятий, по линии РСЧС — план действий по предупреждению и ликвидации ЧС. Это наглядно показывает, что для конечного объекта две системы образуют единый контур управления."}], "block": "ЧС, ГО, РСЧС", "bk": "chs", "tier": 2, "psy": false, "aid": false}, {"n": 17, "title": "Универсальные учебные действия: понятие, виды, способы формирования", "kostyak": ["УУД — обобщённые способы действия, которые обеспечивают человеку умение учиться: самостоятельно ставить цель, находить средства, контролировать себя и оценивать результат. По сути это перенос учебной деятельности в собственное распоряжение ученика.", "Понятие вошло в отечественный стандарт через работы научного коллектива под руководством Асмолова, а теоретически восходит к культурно-исторической теории Выготского и теории учебной деятельности Эльконина и Давыдова.", "По обновлённому ФГОС метапредметные результаты описаны через три группы УУД: познавательные, коммуникативные и регулятивные.", "Познавательные включают базовые логические действия — сравнение, классификацию, установление причинно-следственных связей; базовые исследовательские — выдвижение гипотезы, проведение небольшого исследования; и работу с информацией — поиск, отбор, оценку достоверности.", "Коммуникативные — это общение и совместная деятельность: аргументировать позицию, слушать, распределять роли, договариваться в группе.", "Регулятивные — самоорганизация и самоконтроль: постановка задачи, планирование, коррекция, оценка сделанного. В обновлённом стандарте сюда добавлены эмоциональный интеллект и принятие себя и других.", "Формируются УУД не отдельными занятиями, а способом организации любого урока: через задачу, а не через сообщение готового; через групповую работу; через задания на самопроверку и взаимопроверку; через рефлексию в конце урока.", "На ОБиЗР материал под это подходит идеально. Оценка достоверности сообщения о ЧС в соцсети — работа с информацией. Распределение обязанностей при учебной эвакуации — коммуникативные. Составление собственного плана действий при пожаре в квартире и проверка его по критериям — регулятивные."], "terms": ["универсальные учебные действия", "метапредметные результаты", "познавательные", "коммуникативные", "регулятивные УУД", "базовые логические и базовые исследовательские действия", "работа с информацией", "самоорганизация и самоконтроль", "умение учиться", "Асмолов", "интериоризация", "рефлексия"], "follow": [{"q": "Как оценивать УУД?", "a": "Через специальные комплексные и метапредметные работы, наблюдение по критериям, проектную деятельность, защиту индивидуального проекта. Обычной предметной отметкой они не измеряются."}, {"q": "Чем УУД отличаются от общеучебных умений?", "a": "Общеучебные умения — более узкое и операциональное понятие. УУД шире: включают ценностный и регулятивный компонент и по определению переносимы на любой предмет и на внеучебные ситуации."}], "notes": [{"label": "Заходит от психологии", "text": "это центральная территория. Стоит сказать про интериоризацию — внешнее совместное действие постепенно становится внутренним индивидуальным; про поэтапное формирование умственных действий Гальперина как механизм; про зону ближайшего развития как объяснение, почему УУД формируются сначала в совместной работе с учителем и сверстниками, а потом переходят в самостоятельные. Если добавить, что личностные УУД в старом стандарте были четвёртой группой, а в обновлённом личностные результаты вынесены отдельно по направлениям воспитания — это сильный маркер того, что человек читал сам стандарт, а не пересказ."}], "block": "Методика", "bk": "met", "tier": 2, "psy": false, "aid": false}, {"n": 8, "title": "Метод обучения и методический приём. Проблемное изложение, эвристический и исследовательский методы", "kostyak": ["Метод обучения — способ упорядоченной совместной деятельности учителя и учеников, направленный на решение задач обучения. Ключевое слово — совместной: в методе всегда две стороны.", "Методический приём — элемент метода, отдельное действие внутри него. Один и тот же приём в разных методах играет разную роль: показ слайда может быть иллюстрацией при объяснении, а может быть завязкой проблемной ситуации.", "Классификаций методов несколько. По источнику знаний — словесные, наглядные, практические. По дидактической цели — методы изучения нового, закрепления, контроля. Но для этого вопроса нужна классификация Лернера и Скаткина по характеру познавательной деятельности.", "В ней пять методов: объяснительно-иллюстративный, репродуктивный, проблемного изложения, частично-поисковый и исследовательский. Они выстроены по нарастанию самостоятельности ученика.", "Проблемное изложение: учитель ставит проблему и сам её решает вслух, но показывает ход рассуждения, тупики, отбрасывание версий. Ученик не действует, но следит за логикой и присваивает образец мышления. На ОБиЗР это разбор реальной аварии или пожара: почему погибли люди, где была точка невозврата.", "Частично-поисковый, или эвристический: проблема делится на шаги, часть выполняет учитель, часть — ученики. Классический инструмент — эвристическая беседа с системой наводящих вопросов. На уроке это выглядит так: даю фабулу ситуации, класс сам достраивает алгоритм действий, я держу только узловые точки.", "Исследовательский метод: ученики проходят весь цикл сами — от проблемы и гипотезы до выводов. На ОБиЗР это исследование по безопасности маршрута «дом — школа», анализ статистики травматизма в районе, проверка эвакуационных путей своего этажа с картой.", "Практический вывод: на одном уроке эти методы почти всегда комбинируются, а выбор метода определяют цель, возраст, подготовленность класса и время. Полностью исследовательский урок дорог по времени, поэтому он не может быть единственным."], "terms": ["метод и приём обучения", "классификация Лернера и Скаткина", "характер познавательной деятельности", "объяснительно-иллюстративный и репродуктивный методы", "проблемная ситуация", "эвристическая беседа", "гипотеза", "перенос способа действия", "Махмутов и теория проблемного обучения", "оптимальный выбор методов по Бабанскому"], "follow": [{"q": "Чем метод отличается от технологии?", "a": "Метод — способ действия внутри урока. Технология — воспроизводимая последовательность действий с заданным результатом и диагностикой, она охватывает весь процесс и гарантирует повторяемость."}, {"q": "Где на ОБиЗР исследовательский метод неуместен?", "a": "Там, где цена ошибки — жизнь и есть жёсткий алгоритм: сердечно-лёгочная реанимация, действия при пожаре, применение противогаза. Здесь нужен показ и отработка до автоматизма, а поиск уводит от нормативного порядка действий."}], "notes": [{"label": "Заходит от психологии", "text": "проблемное обучение опирается на понятие познавательного противоречия и на исследования мышления Рубинштейна и Матюшкина — мышление начинается с проблемной ситуации. Плюс мотивационный эффект: проблемная задача включает внутреннюю познавательную мотивацию, тогда как объяснительно-иллюстративный метод держится на внешней."}], "block": "Методика", "bk": "met", "tier": 2, "psy": false, "aid": false}, {"n": 10, "title": "Личностно-ориентированные технологии и их применение на ОБиЗР", "kostyak": ["Личностно-ориентированные технологии исходят из того, что ученик — не объект воздействия, а субъект со своим опытом, и обучение строится от этого опыта, а не только от программы.", "В отечественной педагогике это направление связано с именами Якиманской, Серикова, Бондаревской, а в психологии оно опирается на гуманистическую традицию Роджерса и Маслоу и на педагогику сотрудничества Амонашвили.", "Ключевая идея Якиманской — субъектный опыт ученика. Ребёнок приходит на урок не пустым, у него уже есть представления об опасности, часто ошибочные, и задача учителя — не заместить их, а сделать предметом обсуждения.", "Признаки такой технологии на уроке: выбор задания по уровню и по интересу, право на своё мнение и его обоснование, диалог вместо фронтального опроса, рефлексия в конце, оценка динамики ученика, а не только соответствия эталону.", "На ОБиЗР это работает хорошо, потому что у предмета есть личный материал у каждого. Пример: тема безопасности в быту начинается не с перечня правил, а с вопроса «какая опасная ситуация была лично у вас или у ваших близких» — дальше разбираем эти случаи.", "Второй пример — разноуровневые задания на теме первой помощи: одни отрабатывают базовый алгоритм на манекене, другие получают усложнённую вводную с несколькими пострадавшими и сами определяют очерёдность.", "Третий пример — технология педагогических мастерских и метод портфолио: ученик ведёт личную карту безопасности своего маршрута, дома, цифрового следа, и она оценивается по приросту.", "Ограничение честно назову: личностно-ориентированный подход не отменяет нормативных алгоритмов. Обсуждать можно мотивы и оценку ситуации, но порядок действий при пожаре обсуждению не подлежит."], "terms": ["субъектный опыт ученика", "субъект-субъектное взаимодействие", "Якиманская", "Сериков", "Бондаревская", "педагогика сотрудничества", "разноуровневое обучение", "индивидуальная образовательная траектория", "дифференциация и индивидуализация", "рефлексия", "ситуация успеха", "портфолио"], "follow": [{"q": "Чем личностно-ориентированный подход отличается от индивидуального?", "a": "Индивидуальный подход — учёт особенностей ученика при неизменной общей цели. Личностно-ориентированный меняет саму позицию ученика: он участвует в постановке цели и выборе способа."}, {"q": "Как это сочетается с ФГОС?", "a": "Прямо: стандарт требует индивидуальных образовательных траекторий, учёта особых образовательных потребностей и оценки индивидуального прогресса."}], "notes": [{"label": "Заходит от психологии", "text": "здесь можно уверенно говорить о безусловном принятии и эмпатии по Роджерсу, о мотивации достижения и мотивации избегания неудач, о ситуации успеха как условии учебной мотивации. Отдельный сильный ход — сказать, что личностно-ориентированный подход требует от учителя развитой рефлексии и работы с собственными установками, иначе он остаётся декларацией."}], "block": "Методика", "bk": "met", "tier": 2, "psy": false, "aid": false}, {"n": 18, "title": "Анализ урока: виды и структура", "kostyak": ["Анализ урока — это разбор урока по заданным основаниям с целью оценить, достигнута ли цель, и найти способы улучшения. Ключевое отличие анализа от впечатления: он ведётся по критериям, а не по ощущению «понравилось или нет».", "Кто анализирует: сам учитель — это самоанализ, коллеги — взаимопосещение, администрация и методист — контрольное посещение, аттестационная комиссия.", "Виды анализа различают по глубине и охвату. Полный или развёрнутый — по всем компонентам. Краткий, оценочный — общая оценка достижения цели. Комплексный — совокупность уроков или урок во всех аспектах сразу.", "И по основанию: структурный анализ — логика и последовательность этапов; аспектный — один параметр под увеличительным стеклом, например реализация здоровьесберегающих требований или работа со слабыми учениками; дидактический, психологический, методический анализ.", "В отечественной школе классической считается схема Конаржевского: анализ через учебно-воспитательные моменты и оценку того, как каждый этап работает на конечный результат.", "Структура анализа обычно такая: общие сведения об уроке — тип, тема, место в разделе; постановка целей и их диагностичность; содержание — научность, соответствие программе, отбор материала; методы и средства, их обоснованность; организация деятельности учеников и уровень их самостоятельности; контроль и оценивание; результат урока и его соотнесение с целью; выводы и рекомендации.", "Отдельный блок — психологический аспект: учёт возрастных особенностей, темп и дозировка нагрузки, смена видов деятельности, характер общения, обратная связь, климат в классе.", "Специфика ОБиЗР: обязательно оценивается практическая отработка и соблюдение техники безопасности на самом уроке. Урок по первой помощи без реальной отработки на манекене формально может быть выстроен грамотно, но цели не достигнет."], "terms": ["самоанализ урока", "аспектный", "структурный", "полный анализ", "дидактический и психологический анализ", "схема Конаржевского", "диагностичность цели", "соответствие типа урока его цели", "плотность урока", "смена видов деятельности", "обратная связь", "рекомендации по итогам анализа"], "follow": [{"q": "Что такое диагностичная цель?", "a": "Цель, сформулированная так, что по окончании урока можно проверить, достигнута она или нет. «Познакомить с темой» недиагностично, «ученик перечисляет и демонстрирует порядок действий при обнаружении пострадавшего без сознания» — диагностично."}, {"q": "С чего начинается самоанализ?", "a": "С сопоставления замысла и результата: какая была цель, что реально сделали ученики, где расхождение и почему. Дальше — что изменить в следующем уроке."}], "notes": [{"label": "Заходит от психологии", "text": "психологический анализ урока — прямо профильная часть. Можно говорить о работоспособности и её динамике в течение урока, о произвольном и непроизвольном внимании и его колебаниях, об утомлении и необходимости смены деятельности, о стиле педагогического общения и его влиянии на активность класса. Это редко звучит развёрнуто у абитуриентов и хорошо запоминается комиссии."}], "block": "Методика", "bk": "met", "tier": 2, "psy": false, "aid": false}, {"n": 22, "title": "Виды и методы контроля обучения", "kostyak": ["Контроль — это установление соответствия достигнутых результатов запланированным. У него несколько функций: диагностическая, обучающая, развивающая, воспитательная и мотивационная. Важно не сводить его к одной контролирующей.", "Виды контроля различают по месту в процессе: предварительный, текущий, тематический, периодический или рубежный, итоговый.", "Предварительный показывает стартовый уровень и опорные знания. Текущий сопровождает изучение темы и позволяет корректировать по ходу. Тематический подводит итог раздела. Итоговый — за период обучения, включая государственную итоговую аттестацию.", "По субъекту: контроль учителя, взаимоконтроль учеников, самоконтроль. Последний по ФГОС является целью, а не только средством — самоконтроль входит в регулятивные УУД.", "Методы контроля: устный опрос — фронтальный, индивидуальный, уплотнённый; письменный — самостоятельная и контрольная работа, диктант, эссе; практический — выполнение операций, что для ОБиЗР основной метод; тестовый; наблюдение; проектный.", "Тестирование стоит охарактеризовать отдельно: даёт широкий охват и объективность, но плохо проверяет умение действовать и рассуждать. Поэтому на ОБиЗР его сочетают с практическим зачётом.", "Современная рамка — разведение формирующего и суммативного оценивания. Формирующее ведётся во время обучения, его задача — обратная связь и корректировка, отметка при нём не обязательна. Суммативное фиксирует итог.", "Требования к контролю: объективность, систематичность, всесторонность, дифференцированность, гласность критериев. Ученик должен заранее знать, по каким критериям его оценивают.", "Специфика предмета: главный измеритель — умение выполнить алгоритм. Проверять первую помощь письменным тестом методически неверно, нужен практический зачёт по чек-листу."], "terms": ["функции контроля", "предварительный", "текущий", "тематический", "итоговый контроль", "формирующее и суммативное оценивание", "критериальное оценивание", "валидность и надёжность теста", "самоконтроль и взаимоконтроль", "накопительная система", "всероссийские проверочные работы", "практический зачёт по чек-листу"], "follow": [{"q": "Чем оценка отличается от отметки?", "a": "Оценка — процесс и суждение о качестве работы, она может быть развёрнутой и словесной. Отметка — её условное числовое выражение, свёрнутое до балла."}, {"q": "Что даёт формирующее оценивание на ОБиЗР?", "a": "Возможность отработать алгоритм до итогового зачёта: ученик получает обратную связь по чек-листу, видит конкретную ошибку в порядке действий и повторяет попытку без штрафа за неё."}], "notes": [{"label": "Заходит от психологии", "text": "сильная линия — влияние оценки на мотивацию. Отметка как внешний мотиватор вытесняет познавательный интерес; исследования учебной мотивации Марковой и Божович это описывают. Плюс тема оценочной тревожности и того, почему критериальное оценивание её снижает: ученик знает правила и видит, что оценивают работу, а не его самого. Можно упомянуть эффект ожиданий учителя."}], "block": "Методика", "bk": "met", "tier": 2, "psy": false, "aid": false}, {"n": 30, "title": "Структура и содержание учебной программы по ОБиЗР/ОБЖ", "kostyak": ["Сначала разведу уровни: есть федеральная рабочая программа по ОБиЗР, она входит в федеральную образовательную программу и обязательна по содержанию, и есть рабочая программа учителя, которую он составляет на её основе.", "По обновлённому ФГОС рабочая программа имеет три обязательных раздела: содержание учебного предмета, планируемые результаты освоения и тематическое планирование. Раньше требований было больше, сейчас структура упрощена.", "Тематическое планирование включает темы, количество часов, а также указание на электронные образовательные ресурсы и виды деятельности учеников. К программе прикладывается календарно-тематическое планирование.", "Планируемые результаты в программе расписываются по трём группам — личностные, метапредметные, предметные — и по годам обучения, а не суммарно на весь курс.", "Содержание курса ОБиЗР построено по модульному принципу. Модулей около десяти, среди них: безопасное и устойчивое развитие личности, общества и государства; военная подготовка и основы военных знаний; культура безопасности жизнедеятельности; безопасность в быту, на транспорте, в общественных местах, в природной среде; основы медицинских знаний и оказание первой помощи; безопасность в социуме; безопасность в информационном пространстве; основы противодействия экстремизму и терроризму.", "Модульность даёт гибкость: модули изучаются последовательно, но их наполнение конкретизируется с учётом региональных особенностей — в приморском регионе больше про воду, в лесном — про пожары в природной среде.", "Курс изучается на уровне основного общего образования в 8–9 классах и на уровне среднего общего в 10–11, при этом элементы безопасного поведения включены и в другие предметы раньше — прежде всего в окружающий мир и биологию.", "Принципы построения содержания: концентричность — темы возвращаются на новом уровне сложности; практическая направленность; связь с региональным контекстом; преемственность между уровнями образования.", "Важное отличие ОБиЗР от прежнего ОБЖ на уровне программы — усиленный военный блок и появление тем, связанных с современными средствами вооружённой борьбы, включая беспилотные системы, и элементами тактической медицины."], "terms": ["федеральная образовательная программа", "федеральная рабочая программа по ОБиЗР", "рабочая программа учителя", "три раздела рабочей программы", "тематическое и календарно-тематическое планирование", "модульная структура курса", "планируемые результаты по годам обучения", "концентрический принцип", "региональный компонент содержания", "преемственность уровней образования"], "follow": [{"q": "Может ли учитель менять содержание?", "a": "Уменьшать объём федеральной рабочей программы нельзя. Учитель может перераспределять часы в допустимых пределах, добавлять региональный материал и выбирать формы работы."}, {"q": "Что такое концентрический принцип?", "a": "Возврат к теме на новом уровне: в основной школе — как действовать при пожаре, в старшей — оценка пожарных рисков, нормативные требования, организация эвакуации."}], "notes": [{"label": "Заходит от психологии", "text": "концентрический принцип легко обосновать через возрастные возможности: одна и та же тема на разной глубине, потому что абстрактное мышление и способность к анализу рисков формируются постепенно. Плюс можно сказать про соответствие содержания зоне ближайшего развития — программа задаёт материал чуть выше текущего уровня, иначе развития не происходит."}], "block": "Методика", "bk": "met", "tier": 2, "psy": false, "aid": false}, {"n": 24, "title": "Нормативно-правовые документы в работе преподавателя-организатора ОБиЗР/ОБЖ", "kostyak": ["Документы удобно разложить по уровням: Конституция, федеральные законы, подзаконные акты Правительства и министерств, региональные документы и локальные акты школы.", "Основа — Конституция, где закреплены право на образование, право на охрану здоровья и благоприятную окружающую среду и обязанность защиты Отечества. Последнее прямо связано с новым названием предмета.", "Базовый закон отрасли — Федеральный закон № 273-ФЗ «Об образовании в Российской Федерации». В нём для нас важны статьи об охране здоровья обучающихся, о компетенции и ответственности образовательной организации, о правах и обязанностях педагогических работников.", "Профильные законы по содержанию предмета: о защите населения и территорий от чрезвычайных ситуаций природного и техногенного характера, о пожарной безопасности, о гражданской обороне, о противодействии терроризму и экстремистской деятельности, о воинской обязанности и военной службе, о безопасности дорожного движения, о защите детей от информации, причиняющей вред их здоровью и развитию.", "Стратегические документы: Стратегия национальной безопасности Российской Федерации и доктринальные документы по информационной безопасности. Их полезно назвать, потому что они задают понятийный аппарат — национальные интересы, угрозы, обеспечение безопасности.", "Образовательные акты: ФГОС основного и среднего общего образования, федеральная образовательная программа и входящая в неё федеральная рабочая программа по ОБиЗР, федеральный перечень учебников, порядок организации образовательной деятельности.", "Квалификационные требования: должность преподавателя-организатора ОБЖ описана в квалификационных характеристиках работников образования, действует профессиональный стандарт педагога. Здесь же — требования к обучению по охране труда и оказанию первой помощи.", "Санитарные требования: санитарные правила к организациям воспитания и обучения и гигиенические нормативы. Плюс требования к антитеррористической защищённости объектов образования, установленные постановлением Правительства.", "Локальный уровень: устав школы, основная образовательная программа, рабочая программа учителя, инструкции по охране труда, приказы о назначении ответственных, планы тренировок по эвакуации.", "Честная оговорка в конце: перечень подвижен, документы регулярно обновляются, поэтому учитель работает со справочными правовыми системами и с официальными публикациями министерства."], "terms": ["№ 273-ФЗ «Об образовании в Российской Федерации»", "федеральный закон о защите населения и территорий от ЧС", "закон о гражданской обороне", "закон о противодействии терроризму", "закон о воинской обязанности и военной службе", "Стратегия национальной безопасности", "ФГОС ООО и СОО", "федеральная образовательная программа", "федеральный перечень учебников", "профессиональный стандарт педагога", "локальные нормативные акты", "антитеррористическая защищённость объекта"], "follow": [{"q": "Какой документ определяет, что именно вы преподаёте в конкретном классе?", "a": "Федеральная рабочая программа по ОБиЗР в составе федеральной образовательной программы. Учитель разрабатывает свою рабочую программу на её основе, не снижая содержания."}, {"q": "Какие обязанности педагога закреплены в 273-ФЗ?", "a": "Осуществлять деятельность на профессиональном уровне, соблюдать правовые и этические нормы, уважать честь и достоинство обучающихся, учитывать особенности развития, проходить обучение по охране труда и медосмотры, соблюдать устав и локальные акты."}], "notes": [{"label": "Заходит от психологии", "text": "прямой связи мало, но можно уместно упомянуть закон о защите детей от вредной информации и профилактику деструктивного контента: здесь пересекаются нормативная и психологическая рамки — механизмы вовлечения подростков в деструктивные сообщества, признаки, на которые обязан реагировать педагог."}], "block": "Методика", "bk": "met", "tier": 2, "psy": false, "aid": false}, {"n": 23, "title": "Методы и средства обеспечения безопасности труда обучающихся", "kostyak": ["Начну с рамки: школа отвечает за жизнь и здоровье обучающихся во время образовательного процесса, это прямо закреплено в законе об образовании — статья об охране здоровья обучающихся и статья о компетенции и ответственности образовательной организации.", "В теории БЖД принято выделять три группы методов защиты: разделение гомосферы и ноксосферы в пространстве или во времени, приведение опасной зоны к безопасному состоянию, и адаптация человека к среде через обучение, инструктаж и средства защиты. Школьная практика использует все три.", "Организационные меры: инструктажи и их виды — вводный, первичный на рабочем месте, повторный, внеплановый и целевой; регистрация в журналах; инструкции по охране труда для кабинетов повышенной опасности; допуск к работам; расследование и учёт несчастных случаев с обучающимися.", "Технические меры: исправное и сертифицированное оборудование, ограждения, вентиляция, электробезопасность, пожарная сигнализация и системы оповещения, содержание путей эвакуации, требования к кабинету ОБиЗР, тиру и месту практических занятий.", "Санитарно-гигиенические: требования санитарных правил к организациям воспитания и обучения и гигиенических нормативов — освещённость, микроклимат, мебель по росту, режим занятий, ограничения по времени работы с электронными средствами, нормирование нагрузки.", "Средства защиты делятся на коллективные и индивидуальные. Для школы это средства пожаротушения, аптечки, при отработке — противогазы и респираторы учебного назначения, средства защиты при практических работах.", "Кабинеты повышенной опасности в школе — физика, химия, информатика, технология, спортзал, тир — имеют отдельные требования и паспорт кабинета с актом-разрешением на проведение занятий.", "Отдельная линия — антитеррористическая защищённость объекта: категорирование, паспорт безопасности, пропускной режим, тренировки по эвакуации. Практическая тренировка проводится регулярно, и это часть работы преподавателя-организатора.", "Итог: безопасность труда обучающихся — не набор бумаг, а система, где обучение и инструктаж стоят рядом с техническими средствами. Документы фиксируют систему, но не заменяют её."], "terms": ["охрана труда и техника безопасности", "гомосфера и ноксосфера", "вводный", "первичный", "повторный", "внеплановый", "целевой инструктаж", "журнал регистрации инструктажа", "инструкция по охране труда", "средства коллективной и индивидуальной защиты", "паспорт кабинета и акт-разрешение", "санитарные правила и гигиенические нормативы", "антитеррористическая защищённость и паспорт безопасности", "расследование несчастных случаев с обучающимися"], "follow": [{"q": "Чем целевой инструктаж отличается от внепланового?", "a": "Целевой проводят перед разовой работой или мероприятием вне обычной программы — поход, экскурсия, соревнование. Внеплановый — при изменении условий, после несчастного случая или по требованию надзорных органов."}, {"q": "Кто отвечает за безопасность на уроке?", "a": "Учитель, ведущий занятие, — за жизнь и здоровье учеников в этот период; руководитель организации — за систему охраны труда в целом."}], "notes": [{"label": "Заходит от психологии", "text": "можно добавить человеческий фактор — большая часть происшествий связана не с отказом техники, а с ошибками поведения. Здесь работают понятия внимания, утомления, монотонии, склонности к риску у подростков и феномен привыкания к опасности, когда многократно повторённый инструктаж перестаёт восприниматься. Отсюда методический вывод: тренировка эффективнее инструктажа под роспись."}], "block": "Методика", "bk": "met", "tier": 2, "psy": false, "aid": false}, {"n": 48, "title": "Здоровый образ жизни. Компоненты. Индивидуальный стиль жизни", "kostyak": ["«Образ жизни — устойчивый способ жизнедеятельности человека: как он трудится, отдыхает, питается, общается. Здоровый образ жизни — та форма повседневного поведения, которая сохраняет и укрепляет здоровье и снижает риск заболеваний».", "«Подчеркну: ЗОЖ — не набор запретов, а система привычек, встроенных в реальную жизнь человека. Если она противоречит его условиям и мотивам, она не удержится».", "«Компоненты обычно называют такие. Рациональное питание — сбалансированность, режим, соответствие энергозатратам».", "«Оптимальная двигательная активность — регулярная нагрузка, соответствующая возрасту и состоянию; борьба с гиподинамией».", "«Режим труда и отдыха, полноценный сон — восстановление ресурсов, профилактика переутомления».", "«Личная гигиена и закаливание; отказ от вредных привычек — табака, алкоголя, психоактивных веществ».", "«Психогигиена и психологическая культура — умение управлять стрессом, поддерживающие отношения, эмоциональная саморегуляция».", "«Медицинская активность — профилактические осмотры, своевременное обращение за помощью, выполнение назначений».", "«Индивидуальный стиль жизни — то, как общие принципы преломляются в конкретном человеке: его биоритмы, темперамент, профессия, семейный уклад, культурные традиции. Один и тот же режим для „жаворонка“ и „совы“ даст разный результат».", "Заходит от психологии: «Сильная часть ответа — почему знание о ЗОЖ не превращается в поведение. Работает разрыв между установкой и действием. Объясняют его через модели изменения поведения: транстеоретическую модель Прохаски и Диклементе со стадиями от преднамерения до поддержания, теорию планируемого поведения Айзена, понятие самоэффективности Бандуры. Практический вывод для школы: просветительская лекция меняет знания, но не поведение. Меняют поведение работа с мотивацией, формирование конкретных навыков, поддерживающая среда и значимое окружение. Отсюда же — мотивационное интервьюирование как метод»."], "terms": ["образ жизни и стиль жизни", "двигательная активность и гиподинамия", "режим труда и отдыха", "психогигиена", "саморегуляция", "самоэффективность", "стадии изменения поведения", "мотивационное интервьюирование", "здоровьесберегающая среда"], "follow": [{"q": "Кто отвечает за формирование ЗОЖ у школьника?", "a": "— Совместно семья, школа и сам подросток. Школа отвечает за здоровьесберегающую среду: режим занятий, нагрузку, питание, двигательную активность, психологический климат, а не только за уроки о вреде курения."}, {"q": "Почему лекции о вреде курения плохо работают?", "a": "— Они дают информацию, но не затрагивают мотивы и социальный контекст. Подросток курит не от незнания, а ради принятия в группе, статуса, снятия напряжения. Работать надо с этими функциями поведения и с навыками отказа."}], "notes": [], "block": "Теория, риск, ЗОЖ", "bk": "teor", "tier": 2, "psy": true, "aid": false}, {"n": 49, "title": "Аддиктивное поведение и сохранение здоровья. Задачи школы", "kostyak": ["«Аддиктивное поведение — одна из форм отклоняющегося поведения, стремление уйти от реальности через изменение своего психического состояния: приёмом веществ либо через фиксацию на определённой активности».", "«Определение в отечественной традиции связано с работами Короленко и Змановской. Ключевая формула: уход от реальности с искусственным изменением психического состояния».", "«Виды: химические аддикции — алкоголь, табак, наркотики, токсические вещества, злоупотребление лекарствами. Нехимические, поведенческие — игровая зависимость, интернет- и гаджет-зависимость, пищевые нарушения, трудоголизм, созависимость».", "«Динамика формирования описывается стадиями: первые пробы, поисковое поведение, регулярное употребление, психическая зависимость, физическая зависимость, деградация личности. Важно, что сначала формируется психическая зависимость».", "Заходит от психологии — это ядро ответа: «Механизм. Вещество или действие даёт быстрое и надёжное изменение состояния: снимает напряжение, тревогу, чувство неполноценности. Формируется прочная связь между дискомфортом и способом его снятия, а собственные способы совладания не развиваются. Поэтому аддикция — это всегда дефицит копинг-ресурсов».", "Заходит от психологии: «Теории объяснения. Биологические — роль системы подкрепления, дофаминовое вознаграждение, наследственная предрасположенность. Психодинамические — компенсация внутреннего конфликта и дефицита раннего опыта. Поведенческие — научение через подкрепление и снятие негативного состояния. Личностные — концепция аддиктивной личности: низкая переносимость фрустрации, внешний локус контроля, сниженная рефлексия, скрытый комплекс неполноценности за фасадом превосходства. Социальные — влияние семьи, группы сверстников, доступность вещества, культурные нормы».", "«Факторы риска у подростков: семейное неблагополучие и созависимая семья, отвержение сверстниками либо, наоборот, употребляющая референтная группа, школьная неуспешность, акцентуации характера, ранняя травматизация. Защитные факторы — привязанность в семье, успешность в значимой деятельности, навыки отказа, устойчивая самооценка».", "«Задачи школы в профилактике. Первичная профилактика — до первых проб: формирование жизненных навыков, работа с самооценкой и стрессоустойчивостью, обучение отказу, вовлечение в значимую деятельность, здоровьесберегающая среда, работа с родителями».", "«Вторичная — раннее выявление групп риска, психолого-педагогическое сопровождение, индивидуальная работа, взаимодействие со службами. Третичная — поддержка и реадаптация подростка, вернувшегося после лечения, недопущение стигматизации».", "Заходит от психологии: «И принципиальный момент, который стоит сказать прямо: запугивающая профилактика неэффективна и способна дать обратный эффект за счёт привлечения интереса. Работает профилактика позитивная — та, что даёт альтернативные способы получать удовольствие, справляться с напряжением и чувствовать себя значимым. Метод выбора при работе с амбивалентной мотивацией — мотивационное интервьюирование»."], "terms": ["аддиктивное поведение", "девиантное поведение", "психическая и физическая зависимость", "копинг-стратегии", "фрустрационная толерантность", "локус контроля", "система подкрепления", "факторы риска и защитные факторы", "первичная", "вторичная", "третичная профилактика", "мотивационное интервьюирование", "жизненные навыки"], "follow": [{"q": "Чем нехимическая аддикция отличается от химической?", "a": "— Отсутствием психоактивного вещества и, как правило, физической абстиненции в классическом виде. Но психологический механизм тот же: уход от реальности, сужение интересов, потеря контроля, продолжение вопреки последствиям."}, {"q": "Что конкретно делает школьный психолог в профилактике?", "a": "— Диагностика групп риска, тренинги жизненных навыков и стрессоустойчивости, индивидуальное консультирование, работа с родителями и педагогами, участие в создании среды, где у подростка есть признание вне рискованного поведения."}], "notes": [], "block": "Теория, риск, ЗОЖ", "bk": "teor", "tier": 2, "psy": true, "aid": false}, {"n": 5, "title": "Психологический аспект ЧС экологического, природного и техногенного происхождения", "kostyak": ["«ЧС воздействует на человека двумя путями: через поражающие факторы физической природы и через психотравмирующее воздействие. Второй путь охватывает значительно больше людей, чем первый: страдают не только пострадавшие, но и очевидцы, родственники, спасатели».", "Заходит от психологии: «Базовое понятие — стресс в понимании Селье: общий адаптационный синдром со стадиями тревоги, резистентности и истощения. Различаем эустресс, мобилизующий человека, и дистресс, разрушающий адаптацию. ЧС — типичный дистресс: сверхсильное воздействие при дефиците времени, информации и контроля».", "Заходит от психологии: «Динамика психических реакций в очаге описана в психологии экстремальных ситуаций. Острый период — реакции витального страха: аффективно-шоковые реакции в двух формах, гипокинетической — ступор, оцепенение, и гиперкинетической — двигательное возбуждение, беспорядочное метание. Далее подострый период — тревога, астения, нарушения сна, навязчивые воспоминания. Отдалённый период — либо восстановление, либо формирование посттравматического стрессового расстройства».", "Заходит от психологии: «ПТСР назову структурно: повторное переживание — флешбэки, кошмары; избегание всего, что связано с травмой; негативные изменения настроения и убеждений; гипервозбуждение — нарушения сна, раздражительность, вздрагивания. Отдельно — острая реакция на стресс как непосредственный ответ на событие, в отличие от отсроченного ПТСР».", "Заходит от психологии: «Паника. Механизм — циркулярная реакция: эмоциональное заражение по кругу, взаимное усиление страха в толпе. Условия возникновения: внезапная угроза жизни, дефицит информации, отсутствие узнаваемого лидера, скученность, наличие индуктора паники. Следствие — сужение сознания, некритичность, подражательное поведение, давка. Средства предупреждения: заблаговременная подготовка и отработанный алгоритм действий, ясное и уверенное информирование, присутствие человека, отдающего чёткие команды, изоляция паникёров».", "«Специфика по типам ЧС. Природные переживаются как непредотвратимые, воспринимаются фаталистично, отсюда меньше поиска виновных, но выражено чувство беспомощности. Техногенные добавляют гнев и поиск виновного — есть тот, кто допустил. Экологические — самые тяжёлые психологически из-за невидимости и растянутости угрозы: радиационное или химическое загрязнение не воспринимается органами чувств, и формируется хроническая тревога, ипохондрические реакции, недоверие к информации. Это описано как радиофобия и социально-психологические последствия загрязнения территорий».", "Заходит от психологии: «Совладание. Копинг-стратегии по Лазарусу и Фолкман делятся на проблемно-ориентированные и эмоционально-ориентированные. В ЧС на этапе воздействия эффективнее проблемно-ориентированные действия, на этапе последствий — работа с эмоциями и поиск социальной поддержки. Избегающий копинг даёт краткое облегчение и ухудшает отдалённый прогноз».", "«Помощь строится ступенчато: экстренная психологическая помощь в очаге — обеспечить безопасность, вывести из зоны, дать простые команды, восстановить контакт с реальностью, не оставлять одного. Затем психологическое сопровождение, дебрифинг с оговоркой о неоднозначности эффекта единичного дебрифинга, при необходимости — психотерапия ПТСР».", "«Отдельно — профессиональный аспект: у спасателей и педагогов, работающих с пострадавшими, развивается вторичная травматизация и эмоциональное выгорание. Это требует супервизии и профилактики»."], "terms": ["стресс", "эустресс", "дистресс", "общий адаптационный синдром Селье", "острая реакция на стресс", "аффективно-шоковые реакции", "ступор", "ПТСР", "флешбэк", "паника", "циркулярная реакция", "эмоциональное заражение", "копинг-стратегии по Лазарусу", "фрустрация", "экстренная психологическая помощь", "вторичная травматизация", "выгорание"], "follow": [{"q": "Как вести себя с человеком в ступоре?", "a": "— Установить контакт, говорить коротко и утвердительно, обращаться по имени, не оставлять одного, вывести из опасной зоны, вернуть внимание к простым телесным ощущениям и простым действиям. Не бить по щекам и не кричать, вопреки бытовому представлению."}, {"q": "Все ли, кто пережил ЧС, получают ПТСР?", "a": "— Нет, у большинства острые реакции постепенно угасают. Расстройство формируется у меньшинства, и вероятность зависит от тяжести события, предшествующей травматизации, личностных ресурсов и наличия социальной поддержки после события."}], "notes": [], "block": "Теория, риск, ЗОЖ", "bk": "teor", "tier": 2, "psy": true, "aid": false}, {"n": 52, "title": "Терроризм как угроза современному обществу", "kostyak": ["Терроризм определяется как идеология насилия и практика воздействия на принятие решений органами власти или международными организациями, связанная с устрашением населения. Это определение закреплено в Федеральном законе «О противодействии терроризму».", "Ключевой признак — тройственная структура: есть непосредственная жертва, есть адресат воздействия, и это разные субъекты. Насилие применяется к одним, а давление оказывается на других. Отсюда демонстративность и расчёт на публичность.", "Виды принято выделять по целям: политический, религиозный, националистический, экономический, криминальный. По средствам — обычный, а также ядерный, химический, биологический и кибертерроризм.", "Причины группируются так. Социально-экономические: бедность, безработица, резкое расслоение. Политические: неурегулированные конфликты, сепаратизм. Идеологические и религиозные: радикальные учения, оправдывающие насилие. Социально-психологические: маргинализация, поиск идентичности, чувство несправедливости.", "Международный терроризм — форма, при которой организации действуют на территории нескольких государств, имеют трансграничное финансирование, вербовку и логистику. Его особенность — использование интернета для пропаганды и рекрутинга.", "Противодействие в России строится по трём направлениям, обозначенным в законодательстве: профилактика терроризма, борьба с терроризмом и минимизация последствий. Работает Национальный антитеррористический комитет, действует система уровней террористической опасности.", "Отдельно — антитеррористическая защищённость объектов, включая объекты образования: категорирование, паспорт безопасности, инженерно-технические средства охраны. Поворот в сторону школы — профилактика терроризма и экстремизма в образовательной организации. Этот поворот вероятен, к нему надо быть готовым. - Правовая рамка: Федеральный закон «О противодействии экстремистской деятельности», Федеральный закон «О противодействии терроризму», стратегические документы по противодействию экстремизму. - Направления работы: информационно-разъяснительная работа с обучающимися и родителями, формирование установок неприятия насилия, развитие межнациональной и межконфессиональной толерантности, мониторинг социальных сетей на предмет вовлечённости, раннее выявление подростков в группе риска. - Организационные меры: контрольно-пропускной режим, тренировки по эвакуации, инструктажи, действия при обнаружении подозрительного предмета, порядок действий при угрозе по телефону. - Роль психолога: диагностика деструктивных установок, работа с агрессией, сопровождение подростков с признаками социальной изоляции."], "terms": ["идеология насилия", "устрашение населения", "террористический акт", "экстремизм", "радикализация", "вербовка", "антитеррористическая защищённость", "категорирование объекта", "паспорт безопасности", "уровни террористической опасности", "деструктивные сообщества"], "follow": [{"q": "Чем терроризм отличается от экстремизма?", "a": "Экстремизм шире — это приверженность крайним взглядам и методам. Терроризм — крайняя форма его реализации, через насилие с целью устрашения."}, {"q": "Какие признаки радикализации подростка может заметить педагог?", "a": "Резкая смена круга общения и внешнего вида, появление закрытой символики, разрыв с семьёй, оправдание насилия в речи, интерес к закрытым сетевым сообществам."}], "notes": [{"label": "Заходит от психологии", "text": "психология террориста — почему в науке не подтверждается версия о специфическом «профиле личности террориста», и почему объяснение сместилось к групповым механизмам: деиндивидуализация, конформизм, моральное разобщение, подчинение авторитету. Механизм вербовки подростка: работа с потребностью в признании, изоляция от прежнего окружения, поэтапное вовлечение."}], "block": "Социальные угрозы", "bk": "soc", "tier": 2, "psy": false, "aid": false}, {"n": 65, "title": "Информационная безопасность в системе национальной безопасности РФ", "kostyak": ["Информационная безопасность — состояние защищённости личности, общества и государства от внутренних и внешних информационных угроз. Базовый документ — Доктрина информационной безопасности Российской Федерации.", "Классическая триада свойств информации: конфиденциальность, целостность, доступность. На ней строится вся техническая защита.", "Национальная безопасность включает несколько видов: военную, экономическую, экологическую, продовольственную, информационную и другие. Информационная безопасность занимает в этой системе особое место, потому что она пронизывает остальные: управление войсками, финансовая система, энергетика и транспорт работают на информационных системах.", "Объекты защиты: информационные ресурсы, информационная инфраструктура, права граждан в информационной сфере, и отдельно — сознание человека, то есть защита от деструктивного информационного воздействия.", "Угрозы делят на внешние и внутренние, а также на технические (кибератаки, вредоносное ПО, утечки данных) и информационно-психологические (деструктивный контент, вовлечение в опасные сообщества, мошенничество через социальную инженерию).", "Направления обеспечения: правовое регулирование, включая законодательство о персональных данных и о защите детей от вредной информации; организационные меры; программно-технические средства; и подготовка кадров.", "Отдельный контур — безопасность критической информационной инфраструктуры. Поворот в сторону школы — информационная безопасность детей. Скорее всего спросят именно про это. - Правовая рамка: Федеральный закон «О защите детей от информации, причиняющей вред их здоровью и развитию», возрастная маркировка контента, требования к контентной фильтрации в образовательных организациях. - Угрозы для ребёнка: деструктивный контент (суицидальный, экстремистский, пропаганда насилия и ПАВ), кибербуллинг, груминг, вовлечение в деструктивные сетевые сообщества, интернет-мошенничество и социальная инженерия, игровая и сетевая зависимость, утечка персональных данных. - Меры в школе: контент-фильтрация на всех точках доступа, назначение ответственного за информационную безопасность, уроки цифровой гигиены, работа с родителями, мониторинг цифровой активности обучающихся группы риска, алгоритм действий при выявлении деструктивного контента. - Роль психолога: диагностика последствий кибербуллинга, работа с жертвой и с агрессором, восстановление положения ребёнка в группе."], "terms": ["информационная безопасность", "Доктрина информационной безопасности РФ", "конфиденциальность", "целостность", "доступность", "национальная безопасность", "критическая информационная инфраструктура", "персональные данные", "контентная фильтрация", "деструктивный контент", "кибербуллинг", "груминг", "социальная инженерия", "цифровая гигиена"], "follow": [{"q": "Почему информационную безопасность выделяют отдельно от остальных видов?", "a": "Потому что она обеспечивающая: сбой в информационной сфере отражается на военной, экономической и социальной безопасности одновременно."}, {"q": "Что делать педагогу при обнаружении опасного контента у ученика?", "a": "Не вступать в конфронтацию с ребёнком, зафиксировать факт, сообщить администрации и ответственному за информационную безопасность, подключить психолога и родителей, при признаках противоправного содержания — обратиться в органы профилактики."}], "notes": [{"label": "Заходит от психологии", "text": "кибербуллинг как форма травли — отличия от офлайн-буллинга: анонимность агрессора, круглосуточность, неограниченная аудитория, сохранность следа. Плюс механика вовлечения подростка в деструктивное сообщество: подмена принадлежности, постепенное обособление, повышение порога вовлечённости."}], "block": "Социальные угрозы", "bk": "soc", "tier": 2, "psy": false, "aid": false}, {"n": 51, "title": "Причины преступности в России. ЧС криминального характера", "kostyak": ["Преступность — социально-правовое явление, совокупность преступлений, совершённых на определённой территории за определённый период; она обладает собственными закономерностями и статистически устойчива.", "Причины в криминологии принято раскладывать по уровням. Социально-экономические: имущественное расслоение, безработица, бедность отдельных групп населения. Социально-психологические: деформация ценностей, алкоголизация и наркотизация, ослабление института семьи.", "Отдельно идут правовые и организационные факторы: пробелы в законодательстве, недостаточная эффективность профилактики, латентная преступность, которая не попадает в статистику.", "Есть и виктимологический фактор — поведение самой жертвы, которое повышает вероятность посягательства.", "ЧС криминального характера — это ситуации, где угроза исходит от противоправных действий: разбойное нападение, захват заложников, похищение человека, массовые беспорядки, вооружённое нападение на объект.", "Правила поведения при посягательстве строятся на приоритете жизни над имуществом: не вступать в конфликт из-за вещей, не провоцировать агрессию, стремиться увеличить дистанцию и выйти в людное место, привлечь внимание криком, при первой возможности сообщить в полицию.", "Профилактика делится на общесоциальную — то есть улучшение условий жизни, занятость, образование; специально-криминологическую — работа с группами риска; и индивидуальную — работа с конкретным человеком, склонным к правонарушению.", "В образовательной организации это профилактика правонарушений несовершеннолетних, совет профилактики, взаимодействие с подразделениями по делам несовершеннолетних."], "terms": ["криминология", "детерминанты преступности", "латентная преступность", "виктимология", "виктимное поведение", "делинквентное поведение", "общесоциальная и специально-криминологическая профилактика", "группа риска", "несовершеннолетние правонарушители"], "follow": [{"q": "Что такое латентная преступность?", "a": "Часть преступлений, не отражённая в официальной статистике: не выявленные и не заявленные. Из-за неё уровень преступности всегда оценивается с поправкой."}, {"q": "Как школа участвует в профилактике?", "a": "Через раннее выявление неблагополучия, внутришкольный учёт, занятость во внеурочной деятельности, работу психолога и социального педагога, взаимодействие с органами системы профилактики."}], "notes": [{"label": "Заходит от психологии", "text": "виктимология как отдельное направление — типы виктимного поведения, роль тревожности и заниженной самооценки, феномен «удобной жертвы». Плюс психология подростковой делинквентности: потребность в принадлежности к группе как механизм втягивания в противоправное поведение."}], "block": "Социальные угрозы", "bk": "soc", "tier": 2, "psy": false, "aid": false}, {"n": 35, "title": "Первая помощь при травмах различных областей тела и отравлениях", "kostyak": ["Травмы — самое частое, с чем сталкивается педагог. Общий принцип для всех локализаций: обезболить положением, обездвижить, охладить, не пытаться «вправить».", "Голова. Признаки черепно-мозговой травмы: потеря сознания даже на секунды, тошнота и рвота, головная боль, человек не помнит момент травмы. Помощь — покой, положение лёжа, холод, контроль дыхания, вызов скорой. Любая потеря сознания после удара головой — повод для осмотра врачом.", "Позвоночник и шея. Здесь главное правило — не перемещать. Если есть подозрение на травму позвоночника (падение с высоты, ныряние, ДТП, боль в спине, онемение или слабость в конечностях), человека оставляют в том положении, в котором нашли, фиксируют голову руками и ждут скорую. Двигать можно только если оставаться на месте опаснее, чем перемещать — пожар, вода, угроза обрушения. Это тот момент, где самодеятельность калечит.", "Грудная клетка. Признаки: боль при дыхании, одышка. Положение полусидя. При проникающем ранении груди накладывают повязку, не пропускающую воздух, чтобы не нарастал пневмоторакс.", "Живот. Положение на спине с валиком под коленями, холод. Нельзя поить, кормить и давать обезболивающее. При выпадении внутренних органов их не вправляют — накрывают влажной чистой тканью.", "Конечности. Отличить перелом от ушиба на месте невозможно, поэтому действую как при переломе: иммобилизация с захватом двух соседних суставов, холод, покой. Открытый перелом — сначала останавливаю кровотечение и закрываю рану, потом фиксирую. Отломки не вправляю.", "Таз. Поза «лягушки»: на спине, ноги согнуты и разведены, под колени валик. Травма таза даёт большую скрытую кровопотерю, поэтому это всегда вызов скорой.", "Отравления. Путь поступления яда определяет помощь: через рот, через дыхательные пути, через кожу, через инъекцию или укус. Общий порядок: прекратить поступление яда, вынести из зоны, промыть кожу или желудок, дать сорбент, сохранить упаковку вещества или рвотные массы для врачей.", "Вызывать рвоту нельзя, если человек без сознания, если он отравился кислотой, щёлочью или нефтепродуктами, и у маленьких детей. При ожоге пищевода рвота повторно обжигает его на обратном пути."], "terms": ["черепно-мозговая травма", "ретроградная амнезия", "иммобилизация с захватом двух соседних суставов", "транспортная иммобилизация", "открытый и закрытый перелом", "проникающее ранение груди", "пневмоторакс", "поза «лягушки»", "травматический шок", "путь поступления яда", "энтеросорбент", "противопоказания к вызыванию рвоты"], "follow": [{"q": "Как понять, что у ребёнка травматический шок?", "a": "Бледная хо
