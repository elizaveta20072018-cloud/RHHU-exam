приемлемый риск?", "a": "Уровень риска, который общество готово принять ради получаемой выгоды. Нулевого риска не бывает технически и экономически, поэтому нормирование строится на приемлемом значении, а не на полном исключении опасности."}], "notes": [{"label": "Заходит от психологии", "text": "культура безопасности — по структуре это классическая триада «когнитивный — эмоционально-ценностный — поведенческий компонент», и её можно развернуть через понятие установки. Плюс тема виктимного поведения: почему человек становится жертвой, как связаны тревожность, самооценка и рискованное поведение подростка."}], "block": "Методика", "bk": "met", "tier": 1, "psy": false, "aid": false, "core": "БЖД — вузовская наука об опасностях среды обитания и защите от них, ОБиЗР — школьный предмет с той же идеологией, но иным уровнем и задачами; цель школьного курса — культура безопасности личности, а не заученный список правил.", "anchors": ["человек — среда обитания", "аксиома потенциальной опасности", "приемлемый риск", "культура безопасности", "«и защиты Родины»"], "simple": ["Предмет изучения БЖД — система «человек — среда обитания»: опасности среды и способы защиты от них человека.", "В основе дисциплины аксиома о потенциальной опасности деятельности: абсолютной безопасности не бывает, любая деятельность несёт остаточный риск, поэтому им управляют, а не устраняют полностью.", "Приемлемый риск — уровень риска, который общество готово принять ради выгоды; нулевой риск недостижим технически и экономически. Защита строится на разведении гомосферы (зона человека) и ноксосферы (зона опасности).", "Цель школьного курса — культура безопасности личности: не только знания, но и мотивы, ценности, готовность действовать; понятие разрабатывали Мошкин и Гафнер. По структуре это триада — когнитивный, эмоционально-ценностный и поведенческий компоненты.", "Задачи курса сводятся к трём линиям: распознавать опасные и чрезвычайные ситуации, правильно действовать в них, включая первую помощь, воспитывать ответственное отношение к жизни, здоровью и защите Отечества. С 2024 года добавилась военная линия: основы военной подготовки, элементы НВП, современные средства вооружённой борьбы.", "Результат курса меряют поведением в ситуации, а не пересказом правил; отсюда акцент на практикумы, тренировки, ситуационные задачи."], "cards": [{"t": "система «человек — среда обитания»", "d": "предмет изучения БЖД: взаимодействие человека со средой и опасности, которые в нём возникают"}, {"t": "аксиома о потенциальной опасности деятельности", "d": "любая деятельность несёт остаточный риск, полностью безопасной деятельности не существует"}, {"t": "приемлемый риск", "d": "уровень риска, который общество согласно принять ради получаемой выгоды"}, {"t": "культура безопасности личности", "d": "цель школьного курса: знания, ценности и готовность действовать; по структуре — когнитивный, эмоционально-ценностный и поведенческий компоненты"}, {"t": "гомосфера и ноксосфера", "d": "зона пребывания человека и зона действия опасности; защита строится на их разведении"}, {"t": "виктимность", "d": "склонность человека оказываться в положении жертвы; связана с тревожностью, самооценкой и рискованным поведением подростка"}], "quiz": [{"q": "Что утверждает аксиома о потенциальной опасности деятельности?", "ok": "Любая деятельность несёт остаточный риск", "bad": ["Опасны только производственные виды деятельности", "Риск можно свести к нулю при достаточном финансировании", "Опасность возникает лишь при нарушении инструкций"], "why": "Из этой аксиомы растёт идея приемлемого риска: раз ноль недостижим, риском управляют, а не устраняют его."}, {"q": "Как с 1 сентября 2024 года называется школьный предмет, пришедший на смену ОБЖ?", "ok": "Основы безопасности и защиты Родины", "bad": ["Основы безопасности жизнедеятельности и военной подготовки", "Безопасность жизнедеятельности", "Основы военной и информационной безопасности"], "why": "ОБиЗР. Переименование закрепили поправками в закон об образовании в 2023 году, смысл — усилить военно-патриотическую и оборонную составляющую."}, {"q": "Чем цель школьного курса ОБиЗР отличается от цели вузовской БЖД?", "ok": "Школа формирует культуру безопасности личности, включая мотивы и ценности", "bad": ["Школа изучает только чрезвычайные ситуации природного характера", "В школьном курсе нет первой помощи", "Цель школы — профессиональная подготовка спасателей"], "why": "Идеология общая, уровень и задачи разные: вуз даёт научный аппарат, школа — готовность действовать."}]}, {"n": 7, "title": "Требования ФГОС к результатам освоения курса ОБиЗР/ОБЖ", "kostyak": ["Обновлённые ФГОС основного и среднего общего образования, принятые в 2021 году, задают три группы результатов: личностные, метапредметные и предметные. Эта рамка сквозная для всех предметов, ОБиЗР не исключение.", "Личностные результаты во ФГОС описаны по направлениям воспитания — гражданское, патриотическое, духовно-нравственное, эстетическое, физическое, трудовое, экологическое, ценность научного познания. Для ОБиЗР ведущими будут гражданское, патриотическое и физическое — готовность к защите Отечества, ответственное отношение к своему здоровью, неприятие любых форм экстремизма.", "Важная методическая оговорка: личностные результаты не выносятся на персональную отметку. Они оцениваются неперсонифицированно, в ходе мониторингов, потому что оценивать ценности отметкой некорректно.", "Метапредметные результаты во ФГОС раскрыты через универсальные учебные действия трёх видов: познавательные, коммуникативные и регулятивные. Познавательные разделены на базовые логические, базовые исследовательские и работу с информацией.", "На материале ОБиЗР метапредметные результаты работают естественно: анализ ситуации, оценка достоверности источника, принятие решения в условиях дефицита времени, распределение ролей в группе при отработке эвакуации.", "Предметные результаты — то, что специфично именно для предмета. По ОБиЗР это владение алгоритмами действий в опасных и чрезвычайных ситуациях, знание порядка оказания первой помощи, понимание основ обороны государства и воинской обязанности, навыки безопасного поведения в информационном пространстве.", "На базовом уровне в средней школе акцент смещён к практическим умениям и к тому, что человек реально сделает: показать, а не пересказать. Формулировки предметных результатов в стандарте построены от действия — «применять», «оказывать», «оценивать».", "Конкретика по годам обучения задана уже не стандартом, а федеральной рабочей программой по ОБиЗР, которая входит в федеральную образовательную программу — учитель не сочиняет требования сам, он их детализирует."], "terms": ["ФГОС ООО и ФГОС СОО", "три группы результатов", "направления воспитания", "неперсонифицированная оценка личностных результатов", "универсальные учебные действия", "базовые логические и базовые исследовательские действия", "федеральная образовательная программа", "федеральная рабочая программа", "базовый и углублённый уровень", "системно-деятельностный подход"], "follow": [{"q": "Почему личностные результаты не оценивают отметкой?", "a": "Потому что отметка за ценностную позицию превращается в оценку личности и провоцирует имитацию. Стандарт предполагает мониторинг на уровне класса и школы, а не персональную аттестацию."}, {"q": "Что такое системно-деятельностный подход простыми словами?", "a": "Ученик не получает готовое знание, а получает задачу, которая заставляет это знание построить. Учитель организует деятельность и переводит ученика из позиции слушателя в позицию действующего."}], "notes": [{"label": "Заходит от психологии", "text": "методологическая основа ФГОС — системно-деятельностный подход, а он вырос из культурно-исторической теории Выготского и теории деятельности Леонтьева. Тезис «результат формируется только в собственной деятельности ученика, а не в трансляции» — это прямая линия от Гальперина и Эльконина, и её стоит проговорить своими словами."}], "block": "Методика", "bk": "met", "tier": 1, "psy": false, "aid": false, "core": "ФГОС задаёт три группы результатов — личностные, метапредметные, предметные; личностные отметкой не оценивают, метапредметные раскрыты через УУД, предметные для ОБиЗР сформулированы от действия.", "anchors": ["три группы результатов", "направления воспитания", "УУД", "неперсонифицированная оценка", "федеральная рабочая программа"], "simple": ["Три группы результатов ФГОС, сквозные для всех предметов: личностные — про ценности, метапредметные — про способы работы, предметные — про сам предмет.", "Личностные результаты описаны по направлениям воспитания (гражданское, патриотическое, физическое и другие) и не выносятся на персональную отметку: их оценивают неперсонифицированно, иначе отметка за ценностную позицию превращается в оценку личности и учит имитировать.", "Метапредметные результаты раскрыты через УУД трёх видов: познавательные, коммуникативные, регулятивные. Внутри познавательных ещё тройка — базовые логические, базовые исследовательские, работа с информацией.", "Предметные результаты специфичны для предмета и написаны глаголами действия: применять, оказывать, оценивать — показать, а не пересказать.", "Стандарт задаёт рамку, конкретику по годам обучения — федеральная рабочая программа в составе федеральной образовательной программы; учитель детализирует, а не сочиняет.", "Методология ФГОС — системно-деятельностный подход, прямая линия от Выготского и Леонтьева: результат формируется в собственной деятельности ученика, а не в трансляции готового знания."], "cards": [{"t": "три группы результатов ФГОС", "d": "личностные, метапредметные, предметные — сквозная рамка для всех предметов"}, {"t": "неперсонифицированная оценка", "d": "способ оценки личностных результатов: мониторинг на уровне класса и школы без выставления отметки конкретному ученику"}, {"t": "направления воспитания", "d": "рубрики личностных результатов: гражданское, патриотическое, духовно-нравственное, эстетическое, физическое, трудовое, экологическое, ценность научного познания"}, {"t": "метапредметные результаты", "d": "универсальные способы действия, описанные через познавательные, коммуникативные и регулятивные УУД"}, {"t": "системно-деятельностный подход", "d": "методология ФГОС: ученик строит знание в собственной деятельности, а не получает его в готовом виде"}, {"t": "федеральная рабочая программа", "d": "документ в составе федеральной образовательной программы, задающий содержание и результаты по годам обучения"}], "quiz": [{"q": "Какие три группы результатов задаёт ФГОС?", "ok": "Личностные, метапредметные, предметные", "bad": ["Знания, умения, навыки", "Когнитивные, эмоциональные, поведенческие", "Базовые, повышенные, углублённые"], "why": "Рамка сквозная для всех предметов. Знания, умения и навыки — язык прежних стандартов."}, {"q": "Почему личностные результаты не выносятся на персональную отметку?", "ok": "Оценка ценностной позиции отметкой превращается в оценку личности и провоцирует имитацию", "bad": ["Их невозможно наблюдать в школе", "Они относятся к компетенции родителей, а не школы", "Их оценивают только на государственной итоговой аттестации"], "why": "Стандарт предполагает неперсонифицированный мониторинг на уровне класса и школы."}, {"q": "Через что во ФГОС раскрыты метапредметные результаты?", "ok": "Через универсальные учебные действия трёх видов", "bad": ["Через предметные умения по каждому курсу", "Через направления воспитания", "Через перечень тем федеральной рабочей программы"], "why": "Познавательные, коммуникативные, регулятивные УУД. Направления воспитания — это про личностные результаты."}, {"q": "На какие подгруппы делятся познавательные УУД в обновлённом стандарте?", "ok": "Базовые логические, базовые исследовательские, работа с информацией", "bad": ["Память, внимание, мышление", "Анализ, синтез, обобщение", "Устные, письменные, практические"], "why": "Тройка внутри тройки — удобная опора: три вида УУД, а внутри познавательных ещё три подгруппы."}]}, {"n": 28, "title": "Типология уроков", "kostyak": ["Урок — основная форма организации обучения в классно-урочной системе, восходящей к Коменскому: постоянный состав класса, фиксированное время, единая программа.", "Классифицировать уроки можно по разным основаниям, но общепринятая типология строится по дидактической цели. Её разрабатывали Есипов, Онищук, Махмутов.", "Типы по дидактической цели: урок изучения нового материала; урок закрепления и совершенствования знаний и умений; урок обобщения и систематизации; урок контроля и коррекции; комбинированный урок. Отдельно выделяют урок формирования умений и навыков — практикум.", "Комбинированный урок самый распространённый в школе: он сочетает проверку домашнего, изучение нового, закрепление и задание на дом. Его сильная сторона — универсальность, слабая — дробность, каждому этапу достаётся мало времени.", "Структура зависит от типа. У урока изучения нового: мотивационный этап, актуализация опорных знаний, постановка учебной задачи, изучение нового, первичное закрепление, рефлексия, домашнее задание.", "В логике системно-деятельностного подхода типологию описывают иначе: урок открытия нового знания, урок рефлексии, урок построения системы знаний, урок развивающего контроля. Знать обе рамки полезно — вторая ближе к формулировкам ФГОС.", "По форме проведения уроки бывают традиционными и нестандартными: урок-практикум, урок-экскурсия, урок-конференция, урок-игра, урок-соревнование, интегрированный урок.", "Специфика ОБиЗР: доля практикумов выше, чем у большинства предметов. Отдельный формат — учебная тренировка по эвакуации, которая выходит за рамки одного класса, и практическое занятие по первой помощи с отработкой на манекене.", "Общий принцип: тип урока выбирается из цели, а не наоборот. Несовпадение типа и цели — типичная ошибка, которую как раз и ловит анализ урока."], "terms": ["классно-урочная система и Коменский", "дидактическая цель урока", "комбинированный урок", "урок изучения нового материала", "урок формирования умений и навыков", "урок обобщения и систематизации", "урок контроля и коррекции", "урок открытия нового знания", "нестандартные формы урока", "интегрированный урок", "практикум"], "follow": [{"q": "Обязателен ли этап проверки домашнего задания?", "a": "Нет, он есть в структуре комбинированного урока, но не в каждом типе. На уроке открытия нового знания его заменяет актуализация опорных знаний."}, {"q": "Что такое интегрированный урок?", "a": "Урок, где материал двух и более предметов объединён вокруг одного объекта. Для ОБиЗР это, например, тема отравлений вместе с химией или тема стихийных бедствий вместе с географией."}], "notes": [{"label": "Заходит от психологии", "text": "мотивационный этап урока — не формальность, а условие включения. Можно говорить о принятии учебной задачи как психологическом условии деятельности и о том, что без этапа принятия задачи весь остальной урок работает вхолостую. Также уместно про распределение нагрузки внутри урока с учётом динамики работоспособности: новое даём в первой трети, отработку — дальше."}], "block": "Методика", "bk": "met", "tier": 1, "psy": false, "aid": false, "core": "уроки классифицируют по дидактической цели — пять основных типов плюс практикум; тип выбирается из цели, а не наоборот, и несовпадение типа и цели как раз ловит анализ урока.", "anchors": ["классно-урочная система и Коменский", "дидактическая цель", "пять типов", "комбинированный урок", "две рамки типологии"], "simple": ["Урок как форма идёт от классно-урочной системы Коменского: постоянный состав класса, фиксированное время, единая программа.", "Общепринятая типология строится по дидактической цели (её разрабатывали Есипов, Онищук, Махмутов): изучение нового, закрепление и совершенствование, обобщение и систематизация, контроль и коррекция, комбинированный. Отдельно — практикум, урок формирования умений и навыков.", "Комбинированный урок самый распространённый: проверка домашнего, новое, закрепление, задание на дом; универсален, но дробен — каждому этапу мало времени.", "Вторая рамка, ближе к языку ФГОС: урок открытия нового знания, урок рефлексии, урок построения системы знаний, урок развивающего контроля.", "Структура зависит от типа. У урока изучения нового: мотивация — актуализация опорных знаний — постановка учебной задачи — новое — первичное закрепление — рефлексия — домашнее задание.", "Мотивационный этап не формальность: без принятия учебной задачи остальной урок идёт вхолостую; новое дают в первой трети, пока работоспособность высокая. Тип выбирают из цели, их несовпадение — типичная ошибка."], "cards": [{"t": "классно-урочная система", "d": "форма организации обучения с постоянным составом класса, фиксированным временем и единой программой, восходящая к Коменскому"}, {"t": "типология уроков по дидактической цели", "d": "изучение нового материала, закрепление и совершенствование, обобщение и систематизация, контроль и коррекция, комбинированный урок"}, {"t": "комбинированный урок", "d": "самый распространённый тип, сочетающий проверку домашнего, изучение нового, закрепление и задание на дом"}, {"t": "урок формирования умений и навыков", "d": "практикум, урок отработки способа действия; на ОБиЗР его доля выше, чем у большинства предметов"}, {"t": "урок открытия нового знания", "d": "обозначение типа урока в логике системно-деятельностного подхода, наряду с уроком рефлексии, построения системы знаний и развивающего контроля"}, {"t": "интегрированный урок", "d": "урок, где материал двух и более предметов объединён вокруг одного объекта"}], "quiz": [{"q": "По какому основанию строится общепринятая типология уроков?", "ok": "По дидактической цели", "bad": ["По форме проведения", "По количеству учеников в классе", "По применяемым средствам обучения"], "why": "Разрабатывали её Есипов, Онищук, Махмутов. По форме проведения различают традиционные и нестандартные уроки — это другое основание."}, {"q": "Какой урок относится к типологии системно-деятельностного подхода?", "ok": "Урок открытия нового знания", "bad": ["Комбинированный урок", "Урок-экскурсия", "Урок изучения нового материала"], "why": "Комбинированный и урок изучения нового — классическая рамка по дидактической цели, урок-экскурсия — форма проведения."}, {"q": "Обязателен ли этап проверки домашнего задания на любом уроке?", "ok": "Нет, он входит в структуру комбинированного урока, но не в каждый тип", "bad": ["Да, он обязателен по требованиям ФГОС", "Да, без него урок не может быть зачтён при анализе", "Нет, он вообще исключён из современной структуры урока"], "why": "На уроке открытия нового знания его роль выполняет актуализация опорных знаний."}, {"q": "Какая ошибка чаще всего выявляется при анализе урока?", "ok": "Несовпадение типа урока с заявленной целью", "bad": ["Превышение отведённого времени", "Отсутствие домашнего задания", "Использование нестандартной формы"], "why": "Тип выбирается из цели. Если цель — отработка алгоритма, а урок построен как изучение нового, цель не достигается."}]}, {"n": 36, "title": "Терминальные состояния. Базовый комплекс СЛР. Оптимальное положение тела", "kostyak": ["Терминальные состояния — это обратимые стадии угасания жизни. Их последовательность: преагония, терминальная пауза, агония, клиническая смерть. За клинической смертью следует биологическая, и она уже необратима.", "Клиническая смерть длится примерно пять–шесть минут при обычной температуре. При переохлаждении срок удлиняется, поэтому утонувших в холодной воде реанимируют дольше и упорнее.", "Признаки клинической смерти для того, кто оказывает первую помощь, простые: нет сознания, нет нормального дыхания. Пульс на сонной артерии проверяют, но человек без медицинского образования не обязан на него ориентироваться — при сомнении начинают реанимацию.", "Признаки биологической смерти, при которых реанимацию не начинают: помутнение и высыхание роговицы, симптом «кошачьего глаза» — зрачок становится щелевидным при сдавлении глазного яблока, трупные пятна, трупное окоченение.", "Базовый комплекс СЛР. Убедиться в безопасности, проверить сознание, открыть дыхательные пути запрокидыванием головы и подъёмом подбородка, оценить дыхание за десять секунд, вызвать скорую по 103 или 112 и попросить принести дефибриллятор, начать компрессии.", "Цифры называю точно: руки на центр грудной клетки, на нижнюю половину грудины, компрессии на глубину пять–шесть сантиметров, с частотой сто–сто двадцать в минуту, с полным возвращением грудной клетки между нажатиями. Соотношение — тридцать компрессий на два вдоха.", "Если делать искусственное дыхание невозможно или неприятно, выполняются только непрерывные компрессии — это лучше, чем ничего. Спасатели меняются каждые две минуты, паузы минимальные. Реанимация продолжается до приезда бригады, до появления признаков жизни или до полного истощения сил.", "Отдельно назову автоматический наружный дефибриллятор. Его применение вошло в обновлённый порядок оказания первой помощи, прибор голосом ведёт человека по шагам, и использовать его может любой.", "Оптимальное положение тела — самостоятельное мероприятие из перечня. Без сознания, но дышит — устойчивое боковое положение. Кровопотеря и шок — на спине с приподнятыми ногами. Травма груди и одышка — полусидя. Травма живота — на спине с валиком под коленями. Травма таза — поза «лягушки». Подозрение на травму позвоночника — не трогать вообще."], "terms": ["преагония", "терминальная пауза", "агония", "клиническая смерть", "биологическая смерть", "симптом Белоглазова («кошачий глаз»)", "базовый комплекс сердечно-лёгочной реанимации", "компрессии грудной клетки 5–6 см", "частота 100–120 в минуту", "соотношение 30:2", "автоматический наружный дефибриллятор", "устойчивое боковое положение", "смена спасателя каждые две минуты"], "follow": [{"q": "У детей соотношение другое?", "a": "Для человека без медицинского образования допустимо использовать то же соотношение 30:2, глубина — примерно треть переднезаднего размера грудной клетки. У двух и более обученных спасателей для детей применяется 15:2, но это уже уровень профессиональной подготовки."}, {"q": "Прекардиальный удар делают?", "a": "В первой помощи — нет. Он не входит в перечень мероприятий и обычному человеку не рекомендуется."}], "notes": [], "block": "Первая помощь", "bk": "pp", "tier": 1, "psy": false, "aid": true, "core": "Терминальные состояния — обратимые ступени угасания: преагония, терминальная пауза, агония, клиническая смерть, и только биологическая необратима. Нет сознания и нет нормального дыхания — начинают СЛР, при сомнении начинают всё равно.", "anchors": ["четыре ступени", "пять–шесть минут", "безопасность", "сознание", "дыхание", "вызов", "30:2", "положение по состоянию"], "simple": ["Последовательность терминальных состояний: преагония — терминальная пауза — агония — клиническая смерть, а за ней биологическая смерть, которая необратима.", "Клиническая смерть длится примерно пять–шесть минут при обычной температуре; на холоде дольше, поэтому утонувших в ледяной воде реанимируют упорнее и дольше.", "Для начала реанимации хватает двух признаков: нет сознания и нет нормального дыхания; пульс на сонной артерии проверяют, но человек без медобразования на него полагаться не обязан — при сомнении начинают.", "Реанимацию не начинают только при признаках биологической смерти: помутнение и высыхание роговицы, симптом Белоглазова «кошачий глаз», трупные пятна, трупное окоченение.", "Параметры компрессий: руки на центр грудной клетки, глубина пять–шесть сантиметров, частота сто–сто двадцать в минуту, соотношение тридцать нажатий на два вдоха, между нажатиями грудная клетка полностью поднимается, спасатели меняются каждые две минуты; при утоплении начинают с пяти вдохов, а если дышать в рот невозможно — только компрессии, это лучше бездействия.", "Оптимальное положение тела — отдельное мероприятие из перечня: без сознания, но дышит — на бок; шок и кровопотеря — ноги вверх; травма груди — полусидя; травма живота — валик под колени; таз — «лягушка»; подозрение на травму позвоночника — не трогать. Дефибриллятор может применять любой — прибор ведёт голосом по шагам."], "cards": [{"t": "терминальные состояния", "d": "обратимые стадии угасания жизни: преагония, терминальная пауза, агония, клиническая смерть"}, {"t": "клиническая смерть", "d": "нет сознания и нормального дыхания, длится примерно пять–шесть минут, при переохлаждении дольше"}, {"t": "биологическая смерть", "d": "необратимое состояние; признаки — помутнение и высыхание роговицы, симптом Белоглазова («кошачий глаз»), трупные пятна и окоченение"}, {"t": "базовый комплекс СЛР", "d": "безопасность, проверка сознания, открытие дыхательных путей, оценка дыхания за десять секунд, вызов скорой, компрессии"}, {"t": "параметры компрессий", "d": "центр грудной клетки, глубина 5–6 см, частота 100–120 в минуту, соотношение 30:2, смена спасателя каждые две минуты"}, {"t": "автоматический наружный дефибриллятор", "d": "прибор, ведущий пользователя голосом по шагам, применять может любой человек"}], "quiz": [{"q": "Какое соотношение компрессий и вдохов в базовом комплексе СЛР?", "ok": "30 компрессий на 2 вдоха", "bad": ["15 компрессий на 2 вдоха для всех пострадавших", "5 компрессий на 1 вдох", "2 компрессии на 30 вдохов"], "why": "30:2 — универсальное соотношение для человека без медобразования. 15:2 применяют у детей двое обученных спасателей, это уже профессиональный уровень."}, {"q": "Глубина и частота компрессий у взрослого?", "ok": "5–6 см, 100–120 в минуту", "bad": ["3–4 см, 60–80 в минуту", "7–8 см, 140 в минуту", "2–3 см, 100–120 в минуту"], "why": "Мелкие нажатия не создают кровотока, слишком глубокие ломают грудную клетку. Частота ниже ста неэффективна."}, {"q": "Как часто меняются спасатели при проведении СЛР?", "ok": "Каждые две минуты, с минимальными паузами", "bad": ["Каждые десять минут", "Только когда первый спасатель полностью выдохся", "Меняться нельзя, это сбивает ритм"], "why": "Через две минуты качество нажатий падает у любого, даже если усталости не чувствуешь. Паузы при этом должны быть короткими."}, {"q": "Признак, при котором реанимацию не начинают?", "ok": "Симптом «кошачьего глаза» и трупные пятна", "bad": ["Отсутствие пульса на сонной артерии", "Расширенные зрачки без реакции на свет", "Отсутствие сознания более пяти минут"], "why": "Не начинают только при признаках биологической смерти. Расширенные зрачки и отсутствие пульса — повод реанимировать, а не отказываться."}]}, {"n": 33, "title": "Первая помощь при отсутствии сознания, наружном кровотечении, инородном теле дыхательных путей", "kostyak": ["Все три состояния входят в перечень приказа Минздрава, и по каждому есть свой порядок. Общее у них одно — начинаем с оценки обстановки и собственной безопасности. Погибший спасатель никому не помог.", "Отсутствие сознания. Проверяю сознание: окликаю, аккуратно тормошу за плечи. Если реакции нет — запрокидываю голову, поднимаю подбородок и проверяю дыхание десять секунд: вижу движение груди, слышу, чувствую щекой. Если дыхание есть — вызываю скорую и перевожу человека в устойчивое боковое положение, чтобы язык не перекрыл дыхательные пути и он не захлебнулся рвотой. Дальше контролирую дыхание до приезда бригады.", "Если дыхания нет — это уже клиническая смерть, и я перехожу к сердечно-лёгочной реанимации.", "Наружное кровотечение. Сначала определяю вид: артериальное — алая кровь пульсирующей струёй, венозное — тёмная, течёт непрерывно, капиллярное — сочится по всей поверхности раны.", "Порядок остановки такой: прямое давление на рану, потом давящая повязка, при кровотечении из конечности — пальцевое прижатие артерии выше раны и максимальное сгибание конечности. Жгут — последнее средство, только при артериальном кровотечении из конечности, которое иначе не остановить.", "Про жгут скажу отдельно, потому что здесь чаще всего ошибаются. Жгут накладывается выше раны, поверх одежды или подкладки, до исчезновения пульса и остановки кровотечения. Обязательна записка со временем. Время — около часа в тёплое время года и до получаса на холоде. Неправильно наложенный жгут стоит человеку конечности, поэтому современный подход: сначала давление, жгут только когда без него не обойтись.", "Инородное тело верхних дыхательных путей. Если человек кашляет и может говорить — не мешаю, прошу кашлять. Если кашель беззвучный, он хватается за горло, синеет — наклоняю вперёд и делаю до пяти резких ударов между лопатками основанием ладони. Не помогло — приём Геймлиха: пять толчков в надчревную область снизу вверх. Чередую до эффекта или до потери сознания, после потери сознания — реанимация.", "У детей до года иначе: удары по спине в положении лицом вниз на предплечье и толчки в грудь двумя пальцами. Приём Геймлиха грудному ребёнку не делают."], "terms": ["оценка обстановки и обеспечение безопасных условий", "устойчивое боковое положение", "западение языка", "аспирация рвотных масс", "артериальное", "венозное", "капиллярное кровотечение", "прямое давление на рану", "давящая повязка", "пальцевое прижатие артерии", "кровоостанавливающий жгут и записка со временем", "приём Геймлиха", "полная и частичная обструкция дыхательных путей"], "follow": [{"q": "Что делать, если жгут наложен больше часа, а скорой нет?", "a": "Ослабить на несколько минут, прижав артерию пальцем, дать крови пройти, затем наложить снова чуть выше прежнего места и написать новое время. Это спорный момент, разные пособия дают разные интервалы, поэтому лучше честно сказать: главное — не забыть про жгут, зафиксировать время и передать эту информацию скорой."}, {"q": "Можно ли извлекать инородное тело пальцем?", "a": "Вслепую — нет, протолкнёшь глубже. Только если предмет виден и его реально захватить."}], "notes": [], "block": "Первая помощь", "bk": "pp", "tier": 1, "psy": false, "aid": true, "core": "Без сознания, но дышит — устойчивое боковое положение; не дышит — сердечно-лёгочная реанимация. Наружное кровотечение останавливают по нарастающей: прямое давление, давящая повязка, пальцевое прижатие, и только в крайнем случае жгут, потому что неправильный жгут стоит человеку конечности.", "anchors": ["безопасность", "сознание и дыхание", "боковое положение", "давление раньше жгута", "пять ударов и Геймлих"], "simple": ["Первое действие всегда одно — оценить обстановку и убедиться в собственной безопасности: погибший спасатель никому не помог.", "Проверка сознания и дыхания: окликнуть, потрясти за плечи, запрокинуть голову, поднять подбородок и десять секунд смотреть на грудь, слушать и чувствовать дыхание щекой.", "Дышит — перевести в устойчивое боковое положение, чтобы язык не перекрыл дыхательные пути и человек не захлебнулся рвотой; не дышит — переходить к реанимации.", "Вид кровотечения различают по крови: артериальное — алая, бьёт пульсирующей струёй; венозное — тёмная, течёт непрерывно; капиллярное — сочится по всей поверхности раны.", "Порядок остановки от простого к крайнему: прямое давление на рану, давящая повязка, пальцевое прижатие артерии выше раны, максимальное сгибание конечности, и только потом жгут — выше раны, поверх одежды, до остановки крови, с запиской о времени.", "Инородное тело: человек кашляет и говорит — не мешать, просить кашлять; кашель беззвучный, хватается за горло, синеет — до пяти ударов между лопатками, затем приём Геймлиха, чередовать до эффекта.", "Малышу до года Геймлих не делают: его кладут лицом вниз на предплечье, удары по спине и толчки в грудь двумя пальцами."], "cards": [{"t": "устойчивое боковое положение", "d": "поза для того, кто без сознания, но дышит: не западает язык и не происходит аспирации рвотных масс"}, {"t": "пальцевое прижатие артерии", "d": "прижатие артерии к кости выше раны, чтобы выиграть время до повязки"}, {"t": "кровоостанавливающий жгут", "d": "крайняя мера при артериальном кровотечении из конечности: выше раны, поверх одежды, до остановки крови, обязательно записка со временем"}, {"t": "жгут — спорное место", "d": "классический подход требует жгут при любом артериальном кровотечении, современный — сначала давление и повязка, жгут только если иначе не остановить; сроки называют около часа в тепле и до получаса на холоде, но интервалы в пособиях расходятся"}, {"t": "приём Геймлиха", "d": "резкие толчки в надчревную область снизу вверх при полной обструкции дыхательных путей, грудным детям не проводится"}, {"t": "полная и частичная обструкция", "d": "при частичной человек кашляет и говорит, при полной кашель беззвучный, речи нет, нарастает синюшность"}], "quiz": [{"q": "Человек без сознания, дыхание есть. Что делаете?", "ok": "Вызываю скорую и перевожу в устойчивое боковое положение, контролирую дыхание", "bad": ["Начинаю сердечно-лёгочную реанимацию", "Оставляю лежать на спине и подкладываю под голову валик", "Пытаюсь привести в чувство нашатырным спиртом"], "why": "Дыхание есть — реанимация не нужна, задача только сохранить проходимость дыхательных путей. На спине язык западает, это и есть типичная ошибка."}, {"q": "Признак артериального кровотечения?", "ok": "Алая кровь бьёт пульсирующей струёй", "bad": ["Тёмная кровь течёт непрерывным ровным потоком", "Кровь сочится каплями по всей поверхности раны", "Кровь тёмная и выделяется толчками в такт дыханию"], "why": "Артерия — это цвет плюс пульсация. Тёмный ровный поток — вена, сочится по площади — капилляры."}, {"q": "Ребёнок подавился, громко кашляет и может сказать пару слов. Ваши действия?", "ok": "Не мешаю, прошу продолжать кашлять и наблюдаю", "bad": ["Сразу делаю пять ударов между лопатками", "Выполняю приём Геймлиха", "Пытаюсь достать предмет пальцем"], "why": "Кашель и речь означают, что воздух проходит: собственный кашель эффективнее любого приёма. Пальцем вслепую предмет проталкивают глубже."}]}, {"n": 9, "title": "Личность безопасного типа: социальная и психологическая характеристика", "kostyak": ["«Личность безопасного типа поведения — устоявшийся термин отечественной науки о безопасности. Его разработка связана с работами Мошкина, позже развивалась Гафнером, Кисляковым и другими авторами».", "«Определение: это человек, который безопасен для себя, для окружающих и для среды обитания, способен предвидеть опасности, избегать их, при необходимости грамотно действовать и не порождать опасности своим поведением».", "«Обращаю внимание на тройственность: безопасность для себя, для других, для природы. Человек, спасающий себя ценой риска для окружающих, к этому типу не относится».", "«Структуру раскрывают через компоненты. Мотивационно-ценностный: жизнь и здоровье как ценность, гуманистическая направленность, установка на ненасилие, ответственность».", "«Интеллектуальный, познавательный: знание опасностей и их источников, способность прогнозировать развитие ситуации, критичность мышления, устойчивость к манипуляциям и слухам».", "«Деятельностный: владение навыками безопасного поведения, первой помощи, самозащиты, действий при ЧС, доведённых до автоматизма».", "Заходит от психологии: «Психологическая характеристика — здесь я разверну подробнее. Эмоционально-волевая устойчивость и стрессоустойчивость, способность действовать при дефиците времени. Развитая саморегуляция и самоконтроль. Внутренний, интернальный локус контроля — человек считает, что исход зависит от него, а не от обстоятельств; это одна из наиболее устойчиво связанных с безопасным поведением черт. Адекватная самооценка: заниженная порождает беспомощность, завышенная — недооценку опасности. Зрелые копинг-стратегии, преобладание проблемно-ориентированного совладания. Низкая импульсивность и умеренная, а не повышенная склонность к риску. Развитая рефлексия и антиципация — способность предвосхищать последствия».", "Заходит от психологии: «Социальная характеристика: социальная зрелость и ответственность, эмпатия и готовность помогать, коммуникативная компетентность, способность к сотрудничеству и работе в группе, устойчивость к групповому давлению — умение сказать „нет“, когда группа склоняет к риску, толерантность и неагрессивность в конфликте».", "«Формирование — задача образования. Через содержание курса ОБЖ, через тренинги и практическую отработку действий, через уклад школы, через личный пример педагога. Формируется не знанием, а опытом безопасного поведения в реальных и моделируемых ситуациях».", "«Итоговая фраза, которую стоит сказать: личность безопасного типа — это цель воспитания в области безопасности, а культура безопасности личности из вопроса пятьдесят четыре — её содержательное наполнение. Понятия соотносятся как результат и его состав»."], "terms": ["личность безопасного типа поведения", "Мошкин", "Гафнер", "Кисляков", "мотивационно-ценностный", "интеллектуальный", "деятельностный компоненты", "интернальный локус контроля", "саморегуляция", "антиципация", "эмпатия", "устойчивость к групповому давлению", "рефлексия", "культура безопасности"], "follow": [{"q": "Чем личность безопасного типа отличается от просто осторожного человека?", "a": "— Осторожность — избегание. Личность безопасного типа не только избегает, но и действует: помогает другим, не создаёт опасности сама, способна принять решение в ситуации, где избежать уже нельзя. Плюс у неё есть ценностное основание, а не только страх."}, {"q": "Как это формировать в школе практически?", "a": "— Через деятельность: отработку алгоритмов эвакуации и первой помощи, ситуационные задачи и тренинги, проектную работу, обучение навыкам отказа и разрешения конфликтов, а также через среду, где безопасное поведение — норма взрослых, а не только требование к детям."}], "notes": [], "block": "Теория, риск, ЗОЖ", "bk": "teor", "tier": 1, "psy": true, "aid": false, "core": "Личность безопасного типа поведения — человек, безопасный сразу для себя, для окружающих и для среды. Это цель воспитания в области безопасности, а культура безопасности личности — её содержательное наполнение.", "anchors": ["Мошкин", "Гафнер", "Кисляков", "тройственность безопасности", "интернальный локус контроля", "антиципация", "устойчивость к групповому давлению"], "simple": ["Личность безопасного типа поведения — устоявшийся термин отечественной науки (работы Мошкина, позже Гафнера, Кислякова): человек, безопасный для себя, окружающих и среды, способный предвидеть опасности, избегать их, грамотно действовать и не порождать опасности своим поведением.", "Тройственность: безопасен для себя, для других, для природы. Тот, кто спасает себя ценой риска для окружающих, к этому типу не относится.", "Компоненты те же, что у культуры безопасности: мотивационно-ценностный (жизнь и здоровье как ценность, ответственность, гуманистическая направленность), интеллектуальный (знание опасностей, прогноз ситуации, критичность мышления), деятельностный (навыки безопасного поведения, первой помощи, действий при ЧС).", "Психологическое ядро: интернальный локус контроля (исход зависит от меня) — черта, наиболее устойчиво связанная с безопасным поведением; адекватная самооценка, зрелые копинг-стратегии, низкая импульсивность, развитая антиципация — способность предвосхищать последствия.", "Социальная характеристика: социальная зрелость и ответственность, эмпатия и готовность помогать, коммуникативная компетентность, устойчивость к групповому давлению — умение сказать «нет», когда группа склоняет к риску.", "Отличие от просто осторожного человека: осторожность — избегание, а личность безопасного типа ещё и действует, помогает другим и не создаёт опасности сама, и основание у неё ценностное, а не страх."], "cards": [{"t": "Личность безопасного типа поведения", "d": "человек, безопасный для себя, окружающих и среды, способный предвидеть опасности, избегать их и грамотно действовать"}, {"t": "Интернальный локус контроля → на языке БЖД", "d": "убеждение, что исход зависит от собственных действий; черта, наиболее устойчиво связанная с безопасным поведением"}, {"t": "Антиципация → на языке БЖД", "d": "способность предвосхищать последствия; личностный аналог прогнозирования в управлении риском"}, {"t": "Устойчивость к групповому давлению → на языке БЖД", "d": "умение сказать «нет», когда группа склоняет к риску; защитный фактор против опасного поведения"}, {"t": "Саморегуляция → на языке БЖД", "d": "управление своим состоянием; условие надёжности человека при дефиците времени и информации"}, {"t": "Соотношение с культурой безопасности", "d": "личность безопасного типа — цель воспитания, культура безопасности — её содержательное наполнение"}], "quiz": [{"q": "Ключевой признак личности безопасного типа поведения — это:", "ok": "Безопасность для себя, для окружающих и для среды обитания одновременно", "bad": ["Максимальное избегание любых рискованных ситуаций", "Высокий уровень физической подготовки", "Знание нормативных документов по безопасности"], "why": "Человек, спасающий себя ценой риска для окружающих, к этому типу не относится."}, {"q": "Какой локус контроля связан с безопасным поведением?", "ok": "Интернальный (внутренний)", "bad": ["Экстернальный (внешний)", "Локус контроля с безопасностью не связан", "Смешанный, с преобладанием внешнего"], "why": "Человек с внутренним локусом считает, что исход зависит от него, и потому действует, а не ждёт."}, {"q": "Чем личность безопасного типа отличается от просто осторожного человека?", "ok": "Она не только избегает опасности, но и действует, помогает другим и имеет ценностное основание, а не только страх", "bad": ["Она обладает более быстрой реакцией", "Она никогда не попадает в опасные ситуации", "Различий нет, это синонимы"], "why": "Осторожность — избегание. Здесь добавляются действие, ответственность за других и ценностная опора."}, {"q": "Как соотносятся личность безопасного типа и культура безопасности личности?", "ok": "Как результат и его содержательное наполнение", "bad": ["Это полностью тождественные понятия", "Культура безопасности относится к обществу, а личность безопасного типа к государству", "Они не связаны между собой"], "why": "Личность безопасного типа — цель воспитания, культура безопасности — то, из чего эта цель складывается."}]}, {"n": 47, "title": "Здоровье: характеристика, критерии, показатели, факторы", "kostyak": ["«Классическое определение Всемирной организации здравоохранения: здоровье — состояние полного физического, душевного и социального благополучия, а не только отсутствие болезней и физических дефектов».", "«Определение критикуют за идеальность: полного благополучия почти никто не достигает. Поэтому в науке используют динамическое понимание — здоровье как способность организма и личности адаптироваться к меняющимся условиям среды и сохранять функции».", "«Выделяют виды здоровья: соматическое, физическое, психическое и нравственное. Отдельно говорят о репродуктивном и профессиональном здоровье».", "«Уровни рассмотрения: индивидуальное здоровье, здоровье группы, общественное здоровье населения».", "«Критерии индивидуального здоровья: уровень и гармоничность физического развития, функциональное состояние систем организма, резервные возможности, уровень иммунной защиты, отсутствие хронических заболеваний, а также субъективное самочувствие».", "«Показатели общественного здоровья: демографические — рождаемость, смертность, продолжительность жизни; заболеваемость; инвалидность; физическое развитие населения».", "«Факторы, влияющие на здоровье, принято группировать в четыре блока: образ жизни, наследственность, состояние окружающей среды, уровень и качество медицинской помощи. Наибольший вклад отводят образу жизни — по разным оценкам около половины, точные проценты по источникам расходятся, поэтому назову порядок».", "Заходит от психологии: «Разверну психологическую составляющую. Психическое здоровье — сохранность психических функций, адекватность реакций, эмоциональная устойчивость. Психологическое здоровье, в традиции Дубровиной, шире: это гармония личности, способность к развитию и самореализации. Здесь работают понятия адаптации и дезадаптации, стрессоустойчивости, копинг-ресурсов, психологического благополучия. Отдельно назову понятие качества жизни, связанного со здоровьем: оно измеряется опросниками и включает субъективную оценку человеком своего состояния».", "«Для педагогики важна норма: здоровье школьника оценивают ещё и через уровень школьной адаптации, работоспособность и утомляемость в течение учебного дня»."], "terms": ["определение ВОЗ", "адаптация и дезадаптация", "соматическое", "психическое", "нравственное здоровье", "общественное здоровье", "резервы организма", "группы здоровья", "психологическое благополучие", "качество жизни", "стрессоустойчивость"], "follow": [{"q": "Почему определение ВОЗ критикуют?", "a": "— Оно описывает идеал, недостижимый в норме, статично и плохо операционализируется. Поэтому рядом с ним используют адаптационный подход и понятие функциональных резервов."}, {"q": "Чем психическое здоровье отличается от психологического?", "a": "— Психическое — медицинская категория, отсутствие расстройств и сохранность функций. Психологическое — характеристика личности: зрелость, гармония, способность справляться с трудностями и развиваться. Человек может не иметь диагноза и при этом иметь низкое психологическое благополучие."}], "notes": [], "block": "Теория, риск, ЗОЖ", "bk": "teor", "tier": 1, "psy": true, "aid": false, "core": "Здоровье по ВОЗ — полное физическое, душевное и социальное благополучие, но определение идеальное и в науке его дополняют адаптационным подходом: здоровье как способность приспосабливаться и сохранять функции. Главный вклад в здоровье даёт образ жизни.", "anchors": ["определение ВОЗ и его критика", "адаптация", "виды и уровни здоровья", "четыре группы факторов"], "simple": ["Определение ВОЗ: здоровье — состояние полного физического, душевного и социального благополучия, а не только отсутствие болезней и дефектов. Критикуют его за идеальность: полного благополучия почти никто не достигает, оно статично и плохо измеряется.", "Поэтому используют адаптационный подход: здоровье — способность организма и личности приспосабливаться к меняющимся условиям среды и сохранять функции.", "Виды здоровья: соматическое, физическое, психическое, нравственное; уровни рассмотрения — индивидуальное, групповое, общественное. Показатели общественного здоровья — демографические (рождаемость, смертность, продолжительность жизни), заболеваемость, инвалидность, физическое развитие.", "Четыре группы факторов: образ жизни, наследственность, среда, медицина. Наибольший вклад — у образа жизни, около половины (доли по источникам расходятся).", "Психическое здоровье — медицинская категория: функции сохранны, нет расстройства. Психологическое благополучие (в традиции Дубровиной) шире — гармония личности, способность к развитию; человек без диагноза вполне может быть психологически неблагополучен.", "То, что в психологии называют стрессоустойчивостью и копинг-ресурсами, в теории безопасности читается как функциональные резервы и адаптационный потенциал — запас прочности человека перед воздействием."], "cards": [{"t": "Здоровье (ВОЗ)", "d": "состояние полного физического, душевного и социального благополучия, а не только отсутствие болезней и дефектов"}, {"t": "Здоровье (адаптационный подход)", "d": "способность организма и личности приспосабливаться к меняющимся условиям среды и сохранять функции"}, {"t": "Психическое здоровье → на языке БЖД", "d": "сохранность психических функций и адекватность реакций; в терминах безопасности — надёжность человека как звена системы"}, {"t": "Психологическое благополучие (Дубровина) → на языке БЖД", "d": "гармония личности и способность к развитию; в терминах безопасности — личностный ресурс устойчивости к воздействию"}, {"t": "Стрессоустойчивость и копинг-ресурсы → на языке БЖД", "d": "функциональные резервы человека, определяющие его сопротивляемость поражающему воздействию"}, {"t": "Общественное здоровье", "d": "здоровье населения, оцениваемое через демографические показатели, заболеваемость, инвалидность, физическое развитие"}], "quiz": [{"q": "За что критикуют определение здоровья, данное ВОЗ?", "ok": "Оно описывает недостижимый идеал, статично и плохо операционализируется", "bad": ["Оно сводит здоровье только к отсутствию болезней", "Оно игнорирует физическую составляющую здоровья", "Оно применимо только к детям"], "why": "Именно поэтому рядом с ним используют адаптационный подход и понятие функциональных резервов."}, {"q": "Чем психологическое здоровье отличается от психического?", "ok": "Психическое — медицинская категория (нет расстройств), психологическое — характеристика зрелости и гармонии личности", "bad": ["Это полные синонимы", "Психологическое здоровье измеряется только врачом-психиатром", "Психическое здоровье относится к детям, психологическое — к взрослым"], "why": "Человек без диагноза может иметь низкое психологическое благополучие, и наоборот."}, {"q": "Наибольший вклад в здоровье человека вносит:", "ok": "Образ жизни", "bad": ["Уровень медицинской помощи", "Наследственность", "Состояние окружающей среды"], "why": "Четыре группы факторов известны, и образ жизни стабильно на первом месте, хотя конкретные доли по источникам расходятся."}]}, {"n": 2, "title": "Национальная безопасность. Вероятностная оценка опасного события", "kostyak": ["«Национальная безопасность — защищённость личности, общества и государства от внутренних и внешних угроз, при которой обеспечиваются реализация конституционных прав, достойное качество жизни, суверенитет и устойчивое развитие страны».", "«Предмет национальной безопасности — угрозы национальным интересам и система мер по их нейтрализации. В России общий рамочный документ — Стратегия национальной безопасности Российской Федерации; точные реквизиты редакции я называть не берусь, но логика документа именно такая».", "«Традиционно выделяют виды: военная, государственная, экономическая, информационная, экологическая, продовольственная, общественная безопасность. Список в разных источниках варьируется».", "«Три уровня объектов принято разводить. Безопасность личности — жизнь, здоровье, права, свобода. Безопасность общества — материальные и духовные ценности, институты, социальная стабильность. Безопасность государства — суверенитет, конституционный строй, территориальная целостность».", "«Между ними бывает противоречие: усиление государственной безопасности может ограничивать свободы личности. Баланс этих уровней — самостоятельная задача политики безопасности».", "«Вероятностная оценка опасного события: опасность нельзя описать словом „есть или нет“, её описывают вероятностью реализации за единицу времени».", "«Базовая формула риска — вероятность события, умноженная на тяжесть последствий. Для расчёта используют статистику происшествий, дерево отказов и дерево событий, экспертные оценки, когда статистики нет».", "«Практический смысл: вероятностная оценка позволяет сравнивать разные по природе угрозы в одной шкале и распределять ресурсы туда, где ожидаемый ущерб выше»."], "terms": ["национальные интересы", "угроза", "вызов", "риск", "Стратегия национальной безопасности РФ", "суверенитет", "вероятность реализации опасности", "ожидаемый ущерб", "дерево отказов и дерево событий", "экспертная оценка"], "follow": [{"q": "Чем угроза отличается от опасности?", "a": "— Опасность потенциальна, это свойство среды или объекта причинить вред. Угроза — опасность, ставшая конкретной: есть источник, направленность и достаточная вероятность реализации."}, {"q": "Что делать, если статистики по событию нет?", "a": "— Переходить к экспертным методам и сценарному анализу: моделировать дерево событий, оценивать вероятности ветвей экспертно, брать консервативный сценарий."}], "notes": [], "block": "Теория, риск, ЗОЖ", "bk": "teor", "tier": 2, "psy": false, "aid": false, "core": "Национальная безопасность — защищённость личности, общества и государства сразу на трёх уровнях, а опасное событие описывается не словами «есть или нет», а вероятностью и ожидаемым ущербом.", "anchors": ["три уровня объектов", "национальные интересы", "вероятность × тяжесть", "дерево отказов и событий"], "simple": ["Национальная безопасность — защищённость личности, общества и государства от внутренних и внешних угроз, при которой обеспечиваются права, качество жизни, суверенитет и устойчивое развитие страны.", "Три уровня объектов: безопасность личности (жизнь, здоровье, права, свобода), безопасность общества (материальные и духовные ценности, институты, социальная стабильность), безопасность государства (суверенитет, конституционный строй, целостность).", "Между уровнями бывает противоречие: усиление государственной безопасности может ограничивать свободы личности, и баланс этих уровней — самостоятельная задача политики безопасности.", "Опасное событие описывают не словами «есть или нет», а вероятностью реализации за единицу времени. Базовая формула риска — вероятность события, умноженная на тяжесть последствий.", "Для расчёта берут статистику происшествий, дерево отказов (от нежелательного события назад к причинам) и дерево событий (от исходного отказа вперёд к сценариям последствий), а при отсутствии статистики — экспертные оценки и консервативный сценарий.", "Смысл вероятностной оценки практический: сравнивать разные по природе угрозы в одной шкале и направлять ресурсы туда, где ожидаемый ущерб выше."], "cards": [{"t": "Национальная безопасность", "d": "защищённость личности, общества и государства от внутренних и внешних угроз, при которой обеспечиваются права, качество жизни, суверенитет и устойчивое развитие"}, {"t": "Опасность", "d": "потенциальное свойство среды или объекта причинить вред; существует всегда"}, {"t": "Угроза", "d": "опасность, ставшая конкретной: есть источник, направленность и достаточная вероятность реализации"}, {"t": "Риск (базовая формула)", "d": "вероятность события, умноженная на тяжесть последствий"}, {"t": "Дерево отказов", "d": "метод анализа, идущий от нежелательного события к его возможным причинам"}, {"t": "Дерево событий", "d": "метод анализа, идущий от исходного отказа к возможным сценариям последствий"}], "quiz": [{"q": "Чем угроза отличается от опасности?", "ok": "Угроза конкретна: есть источник, направленность и достаточная вероятность реализации", "bad": ["Угроза всегда природная, а опасность техногенная", "Угроза — то же самое, что опасность, разница только в терминологии", "Опасность реализовалась, а угроза только предполагается"], "why": "Опасность потенциальна и есть всегда; угроза — её конкретизированная, адресная форма."}, {"q": "Три уровня объектов национальной безопасности — это:", "ok": "Безопасность личности, общества и государства", "bad": ["Безопасность семьи, региона и планеты", "Экономическая, военная и информационная безопасность", "Индивидуальный, коллективный и профессиональный риск"], "why": "Экономическая и военная — это виды по сфере, а не уровни объектов. Уровни строятся по масштабу защищаемого."}, {"q": "Зачем нужна вероятностная оценка опасного события?", "ok": "Чтобы сравнивать разные по природе угрозы в одной шкале и направлять ресурсы туда, где ожидаемый ущерб выше", "bad": ["Чтобы полностью исключить возможность события", "Чтобы отказаться от экспертных методов", "Чтобы установить виновных в аварии"], "why": "Смысл вероятностного подхода практический: общая шкала и распределение ограниченных ресурсов."}]}, {"n": 56, "title": "Уровни безопасности. «Безопасность» и «устойчивость». Основы управления рисками", "kostyak": ["«Уровни безопасности выстраивают по масштабу объекта: индивидуальная безопасность личности, безопасность малой группы и коллектива, общественная, национальная, региональная и глобальная».", "«Уровни связаны, но не сводятся друг к другу: безопасность государства не складывается автоматически из безопасности каждого гражданина, и наоборот».", "«Теперь соотношение категорий. Общее у безопасности и устойчивости в том, что обе описывают способность системы сохранять себя при внешнем воздействии, и обе оцениваются через риск».", "«Различие: безопасность — характеристика защищённости от вреда, взгляд от угрозы. Устойчивость — способность системы сохранять функционирование и восстанавливаться после воздействия, взгляд от самой системы».", "«Проще: безопасность отвечает на вопрос „не ударит ли“, устойчивость — „выдержим ли и восстановимся ли“. Объект может быть устойчив, но небезопасен для окружающих, — например, надёжно работающее химическое производство рядом с жилой застройкой».", "«Управление риском — циклический процесс из четырёх шагов: идентификация опасностей, оценка риска, выбор и реализация мер, контроль и пересмотр».", "«Методы воздействия на риск: устранение источника, снижение вероятности, снижение тяжести последствий, передача риска через страхование, принятие остаточного риска».", "«В социальных системах инструменты одни — нормы, обучение, информирование, социальная поддержка; в технических — резервирование, защитные системы, регламенты обслуживания; в природных — мониторинг, прогноз, инженерная защита и ограничение хозяйственной деятельности»."], "terms": ["уровни безопасности", "устойчивость системы", "остаточный риск", "идентификация опасностей", "оценка риска", "резервирование", "страхование риска", "управляющее воздействие", "обратная связь"], "follow": [{"q": "Можно ли считать устойчивость частью безопасности?", "a": "— В ряде подходов да: устойчивость рассматривают как условие безопасности, потому что система, теряющая функции от малого воздействия, защищённой быть не может. Но понятия не тождественны."}, {"q": "Что такое остаточный риск?", "a": "— Риск, сохраняющийся после всех принятых мер защиты. Он всегда больше нуля, и задача — довести его до приемлемого уровня и осознанно принять."}], "notes": [], "block": "Теория, риск, ЗОЖ", "bk": "teor", "tier": 2, "psy": false, "aid": false, "core": "Безопасность смотрит на систему со стороны угрозы («не ударит ли»), устойчивость — изнутри самой системы («выдержим ли и восстановимся ли»). Управление риском — цикл из четырёх шагов, который никогда не заканчивается.", "anchors": ["уровни от личности до глобального", "безопасность против устойчивости", "четыре шага цикла", "остаточный риск"], "simple": ["Уровни безопасности по нарастанию масштаба: индивидуальная, групповая и коллективная, общественная, национальная, региональная, глобальная. Уровни связаны, но не складываются друг из друга автоматически.", "Общее у безопасности и устойчивости: обе описывают способность системы сохранять себя при воздействии и обе оцениваются через риск.", "Различие: безопасность — взгляд со стороны угрозы, отвечает на вопрос «не ударит ли»; устойчивость — способность сохранять функционирование и восстанавливаться, взгляд изнутри системы, «выдержим ли и восстановимся ли». Объект может быть устойчив, но небезопасен для окружающих — надёжно работающее химическое производство рядом с жильём.", "Цикл управления риском из четырёх шагов: идентификация опасностей → оценка риска → выбор и реализация мер → контроль и пересмотр. Цикл повторяется.", "Методы воздействия на риск: устранить источник, снизить вероятность, снизить тяжесть последствий, передать через страхование, принять остаточный риск.", "Остаточный риск всегда больше нуля; задача — довести его до приемлемого уровня и осознанно принять."], "cards": [{"t": "Устойчивость системы", "d": "способность сохранять функционирование и восстанавливаться после воздействия; взгляд изнутри системы"}, {"t": "Безопасность (в паре с устойчивостью)", "d": "характеристика защищённости от вреда; взгляд со стороны угрозы"}, {"t": "Остаточный риск", "d": "риск, сохраняющийся после всех принятых мер защиты; всегда больше нуля"}, {"t": "Цикл управления риском", "d": "идентификация опасностей → оценка риска → выбор и реализация мер → контроль и пересмотр"}, {"t": "Передача риска", "d": "страхование как способ переложить финансовые последствия события на другую сторону"}, {"t": "Резервирование", "d": "дублирование элементов технической системы для сохранения работоспособности при отказе"}], "quiz": [{"q": "Чем безопасность отличается от устойчивости?", "ok": "Безопасность — защищённость от вреда, взгляд от угрозы; устойчивость — способность сохранять функции и восстанавливаться, взгляд от самой системы", "bad": ["Безопасность относится к людям, а устойчивость только к техническим системам", "Это тождественные понятия", "Устойчивость оценивается через риск, а безопасность нет"], "why": "Обе категории оцениваются через риск, но точка зрения разная. Объект может быть устойчив и при этом небезопасен для окружающих."}, {"q": "Остаточный риск — это:", "ok": "Риск, сохраняющийся после всех принятых мер защиты", "bad": ["Риск, полностью устранённый в ходе управления", "Риск, который невозможно оценить количественно", "Риск, возникающий только в природных системах"], "why": "Он всегда больше нуля, и задача — довести его до приемлемого уровня и осознанно принять."}, {"q": "Верная последовательность шагов управления риском:", "ok": "Идентификация опасностей → оценка риска → выбор и реализация мер → контроль и пересмотр", "bad": ["Оценка риска → идентификация опасностей → контроль → страхование", "Страхование → оценка → идентификация → ликвидация", "Ликвидация последствий → оценка ущерба → идентификация опасностей"], "why": "Нельзя оценить то, что не выявлено, поэтому идентификация всегда первая. Цикл замыкается и повторяется."}, {"q": "Страхование как метод воздействия на риск означает:", "ok": "Передачу риска другой стороне", "bad": ["Снижение вероятности события", "Устранение источника опасности", "Снижение тяжести последствий"], "why": "Страхование не влияет ни на вероятность, ни на тяжесть — оно перераспределяет финансовые последствия."}]}, {"n": 66, "title": "Современные уровни риска опасных событий. Управление риском", "kostyak": ["«Начну с того, что риск сегодня — основной измеритель безопасности. Мировая практика перешла от концепции абсолютной безопасности к концепции приемлемого риска».", "«Концепция абсолютной безопасности предполагала: сделаем защиту такой, чтобы аварий не было вовсе. Практика показала, что это недостижимо: ресурсы конечны, а сложные системы всегда сохраняют остаточный риск».", "«Приемлемый риск — компромисс между уровнем защищённости и затратами на неё. Есть экономический предел: вкладывая всё в техническую защиту, мы отнимаем средства у здравоохранения, социальной сферы, и суммарный риск для населения растёт. Существует точка, где суммарный риск минимален, — это и есть ориентир».", "«По порядку величины индивидуальный риск гибели за год: приемлемым обычно считают уровень порядка десять в минус шестой степени, пренебрежимо малым — на порядок ниже, чрезмерным — порядка десять в минус третьей. Оговорюсь: конкретные значения различаются по странам, отраслям и источникам, я называю порядок величины, а не норматив».", "«Уровни риска в быту, на транспорте и в промышленности различаются на порядки, и субъективное восприятие риска не совпадает с расчётным: люди переоценивают редкие яркие опасности и недооценивают привычные».", "Заходит от психологии: «Это описано в психологии восприятия риска: работает эвристика доступности, и поэтому авиакатастрофа пугает сильнее, чем поездка на автомобиле, хотя расчётный риск говорит обратное. Для педагога это прямая практическая проблема: подросток недооценивает привычный риск — дорогу, воду, электричество — и переоценивает экзотический».", "«Управление риском — четыре шага: идентификация опасностей, оценка риска, выбор мер, контроль результата и пересмотр. Цикл повторяется».", "«Стратегии воздействия: устранение источника, снижение вероятности, снижение тяжести последствий, передача риска — страхование, и принятие остаточного риска. Плюс информирование населения и обучение как самостоятельный, самый дешёвый инструмент»."], "terms": ["концепция приемлемого риска", "концепция абсолютной безопасности", "остаточный риск", "экономический предел безопасности", "индивидуальный и социальный риск", "восприятие риска", "управление риском", "страхование как передача риска"], "follow": [{"q": "Кто решает, какой риск приемлем?", "a": "— Общество через государство: нормативы, экспертиза, общественное обсуждение. Это не чисто техническое решение, в нём есть ценностная составляющая — сколько общество готово платить за спасённую жизнь."}, {"q": "Почему нельзя просто вкладывать в безопасность больше?", "a": "— Потому что ресурсы ограничены и перераспределяются. Сверхзатраты на один вид защиты оголяют другие сферы, и суммарный риск для того же населения начинает расти."}], "notes": [], "block": "Теория, риск, ЗОЖ", "bk": "teor", "tier": 2, "psy": false, "aid": false, "core": "Мир перешёл от концепции абсолютной безопасности к концепции приемлемого риска, потому что ноль недостижим, а ресурсы конечны. Есть точка, где суммарный риск для населения минимален, и она и есть ориентир.", "anchors": ["абсолютная безопасность против приемлемого риска", "экономический предел", "восприятие риска", "цикл управления"], "simple": ["Мировая практика перешла от концепции абсолютной безопасности к концепции приемлемого риска: полное исключение аварий недостижимо, ресурсы конечны, а сложные системы всегда сохраняют остаточный риск.", "Приемлемый риск — компромисс между защищённостью и затратами. Экономический предел: вложив всё в техническую защиту, отнимаем ресурсы у здравоохранения и социальной сферы, и суммарный риск для населения растёт. Есть точка, где суммарный риск минимален, — это и есть ориентир.", "Восприятие риска не совпадает с расчётным: люди переоценивают редкие яркие опасности и недооценивают привычные. Работает эвристика доступности — авиакатастрофа пугает сильнее поездки на машине.", "Педагогический вывод: подросток недооценивает привычный риск — дорогу, воду, электричество — и переоценивает экзотический.", "Управление риском — четыре шага: идентификация опасностей, оценка риска, выбор и реализация мер, контроль и пересмотр. Цикл повторяется.", "Стратегии воздействия на риск: устранить источник, снизить вероятность, снизить тяжесть последствий, передать через страхование, принять остаточный риск; плюс информирование и обучение как самый дешёвый инструмент. Какой риск приемлем, решает общество через государство — нормативы, экспертиза, общественное обсуждение; в решении есть ценностная составляющая."], "cards": [{"t": "Концепция абсолютной безопасности", "d": "подход, предполагавший полное исключение аварий; признан недостижимым"}, {"t": "Концепция приемлемого риска", "d": "компромисс между уровнем защищённости и затратами на неё; ориентир — минимум суммарного риска"}, {"t": "Экономический предел безопасности", "d": "точка, за которой рост затрат на защиту отнимает ресурсы у других сфер и суммарный риск для населения растёт"}, {"t": "Восприятие риска", "d": "субъективная оценка опасности, не совпадающая с расчётной"}, {"t": "Эвристика доступности", "d": "механизм, из-за которого яркие и легко вспоминаемые события кажутся более вероятными"}, {"t": "Стратегии воздействия на риск", "d": "устранение источника, снижение вероятности, снижение тяжести последствий, передача через страхование, принятие остаточного риска"}], "quiz": [{"q": "Почему мировая практика отказалась от концепции абсолютной безопасности?", "ok": "Полное исключение аварий недостижимо: ресурсы конечны, а сложные системы сохраняют остаточный риск", "bad": ["Она оказалась слишком дешёвой в реализации", "Она не учитывала природные опасности", "Она была заменена по решению международных организаций без обоснования"], "why": "Отсюда и переход к концепции приемлемого риска как к компромиссу между защищённостью и затратами."}, {"q": "Что означает экономический предел безопасности?", "ok": "Сверхзатраты на один вид защиты отнимают ресурсы у других сфер, и суммарный риск для населения начинает расти", "bad": ["Предел, за которым страхование становится невыгодным", "Максимальную сумму, которую предприятие может потратить на охрану труда", "Стоимость ликвидации последствий крупной аварии"], "why": "Существует точка, где суммарный риск минимален, и именно она служит ориентиром."}, {"q": "Почему авиакатастрофа пугает людей сильнее, чем поездка на автомобиле?", "ok": "Работает эвристика доступности: яркие и редкие события кажутся более вероятными", "bad": ["Расчётный риск авиаперелёта действительно выше", "Люди недостаточно информированы о статистике аварий на транспорте", "Субъективное восприятие риска всегда совпадает с расчётным"], "why": "Люди переоценивают редкие яркие опасности и недооценивают привычные — это прямая проблема для педагога."}, {"q": "Кто определяет, какой уровень риска считать приемлемым?", "ok": "Общество через государство: нормативы, экспертиза, общественное обсуждение", "bad": ["Исключительно инженеры-проектировщики", "Каждый человек самостоятельно для себя", "Страховые компании"], "why": "В решении есть ценностная составляющая — сколько общество готово платить за спасённую жизнь, и это не чисто техническая задача."}]}, {"n": 54, "title": "Культура безопасности личности и её компонентный состав", "kostyak": ["«Культура безопасности личности — устойчивая система ценностей, знаний, умений и привычек поведения, которая позволяет человеку предвидеть опасности, избегать их и грамотно действовать при их возникновении».", "«Понятие пришло в широкий оборот после анализа крупных техногенных аварий: выяснилось, что техника исправна, инструкции написаны, а люди действуют вопреки им. Значит, дело в культуре, а не только в регламенте».", "«Компонентный состав обычно раскрывают через четыре-пять блоков. Первый — ценностно-мотивационный: отношение к жизни и здоровью как к ценности, установка на безопасное поведение, ответственность за себя и окружающих».", "«Второй — когнитивный, или знаниевый: знание опасностей, их источников, правил поведения, порядка действий при ЧС, основ первой помощи».", "«Третий — деятельностный, операциональный: сформированные умения и навыки — эвакуироваться, оказать помощь, пользоваться средствами защиты, оценивать обстановку».", "«Четвёртый — эмоционально-волевой: способность сохранять самообладание, управлять страхом, действовать в условиях дефицита времени и информации».", "«Пятый, который выделяют не все авторы, — рефлексивный: умение анализировать собственный опыт и ошибки, прогнозировать последствия своих решений».", "«Формируется культура безопасности через образование, семью, среду и личный опыт. В школе — прежде всего через предмет ОБЖ и уклад образовательной организации; при этом знания без ценностной установки не работают, ученик знает правила и всё равно нарушает»."], "terms": ["культура безопасности", "ценностно-мотивационный компонент", "когнитивный компонент", "деятельностный компонент", "эмоционально-волевой компонент", "рефлексия", "безопасное поведение", "готовность к действиям в ЧС"], "follow": [{"q": "Как измерить культуру безопасности у школьника?", "a": "— Комплексно: тесты знаний, наблюдение за реальным поведением и учебными эвакуациями, опросники ценностных ориентаций и отношения к риску, анализ поведения в проблемных ситуациях. Только знаниевый срез недостаточен."}, {"q": "Почему знание правил не гарантирует безопасного поведения?", "a": "— Между знанием и поступком стоит мотивация, эмоциональное состояние и групповые нормы. Если в среде рискованное поведение поощряется, знания проигрывают."}], "notes": [], "block": "Теория, риск, ЗОЖ", "bk": "teor", "tier": 2, "psy": false, "aid": false, "core": "Культура безопасности личности — это ценности, знания, умения и привычки, которые позволяют предвидеть опасность и грамотно действовать. Понятие появилось потому, что после крупных аварий выяснилось: техника исправна, инструкции написаны, а люди действуют вопреки им.", "anchors": ["техника исправна", "а люди нарушают", "ценностно-мотивационный", "когнитивный", "деятельностный", "эмоционально-волевой"], "simple": ["Культура безопасности личности — устойчивая система ценностей, знаний, умений и привычек, позволяющая предвидеть опасности, избегать их и грамотно действовать при их возникновении.", "Понятие пришло в оборот после анализа крупных техногенных аварий: техника исправна, инструкции написаны, а люди действуют вопреки им — значит, дело в культуре, а не только в регламенте.", "Компоненты: ценностно-мотивационный (отношение к жизни и здоровью как к ценности, ответственность), когнитивный (знание опасностей и правил, порядок действий при ЧС, основы первой помощи), деятельностный (умения эвакуироваться, оказать помощь, пользоваться средствами защиты), эмоционально-волевой (самообладание, управление страхом), рефлексивный (анализ своего опыта и ошибок, прогноз последствий) — пятый выделяют не все авторы.", "Главный тезис: знания без ценностной установки не работают. Между знанием и поступком стоят мотивация, эмоциональное состояние и групповые нормы, и если в среде рискованное поведение поощряется, знания проигрывают.", "Измерять культуру безопасности только тестом знаний нельзя: нужны наблюдение за реальным поведением, учебные эвакуации, опросники ценностей и отношения к риску."], "cards": [{"t": "Культура безопасности личности", "d": "устойчивая система ценностей, знаний, умений и привычек, позволяющая предвидеть опасности, избегать их и грамотно действовать"}, {"t": "Ценностно-мотивационный компонент", "d": "отношение к жизни и здоровью как к ценности, установка на безопасное поведение, ответственность за себя и окружающих"}, {"t": "Когнитивный компонент", "d": "знание опасностей, их источников, правил поведения, порядка действий при ЧС, основ первой помощи"}, {"t": "Деятельностный компонент", "d": "сформированные умения и навыки: эвакуироваться, оказать помощь, пользоваться средствами защиты, оценивать обстановку"}, {"t": "Эмоционально-волевой компонент", "d": "способность сохранять самообладание, управлять страхом, действовать при дефиците времени и информации"}, {"t": "Рефлексивный компонент", "d": "умение анализировать собственный опыт и ошибки, прогнозировать последствия своих решений"}], "quiz": [{"q": "Почему знание правил безопасности не гарантирует безопасного поведения?", "ok": "Между знанием и поступком стоят мотивация, эмоциональное состояние и групповые нормы", "bad": ["Правила безопасности сформулированы слишком сложно", "Знания быстро забываются в течение недели", "Безопасное поведение вообще не зависит от знаний"], "why": "Если в среде рискованное поведение поощряется, знания проигрывают. Отсюда и нужен ценностно-мотивационный компонент."}, {"q": "Способность сохранять самообладание и управлять страхом относится к компоненту:", "ok": "Эмоционально-волевому", "bad": ["Когнитивному", "Деятельностному", "Ценностно-мотивационному"], "why": "Когнитивный — про знания, деятельностный — про навыки, ценностный — про установки."}, {"q": "Как корректно оценить культуру безопасности школьника?", "ok": "Комплексно: тесты знаний, наблюдение за реальным поведением, опросники ценностей и отношения к риску", "bad": ["Только тестом на знание правил", "Только по отметке за четверть по ОБЖ", "Только по числу нарушений дисциплины"], "why": "Знаниевый срез отражает лишь один компонент из четырёх-пяти."}]}, {"n": 58, "title": "Причины проявления опасности. Человек как источник опасности", "kostyak": ["«Опасность существует потенциально, а проявляется при совпадении условий. Обычно называют три группы причин: естественные процессы, технические факторы и человеческий фактор».", "«Модель, которую удобно проговорить: опасность реализуется, когда совпали источник, условие реализации и незащищённый объект. Уберите любое звено — события не будет».", "«Человеческий фактор в статистике аварий — ведущая группа причин; по разным отраслям оценки различаются, но лидирующая роль признаётся повсеместно».", "«Разложу его. Первое — недостаток знаний и умений: человек не обучен, не понимает опасности процесса».", "«Второе — нарушение мотивации: человек знает и умеет, но не хочет соблюдать правила, потому что нарушение выгоднее — быстрее, удобнее, привычнее для коллектива».", "«Третье — психофизиологические причины: утомление, монотония, стресс, эмоциональная напряжённость, болезнь, алкогольное или наркотическое опьянение, снижение внимания».", "«Четвёртое — несоответствие человека требованиям деятельности: по скорости реакции, устойчивости внимания, темпераменту, состоянию здоровья».", "Заходит от психологии: «Здесь уместно назвать теорию склонности к несчастным случаям и работы по психологии труда: доля людей стабильно чаще попадает в происшествия, и это связывают с личностными чертами — импульсивностью, экстернальным локусом контроля, низкой самооценкой опасности, склонностью к риску. Отсюда практический вывод: профотбор, психологическое сопровождение, режим труда и отдыха работают на безопасность не хуже техники».", "«Итог: человек — источник опасности как оператор, как проектировщик, как руководитель, принимающий решения, и как участник социальной группы, задающей нормы поведения»."], "terms": ["человеческий фактор", "ошибочное действие", "нарушение против ошибки", "психофизиологическое состояние", "утомление и монотония", "локус контроля", "профессиональный отбор", "надёжность оператора", "склонность к риску"], "follow": [{"q": "Ошибка и нарушение — одно и то же?", "a": "— Нет, и это важное различие. Ошибка непреднамеренна, человек хотел сделать правильно. Нарушение осознанно, человек знает правило и сознательно его обходит. Меры разные: против ошибок — обучение и эргономика, против нарушений — мотивация, контроль и работа с нормами коллектива."}, {"q": "Как снизить влияние человеческого фактора?", "a": "— Проектировать технику под возможности человека, а не наоборот; нормировать режим труда и отдыха; вести профотбор и обучение; формировать культуру безопасности, где сообщать об ошибке безопаснее, чем скрывать."}], "notes": [], "block": "Теория, риск, ЗОЖ", "bk": "teor", "tier": 2, "psy": false, "aid": false, "core": "Опасность существует потенциально, а срабатывает, когда совпали источник, условие реализации и незащищённый объект. Убери любое звено — события не будет. И ведущая группа причин — человеческий фактор.", "anchors": ["три звена реализации", "четыре группы человеческого фактора", "ошибка против нарушения", "профотбор и режим труда"], "simple": ["Опасность реализуется, когда совпали три звена: источник опасности, условие реализации и незащищённый объект. Уберёшь любое звено — события не будет, на этом строится логика защиты.", "Человеческий фактор — ведущая группа причин в статистике аварий. Его раскладывают на четыре группы: недостаток знаний и умений, нарушение мотивации, психофизиологические причины (утомление, монотония, стресс, снижение внимания), несоответствие человека требованиям деятельности.", "Ошибка и нарушение — разное: ошибка непреднамеренна, человек хотел сделать верно; нарушение осознанно, человек знает правило и сознательно его обходит. Против ошибок — обучение и эргономика, против нарушений — мотивация, контроль и работа с нормами коллектива.", "Теория склонности к несчастным случаям: часть людей стабильно чаще попадает в происшествия, что связывают с импульсивностью, внешним локусом контроля, заниженной оценкой опасности, склонностью к риску.", "Практический вывод: профотбор, психологическое сопровождение и режим труда и отдыха работают на безопасность не хуже технических мер.", "Человек — источник опасности не только как оператор, но и как проектировщик, как руководитель и как участник группы, которая задаёт нормы поведения."], "cards": [{"t": "Условия реализации опасности", "d": "совпадение источника опасности, условия реализации и незащищённого объекта"}, {"t": "Ошибка", "d": "непреднамеренное неправильное действие; человек хотел выполнить работу верно"}, {"t": "Нарушение", "d": "осознанное несоблюдение известного правила ради скорости, удобства или привычки коллектива"}, {"t": "Монотония", "d": "состояние снижения активности и внимания при однообразной деятельности"}, {"t": "Надёжность оператора", "d": "способность человека безошибочно выполнять деятельность в заданных условиях и в течение заданного времени"}, {"t": "Склонность к несчастным случаям", "d": "концепция психологии труда: часть людей стабильно чаще попадает в происшествия, что связывают с личностными чертами"}], "quiz": [{"q": "Чем ошибка отличается от нарушения?", "ok": "Ошибка непреднамеренна, нарушение — осознанное несоблюдение известного правила", "bad": ["Ошибка совершается новичком, нарушение — опытным работником", "Ошибка приводит к лёгким последствиям, нарушение к тяжёлым", "Различие терминологическое, меры профилактики одинако
