рование пищевого поведения у детей."], "cards": [{"t": "Продовольственная безопасность", "d": "Состояние экономики, при котором обеспечена физическая и экономическая доступность безопасных продуктов в объёме, достаточном для активной и здоровой жизни населения."}, {"t": "Продовольственная независимость", "d": "Способность страны обеспечивать себя основными видами продукции собственного производства; составная часть продовольственной безопасности, но не равна ей."}, {"t": "Самообеспеченность", "d": "Доля собственного производства в общем объёме потребления по конкретной группе продукции."}, {"t": "Пороговые значения", "d": "Установленные Доктриной минимальные уровни самообеспеченности, ниже которых состояние считается угрожающим."}, {"t": "Физическая и экономическая доступность", "d": "Возможность реально приобрести продукты: физическая — они есть в продаже рядом, экономическая — на них хватает дохода."}, {"t": "Скрытый голод", "d": "Дефицит витаминов и микроэлементов при формально достаточной калорийности рациона."}], "quiz": [{"q": "Чем продовольственная безопасность отличается от продовольственной независимости?", "ok": "Безопасность шире: помимо доли собственного производства включает доступность и качество продуктов", "bad": ["Независимость шире: она охватывает и импорт, и экспорт", "Это синонимы, различающиеся сферой употребления", "Безопасность относится к качеству, независимость — к объёмам потребления"], "why": "Независимость — про производство. Безопасность добавляет вопрос, дошла ли безопасная еда до человека и по карману ли она ему."}, {"q": "Какое измерение продовольственной безопасности в подходе ФАО отвечает за устойчивость снабжения во времени?", "ok": "Стабильность", "bad": ["Наличие", "Доступность", "Качество и безопасность"], "why": "Наличие и доступность описывают ситуацию на момент, стабильность — сохранение её при сезонных, ценовых и логистических колебаниях."}, {"q": "Что называют скрытым голодом?", "ok": "Дефицит микронутриентов при достаточной калорийности рациона", "bad": ["Недоедание, не отражённое в официальной статистике", "Голод, вызванный разрывом логистических цепочек", "Сезонное сокращение потребления продуктов"], "why": "Калорий человеку хватает, а витаминов и микроэлементов нет. Внешне проблема незаметна, отсюда и название."}]}, {"n": 62, "title": "Современные информационные войны", "kostyak": ["Информационная война — совокупность действий по воздействию на информационную сферу противостоящей стороны при одновременной защите собственной. Понятие используется и в военном, и в широком социально-политическом смысле.", "Принято выделять два контура. Информационно-технический — воздействие на системы: кибератаки, вывод из строя инфраструктуры, перехват данных. И информационно-психологический — воздействие на сознание людей: на их представления, оценки, поведение.", "Объект воздействия во втором контуре — массовое сознание и общественное мнение. Цель — изменение поведения аудитории без применения силы.", "Методы, которые описывает наука: дезинформация, фальсификация, манипулирование, подмена понятий, дробление информации, навязывание повестки, использование эмоционально заряженных образов, фейковые сообщения.", "Механизм работает на когнитивных особенностях человека: эффект первичности, склонность к подтверждению своей точки зрения, доверие к многократно повторённому сообщению, эмоция как ускоритель распространения информации.", "Современная специфика — соцсети и алгоритмы. Скорость распространения выросла, порог входа снизился, появились информационные пузыри и эхо-камеры, а также технологии синтеза изображения и голоса, дипфейки.", "Защита строится на двух уровнях: государственном — правовое регулирование, защита критической инфраструктуры; и личностном — медиаграмотность, критическое мышление, привычка проверять источник.", "Академическая рамка тут важна: разбираю механизмы и методы, не оценивая действия конкретных сторон. Поворот в сторону школы. Медиаграмотность как задача образования: умение отличать факт от мнения, проверять первоисточник, распознавать манипулятивные приёмы в тексте и видео. Это работа классного руководителя, учителя обществознания и ОБЗР, а также психолога."], "terms": ["информационное противоборство", "информационно-психологическое воздействие", "массовое сознание", "дезинформация", "манипулирование", "фейк", "дипфейк", "эхо-камера", "медиаграмотность", "критическое мышление", "когнитивные искажения"], "follow": [{"q": "Чем информационная война отличается от обычной пропаганды?", "a": "Пропаганда — один из методов. Информационная война шире: включает технический контур и ведётся системно, с расчётом на конкретный управленческий результат."}, {"q": "Как научить подростка распознавать фейк?", "a": "Через простой алгоритм: кто источник, есть ли подтверждение в независимых источниках, какую эмоцию текст вызывает и зачем, есть ли подмена причинно-следственной связи."}], "notes": [{"label": "Заходит от психологии", "text": "манипуляция сознанием — механизмы внушения, конформизма, социального доказательства. Работы по психологии пропаганды и по когнитивным искажениям тут прямо в тему. Отдельно — психология слухов и паники: как эмоционально заряженное сообщение распространяется быстрее нейтрального."}], "block": "Социальные угрозы", "bk": "soc", "tier": 3, "psy": false, "aid": false, "core": "Информационная война ведётся в двух контурах — техническом и психологическом; во втором мишень — массовое сознание, а работает она на когнитивных особенностях человека.", "anchors": ["два контура", "массовое сознание", "методы манипулирования", "когнитивные искажения", "медиаграмотность"], "simple": ["Определение: совокупность действий по воздействию на информационную сферу противостоящей стороны при одновременной защите собственной.", "Два контура. Информационно-технический — кибератаки, вывод инфраструктуры из строя, перехват данных. Информационно-психологический — воздействие на представления, оценки и поведение людей.", "Во втором контуре объект — массовое сознание и общественное мнение, а цель — изменить поведение аудитории без применения силы.", "Методы, которые описывает наука: дезинформация, фальсификация, манипулирование, подмена понятий, дробление информации, навязывание повестки, эмоционально заряженные образы, фейковые сообщения.", "Работает это на когнитивных особенностях человека: эффект первичности, склонность подтверждать свою точку зрения, доверие к многократно повторённому сообщению, эмоция как ускоритель распространения. Современная специфика — соцсети и алгоритмы: скорость выросла, порог входа упал, появились информационные пузыри, эхо-камеры и дипфейки.", "Защита на двух уровнях: государственная — правовое регулирование и защита критической инфраструктуры; личностная — медиаграмотность, критическое мышление, привычка проверять источник."], "cards": [{"t": "Информационное противоборство", "d": "Совокупность действий по воздействию на информационную сферу противостоящей стороны при защите собственной."}, {"t": "Информационно-психологическое воздействие", "d": "Влияние на сознание, оценки и поведение людей средствами информации, без применения физической силы."}, {"t": "Массовое сознание", "d": "Совокупность представлений, настроений и оценок, разделяемых большими группами людей; основной объект воздействия во втором контуре."}, {"t": "Дезинформация", "d": "Намеренное распространение ложных или искажённых сведений для формирования нужных представлений у аудитории."}, {"t": "Дипфейк", "d": "Синтезированные средствами машинного обучения изображение, видео или голос, неотличимые от подлинных."}, {"t": "Эхо-камера", "d": "Информационная среда, где человек получает преимущественно совпадающие с его взглядами сообщения, из-за чего его позиция усиливается и кажется общепринятой."}, {"t": "Когнитивные искажения", "d": "Систематические отклонения мышления от рационального — эффект первичности, склонность к подтверждению, доверие к повторённому; на них опираются манипулятивные приёмы."}, {"t": "Медиаграмотность", "d": "Умение находить, проверять и критически оценивать информацию: отличать факт от мнения, дойти до первоисточника, увидеть манипулятивный приём."}], "quiz": [{"q": "Что относят к информационно-психологическому контуру?", "ok": "Воздействие на представления и поведение аудитории через содержание сообщений", "bad": ["Вывод из строя серверов противостоящей стороны", "Перехват данных в каналах связи", "Заражение информационных систем вредоносным ПО"], "why": "Три неверных варианта — технический контур: там мишень система. В психологическом контуре мишень человек и его решения."}, {"q": "На какой особенности психики основан приём многократного повторения сообщения?", "ok": "На росте доверия к информации по мере повторения", "bad": ["На эффекте первичности", "На эффекте новизны", "На избирательности внимания"], "why": "Повторённое сообщение воспринимается как знакомое, а знакомое — как достоверное. Эффект первичности про другое: про преимущество первого сообщения."}, {"q": "Чем информационная война отличается от пропаганды?", "ok": "Пропаганда — один из её методов; война шире и включает технический контур", "bad": ["Пропаганда ведётся только в мирное время", "Информационная война не использует средства массовой информации", "Пропаганда всегда содержит ложные сведения"], "why": "Информационная война ведётся системно и с расчётом на управленческий результат, пропаганда — лишь один из инструментов внутри неё."}, {"q": "Какой шаг алгоритма проверки фейка стоит первым?", "ok": "Установить источник сообщения", "bad": ["Оценить, какую эмоцию вызывает текст", "Найти подтверждение в независимых источниках", "Проверить причинно-следственную связь в тексте"], "why": "Без источника проверять нечего. Дальше идут подтверждение, разбор эмоции и проверка логики."}]}, {"n": 25, "title": "Инновационные подходы к проведению уроков и их педагогическая ценность", "kostyak": ["Под инновационными подходами понимаю не новизну ради новизны, а те способы организации урока, которые меняют позицию ученика с воспринимающей на действующую. Формальный признак инновации — воспроизводимость и измеримый прирост результата.", "Первая группа — проектное обучение. Корни у него старые: Дьюи и метод проектов Килпатрика. На ОБиЗР это проект по безопасности школьного маршрута, памятка для родителей, карта рисков кабинета.", "Вторая — проблемное и кейсовое обучение. Ситуационная задача с неполными данными: класс разбирает реальный случай ЧС, ищет точку, где решение ещё меняло исход. Здесь формируется способность действовать при дефиците информации.", "Третья — интерактивные и имитационные технологии: деловая и ролевая игра, тренинг, симуляция, штабная тренировка, отработка эвакуации. Для нашего предмета это самая органичная группа, потому что моделирует реальную ситуацию без реального риска.", "Четвёртая — цифровые форматы: перевёрнутый класс, когда теория изучается дома, а урок отдан отработке; виртуальные тренажёры и VR-симуляции; геймификация и образовательный квест.", "Педагогическая ценность в общем виде: рост учебной мотивации, перенос знания в действие, формирование метапредметных результатов, опыт совместной работы и ответственности за решение.", "Возрастная привязка — важная часть вопроса. В подростковом возрасте, 5–9 классы, ведущей становится общение со сверстниками, поэтому работают групповые, игровые и соревновательные форматы, где есть роль и признание группы.", "В старших классах, 10–11, ведущей становится учебно-профессиональная деятельность и самоопределение, поэтому лучше идут проектные и исследовательские форматы, кейсы, дискуссии, профориентационная линия — военная служба, спасательные профессии.", "Ограничение назову сам: инновационные формы дороже по времени и требуют подготовки. Их не ставят на каждый урок, они дополняют базовое обучение алгоритмам, а не вытесняют его."], "terms": ["инновация и воспроизводимость технологии", "метод проектов", "Дьюи и Килпатрик", "кейс-метод и ситуационная задача", "деловая и ролевая игра", "имитационное моделирование", "перевёрнутый класс", "геймификация и образовательный квест", "интерактивные технологии", "ведущая деятельность возраста", "субъектная позиция ученика"], "follow": [{"q": "Любая ли новая форма — инновация?", "a": "Нет. Инновация предполагает изменение результата и возможность повторить это другим учителем. Разовая находка — приём, а не инновация."}, {"q": "Чем деловая игра отличается от ролевой?", "a": "В деловой моделируется профессиональная деятельность и система отношений с принятием решений, в ролевой акцент на исполнении роли и взаимодействии участников."}], "notes": [{"label": "Заходит от психологии", "text": "обоснование через возрастную периодизацию Эльконина — это сильный ход и прямое попадание в формулировку вопроса про «обучающихся разного возраста». Ведущая деятельность подростка — интимно-личностное общение, отсюда групповые форматы; у старшего школьника — учебно-профессиональная, отсюда проекты и профориентация. Плюс можно добавить про эффект переживания и эмоциональной вовлечённости: то, что прожито в игровой ситуации, воспроизводится в реальной лучше, чем выученное."}], "block": "Методика", "bk": "met", "tier": 3, "psy": false, "aid": false, "core": "инновационным считается не новое ради нового, а то, что меняет позицию ученика с воспринимающей на действующую и при этом воспроизводимо; выбор формата привязывается к ведущей деятельности возраста.", "anchors": ["воспроизводимость", "проектное и кейсовое", "игра и симуляция", "цифровые форматы", "ведущая деятельность"], "simple": ["Формальный признак инновации — не новизна, а измеримый прирост результата плюс возможность повторить это другим учителем; разовая находка — приём, а не инновация.", "Четыре группы: проектное обучение (Дьюи, метод проектов Килпатрика), проблемное и кейсовое (ситуационная задача с неполными данными), интерактивно-имитационное (деловые и ролевые игры, тренинги, симуляции, отработка эвакуации), цифровое (перевёрнутый класс, VR, геймификация, образовательный квест).", "Для ОБиЗР самая органичная — третья группа: она моделирует реальную ситуацию без реального риска.", "Педагогическая ценность: рост учебной мотивации, перенос знания в действие, метапредметные результаты, опыт совместной работы и ответственности за решение.", "Возрастная привязка: в 5–9 классах ведущая деятельность — общение со сверстниками, значит групповое, игровое, соревновательное; в 10–11 — учебно-профессиональная и самоопределение, значит проекты, кейсы, дискуссии, профориентация.", "Деловая игра моделирует профессиональную деятельность и принятие решений, ролевая — исполнение роли и взаимодействие. Такие формы дороже по времени и дополняют отработку алгоритмов, а не вытесняют её."], "cards": [{"t": "инновация в обучении", "d": "подход, который меняет позицию ученика на действующую, даёт измеримый прирост результата и воспроизводим другим учителем"}, {"t": "метод проектов", "d": "форма обучения через самостоятельно выполненный практический продукт; восходит к Дьюи и Килпатрику"}, {"t": "кейс-метод", "d": "разбор ситуационной задачи с неполными данными, формирующий способность действовать при дефиците информации"}, {"t": "деловая игра", "d": "имитация профессиональной деятельности и системы отношений с принятием решений участниками"}, {"t": "ролевая игра", "d": "форма с акцентом на исполнении роли и взаимодействии участников, а не на моделировании профессии"}, {"t": "ведущая деятельность возраста", "d": "деятельность, определяющая развитие на данном этапе: у подростка — общение со сверстниками, у старшеклассника — учебно-профессиональная"}], "quiz": [{"q": "Что является формальным признаком педагогической инновации?", "ok": "Воспроизводимость и измеримый прирост результата", "bad": ["Использование цифровых технологий", "Отсутствие такой формы в практике школы ранее", "Положительный отклик учеников"], "why": "Разовая удачная находка — приём. Инновацию должен суметь повторить другой учитель и получить тот же результат."}, {"q": "Какие форматы лучше работают в 5–9 классах и почему?", "ok": "Групповые, игровые и соревновательные, потому что ведущая деятельность подростка — общение со сверстниками", "bad": ["Лекционные, потому что подростки способны к длительному сосредоточению", "Индивидуальные проектные, потому что подросток стремится к самоопределению", "Репродуктивные, потому что в этом возрасте важна точность воспроизведения"], "why": "Индивидуальные проекты и профориентация ложатся на старшую школу, где ведущей становится учебно-профессиональная деятельность."}, {"q": "Чем деловая игра отличается от ролевой?", "ok": "В деловой моделируется профессиональная деятельность и принятие решений", "bad": ["Деловая игра проводится только со старшеклассниками", "В ролевой игре нет распределения ролей между участниками", "Деловая игра не требует подведения итогов"], "why": "В ролевой акцент на исполнении роли и взаимодействии, в деловой — на системе отношений и решениях."}, {"q": "Какое ограничение инновационных форм честно назвать самому?", "ok": "Они дороже по времени и дополняют базовую отработку алгоритмов, а не заменяют её", "bad": ["Они не соответствуют требованиям ФГОС", "Они применимы только во внеурочной деятельности", "Они не позволяют оценивать результат"], "why": "Названное самим ограничение показывает, что человек понимает границы применимости, а не пересказывает конспект."}]}, {"n": 31, "title": "Учебники и учебные пособия по ОБиЗР/ОБЖ", "kostyak": ["Начну с механизма, а не со списка. В школе разрешено использовать не любой учебник, а тот, что включён в федеральный перечень учебников, утверждаемый Министерством просвещения.", "Попадание в перечень означает, что учебник прошёл экспертизу — научную, педагогическую, общественную, а для ряда предметов и этнокультурную — и соответствует ФГОС. Это и есть современный аналог грифа.", "Перечень регулярно обновляется, поэтому конкретные позиции нужно смотреть в актуальной редакции. Называть строки перечня по памяти я бы не стал — это как раз тот случай, когда точность важнее уверенности.", "Отдельно замечу: наряду с учебниками из перечня допускаются учебные пособия от организаций, включённых в утверждённый министерством список, — это методички, рабочие тетради, атласы.", "По прежнему курсу ОБЖ школы много лет работали с несколькими устоявшимися линейками: линия Смирнова и Хренникова в издательстве «Просвещение», линия Виноградовой и Смирнова, линия Латчука и Маркова, работы Фролова, для старшей школы — учебники Кима и Горского.", "С переходом на ОБиЗР в 2024 году содержание изменилось, появился военный блок, и линейки пересматривались: часть учебников переработана под новое название и новую федеральную рабочую программу, к ним выпущены методические пособия.", "Есть также линия на единые государственные учебники по ряду предметов — она задаёт общий вектор, и для предметов с идеологической и оборонной составляющей это обсуждается особенно активно.", "Для методической подготовки самого учителя список другой: по теории и методике обучения безопасности жизнедеятельности это работы Суворовой и Горичевой, Акимовой и Лутовиной, по безопасности образовательной среды — Кисляков и Петров, по культуре безопасности — Гафнер.", "Критерии выбора учебника учителем: соответствие федеральной рабочей программе, наличие в перечне, методический аппарат — задания разного уровня, практикумы, алгоритмы, и наличие цифрового сопровождения."], "terms": ["федеральный перечень учебников", "экспертиза учебника — научная", "педагогическая", "общественная", "учебные пособия организаций из перечня министерства", "методический аппарат учебника", "учебно-методический комплекс", "линия учебников и её завершённость", "Смирнов и Хренников", "Ким и Горский", "Суворова", "Акимова и Лутовина как методическая литература для педагога", "Кисляков и Петров по безопасности образовательной среды"], "follow": [{"q": "Можно ли учить по учебнику не из перечня?", "a": "В качестве основного учебника — нет. Как дополнительный материал педагог вправе использовать иные источники под свою методическую ответственность."}, {"q": "Что входит в УМК?", "a": "Учебник, рабочая программа, методическое пособие для учителя, рабочая тетрадь, дидактические материалы, электронное приложение."}], "notes": [{"label": "Заходит от психологии", "text": "можно оценить учебник с точки зрения читателя-подростка: доступность текста, объём абзаца, наличие визуальных опор, соответствие возрастным особенностям восприятия и памяти. Учебник по ОБиЗР должен работать как источник алгоритмов, к которому возвращаются, а значит его структура должна поддерживать быстрый поиск."}], "block": "Методика", "bk": "met", "tier": 3, "psy": false, "aid": false, "core": "в школе как основной используется только учебник из федерального перечня; попадание в перечень означает пройденную экспертизу и соответствие ФГОС, конкретные позиции смотрят в актуальной редакции.", "anchors": ["федеральный перечень", "экспертиза", "УМК", "методический аппарат", "критерии выбора"], "simple": ["В школе как основной разрешён только учебник из федерального перечня, утверждаемого Министерством просвещения; перечень регулярно обновляется, конкретные позиции смотрят в актуальной редакции.", "Попадание в перечень означает пройденную экспертизу — научную, педагогическую, общественную, для ряда предметов ещё этнокультурную — и соответствие ФГОС; это современный аналог грифа.", "Рядом с учебниками допускаются учебные пособия организаций из утверждённого министерством списка: методички, рабочие тетради, атласы.", "УМК — не только учебник: плюс рабочая программа, методическое пособие, рабочая тетрадь, дидактические материалы, электронное приложение.", "По прежнему ОБЖ школы работали с устоявшимися линейками (Смирнов и Хренников, Латчук, для старшей школы Ким и Горский); с переходом на ОБиЗР линейки пересматривались под новое название и новую федеральную рабочую программу.", "Критерии выбора учебника: соответствие федеральной рабочей программе, наличие в перечне, качество методического аппарата (задания разного уровня, практикумы, алгоритмы) и цифровое сопровождение."], "cards": [{"t": "федеральный перечень учебников", "d": "утверждаемый Министерством просвещения список учебников, допущенных к использованию в школе в качестве основных"}, {"t": "экспертиза учебника", "d": "научная, педагогическая, общественная, для ряда предметов этнокультурная проверка перед включением в перечень; современный аналог грифа"}, {"t": "учебно-методический комплекс", "d": "учебник, рабочая программа, методическое пособие для учителя, рабочая тетрадь, дидактические материалы, электронное приложение"}, {"t": "линия учебников", "d": "комплект учебников одного авторского коллектива по годам обучения; ценится её завершённость"}, {"t": "методический аппарат учебника", "d": "задания разного уровня, практикумы, алгоритмы, вопросы и памятки, обеспечивающие работу ученика с текстом"}, {"t": "критерии выбора учебника", "d": "соответствие федеральной рабочей программе, наличие в перечне, качество методического аппарата, цифровое сопровождение"}], "quiz": [{"q": "На каком основании учебник допускается к использованию в школе как основной?", "ok": "На основании включения в федеральный перечень учебников", "bad": ["На основании решения педагогического совета школы", "На основании рекомендации издательства", "На основании выбора учителя под его методическую ответственность"], "why": "Педагог вправе привлекать иные источники как дополнительный материал, но основным учебником может быть только учебник из перечня."}, {"q": "Что означает включение учебника в федеральный перечень?", "ok": "Учебник прошёл экспертизу и соответствует ФГОС", "bad": ["Учебник закупается за счёт федерального бюджета", "Учебник обязателен для всех школ страны", "Учебник переиздан не позднее текущего года"], "why": "Экспертиза — научная, педагогическая, общественная, для ряда предметов этнокультурная. Это и есть современный аналог грифа."}, {"q": "Что входит в учебно-методический комплекс помимо учебника?", "ok": "Рабочая программа, методическое пособие, рабочая тетрадь, дидактические материалы, электронное приложение", "bad": ["Только методическое пособие для учителя", "Журнал инструктажей и паспорт кабинета", "Федеральный перечень и порядок его формирования"], "why": "УМК — комплект средств вокруг учебника, обеспечивающий и работу учителя, и самостоятельную работу ученика."}, {"q": "Как правильно ответить на просьбу назвать конкретные позиции федерального перечня?", "ok": "Описать механизм и сказать, что позиции смотрят в актуальной редакции перечня", "bad": ["Перечислить учебники по памяти", "Сказать, что перечень не имеет значения для учителя", "Назвать издательство вместо авторов"], "why": "Перечень регулярно обновляется. Точность здесь важнее уверенности, и комиссия это считывает как профессиональную позицию."}]}, {"n": 32, "title": "Требования к организации самостоятельной работы учащихся по ОБиЗР/ОБЖ", "kostyak": ["Самостоятельная работа — деятельность ученика по заданию и под руководством учителя, но без его непосредственного участия. Разработку этой темы в отечественной дидактике связывают прежде всего с Пидкасистым и Есиповым.", "Виды по месту: классная и домашняя. По дидактической цели: на усвоение нового, на закрепление, на применение, на контроль. По уровню самостоятельности: воспроизводящая, реконструктивная, вариативная, творческая — это восходящая шкала.", "Первое требование — целенаправленность. Ученик должен понимать, зачем он это делает и как это связано с темой. Задание «прочитать параграф» этому не отвечает.", "Второе — посильность и дифференциация. Задание в зоне ближайшего развития: слишком лёгкое не развивает, слишком трудное вызывает отказ. Отсюда разноуровневые варианты.", "Третье — чёткая инструкция и известные критерии оценки. Ученик заранее знает, что считается выполненным.", "Четвёртое — обучение самим способам работы. Нельзя требовать анализа источника, не научив анализировать источник. Нужны памятки, алгоритмы, образцы выполнения.", "Пятое — обязательная проверка и обратная связь. Непроверенная самостоятельная работа обесценивает следующую.", "Шестое — нарастание самостоятельности от класса к классу и разумное дозирование по времени с учётом санитарных норм на домашнее задание.", "Специфика ОБиЗР: значительная часть самостоятельной работы должна быть практико-ориентированной и связанной с собственной жизнью ученика. Примеры заданий: составить план эвакуации своей квартиры, собрать тревожный чемоданчик и обосновать состав, проверить дом на пожарные риски по чек-листу, разобрать реальный новостной случай ЧС, проанализировать сообщение из соцсети на достоверность.", "Отдельно — задания с семьёй: маршрут безопасности, место встречи семьи при эвакуации. Это переносит результат из школы в реальную жизнь, что для нашего предмета и есть цель."], "terms": ["самостоятельная работа как вид познавательной деятельности", "Пидкасистый", "воспроизводящая", "реконструктивная", "вариативная", "творческая работа", "дифференциация заданий", "алгоритм и памятка", "инструктирование", "самоконтроль и самооценка", "практико-ориентированное задание", "дозирование домашнего задания", "обратная связь"], "follow": [{"q": "Чем самостоятельная работа отличается от домашнего задания?", "a": "Домашняя работа — частный случай по месту выполнения. Самостоятельная работа может проходить и на уроке, и это её основная развивающая форма."}, {"q": "Как проверять творческие задания?", "a": "По заранее объявленным критериям, лучше в формате защиты или взаимооценки по чек-листу, чтобы работал самоконтроль."}], "notes": [{"label": "Заходит от психологии", "text": "тут прямая опора на зону ближайшего развития при подборе трудности задания, на поэтапное формирование умственных действий Гальперина в части ориентировочной основы — сначала полная схема действия, затем свёртывание, и на саморегуляцию учебной деятельности. Уместно сказать, что самостоятельная работа формирует не только знания, но и волевую регуляцию, и что для подростка мотивирующей оказывается личная значимость задания, а не его учебная необходимость."}], "block": "Методика", "bk": "met", "tier": 3, "psy": false, "aid": false, "core": "самостоятельная работа — деятельность ученика по заданию учителя, но без его непосредственного участия; она развивает, только если у задания есть цель, посильность, критерии и обязательная обратная связь.", "anchors": ["Пидкасистый", "четыре уровня самостоятельности", "зона ближайшего развития", "инструкция и критерии", "обязательная проверка"], "simple": ["Самостоятельная работа — деятельность ученика по заданию и под руководством учителя, но без его непосредственного участия; разработку темы связывают с Пидкасистым и Есиповым.", "Уровни по самостоятельности — восходящая шкала из четырёх ступеней: воспроизводящая, реконструктивная, вариативная, творческая.", "Требования: целенаправленность (ученик понимает, зачем задание и как оно связано с темой), посильность и дифференциация (задание в зоне ближайшего развития — лёгкое не развивает, неподъёмное вызывает отказ), чёткая инструкция и известные критерии.", "Ещё требования: обучение самому способу работы (нельзя требовать анализа источника, не научив анализировать — сначала ориентировочная основа: памятка, алгоритм, образец, потом свёртывание), обязательная проверка и обратная связь, нарастание самостоятельности от класса к классу.", "Непроверенная работа обесценивает следующую.", "Специфика ОБиЗР: работа должна быть практико-ориентированной и связанной с жизнью ученика — план эвакуации своей квартиры, проверка дома по чек-листу пожарных рисков, разбор новостного случая ЧС; для подростка мотивирует личная значимость задания, а не его учебная необходимость."], "cards": [{"t": "самостоятельная работа", "d": "деятельность ученика по заданию и под руководством учителя, но без его непосредственного участия"}, {"t": "уровни самостоятельности работы", "d": "воспроизводящая, реконструктивная, вариативная, творческая — восходящая шкала"}, {"t": "посильность задания", "d": "подбор трудности в зоне ближайшего развития: слишком лёгкое не развивает, слишком трудное вызывает отказ"}, {"t": "инструктирование", "d": "объяснение способа выполнения через памятку, алгоритм и образец до начала самостоятельной работы"}, {"t": "практико-ориентированное задание", "d": "задание, связанное с собственной жизнью ученика: план эвакуации своей квартиры, проверка дома по чек-листу пожарных рисков"}, {"t": "обратная связь", "d": "обязательная проверка результата с указанием конкретной ошибки; без неё следующая самостоятельная работа обесценивается"}], "quiz": [{"q": "Чем самостоятельная работа отличается от домашнего задания?", "ok": "Домашняя работа — частный случай по месту выполнения, самостоятельная возможна и на уроке", "bad": ["Это одно и то же", "Самостоятельная работа всегда оценивается отметкой", "Домашнее задание не относится к самостоятельной работе"], "why": "Основная развивающая форма — как раз самостоятельная работа на уроке, под наблюдением, но без прямого участия учителя."}, {"q": "Как выглядит восходящая шкала уровней самостоятельной работы?", "ok": "Воспроизводящая, реконструктивная, вариативная, творческая", "bad": ["Классная, домашняя, проектная, исследовательская", "Обучающая, закрепляющая, контролирующая", "Индивидуальная, парная, групповая"], "why": "Первая шкала — по уровню самостоятельности, остальные варианты смешивают деление по месту, по цели и по форме организации."}, {"q": "Почему задание «прочитать параграф» не отвечает требованию целенаправленности?", "ok": "Ученик не понимает, зачем он это делает и как это связано с темой", "bad": ["Оно превышает санитарные нормы по времени", "Оно относится к творческому уровню", "Оно не может быть проверено вообще"], "why": "Требование целенаправленности означает, что ученик видит смысл задания и его место в теме."}, {"q": "Что должно предшествовать заданию на анализ источника?", "ok": "Обучение самому способу анализа через памятку, алгоритм и образец", "bad": ["Выставление предварительной отметки", "Проведение контрольной работы по теме", "Согласование задания с родителями"], "why": "Нельзя требовать способа, которому не учили. Сначала полная ориентировочная основа, затем её свёртывание."}]}, {"n": 41, "title": "Методика использования ИКТ в обучении ОБиЗР/ОБЖ", "kostyak": ["Сразу зафиксирую позицию: информационно-коммуникационные технологии — средство обучения, а не цель. Методическая ошибка — заменять деятельность ученика показом красивой презентации.", "Дидактические функции ИКТ на нашем предмете: визуализация процессов, которые нельзя показать вживую; моделирование опасных ситуаций без риска; тренаж и отработка алгоритмов; контроль и самопроверка; организация проектной работы.", "Первая группа средств — демонстрационные: презентация, видеофрагмент, инфографика, анимация развития пожара или распространения облака заражения. Здесь важен принцип: короткий фрагмент под конкретную задачу, а не фильм на весь урок.", "Вторая — интерактивные и тренажёрные: виртуальные симуляторы эвакуации, тренажёры сердечно-лёгочной реанимации с обратной связью, VR-сценарии. Их ценность в том, что ученик получает опыт действия в ситуации, которую в школе не воспроизвести.", "Третья — контролирующие: онлайн-тесты с мгновенной обратной связью, интерактивные квизы, электронные чек-листы для практического зачёта.", "Четвёртая — информационные ресурсы: материалы МЧС, официальные памятки, статистика, картографические сервисы, ресурсы федеральной образовательной платформы.", "Отдельная линия, специфичная для предмета: ИКТ здесь не только инструмент, но и объект изучения. Модуль информационной безопасности — цифровая гигиена, распознавание фейков и вовлечения в деструктивные сообщества, защита персональных данных, кибербуллинг, мошенничество.", "Методические требования: соответствие цели урока, дозирование экранного времени по санитарным нормам, смена видов деятельности, проверка достоверности источника, доступность материала для всех учеников.", "И ограничение, которое стоит назвать самому: симулятор не заменяет отработку руками. Первую помощь нельзя освоить по видео, нужен манекен и физическое действие."], "terms": ["ИКТ как средство обучения", "цифровая образовательная среда", "принцип наглядности и его цифровое воплощение", "виртуальный тренажёр и симуляция", "VR-технологии в обучении безопасности", "интерактивная доска", "электронные образовательные ресурсы", "перевёрнутый класс", "цифровая гигиена и медиаграмотность", "санитарные нормы экранного времени", "Роберт и теория информатизации образования"], "follow": [{"q": "Как оценить эффективность ИКТ на уроке?", "a": "По достижению цели урока, а не по факту применения техники. Если тот же результат достигается быстрее без компьютера — техника избыточна."}, {"q": "Какие риски у цифровых средств на ОБиЗР?", "a": "Иллюзия компетентности: ученик прошёл симулятор и считает, что умеет. Нужен обязательный практический зачёт живьём."}], "notes": [{"label": "Заходит от психологии", "text": "сильный ход — говорить о когнитивной нагрузке: перегруженный слайд с текстом и анимацией одновременно ухудшает усвоение, потому что конкурируют каналы восприятия. Отсюда правило одного смысла на слайд. Плюс тема клипового восприятия у подростков, произвольного внимания и его удержания, и мотивирующего эффекта немедленной обратной связи в тренажёре."}], "block": "Методика", "bk": "met", "tier": 3, "psy": false, "aid": false, "core": "ИКТ на ОБиЗР — средство, а не цель; они дают то, что иначе не показать и не отработать без риска, но симулятор не заменяет действие руками, а информационная безопасность здесь ещё и предмет изучения.", "anchors": ["средство", "а не цель", "четыре группы средств", "ИКТ как объект изучения", "когнитивная нагрузка", "практический зачёт живьём"], "simple": ["ИКТ — средство обучения, а не цель; подменять деятельность ученика показом красивой презентации — методическая ошибка, эффективность меряют по достижению цели урока.", "Дидактические функции: визуализация процессов, которые нельзя показать вживую, моделирование опасных ситуаций без риска, тренаж алгоритмов, контроль и самопроверка.", "Четыре группы средств: демонстрационные (презентация, видеофрагмент, анимация), интерактивно-тренажёрные (симуляторы эвакуации, тренажёры реанимации, VR), контролирующие (онлайн-тесты, электронные чек-листы), информационные ресурсы. Правило демонстрации: короткий фрагмент под конкретную задачу, а не фильм на весь урок.", "Особенность предмета: ИКТ здесь и инструмент, и объект изучения — модуль информационной безопасности: цифровая гигиена, распознавание фейков, вовлечение в деструктивные сообщества, персональные данные, кибербуллинг.", "Когнитивная нагрузка: текст и анимация одновременно конкурируют за каналы восприятия, отсюда правило одного смысла на слайд; экранное время дозируют по санитарным нормам.", "Риск — иллюзия компетентности после симулятора: первую помощь по видео не освоить, нужен манекен и физическое действие, поэтому практический зачёт живьём обязателен."], "cards": [{"t": "ИКТ как средство обучения", "d": "инструмент достижения цели урока, эффективность которого оценивается по результату, а не по факту применения техники"}, {"t": "виртуальный тренажёр и симуляция", "d": "цифровое средство, дающее опыт действия в ситуации, которую в школе невозможно воспроизвести без риска"}, {"t": "цифровая гигиена и медиаграмотность", "d": "содержание модуля информационной безопасности: распознавание фейков, защита персональных данных, противодействие кибербуллингу и мошенничеству"}, {"t": "когнитивная нагрузка", "d": "ограничение объёма одновременно перерабатываемой информации; перегруженный слайд ухудшает усвоение, отсюда правило одного смысла на слайд"}, {"t": "электронные образовательные ресурсы", "d": "цифровые материалы для обучения и контроля, указание на которые входит в тематическое планирование программы"}, {"t": "иллюзия компетентности", "d": "эффект, при котором ученик после симулятора считает, что умеет действовать; снимается практическим зачётом живьём"}], "quiz": [{"q": "Как оценивается эффективность применения ИКТ на уроке?", "ok": "По достижению цели урока, а не по факту применения техники", "bad": ["По количеству использованных цифровых средств", "По времени работы с экраном", "По наличию интерактивной доски в кабинете"], "why": "Если тот же результат достигается быстрее без компьютера, техника избыточна."}, {"q": "Почему перегруженный текстом и анимацией слайд ухудшает усвоение?", "ok": "Конкурируют каналы восприятия и растёт когнитивная нагрузка", "bad": ["Ученики хуже видят мелкий шрифт", "Нарушаются санитарные нормы экранного времени", "Слайд дольше загружается"], "why": "Отсюда практическое правило: один смысл на слайд."}, {"q": "В чём особенность ИКТ именно на предмете ОБиЗР?", "ok": "Они одновременно средство обучения и объект изучения", "bad": ["Они применяются только на этапе контроля", "Они полностью заменяют практическую отработку", "Они используются исключительно во внеурочной деятельности"], "why": "Модуль информационной безопасности делает цифровую среду содержанием предмета, а не только инструментом."}, {"q": "Какой риск цифровых средств стоит назвать самому?", "ok": "Иллюзия компетентности: ученик прошёл симулятор и считает, что умеет", "bad": ["Поломка оборудования во время урока", "Отсутствие интернета в кабинете", "Высокая стоимость лицензий"], "why": "Первую помощь по видео не освоить, нужен манекен и физическое действие, поэтому практический зачёт обязателен."}]}, {"n": 42, "title": "Интеграция ОБиЗР/ОБЖ с другими образовательными областями", "kostyak": ["Основание для разговора — принцип межпредметных связей, который в отечественной дидактике разрабатывала Максимова. Он снимает разорванность знаний и позволяет ученику увидеть один объект с разных сторон.", "Для ОБиЗР интеграция не дополнение, а условие: предмет по природе междисциплинарный, он собирает материал из естественных и социальных наук вокруг задачи сохранения жизни.", "Биология: организм и его реакции — кровообращение и дыхание как основа первой помощи, действие ядов, инфекционные заболевания и пути передачи, иммунитет и вакцинация, влияние вредных веществ на организм.", "Экология: качество среды и здоровье, антропогенное воздействие, загрязнение воды и воздуха, глобальные проблемы, экологический риск и понятие предельно допустимой концентрации.", "Химия: свойства аварийно опасных химических веществ, хлор и аммиак и правильные действия при их выбросе, горение и условия его прекращения, продукты горения и отравление угарным газом, бытовая химия.", "География: районирование опасных природных явлений — сейсмические зоны, паводки, лавины, карта рисков региона, ориентирование на местности и автономное существование, климат и его связь с типами ЧС.", "История: опыт войн и оборонной подготовки, история гражданской обороны в стране, крупные техногенные катастрофы и извлечённые уроки, воинские традиции и подвиг — материал для военного модуля.", "Обществознание: право и правопорядок, обязанность защиты Отечества, правовые последствия действий несовершеннолетних, терроризм и экстремизм как социальные явления, национальная безопасность, информационное общество и его риски.", "Формы интеграции на практике: интегрированный урок с учителем-предметником, единая проектная задача, предметная неделя безопасности, согласование календарно-тематических планов, чтобы тема отравлений на ОБиЗР шла рядом с соответствующей темой химии.", "Методическая тонкость: интеграция требует не смешения содержания, а согласования логики. Иначе получается урок, где два учителя рассказывают параллельно и ученик не понимает, что здесь главное."], "terms": ["межпредметные связи и Максимова", "интегрированный урок", "метапредметность", "целостная картина мира", "перенос знаний", "аварийно опасные химические вещества", "предельно допустимая концентрация", "районирование природных рисков", "согласование календарно-тематических планов", "междисциплинарный характер предмета"], "follow": [{"q": "Чем интеграция отличается от межпредметных связей?", "a": "Межпредметные
