вы"], "why": "Меры разные: против ошибок — обучение и эргономика, против нарушений — мотивация, контроль и работа с нормами коллектива."}, {"q": "Опасность реализуется, когда совпали:", "ok": "Источник опасности, условие реализации и незащищённый объект", "bad": ["Только источник опасности и высокая вероятность", "Только человеческий фактор и износ оборудования", "Только природное явление и населённая территория"], "why": "Уберите любое из трёх звеньев — события не будет. На этом и строится логика защиты."}, {"q": "Что относится к психофизиологическим причинам опасных действий?", "ok": "Утомление, монотония, стресс, снижение внимания", "bad": ["Отсутствие письменных инструкций на рабочем месте", "Износ оборудования", "Ошибки проектирования технической системы"], "why": "Это отдельная группа внутри человеческого фактора, наряду с недостатком знаний, нарушением мотивации и несоответствием требованиям деятельности."}, {"q": "Какой практический вывод следует из концепции склонности к несчастным случаям?", "ok": "Профотбор, психологическое сопровождение и режим труда и отдыха работают на безопасность не хуже технических мер", "bad": ["Таких людей следует полностью отстранять от любой деятельности", "Технические меры защиты не нужны", "Личностные черты на безопасность не влияют"], "why": "Связь с импульсивностью, внешним локусом контроля и склонностью к риску даёт основание для психологических мер профилактики."}]}, {"n": 11, "title": "Опасные ЧС в природе: классификация, характеристика, закономерности", "kostyak": ["Начну с определения: чрезвычайная ситуация природного характера — это обстановка на определённой территории, сложившаяся в результате опасного природного явления, которое повлекло или может повлечь человеческие жертвы, ущерб здоровью, материальные потери и нарушение условий жизнедеятельности людей.", "Классифицируют такие ЧС прежде всего по генезису, то есть по происхождению самого явления. Первая группа — геофизические: землетрясения и извержения вулканов.", "Вторая группа — геологические, их ещё называют экзогенными: оползни, сели, обвалы, снежные лавины, карстовые провалы, эрозия почв.", "Третья — метеорологические и агрометеорологические: ураганы, бури, смерчи, крупный град, сильные ливни и снегопады, засуха, заморозки, сильные морозы.", "Четвёртая — гидрологические и морские гидрологические: наводнения, половодья и паводки, заторы и зажоры льда, цунами, тайфуны, ранний ледостав.", "Пятая — природные пожары: лесные, торфяные, степные, подземные пожары горючих ископаемых. И шестая группа — биолого-социальные: эпидемии и пандемии среди людей, эпизоотии у животных, эпифитотии у растений. Отдельно выделяют космические факторы — падение крупных метеоритов, магнитные бури.", "Отдельно назову закономерности проявления, это ключевая часть вопроса. Первая — пространственная приуроченность: каждому опасному явлению соответствуют определённые территории, землетрясения происходят в сейсмических поясах, а не где угодно.", "Вторая закономерность — обратная связь интенсивности и повторяемости: чем сильнее явление, тем реже оно случается. Третья — каждому явлению предшествуют предвестники, специфические признаки. Четвёртая — при всей внезапности природная ЧС поддаётся прогнозу, вероятностному или детерминированному. И пятая — практически всегда можно предусмотреть меры защиты, причём как активные, инженерные, так и пассивные, то есть уклонение от опасности.", "Практический вывод из этих закономерностей простой: прогноз и заблаговременная подготовка снижают ущерб сильнее, чем любые действия в момент самой ЧС."], "terms": ["генезис ЧС", "геофизические", "геологические (экзогенные)", "метеорологические", "гидрологические", "биолого-социальные", "эпизоотия", "эпифитотия", "пространственная приуроченность", "предвестники", "вероятностный прогноз", "активные и пассивные меры защиты"], "follow": [{"q": "Приведите пример эпизоотии и объясните, почему это ЧС.", "a": "Африканская чума свиней или ящур. Это ЧС, потому что массовое заболевание животных ведёт к уничтожению поголовья, карантину на территории, экономическому ущербу и риску перехода инфекции на человека при зоонозах."}, {"q": "Чем опасное природное явление отличается от чрезвычайной ситуации?", "a": "Явление — это сам физический процесс, землетрясение или паводок. Чрезвычайной ситуацией оно становится тогда, когда затрагивает людей: появляются пострадавшие, ущерб, нарушение условий жизнедеятельности. Землетрясение в безлюдной пустыне остаётся явлением."}], "notes": [{"label": "Разворот на школу", "text": "для образовательной организации это означает, что перечень отрабатываемых сценариев определяется географией. Школа в Приморье готовится к тайфунам и наводнениям, школа в Сибири — к сильным морозам и лесным пожарам, и планы действий должны быть привязаны к своей территории, а не написаны по шаблону."}], "block": "ЧС, ГО, РСЧС", "bk": "chs", "tier": 2, "psy": false, "aid": false, "core": "ЧС природного характера — обстановка на территории после опасного природного явления, повлёкшего жертвы, ущерб или нарушение условий жизни. Классифицируют такие ЧС по генезису, то есть по происхождению явления, а у самих опасных явлений есть устойчивые закономерности: своя территория, предвестники, обратная связь силы и частоты, — поэтому они прогнозируемы.", "anchors": ["генезис", "шесть групп", "пространственная приуроченность", "предвестники", "прогноз"], "simple": ["ЧС природного характера — это обстановка на территории, сложившаяся после опасного природного явления, которое повлекло или может повлечь человеческие жертвы, ущерб здоровью, материальные потери и нарушение условий жизнедеятельности людей.", "По генезису выделяют шесть групп: геофизические (землетрясения, извержения вулканов); геологические, они же экзогенные (оползни, сели, обвалы, снежные лавины, карстовые провалы, эрозия почв); метеорологические (ураганы, бури, смерчи, град, ливни, засуха, заморозки, морозы); гидрологические и морские (наводнения, половодья и паводки, заторы и зажоры льда, цунами, тайфуны); природные пожары (лесные, торфяные, степные, подземные); биолого-социальные (эпидемии у людей, эпизоотии у животных, эпифитотии у растений).", "Геофизические и геологические различаются так: геофизические идут изнутри Земли (землетрясение, вулкан), геологические движутся по поверхности (оползень, сель, лавина).", "Закономерностей пять: пространственная приуроченность — у каждого явления своя территория, землетрясения в сейсмических поясах; обратная связь силы и повторяемости — чем сильнее явление, тем реже; наличие предвестников; поддаётся прогнозу, вероятностному или детерминированному; практически всегда возможны меры защиты — активные, инженерные, и пассивные, то есть уклонение от опасности.", "Явление становится чрезвычайной ситуацией только тогда, когда затрагивает людей: землетрясение в безлюдной пустыне остаётся явлением.", "Практический вывод из закономерностей: прогноз и заблаговременная подготовка снижают ущерб сильнее, чем любые действия в момент самой ЧС."], "cards": [{"t": "Классификация природных ЧС по генезису", "d": "геофизические, геологические, метеорологические, гидрологические, природные пожары, биолого-социальные"}, {"t": "ЧС природного характера", "d": "обстановка на территории после опасного природного явления, повлёкшего жертвы, ущерб здоровью, материальные потери и нарушение условий жизнедеятельности"}, {"t": "Закономерности природных ЧС", "d": "пространственная приуроченность, обратная связь силы и повторяемости, наличие предвестников, поддаются прогнозу, всегда возможны меры защиты"}, {"t": "Эпизоотия", "d": "массовое заболевание животных на территории"}, {"t": "Эпифитотия", "d": "массовое заболевание растений на территории"}, {"t": "Активные и пассивные меры защиты", "d": "активные — инженерные сооружения и воздействие на явление, пассивные — уклонение от опасности"}], "quiz": [{"q": "К какой группе природных ЧС относят оползни, сели и снежные лавины?", "ok": "геологические (экзогенные)", "bad": ["геофизические", "гидрологические", "метеорологические"], "why": "Геофизические — это то, что идёт из недр: землетрясения и вулканы. Оползни и лавины движутся по поверхности, это геологические."}, {"q": "Как связаны сила природного явления и частота его повторения?", "ok": "чем сильнее явление, тем реже оно происходит", "bad": ["чем сильнее явление, тем чаще оно происходит", "сила и частота не связаны между собой", "связь есть только у гидрологических явлений"], "why": "Обратная связь интенсивности и повторяемости — одна из пяти закономерностей."}, {"q": "Что превращает опасное природное явление в чрезвычайную ситуацию?", "ok": "воздействие на людей: жертвы, ущерб, нарушение условий жизнедеятельности", "bad": ["сила явления выше средней по региону", "продолжительность явления более суток", "отсутствие предвестников перед явлением"], "why": "Явление — физический процесс. ЧС — обстановка, которая сложилась вокруг людей."}]}, {"n": 13, "title": "Классификация техногенных ЧС. ЧС на системах жизнеобеспечения", "kostyak": ["Техногенная чрезвычайная ситуация — это обстановка, вызванная аварией или катастрофой на объекте, созданном человеком. Ключевое отличие от природной ЧС в том, что источник находится внутри техносферы и почти всегда связан с человеческим фактором или износом оборудования.", "Классификация по типу источника выглядит так. Первое — транспортные аварии и катастрофы: железнодорожные, авиационные, на автодорогах, на водном транспорте, на магистральных трубопроводах, в метрополитене.", "Второе — пожары и взрывы на промышленных объектах, в зданиях с массовым пребыванием людей, на транспортных коммуникациях.", "Третье — аварии с выбросом аварийно химически опасных веществ, АХОВ. Четвёртое — аварии с выбросом радиоактивных веществ. Пятое — с выбросом биологически опасных веществ.", "Шестое — внезапное обрушение зданий и сооружений. Седьмое — гидродинамические аварии, то есть прорыв плотин с образованием волны прорыва и зоны катастрофического затопления.", "И восьмое, отдельная группа, — аварии на системах жизнеобеспечения. Это аварии на электроэнергетических системах, на коммунальных системах: водоснабжении, канализации, теплосетях, газоснабжении, а также на очистных сооружениях.", "Про системы жизнеобеспечения скажу подробнее, потому что это самый частый в реальной практике тип ЧС. Их особенность в том, что поражающий фактор здесь чаще не мгновенный, а отложенный: сама авария людей не убивает, но отключение тепла зимой в многоквартирном доме или прекращение подачи воды в больнице за несколько суток создаёт угрозу жизни и здоровью большого числа людей.", "Вторая особенность — каскадность. Отключение электроснабжения останавливает насосные станции, следом падает водоснабжение и отопление, и одна авария разворачивается в комплексную ЧС. Поэтому на объектах с массовым пребыванием людей предусматривают резервные источники питания и планируют устойчивость функционирования.", "По масштабу техногенные ЧС классифицируются так же, как и любые другие: локальная, муниципальная, межмуниципальная, региональная, межрегиональная и федеральная. Критерии — количество пострадавших, размер материального ущерба и границы зоны ЧС."], "terms": ["техносфера", "аварийно химически опасные вещества (АХОВ)", "зона химического заражения", "гидродинамическая авария", "волна прорыва", "системы жизнеобеспечения", "каскадный эффект", "устойчивость функционирования объекта", "локальная", "муниципальная", "межмуниципальная", "региональная", "межрегиональная", "федеральная ЧС"], "follow": [{"q": "Назовите примеры АХОВ и первичные действия при выбросе.", "a": "Хлор, аммиак, сернистый ангидрид, синильная кислота. Действия: защитить органы дыхания, выходить из зоны заражения перпендикулярно направлению ветра. При хлоре, который тяжелее воздуха, подниматься на верхние этажи, при аммиаке, который легче воздуха, наоборот, спускаться вниз."}, {"q": "Чем авария отличается от катастрофы?", "a": "Авария — это повреждение или разрушение технического объекта без гибели людей либо с единичными пострадавшими. Катастрофа — крупная авария с человеческими жертвами и значительным ущербом. Разница проводится по тяжести последствий, а не по причине."}], "notes": [{"label": "Разворот на школу", "text": "для школы техногенный риск номер один — это не авария на химкомбинате, а именно жизнеобеспечение: отключение отопления, прорыв теплотрассы, потеря электроснабжения. Отсюда паспорт безопасности объекта, план действий по предупреждению и ликвидации ЧС и заранее продуманный порядок роспуска или перевода детей на дистанционное обучение."}], "block": "ЧС, ГО, РСЧС", "bk": "chs", "tier": 2, "psy": false, "aid": false, "core": "Техногенная ЧС — обстановка, вызванная аварией или катастрофой на объекте, созданном человеком; источник находится внутри техносферы. Классифицируют такие ЧС по типу источника, а особая группа — аварии на системах жизнеобеспечения, где поражающий фактор отложенный и каскадный.", "anchors": ["техносфера", "восемь типов источников", "системы жизнеобеспечения", "отложенный вред", "каскадность"], "simple": ["Техногенная ЧС вызвана аварией или катастрофой на созданном человеком объекте; в отличие от природной, источник почти всегда связан с человеческим фактором или износом оборудования.", "По типу источника выделяют восемь групп: транспортные аварии; пожары и взрывы; выброс аварийно химически опасных веществ (АХОВ); выброс радиоактивных веществ; выброс биологически опасных веществ; внезапное обрушение зданий и сооружений; гидродинамические аварии, то есть прорыв плотины с волной прорыва и зоной катастрофического затопления; аварии на системах жизнеобеспечения.", "Аварии на системах жизнеобеспечения — на электроэнергетических и коммунальных системах: водоснабжении, канализации, теплосетях, газоснабжении, очистных сооружениях. Это самый частый на практике тип ЧС.", "Их особенность — отложенный поражающий фактор: сама авария людей не убивает, но отключение тепла зимой или прекращение подачи воды в больнице за несколько суток создаёт угрозу жизни большого числа людей.", "Вторая особенность — каскадность: отключение электроснабжения останавливает насосные станции, следом падают водоснабжение и отопление, и одна авария разворачивается в комплексную ЧС.", "По масштабу техногенные ЧС классифицируются так же, как любые другие: локальная, муниципальная, межмуниципальная, региональная, межрегиональная, федеральная. Критерии — число пострадавших, размер материального ущерба, границы зоны ЧС."], "cards": [{"t": "Техногенная ЧС", "d": "обстановка, вызванная аварией или катастрофой на объекте, созданном человеком"}, {"t": "Типы техногенных ЧС по источнику", "d": "транспортные аварии, пожары и взрывы, выброс АХОВ, выброс радиоактивных веществ, выброс биологически опасных веществ, обрушение зданий, гидродинамические аварии, аварии на системах жизнеобеспечения"}, {"t": "Аварии на системах жизнеобеспечения", "d": "аварии на электроэнергетических и коммунальных системах — водоснабжении, канализации, теплосетях, газоснабжении, очистных сооружениях"}, {"t": "Классификация ЧС по масштабу", "d": "локальная, муниципальная, межмуниципальная, региональная, межрегиональная, федеральная"}, {"t": "Критерии масштаба ЧС", "d": "количество пострадавших, размер материального ущерба, границы зоны ЧС"}, {"t": "Гидродинамическая авария", "d": "прорыв плотины с образованием волны прорыва и зоны катастрофического затопления"}], "quiz": [{"q": "Укажите верную последовательность ЧС по масштабу от меньшего к большему.", "ok": "локальная, муниципальная, межмуниципальная, региональная, межрегиональная, федеральная", "bad": ["локальная, объектовая, муниципальная, региональная, межрегиональная, федеральная", "локальная, муниципальная, региональная, межмуниципальная, межрегиональная, федеральная", "объектовая, муниципальная, межмуниципальная, региональная, межрегиональная, федеральная"], "why": "Ловушка в слове «объектовая»: это уровень РСЧС, а не масштаб ЧС. И «меж-» всегда идёт сразу после своей единицы: муниципальная → межмуниципальная, региональная → межрегиональная."}, {"q": "По каким критериям определяется масштаб ЧС?", "ok": "количество пострадавших, размер материального ущерба, границы зоны ЧС", "bad": ["количество пострадавших, тип источника, продолжительность ЧС", "размер материального ущерба, ведомственная принадлежность объекта, время суток", "границы зоны ЧС, численность привлечённых сил, наличие погибших"], "why": "Критериев ровно три, и тип источника в них не входит."}, {"q": "В чём особенность ЧС на системах жизнеобеспечения?", "ok": "поражающий фактор отложенный, а аварии дают каскадный эффект", "bad": ["поражающий фактор мгновенный, зона поражения ограничена зданием", "такие ЧС не классифицируются по масштабу", "они относятся к природным ЧС из-за сезонности"], "why": "Сама авария людей не убивает, угроза нарастает за часы и сутки и тянет за собой соседние системы."}, {"q": "Как действовать при выбросе хлора?", "ok": "защитить органы дыхания и подниматься на верхние этажи", "bad": ["защитить органы дыхания и спускаться в подвал", "двигаться из зоны заражения по направлению ветра", "оставаться на месте до прибытия спасателей"], "why": "Хлор тяжелее воздуха и стелется низом, поэтому уходят вверх. Из зоны выходят перпендикулярно ветру."}]}, {"n": 14, "title": "Опасные и чрезвычайные ситуации социального характера", "kostyak": ["Начну с разграничения понятий: опасная ситуация — это условия, при которых возникает угроза жизни, здоровью или имуществу; чрезвычайная ситуация — обстановка на определённой территории, сложившаяся в результате события и повлёкшая жертвы, ущерб или нарушение условий жизнедеятельности.", "Ситуации социального характера отличаются от природных и техногенных источником: источником здесь выступает сам человек, социальные группы и общественные отношения.", "По природе воздействия их принято делить на четыре группы: психическое воздействие (шантаж, мошенничество, психологическое давление), физическое (разбой, террористический акт, захват заложников), экономическое (безработица, инфляция, коррупция) и ситуации, связанные с массовым поведением людей.", "По масштабу — от локальных и объектовых до региональных и федеральных; отдельно выделяют конфликты международного уровня.", "По длительности — кратковременные, вроде теракта или массовых беспорядков, и затяжные, вроде миграционных кризисов или наркотизации населения.", "Причины лежат в социальной сфере: расслоение общества, безработица, разрушение социальных институтов, межнациональная и религиозная напряжённость, снижение уровня правовой культуры.", "Защита строится по трём линиям: правовая, куда входит законодательство и деятельность правоохранительных органов; организационная — режимные меры, охрана объектов, единая система предупреждения и ликвидации ЧС; и индивидуальная — знание правил поведения, умение оценивать риск, отказ от виктимного поведения.", "В образовательной организации эта тема закрыта курсом «Основы безопасности и защиты Родины» и работой по формированию культуры безопасности."], "terms": ["чрезвычайная ситуация социального характера", "источник опасности", "классификация по природе воздействия", "масштаб ЧС", "РСЧС (единая государственная система предупреждения и ликвидации ЧС)", "виктимность", "культура безопасности жизнедеятельности", "социальная напряжённость", "превенция"], "follow": [{"q": "Чем социальные ЧС опаснее природных?", "a": "Тем, что источник разумен и адаптируется: он выбирает время, место и уязвимую цель, а значит защита не может быть только технической, нужна работа с человеком."}, {"q": "Что относят к социальным опасностям в школе?", "a": "Буллинг, вовлечение в деструктивные сообщества, распространение ПАВ, конфликты на межнациональной почве, угрозу вооружённого нападения."}], "notes": [{"label": "Заходит от психологии", "text": "виктимное поведение как фактор риска — часть социальных ЧС реализуется потому, что жертва сама подаёт сигналы уязвимости. Об этом можно сказать отдельно, это сильная деталь."}], "block": "Социальные угрозы", "bk": "soc", "tier": 2, "psy": false, "aid": false, "core": "Опасная и чрезвычайная ситуации различаются тем, сработала ли угроза; социальные ЧС отличаются от природных и техногенных источником — им выступает сам человек и общественные отношения, поэтому защита не может быть только технической.", "anchors": ["источник — человек", "четыре группы воздействия", "масштаб и длительность", "три линии защиты", "виктимность"], "simple": ["Опасная ситуация — условия, при которых возникает угроза жизни, здоровью или имуществу. Чрезвычайная ситуация — обстановка, сложившаяся из-за события и повлёкшая жертвы, ущерб или нарушение условий жизнедеятельности.", "Источник социальных ЧС — человек, социальные группы и общественные отношения; этим они отличаются от природных, где источник стихия, и техногенных, где источник техника и производство.", "По природе воздействия делят на четыре группы: психическое (шантаж, мошенничество, психологическое давление), физическое (разбой, теракт, захват заложников), экономическое (безработица, инфляция, коррупция) и связанное с массовым поведением людей.", "По масштабу — от локальных и объектовых до региональных и федеральных, отдельно конфликты международного уровня; по длительности — кратковременные (теракт, массовые беспорядки) и затяжные (миграционные кризисы, наркотизация населения).", "Причины лежат в социальной сфере: расслоение общества, безработица, разрушение социальных институтов, межнациональная и религиозная напряжённость, снижение уровня правовой культуры.", "Защита строится по трём линиям: правовая (законодательство, правоохранительные органы), организационная (режимные меры, охрана объектов, РСЧС) и индивидуальная (знание правил поведения, оценка риска, отказ от виктимного поведения). Часть таких ситуаций реализуется потому, что жертва сама подаёт сигналы уязвимости."], "cards": [{"t": "Чрезвычайная ситуация социального характера", "d": "Обстановка, возникшая из-за действий людей или общественных процессов и повлёкшая жертвы, ущерб или нарушение условий жизнедеятельности."}, {"t": "Источник опасности", "d": "То, что порождает угрозу; в социальных ЧС это человек, социальная группа или сложившиеся общественные отношения."}, {"t": "Виктимность", "d": "Повышенная предрасположенность человека стать жертвой: сочетание поведения, эмоционального состояния и установок, которое считывается агрессором как сигнал уязвимости."}, {"t": "РСЧС", "d": "Единая государственная система предупреждения и ликвидации чрезвычайных ситуаций, объединяющая органы управления, силы и средства на всех уровнях."}, {"t": "Культура безопасности жизнедеятельности", "d": "Устойчивые знания, установки и привычки человека, благодаря которым он заранее видит риск и действует безопасно без внешнего контроля."}], "quiz": [{"q": "Чем ЧС социального характера отличается от природной и техногенной?", "ok": "Источником опасности выступает человек и общественные отношения", "bad": ["Большим числом пострадавших", "Невозможностью заранее спрогнозировать развитие", "Обязательным международным масштабом последствий"], "why": "Классификация ЧС строится по источнику. У природных источник — стихия, у техногенных — техника и производство, у социальных — сам человек."}, {"q": "К какой группе социальных опасностей по природе воздействия относят мошенничество и шантаж?", "ok": "К психическому воздействию", "bad": ["К физическому воздействию", "К экономическому воздействию", "К ситуациям массового поведения"], "why": "Здесь нет физического контакта: давление идёт на психику, человек сам совершает нужное преступнику действие."}, {"q": "Почему индивидуальная линия защиты в социальных ЧС так важна?", "ok": "Источник опасности разумен и выбирает наиболее уязвимую цель", "bad": ["Правовая и организационная защита в России не развиты", "Технические средства защиты слишком дороги", "Социальные ЧС всегда носят локальный характер"], "why": "Против адаптирующегося источника турникет и камера работают частично. Дальше решает поведение самого человека и отсутствие виктимных сигналов."}]}, {"n": 12, "title": "Коллективная и индивидуальная защита при природных ЧС", "kostyak": ["Защита населения при природных ЧС строится по двум линиям — коллективная и индивидуальная, и обе опираются на заблаговременную подготовку.", "К коллективной защите относят инженерные сооружения и организационные меры. Инженерные — это защитные сооружения гражданской обороны: убежища, противорадиационные укрытия, укрытия простейшего типа, а также приспособленные заглублённые помещения, подвалы, подземные переходы.", "Но для природных ЧС специфика другая: здесь на первом месте инженерная защита территории. Дамбы и обвалование при наводнениях, берегоукрепление, селезащитные плотины и селепропускные каналы, противолавинные галереи и профилактический спуск лавин, сейсмостойкое строительство, минерализованные полосы и просеки против лесных пожаров.", "Вторая организационная мера коллективной защиты — эвакуация и рассредоточение населения из зоны опасности, а также временное размещение в пунктах временного размещения, ПВР.", "Третья — оповещение. Здесь работает комплексная система экстренного оповещения населения, сигнал «Внимание всем!» сиренами с последующим речевым сообщением, плюс СМС-рассылка и информирование через ОКСИОН.", "Индивидуальная защита при природных ЧС включает средства защиты органов дыхания — при задымлении от лесных и торфяных пожаров это фильтрующие противогазы, респираторы, самоспасатели, в простейшем варианте ватно-марлевая повязка.", "Сюда же относят средства защиты кожи и подручные средства, спасательные жилеты и подручные плавсредства при наводнении, а также медицинские средства защиты — индивидуальную аптечку и перевязочный пакет.", "Замечу важное: в природных ЧС ведущая роль принадлежит не столько технике, сколько знанию алгоритма поведения. Правильные действия при землетрясении, урагане или паводке спасают больше жизней, чем любые табельные средства."], "terms": ["защитные сооружения гражданской обороны", "противорадиационное укрытие", "укрытие простейшего типа", "инженерная защита территории", "обвалование", "рассредоточение", "пункт временного размещения", "сигнал «Внимание всем!»", "КСЭОН", "ОКСИОН", "СИЗ органов дыхания", "ватно-марлевая повязка"], "follow": [{"q": "Что такое сигнал «Внимание всем!» и как на него реагировать?", "a": "Это единый предупредительный сигнал, подаётся сиренами и прерывистыми гудками. По нему нужно немедленно включить телевизор, радио или проверить сообщение на телефоне и выслушать речевую информацию о том, что произошло и что делать. Сам звук сирены не говорит о характере угрозы, он только требует получить информацию."}, {"q": "Чем убежище отличается от противорадиационного укрытия?", "a": "Убежище защищает от полного комплекса поражающих факторов, включая ударную волну и отравляющие вещества, оно герметично и имеет фильтровентиляционное оборудование. Противорадиационное укрытие защищает в основном от ионизирующего излучения и радиоактивной пыли, герметичности такого уровня не имеет."}], "notes": [{"label": "Разворот на школу", "text": "в образовательной организации это прямо превращается в обучение. Инструктажи, отработка сигнала «Внимание всем!», плановые тренировки по эвакуации, курс «Основы безопасности и защиты Родины». Ребёнок, у которого алгоритм доведён до автоматизма, в реальной ситуации не теряет первые критические минуты."}], "block": "ЧС, ГО, РСЧС", "bk": "chs", "tier": 2, "psy": false, "aid": false, "core": "Защита населения при природных ЧС строится по двум линиям — коллективной и индивидуальной. В природных ЧС на первом месте оказываются инженерная защита территории и знание алгоритма поведения, а не табельные средства.", "anchors": ["коллективная и индивидуальная", "инженерная защита территории", "эвакуация", "оповещение", "алгоритм важнее техники"], "simple": ["Коллективная защита делится на инженерную и организационную. Инженерные сооружения гражданской обороны — убежища, противорадиационные укрытия, укрытия простейшего типа, а также заглублённые помещения: подвалы, подземные переходы.", "Для природных ЧС на первом месте инженерная защита территории: дамбы и обвалование при наводнениях, берегоукрепление, селезащитные плотины и каналы, противолавинные галереи, сейсмостойкое строительство, минерализованные полосы против лесных пожаров.", "Организационные меры коллективной защиты — эвакуация и рассредоточение населения из зоны опасности с размещением в пунктах временного размещения (ПВР) и оповещение: сигнал «Внимание всем!» сиренами с последующим речевым сообщением, СМС-рассылка, информирование через ОКСИОН и комплексную систему экстренного оповещения (КСЭОН).", "Сигнал «Внимание всем!» не сообщает характер угрозы — он требует включить телевизор или радио и выслушать речевую информацию о том, что произошло и что делать.", "Индивидуальная защита включает средства защиты органов дыхания (противогазы, респираторы, самоспасатели, в простейшем варианте ватно-марлевая повязка), средства защиты кожи и подручные средства, спасательные жилеты при наводнении и медицинские средства — аптечку и перевязочный пакет.", "В природных ЧС ведущая роль принадлежит не технике, а знанию алгоритма поведения: правильные действия при землетрясении, урагане или паводке спасают больше жизней, чем любые табельные средства."], "cards": [{"t": "Защитные сооружения гражданской обороны", "d": "убежище, противорадиационное укрытие, укрытие простейшего типа"}, {"t": "Инженерная защита территории", "d": "дамбы и обвалование, берегоукрепление, селезащитные плотины, противолавинные галереи, сейсмостойкое строительство, минерализованные полосы"}, {"t": "Сигнал «Внимание всем!»", "d": "единый предупредительный сигнал сиренами, по которому нужно включить теле- или радиоприёмник и выслушать речевое сообщение"}, {"t": "Убежище против противорадиационного укрытия", "d": "убежище герметично, с фильтровентиляцией, защищает от всего комплекса поражающих факторов; ПРУ защищает в основном от ионизирующего излучения и радиоактивной пыли"}, {"t": "Пункт временного размещения (ПВР)", "d": "место временного размещения населения, выведенного из зоны опасности"}], "quiz": [{"q": "Что из перечисленного относится к инженерной защите территории?", "ok": "обвалование и селезащитные плотины", "bad": ["пункты временного размещения", "ватно-марлевые повязки", "сборные эвакуационные пункты"], "why": "Инженерная защита — это сооружения на местности, которые не пускают стихию. Остальное — организационные меры и СИЗ."}, {"q": "Что нужно сделать по сигналу «Внимание всем!»?", "ok": "включить теле- или радиоприёмник и выслушать речевое сообщение", "bad": ["немедленно покинуть здание по ближайшему выходу", "надеть средства индивидуальной защиты и укрыться в подвале", "позвонить в единую дежурно-диспетчерскую службу за инструкцией"], "why": "Сам сигнал не говорит о характере угрозы, он требует получить речевую информацию."}, {"q": "Какое средство защиты органов дыхания относится к простейшим?", "ok": "ватно-марлевая повязка", "bad": ["изолирующий противогаз", "самоспасатель", "респиратор Р-2"], "why": "Простейшие средства — ватно-марлевая повязка и противопыльная тканевая маска."}]}, {"n": 20, "title": "Эвакуация населения: организация, проведение, обязанности населения", "kostyak": ["Эвакуация населения — это организованный вывоз и вывод населения, материальных и культурных ценностей из зоны чрезвычайной ситуации или из зоны вероятной опасности в безопасный район с последующим размещением и первоочередным жизнеобеспечением.", "Отдельно назову смежный термин: рассредоточение — это вывоз в загородную зону тех работников, которые продолжают работать на объектах в зоне опасности и посменно возвращаются туда. Различие спрашивают часто.", "Классифицирую эвакуацию по нескольким основаниям. По охвату населения — общая, когда вывозятся все категории, и частичная, когда вывозится нетрудоспособное население, дети с образовательными организациями, пенсионеры.", "По срокам проведения — упреждающая, то есть заблаговременная, по прогнозу угрозы, и экстренная, безотлагательная, когда ЧС уже возникла.", "По масштабу — локальная, местная и региональная, в зависимости от того, вывозится ли население в пределах города, за пределы населённого пункта или в другой субъект.", "Организацией эвакуации занимаются эвакуационные органы: эвакуационные комиссии, сборные эвакуационные пункты, промежуточные пункты эвакуации, пункты посадки и высадки, приёмные эвакуационные пункты и эвакоприёмные комиссии в безопасных районах.", "Логика движения такая. Население получает сигнал и информацию через систему оповещения, прибывает на сборный эвакуационный пункт, где проходит регистрацию и распределяется по транспорту или пешим колоннам. Далее — движение по маршруту, при необходимости через промежуточный пункт эвакуации, затем прибытие на приёмный эвакуационный пункт и размещение в безопасном районе.", "Способы эвакуации — транспортный, пеший и комбинированный. Комбинированный считается основным, потому что позволяет вывезти нетранспортабельные и уязвимые категории транспортом, а остальных вывести пешими колоннами.", "Обязанности населения при эвакуации перечислю коротко: получив сигнал, выключить электроприборы, газ и воду, взять документы, деньги, лекарства, запас продуктов и воды на несколько суток, тёплые вещи и средства индивидуальной защиты. Личные вещи — в количестве, которое человек может нести сам, с биркой с фамилией и адресом.", "Далее — прибыть на сборный эвакуационный пункт в назначенное время, зарегистрироваться, не покидать колонну самовольно, выполнять указания старшего. Детям дошкольного возраста в карман вкладывается записка с фамилией, именем и адресом. Соседей и маломобильных людей по возможности оповестить."], "terms": ["эвакуация", "рассредоточение", "загородная зона", "безопасный район", "общая и частичная эвакуация", "упреждающая и экстренная эвакуация", "эвакуационная комиссия", "сборный эвакуационный пункт (СЭП)", "промежуточный пункт эвакуации", "приёмный эвакуационный пункт (ПЭП)", "комбинированный способ эвакуации", "первоочередное жизнеобеспечение"], "follow": [{"q": "Чем эвакуация отличается от рассредоточения?", "a": "Эвакуируемое население вывозится и остаётся в безопасном районе до особого распоряжения. Рассредоточиваемые работники размещаются в загородной зоне, но продолжают ездить на работу в зону опасности посменно. Разница в том, продолжает человек трудовую деятельность на объекте или нет."}, {"q": "Почему комбинированный способ считается основным?", "a": "Потому что транспорта на всё население одновременно не хватает, а время ограничено. Комбинированный способ позволяет использовать транспорт для тех, кто не может идти пешком, и одновременно выводить основную массу населения пешими колоннами, что резко сокращает общее время эвакуации."}], "notes": [{"label": "Разворот на школу", "text": "школа эвакуируется организованно, вместе с педагогами, списками детей и медицинской документацией. Учитель здесь становится старшим колонны и отвечает за поимённый учёт. Отдельная задача — передача детей родителям в безопасном районе строго по спискам, потому что при неразберихе именно на этом этапе теряются дети. И отдельно стоит различать эту эвакуацию и обычную пожарную эвакуацию из здания: у них разные сигналы, разные маршруты и разная продолжительность."}], "block": "ЧС, ГО, РСЧС", "bk": "chs", "tier": 2, "psy": false, "aid": false, "core": "Эвакуация — организованный вывоз и вывод населения и ценностей в безопасный район с размещением и первоочередным жизнеобеспечением. Классифицируется по трём основаниям, идёт через цепочку эвакуационных пунктов, а основным способом считается комбинированный.", "anchors": ["три основания классификации", "СЭП → маршрут → ПЭП", "комбинированный способ", "рассредоточение", "обязанности населения"], "simple": ["Эвакуация — организованный вывоз и вывод населения, материальных и культурных ценностей из зоны ЧС или вероятной опасности в безопасный район с размещением и первоочередным жизнеобеспечением. Смежный термин — рассредоточение: вывоз в загородную зону работников, которые продолжают посменно работать на объектах в зоне опасности.", "Классифицируют эвакуацию по трём основаниям: по охвату — общая (все категории) и частичная (нетрудоспособное население, дети с образовательными организациями, пенсионеры); по срокам — упреждающая, по прогнозу угрозы, и экстренная, при возникшей ЧС; по масштабу — локальная, местная и региональная.", "Организуют эвакуацию эвакуационные органы: эвакуационные комиссии, сборные эвакуационные пункты, промежуточные пункты эвакуации, пункты посадки и высадки, приёмные эвакуационные пункты, эвакоприёмные комиссии.", "Логика движения: население получает сигнал и прибывает на сборный эвакуационный пункт (СЭП), проходит регистрацию и распределяется по транспорту или колоннам → движение по маршруту, при необходимости через промежуточный пункт → приёмный эвакуационный пункт (ПЭП) → размещение в безопасном районе.", "Способы эвакуации — транспортный, пеший и комбинированный. Основным считается комбинированный: транспорта на всех одновременно не хватает, а время ограничено, поэтому уязвимых везут транспортом, а основную массу выводят пешими колоннами.", "Обязанности населения: получив сигнал, выключить электроприборы, газ и воду, взять документы, деньги, лекарства, запас еды и воды на несколько суток, тёплые вещи и СИЗ; прибыть на СЭП, зарегистрироваться, не покидать колонну самовольно. Детям дошкольного возраста в карман вкладывают записку с фамилией и адресом."], "cards": [{"t": "Эвакуация населения", "d": "организованный вывоз и вывод населения, материальных и культурных ценностей из зоны ЧС или вероятной опасности в безопасный район с размещением и первоочередным жизнеобеспечением"}, {"t": "Рассредоточение", "d": "вывоз в загородную зону работников, которые продолжают работать на объектах в зоне опасности и посменно возвращаются туда"}, {"t": "Виды эвакуации по охвату", "d": "общая (все категории населения) и частичная (нетрудоспособное население, дети с образовательными организациями, пенсионеры)"}, {"t": "Виды эвакуации по срокам", "d": "упреждающая (заблаговременная, по прогнозу угрозы) и экстренная (безотлагательная, при возникшей ЧС)"}, {"t": "Эвакуационные органы", "d": "эвакуационные комиссии, сборные эвакуационные пункты, промежуточные пункты эвакуации, пункты посадки и высадки, приёмные эвакуационные пункты, эвакоприёмные комиссии"}, {"t": "Способы эвакуации", "d": "транспортный, пеший, комбинированный; основным считается комбинированный"}], "quiz": [{"q": "Чем эвакуация отличается от рассредоточения?", "ok": "рассредоточенные работники продолжают посменно работать на объекте в зоне опасности, эвакуированные остаются в безопасном районе", "bad": ["эвакуация проводится только в военное время, рассредоточение — только в мирное", "рассредоточение касается только материальных ценностей", "эвакуация проводится транспортом, рассредоточение — пешим порядком"], "why": "Признак различия один: продолжается трудовая деятельность на объекте или нет."}, {"q": "Какой способ эвакуации считается основным и почему?", "ok": "комбинированный, потому что транспорта на всех не хватает, а время ограничено", "bad": ["транспортный, потому что он самый быстрый", "пеший, потому что не зависит от состояния дорог", "транспортный, потому что позволяет вывезти материальные ценности"], "why": "Комбинированный сочетает вывоз уязвимых категорий транспортом и вывод основной массы пешими колоннами."}, {"q": "Куда прибывает эвакуируемое население после получения сигнала?", "ok": "на сборный эвакуационный пункт для регистрации и распределения", "bad": ["на приёмный эвакуационный пункт", "в пункт временного размещения", "на промежуточный пункт эвакуации"], "why": "Приёмный пункт и промежуточный — это уже в пути и в конце маршрута, начинается всё со сборного."}, {"q": "Какая эвакуация называется частичной?", "ok": "вывозится нетрудоспособное население, дети с образовательными организациями, пенсионеры", "bad": ["вывозится только часть территории населённого пункта", "вывоз осуществляется частично транспортом, частично пешим порядком", "вывозятся только материальные и культурные ценности"], "why": "Частичная — по охвату категорий населения, а не по способу или территории."}]}, {"n": 21, "title": "Средства индивидуальной защиты в ЧС. Средства коллективной защиты", "kostyak": ["Средства индивидуальной защиты делятся на три группы: средства защиты органов дыхания, средства защиты кожи и медицинские средства защиты. Начну с органов дыхания, потому что через дыхательные пути поступает большинство поражающих веществ.", "Средства защиты органов дыхания бывают фильтрующие и изолирующие. Принцип фильтрующих — очистка вдыхаемого воздуха от вредных примесей при прохождении через фильтрующе-поглощающую коробку. Обязательное условие их применения — достаточное содержание кислорода в воздухе и известный состав примеси.", "К фильтрующим относятся гражданские противогазы типа ГП-7 и ГП-5, детские противогазы ПДФ, камера защитная детская для детей до полутора лет, промышленные противогазы, респираторы типа Р-2 и «Лепесток», а также простейшие средства — ватно-марлевая повязка и противопыльная тканевая маска.", "Изолирующие средства полностью отсекают человека от внешней среды и подают кислород из собственного источника — из регенеративного патрона или баллона. Применяются там, где фильтрующие бессильны: при недостатке кислорода, при очень высоких концентрациях, при неизвестном составе. Это изолирующие противогазы типа ИП, дыхательные аппараты пожарных, шланговые противогазы. Отдельная категория — самоспасатели для выхода из задымлённой зоны.", "Средства защиты кожи тоже делятся на фильтрующие и изолирующие. Фильтрующие — это защитная фильтрующая одежда, пропитанная специальным составом. Изолирующие — общевойсковой защитный комплект ОЗК и лёгкий защитный костюм Л-1, они изготовлены из прорезиненной ткани и не пропускают ни жидкости, ни пары. Плюс подручные средства — плащи, накидки, резиновые сапоги и перчатки.", "Медицинские средства защиты — это индивидуальная аптечка, индивидуальный противохимический пакет для обработки кожи при попадании отравляющих веществ, и индивидуальный перевязочный пакет для наложения повязки при ранениях и ожогах.", "Теперь коллективная защита. Основа — защитные сооружения гражданской обороны. Первый тип — убежища, они защищают от полного комплекса поражающих факторов: ударной волны, светового излучения, проникающей радиации, отравляющих веществ и биологических средств.", "Убежище имеет основные помещения для укрываемых и вспомогательные, тамбур-шлюз, фильтровентиляционную камеру, два выхода, один из которых аварийный, а также запасы воды и продовольствия. Вентиляция работает в трёх режимах: чистой вентиляции, фильтровентиляции и полной изоляции с регенерацией внутреннего воздуха.", "Второй тип — противорадиационные укрытия, защищающие от ионизирующего излучения и радиоактивной пыли. Третий — укрытия простейшего типа, то есть открытые и перекрытые щели. Дополнительно используются заглублённые помещения: подвалы, подземные переходы, горные выработки.", "Порядок применения общий: средства индивидуальной защиты выдаются заблаговременно, хранятся на объекте, а укрытие производится по сигналу «Внимание всем!» после получения речевой информации. Обязательное условие эффективности — подгонка противогаза по размеру и предварительная тренировка, иначе в реальной ситуации человек им не воспользуется."], "terms": ["СИЗ органов дыхания", "кожи", "медицинские средства защиты", "фильтрующие и изолирующие", "фильтрующе-поглощающая коробка", "противогаз ГП-7", "детский противогаз ПДФ", "камера защитная детская", "респиратор Р-2", "изолирующий противогаз", "самоспасатель", "защитная фильтрующая одежда", "ОЗК", "Л-1", "индивидуальный противохимический пакет", "перевязочный пакет", "убежище", "тамбур-шлюз", "режимы вентиляции: чистая вентиляция", "фильтровентиляция", "полная изоляция"], "follow": [{"q": "Когда фильтрующий противогаз применять нельзя?", "a": "При недостатке кислорода в воздухе, при очень высоких концентрациях опасного вещества, при неизвестном составе примеси, а также если вещество не задерживается данной маркой фильтра. Во всех этих случаях нужен изолирующий тип."}, {"q": "Что такое режим полной изоляции в убежище?", "a": "Режим, при котором наружный воздух не забирается вообще, а внутренний очищается от углекислого газа и обогащается кислородом с помощью регенеративных установок. Применяется при сильной задымлённости или загазованности снаружи, когда фильтры не справляются."}], "notes": [{"label": "Разворот на школу", "text": "в школе это выражается в отработке норматива надевания противогаза на уроках ОБЗР, в знании персоналом закреплённого защитного сооружения и маршрута к нему, а также в понимании, что для младших детей существуют отдельные средства — детские противогазы и защитные детские камеры, взрослый противогаз ребёнку не подходит."}], "block": "ЧС, ГО, РСЧС", "bk": "chs", "tier": 2, "psy": false, "aid": false, "core": "Средства индивидуальной защиты делятся на три группы — органов дыхания, кожи и медицинские, причём первые две ещё раз делятся на фильтрующие и изолирующие. Коллективная защита — это защитные сооружения гражданской обороны трёх типов по убыванию уровня защиты.", "anchors": ["три группы СИЗ", "фильтрующие и изолирующие", "убежище → ПРУ → простейшее укрытие", "три режима вентиляции", "подгонка и тренировка"], "simple": ["СИЗ делятся на три группы: средства защиты органов дыхания, средства защиты кожи, медицинские средства защиты. Органов дыхания — первыми, потому что через дыхательные пути поступает большинство поражающих веществ.", "Средства защиты органов дыхания бывают фильтрующие (очищают вдыхаемый воздух — противогазы ГП-7 и ГП-5, детские ПДФ, камера защитная детская, респираторы Р-2 и «Лепесток», ватно-марлевая повязка) и изолирующие (подают кислород из своего источника — изолирующие противогазы ИП, дыхательные аппараты, шланговые противогазы, самоспасатели). Фильтрующие применимы только при достаточном кислороде и известном составе примеси.", "Средства защиты кожи тоже фильтрующие (защитная фильтрующая одежда) и изолирующие (общевойсковой защитный комплект ОЗК, лёгкий защитный костюм Л-1), плюс подручные — плащи, накидки, резиновые сапоги и перчатки.", "Медицинские средства защиты — индивидуальная аптечка, индивидуальный противохимический пакет для обработки кожи, индивидуальный перевязочный пакет для повязки при ранениях и ожогах.", "Коллективная защита — защитные сооружения гражданской обороны по убыванию уровня защиты: убежище (защищает от полного комплекса поражающих факторов, герметично, с фильтровентиляцией), противорадиационное укрытие (от ионизирующего излучения и радиоактивной пыли), укрытие простейшего типа (открытая или перекрытая щель). Дополнительно — заглублённые помещения: подвалы, подземные переходы.", "Вентиляция убежища работает в трёх режимах по нарастанию отсечения от улицы: чистая вентиляция, фильтровентиляция, полная изоляция с регенерацией воздуха. Условие эффективности СИЗ — подгонка по размеру и предварительная тренировка; для детей есть отдельные средства, взрослый противогаз ребёнку не подходит."], "cards": [{"t": "Три группы СИЗ", "d": "средства защиты органов дыхания, средства защиты кожи, медицинские средства защиты"}, {"t": "Средства защиты органов дыхания", "d": "фильтрующие (противогазы ГП-7, детские ПДФ, камера защитная детская, респираторы, ватно-марлевая повязка) и изолирующие (изолирующие противогазы, дыхательные аппараты, шланговые противогазы, самоспасатели)"}, {"t": "Когда фильтрующий противогаз применять нельзя", "d": "при недостатке кислорода, при очень высоких концентрациях, при неизвестном составе примеси, если вещество не задерживается данной маркой фильтра"}, {"t": "Средства защиты кожи", "d": "фильтрующие — защитная фильтрующая одежда; изолирующие — ОЗК и лёгкий защитный костюм Л-1; подручные — плащи, накидки, резиновые сапоги и перчатки"}, {"t": "Медицинские средства защиты", "d": "индивидуальная аптечка, индивидуальный противохимический пакет, индивидуальный перевязочный пакет"}, {"t": "Режимы вентиляции убежища", "d": "чистая вентиляция, фильтровентиляция, полная изоляция с регенерацией внутреннего воздуха"}], "quiz": [{"q": "На какие три группы делятся средства индивидуальной защиты?", "ok": "органов дыхания, кожи, медицинские", "bad": ["органов дыхания, кожи, коллективные", "фильтрующие, изолирующие, подручные", "органов дыхания, органов зрения, медицинские"], "why": "Фильтрующие и изолирующие — это деление внутри первых двух групп, а не самостоятельные группы."}, {"q": "Назовите режимы вентиляции убежища.", "ok": "чистая вентиляция, фильтровентиляция, полная изоляция", "bad": ["чистая вентиляция, регенерация, фильтровентиляция", "фильтровентиляция, полная изоляция, аварийная вентиляция", "повседневная вентиляция, повышенная готовность, полная изоляция"], "why": "Три режима идут по нарастанию отсечения от наружного воздуха. Последний вариант подменяет их режимами функционирования РСЧС."}, {"q": "В каком случае нужен изолирующий противогаз, а не фильтрующий?", "ok": "при недостатке кислорода или неизвестном составе примеси", "bad": ["при работе на открытой местности дольше двух часов", "при любой аварии на системах жизнеобеспечения", "при задымлении, если известна марка фильтра"], "why": "Фильтрующий очищает наружный воздух, поэтому он бессилен, когда воздуха не хватает или неясно, от чего защищаться."}, {"q": "Перечислите защитные сооружения гражданской обороны по убыванию уровня защиты.", "ok": "убежище, противорадиационное укрытие, укрытие простейшего типа", "bad": ["убежище, укрытие простейшего типа, противорадиационное укрытие", "противорадиационное укрытие, убежище, заглублённое помещение", "убежище, противорадиационное укрытие, пункт временного размещения"], "why": "ПВР — это место размещения эвакуированных, а не защитное сооружение."}]}, {"n": 27, "title": "Организация АСДНР в зонах ЧС", "kostyak": ["АСДНР расшифровывается как аварийно-спасательные и другие неотложные работы. Это комплекс работ по спасению людей, материальных и культурных ценностей, локализации ЧС и подавлению или снижению до минимально возможного уровня воздействия поражающих факторов.", "Название состоит из двух частей, и их важно различать. Аварийно-спасательные работы — это разведка маршрутов и зон, локализация и тушение пожаров, розыск и извлечение пострадавших из завалов и повреждённых зданий, оказание первой помощи, эвакуация людей из опасной зоны, санитарная обработка и обеззараживание.", "Другие неотложные работы обеспечивают спасательные: прокладка колонных путей и устройство проездов в завалах, укрепление или обрушение конструкций, угрожающих обвалом, локализация аварий на коммунально-энергетических сетях, ремонт и восстановление линий связи, оборудование пунктов водоснабжения.", "Организационно работы разворачиваются по этапам. Первый — разведка зоны ЧС и оценка обстановки, определение границ и объёма работ. Второй — выдвижение и ввод сил, распределение по участкам и объектам. Третий — собственно спасательные работы, они ведутся непрерывно, посменно, днём и ночью, до полного завершения. Четвёртый — ликвидация последствий и передача объектов.", "Руководство работами осуществляет руководитель ликвидации чрезвычайной ситуации, и его решения на месте обязательны для всех. Это принципиальное положение: единоначалие в зоне ЧС.", "Теперь про специфику на заражённой территории. При радиоактивном заражении главное — фактор дозы. Работы ведутся с ограничением времени пребывания, с обязательным дозиметрическим контролем, посменно, в средствах индивидуальной защиты, с ведением радиационной разведки и обозначением границ зон заражения. Заключительный этап — дезактивация техники, зданий, территории и полная санитарная обработка личного состава.", "При заражении отравляющими и аварийно химически опасными веществами главное — химическая разведка и определение типа вещества, потому что от этого зависит выбор средств защиты и способ обеззараживания. Личный состав работает в изолирующих средствах защиты кожи и органов дыхания, проводится дегазация местности, техники и одежды, пострадавшим оказывается первая помощь с применением антидотов, а зона заражения обозначается и оцепляется.", "Обобщу термины обеззараживания, потому что их часто путают: дезактивация — удаление радиоактивных веществ, дегазация — обезвреживание отравляющих и АХОВ, дезинфекция — уничтожение болезнетворных микроорганизмов. Санитарная обработка людей бывает частичная, прямо в зоне, и полная, на специальных пунктах.", "При стихийных бедствиях содержание работ определяется характером бедствия. При землетрясении основное — разбор завалов и извлечение пострадавших, при наводнении — спасение людей на воде и с крыш, эвакуация плавсредствами, при лесных пожарах — локализация огня, устройство заградительных полос, эвакуация населённых пунктов, при снежных заносах — расчистка дорог и жизнеобеспечение отрезанных населённых пунктов.", "Отдельная составляющая всех этих работ — психологическая помощь пострадавшим и родственникам погибших. В структуре МЧС России для этого есть штатная психологическая служба, и это тот участок, где профессия психолога прямо смыкается с системой ликвидации ЧС."], "terms": ["аварийно-спасательные и другие неотложные работы", "разведка зоны ЧС", "руководитель ликвидации чрезвычайной ситуации", "единоначалие", "колонные пути", "дозиметрический контроль", "радиационная и химическая разведка", "дезактивация", "дегазация", "дезинфекция", "частичная и полная санитарная обработка", "антидот", "аварийно-спасательные формирования", "психологическая служба МЧС России"], "follow": [{"q": "Кто руководит ликвидацией ЧС?", "a": "Руководитель ликвидации ЧС, назначаемый в зависимости от уровня и масштаба ситуации — от руководителя объектового звена до должностного лица федерального уровня. По прибытии в зону он принимает полномочия на себя, и его указания обязательны для всех находящихся там граждан и организаций."}, {"q": "Почему при радиационной аварии работы ведутся посменно?", "a": "Потому что нормируется не только концентрация, но и суммарная полученная доза. Ограничение времени пребывания в зоне — основной способ не допустить превышения допустимой дозы облучения, поэтому смены рассчитываются по данным дозиметрического контроля."}], "notes": [{"label": "Разворот на школу", "text": "от школы никто не ждёт участия в АСДНР. Её задача — не создать спасателям дополнительную работу: обеспечить быструю и полную эвакуацию, дать точный поимённый учёт детей и работников, освободить подъезды для техники и передать прибывшим подразделениям информацию о том, кто и где может оставаться внутри."}], "block": "ЧС, ГО, РСЧС", "bk": "chs", "tier": 2, "psy": false, "aid": false, "core": "АСДНР — аварийно-спасательные и другие неотложные работы: спасательные спасают людей, а другие неотложные создают им условия для работы. Ведутся они непрерывно и посменно под единоначалием руководителя ликвидации ЧС, а на заражённой территории добавляются разведка, дозиметрический контроль и обеззараживание.", "anchors": ["две части названия", "четыре этапа", "единоначалие", "доза и разведка", "дезактивация", "дегазация", "дезинфекция"], "simple": ["АСДНР — комплекс работ по спасению людей, материальных и культурных ценностей, локализации ЧС и снижению воздействия поражающих факторов. Название состоит из двух частей.", "Аварийно-спасательные работы — про людей: разведка маршрутов и зон, локализация и тушение пожаров, розыск и извлечение пострадавших из завалов, первая помощь, эвакуация из опасной зоны, санитарная обработка.", "Другие неотложные работы обеспечивают спасательные: прокладка колонных путей и проездов в завалах, укрепление или обрушение аварийных конструкций, локализация аварий на коммунально-энергетических сетях, восстановление связи, оборудование пунктов водоснабжения.", "Работы идут в четыре этапа: разведка и оценка обстановки → выдвижение и ввод сил → спасательные работы непрерывно и посменно до завершения → ликвидация последствий и передача объектов. Руководит ими руководитель ликвидации ЧС по принципу единоначалия — его решения обязательны для всех в зоне.", "На заражённой территории специфика разная. При радиоактивном заражении нормируется доза: работают посменно, с дозиметрическим контролем, в СИЗ, с последующей дезактивацией. При химическом заражении сначала ведут разведку и определяют вещество — от этого зависят защита и способ обеззараживания, — проводят дегазацию, применяют антидоты.", "Три вида обеззараживания: дезактивация — удаление радиоактивных веществ, дегазация — обезвреживание отравляющих и АХОВ, дезинфекция — уничтожение болезнетворных микроорганизмов. Санитарная обработка людей бывает частичная, в зоне, и полная, на специальных пунктах. Отдельная составляющая — психологическая помощь, для которой в МЧС России есть штатная психологическая служба."], "cards": [{"t": "АСДНР", "d": "аварийно-спасательные и другие неотложные работы — комплекс работ по спасению людей и ценностей, локализации ЧС и снижению воздействия поражающих факторов"}, {"t": "Аварийно-спасательные работы", "d": "разведка маршрутов и зон, локализация и тушение пожаров, розыск и извлечение пострадавших, первая помощь, эвакуация из опасной зоны, санитарная обработка"}, {"t": "Другие неотложные работы", "d": "прокладка колонных путей и проездов в завалах, укрепление или обрушение конструкций, локализация аварий на коммунально-энергетических сетях, восстановление линий связи, оборудование пунктов водоснабжения"}, {"t": "Этапы АСДНР", "d": "разведка и оценка обстановки, выдвижение и ввод сил, спасательные работы непрерывно и посменно, ликвидация последствий и передача объектов"}, {"t": "Три вида обеззараживания", "d": "дезактивация — радиоактивные вещества, дегазация — отравляющие и АХОВ, дезинфекция — болезнетворные микроорганизмы"}, {"t": "Руководитель ликвидации ЧС", "d": "должностное лицо, принимающее полномочия по прибытии в зону; его решения обязательны для всех находящихся там граждан и организаций"}], "quiz": [{"q": "Что относится к другим неотложным работам, а не к аварийно-спасательным?", "ok": "прокладка колонных путей и устройство проездов в завалах", "bad": ["извлечение пострадавших из завалов", "оказание первой помощи", "локализация и тушение пожаров"], "why": "Другие неотложные работы обеспечивают спасательные: создают условия, а не спасают напрямую."}, {"q": "Как называется удаление радиоактивных веществ с техники, зданий и территории?", "ok": "дезактивация", "bad": ["дегазация", "дезинфекция", "санитарная обработка"], "why": "Дегазация — химия, дезинфекция — биология, санитарная обработка — про людей."}, {"q": "Почему при радиационной аварии работы ведутся посменно?", "ok": "нормируется суммарная полученная доза, и ограничение времени пребывания не даёт её превысить", "bad": ["потому что средства индивидуальной защиты рассчитаны на один час работы", "потому что этого требует режим повышенной готовности", "потому что дозиметрический контроль возможен только между сменами"], "why": "Основной способ защиты в зоне — ограничение времени по данным дозиметрического контроля."}, {"q": "Кто руководит ликвидацией чрезвычайной ситуации в зоне ЧС?", "ok": "руководитель ликвидации ЧС, его решения обязательны для всех в зоне", "bad": ["председатель КЧС и ОПБ соответствующего уровня по телефону", "начальник прибывшего аварийно-спасательного формирования по согласованию с администрацией", "глава муниципального образования независимо от масштаба ЧС"], "why": "Принцип единоначалия: по прибытии руководитель ликвидации ЧС принимает полномочия на себя."}]}, {"n": 63, "title": "Кризисное управление в ЧС: РСЧС и гражданская оборона — структуры, задачи, функции", "kostyak": ["Кризисное управление в чрезвычайных ситуациях — это управление в условиях дефицита времени, неполноты информации и высокой цены ошибки. Отсюда три его особенности: жёсткая вертикаль и единоначалие, заранее заготовленные типовые решения в виде планов, и переход системы в особые режимы функционирования.", "В России такое управление обеспечивают две взаимосвязанные государственные системы — РСЧС и гражданская оборона. Обе замкнуты на МЧС России как федеральный орган и опираются на общую инфраструктуру.", "РСЧС — единая государственная система предупреждения и ликвидации ЧС. Работает в мирное время, при ЧС природного и техногенного характера. Пять уровней: федеральный, межрегиональный, региональный, муниципальный, объектовый. Две группы подсистем: функциональные, создаваемые федеральными органами по отраслям, и территориальные, создаваемые в субъектах.", "Управленческий каркас РСЧС состоит из трёх типов органов, и я специально разделю их по функции. Координационные органы — комиссии по предупреждению и ликвидации ЧС и обеспечению пожарной безопасности — принимают решения и согласовывают действия разных ведомств. Постоянно действующие органы управления ведут повседневную организацию работы. Органы повседневного управления — центры управления в кризисных ситуациях и единые дежурно-диспетчерские службы — обеспечивают круглосуточное реагирование и сбор информации.", "Гибкость управления в РСЧС достигается тремя режимами функционирования: повседневная деятельность, повышенная готовность, чрезвычайная ситуация. Смена режима — это управленческое решение, которое меняет полномочия должностных лиц и порядок работы всей системы на территории.", "Гражданская оборона — система защиты населения от опасностей, возникающих при военных конфликтах, а также при ЧС мирного времени. Общее руководство осуществляет Правительство Российской Федерации, в организациях — руководители по должности. Здесь вертикаль ещё жёстче, а перевод системы в готовность идёт по установленным степеням готовности гражданской обороны.", "Теперь сопоставление, это ядро вопроса. Различия в трёх пунктах. Первое — условия применения: РСЧС работает в мирное время, ГО ориентирована прежде всего на военное время. Второе — правовая основа: у РСЧС федеральный закон о защите населения и территорий от ЧС, у ГО — федеральный закон о гражданской обороне. Третье — характер управления: РСЧС ближе к межведомственной координации, ГО — к мобилизационной вертикали.", "Сходства при этом важнее различий. У систем общий федеральный орган — МЧС России, общие силы и средства, общий фонд защитных сооружений, единая система оповещения населения, во многом общие органы управления на местах и один и тот же обученный персонал. Практически это одна инфраструктура, работающая в двух правовых режимах.", "Отсюда логика перехода: при переводе страны на военное положение РСЧС не упраздняется, а её структура и силы используются в интересах гражданской обороны. Такое построение экономит ресурсы и избавляет от необходимости создавать вторую систему с нуля.", "И завершу выводом: эффективность кризисного управления определяется тем, что сделано до кризиса — планированием, обучением, созданием резервов и отработкой взаимодействия. В момент ЧС система только исполняет то, что было подготовлено заранее."], "terms": ["кризисное управление", "единоначалие", "режимы функционирования РСЧС", "уровни реагирования", "координационные органы", "КЧС и ОПБ", "центр управления в кризисных ситуациях", "ЕДДС", "функциональные и территориальные подсистемы", "степени готовности гражданской обороны", "единая инфраструктура двух систем", "заблаговременная подготовка"], "follow": [{"q": "Почему РСЧС и ГО не объединили в одну систему?", "a": "Потому что различаются правовые режимы и характер угроз. Гражданская оборона связана с военным положением, мобилизационной подготовкой и особыми полномочиями органов власти, а РСЧС действует в обычном правовом поле мирного времени. Разделение сохраняется юридически, при этом организационно системы опираются на общие органы управления, силы и средства."}, {"q": "Что в кризисном управлении важнее — техника или подготовка людей?", "a": "Подготовка. Техника определяет потолок возможностей, но реализует его человек. Основные потери в чрезвычайных ситуациях связаны с неправильными действиями в первые минуты — паникой, потерей времени, неверными решениями. Поэтому обучение населения — в законах о ГО и о защите населения оно стоит в числе основных задач обеих систем."}], "notes": [{"label": "Разворот на школу", "text": "на уровне образовательной организации обе системы сходятся в одном человеке. Директор одновременно руководитель гражданской обороны объекта и председатель объектовой комиссии по предупреждению и ликвидации ЧС. Документы тоже парные: по линии ГО — план гражданской обороны и план основных мероприятий, по линии РСЧС — план действий по предупреждению и ликвидации ЧС. Это наглядно показывает, что для конечного объекта две системы образуют единый контур управления."}], "block": "ЧС, ГО, РСЧС", "bk": "chs", "tier": 2, "psy": false, "aid": false, "core": "Кризисное управление в ЧС — управление в условиях дефицита времени, неполноты информации и высокой цены ошибки; его обеспечивают две взаимосвязанные системы, РСЧС и ГО. Различий у них три — время, закон, характер вертикали, — а главное сходство одно: это одна инфраструктура в двух правовых режимах.", "anchors": ["дефицит времени", "единоначалие и планы", "три различия", "единая инфраструктура", "подготовка до кризиса"], "simple": ["Кризисное управление идёт в условиях дефицита времени и высокой цены ошибки, отсюда три его особенности: жёсткое единоначалие, заранее заготовленные типовые решения в виде планов и переход системы в особые режимы функционирования.", "Обеспечивают его две государственные системы, замкнутые на МЧС России. РСЧС — единая система предупреждения и ликвидации ЧС мирного времени: пять уровней, функциональные и территориальные подсистемы, три режима, три типа органов — координационные, постоянно действующие, повседневного управления.", "Гражданская оборона — система защиты от опасностей военных конфликтов и ЧС мирного времени: общее руководство у Правительства РФ, в организациях — у руководителей по должности, перевод в готовность идёт по установленным степеням готовности ГО.", "Различий три: условия применения (РСЧС — мирное время, ГО — прежде всего военное); правовая основа (закон о защите населения от ЧС против закона о гражданской обороне); характер управления (РСЧС ближе к межведомственной координации, ГО — к мобилизационной вертикали).", "Сходства важнее различий: общий федеральный орган МЧС России, общие силы и средства, общий фонд защитных сооружений, единая система оповещения, во многом общие органы управления на местах и один и тот же обученный персонал. По сути это одна инфраструктура, работающая в двух правовых режимах.", "Отсюда логика перехода: при военном положении РСЧС не упраздняется, а её структура и силы используются в интересах ГО. Эффективность кризисного управления определяется тем, что сделано до кризиса — планированием, обучением, резервами и отработкой взаимодействия; в момент ЧС система только исполняет подготовленное."], "cards": [{"t": "Кризисное управление в ЧС", "d": "управление в условиях дефицита времени, неполноты информации и высокой цены ошибки; опирается на единоначалие, заготовленные планы и особые режимы функционирования"}, {"t": "Различия РСЧС и ГО", "d": "условия применения (мирное время против военного), правовая основа (закон о защите населения и территорий от ЧС против закона о гражданской обороне), характер управления (межведомственная координация против мобилизационной вертикали)"}, {"t": "Сходства РСЧС и ГО", "d": "общий федеральный орган МЧС России, общие силы и средства, общий фонд защитных сооружений, единая система оповещения, во многом общие органы управления на местах, общий обученный персонал"}, {"t": "Три типа органов управления РСЧС по функции", "d": "координационные принимают решения и согласовывают ведомства, постоянно действующие ведут повседневную организацию, органы повседневного управления обеспечивают круглосуточное реагирование"}, {"t": "Логика перехода к военному времени", "d": "РСЧС не упраздняется, её структура и силы используются в интересах гражданской обороны"}, {"t": "Перевод ГО в готовность", "d": "осуществляется по установленным степеням готовности гражданской обороны"}], "quiz": [{"q": "В чём главное сходство РСЧС и гражданской обороны?", "ok": "это по сути одна инфраструктура — общие силы, средства, органы и оповещение — работающая в двух правовых режимах", "bad": ["у них совпадает правовая основа", "обе системы работают только в военное время", "обе полностью подчинены органам местного самоуправления"], "why": "Правовые основы как раз разные, а инфраструктура во многом общая."}, {"q": "Что происходит с РСЧС при переводе страны на военное положение?", "ok": "она не упраздняется, её структура и силы используются в интересах гражданской обороны", "bad": ["она упраздняется, её функции полностью передаются гражданской обороне", "она продолжает работать полностью автономно от гражданской обороны", "её органы переподчиняются органам местного самоуправления"], "why": "Такое построение экономит ресурсы и избавляет от создания второй системы с нуля."}, {"q": "Какие три особенности отличают кризисное управление?", "ok": "единоначалие, заранее заготовленные типовые решения в виде планов, переход в особые режимы функционирования", "bad": ["коллегиальность, гласность, поэтапное согласование решений", "единоначалие, отраслевое планирование, постоянный состав сил", "ведомственная самостоятельность, свободный обмен информацией, гибкие сроки"], "why": "Все три особенности — ответ на дефицит времени и высокую цену ошибки."}, {"q": "Чем различаются РСЧС и ГО по характеру управления?", "ok": "РСЧС ближе к межведомственной координации, ГО — к мобилизационной вертикали", "bad": ["РСЧС строится на единоначалии, ГО — на коллегиальности", "РСЧС управляется субъектами РФ, ГО — только организациями", "различий в характере управления между системами нет"], "why": "Единоначалие есть в обеих, различие в том, что РСЧС согласовывает ведомства, а ГО выстраивает жёсткую вертикаль."}]}, {"n": 17, "title": "Универсальные учебные действия: понятие, виды, способы формирования", "kostyak": ["УУД — обобщённые способы действия, которые обеспечивают человеку умение учиться: самостоятельно ставить цель, находить средства, контролировать себя и оценивать результат. По сути это перенос учебной деятельности в собственное распоряжение ученика.", "Понятие вошло в отечественный стандарт через работы научного коллектива под руководством Асмолова, а теоретически восходит к культурно-исторической теории Выготского и теории учебной деятельности Эльконина и Давыдова.", "По обновлённому ФГОС метапредметные результаты описаны через три группы УУД: познавательные, коммуникативные и регулятивные.", "Познавательные включают базовые логические действия — сравнение, классификацию, установление причинно-следственных связей; базовые исследовательские — выдвижение гипотезы, проведение небольшого исследования; и работу с информацией — поиск, отбор, оценку достоверности.", "Коммуникативные — это общение и совместная деятельность: аргументировать позицию, слушать, распределять роли, договариваться в группе.", "Регулятивные — самоорганизация и самоконтроль: постановка задачи, планирование, коррекция, оценка сделанного. В обновлённом стандарте сюда добавлены эмоциональный интеллект и принятие себя и других.", "Формируются УУД не отдельными занятиями, а способом организации любого урока: через задачу, а не через сообщение готового; через групповую работу; через задания на самопроверку и взаимопроверку; через рефлексию в конце урока.", "На ОБиЗР материал под это подходит идеально. Оценка достоверности сообщения о ЧС в соцсети — работа с информацией. Распределение обязанностей при учебной эвакуации — коммуникативные. Составление собственного плана действий при пожаре в квартире и проверка его по критериям — регулятивные."], "terms": ["универсальные учебные действия", "метапредметные результаты", "познавательные", "коммуникативные", "регулятивные УУД", "базовые логические и базовые исследовательские действия", "работа с информацией", "самоорганизация и самоконтроль", "умение учиться", "Асмолов", "интериоризация", "рефлексия"], "follow": [{"q": "Как оценивать УУД?", "a": "Через специальные комплексные и метапредметные работы, наблюдение по критериям, проектную деятельность, защиту индивидуального проекта. Обычной предметной отметкой они не измеряются."}, {"q": "Чем УУД отличаются от общеучебных умений?", "a": "Общеучебные умения — более узкое и операциональное понятие. УУД шире: включают ценностный и регулятивный компонент и по определению переносимы на любой предмет и на внеучебные ситуации."}], "notes": [{"label": "Заходит от психологии", "text": "это центральная территория. Стоит сказать про интериоризацию — внешнее совместное действие постепенно становится внутренним индивидуальным; про поэтапное формирование умственных действий Гальперина как механизм; про зону ближайшего развития как объяснение, почему УУД формируются сначала в совместной работе с учителем и сверстниками, а потом переходят в самостоятельные. Если добавить, что личностные УУД в старом стандарте были четвёртой группой, а в обновлённом личностные результаты вынесены отдельно по направлениям воспитания — это сильный маркер того, что человек читал сам стандарт, а не пересказ."}], "block": "Методика", "bk": "met", "tier": 2, "psy": false, "aid": false, "core": "УУД — обобщённые способы действия, которые дают ученику умение учиться; их три вида, и формируются они не отдельными занятиями, а тем, как устроен любой урок.", "anchors": ["умение учиться", "Асмолов", "познавательные", "коммуникативные", "регулятивные", "интериоризация", "зона ближайшего развития"], "simple": ["УУД — обобщённые способы действия, обеспечивающие умение учиться: ученик сам ставит цель, находит средства, контролирует и оценивает результат. Понятие вошло в стандарт через работы Асмолова, восходит к Выготскому и к теории учебной деятельности Эльконина и Давыдова.", "Три вида: познавательные (работать со знанием), коммуникативные (работать с людьми), регулятивные (работать с собой). Познавательные делятся на базовые логические, базовые исследовательские и работу с информацией.", "Регулятивные — самоорганизация и самоконтроль: постановка задачи, планирование, коррекция, оценка; в обновлённом стандарте сюда добавлены эмоциональный интеллект и принятие себя и других.", "Механизм формирования — интериоризация: сначала действие внешнее и совместное, потом внутреннее и своё; отсюда групповая работа по существу и опора на зону ближайшего развития.", "Личностные УУД раньше были четвёртой группой, в обновлённом стандарте личностные результаты вынесены отдельно по направлениям воспитания.", "Отметкой УУД не измеряются: нужны комплексные метапредметные работы, наблюдение по критериям, защита проекта. На ОБиЗР: проверка достоверности сообщения о ЧС — работа с информацией, распределение ролей на эвакуации — коммуникативные, свой план действий при пожаре — регулятивные."], "cards": [{"t": "универсальные учебные действия", "d": "обобщённые способы действия, обеспечивающие умение учиться и переносимые на любой предмет"}, {"t": "познавательные УУД", "d": "базовые логические действия, базовые исследовательские действия и работа с информацией"}, {"t": "коммуникативные УУД", "d": "общение и совместная деятельность: аргументировать позицию, слушать, распределять роли, договариваться"}, {"t": "регулятивные УУД", "d": "самоорганизация и самоконтроль: постановка задачи, планирование, коррекция, оценка; в обновлённом стандарте сюда добавлены эмоциональный интеллект и принятие себя и других"}, {"t": "интериоризация", "d": "переход внешнего совместного действия во внутреннее индивидуальное; механизм формирования УУД"}, {"t": "зона ближайшего развития", "d": "то, что ребёнок делает пока со взрослым и сверстниками; объясняет, почему УУД сначала складываются в совместной работе"}], "quiz": [{"q": "Какие три вида УУД описывают метапредметные результаты в обновлённом ФГОС?", "ok": "Познавательные, коммуникативные, регулятивные", "bad": ["Познавательные, коммуникативные, регулятивные, личностные", "Логические, исследовательские, информационные", "Учебные, воспитательные, развивающие"], "why": "Личностные УУД были четвёртой группой в прежнем стандарте; сейчас личностные результаты вынесены отдельно по направлениям воспитания."}, {"q": "Оценка достоверности сообщения о ЧС в социальной сети формирует прежде всего какие УУД?", "ok": "Познавательные, в части работы с информацией", "bad": ["Регулятивные", "Коммуникативные", "Личностные"], "why": "Поиск, отбор и оценка достоверности — это подгруппа работы с информацией внутри познавательных УУД."}, {"q": "Как оценивают сформированность УУД?", "ok": "Комплексными метапредметными работами, наблюдением по критериям, защитой проекта", "bad": ["Обычной предметной отметкой за четверть", "Только на государственной итоговой аттестации", "Тестом на знание определений"], "why": "Предметная отметка меряет предметный результат. Для УУД нужны отдельные инструменты."}, {"q": "Какой механизм объясняет формирование УУД в совместной работе с последующим переходом в самостоятельность?", "ok": "Интериоризация", "bad": ["Экстериоризация", "Генерализация", "Адаптация"], "why": "Внешнее совместное действие становится внутренним индивидуальным. Отсюда же логика зоны ближайшего развития."}]}, {"n": 8, "title": "Метод обучения и методический приём. Проблемное изложение, эвристический и исследовательский методы", "kostyak": ["Метод обучения — способ упорядоченной совместной деятельности учителя и учеников, направленный на решение задач обучения. Ключевое слово — совместной: в методе всегда две стороны.", "Методический приём — элемент метода, отдельное действие внутри него. Один и тот же приём в разных методах играет разную роль: показ слайда может быть иллюстрацией при объяснении, а может быть завязкой проблемной ситуации.", "Классификаций методов несколько. По источнику знаний — словесные, наглядные, практические. По дидактической цели — методы изучения нового, закрепления, контроля. Но для этого вопроса нужна классификация Лернера и Скаткина по характеру познавательной деятельности.", "В ней пять методов: объяснительно-иллюстративный, репродуктивный, проблемного изложения, частично-поисковый и исследовательский. Они выстроены по нарастанию самостоятельности ученика.", "Проблемное изложение: учитель ставит проблему и сам её решает вслух, но показывает ход рассуждения, тупики, отбрасывание версий. Ученик не действует, но следит за логикой и присваивает образец мышления. На ОБиЗР это разбор реальной аварии или пожара: почему погибли люди, где была точка невозврата.", "Частично-поисковый, или эвристический: проблема делится на шаги, часть выполняет учитель, часть — ученики. Классический инструмент — эвристическая беседа с системой наводящих вопросов. На уроке это выглядит так: даю фабулу ситуации, класс сам достраивает алгоритм действий, я держу только узловые точки.", "Исследовательский метод: ученики проходят весь цикл сами — от проблемы и гипотезы до выводов. На ОБиЗР это исследование по безопасности маршрута «дом — школа», анализ статистики травматизма в районе, проверка эвакуационных путей своего этажа с картой.", "Практический вывод: на одном уроке эти методы почти всегда комбинируются, а выбор метода определяют цель, возраст, подготовленность класса и время. Полностью исследовательский урок дорог по времени, поэтому он не может быть единственным."], "terms": ["метод и приём обучения", "классификация Лернера и Скаткина", "характер познавательной деятельности", "объяснительно-иллюстративный и репродуктивный методы", "проблемная ситуация", "эвристическая беседа", "гипотеза", "перенос способа действия", "Махмутов и теория проблемного обучения", "оптимальный выбор методов по Бабанскому"], "follow": [{"q": "Чем метод отличается от технологии?", "a": "Метод — способ действия внутри урока. Технология — воспроизводимая последовательность действий с заданным результатом и диагностикой, она охватывает весь процесс и гарантирует повторяемость."}, {"q": "Где на ОБиЗР исследовательский метод неуместен?", "a": "Там, где цена ошибки — жизнь и есть жё
