лодная влажная кожа, частый слабый пульс, заторможенность или наоборот возбуждение, жажда. Помощь: остановить кровотечение, уложить с приподнятыми ногами, укрыть, не поить, срочно вызвать скорую."}, {"q": "Можно ли снять шлем с упавшего мотоциклиста или подростка с самоката?", "a": "Нет, если он дышит. Снятие шлема — движение шеи. Исключение — если без снятия невозможна реанимация."}], "notes": [], "block": "Первая помощь", "bk": "pp", "tier": 2, "psy": false, "aid": true}, {"n": 53, "title": "Поражающие факторы ЧС (дословный дубль вопроса 43)", "kostyak": ["«Поражающий фактор — составляющая опасного явления, которая непосредственно воздействует на людей, объекты и природную среду и вызывает поражение. Сама ЧС — событие, поражающий фактор — механизм причинения вреда».", "«По природе воздействия выделяют механические, тепловые, химические, радиационные, биологические, а также акустические, электромагнитные и психологические факторы».", "«Механические — ударная волна, обломки, обрушение конструкций, оползневые массы, поток воды. Результат — травмы, переломы, баротравма, гибель под завалами».", "«Тепловые — световое излучение, пламя, горячие газы. Вызывают ожоги кожи и дыхательных путей, тепловой удар, воспламенение материалов».", "«Химические — воздействие аварийно химически опасных веществ: отравления, поражение органов дыхания, ожоги, заражение местности и воды».", "«Радиационные — ионизирующее излучение: острая и хроническая лучевая болезнь, отдалённые последствия».", "«Биологические — патогенные микроорганизмы и токсины: инфекционные заболевания, эпидемии, эпизоотии».", "«Отдельно называю психологический фактор: острая реакция на стресс, паника, ступор, дезорганизация поведения. Он не оставляет физических следов, но резко увеличивает потери — из-за паники людей гибнет иногда больше, чем от самого поражающего явления».", "«По времени действия факторы делят на первичные и вторичные: землетрясение — первичный, а вызванный им пожар или разрушение плотины — вторичный. По длительности — мгновенные и пролонгированные»."], "terms": ["поражающий фактор", "первичные и вторичные факторы", "ударная волна", "световое излучение", "ионизирующее излучение", "АХОВ (аварийно химически опасные вещества)", "очаг поражения", "зона заражения", "санитарные и безвозвратные потери"], "follow": [{"q": "Приведите пример цепочки первичных и вторичных факторов.", "a": "— Землетрясение: первичный — сейсмический удар и обрушение зданий; вторичные — пожары от повреждённых сетей, утечка АХОВ с предприятия, затопление при разрушении гидросооружения, вспышка инфекций из-за нарушения водоснабжения."}, {"q": "Почему психологический фактор относят к поражающим?", "a": "— Потому что он самостоятельно приводит к потерям: паника вызывает давку, ступор мешает эвакуироваться, дезорганизация срывает действия спасателей."}], "notes": [{"label": "Если достался вторым", "text": "Сказать: «эта тема повторяет вопрос сорок три, содержание то же; чтобы не повторяться, разверну подробнее классификацию по времени действия и по масштабу зоны поражения». Это выглядит как ориентированность в программе, а не как уход от ответа."}], "block": "Теория, риск, ЗОЖ", "bk": "teor", "tier": 3, "psy": false, "aid": false, "alias_of": 43}, {"n": 15, "title": "Экологические аспекты БЖД. Экологически опасные факторы", "kostyak": ["Экологический аспект безопасности жизнедеятельности состоит в том, что человек постоянно живёт в среде, изменённой его же деятельностью, и эта среда действует на здоровье не разово, как при ЧС, а хронически, малыми дозами и годами.", "Экологически опасный фактор — это любой компонент среды, который при определённой интенсивности вызывает негативные изменения в состоянии здоровья человека и в экосистемах. Делят такие факторы на три группы: физические, химические и биологические.", "Физические факторы: шум, инфразвук и ультразвук, вибрация, электромагнитные поля и излучения, ионизирующее излучение, тепловое и световое загрязнение, запылённость воздуха.", "Отдельно выделю ионизирующее излучение и радон в помещениях, а также электромагнитное загрязнение от линий электропередач и передающих устройств — это специфика именно городской среды.", "Химические факторы: тяжёлые металлы, свинец, ртуть, кадмий; оксиды серы и азота; угарный газ; нефтепродукты; пестициды; диоксины; синтетические поверхностно-активные вещества; формальдегид и летучие органические соединения в отделочных материалах.", "Биологические факторы: патогенные микроорганизмы, вирусы, грибы и продукты их жизнедеятельности, микотоксины; аллергены, включая пыльцу и плесень; продукты биотехнологического производства; последствия неконтролируемого распространения чужеродных видов.", "Механизм действия у этих факторов общий: эффект зависит от дозы и времени экспозиции, многие вещества обладают кумулятивным действием, то есть накапливаются, а некоторые дают отдалённые эффекты — канцерогенный, мутагенный, тератогенный, гонадотропный.", "Нормирование опирается на понятие предельно допустимой концентрации и предельно допустимого уровня. Причём для детей действуют более жёсткие требования, потому что детский организм чувствительнее к тем же дозам.", "Отсюда практический вывод: экологическая безопасность — это в первую очередь нормирование, контроль и мониторинг, а не ликвидация уже случившегося."], "terms": ["экологически опасный фактор", "экспозиция", "доза", "кумулятивный эффект", "канцерогенное", "мутагенное", "тератогенное действие", "предельно допустимая концентрация (ПДК)", "предельно допустимый уровень (ПДУ)", "тяжёлые металлы", "диоксины", "микотоксины", "санитарно-эпидемиологические требования"], "follow": [{"q": "Что такое ПДК и почему для одного вещества их несколько?", "a": "Предельно допустимая концентрация — это норматив содержания вещества, при котором оно не оказывает вредного воздействия на человека в течение всей жизни. Нормативов несколько, потому что они устанавливаются отдельно для воздуха рабочей зоны, атмосферного воздуха населённых мест, воды и почвы, а для атмосферного воздуха ещё различают максимальную разовую и среднесуточную концентрацию."}, {"q": "Какой физический фактор вы считаете самым недооценённым в школе?", "a": "Шум. Он не воспринимается как опасность, но при постоянном превышении даёт утомление, снижение концентрации внимания и рост тревожности, а у педагогов ещё и профессиональные нагрузки на голос."}], "notes": [{"label": "Разворот на школу", "text": "здесь напрямую работают санитарно-эпидемиологические требования к образовательным организациям — освещённость, воздушно-тепловой режим, проветривание, шум, мебель по росту, ограничение экранного времени. Это тот случай, когда экология из глобальной темы превращается в ежедневную работу с расписанием и кабинетом."}], "block": "ЧС, ГО, РСЧС", "bk": "chs", "tier": 3, "psy": false, "aid": false}, {"n": 16, "title": "Антропогенное воздействие на окружающую среду. Глобальные экологические проблемы", "kostyak": ["Антропогенное воздействие — это влияние хозяйственной деятельности человека на природную среду, которое изменяет её состояние и структуру. Принципиально оно отличается от природных изменений скоростью: то, что биосфера проходила за тысячи лет, техносфера меняет за десятилетия.", "Виды воздействий удобно перечислить по средам. На атмосферу — выбросы промышленности, транспорта и энергетики, парниковые газы, озоноразрушающие вещества.", "На гидросферу — сброс сточных вод, эвтрофикация водоёмов, нефтяное загрязнение Мирового океана, зарегулирование стока рек плотинами.", "На литосферу и почву — эрозия, засоление, загрязнение пестицидами и тяжёлыми металлами, изъятие земель под свалки и карьеры, накопление твёрдых коммунальных отходов.", "На биоту — обезлесение, перепромысел, разрушение мест обитания, интродукция чужеродных видов, сокращение биологического разнообразия.", "Из этих воздействий складываются глобальные проблемы. Первая — изменение климата и усиление парникового эффекта. Вторая — разрушение озонового слоя. Третья — кислотные осадки.", "Дальше — опустынивание и деградация земель, обезлесение, дефицит пресной воды, сокращение биоразнообразия, загрязнение Мирового океана, включая пластиковое, и проблема накопления отходов.", "Общая черта у всех этих проблем одна: они трансграничны, то есть последствия не совпадают с границами государства-источника. Поэтому решаются они только международными соглашениями — рамочная конвенция по климату, конвенция о биоразнообразии, соглашения по озоновому слою.", "И концептуальный ответ на всё это — переход к устойчивому развитию: удовлетворение потребностей нынешнего поколения без ущерба возможностям будущих. Практические инструменты — нормирование, экологическая экспертиза, экологический мониторинг, наилучшие доступные технологии и экологическое образование."], "terms": ["антропогенное воздействие", "техносфера", "биосфера", "эвтрофикация", "интродукция чужеродных видов", "биологическое разнообразие", "трансграничный характер", "устойчивое развитие", "экологическая экспертиза", "экологический мониторинг", "наилучшие доступные технологии"], "follow": [{"q": "Что такое устойчивое развитие?", "a": "Модель развития, при которой удовлетворение потребностей нынешнего поколения не лишает будущие поколения возможности удовлетворять свои. Стоит на трёх опорах — экономической, социальной и экологической, и требует, чтобы решения принимались с учётом всех трёх сразу."}, {"q": "Может ли антропогенное воздействие быть положительным?", "a": "Да. Рекультивация нарушенных земель, лесовосстановление, создание особо охраняемых природных территорий, восстановление популяций редких видов. Термин описывает влияние человека, а знак этого влияния зависит от характера деятельности."}], "notes": [{"label": "Разворот на школу", "text": "экологическое образование в этой логике не факультатив, а элемент системы безопасности. Оно формирует ту самую культуру безопасности, из которой потом вырастает поведение взрослого человека — от раздельного сбора отходов до готовности соблюдать ограничения."}], "block": "ЧС, ГО, РСЧС", "bk": "chs", "tier": 3, "psy": false, "aid": false}, {"n": 50, "title": "Глобальные экологические проблемы. Критерии оценки качества окружающей среды", "kostyak": ["Разберу механизмы четырёх ключевых проблем, а затем перейду к критериям оценки качества среды.", "Парниковый эффект сам по себе — естественное явление. Атмосфера пропускает коротковолновое солнечное излучение к поверхности Земли, но задерживает длинноволновое тепловое излучение обратно в космос. Без него средняя температура планеты была бы примерно на тридцать градусов ниже и жизнь в нынешнем виде была бы невозможна.", "Проблема начинается тогда, когда концентрация парниковых газов растёт из-за человека. Основные газы — углекислый газ, метан, закись азота, водяной пар и фреоны. Источники — сжигание ископаемого топлива, сельское хозяйство, вырубка лесов, которые поглощали углекислый газ.", "Следствия глобального потепления — таяние ледников и многолетней мерзлоты, повышение уровня Мирового океана, рост частоты и силы опасных погодных явлений, смещение климатических зон и сельскохозяйственных поясов.", "Кислотные осадки образуются так: в атмосферу поступают оксиды серы и азота от энергетики, металлургии и транспорта, там они соединяются с водяным паром и превращаются в серную и азотную кислоты, которые выпадают с дождём и снегом. Последствия — закисление почв и водоёмов, гибель рыбы, усыхание лесов, разрушение зданий и памятников.", "Разрушение озонового слоя вызывают хлорфторуглероды, фреоны и галоны. Озоновый экран задерживает жёсткое ультрафиолетовое излучение, при его истончении растёт частота рака кожи, катаракты, снижается продуктивность растений и планктона.", "Четвёртая проблема — опустынивание и деградация земель из-за перевыпаса, сведения лесов, неправильного орошения с последующим засолением.", "Теперь критерии оценки качества среды. Качество окружающей среды — это степень соответствия её характеристик потребностям человека и требованиям экосистем. Оценивается по системе нормативов.", "Первая группа — санитарно-гигиенические нормативы: предельно допустимая концентрация, предельно допустимый уровень физического воздействия, ориентировочно безопасный уровень воздействия для веществ с неустановленной ПДК. Вторая — производственно-хозяйственные: предельно допустимый выброс в атмосферу и предельно допустимый сброс в водные объекты, лимиты на размещение отходов. Третья — комплексные, например индекс загрязнения атмосферы и классы качества воды.", "Инструменты применения этих нормативов — государственный экологический мониторинг, государственная экологическая экспертиза, экологический контроль и надзор."], "terms": ["парниковый эффект", "парниковые газы", "углекислый газ", "метан", "фреоны", "озоновый экран", "хлорфторуглероды", "кислотные осадки", "оксиды серы и азота", "опустынивание", "качество окружающей среды", "ПДК", "ПДУ", "ОБУВ", "ПДВ", "ПДС", "индекс загрязнения атмосферы", "государственный экологический мониторинг"], "follow": [{"q": "Чем ПДК отличается от ПДВ?", "a": "ПДК — концентрация вещества в среде, норматив качества самой среды. ПДВ — предельно допустимый выброс, то есть норматив для конкретного источника, установленный так, чтобы суммарный выброс всех источников не привёл к превышению ПДК в приземном слое."}, {"q": "Почему проблема озонового слоя считается наиболее успешно решаемой?", "a": "Потому что по ней удалось договориться о поэтапном отказе от озоноразрушающих веществ и заменить их технологически. Круг веществ был узкий, замена нашлась, и это дало измеримый результат — в отличие от климата, где источник выбросов — вся мировая энергетика сразу."}], "notes": [], "block": "ЧС, ГО, РСЧС", "bk": "chs", "tier": 3, "psy": false, "aid": false}, {"n": 55, "title": "Угрозы гражданской безопасности. Природные явления, аварии и техногенные катастрофы", "kostyak": ["«Под гражданской безопасностью понимают защищённость населения, материальных и культурных ценностей от опасностей мирного и военного времени. Это поле гражданской обороны и единой государственной системы предупреждения и ликвидации ЧС — РСЧС».", "«Угрозы делят на природные, техногенные, биолого-социальные и социальные, включая террористические проявления».", "«Угрозы опасных природных явлений: геофизические — землетрясения, извержения; геологические — оползни, сели, лавины, обвалы; метеорологические — ураганы, смерчи, сильные морозы и жара, засухи; гидрологические — наводнения, паводки, заторы; природные пожары».", "«Их особенность — внезапность и большой охват территории. Управлять источником нельзя, снижают только уязвимость: прогноз, мониторинг, оповещение, инженерная защита, ограничения застройки».", "«Техногенные угрозы: аварии на радиационно и химически опасных объектах, пожары и взрывы, транспортные аварии, аварии на гидротехнических сооружениях, обрушения зданий, отказы систем жизнеобеспечения».", "«Катастрофа отличается от аварии масштабом последствий: гибель людей, тяжёлый ущерб, длительное нарушение жизнедеятельности территории».", "«Причины техногенных ЧС однотипны: износ фондов, нарушение технологической дисциплины, ошибки проектирования, экономия на защите и человеческий фактор в широком смысле».", "«Система противодействия строится на предупреждении и ликвидации: мониторинг и прогнозирование, оповещение населения, подготовка населения и обучение, силы и средства РСЧС, эвакуационные мероприятия, резервы»."], "terms": ["гражданская оборона", "РСЧС", "авария и катастрофа", "потенциально опасный объект", "радиационно и химически опасные объекты", "мониторинг и прогнозирование", "оповещение населения", "эвакуация", "уязвимость территории"], "follow": [{"q": "Чем ЧС отличается от происшествия?", "a": "— ЧС — обстановка на территории, сложившаяся в результате опасного события, которая повлекла или может повлечь жертвы, ущерб, нарушение условий жизнедеятельности и требует привлечения сил и средств вне обычного режима работы."}, {"q": "Что важнее — предупреждение или ликвидация?", "a": "— Предупреждение. Вложения в прогноз, инженерную защиту и обучение населения дают существенно больший эффект на единицу затрат, чем работа по последствиям. Конкретные соотношения по источникам расходятся, но вывод устойчивый."}], "notes": [], "block": "Теория, риск, ЗОЖ", "bk": "teor", "tier": 3, "psy": false, "aid": false}, {"n": 57, "title": "Безопасность и демография. Демографическая и миграционная политика РФ", "kostyak": ["Демографическая безопасность — состояние защищённости общества от процессов, ведущих к депопуляции, разрушению возрастной структуры и утрате трудового потенциала. Это часть национальной безопасности, потому что численность и структура населения определяют и экономику, и обороноспособность.", "Основные демографические процессы, влияющие на безопасность: рождаемость, смертность, продолжительность жизни, миграция, возрастная структура населения.", "Тенденции, характерные для России и для большинства развитых стран: старение населения, снижение доли населения репродуктивного возраста, устойчиво низкая рождаемость по отношению к уровню простого воспроизводства, неравномерность расселения по территории страны. Формулирую именно как тенденции, точные показатели меняются.", "Демографическая политика — система мер государства, направленная на воспроизводство населения. Инструменты: меры материальной поддержки семей с детьми, развитие доступности жилья, здравоохранение и снижение смертности, поддержка семьи как ценности.", "Миграционная политика решает две задачи одновременно: восполнение трудовых ресурсов и обеспечение безопасности, включая противодействие незаконной миграции.", "Виды миграции: внутренняя и внешняя, постоянная и временная, трудовая, образовательная, вынужденная. Отдельно выделяют незаконную миграцию как источник криминальных и санитарно-эпидемиологических рисков.", "Риски миграции с точки зрения безопасности: социальная напряжённость в принимающих сообществах, сложности интеграции, формирование замкнутых анклавов, нагрузка на социальную инфраструктуру.", "Для образования это прямая задача: обучение детей мигрантов, языковая адаптация, профилактика межэтнических конфликтов в классе."], "terms": ["демографическая безопасность", "депопуляция", "воспроизводство населения", "суммарный коэффициент рождаемости", "старение населения", "демографическая политика", "миграционный прирост", "трудовая миграция", "незаконная миграция", "социокультурная адаптация", "аккультурация"], "follow": [{"q": "Почему демография — вопрос безопасности, а не только экономики?", "a": "Потому что структура населения определяет мобилизационный и трудовой ресурс, устойчивость пенсионной системы и способность удерживать освоенность территории."}, {"q": "В чём главная задача школы при работе с детьми мигрантов?", "a": "Языковая и социокультурная адаптация без вытеснения ребёнка в изолированную группу, то есть поддержка стратегии интеграции."}], "notes": [{"label": "Заходит от психологии", "text": "аккультурация и её стратегии — интеграция, ассимиляция, сепарация, маргинализация. Это классическая модель, она хорошо ложится на разговор об адаптации детей мигрантов в школе. Плюс тема этнических стереотипов и межгрупповых предубеждений."}], "block": "Социальные угрозы", "bk": "soc", "tier": 3, "psy": false, "aid": false}, {"n": 59, "title": "Источники международных опасностей", "kostyak": ["Международная безопасность — состояние отношений между государствами, при котором отсутствует угроза войны и обеспечены условия для устойчивого развития. Соответственно, международная опасность — фактор, способный это состояние нарушить.", "Источники удобно классифицировать по природе. Военно-политические: вооружённые конфликты, распространение оружия массового поражения, гонка вооружений, деятельность незаконных вооружённых формирований.", "Экономические: неравномерность развития, конкуренция за ресурсы, нестабильность мировых рынков, долговые кризисы.", "Природно-экологические: изменение климата, дефицит пресной воды, трансграничное загрязнение, крупные техногенные аварии с последствиями за пределами одной страны.", "Социально-гуманитарные: массовая вынужденная миграция, эпидемии и пандемии, голод, бедность.", "Информационные: информационные войны, кибератаки на критическую инфраструктуру, распространение недостоверной информации.", "Транснациональные криминальные: международный терроризм, наркотрафик, торговля людьми, отмывание денег, пиратство.", "Общая причина у большинства источников одна — неравномерность развития и рост взаимозависимости государств: глобализация повышает связанность, а вместе с ней растёт скорость распространения любой угрозы. Ни одна из этих опасностей не решается силами одного государства, отсюда и необходимость международного сотрудничества."], "terms": ["международная безопасность", "глобальные проблемы современности", "оружие массового поражения", "нераспространение", "транснациональная преступность", "критическая инфраструктура", "трансграничный характер угроз", "глобализация", "взаимозависимость"], "follow": [{"q": "Что такое глобальные проблемы?", "a": "Проблемы, которые затрагивают человечество в целом и не могут быть решены усилиями отдельных государств: экология, ресурсы, демография, разоружение, эпидемии."}, {"q": "Какие угрозы называют «новыми»?", "a": "Те, где источником выступает не государство: терроризм, кибератаки, пандемии, транснациональная преступность."}], "notes": [], "block": "Социальные угрозы", "bk": "soc", "tier": 3, "psy": false, "aid": false}, {"n": 60, "title": "Международное сотрудничество в области БЖД", "kostyak": ["Смысл сотрудничества в том, что угрозы носят трансграничный характер: авария, эпидемия или загрязнение не останавливаются на границе, а значит и реагирование должно быть совместным.", "Направления сотрудничества: предупреждение и ликвидация чрезвычайных ситуаций, гуманитарная помощь, охрана окружающей среды, борьба с терроризмом и транснациональной преступностью, санитарно-эпидемиологическая безопасность, ядерная и радиационная безопасность, нераспространение оружия массового поражения.", "На глобальном уровне работают структуры системы ООН: сама Организация Объединённых Наций, Всемирная организация здравоохранения, ЮНЕСКО, МАГАТЭ по атомной энергии, Международная организация труда, Управление по координации гуманитарных вопросов.", "Отдельно — Международное движение Красного Креста и Красного Полумесяца как крупнейшая гуманитарная организация, и Международная организация гражданской обороны.", "На региональном уровне для России это сотрудничество в рамках СНГ, ШОС, БРИКС, ОДКБ — по линии реагирования на ЧС, гуманитарного разминирования, обмена информацией.", "Формы сотрудничества: международные договоры и конвенции, совместные учения, обмен информацией и технологиями, подготовка специалистов, направление спасательных отрядов и гуманитарных грузов.", "Россия участвует в этой работе через МЧС, которое направляет аэромобильные группировки и гуманитарные миссии в зоны бедствий за рубежом.", "Образовательная составляющая тоже есть: ЮНЕСКО и ООН продвигают образование в области снижения риска бедствий, и культура безопасности рассматривается как международная задача."], "terms": ["трансграничный характер угроз", "система ООН", "ВОЗ", "МАГАТЭ", "ЮНЕСКО", "Международное движение Красного Креста и Красного Полумесяца", "гуманитарное реагирование", "снижение риска бедствий", "международные конвенции", "гражданская оборона"], "follow": [{"q": "Зачем международное сотрудничество, если у страны есть своя система?", "a": "Потому что масштаб крупных бедствий превышает ресурсы одного государства, и потому что часть угроз в принципе не имеет территориальной привязки."}, {"q": "Что даёт участие в международных учениях?", "a": "Отработку совместимости процедур и связи между спасательными службами разных стран — без этого совместная операция теряет темп."}], "notes": [], "block": "Социальные угрозы", "bk": "soc", "tier": 3, "psy": false, "aid": false}, {"n": 61, "title": "Продовольственная безопасность", "kostyak": ["Продовольственная безопасность — состояние экономики, при котором обеспечена физическая и экономическая доступность безопасных пищевых продуктов в объёмах, достаточных для активной и здоровой жизни населения. В России базовым документом выступает Доктрина продовольственной безопасности Российской Федерации.", "В понятии выделяют четыре измерения, они закреплены в подходе ФАО: наличие продовольствия, доступность, качество и безопасность продуктов, стабильность снабжения во времени.", "Ключевой показатель для государства — самообеспеченность по основным группам продукции: зерно, мясо, молоко, рыба, сахар, растительное масло, картофель, овощи. Доктрина задаёт по ним пороговые значения.", "Угрозы на национальном уровне: зависимость от импорта по отдельным позициям, включая семена и племенной материал; изношенность инфраструктуры хранения и переработки; неблагоприятные погодные явления; снижение плодородия почв.", "Угрозы на мировом уровне: рост населения при ограниченности пахотных земель, изменение климата и рост частоты засух, волатильность цен на продовольствие, конфликты и разрушение логистических цепочек.", "В мире проблема выражается в двух формах одновременно: недоедание и голод в одних регионах, избыточное потребление и ожирение в других. Плюс проблема «скрытого голода» — дефицита микронутриентов при формально достаточной калорийности.", "Меры обеспечения: поддержка сельхозпроизводителя, развитие селекции и семеноводства, формирование резервов, контроль качества и безопасности продукции, развитие внутренней логистики.", "Есть и образовательный контур — формирование культуры здорового питания и организация питания в образовательных организациях с контролем качества."], "terms": ["продовольственная безопасность", "Доктрина продовольственной безопасности РФ", "самообеспеченность", "пороговые значения", "физическая и экономическая доступность", "ФАО", "продовольственная независимость", "качество и безопасность пищевой продукции", "скрытый голод", "продовольственные резервы"], "follow": [{"q": "Чем продовольственная безопасность отличается от продовольственной независимости?", "a": "Независимость — про долю собственного производства. Безопасность шире: она включает ещё доступность продуктов для населения и их качество."}, {"q": "Как тема выходит на школу?", "a": "Через организацию горячего питания, контроль качества продукции, санитарные требования и формирование пищевого поведения у детей."}], "notes": [], "block": "Социальные угрозы", "bk": "soc", "tier": 3, "psy": false, "aid": false}, {"n": 62, "title": "Современные информационные войны", "kostyak": ["Информационная война — совокупность действий по воздействию на информационную сферу противостоящей стороны при одновременной защите собственной. Понятие используется и в военном, и в широком социально-политическом смысле.", "Принято выделять два контура. Информационно-технический — воздействие на системы: кибератаки, вывод из строя инфраструктуры, перехват данных. И информационно-психологический — воздействие на сознание людей: на их представления, оценки, поведение.", "Объект воздействия во втором контуре — массовое сознание и общественное мнение. Цель — изменение поведения аудитории без применения силы.", "Методы, которые описывает наука: дезинформация, фальсификация, манипулирование, подмена понятий, дробление информации, навязывание повестки, использование эмоционально заряженных образов, фейковые сообщения.", "Механизм работает на когнитивных особенностях человека: эффект первичности, склонность к подтверждению своей точки зрения, доверие к многократно повторённому сообщению, эмоция как ускоритель распространения информации.", "Современная специфика — соцсети и алгоритмы. Скорость распространения выросла, порог входа снизился, появились информационные пузыри и эхо-камеры, а также технологии синтеза изображения и голоса, дипфейки.", "Защита строится на двух уровнях: государственном — правовое регулирование, защита критической инфраструктуры; и личностном — медиаграмотность, критическое мышление, привычка проверять источник.", "Академическая рамка тут важна: разбираю механизмы и методы, не оценивая действия конкретных сторон. Поворот в сторону школы. Медиаграмотность как задача образования: умение отличать факт от мнения, проверять первоисточник, распознавать манипулятивные приёмы в тексте и видео. Это работа классного руководителя, учителя обществознания и ОБЗР, а также психолога."], "terms": ["информационное противоборство", "информационно-психологическое воздействие", "массовое сознание", "дезинформация", "манипулирование", "фейк", "дипфейк", "эхо-камера", "медиаграмотность", "критическое мышление", "когнитивные искажения"], "follow": [{"q": "Чем информационная война отличается от обычной пропаганды?", "a": "Пропаганда — один из методов. Информационная война шире: включает технический контур и ведётся системно, с расчётом на конкретный управленческий результат."}, {"q": "Как научить подростка распознавать фейк?", "a": "Через простой алгоритм: кто источник, есть ли подтверждение в независимых источниках, какую эмоцию текст вызывает и зачем, есть ли подмена причинно-следственной связи."}], "notes": [{"label": "Заходит от психологии", "text": "манипуляция сознанием — механизмы внушения, конформизма, социального доказательства. Работы по психологии пропаганды и по когнитивным искажениям тут прямо в тему. Отдельно — психология слухов и паники: как эмоционально заряженное сообщение распространяется быстрее нейтрального."}], "block": "Социальные угрозы", "bk": "soc", "tier": 3, "psy": false, "aid": false}, {"n": 25, "title": "Инновационные подходы к проведению уроков и их педагогическая ценность", "kostyak": ["Под инновационными подходами понимаю не новизну ради новизны, а те способы организации урока, которые меняют позицию ученика с воспринимающей на действующую. Формальный признак инновации — воспроизводимость и измеримый прирост результата.", "Первая группа — проектное обучение. Корни у него старые: Дьюи и метод проектов Килпатрика. На ОБиЗР это проект по безопасности школьного маршрута, памятка для родителей, карта рисков кабинета.", "Вторая — проблемное и кейсовое обучение. Ситуационная задача с неполными данными: класс разбирает реальный случай ЧС, ищет точку, где решение ещё меняло исход. Здесь формируется способность действовать при дефиците информации.", "Третья — интерактивные и имитационные технологии: деловая и ролевая игра, тренинг, симуляция, штабная тренировка, отработка эвакуации. Для нашего предмета это самая органичная группа, потому что моделирует реальную ситуацию без реального риска.", "Четвёртая — цифровые форматы: перевёрнутый класс, когда теория изучается дома, а урок отдан отработке; виртуальные тренажёры и VR-симуляции; геймификация и образовательный квест.", "Педагогическая ценность в общем виде: рост учебной мотивации, перенос знания в действие, формирование метапредметных результатов, опыт совместной работы и ответственности за решение.", "Возрастная привязка — важная часть вопроса. В подростковом возрасте, 5–9 классы, ведущей становится общение со сверстниками, поэтому работают групповые, игровые и соревновательные форматы, где есть роль и признание группы.", "В старших классах, 10–11, ведущей становится учебно-профессиональная деятельность и самоопределение, поэтому лучше идут проектные и исследовательские форматы, кейсы, дискуссии, профориентационная линия — военная служба, спасательные профессии.", "Ограничение назову сам: инновационные формы дороже по времени и требуют подготовки. Их не ставят на каждый урок, они дополняют базовое обучение алгоритмам, а не вытесняют его."], "terms": ["инновация и воспроизводимость технологии", "метод проектов", "Дьюи и Килпатрик", "кейс-метод и ситуационная задача", "деловая и ролевая игра", "имитационное моделирование", "перевёрнутый класс", "геймификация и образовательный квест", "интерактивные технологии", "ведущая деятельность возраста", "субъектная позиция ученика"], "follow": [{"q": "Любая ли новая форма — инновация?", "a": "Нет. Инновация предполагает изменение результата и возможность повторить это другим учителем. Разовая находка — приём, а не инновация."}, {"q": "Чем деловая игра отличается от ролевой?", "a": "В деловой моделируется профессиональная деятельность и система отношений с принятием решений, в ролевой акцент на исполнении роли и взаимодействии участников."}], "notes": [{"label": "Заходит от психологии", "text": "обоснование через возрастную периодизацию Эльконина — это сильный ход и прямое попадание в формулировку вопроса про «обучающихся разного возраста». Ведущая деятельность подростка — интимно-личностное общение, отсюда групповые форматы; у старшего школьника — учебно-профессиональная, отсюда проекты и профориентация. Плюс можно добавить про эффект переживания и эмоциональной вовлечённости: то, что прожито в игровой ситуации, воспроизводится в реальной лучше, чем выученное."}], "block": "Методика", "bk": "met", "tier": 3, "psy": false, "aid": false}, {"n": 31, "title": "Учебники и учебные пособия по ОБиЗР/ОБЖ", "kostyak": ["Начну с механизма, а не со списка. В школе разрешено использовать не любой учебник, а тот, что включён в федеральный перечень учебников, утверждаемый Министерством просвещения.", "Попадание в перечень означает, что учебник прошёл экспертизу — научную, педагогическую, общественную, а для ряда предметов и этнокультурную — и соответствует ФГОС. Это и есть современный аналог грифа.", "Перечень регулярно обновляется, поэтому конкретные позиции нужно смотреть в актуальной редакции. Называть строки перечня по памяти я бы не стал — это как раз тот случай, когда точность важнее уверенности.", "Отдельно замечу: наряду с учебниками из перечня допускаются учебные пособия от организаций, включённых в утверждённый министерством список, — это методички, рабочие тетради, атласы.", "По прежнему курсу ОБЖ школы много лет работали с несколькими устоявшимися линейками: линия Смирнова и Хренникова в издательстве «Просвещение», линия Виноградовой и Смирнова, линия Латчука и Маркова, работы Фролова, для старшей школы — учебники Кима и Горского.", "С переходом на ОБиЗР в 2024 году содержание изменилось, появился военный блок, и линейки пересматривались: часть учебников переработана под новое название и новую федеральную рабочую программу, к ним выпущены методические пособия.", "Есть также линия на единые государственные учебники по ряду предметов — она задаёт общий вектор, и для предметов с идеологической и оборонной составляющей это обсуждается особенно активно.", "Для методической подготовки самого учителя список другой: по теории и методике обучения безопасности жизнедеятельности это работы Суворовой и Горичевой, Акимовой и Лутовиной, по безопасности образовательной среды — Кисляков и Петров, по культуре безопасности — Гафнер.", "Критерии выбора учебника учителем: соответствие федеральной рабочей программе, наличие в перечне, методический аппарат — задания разного уровня, практикумы, алгоритмы, и наличие цифрового сопровождения."], "terms": ["федеральный перечень учебников", "экспертиза учебника — научная", "педагогическая", "общественная", "учебные пособия организаций из перечня министерства", "методический аппарат учебника", "учебно-методический комплекс", "линия учебников и её завершённость", "Смирнов и Хренников", "Ким и Горский", "Суворова", "Акимова и Лутовина как методическая литература для педагога", "Кисляков и Петров по безопасности образовательной среды"], "follow": [{"q": "Можно ли учить по учебнику не из перечня?", "a": "В качестве основного учебника — нет. Как дополнительный материал педагог вправе использовать иные источники под свою методическую ответственность."}, {"q": "Что входит в УМК?", "a": "Учебник, рабочая программа, методическое пособие для учителя, рабочая тетрадь, дидактические материалы, электронное приложение."}], "notes": [{"label": "Заходит от психологии", "text": "можно оценить учебник с точки зрения читателя-подростка: доступность текста, объём абзаца, наличие визуальных опор, соответствие возрастным особенностям восприятия и памяти. Учебник по ОБиЗР должен работать как источник алгоритмов, к которому возвращаются, а значит его структура должна поддерживать быстрый поиск."}], "block": "Методика", "bk": "met", "tier": 3, "psy": false, "aid": false}, {"n": 32, "title": "Требования к организации самостоятельной работы учащихся по ОБиЗР/ОБЖ", "kostyak": ["Самостоятельная работа — деятельность ученика по заданию и под руководством учителя, но без его непосредственного участия. Разработку этой темы в отечественной дидактике связывают прежде всего с Пидкасистым и Есиповым.", "Виды по месту: классная и домашняя. По дидактической цели: на усвоение нового, на закрепление, на применение, на контроль. По уровню самостоятельности: воспроизводящая, реконструктивная, вариативная, творческая — это восходящая шкала.", "Первое требование — целенаправленность. Ученик должен понимать, зачем он это делает и как это связано с темой. Задание «прочитать параграф» этому не отвечает.", "Второе — посильность и дифференциация. Задание в зоне ближайшего развития: слишком лёгкое не развивает, слишком трудное вызывает отказ. Отсюда разноуровневые варианты.", "Третье — чёткая инструкция и известные критерии оценки. Ученик заранее знает, что считается выполненным.", "Четвёртое — обучение самим способам работы. Нельзя требовать анализа источника, не научив анализировать источник. Нужны памятки, алгоритмы, образцы выполнения.", "Пятое — обязательная проверка и обратная связь. Непроверенная самостоятельная работа обесценивает следующую.", "Шестое — нарастание самостоятельности от класса к классу и разумное дозирование по времени с учётом санитарных норм на домашнее задание.", "Специфика ОБиЗР: значительная часть самостоятельной работы должна быть практико-ориентированной и связанной с собственной жизнью ученика. Примеры заданий: составить план эвакуации своей квартиры, собрать тревожный чемоданчик и обосновать состав, проверить дом на пожарные риски по чек-листу, разобрать реальный новостной случай ЧС, проанализировать сообщение из соцсети на достоверность.", "Отдельно — задания с семьёй: маршрут безопасности, место встречи семьи при эвакуации. Это переносит результат из школы в реальную жизнь, что для нашего предмета и есть цель."], "terms": ["самостоятельная работа как вид познавательной деятельности", "Пидкасистый", "воспроизводящая", "реконструктивная", "вариативная", "творческая работа", "дифференциация заданий", "алгоритм и памятка", "инструктирование", "самоконтроль и самооценка", "практико-ориентированное задание", "дозирование домашнего задания", "обратная связь"], "follow": [{"q": "Чем самостоятельная работа отличается от домашнего задания?", "a": "Домашняя работа — частный случай по месту выполнения. Самостоятельная работа может проходить и на уроке, и это её основная развивающая форма."}, {"q": "Как проверять творческие задания?", "a": "По заранее объявленным критериям, лучше в формате защиты или взаимооценки по чек-листу, чтобы работал самоконтроль."}], "notes": [{"label": "Заходит от психологии", "text": "тут прямая опора на зону ближайшего развития при подборе трудности задания, на поэтапное формирование умственных действий Гальперина в части ориентировочной основы — сначала полная схема действия, затем свёртывание, и на саморегуляцию учебной деятельности. Уместно сказать, что самостоятельная работа формирует не только знания, но и волевую регуляцию, и что для подростка мотивирующей оказывается личная значимость задания, а не его учебная необходимость."}], "block": "Методика", "bk": "met", "tier": 3, "psy": false, "aid": false}, {"n": 41, "title": "Методика использования ИКТ в обучении ОБиЗР/ОБЖ", "kostyak": ["Сразу зафиксирую позицию: информационно-коммуникационные технологии — средство обучения, а не цель. Методическая ошибка — заменять деятельность ученика показом красивой презентации.", "Дидактические функции ИКТ на нашем предмете: визуализация процессов, которые нельзя показать вживую; моделирование опасных ситуаций без риска; тренаж и отработка алгоритмов; контроль и самопроверка; организация проектной работы.", "Первая группа средств — демонстрационные: презентация, видеофрагмент, инфографика, анимация развития пожара или распространения облака заражения. Здесь важен принцип: короткий фрагмент под конкретную задачу, а не фильм на весь урок.", "Вторая — интерактивные и тренажёрные: виртуальные симуляторы эвакуации, тренажёры сердечно-лёгочной реанимации с обратной связью, VR-сценарии. Их ценность в том, что ученик получает опыт действия в ситуации, которую в школе не воспроизвести.", "Третья — контролирующие: онлайн-тесты с мгновенной обратной связью, интерактивные квизы, электронные чек-листы для практического зачёта.", "Четвёртая — информационные ресурсы: материалы МЧС, официальные памятки, статистика, картографические сервисы, ресурсы федеральной образовательной платформы.", "Отдельная линия, специфичная для предмета: ИКТ здесь не только инструмент, но и объект изучения. Модуль информационной безопасности — цифровая гигиена, распознавание фейков и вовлечения в деструктивные сообщества, защита персональных данных, кибербуллинг, мошенничество.", "Методические требования: соответствие цели урока, дозирование экранного времени по санитарным нормам, смена видов деятельности, проверка достоверности источника, доступность материала для всех учеников.", "И ограничение, которое стоит назвать самому: симулятор не заменяет отработку руками. Первую помощь нельзя освоить по видео, нужен манекен и физическое действие."], "terms": ["ИКТ как средство обучения", "цифровая образовательная среда", "принцип наглядности и его цифровое воплощение", "виртуальный тренажёр и симуляция", "VR-технологии в обучении безопасности", "интерактивная доска", "электронные образовательные ресурсы", "перевёрнутый класс", "цифровая гигиена и медиаграмотность", "санитарные нормы экранного времени", "Роберт и теория информатизации образования"], "follow": [{"q": "Как оценить эффективность ИКТ на уроке?", "a": "По достижению цели урока, а не по факту применения техники. Если тот же результат достигается быстрее без компьютера — техника избыточна."}, {"q": "Какие риски у цифровых средств на ОБиЗР?", "a": "Иллюзия компетентности: ученик прошёл симулятор и считает, что умеет. Нужен обязательный практический зачёт живьём."}], "notes": [{"label": "Заходит от психологии", "text": "сильный ход — говорить о когнитивной нагрузке: перегруженный слайд с текстом и анимацией одновременно ухудшает усвоение, потому что конкурируют каналы восприятия. Отсюда правило одного смысла на слайд. Плюс тема клипового восприятия у подростков, произвольного внимания и его удержания, и мотивирующего эффекта немедленной обратной связи в тренажёре."}], "block": "Методика", "bk": "met", "tier": 3, "psy": false, "aid": false}, {"n": 42, "title": "Интеграция ОБиЗР/ОБЖ с другими образовательными областями", "kostyak": ["Основание для разговора — принцип межпредметных связей, который в отечественной дидактике разрабатывала Максимова. Он снимает разорванность знаний и позволяет ученику увидеть один объект с разных сторон.", "Для ОБиЗР интеграция не дополнение, а условие: предмет по природе междисциплинарный, он собирает материал из естественных и социальных наук вокруг задачи сохранения жизни.", "Биология: организм и его реакции — кровообращение и дыхание как основа первой помощи, действие ядов, инфекционные заболевания и пути передачи, иммунитет и вакцинация, влияние вредных веществ на организм.", "Экология: качество среды и здоровье, антропогенное воздействие, загрязнение воды и воздуха, глобальные проблемы, экологический риск и понятие предельно допустимой концентрации.", "Химия: свойства аварийно опасных химических веществ, хлор и аммиак и правильные действия при их выбросе, горение и условия его прекращения, продукты горения и отравление угарным газом, бытовая химия.", "География: районирование опасных природных явлений — сейсмические зоны, паводки, лавины, карта рисков региона, ориентирование на местности и автономное существование, климат и его связь с типами ЧС.", "История: опыт войн и оборонной подготовки, история гражданской обороны в стране, крупные техногенные катастрофы и извлечённые уроки, воинские традиции и подвиг — материал для военного модуля.", "Обществознание: право и правопорядок, обязанность защиты Отечества, правовые последствия действий несовершеннолетних, терроризм и экстремизм как социальные явления, национальная безопасность, информационное общество и его риски.", "Формы интеграции на практике: интегрированный урок с учителем-предметником, единая проектная задача, предметная неделя безопасности, согласование календарно-тематических планов, чтобы тема отравлений на ОБиЗР шла рядом с соответствующей темой химии.", "Методическая тонкость: интеграция требует не смешения содержания, а согласования логики. Иначе получается урок, где два учителя рассказывают параллельно и ученик не понимает, что здесь главное."], "terms": ["межпредметные связи и Максимова", "интегрированный урок", "метапредметность", "целостная картина мира", "перенос знаний", "аварийно опасные химические вещества", "предельно допустимая концентрация", "районирование природных рисков", "согласование календарно-тематических планов", "междисциплинарный характер предмета"], "follow": [{"q": "Чем интеграция отличается от межпредметных связей?", "a": "Межпредметные связи — эпизодическое обращение к материалу другого предмета внутри своего урока. Интеграция — объединение содержания вокруг общего объекта, вплоть до совместного урока или общего курса."}, {"q": "Пример интегрированного урока по ОБиЗР?", "a": "Тема отравления угарным газом вместе с химией: механизм связывания гемоглобина, признаки отравления, порядок первой помощи и профилактика. Или тема паводков вместе с географией: где, почему и как действовать."}], "notes": [{"label": "Заходит от психологии", "text": "уместно сказать про перенос знания и обобщение — знание, закреплённое только в одном предметном контексте, не переносится в другой, и межпредметные связи как раз обеспечивают обобщение способа действия. Плюс про формирование целостной картины мира и системного мышления как возрастную задачу подростка."}], "block": "Методика", "bk": "met", "tier": 3, "psy": false, "aid": false}, {"n": 29, "title": "Причины и факторы неотложных состояний. Виды неотложных состояний", "kostyak": ["Начну с определения: неотложное состояние — это внезапное нарушение работы организма, при котором без быстрой помощи человек погибнет или получит стойкое повреждение здоровья. Ключевое слово — фактор времени.", "Причины делю на две большие группы: внешние и внутренние. Внешние — травмы, ожоги, отморожения, отравления, поражение электрическим током, утопление, укусы. Внутренние — обострение имеющихся болезней: инфаркт, инсульт, приступ астмы, гипогликемия у диабетика, эпилептический приступ, анафилаксия.", "Отдельно назову факторы, которые повышают риск в школе: физическая нагрузка на уроке физкультуры, жара и духота в кабинете, конфликтная ситуация как стрессовый триггер, доступ к бытовой химии в лаборантской, поведение самих детей на переменах.", "По механизму развития неотложные состояния сводятся к нескольким угрозам жизни: нарушение сознания, нарушение дыхания, нарушение кровообращения, массивная кровопотеря. На этом построен весь алгоритм осмотра пострадавшего.", "Для оказывающего первую помощь работает не медицинский диагноз, а перечень состояний из приказа Минздрава. Их восемь классических: отсутствие сознания; остановка дыхания и кровообращения; наружные кровотечения; инородные тела верхних дыхательных путей; травмы различных областей тела; ожоги и действие высокой температуры; отморожения и действие низкой температуры; отравления.", "Подчеркну разницу: врач ставит диагноз, а человек без медицинского образования распознаёт признаки состояния из этого перечня и выполняет мероприятия из другого перечня. Дальше начинается медицинская помощь, и это уже не наша зона.", "Закончу тем, что для педагога это означает: заранее знать, у кого из детей эпилепсия, диабет, астма или пищевая аллергия. Это профилактика неотложного состояния, а не его лечение."], "terms": ["неотложное состояние", "фактор времени", "внешние и внутренние причины", "угрожающие жизни состояния", "перечень состояний", "при которых оказывается первая помощь", "распознавание признаков", "а не постановка диагноза", "анафилаксия", "гипогликемия", "предрасполагающие факторы", "профилактика на уровне образовательной организации"], "follow": [{"q": "Чем неотложное состояние отличается от экстренного?", "a": "Экстренная форма помощи оказывается при явной угрозе жизни здесь и сейчас, неотложная — когда явной угрозы жизни нет, но помощь нужна быстро. Это градация из закона об охране здоровья, она относится к медицинской помощи; для первой помощи такого деления нет."}, {"q": "Кто в школе обязан оказывать первую помощь?", "a": "Педагогические работники — по закону об образовании, это прямо прописано в их обязанностях. Плюс любой гражданин имеет право её оказать, и закон это право защищает."}], "notes": [], "block": "Первая помощь", "bk": "pp", "tier": 3, "psy": false, "aid": true}, {"n": 34, "title": "Первая помощь при ожогах и отморожениях", "kostyak": ["Оба состояния — из перечня приказа: «ожоги, эффекты воздействия высокой температуры и теплового излучения» и «отморожение и другие эффекты воздействия низких температур». Логика похожая: сначала прекратить действие фактора, потом всё остальное.", "Ожоги. По причине они бывают термические, химические, электрические и лучевые. По глубине — четыре степени: покраснение и боль; пузыри с прозрачным содержимым; поражение всей толщи кожи; обугливание с повреждением мышц и кости.", "Площадь оцениваю правилом девяток: голова и шея — девять процентов, каждая рука — девять, каждая нога — восемнадцать, передняя и задняя поверхность туловища — по восемнадцать, промежность — один. Небольшие участки удобнее считать правилом ладони: ладонь пострадавшего — примерно один процент его поверхности тела.", "Порядок помощи: прекратить действие тепла, снять с обожжённой зоны кольца и часы, охлаждать проточной прохладной водой пятнадцать–двадцать минут, наложить сухую чистую повязку, дать обезболивающее, если человек в сознании и препарат его собственный, обеспечить тёплое питьё при обширном ожоге.", "Чего делать нельзя, назову прямо: не отрывать прилипшую одежду, не вскрывать пузыри, не смазывать маслом, кремом, сметаной и мочой, не прикладывать лёд напрямую. Масло держит тепло в тканях и углубляет ожог.", "Обширный ожог опасен ожоговым шоком — это уже угроза жизни, здесь вызов скорой не обсуждается. Отдельно назову ожог дыхательных путей: копоть вокруг носа и рта, осипший голос, кашель. Такого человека везут в больницу даже при небольшой площади кожного ожога.", "Отморожения. Тоже четыре степени, но глубину в первые часы определить невозможно — это дореактивный период, когда всё выглядит легче, чем есть. Признаки: бледность, потеря чувствительности, чувство одеревенения.", "Помощь: убрать с холода, снять мокрое, наложить теплоизолирующую повязку, дать тёплое питьё, согревать организм изнутри и в целом. Растирать снегом и шерстью нельзя — травмируешь кожу и внесёшь инфекцию. Резко отогревать горячей водой и растирать спиртом тоже нельзя.", "Общее переохлаждение опаснее местного отморожения: при температуре тела ниже тридцати пяти градусов появляется сонливость и спутанность, а такого человека нельзя резко двигать и активно растирать — есть риск нарушения ритма сердца."], "terms": ["термический", "химический", "электрический и лучевой ожог", "четыре степени", "правило девяток и правило ладони", "ожоговый шок", "ожог дыхательных путей", "асептическая сухая повязка", "дореактивный и реактивный период отморожения", "теплоизолирующая повязка", "общее переохлаждение (гипотермия)", "согревание изнутри"], "follow": [{"q": "Химический ожог — что первым?", "a": "Смыть вещество большой струёй проточной воды не меньше пятнадцати–двадцати минут. Нейтрализовать кислоту щёлочью и наоборот нельзя: реакция даёт тепло и добавляет термический ожог. Исключение — негашёная известь, её сначала убирают сухой тканью."}, {"q": "Почему нельзя растирать отмороженную руку?", "a": "Кожа при отморожении хрупкая, растирание её повреждает и открывает ворота инфекции. Плюс холодная кровь из конечности резко уходит к сердцу, и это опасно."}], "notes": [], "block": "Первая помощь", "bk": "pp", "tier": 3, "psy": false, "aid": true}, {"n": 37, "title": "Первая помощь при отравлении угарным газом", "kostyak": ["Угарный газ — оксид углерода, вещество без цвета, вкуса и запаха. Именно поэтому человек не замечает отравления и часто теряет сознание раньше, чем понимает, что происходит.", "Механизм назову обязательно: угарный газ связывается с гемоглобином в сотни раз охотнее кислорода и образует карбоксигемоглобин. Кровь перестаёт переносить кислород, развивается гемическая гипоксия — крови много, а кислорода в ней нет.", "Типичные ситуации: пожар и задымление, неисправная печь или закрытая заслонка, работающий двигатель в гараже, газовая колонка при плохой тяге, мангал в закрытом помещении.", "Признаки по нарастанию: головная боль в висках и во лбу, шум в ушах, головокружение, тошнота, мышечная слабость — человек всё понимает, но не может встать и выйти. Дальше спутанность сознания, потеря сознания, судороги, остановка дыхания. Розовато-красный цвет кожи описывают как классический признак, но на практике он встречается не всегда.", "Первая помощь начинается с безопасности спасателя. Заходить в задымлённое помещение без защиты органов дыхания нельзя — так появляется второй пострадавший. Если возможно, вызываю профессионалов, открываю окна и двери, выключаю источник.", "Дальше: вынести пострадавшего на свежий воздух, расстегнуть одежду, обеспечить приток воздуха, вызвать скорую. Если человек без сознания, но дышит — устойчивое боковое положение и контроль дыхания. Если дыхания нет — сердечно-лёгочная реанимация.", "Настоящее лечение — кислород, поэтому скорая нужна в любом случае, даже если человек «пришёл в себя и говорит, что нормально». Отравление угарным газом даёт отсроченные неврологические осложнения через дни и недели.", "Полезная деталь, которая показывает, что человек в теме: пульсоксиметр при отравлении угарным газом показывает нормальные цифры, потому что не отличает карбоксигемоглобин от оксигемоглобина. Ориентироваться на него нельзя."], "terms": ["оксид углерода", "карбоксигемоглобин", "сродство к гемоглобину", "гемическая гипоксия", "безопасность спасателя", "вынос из очага", "свежий воздух и кислородотерапия", "отсроченные неврологические осложнения", "ложно нормальная сатурация на пульсоксиметре", "обязательная госпитализация"], "follow": [{"q": "Нашатырный спирт помогает?", "a": "Он может ненадолго привести в чувство, но отравление не лечит и в перечень мероприятий первой помощи не входит. Работает только вынос на воздух и кислород."}, {"q": "Почему при пожаре нужно двигаться пригнувшись?", "a": "Дым и горячие газы поднимаются вверх, у пола остаётся более пригодный для дыхания слой воздуха. Плюс дышать через влажную ткань."}], "notes": [], "block": "Первая помощь", "bk": "pp", "tier": 3, "psy": false, "aid": true}, {"n": 38, "title": "Первая помощь при пищевых отравлениях", "kostyak": ["Разделю понятия. Пищевая токсикоинфекция — отравление пищей, в которой размножились микробы и накопились их токсины. Отдельно стоят отравления ядовитыми грибами и растениями и отравления химическими веществами, попавшими в еду.", "Для школы это тема столовой, продлёнки, походов и «принёс из дома в жару». Классические причины — нарушение условий хранения, кремовые изделия, салаты с майонезом, яйца и молочное, немытые овощи.", "Признаки появляются через несколько часов после еды: тошнота, повторная рвота, боль в животе, понос, слабость, температура. Опасность — не сами симптомы, а обезвоживание, особенно у детей.", "Тревожные признаки, при которых скорая обязательна: многократная рвота, кровь в стуле, температура выше тридцати восьми с половиной, сухой язык и отсутствие мочи, спутанность сознания, отравление у ребёнка или пожилого, групповое заболевание в организации.", "Помощь взрослому в сознании: промывание желудка «ресторанным методом» — выпить несколько стаканов воды комнатной температуры и вызвать рвоту, повторить до чистых вод. Затем энтеросорбент и обязательно дробное выпаивание — регидратационный раствор или вода мелкими глотками часто.", "Чего не делаю: не вызываю рвоту у человека без сознания, у маленького ребёнка, при отравлении кислотой, щёлочью или нефтепродуктами. Не даю противодиарейные и обезболивающие — они смазывают картину, а при аппендиците или кишечной инфекции это опасно.", "Отдельно назову ботулизм, потому что он смертелен и выглядит иначе: домашние консервы, грибы, вяленая рыба, а признаки не кишечные, а неврологические — двоение в глазах, опущенное веко, сухость во рту, трудности с глотанием и речью. Здесь счёт на часы, нужна противоботулиническая сыворотка.", "Для образовательной организации добавлю профессиональный момент: при групповом отравлении сохраняют остатки пищи и суточные пробы, изолируют заболевших, сообщают руководителю и в Роспотребнадзор. Это уже противоэпидемические действия, но педагог должен знать порядок."], "terms": ["пищевая токсикоинфекция", "бактериальный токсин", "инкубационный период", "обезвоживание (дегидратация)", "промывание желудка «ресторанным методом»", "энтеросорбент", "оральная регидратация", "ботулизм и его неврологические признаки", "суточная проба", "групповая заболеваемость и уведомление Роспотребнадзора"], "follow": [{"q": "Марганцовкой промывать желудок можно?", "a": "Не рекомендуется: нерастворённые кристаллы дают химический ожог слизистой. Чистой воды достаточно."}, {"q": "Отравление грибами — что особенного?", "a": "Скрытый период при бледной поганке доходит до суток, за это время самочувствие может улучшиться, и человек расслабляется. Поэтому при любом подозрении на грибы — скорая сразу, независимо от того, как он себя чувствует."}], "notes": [], "block": "Первая помощь", "bk": "pp", "tier": 3, "psy": false, "aid": true}, {"n": 39, "title": "Синдром длительного раздавливания. Укусы змей и ядовитых насекомых", "kostyak": ["Синдром длительного сдавления, он же краш-синдром, развивается когда часть тела была придавлена несколько часов, а потом её освободили. Возникает при обрушениях зданий, землетрясениях, ДТП, завалах.", "Механизм в двух фразах: в сдавленных мышцах нарушается кровоток и накапливаются продукты распада — миоглобин, калий, кислые продукты. Когда конечность освобождают, всё это разом уходит в общий кровоток. Развивается токсемия, миоглобин забивает почечные канальцы, начинается острая почечная недостаточность. Отсюда парадокс: пока человек придавлен, он может быть в сознании и разговаривать, а погибает после освобождения.", "Формы по тяжести определяются временем сдавления и объёмом тканей: лёгкая — примерно до четырёх часов, средней тяжести — четыре–шесть, тяжёлая — шесть–восемь, крайне тяжёлая — свыше восьми часов или сдавление обеих конечностей. В течении выделяют три периода: ранний, промежуточный с почечной недостаточностью, поздний.", "Первая помощь до освобождения: вызвать спасателей и скорую, обеспечить доступ воздуха, дать обильное щелочное питьё, если человек в сознании и нет травмы живота, согреть, поддерживать контакт разговором.", "Здесь важно честно оговорить спорный момент. Классические учебники требуют наложить жгут выше места сдавления до освобождения конечности. Современные рекомендации от этого отходят: жгут накладывают, только если есть артериальное кровотечение или конечность явно нежизнеспособна. В остальных случаях сразу после освобождения делают тугое бинтование от периферии к центру, охлаждают конечность, обездвиживают её как при переломе. Я бы на экзамене назвал оба подхода и сказал, что общее правило простое: снимать сдавление лучше в присутствии медиков, потому что человеку в этот момент нужна инфузионная терапия.", "Укусы змей. В России опасны гадюки. Признаки: две точечные ранки, быстро нарастающий отёк, боль, багровые пятна, слабость, тошнота.", "Помощь: покой и полная неподвижность, укушенную конечность обездвижить как при переломе и держать ниже уровня сердца, снять кольца и часы до отёка, наложить нетугую повязку, дать обильное питьё, срочно везти в больницу — там сыворотка.", "Чего не делать, назову списком, потому что тут все ошибаются: не разрезать ранку, не прижигать, не накладывать жгут, не давать алкоголь. Отсасывание яда ртом официально не рекомендуется — эффективность сомнительна, а риск для спасателя реален.", "Укусы насекомых. Одиночный укус пчелы или осы — вынуть жало скользящим движением, приложить холод, наблюдать. Главная опасность не яд, а анафилактическая реакция: отёк лица и языка, осиплость, затруднённое дыхание, сыпь, падение давления. Если у человека есть автоинъектор с адреналином — помочь его применить, это входит в помощь при приёме собственных препаратов. Дальше — скорая. Укусы в язык и шею опасны отёком независимо от аллергии."], "terms": ["синдром длительного сдавления (краш-синдром)", "ишемия и токсемия", "миоглобин", "острая почечная недостаточность", "периоды течения", "тугое бинтование от периферии", "транспортная иммобилизация", "антитоксическая противозмеиная сыворотка", "анафилактический шок", "автоинъектор с адреналином"], "follow": [{"q": "Почему при краш-синдроме нельзя резко освобождать конечность?", "a": "Потому что залповый выброс калия и миоглобина в кровь может дать остановку сердца и почечную недостаточность. Освобождение лучше синхронизировать с началом инфузии, а это уже медицинская помощь."}, {"q": "Как отличить укус гадюки от ужа?", "a": "У гадюки — две точки от ядовитых зубов и быстрый отёк. Уж оставляет ряд мелких царапин, отёка и общей реакции не даёт. Но на глаз определять змею не стоит: везти к врачу нужно в любом случае."}], "notes": [], "block": "Первая помощь", "bk": "pp", "tier": 3, "psy": false, "aid": true}, {"n": 40, "title": "Первая помощь при утоплении и электротравме", "kostyak": ["Оба состояния объединяет одно: спасатель легко становится вторым пострадавшим. Поэтому начинаю с оценки обстановки, и это не формальность.", "Утопление. Различают три вида. Истинное, «синее» — вода попадает в лёгкие, кожа синюшная, изо рта пена. Асфиксическое, «сухое» — от спазма голосовой щели вода в лёгкие почти не проходит. Синкопальное — рефлекторная остановка сердца от холода или испуга, кожа бледная.", "Извлекать человека из воды без подготовки опасно. Сначала протягиваю предмет, бросаю плавучее, использую лодку. Вплавь — только если умеешь и подплываешь сзади.", "На берегу: проверяю сознание и дыхание. Время на «выливание воды» через колено тратить не нужно — это устаревший приём, и он отнимает минуты, которые решают.", "Особенность реанимации при утоплении назову обязательно: здесь причина остановки сердца — нехватка кислорода, поэтому начинают с пяти искусственных вдохов и только потом переходят к циклу тридцать на два.", "Дальше — согреть, снять мокрую одежду, укрыть. Даже если человек пришёл в себя, госпитализация нужна: через несколько часов возможен отёк лёгких. И помню про травму шейного отдела, если он нырял.", "Электротравма. Первым делом обесточить: выключить рубильник, вынуть вилку, отбросить провод сухим деревянным предметом. Голыми руками пострадавшего не трогать.", "При обрыве провода на улице работает шаговое напряжение — потенциал растекается по земле, и шаг между зонами разного напряжения даёт ток через тело. Выходить из опасной зоны нужно «гусиным шагом», не отрывая ступни друг от друга, и не бежать.", "У пострадавшего ищу метки тока — знаки входа и выхода, участки ожога. Ток вызывает фибрилляцию желудочков, поэтому основное мероприятие — сердечно-лёгочная реанимация и дефибриллятор, если он есть. Реанимировать при электротравме нужно долго и упорно, шансы здесь выше обычного.", "Даже при хорошем самочувствии человек после удара током едет в больницу: нарушения ритма появляются отсроченно."], "terms": ["истинное", "асфиксическое и синкопальное утопление", "аспирация воды", "отёк лёгких как отсроченное осложнение", "начинать с пяти искусственных вдохов", "травма шейного отдела при нырянии", "шаговое напряжение", "«гусиный шаг»", "метки тока", "фибрилляция желудочков", "обязательная госпитализация при электротравме"], "follow": [{"q": "Как долго реанимировать утонувшего в холодной воде?", "a": "Долго. Холод замедляет обмен и защищает мозг, известны случаи выживания после длительной остановки. Правило звучит так: пострадавший не считается погибшим, пока он не согрет."}, {"q": "Радиус опасной зоны при обрыве провода?", "a": "Ориентируются на восемь–десять метров, а при высоком напряжении — больше. Точную цифру лучше не называть: сказать «не менее восьми метров, уходить гусиным шагом» безопаснее."}], "notes": [], "block": "Первая помощь", "bk": "pp", "tier": 3, "psy": false, "aid": true}, {"n": 44, "title": "Первая помощь при радиационной аварии и поражении АХОВ", "kostyak": ["Сразу оговорю термин: «диагностика» на уровне первой помощи означает распознавание признаков поражения и понимание, что человеку угрожает. Диагноз ставит врач, а лучевую болезнь подтверждают дозиметрией и анализом крови.", "Радиационная авария. Поражающие факторы: внешнее облучение, попадание радиоактивных веществ внутрь с воздухом, водой и пищей, загрязнение кожи и одежды.", "Признаки первичной реакции на облучение: тошнота, рвота, слабость, головная боль, покраснение кожи и слизистых, повышение температуры. Практический ориентир — время до начала рвоты: чем раньше она началась, тем больше полученная доза. Дальше идёт скрытый период мнимого благополучия, и это опасно тем, что человек считает себя здоровым.", "Помощь в очаге: надеть средства защиты органов дыхания и кожи, вывести или вынести человека из зоны по направлению, указанному службами, снять загрязнённую одежду, провести частичную санитарную обработку — обмыть открытые участки, промыть глаза и рот.", "Про йодную профилактику скажу аккуратно: препараты стабильного йода принимают только по решению органов власти и только при выбросе радиоактивного йода, эффект максимален до контакта или в первые часы. Самостоятельно пить йод «на всякий случай» вредно.", "Противорвотные, радиопротекторы и всё остальное — уже медицинская помощь, к первой помощи это не относится.", "Аварийно химически опасные вещества. По действию их делят на удушающие, общеядовитые, нейротропные, раздражающие, а также вещества с кожно-нарывным действием.", "Практическая вещь, которую нужно назвать: хлор тяжелее воздуха и скапливается внизу, в подвалах и низинах — уходить надо на верхние этажи. Аммиак легче воздуха — уходить вниз. Хлор пахнет отбеливателем, вызывает резь в глазах и кашель; аммиак резко пахнет нашатырём, вызывает слезотечение и удушье.", "Порядок помощи одинаковый: защитить себя, вывести пострадавшего из зоны перпендикулярно направлению ветра, снять заражённую одежду, обильно промыть глаза и кожу водой, обеспечить покой и тепло, вызвать помощь.", "Отдельно подчеркну самое важное: при отравлении удушающими веществами возможен токсический отёк лёгких со скрытым периодом в несколько часов. Такого человека нельзя заставлять идти и напрягаться — только покой и транспортировка в положении лёжа или полусидя. Физическая нагрузка после отравления хлором может убить.", "Антидоты в первую помощь не входят, их вводит медицинский персонал."], "terms": ["распознавание признаков", "а не постановка диагноза", "первичная реакция на облучение", "время до начала рвоты как ориентир тяжести", "скрытый период мнимого благополучия", "частичная санитарная обработка", "йодная профилактика по решению органов власти", "аварийно химически опасное вещество", "удушающие и общеядовитые вещества", "токсический отёк лёгких", "выход из зоны перпендикулярно ветру"], "follow": [{"q": "Какая повязка при выходе из зоны заражения?", "a": "Влажная ватно-марлевая: при хлоре её смачивают слабым раствором питьевой соды, при аммиаке — слабым раствором лимонной или уксусной кислоты. Это временная мера, полноценную защиту даёт только противогаз."}, {"q": "Чем опасно облучение для педагога-организатора эвакуации?", "a": "Тем, что решения приходится принимать в условиях паники. Здесь работает информирование и чёткая короткая команда — люди в состоянии острой стрессовой реакции не воспринимают длинные объяснения."}], "notes": [], "block": "Первая помощь", "bk": "pp", "tier": 3, "psy": false, "aid": true}, {"n": 45, "title": "Первая помощь при катастрофах на пожаро- и взрывоопасных объектах", "kostyak": ["Особенность таких катастроф — комбинированные поражения. У одного человека сразу и ожоги, и механическая травма, и отравление продуктами горения, и баротравма от ударной волны. Поэтому осматривать нужно целиком, а не только то, что видно.", "Поражающие факторы назову по порядку: ударная волна, тепловое излучение и пламя, осколки и обломки конструкций, продукты горения, обрушение и последующее сдавление людей.", "Распознавание, что здесь ищем. Ожоги — оцениваю площадь правилом девяток и правилом ладони, глубину по степеням. Ожог дыхательных путей — копоть вокруг носа и рта, опалённые волосы в носу, осиплый голос, кашель, одышка. Отравление угарным газом — головная боль, спутанность, слабость.", "Взрывная травма: разрывы барабанных перепонок, кровь из уха, оглушённость, звон в ушах — характерный признак действия ударной волны. Баротравма лёгких — кровохарканье, одышка, боль в груди. Возможны внутренние повреждения при полном отсутствии наружных ран, это самое коварное.", "Порядок действий: сначала собственная безопасность и оценка угрозы повторного взрыва или обрушения, потом эвакуация из зоны, потом помощь. В зоне продолжающегося горения помощь не оказывают.", "По приоритетам: остановить наружное кровотечение, обеспечить проходимость дыхательных путей, при остановке дыхания — реанимация, затем ожоги и травмы, потом положение тела и согревание.", "Про ожоги повторю коротко: прекратить действие пламени, охладить водой пятнадцать–двадцать минут, сухая чистая повязка, тёплое питьё при обширном ожоге, не отрывать прилипшее, ничем не мазать.", "При большом числе пострадавших врачи применяют медицинскую сортировку — распределение по очерёдности помощи и эвакуации. Оговорю честно: сортировка относится к медицинской помощи, человек без медицинского образования её не проводит. Но принцип полезен: сначала подходят к тем, кто молчит, а не к тем, кто громче кричит.", "Придавленных обломками освобождают только со спасателями, потому что при длительном сдавлении развивается краш-синдром."], "terms": ["комбинированное поражение", "ударная волна", "баротравма лёгких и разрыв барабанных перепонок", "продукты горения", "ожог дыхательных путей", "правило девяток и правило ладони", "ожоговый шок", "медицинская сортировка как этап медицинской помощи", "безопасность спасателя и угроза повторного взрыва", "синдром длительного сдавления при разборе завала"], "follow": [{"q": "Почему пострадавший с ожогом дыхательных путей опаснее, чем выглядит?", "a": "Отёк гортани нарастает в течение часов и может полностью перекрыть дыхание. Внешне человек может выглядеть неплохо, поэтому его госпитализируют по факту признаков, не дожидаясь ухудшения."}, {"q": "Что первое при эвакуации из школы при пожаре?", "a": "Оповестить и вывести детей по плану эвакуации, пересчитать по списку, доложить о пропавших, встретить пожарных и передать информацию. Помощь пострадавшим оказывается уже за пределами опасной зоны."}], "notes": [], "block": "Первая помощь", "bk": "pp", "tier": 3, "psy": false, "aid": true}, {"n": 46, "title": "Первая помощь в очаге бактериологического заражения", "kostyak": ["Как и в предыдущих вопросах, оговорю термин: распознать биологическое поражение по внешним признакам первой помощью невозможно. Возбудителя определяют лабораторно — это называется индикация. Наша задача — заподозрить неладное и не превратиться в источник заражения.", "Очаг биологического заражения — территория с людьми, животными и объектами, подвергшимися воздействию болезнетворных микроорганизмов или токсинов. От химического очага он отличается тем, что поражение проявляется не сразу: есть инкубационный период от часов до недель.", "Что настораживает: массовое однотипное заболевание в короткий срок, необычная для местности инфекция, лихорадка и интоксикация у многих людей одновременно, массовая гибель животных, следы распыления неизвестного вещества.", "Общие признаки у пострадавших: высокая температура, озноб, головная боль, слабость, сыпь, рвота и понос, боль в мышцах. Конкретную болезнь по этим признакам не назовёшь, и не надо.", "К особо опасным инфекциям относят чуму, холеру, сибирскую язву, туляремию, натуральную оспу — их называют, чтобы показать масштаб последствий.", "Действия в очаге: надеть средства индивидуальной защиты, хотя бы маску и перчатки, не пить и не есть, не выходить за пределы очага, сообщить в скорую и экстренные службы, изолировать заболевшего в отдельном помещении, ограничить контакты, обеспечить покой и питьё.", "Помощь заболевшему в объёме первой помощи стандартная: контроль сознания и дыхания, положение тела, при отсутствии дыхания — реанимация, но с максимальной защитой спасателя. Искусственное дыхание здесь делают только через защитное устройство, а лучше ограничиться компрессиями.", "Дальше вступают противоэпидемические мероприятия, и их стоит назвать правильными словами: обсервация — усиленное наблюдение с ограничением выезда, карантин — полная изоляция очага. Плюс экстренная профилактика: неспецифическая антибиотиками широкого спектра до установления возбудителя и специфическая — вакцинами, сыворотками, бактериофагами после индикации. И дезинфекция, дезинсекция, дератизация.", "Закончу тем, что относится к школе: это соблюдение противоэпидемического режима, отстранение заболевших, информирование родителей, работа с паникой. Последнее — прямая зона психолога: в очаге инфекции люди боятся сильнее, чем требует реальная угроза, и паника сама становится поражающим фактором."], "terms": ["очаг биологического (бактериологического) заражения", "индикация возбудителя", "инкубационный период", "особо опасные инфекции", "средства индивидуальной защиты", "обсервация и карантин", "экстренная неспецифическая и специфическая профилактика", "бактериофаг", "дезинфекция", "дезинсекция", "дератизация", "противоэпидемический режим"], "follow": [{"q": "Чем карантин отличается от обсервации?", "a": "Обсервация — наблюдение с ограничениями, люди работают, но их проверяют и не выпускают из зоны. Карантин строже: полная изоляция территории с вооружённой охраной, запрет въезда и выезда. Карантин вводят при особо опасных инфекциях."}, {"q": "Кто принимает решение о карантине в школе?", "a": "Не школа сама. Решение принимается органами власти по предписанию санитарно-эпидемиологической службы, администрация организации его исполняет."}], "notes": [], "block": "Первая помощь", "bk": "pp", "tier": 3, "psy": false, "aid": true}];
const EXAM = new Date(2026, 6, 28, 15, 0);      // 28 июля 2026, 15:00
const KEY = "bez_progress_v1";

let done = new Set();
try { done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch (e) {} };

const TIERS = [
  { n: 1, name: "Каркас", note: "Держит всё остальное. Зная эти темы, можно говорить почти на любой вопрос." },
  { n: 2, name: "Основа", note: "Крупные темы, которые спрашивают чаще всего. Опираются на каркас." },
  { n: 3, name: "Детали", note: "Частные случаи и периферия. Если не успеваем — не успеваем именно здесь." }
];

let filter = "all";
const el = id => document.getElementById(id);
const plural = (n, a, b, c) => {
  const m = n % 100, d = n % 10;
  return m > 4 && m < 21 ? c : d === 1 ? a : d > 1 && d < 5 ? b : c;
};

function daysLeft() {
  const ms = EXAM - new Date();
  return ms <= 0 ? 0 : Math.ceil(ms / 864e5);
}

function refreshHeader() {
  const d = daysLeft(), left = 66 - done.size;
  el("cd").textContent = d === 0 ? "экзамен сегодня"
    : d + " " + plural(d, "день", "дня", "дней") + " до экзамена";

  const pct = Math.round(done.size / 66 * 100);
  el("bar").style.width = pct + "%";
  el("pct").textContent = pct + "%";
  el("cnt").textContent = done.size + " из 66";

  if (left === 0) {
    el("rate").innerHTML = "Всё пройдено";
    el("hint").textContent = "Осталось гонять вслух. Первую помощь повтори последней — алгоритмы забываются быстрее рассуждений.";
    el("queue").innerHTML = "";
    return;
  }
  // последний день оставляем на прогон, поэтому делим на d-1
  const studyDays = Math.max(1, d - 1);
  const per = Math.ceil(left / studyDays);
  el("rate").innerHTML = per + " <span>" + plural(per, "тема", "темы", "тем") + " в день</span>";
  el("hint").textContent = d <= 1
    ? "Последний день. Гони вслух по каркасу, детали уже не успеть."
    : "Осталось " + left + " " + plural(left, "тема", "темы", "тем") + " и " + studyDays + " " +
      plural(studyDays, "рабочий день", "рабочих дня", "рабочих дней") + ". Последний день — прогон вслух, без новых тем.";

  const q = TOPICS.filter(t => !done.has(t.n)).slice(0, per);
  el("queue").innerHTML = q.map(t => '<span class="qchip">' + t.n + "</span>").join("");
}

function visible() {
  if (filter === "left") return TOPICS.filter(t => !done.has(t.n));
  if (filter === "aid")  return TOPICS.filter(t => t.aid);
  if (filter === "psy")  return TOPICS.filter(t => t.psy);
  return TOPICS;
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function bodyHTML(t) {
  let h = '<div class="lbl">Костяк ответа</div><ol class="kost">' +
    t.kostyak.map(k => "<li>" + esc(k) + "</li>").join("") + "</ol>";
  if (t.notes.length) {
    h += '<div class="lbl">Куда развернуть</div>' + t.notes.map(n =>
      '<div class="note"><b>' + esc(n.label) + "</b>" + esc(n.text) + "</div>").join("");
  }
  if (t.terms.length) {
    h += '<div class="lbl">Обязательно произнести</div><div class="terms">' +
      t.terms.map(x => '<span class="term">' + esc(x) + "</span>").join("") + "</div>";
  }
  if (t.follow.length) {
    h += '<div class="lbl">Если спросят дальше</div>' + t.follow.map(f =>
      '<div class="fu"><q>' + esc(f.q) + "</q><div>" + esc(f.a) + "</div></div>").join("");
  }
  return h;
}

function render() {
  const vis = visible(), box = el("list");
  if (!vis.length) { box.innerHTML = '<div class="empty">Здесь пусто — всё пройдено.</div>'; refreshHeader(); return; }

  let h = "";
  for (const tier of TIERS) {
    const rows = vis.filter(t => t.tier === tier.n);
    if (!rows.length) continue;
    const left = rows.filter(t => !done.has(t.n)).length;
    h += '<div class="tier"><h3>' + tier.name + " · " + rows.length + " " +
      plural(rows.length, "тема", "темы", "тем") +
      (left ? " · осталось " + left : " · пройдено") +
      "</h3><p>" + tier.note + "</p></div>";
    for (const t of rows) {
      const isDone = done.has(t.n);
      h += '<div class="item" data-tier="' + t.tier + '" data-done="' + (isDone ? 1 : 0) + '" data-n="' + t.n + '">' +
        '<button class="head" aria-expanded="false"><span class="num">' + t.n + "</span>" +
        '<span class="ttl">' + esc(t.title) +
        '<span class="flags">' +
          (t.tier === 1 ? '<span class="flag f-core">каркас</span>' : "") +
          (t.aid ? '<span class="flag f-aid">первая помощь</span>' : "") +
          (t.psy ? '<span class="flag f-psy">его поле</span>' : "") +
          (t.alias_of ? '<span class="flag f-core">дубль ' + t.alias_of + "</span>" : "") +
        "</span></span>" +
        '<span class="tick">' + (isDone ? "✓" : "") + "</span></button>" +
        '<div class="body">' + bodyHTML(t) +
          '<button class="done-btn' + (isDone ? "" : " primary") + '" data-done-for="' + t.n + '">' +
          (isDone ? "Вернуть в работу" : "Проговорил вслух — готово") + "</button>" +
        "</div></div>";
    }
  }
  box.innerHTML = h;
  refreshHeader();
}

el("list").addEventListener("click", e => {
  const db = e.target.closest("[data-done-for]");
  if (db) {
    const n = +db.dataset.doneFor;
    done.has(n) ? done.delete(n) : done.add(n);
    save(); render(); return;
  }
  const head = e.target.closest(".head");
  if (head) {
    const item = head.closest(".item");
    const open = item.dataset.open === "1";
    item.dataset.open = open ? "0" : "1";
    head.setAttribute("aria-expanded", String(!open));
  }
});

const FBTN = { all: "fAll", left: "fLeft", aid: "fAid", psy: "fPsy" };
for (const [k, id] of Object.entries(FBTN)) {
  el(id).addEventListener("click", () => {
    filter = k;
    for (const [k2, id2] of Object.entries(FBTN)) el(id2).setAttribute("aria-pressed", String(k2 === k));
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
}

el("reset").addEventListener("click", () => {
  if (confirm("Сбросить все отметки? Прогресс по " + done.size + " темам будет удалён.")) {
    done = new Set(); save(); render();
  }
});

/* ── случайная тема ── */
let cur = null;
function pick() {
  const pool = TOPICS.filter(t => !done.has(t.n));
  const from = pool.length ? pool : TOPICS;
  cur = from[Math.floor(Math.random() * from.length)];
  el("dKick").textContent = "Вопрос " + cur.n + " · уровень " + cur.tier + " · " + cur.block;
  el("dTitle").textContent = cur.title;
  el("dBody").hidden = true;
  el("dBody").innerHTML = "";
  el("dShow").hidden = false;
  window.scrollTo(0, 0);
}
el("drillBtn").addEventListener("click", () => { pick(); el("drill").dataset.on = "1"; });
el("dShow").addEventListener("click", () => {
  el("dBody").innerHTML = bodyHTML(cur);
  el("dBody").hidden = false;
  el("dShow").hidden = true;
});
el("dNext").addEventListener("click", pick);
el("dClose").addEventListener("click", () => { el("drill").dataset.on = "0"; });

render();
</script>
</body>
</html>
