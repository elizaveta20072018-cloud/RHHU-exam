сткий алгоритм: сердечно-лёгочная реанимация, действия при пожаре, применение противогаза. Здесь нужен показ и отработка до автоматизма, а поиск уводит от нормативного порядка действий."}], "notes": [{"label": "Заходит от психологии", "text": "проблемное обучение опирается на понятие познавательного противоречия и на исследования мышления Рубинштейна и Матюшкина — мышление начинается с проблемной ситуации. Плюс мотивационный эффект: проблемная задача включает внутреннюю познавательную мотивацию, тогда как объяснительно-иллюстративный метод держится на внешней."}], "block": "Методика", "bk": "met", "tier": 2, "psy": false, "aid": false, "core": "метод обучения — способ упорядоченной совместной деятельности учителя и учеников, приём — его элемент; Лернер и Скаткин выстроили пять методов по нарастанию самостоятельности ученика.", "anchors": ["метод и приём", "Лернер и Скаткин", "характер познавательной деятельности", "пять методов по возрастанию", "проблемная ситуация"], "simple": ["Метод обучения — способ упорядоченной совместной деятельности учителя и учеников; ключевое слово «совместной», сторон всегда две.", "Методический приём — элемент метода; один и тот же приём в разных методах играет разную роль: показ слайда бывает иллюстрацией к объяснению, а бывает завязкой проблемной ситуации.", "Классификаций несколько: по источнику знаний (словесные, наглядные, практические), по дидактической цели (изучение нового, закрепление, контроль); Лернер и Скаткин делят методы по характеру познавательной деятельности.", "Пять методов по нарастанию самостоятельности: объяснительно-иллюстративный, репродуктивный, проблемного изложения, частично-поисковый, исследовательский.", "Проблемное изложение: учитель сам ставит и решает проблему вслух, показывает тупики и отброшенные версии, ученик не действует, но присваивает образец мышления. Частично-поисковый (эвристический): проблему делят на шаги, узловые точки держит учитель, инструмент — эвристическая беседа с наводящими вопросами. Исследовательский: ученик проходит весь цикл сам, от гипотезы до выводов.", "Там, где цена ошибки — жизнь и есть жёсткий алгоритм (реанимация, пожар, противогаз), поиск неуместен: нужен показ и отработка до автоматизма."], "cards": [{"t": "метод обучения", "d": "способ упорядоченной совместной деятельности учителя и учеников для решения задач обучения"}, {"t": "методический приём", "d": "элемент метода, отдельное действие внутри него; в разных методах играет разную роль"}, {"t": "классификация Лернера и Скаткина", "d": "деление методов по характеру познавательной деятельности: объяснительно-иллюстративный, репродуктивный, проблемного изложения, частично-поисковый, исследовательский"}, {"t": "проблемное изложение", "d": "учитель сам ставит и решает проблему вслух, показывая ход рассуждения и отброшенные версии"}, {"t": "эвристическая беседа", "d": "система наводящих вопросов, через которую класс достраивает решение частями — инструмент частично-поискового метода"}, {"t": "проблемная ситуация", "d": "познавательное противоречие, с которого начинается мышление; опора теории проблемного обучения Махмутова"}], "quiz": [{"q": "По какому основанию Лернер и Скаткин классифицировали методы обучения?", "ok": "По характеру познавательной деятельности учеников", "bad": ["По источнику знаний", "По дидактической цели урока", "По форме организации класса"], "why": "Словесные, наглядные и практические — это классификация по источнику знаний. По дидактической цели делят методы изучения нового, закрепления и контроля."}, {"q": "Что делает ученик при методе проблемного изложения?", "ok": "Следит за ходом рассуждения учителя и присваивает образец мышления", "bad": ["Самостоятельно выдвигает и проверяет гипотезу", "Выполняет действие по заданному образцу", "Отвечает на наводящие вопросы, решая задачу по частям"], "why": "Решение показывает учитель. Ответы на наводящие вопросы — уже частично-поисковый метод, самостоятельная гипотеза — исследовательский."}, {"q": "Чем метод обучения отличается от педагогической технологии?", "ok": "Метод — способ действия внутри урока, технология — воспроизводимая последовательность с заданным результатом и диагностикой", "bad": ["Метод применяет учитель, технология — ученик", "Технология всегда связана с техническими средствами", "Метод относится к обучению, технология — только к воспитанию"], "why": "Ключевое слово для технологии — воспроизводимость: её может повторить другой учитель и получить тот же результат."}, {"q": "На каком материале ОБиЗР исследовательский метод неуместен?", "ok": "Сердечно-лёгочная реанимация и действия при пожаре", "bad": ["Анализ статистики травматизма в районе", "Исследование безопасности маршрута «дом — школа»", "Проверка эвакуационных путей своего этажа"], "why": "Там, где есть жёсткий алгоритм и цена ошибки — жизнь, нужен показ и отработка до автоматизма, поиск уводит от нормативного порядка."}]}, {"n": 10, "title": "Личностно-ориентированные технологии и их применение на ОБиЗР", "kostyak": ["Личностно-ориентированные технологии исходят из того, что ученик — не объект воздействия, а субъект со своим опытом, и обучение строится от этого опыта, а не только от программы.", "В отечественной педагогике это направление связано с именами Якиманской, Серикова, Бондаревской, а в психологии оно опирается на гуманистическую традицию Роджерса и Маслоу и на педагогику сотрудничества Амонашвили.", "Ключевая идея Якиманской — субъектный опыт ученика. Ребёнок приходит на урок не пустым, у него уже есть представления об опасности, часто ошибочные, и задача учителя — не заместить их, а сделать предметом обсуждения.", "Признаки такой технологии на уроке: выбор задания по уровню и по интересу, право на своё мнение и его обоснование, диалог вместо фронтального опроса, рефлексия в конце, оценка динамики ученика, а не только соответствия эталону.", "На ОБиЗР это работает хорошо, потому что у предмета есть личный материал у каждого. Пример: тема безопасности в быту начинается не с перечня правил, а с вопроса «какая опасная ситуация была лично у вас или у ваших близких» — дальше разбираем эти случаи.", "Второй пример — разноуровневые задания на теме первой помощи: одни отрабатывают базовый алгоритм на манекене, другие получают усложнённую вводную с несколькими пострадавшими и сами определяют очерёдность.", "Третий пример — технология педагогических мастерских и метод портфолио: ученик ведёт личную карту безопасности своего маршрута, дома, цифрового следа, и она оценивается по приросту.", "Ограничение честно назову: личностно-ориентированный подход не отменяет нормативных алгоритмов. Обсуждать можно мотивы и оценку ситуации, но порядок действий при пожаре обсуждению не подлежит."], "terms": ["субъектный опыт ученика", "субъект-субъектное взаимодействие", "Якиманская", "Сериков", "Бондаревская", "педагогика сотрудничества", "разноуровневое обучение", "индивидуальная образовательная траектория", "дифференциация и индивидуализация", "рефлексия", "ситуация успеха", "портфолио"], "follow": [{"q": "Чем личностно-ориентированный подход отличается от индивидуального?", "a": "Индивидуальный подход — учёт особенностей ученика при неизменной общей цели. Личностно-ориентированный меняет саму позицию ученика: он участвует в постановке цели и выборе способа."}, {"q": "Как это сочетается с ФГОС?", "a": "Прямо: стандарт требует индивидуальных образовательных траекторий, учёта особых образовательных потребностей и оценки индивидуального прогресса."}], "notes": [{"label": "Заходит от психологии", "text": "здесь можно уверенно говорить о безусловном принятии и эмпатии по Роджерсу, о мотивации достижения и мотивации избегания неудач, о ситуации успеха как условии учебной мотивации. Отдельный сильный ход — сказать, что личностно-ориентированный подход требует от учителя развитой рефлексии и работы с собственными установками, иначе он остаётся декларацией."}], "block": "Методика", "bk": "met", "tier": 2, "psy": false, "aid": false, "core": "ученик приходит на урок не пустым, у него уже есть свой опыт безопасности, часто ошибочный; личностно-ориентированные технологии строят обучение от этого опыта и меняют позицию ученика с объекта на субъект.", "anchors": ["субъектный опыт", "Якиманская", "субъект-субъектное взаимодействие", "дифференциация", "ситуация успеха"], "simple": ["Ключевая идея Якиманской — субъектный опыт ученика: ребёнок приходит на урок с готовыми представлениями об опасности, часто ошибочными, и задача не заместить их, а сделать предметом обсуждения. Направление связано также с именами Серикова и Бондаревской.", "Признаки такой технологии на уроке: выбор задания по уровню и интересу, право на своё мнение и его обоснование, диалог вместо фронтального опроса, рефлексия в конце, оценка динамики ученика, а не только соответствия эталону.", "Отличие от индивидуального подхода: там учитывают особенности при неизменной цели, здесь ученик участвует в постановке цели и выборе способа.", "Материал ОБиЗР для этого удобный: личная история про опасность есть у каждого, с неё и начинается тема; на первой помощи одни отрабатывают базовый алгоритм на манекене, другие получают усложнённую вводную с несколькими пострадавшими.", "Психологическая база: безусловное принятие и эмпатия по Роджерсу, мотивация достижения против мотивации избегания неудач, ситуация успеха как условие учебной мотивации.", "Ограничение: нормативные алгоритмы обсуждению не подлежат. Обсуждать можно мотивы и оценку ситуации, а порядок действий при пожаре задан нормативно."], "cards": [{"t": "субъектный опыт ученика", "d": "имеющиеся у ребёнка собственные представления и переживания, от которых строится обучение — ключевая идея Якиманской"}, {"t": "субъект-субъектное взаимодействие", "d": "отношения, где ученик не объект воздействия, а участник постановки цели и выбора способа работы"}, {"t": "дифференциация и индивидуализация", "d": "подбор заданий по уровню и интересу и выстраивание индивидуальной образовательной траектории"}, {"t": "ситуация успеха", "d": "переживание достижимого результата, поддерживающее учебную мотивацию и веру в собственные силы"}, {"t": "рефлексия", "d": "осмысление учеником собственного действия и его результата; обязательный этап личностно-ориентированного урока"}, {"t": "портфолио", "d": "форма накопительной оценки, где результат ученика измеряется по приросту, а не по соответствию единому эталону"}], "quiz": [{"q": "Что считается ключевой идеей личностно-ориентированного подхода по Якиманской?", "ok": "Опора на субъектный опыт ученика", "bad": ["Индивидуальный темп прохождения программы", "Полный отказ от отметок", "Свободный выбор учеником учебных предметов"], "why": "Ребёнок приходит с готовыми представлениями об опасности, и задача учителя — сделать их предметом обсуждения, а не просто заместить."}, {"q": "Чем личностно-ориентированный подход отличается от индивидуального?", "ok": "Он меняет позицию ученика: тот участвует в постановке цели и выборе способа", "bad": ["Он применяется только в старших классах", "Он предполагает работу с одним учеником, а не с классом", "Он отменяет обязательное содержание программы"], "why": "Индивидуальный подход учитывает особенности ученика при неизменной общей цели, личностно-ориентированный меняет саму позицию."}, {"q": "Какое ограничение личностно-ориентированного подхода на ОБиЗР стоит назвать самому?", "ok": "Нормативные алгоритмы действий обсуждению не подлежат", "bad": ["Подход неприменим в группах больше пятнадцати человек", "Он несовместим с требованиями ФГОС", "Он исключает групповую работу"], "why": "Обсуждать можно мотивы и оценку ситуации. Порядок действий при пожаре задан нормативно, и вариативность здесь опасна."}]}, {"n": 18, "title": "Анализ урока: виды и структура", "kostyak": ["Анализ урока — это разбор урока по заданным основаниям с целью оценить, достигнута ли цель, и найти способы улучшения. Ключевое отличие анализа от впечатления: он ведётся по критериям, а не по ощущению «понравилось или нет».", "Кто анализирует: сам учитель — это самоанализ, коллеги — взаимопосещение, администрация и методист — контрольное посещение, аттестационная комиссия.", "Виды анализа различают по глубине и охвату. Полный или развёрнутый — по всем компонентам. Краткий, оценочный — общая оценка достижения цели. Комплексный — совокупность уроков или урок во всех аспектах сразу.", "И по основанию: структурный анализ — логика и последовательность этапов; аспектный — один параметр под увеличительным стеклом, например реализация здоровьесберегающих требований или работа со слабыми учениками; дидактический, психологический, методический анализ.", "В отечественной школе классической считается схема Конаржевского: анализ через учебно-воспитательные моменты и оценку того, как каждый этап работает на конечный результат.", "Структура анализа обычно такая: общие сведения об уроке — тип, тема, место в разделе; постановка целей и их диагностичность; содержание — научность, соответствие программе, отбор материала; методы и средства, их обоснованность; организация деятельности учеников и уровень их самостоятельности; контроль и оценивание; результат урока и его соотнесение с целью; выводы и рекомендации.", "Отдельный блок — психологический аспект: учёт возрастных особенностей, темп и дозировка нагрузки, смена видов деятельности, характер общения, обратная связь, климат в классе.", "Специфика ОБиЗР: обязательно оценивается практическая отработка и соблюдение техники безопасности на самом уроке. Урок по первой помощи без реальной отработки на манекене формально может быть выстроен грамотно, но цели не достигнет."], "terms": ["самоанализ урока", "аспектный", "структурный", "полный анализ", "дидактический и психологический анализ", "схема Конаржевского", "диагностичность цели", "соответствие типа урока его цели", "плотность урока", "смена видов деятельности", "обратная связь", "рекомендации по итогам анализа"], "follow": [{"q": "Что такое диагностичная цель?", "a": "Цель, сформулированная так, что по окончании урока можно проверить, достигнута она или нет. «Познакомить с темой» недиагностично, «ученик перечисляет и демонстрирует порядок действий при обнаружении пострадавшего без сознания» — диагностично."}, {"q": "С чего начинается самоанализ?", "a": "С сопоставления замысла и результата: какая была цель, что реально сделали ученики, где расхождение и почему. Дальше — что изменить в следующем уроке."}], "notes": [{"label": "Заходит от психологии", "text": "психологический анализ урока — прямо профильная часть. Можно говорить о работоспособности и её динамике в течение урока, о произвольном и непроизвольном внимании и его колебаниях, об утомлении и необходимости смены деятельности, о стиле педагогического общения и его влиянии на активность класса. Это редко звучит развёрнуто у абитуриентов и хорошо запоминается комиссии."}], "block": "Методика", "bk": "met", "tier": 2, "psy": false, "aid": false, "core": "анализ урока — разбор по заданным основаниям, а не впечатление «понравилось»; главный вопрос анализа — достигнута ли цель и совпал ли тип урока с этой целью.", "anchors": ["критерии вместо впечатления", "самоанализ", "структурный и аспектный", "Конаржевский", "диагностичность цели"], "simple": ["Анализ урока — разбор по заданным основаниям с целью оценить, достигнута ли цель, и найти способы улучшения; он ведётся по критериям, а не по ощущению «понравилось».", "Кто анализирует: сам учитель (самоанализ, он начинается с сопоставления замысла и результата), коллеги (взаимопосещение), администрация и методист, аттестационная комиссия.", "Виды по глубине: полный по всем компонентам, краткий оценочный, комплексный. По основанию: структурный (логика и последовательность этапов), аспектный (один параметр крупным планом, например работа со слабыми учениками), дидактический, психологический, методический. Классической считается схема Конаржевского.", "Диагностичная цель — та, по которой видно, достигли или нет. «Познакомить с темой» не проверить, «ученик демонстрирует порядок действий» — проверить.", "Психологический аспект: работоспособность и её динамика, колебания внимания, утомление и смена деятельности, стиль педагогического общения, климат в классе.", "Специфика ОБиЗР: оценивается практическая отработка и соблюдение техники безопасности на самом уроке; урок по первой помощи без отработки на манекене может быть выстроен грамотно, но цели не достигнет."], "cards": [{"t": "анализ урока", "d": "разбор урока по заданным основаниям с целью оценить достижение цели и найти способы улучшения"}, {"t": "самоанализ урока", "d": "разбор учителем собственного урока, начинается с сопоставления замысла и реального результата"}, {"t": "структурный анализ", "d": "разбор логики и последовательности этапов урока и их работы на конечный результат"}, {"t": "аспектный анализ", "d": "разбор одного выбранного параметра урока крупным планом, например здоровьесбережения или работы со слабыми учениками"}, {"t": "схема Конаржевского", "d": "классическая отечественная схема анализа через учебно-воспитательные моменты и их вклад в результат"}, {"t": "диагностичность цели", "d": "свойство формулировки цели, позволяющее по окончании урока проверить, достигнута она или нет"}], "quiz": [{"q": "Что отличает анализ урока от впечатления о нём?", "ok": "Разбор ведётся по заданным критериям", "bad": ["Анализ проводит только администрация", "Анализ обязательно оформляется письменно", "Анализ всегда завершается отметкой учителю"], "why": "Впечатление отвечает на вопрос «понравилось или нет», анализ — на вопрос «достигнута ли цель и почему»."}, {"q": "Какая цель урока сформулирована диагностично?", "ok": "Ученик перечисляет и демонстрирует порядок действий при обнаружении пострадавшего без сознания", "bad": ["Познакомить учащихся с основами первой помощи", "Воспитывать ответственное отношение к здоровью", "Расширить кругозор учащихся по теме безопасности"], "why": "Диагностичная формулировка описывает наблюдаемое действие ученика, а не намерение учителя."}, {"q": "Разбор урока по одному параметру, например по реализации здоровьесберегающих требований, — это какой анализ?", "ok": "Аспектный", "bad": ["Структурный", "Полный", "Комплексный"], "why": "Структурный смотрит логику этапов, полный — все компоненты, комплексный охватывает совокупность уроков или все аспекты сразу."}, {"q": "Что специфично для анализа урока по ОБиЗР?", "ok": "Оценивается практическая отработка и соблюдение техники безопасности на самом уроке", "bad": ["Обязательно присутствие представителя МЧС", "Урок анализируется только по журналу инструктажей", "Практическая часть не входит в предмет анализа"], "why": "Урок по первой помощи без отработки на манекене может быть выстроен грамотно, но цели не достигнет."}]}, {"n": 22, "title": "Виды и методы контроля обучения", "kostyak": ["Контроль — это установление соответствия достигнутых результатов запланированным. У него несколько функций: диагностическая, обучающая, развивающая, воспитательная и мотивационная. Важно не сводить его к одной контролирующей.", "Виды контроля различают по месту в процессе: предварительный, текущий, тематический, периодический или рубежный, итоговый.", "Предварительный показывает стартовый уровень и опорные знания. Текущий сопровождает изучение темы и позволяет корректировать по ходу. Тематический подводит итог раздела. Итоговый — за период обучения, включая государственную итоговую аттестацию.", "По субъекту: контроль учителя, взаимоконтроль учеников, самоконтроль. Последний по ФГОС является целью, а не только средством — самоконтроль входит в регулятивные УУД.", "Методы контроля: устный опрос — фронтальный, индивидуальный, уплотнённый; письменный — самостоятельная и контрольная работа, диктант, эссе; практический — выполнение операций, что для ОБиЗР основной метод; тестовый; наблюдение; проектный.", "Тестирование стоит охарактеризовать отдельно: даёт широкий охват и объективность, но плохо проверяет умение действовать и рассуждать. Поэтому на ОБиЗР его сочетают с практическим зачётом.", "Современная рамка — разведение формирующего и суммативного оценивания. Формирующее ведётся во время обучения, его задача — обратная связь и корректировка, отметка при нём не обязательна. Суммативное фиксирует итог.", "Требования к контролю: объективность, систематичность, всесторонность, дифференцированность, гласность критериев. Ученик должен заранее знать, по каким критериям его оценивают.", "Специфика предмета: главный измеритель — умение выполнить алгоритм. Проверять первую помощь письменным тестом методически неверно, нужен практический зачёт по чек-листу."], "terms": ["функции контроля", "предварительный", "текущий", "тематический", "итоговый контроль", "формирующее и суммативное оценивание", "критериальное оценивание", "валидность и надёжность теста", "самоконтроль и взаимоконтроль", "накопительная система", "всероссийские проверочные работы", "практический зачёт по чек-листу"], "follow": [{"q": "Чем оценка отличается от отметки?", "a": "Оценка — процесс и суждение о качестве работы, она может быть развёрнутой и словесной. Отметка — её условное числовое выражение, свёрнутое до балла."}, {"q": "Что даёт формирующее оценивание на ОБиЗР?", "a": "Возможность отработать алгоритм до итогового зачёта: ученик получает обратную связь по чек-листу, видит конкретную ошибку в порядке действий и повторяет попытку без штрафа за неё."}], "notes": [{"label": "Заходит от психологии", "text": "сильная линия — влияние оценки на мотивацию. Отметка как внешний мотиватор вытесняет познавательный интерес; исследования учебной мотивации Марковой и Божович это описывают. Плюс тема оценочной тревожности и того, почему критериальное оценивание её снижает: ученик знает правила и видит, что оценивают работу, а не его самого. Можно упомянуть эффект ожиданий учителя."}], "block": "Методика", "bk": "met", "tier": 2, "psy": false, "aid": false, "core": "контроль — установление соответствия достигнутого запланированному, у него пять функций, а не одна карательная; на ОБиЗР главный измеритель — умение выполнить алгоритм, значит нужен практический зачёт по чек-листу.", "anchors": ["функции контроля", "виды по месту в процессе", "формирующее и суммативное", "критериальное оценивание", "практический зачёт"], "simple": ["Контроль — установление соответствия достигнутых результатов запланированным; функций пять: диагностическая, обучающая, развивающая, воспитательная, мотивационная. Сводить его к одной проверяющей — методическая ошибка.", "Виды по месту в процессе выстраиваются по времени: предварительный, текущий, тематический, рубежный, итоговый — до, во время, после темы, после раздела, в конце.", "По субъекту: контроль учителя, взаимоконтроль, самоконтроль; самоконтроль по ФГОС — цель, а не только средство, он входит в регулятивные УУД.", "Формирующее оценивание идёт по ходу обучения ради обратной связи, отметка при нём не обязательна; суммативное фиксирует итог.", "Оценка и отметка — не одно и то же: оценка — суждение о качестве работы, может быть словесной; отметка — балл, в который его свернули.", "Тест даёт охват и объективность, но плохо ловит умение действовать: первую помощь письменным тестом проверять неверно, нужен практический зачёт по чек-листу. Критериальное оценивание снижает оценочную тревожность, потому что ученик видит: оценивают работу, а не его самого."], "cards": [{"t": "контроль обучения", "d": "установление соответствия достигнутых результатов запланированным; несёт диагностическую, обучающую, развивающую, воспитательную и мотивационную функции"}, {"t": "формирующее оценивание", "d": "оценивание по ходу обучения ради обратной связи и корректировки, отметка при нём не обязательна"}, {"t": "суммативное оценивание", "d": "оценивание, фиксирующее итог освоения темы, раздела или курса"}, {"t": "критериальное оценивание", "d": "оценивание по заранее объявленным критериям, известным ученику до начала работы"}, {"t": "оценка и отметка", "d": "оценка — суждение о качестве работы, может быть словесной; отметка — её условное числовое выражение"}, {"t": "практический зачёт по чек-листу", "d": "основная форма контроля на ОБиЗР: ученик выполняет алгоритм, а проверяющий фиксирует шаги по списку"}], "quiz": [{"q": "Чем формирующее оценивание отличается от суммативного?", "ok": "Оно ведётся по ходу обучения ради обратной связи, отметка не обязательна", "bad": ["Оно проводится только в начальной школе", "Оно всегда выражается в баллах накопительной системы", "Оно заменяет государственную итоговую аттестацию"], "why": "Суммативное фиксирует итог. Формирующее позволяет ученику увидеть ошибку в алгоритме и повторить попытку без штрафа."}, {"q": "Почему проверять усвоение первой помощи письменным тестом методически неверно?", "ok": "Тест не измеряет умение выполнить действие", "bad": ["Тест слишком долго проверять", "Тест не соответствует федеральной рабочей программе", "Тестирование запрещено на уроках ОБиЗР"], "why": "Тест даёт охват и объективность, но проверяет знание, а не действие. Нужен практический зачёт по чек-листу."}, {"q": "Чем отличается оценка от отметки?", "ok": "Оценка — суждение о качестве работы, отметка — его числовое выражение", "bad": ["Оценку ставит учитель, отметку — администрация", "Оценка выставляется в журнал, отметка — в дневник", "Это синонимы, различие условно"], "why": "Оценка может быть развёрнутой и словесной, отметка свёрнута до балла."}, {"q": "В какую группу УУД входит самоконтроль, который ФГОС называет целью, а не только средством?", "ok": "Регулятивные", "bad": ["Познавательные", "Коммуникативные", "Личностные"], "why": "Самоорганизация и самоконтроль — ядро регулятивных УУД, поэтому самоконтроль ученика по стандарту становится самостоятельным результатом."}]}, {"n": 30, "title": "Структура и содержание учебной программы по ОБиЗР/ОБЖ", "kostyak": ["Сначала разведу уровни: есть федеральная рабочая программа по ОБиЗР, она входит в федеральную образовательную программу и обязательна по содержанию, и есть рабочая программа учителя, которую он составляет на её основе.", "По обновлённому ФГОС рабочая программа имеет три обязательных раздела: содержание учебного предмета, планируемые результаты освоения и тематическое планирование. Раньше требований было больше, сейчас структура упрощена.", "Тематическое планирование включает темы, количество часов, а также указание на электронные образовательные ресурсы и виды деятельности учеников. К программе прикладывается календарно-тематическое планирование.", "Планируемые результаты в программе расписываются по трём группам — личностные, метапредметные, предметные — и по годам обучения, а не суммарно на весь курс.", "Содержание курса ОБиЗР построено по модульному принципу. Модулей около десяти, среди них: безопасное и устойчивое развитие личности, общества и государства; военная подготовка и основы военных знаний; культура безопасности жизнедеятельности; безопасность в быту, на транспорте, в общественных местах, в природной среде; основы медицинских знаний и оказание первой помощи; безопасность в социуме; безопасность в информационном пространстве; основы противодействия экстремизму и терроризму.", "Модульность даёт гибкость: модули изучаются последовательно, но их наполнение конкретизируется с учётом региональных особенностей — в приморском регионе больше про воду, в лесном — про пожары в природной среде.", "Курс изучается на уровне основного общего образования в 8–9 классах и на уровне среднего общего в 10–11, при этом элементы безопасного поведения включены и в другие предметы раньше — прежде всего в окружающий мир и биологию.", "Принципы построения содержания: концентричность — темы возвращаются на новом уровне сложности; практическая направленность; связь с региональным контекстом; преемственность между уровнями образования.", "Важное отличие ОБиЗР от прежнего ОБЖ на уровне программы — усиленный военный блок и появление тем, связанных с современными средствами вооружённой борьбы, включая беспилотные системы, и элементами тактической медицины."], "terms": ["федеральная образовательная программа", "федеральная рабочая программа по ОБиЗР", "рабочая программа учителя", "три раздела рабочей программы", "тематическое и календарно-тематическое планирование", "модульная структура курса", "планируемые результаты по годам обучения", "концентрический принцип", "региональный компонент содержания", "преемственность уровней образования"], "follow": [{"q": "Может ли учитель менять содержание?", "a": "Уменьшать объём федеральной рабочей программы нельзя. Учитель может перераспределять часы в допустимых пределах, добавлять региональный материал и выбирать формы работы."}, {"q": "Что такое концентрический принцип?", "a": "Возврат к теме на новом уровне: в основной школе — как действовать при пожаре, в старшей — оценка пожарных рисков, нормативные требования, организация эвакуации."}], "notes": [{"label": "Заходит от психологии", "text": "концентрический принцип легко обосновать через возрастные возможности: одна и та же тема на разной глубине, потому что абстрактное мышление и способность к анализу рисков формируются постепенно. Плюс можно сказать про соответствие содержания зоне ближайшего развития — программа задаёт материал чуть выше текущего уровня, иначе развития не происходит."}], "block": "Методика", "bk": "met", "tier": 2, "psy": false, "aid": false, "core": "содержание задаёт федеральная рабочая программа по ОБиЗР, учитель пишет свою на её основе; программа состоит из трёх разделов, а курс собран по модульному принципу с концентрическим возвратом к темам.", "anchors": ["два уровня программы", "три раздела", "модульная структура", "результаты по годам", "концентричность"], "simple": ["Два уровня: федеральная рабочая программа в составе федеральной образовательной программы обязательна по содержанию, рабочая программа учителя пишется на её основе, уменьшать объём нельзя.", "Три раздела рабочей программы: содержание учебного предмета, планируемые результаты освоения, тематическое планирование. Раньше требований было больше, сейчас проще.", "Результаты расписываются по трём группам и по годам обучения, а не одной кучей на весь курс.", "Содержание построено по модульному принципу, модулей около десяти: культура безопасности, безопасность в быту, на транспорте, в общественных местах и природной среде, основы медицинских знаний и первая помощь, безопасность в социуме, информационная безопасность, противодействие экстремизму и терроризму, военная подготовка и основы военных знаний.", "Модульность даёт региональную настройку: у моря больше про воду, в лесном крае — про природные пожары. Курс изучают в 8–9 и 10–11 классах.", "Концентрический принцип: та же тема возвращается на новом уровне сложности, потому что способность оценивать риски созревает постепенно; программа держится чуть выше текущего уровня — в зоне ближайшего развития."], "cards": [{"t": "федеральная рабочая программа по ОБиЗР", "d": "обязательная по содержанию программа в составе федеральной образовательной программы"}, {"t": "рабочая программа учителя", "d": "программа, разрабатываемая на основе федеральной; объём содержания уменьшать нельзя"}, {"t": "три раздела рабочей программы", "d": "содержание учебного предмета, планируемые результаты освоения, тематическое планирование"}, {"t": "тематическое планирование", "d": "раздел с темами, количеством часов, электронными образовательными ресурсами и видами деятельности учеников"}, {"t": "модульная структура курса", "d": "построение содержания из самостоятельных модулей, наполнение которых конкретизируется с учётом региональных особенностей"}, {"t": "концентрический принцип", "d": "возврат к теме на новом уровне сложности: в основной школе — как действовать при пожаре, в старшей — оценка рисков и организация эвакуации"}], "quiz": [{"q": "Сколько обязательных разделов имеет рабочая программа по обновлённому ФГОС?", "ok": "Три: содержание, планируемые результаты, тематическое планирование", "bad": ["Два: содержание и календарно-тематическое планирование", "Четыре: пояснительная записка, содержание, результаты, планирование", "Пять, включая список литературы и оценочные материалы"], "why": "Структура упрощена по сравнению с прежними требованиями. Календарно-тематическое планирование прикладывается к программе."}, {"q": "Может ли учитель изменить содержание федеральной рабочей программы?", "ok": "Уменьшать объём нельзя, можно перераспределять часы в допустимых пределах и добавлять региональный материал", "bad": ["Может изменять содержание свободно по своему усмотрению", "Не может менять ничего, включая формы работы", "Может, если согласует изменения с родительским комитетом"], "why": "Федеральная программа задаёт обязательный минимум содержания, гибкость остаётся в часах, региональном материале и формах."}, {"q": "Что означает концентрический принцип построения содержания?", "ok": "Возврат к теме на новом уровне сложности", "bad": ["Изучение тем строго по одному разу без повторений", "Группировку содержания вокруг одного центрального модуля", "Одинаковую глубину темы на всех уровнях образования"], "why": "Обоснование возрастное: абстрактное мышление и способность к анализу рисков формируются постепенно."}, {"q": "Какой модуль появился в курсе именно с переходом от ОБЖ к ОБиЗР?", "ok": "Военная подготовка и основы военных знаний", "bad": ["Основы медицинских знаний и оказание первой помощи", "Безопасность в природной среде", "Безопасность в информационном пространстве"], "why": "Прежнее ядро сохранилось, добавились военный блок, современные средства вооружённой борьбы, включая беспилотные системы, и элементы тактической медицины."}]}, {"n": 24, "title": "Нормативно-правовые документы в работе преподавателя-организатора ОБиЗР/ОБЖ", "kostyak": ["Документы удобно разложить по уровням: Конституция, федеральные законы, подзаконные акты Правительства и министерств, региональные документы и локальные акты школы.", "Основа — Конституция, где закреплены право на образование, право на охрану здоровья и благоприятную окружающую среду и обязанность защиты Отечества. Последнее прямо связано с новым названием предмета.", "Базовый закон отрасли — Федеральный закон № 273-ФЗ «Об образовании в Российской Федерации». В нём для нас важны статьи об охране здоровья обучающихся, о компетенции и ответственности образовательной организации, о правах и обязанностях педагогических работников.", "Профильные законы по содержанию предмета: о защите населения и территорий от чрезвычайных ситуаций природного и техногенного характера, о пожарной безопасности, о гражданской обороне, о противодействии терроризму и экстремистской деятельности, о воинской обязанности и военной службе, о безопасности дорожного движения, о защите детей от информации, причиняющей вред их здоровью и развитию.", "Стратегические документы: Стратегия национальной безопасности Российской Федерации и доктринальные документы по информационной безопасности. Их полезно назвать, потому что они задают понятийный аппарат — национальные интересы, угрозы, обеспечение безопасности.", "Образовательные акты: ФГОС основного и среднего общего образования, федеральная образовательная программа и входящая в неё федеральная рабочая программа по ОБиЗР, федеральный перечень учебников, порядок организации образовательной деятельности.", "Квалификационные требования: должность преподавателя-организатора ОБЖ описана в квалификационных характеристиках работников образования, действует профессиональный стандарт педагога. Здесь же — требования к обучению по охране труда и оказанию первой помощи.", "Санитарные требования: санитарные правила к организациям воспитания и обучения и гигиенические нормативы. Плюс требования к антитеррористической защищённости объектов образования, установленные постановлением Правительства.", "Локальный уровень: устав школы, основная образовательная программа, рабочая программа учителя, инструкции по охране труда, приказы о назначении ответственных, планы тренировок по эвакуации.", "Честная оговорка в конце: перечень подвижен, документы регулярно обновляются, поэтому учитель работает со справочными правовыми системами и с официальными публикациями министерства."], "terms": ["№ 273-ФЗ «Об образовании в Российской Федерации»", "федеральный закон о защите населения и территорий от ЧС", "закон о гражданской обороне", "закон о противодействии терроризму", "закон о воинской обязанности и военной службе", "Стратегия национальной безопасности", "ФГОС ООО и СОО", "федеральная образовательная программа", "федеральный перечень учебников", "профессиональный стандарт педагога", "локальные нормативные акты", "антитеррористическая защищённость объекта"], "follow": [{"q": "Какой документ определяет, что именно вы преподаёте в конкретном классе?", "a": "Федеральная рабочая программа по ОБиЗР в составе федеральной образовательной программы. Учитель разрабатывает свою рабочую программу на её основе, не снижая содержания."}, {"q": "Какие обязанности педагога закреплены в 273-ФЗ?", "a": "Осуществлять деятельность на профессиональном уровне, соблюдать правовые и этические нормы, уважать честь и достоинство обучающихся, учитывать особенности развития, проходить обучение по охране труда и медосмотры, соблюдать устав и локальные акты."}], "notes": [{"label": "Заходит от психологии", "text": "прямой связи мало, но можно уместно упомянуть закон о защите детей от вредной информации и профилактику деструктивного контента: здесь пересекаются нормативная и психологическая рамки — механизмы вовлечения подростков в деструктивные сообщества, признаки, на которые обязан реагировать педагог."}], "block": "Методика", "bk": "met", "tier": 2, "psy": false, "aid": false, "core": "документы раскладываются по уровням — Конституция, федеральные законы, подзаконные акты, региональные документы, локальные акты школы; базовый закон отрасли — 273-ФЗ, а содержание предмета опирается на профильные законы о ЧС, ГО, терроризме и воинской обязанности.", "anchors": ["пять уровней", "273-ФЗ", "профильные законы", "образовательные акты", "локальные акты школы"], "simple": ["Документы раскладываются по пяти уровням сверху вниз: Конституция, федеральные законы, подзаконные акты Правительства и министерств, региональные документы, локальные акты школы.", "Конституция даёт три опоры: право на образование, право на охрану здоровья, обязанность защиты Отечества; последняя прямо связана с новым названием предмета.", "Базовый закон отрасли — 273-ФЗ «Об образовании в Российской Федерации»: важны статьи об охране здоровья обучающихся, о компетенции и ответственности школы, о правах и обязанностях педагогов.", "Профильные законы по содержанию предмета: о защите от ЧС, о пожарной безопасности, о гражданской обороне, о противодействии терроризму и экстремизму, о воинской обязанности, о безопасности дорожного движения, о защите детей от вредной информации. Стратегия национальной безопасности задаёт понятийный аппарат — национальные интересы, угрозы, обеспечение безопасности.", "Образовательные акты: ФГОС, федеральная образовательная программа с федеральной рабочей программой внутри, федеральный перечень учебников, профессиональный стандарт педагога.", "Локальный уровень: устав, основная образовательная программа, рабочая программа учителя, инструкции по охране труда, приказы о назначении ответственных. Перечень подвижен, точную редакцию смотрят в справочной правовой системе."], "cards": [{"t": "273-ФЗ «Об образовании в Российской Федерации»", "d": "базовый закон отрасли; для предмета важны статьи об охране здоровья обучающихся, о компетенции и ответственности организации, о правах и обязанностях педагогов"}, {"t": "уровни нормативных документов", "d": "Конституция, федеральные законы, подзаконные акты Правительства и министерств, региональные документы, локальные акты школы"}, {"t": "профильные законы курса", "d": "законы о защите населения и территорий от ЧС, о пожарной безопасности, о гражданской обороне, о противодействии терроризму, о воинской обязанности и военной службе"}, {"t": "Стратегия национальной безопасности", "d": "стратегический документ, задающий понятийный аппарат: национальные интересы, угрозы, обеспечение безопасности"}, {"t": "локальные нормативные акты", "d": "документы школы: устав, основная образовательная программа, рабочая программа учителя, инструкции по охране труда, приказы о назначении ответственных"}, {"t": "профессиональный стандарт педагога", "d": "документ квалификационных требований к трудовым функциям учителя, действующий наряду с квалификационными характеристиками"}], "quiz": [{"q": "Какой документ определяет, что именно преподаётся в конкретном классе по ОБиЗР?", "ok": "Федеральная рабочая программа в составе федеральной образовательной программы", "bad": ["ФГОС основного общего образования", "Устав образовательной организации", "Федеральный перечень учебников"], "why": "ФГОС задаёт рамку результатов, конкретику по годам обучения — федеральная рабочая программа. Учитель разрабатывает свою программу на её основе, не снижая содержания."}, {"q": "Как правильно поступить, если не помнишь точный номер приказа?", "ok": "Назвать механизм и добавить, что точную редакцию нужно смотреть в актуальной версии", "bad": ["Назвать приблизительный номер", "Отказаться отвечать на вопрос", "Сослаться на то, что документы часто меняются, и перейти к другой теме"], "why": "Формула «механизм такой-то, редакцию смотрим в справочной системе» звучит профессионально, неверный номер — нет."}, {"q": "Какая конституционная норма прямо связана с новым названием предмета?", "ok": "Обязанность защиты Отечества", "bad": ["Право на благоприятную окружающую среду", "Право на образование", "Право на охрану здоровья"], "why": "Формулировка «и защиты Родины» опирается именно на эту норму, остальные три поддерживают предмет в целом."}]}, {"n": 23, "title": "Методы и средства обеспечения безопасности труда обучающихся", "kostyak": ["Начну с рамки: школа отвечает за жизнь и здоровье обучающихся во время образовательного процесса, это прямо закреплено в законе об образовании — статья об охране здоровья обучающихся и статья о компетенции и ответственности образовательной организации.", "В теории БЖД принято выделять три группы методов защиты: разделение гомосферы и ноксосферы в пространстве или во времени, приведение опасной зоны к безопасному состоянию, и адаптация человека к среде через обучение, инструктаж и средства защиты. Школьная практика использует все три.", "Организационные меры: инструктажи и их виды — вводный, первичный на рабочем месте, повторный, внеплановый и целевой; регистрация в журналах; инструкции по охране труда для кабинетов повышенной опасности; допуск к работам; расследование и учёт несчастных случаев с обучающимися.", "Технические меры: исправное и сертифицированное оборудование, ограждения, вентиляция, электробезопасность, пожарная сигнализация и системы оповещения, содержание путей эвакуации, требования к кабинету ОБиЗР, тиру и месту практических занятий.", "Санитарно-гигиенические: требования санитарных правил к организациям воспитания и обучения и гигиенических нормативов — освещённость, микроклимат, мебель по росту, режим занятий, ограничения по времени работы с электронными средствами, нормирование нагрузки.", "Средства защиты делятся на коллективные и индивидуальные. Для школы это средства пожаротушения, аптечки, при отработке — противогазы и респираторы учебного назначения, средства защиты при практических работах.", "Кабинеты повышенной опасности в школе — физика, химия, информатика, технология, спортзал, тир — имеют отдельные требования и паспорт кабинета с актом-разрешением на проведение занятий.", "Отдельная линия — антитеррористическая защищённость объекта: категорирование, паспорт безопасности, пропускной режим, тренировки по эвакуации. Практическая тренировка проводится регулярно, и это часть работы преподавателя-организатора.", "Итог: безопасность труда обучающихся — не набор бумаг, а система, где обучение и инструктаж стоят рядом с техническими средствами. Документы фиксируют систему, но не заменяют её."], "terms": ["охрана труда и техника безопасности", "гомосфера и ноксосфера", "вводный", "первичный", "повторный", "внеплановый", "целевой инструктаж", "журнал регистрации инструктажа", "инструкция по охране труда", "средства коллективной и индивидуальной защиты", "паспорт кабинета и акт-разрешение", "санитарные правила и гигиенические нормативы", "антитеррористическая защищённость и паспорт безопасности", "расследование несчастных случаев с обучающимися"], "follow": [{"q": "Чем целевой инструктаж отличается от внепланового?", "a": "Целевой проводят перед разовой работой или мероприятием вне обычной программы — поход, экскурсия, соревнование. Внеплановый — при изменении условий, после несчастного случая или по требованию надзорных органов."}, {"q": "Кто отвечает за безопасность на уроке?", "a": "Учитель, ведущий занятие, — за жизнь и здоровье учеников в этот период; руководитель организации — за систему охраны труда в целом."}], "notes": [{"label": "Заходит от психологии", "text": "можно добавить человеческий фактор — большая часть происшествий связана не с отказом техники, а с ошибками поведения. Здесь работают понятия внимания, утомления, монотонии, склонности к риску у подростков и феномен привыкания к опасности, когда многократно повторённый инструктаж перестаёт восприниматься. Отсюда методический вывод: тренировка эффективнее инструктажа под роспись."}], "block": "Методика", "bk": "met", "tier": 2, "psy": false, "aid": false, "core": "школа отвечает за жизнь и здоровье учеников во время образовательного процесса; защита строится на трёх группах методов БЖД и держится на связке организационных, технических и санитарных мер, а не на бумагах.", "anchors": ["три группы методов защиты", "пять видов инструктажа", "СКЗ и СИЗ", "паспорт кабинета", "антитеррористическая защищённость"], "simple": ["Ответственность школы закреплена в 273-ФЗ: статьи об охране здоровья обучающихся и о компетенции и ответственности организации; на самом уроке за жизнь и здоровье учеников отвечает ведущий его учитель.", "Три способа защиты в теории БЖД: развести гомосферу и ноксосферу в пространстве или времени, привести опасную зону к безопасному состоянию, приспособить человека через обучение, инструктаж и средства защиты. Школа пользуется всеми тремя.", "Пять инструктажей различаются по поводу: вводный — при поступлении, первичный — на рабочем месте, повторный — по графику, внеплановый — при изменении условий или после несчастного случая, целевой — под разовое мероприятие вне обычной программы.", "Меры делятся на три корзины: организационные (инструктажи, журналы, инструкции), технические (оборудование, сигнализация, пути эвакуации), санитарно-гигиенические (освещённость, микроклимат, мебель, экранное время).", "Средства защиты — коллективные (вентиляция, ограждения, средства пожаротушения) и индивидуальные (противогаз, респиратор). Кабинеты повышенной опасности — физика, химия, информатика, технология, спортзал, тир — имеют паспорт кабинета и акт-разрешение. Отдельная линия — антитеррористическая защищённость: категорирование, паспорт безопасности, пропускной режим, тренировки по эвакуации.", "Большинство происшествий связано с поведением, а не с отказом техники; привыкание к опасности обесценивает инструктаж под роспись, поэтому тренировка эффективнее."], "cards": [{"t": "три группы методов защиты в БЖД", "d": "разделение гомосферы и ноксосферы, приведение опасной зоны к безопасному состоянию, адаптация человека через обучение и средства защиты"}, {"t": "виды инструктажа", "d": "вводный, первичный на рабочем месте, повторный, внеплановый, целевой"}, {"t": "целевой инструктаж", "d": "инструктаж перед разовой работой или мероприятием вне обычной программы — походом, экскурсией, соревнованием"}, {"t": "внеплановый инструктаж", "d": "инструктаж при изменении условий, после несчастного случая или по требованию надзорных органов"}, {"t": "средства коллективной и индивидуальной защиты", "d": "СКЗ защищают группу — вентиляция, ограждения, средства пожаротушения; СИЗ защищают одного человека — противогаз, респиратор"}, {"t": "антитеррористическая защищённость объекта", "d": "система мер: категорирование объекта, паспорт безопасности, пропускной режим, регулярные тренировки по эвакуации"}], "quiz": [{"q": "Чем целевой инструктаж отличается от внепланового?", "ok": "Целевой проводят перед разовым мероприятием, внеплановый — при изменении условий или после происшествия", "bad": ["Целевой проводит директор, внеплановый — учитель", "Целевой не регистрируется в журнале", "Внеплановый проводится строго раз в полугодие"], "why": "Повод разный: у целевого — предстоящее событие, у внепланового — изменившиеся обстоятельства."}, {"q": "Что относится к средствам индивидуальной защиты?", "ok": "Противогаз", "bad": ["Вентиляция кабинета", "Пожарная сигнализация", "Ограждение опасной зоны"], "why": "СИЗ защищают одного человека, остальные перечисленные средства работают на всю группу и относятся к коллективным."}, {"q": "На каком принципе БЖД основано разведение человека и опасной зоны по времени или в пространстве?", "ok": "Разделение гомосферы и ноксосферы", "bad": ["Принцип приемлемого риска", "Принцип наглядности", "Принцип нормирования нагрузки"], "why": "Гомосфера — зона человека, ноксосфера — зона опасности. Первая и самая надёжная группа методов защиты."}, {"q": "Кто отвечает за жизнь и здоровье учеников непосредственно во время урока?", "ok": "Учитель, ведущий занятие", "bad": ["Только руководитель образовательной организации", "Ответственный за охрану труда", "Классный руководитель"], "why": "За систему охраны труда в целом отвечает руководитель, за учеников в период занятия — ведущий его учитель."}]}, {"n": 48, "title": "Здоровый образ жизни. Компоненты. Индивидуальный стиль жизни", "kostyak": ["«Образ жизни — устойчивый способ жизнедеятельности человека: как он трудится, отдыхает, питается, общается. Здоровый образ жизни — та форма повседневного поведения, которая сохраняет и укрепляет здоровье и снижает риск заболеваний».", "«Подчеркну: ЗОЖ — не набор запретов, а система привычек, встроенных в реальную жизнь человека. Если она противоречит его условиям и мотивам, она не удержится».", "«Компоненты обычно называют такие. Рациональное питание — сбалансированность, режим, соответствие энергозатратам».", "«Оптимальная двигательная активность — регулярная нагрузка, соответствующая возрасту и состоянию; борьба с гиподинамией».", "«Режим труда и отдыха, полноценный сон — восстановление ресурсов, профилактика переутомления».", "«Личная гигиена и закаливание; отказ от вредных привычек — табака, алкоголя, психоактивных веществ».", "«Психогигиена и психологическая культура — умение управлять стрессом, поддерживающие отношения, эмоциональная саморегуляция».", "«Медицинская активность — профилактические осмотры, своевременное обращение за помощью, выполнение назначений».", "«Индивидуальный стиль жизни — то, как общие принципы преломляются в конкретном человеке: его биоритмы, темперамент, профессия, семейный уклад, культурные традиции. Один и тот же режим для „жаворонка“ и „совы“ даст разный результат».", "Заходит от психологии: «Сильная часть ответа — почему знание о ЗОЖ не превращается в поведение. Работает разрыв между установкой и действием. Объясняют его через модели изменения поведения: транстеоретическую модель Прохаски и Диклементе со стадиями от преднамерения до поддержания, теорию планируемого поведения Айзена, понятие самоэффективности Бандуры. Практический вывод для школы: просветительская лекция меняет знания, но не поведение. Меняют поведение работа с мотивацией, формирование конкретных навыков, поддерживающая среда и значимое окружение. Отсюда же — мотивационное интервьюирование как метод»."], "terms": ["образ жизни и стиль жизни", "двигательная активность и гиподинамия", "режим труда и отдыха", "психогигиена", "саморегуляция", "самоэффективность", "стадии изменения поведения", "мотивационное интервьюирование", "здоровьесберегающая среда"], "follow": [{"q": "Кто отвечает за формирование ЗОЖ у школьника?", "a": "— Совместно семья, школа и сам подросток. Школа отвечает за здоровьесберегающую среду: режим занятий, нагрузку, питание, двигательную активность, психологический климат, а не только за уроки о вреде курения."}, {"q": "Почему лекции о вреде курения плохо работают?", "a": "— Они дают информацию, но не затрагивают мотивы и социальный контекст. Подросток курит не от незнания, а ради принятия в группе, статуса, снятия напряжения. Работать надо с этими функциями поведения и с навыками отказа."}], "notes": [], "block": "Теория, риск, ЗОЖ", "bk": "teor", "tier": 2, "psy": true, "aid": false, "core": "ЗОЖ — не список запретов, а система привычек, встроенная в реальную жизнь конкретного человека. Знание о вреде само по себе поведение не меняет — между знанием и поступком стоят мотивация, среда и навыки.", "anchors": ["компоненты ЗОЖ", "образ и стиль жизни", "разрыв «знаю — делаю»", "стадии изменения поведения"], "simple": ["Образ жизни — устойчивый способ жизнедеятельности: как человек трудится, отдыхает, питается, общается. ЗОЖ — форма повседневного поведения, которая сохраняет здоровье и снижает риск болезней; это не набор запретов, а система привычек.", "Компоненты: рациональное питание, оптимальная двигательная активность (против гиподинамии), режим труда и отдыха и полноценный сон, личная гигиена и закаливание, отказ от вредных привычек, психогигиена и саморегуляция, медицинская активность.", "Образ жизни — общая форма, индивидуальный стиль жизни — её преломление в конкретном человеке: биоритмы, темперамент, профессия, семейный уклад. Один режим «сове» и «жаворонку» даст разный результат.", "Знание о вреде само по себе поведение не меняет: между знанием и поступком стоят мотивация, среда и навыки. Подросток курит не от незнания, а ради принятия в группе, статуса, снятия напряжения.", "Разрыв «знаю — делаю» объясняют модели изменения поведения: транстеоретическая модель Прохаски и Диклементе (стадии от преднамерения до поддержания), теория планируемого поведения Айзена, самоэффективность Бандуры.", "То, что психолог называет формированием мотивации и навыков, в теории безопасности называется формированием культуры безопасности и здоровьесберегающей среды — слова разные, механизм один."], "cards": [{"t": "Образ жизни", "d": "устойчивый способ жизнедеятельности: как человек трудится, отдыхает, питается, общается"}, {"t": "Индивидуальный стиль жизни", "d": "преломление общих принципов ЗОЖ в конкретном человеке: биоритмы, темперамент, профессия, семейный уклад"}, {"t": "Гиподинамия", "d": "недостаток двигательной активности, снижающий функциональные резервы организма"}, {"t": "Самоэффективность (Бандура) → на языке БЖД", "d": "вера в способность справиться; в терминах безопасности — субъективная готовность к безопасному действию"}, {"t": "Стадии изменения поведения (Прохаска, Диклементе) → на языке БЖД", "d": "последовательность от преднамерения к поддержанию; объясняет, почему информирование не даёт поведения"}, {"t": "Здоровьесберегающая среда", "d": "условия образовательной организации — режим, нагрузка, питание, движение, психологический климат, — поддерживающие здоровье"}], "quiz": [{"q": "Почему лекции о вреде курения слабо меняют поведение подростков?", "ok": "Они дают информацию, но не затрагивают мотивы, навыки и социальный контекст", "bad": ["Подростки не понимают содержание лекций", "Информация о вреде курения недостоверна", "Лекции слишком короткие"], "why": "Подросток курит ради принятия в группе, статуса, снятия напряжения. Работать надо с этими функциями поведения."}, {"q": "Чем стиль жизни отличается от образа жизни?", "ok": "Стиль — индивидуальное преломление общих принципов в конкретном человеке", "bad": ["Стиль относится к группе, а образ жизни к личности", "Это одно и то же", "Стиль касается только питания"], "why": "Отсюда и вывод: один режим для «совы» и «жаворонка» даст разный результат."}, {"q": "Что относится к компонентам ЗОЖ?", "ok": "Психогигиена и эмоциональная саморегуляция", "bad": ["Регулярное прохождение медико-социальной экспертизы", "Полный отказ от любой физической нагрузки", "Строгое голодание как система питания"], "why": "Психогигиена — полноправный компонент наряду с питанием, движением, режимом и медицинской активностью."}]}, {"n": 49, "title": "Аддиктивное поведение и сохранение здоровья. Задачи школы", "kostyak": ["«Аддиктивное поведение — одна из форм отклоняющегося поведения, стремление уйти от реальности через изменение своего психического состояния: приёмом веществ либо через фиксацию на определённой активности».", "«Определение в отечественной традиции связано с работами Короленко и Змановской. Ключевая формула: уход от реальности с искусственным изменением психического состояния».", "«Виды: химические аддикции — алкоголь, табак, наркотики, токсические вещества, злоупотребление лекарствами. Нехимические, поведенческие — игровая зависимость, интернет- и гаджет-зависимость, пищевые нарушения, трудоголизм, созависимость».", "«Динамика формирования описывается стадиями: первые пробы, поисковое поведение, регулярное употребление, психическая зависимость, физическая зависимость, деградация личности. Важно, что сначала формируется психическая зависимость».", "Заходит от психологии — это ядро ответа: «Механизм. Вещество или действие даёт быстрое и надёжное изменение состояния: снимает напряжение, тревогу, чувство неполноценности. Формируется прочная связь между дискомфортом и способом его снятия, а собственные способы совладания не развиваются. Поэтому аддикция — это всегда дефицит копинг-ресурсов».", "Заходит от психологии: «Теории объяснения. Биологические — роль системы подкрепления, дофаминовое вознаграждение, наследственная предрасположенность. Психодинамические — компенсация внутреннего конфликта и дефицита раннего опыта. Поведенческие — научение через подкрепление и снятие негативного состояния. Личностные — концепция аддиктивной личности: низкая переносимость фрустрации, внешний локус контроля, сниженная рефлексия, скрытый комплекс неполноценности за фасадом превосходства. Социальные — влияние семьи, группы сверстников, доступность вещества, культурные нормы».", "«Факторы риска у подростков: семейное неблагополучие и созависимая семья, отвержение сверстниками либо, наоборот, употребляющая референтная группа, школьная неуспешность, акцентуации характера, ранняя травматизация. Защитные факторы — привязанность в семье, успешность в значимой деятельности, навыки отказа, устойчивая самооценка».", "«Задачи школы в профилактике. Первичная профилактика — до первых проб: формирование жизненных навыков, работа с самооценкой и стрессоустойчивостью, обучение отказу, вовлечение в значимую деятельность, здоровьесберегающая среда, работа с родителями».", "«Вторичная — раннее выявление групп риска, психолого-педагогическое сопровождение, индивидуальная работа, взаимодействие со службами. Третичная — поддержка и реадаптация подростка, вернувшегося после лечения, недопущение стигматизации».", "Заходит от психологии: «И принципиальный момент, который стоит сказать прямо: запугивающая профилактика неэффективна и способна дать обратный эффект за счёт привлечения интереса. Работает профилактика позитивная — та, что даёт альтернативные способы получать удовольствие, справляться с напряжением и чувствовать себя значимым. Метод выбора при работе с амбивалентной мотивацией — мотивационное интервьюирование»."], "terms": ["аддиктивное поведение", "девиантное поведение", "психическая и физическая зависимость", "копинг-стратегии", "фрустрационная толерантность", "локус контроля", "система подкрепления", "факторы риска и защитные факторы", "первичная", "вторичная", "третичная профилактика", "мотивационное интервьюирование", "жизненные навыки"], "follow": [{"q": "Чем нехимическая аддикция отличается от химической?", "a": "— Отсутствием психоактивного вещества и, как правило, физической абстиненции в классическом виде. Но психологический механизм тот же: уход от реальности, сужение интересов, потеря контроля, продолжение вопреки последствиям."}, {"q": "Что конкретно делает школьный психолог в профилактике?", "a": "— Диагностика групп риска, тренинги жизненных навыков и стрессоустойчивости, индивидуальное консультирование, работа с родителями и педагогами, участие в создании среды, где у подростка есть признание вне рискованного поведения."}], "notes": [], "block": "Теория, риск, ЗОЖ", "bk": "teor", "tier": 2, "psy": true, "aid": false, "core": "Аддикция — уход от реальности через искусственное изменение своего состояния, и за ней всегда стоит дефицит собственных способов справляться. Отсюда вывод для школы: запугивание не работает, работает позитивная профилактика и обучение жизненным навыкам.", "anchors": ["уход от реальности", "химические и нехимические", "дефицит копинг-ресурсов", "три уровня профилактики"], "simple": ["Аддиктивное поведение — форма отклоняющегося поведения: уход от реальности через искусственное изменение психического состояния. В отечественной традиции связано с работами Короленко и Змановской.", "Химические аддикции — с веществом (алкоголь, табак, наркотики), нехимические (поведенческие) — без него: игра, гаджеты, пищевые нарушения, трудоголизм. Механизм тот же: сужение интересов, потеря контроля, продолжение вопреки последствиям.", "Динамика формирования: пробы, поисковое поведение, регулярное употребление, психическая зависимость, физическая зависимость, деградация личности. Сначала формируется психическая зависимость, потом физическая.", "Механизм: вещество или действие даёт быстрое и надёжное снятие напряжения, связь «дискомфорт — способ снятия» закрепляется, а собственные копинг-стратегии не развиваются. Поэтому аддикция — это всегда дефицит совладания.", "Профилактика: первичная — до первых проб (жизненные навыки, самооценка, стрессоустойчивость, навык отказа, значимая деятельность); вторичная — выявление групп риска и сопровождение; третичная — реадаптация после лечения без стигматизации.", "Запугивающая профилактика неэффективна и способна дать обратный эффект, привлекая интерес; работает позитивная — альтернативные способы получать удовольствие, справляться с напряжением и чувствовать себя значимым. Аддиктивное поведение — прямая противоположность личности безопасного типа."], "cards": [{"t": "Аддиктивное поведение", "d": "форма отклоняющегося поведения — уход от реальности через искусственное изменение психического состояния"}, {"t": "Нехимическая (поведенческая) аддикция", "d": "зависимость без психоактивного вещества: игровая, интернет- и гаджет-зависимость, пищевые нарушения, трудоголизм"}, {"t": "Копинг-ресурсы → на языке БЖД", "d": "способы совладания с напряжением; их дефицит — фактор риска опасного поведения"}, {"t": "Локус контроля → на языке БЖД", "d": "внешний локус связан со склонностью к риску и аддикции, внутренний — с безопасным поведением"}, {"t": "Первичная профилактика", "d": "работа до первых проб: жизненные навыки, самооценка, стрессоустойчивость, навык отказа, значимая деятельность"}, {"t": "Вторичная профилактика", "d": "раннее выявление групп риска, психолого-педагогическое сопровождение, индивидуальная работа"}, {"t": "Третичная профилактика", "d": "поддержка и реадаптация подростка после лечения, недопущение стигматизации"}], "quiz": [{"q": "Что первично в формировании зависимости?", "ok": "Психическая зависимость", "bad": ["Физическая зависимость", "Деградация личности", "Абстинентный синдром"], "why": "Стадии идут от проб и поискового поведения через регулярное употребление к психической, а затем физической зависимости."}, {"q": "Работа с подростками до первых проб психоактивных веществ — это:", "ok": "Первичная профилактика", "bad": ["Вторичная профилактика", "Третичная профилактика", "Реабилитация"], "why": "Вторичная начинается с выявления групп риска, третичная — после лечения."}, {"q": "Почему запугивающая профилактика считается неэффективной?", "ok": "Она способна дать обратный эффект, привлекая интерес, и не даёт альтернативных способов справляться с напряжением", "bad": ["Она слишком дорого обходится школе", "Она запрещена нормативными документами", "Она эффективна только для взрослых"], "why": "Работает позитивная профилактика: альтернативные способы получать удовольствие, справляться с напряжением и чувствовать себя значимым."}, {"q": "Чем нехимическая аддикция отличается от химической?", "ok": "Отсутствием психоактивного вещества, но психологический механизм тот же", "bad": ["Она не приводит к потере контроля над поведением", "Она не относится к отклоняющемуся поведению", "Она формируется только у взрослых"], "why": "Уход от реальности, сужение интересов, потеря контроля и продолжение вопреки последствиям присутствуют в обоих случаях."}]}, {"n": 5, "title": "Психологический аспект ЧС экологического, природного и техногенного происхождения", "kostyak": ["«ЧС воздействует на человека двумя путями: через поражающие факторы физической природы и через психотравмирующее воздействие. Второй путь охватывает значительно больше людей, чем первый: страдают не только пострадавшие, но и очевидцы, родственники, спасатели».", "Заходит от психологии: «Базовое понятие — стресс в понимании Селье: общий адаптационный синдром со стадиями тревоги, резистентности и истощения. Различаем эустресс, мобилизующий человека, и дистресс, разрушающий адаптацию. ЧС — типичный дистресс: сверхсильное воздействие при дефиците времени, информации и контроля».", "Заходит от психологии: «Динамика психических реакций в очаге описана в психологии экстремальных ситуаций. Острый период — реакции витального страха: аффективно-шоковые реакции в двух формах, гипокинетической — ступор, оцепенение, и гиперкинетической — двигательное возбуждение, беспорядочное метание. Далее подострый период — тревога, астения, нарушения сна, навязчивые воспоминания. Отдалённый период — либо восстановление, либо формирование посттравматического стрессового расстройства».", "Заходит от психологии: «ПТСР назову структурно: повторное переживание — флешбэки, кошмары; избегание всего, что связано с травмой; негативные изменения настроения и убеждений; гипервозбуждение — нарушения сна, раздражительность, вздрагивания. Отдельно — острая реакция на стресс как непосредственный ответ на событие, в отличие от отсроченного ПТСР».", "Заходит от психологии: «Паника. Механизм — циркулярная реакция: эмоциональное заражение по кругу, взаимное усиление страха в толпе. Условия возникновения: внезапная угроза жизни, дефицит информации, отсутствие узнаваемого лидера, скученность, наличие индуктора паники. Следствие — сужение сознания, некритичность, подражательное поведение, давка. Средства предупреждения: заблаговременная подготовка и отработанный алгоритм действий, ясное и уверенное информирование, присутствие человека, отдающего чёткие команды, изоляция паникёров».", "«Специфика по типам ЧС. Природные переживаются как непредотвратимые, воспринимаются фаталистично, отсюда меньше поиска виновных, но выражено чувство беспомощности. Техногенные добавляют гнев и поиск виновного — есть тот, кто допустил. Экологические — самые тяжёлые психологически из-за невидимости и растянутости угрозы: радиационное или химическое загрязнение не воспринимается органами чувств, и формируется хроническая тревога, ипохондрические реакции, недоверие к информации. Это описано как радиофобия и социально-психологические последствия загрязнения территорий».", "Заходит от психологии: «Совладание. Копинг-стратегии по Лазарусу и Фолкман делятся на проблемно-ориентированные и эмоционально-ориентированные. В ЧС на этапе воздействия эффективнее проблемно-ориентированные действия, на этапе последствий — работа с эмоциями и поиск социальной поддержки. Избегающий копинг даёт краткое облегчение и ухудшает отдалённый прогноз».", "«Помощь строится ступенчато: экстренная психологическая помощь в очаге — обеспечить безопасность, вывести из зоны, дать простые команды, восстановить контакт с реальностью, не оставлять одного. Затем психологическое сопровождение, дебрифинг с оговоркой о неоднозначности эффекта единичного дебрифинга, при необходимости — психотерапия ПТСР».", "«Отдельно — профессиональный аспект: у спасателей и педагогов, работающих с пострадавшими, развивается вторичная травматизация и эмоциональное выгорание. Это требует супервизии и профилактики»."], "terms": ["стресс", "эустресс", "дистресс", "общий адаптационный синдром Селье", "острая реакция на стресс", "аффективно-шоковые реакции", "ступор", "ПТСР", "флешбэк", "паника", "циркулярная реакция", "эмоциональное заражение", "копинг-стратегии по Лазарусу", "фрустрация", "экстренная психологическая помощь", "вторичная травматизация", "выгорание"], "follow": [{"q": "Как вести себя с человеком в ступоре?", "a": "— Установить контакт, говорить коротко и утвердительно, обращаться по имени, не оставлять одного, вывести из опасной зоны, вернуть внимание к простым телесным ощущениям и простым действиям. Не бить по щекам и не кричать, вопреки бытовому представлению."}, {"q": "Все ли, кто пережил ЧС, получают ПТСР?", "a": "— Нет, у большинства острые реакции постепенно угасают. Расстройство формируется у меньшинства, и вероятность зависит от тяжести события, предшествующей травматизации, личностных ресурсов и наличия социальной поддержки после события."}], "notes": [], "block": "Теория, риск, ЗОЖ", "bk": "teor", "tier": 2, "psy": true, "aid": false, "core": "ЧС бьёт по человеку дважды — поражающими факторами и психотравмирующим воздействием, причём второе накрывает гораздо больше людей: очевидцев, родственников, спасателей.", "anchors": ["стресс по Селье", "динамика реакций в очаге", "ПТСР", "паника и циркулярная реакция", "копинг по Лазарусу"], "simple": ["ЧС воздействует двумя путями: через поражающие факторы физической природы и через психотравмирующее воздействие. Второе охватывает больше людей — страдают не только пострадавшие, но и очевидцы, родственники, спасатели.", "Базовое понятие — стресс по Селье: общий адаптационный синдром со стадиями тревоги, резистентности и истощения. Эустресс мобилизует, дистресс разрушает адаптацию; ЧС — типичный дистресс при дефиците времени, информации и контроля.", "Динамика реакций в очаге: острый период — витальный страх и афф , "ok": "Ступор, оцепенение, обездвиженность", "bad": ["Беспорядочное двигательное возбуждение и метание", "Флешбэки и ночные кошмары", "Стойкое избегание напоминаний о событии"], "why": "Гипо — «мало движения». Метание — гиперкинетическая форма."}, {"q": "Механизм возникновения паники в толпе описывается как:", "ok": "Циркулярная реакция — эмоциональное заражение по кругу с взаимным усилением страха", "bad": ["Рациональный расчёт вероятности спасения", "Реакция исключительно на реальную физическую угрозу", "Следствие индивидуальной акцентуации характера"], "why": "Отсюда и средства предупреждения: отработанный алгоритм, уверенное информирование, чёткие команды, изоляция паникёров."}, {"q": "Почему ЧС экологического характера психологически переносятся особенно тяжело?", "ok": "Угроза невидима и растянута во времени, что порождает хроническую тревогу и недоверие к информации", "bad": ["Они всегда сопровождаются наибольшим числом жертв", "Они происходят внезапнее природных", "Они не вызывают острых стрессовых реакций"], "why": "Радиационное или химическое загрязнение не воспринимается органами чувств, отсюда радиофобия и ипохондрические реакции."}, {"q": "У всех, кто пережил ЧС, развивается ПТСР?", "ok": "Нет, у большинства острые реакции угасают, расстройство формируется у меньшинства", "bad": ["Да, ПТСР — обязательное следствие любой ЧС", "ПТСР развивается только у спасателей", "ПТСР возникает исключительно при техногенных ЧС"], "why": "Вероятность зависит от тяжести события, предшествующей травматизации, личностных ресурсов и социальной поддержки после события."}]}, {"n": 52, "title": "Терроризм как угроза современному обществу", "kostyak": ["Терроризм определяется как идеология насилия и практика воздействия на принятие решений органами власти или международными организациями, связанная с устрашением населения. Это определение закреплено в Федеральном законе «О противодействии терроризму».", "Ключевой признак — тройственная структура: есть непосредственная жертва, есть адресат воздействия, и это разные субъекты. Насилие применяется к одним, а давление оказывается на других. Отсюда демонстративность и расчёт на публичность.", "Виды принято выделять по целям: политический, религиозный, националистический, экономический, криминальный. По средствам — обычный, а также ядерный, химический, биологический и кибертерроризм.", "Причины группируются так. Социально-экономические: бедность, безработица, резкое расслоение. Политические: неурегулированные конфликты, сепаратизм. Идеологические и религиозные: радикальные учения, оправдывающие насилие. Социально-психологические: маргинализация, поиск идентичности, чувство несправедливости.", "Международный терроризм — форма, при которой организации действуют на территории нескольких государств, имеют трансграничное финансирование, вербовку и логистику. Его особенность — использование интернета для пропаганды и рекрутинга.", "Противодействие в России строится по трём направлениям, обозначенным в законодательстве: профилактика терроризма, борьба с терроризмом и минимизация последствий. Работает Национальный антитеррористический комитет, действует система уровней террористической опасности.", "Отдельно — антитеррористическая защищённость объектов, включая объекты образования: категорирование, паспорт безопасности, инженерно-технические средства охраны. Поворот в сторону школы — профилактика терроризма и экстремизма в образовательной организации. Этот поворот вероятен, к нему надо быть готовым. - Правовая рамка: Федеральный закон «О противодействии экстремистской деятельности», Федеральный закон «О противодействии терроризму», стратегические документы по противодействию экстремизму. - Направления работы: информационно-разъяснительная работа с обучающимися и родителями, формирование установок неприятия насилия, развитие межнациональной и межконфессиональной толерантности, мониторинг социальных сетей на предмет вовлечённости, раннее выявление подростков в группе риска. - Организационные меры: контрольно-пропускной режим, тренировки по эвакуации, инструктажи, действия при обнаружении подозрительного предмета, порядок действий при угрозе по телефону. - Роль психолога: диагностика деструктивных установок, работа с агрессией, сопровождение подростков с признаками социальной изоляции."], "terms": ["идеология насилия", "устрашение населения", "террористический акт", "экстремизм", "радикализация", "вербовка", "антитеррористическая защищённость", "категорирование объекта", "паспорт безопасности", "уровни террористической опасности", "деструктивные сообщества"], "follow": [{"q": "Чем терроризм отличается от экстремизма?", "a": "Экстремизм шире — это приверженность крайним взглядам и методам. Терроризм — крайняя форма его реализации, через насилие с целью устрашения."}, {"q": "Какие признаки радикализации подростка может заметить педагог?", "a": "Резкая смена круга общения и внешнего вида, появление закрытой символики, разрыв с семьёй, оправдание насилия в речи, интерес к закрытым сетевым сообществам."}], "notes": [{"label": "Заходит от психологии", "text": "психология террориста — почему в науке не подтверждается версия о специфическом «профиле личности террориста», и почему объяснение сместилось к групповым механизмам: деиндивидуализация, конформизм, моральное разобщение, подчинение авторитету. Механизм вербовки подростка: работа с потребностью в признании, изоляция от прежнего окружения, поэтапное вовлечение."}], "block": "Социальные угрозы", "bk": "soc", "tier": 2, "psy": false, "aid": false, "core": "Терроризм — идеология насилия и практика устрашения населения ради воздействия на принятие решений органами власти; его отличает тройственная структура, где непосредственная жертва и адресат воздействия — разные субъекты.", "anchors": ["идеология насилия", "жертва ≠ адресат", "демонстративность", "радикализация и вербовка", "профилактика", "борьба", "минимизация"], "simple": ["Определение закреплено в Федеральном законе «О противодействии терроризму»: идеология насилия и практика воздействия на принятие решений органами власти, связанная с устрашением населения.", "Ключевой признак — тройственная структура: насилие применяют к непосредственной жертве, а давление оказывают на другого адресата. Отсюда демонстративность и расчёт на публичность.", "Виды по целям: политический, религиозный, националистический, экономический, криминальный. По средствам — обычный, а также ядерный, химический, биологический и кибертерроризм.", "Причины группируются: социально-экономические (бедность, безработица, расслоение), политические (неурегулированные конфликты, сепаратизм), идеологические и религиозные (учения, оправдывающие насилие), социально-психологические (маргинализация, поиск идентичности, чувство несправедливости).", "Наука не подтверждает существование особого «профиля личности террориста»; объяснение сместилось к групповым механизмам: деиндивидуализация, конформизм, моральное разобщение, подчинение авторитету. Вербовка подростка идёт по шагам: закрывают потребность в признании, изолируют от прежнего окружения, поднимают порог вовлечённости.", "Экстремизм шире терроризма — это приверженность крайним взглядам и методам; терроризм — крайняя форма его реализации через насилие с целью устрашения.", "Противодействие в законодательстве разложено на три направления: профилактика терроризма, борьба с ним и минимизация последствий; работает Национальный антитеррористический комитет, действуют уровни террористической опасности. Объекты образования защищают через категорирование, паспорт безопасности и инженерно-технические средства охраны."], "cards": [{"t": "Экстремизм", "d": "Приверженность крайним взглядам и методам действия; шире терроризма, который выступает его крайней насильственной формой."}, {"t": "Радикализация", "d": "Процесс постепенного усвоения человеком крайних взглядов и допущения насилия как законного средства."}, {"t": "Вербовка", "d": "Поэтапное втягивание человека в деструктивную группу через работу с его потребностью в признании, изоляцию от прежних связей и рост вовлечённости."}, {"t": "Антитеррористическая защищённость объекта", "d": "Состояние защищённости здания и территории, обеспеченное режимными, организационными и инженерно-техническими мерами."}, {"t": "Категорирование объекта", "d": "Отнесение объекта к категории по степени возможных последствий теракта; от категории зависит набор обязательных мер."}, {"t": "Деструктивные сообщества", "d": "Сетевые или офлайн-группы, формирующие у участников установки на насилие, саморазрушение или противоправное поведение."}], "quiz": [{"q": "Какой признак отличает терроризм от других насильственных преступлений?", "ok": "Непосредственная жертва и адресат воздействия — разные субъекты", "bad": ["Применение оружия или взрывных устройств", "Наличие группы соучастников", "Совершение преступления в общественном месте"], "why": "Насилие адресовано не жертве, а тем, чьё решение хотят изменить. Отсюда демонстративность и расчёт на публичность."}, {"q": "Как соотносятся понятия «экстремизм» и «терроризм»?", "ok": "Экстремизм шире, терроризм — крайняя форма его реализации через насилие", "bad": ["Это синонимы, различающиеся только правовой квалификацией", "Терроризм шире, экстремизм — его информационная составляющая", "Понятия не пересекаются: у них разные объекты посягательства"], "why": "Экстремизм — про крайние взгляды и методы вообще. Терроризм — конкретная насильственная практика с целью устрашения."}, {"q": "Что современная наука говорит о личности террориста?", "ok": "Специфический единый профиль личности не подтверждается, объяснение строится на групповых механизмах", "bad": ["Установлен устойчивый набор черт, позволяющий выявлять склонность заранее", "Определяющим признан низкий уровень интеллекта", "Ключевым фактором признано наличие психического расстройства"], "why": "Поиски единого профиля результата не дали. Работают деиндивидуализация, конформизм, моральное разобщение и подчинение авторитету."}, {"q": "Какой признак радикализации подрос
