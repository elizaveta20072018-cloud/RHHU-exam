<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF0EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0F0C" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Безопасность образовательной среды — подготовка к 28 июля</title>
<style>
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; }
  h1,h2,h3,p,ol,ul,figure { margin: 0; }
  ol,ul { padding: 0; list-style: none; }
  ol.kost { list-style: decimal; }
  button { font: inherit; color: inherit; }
  img { max-width: 100%; }
</style>
</head>
<body>
<style>
  :root {
    --ground: #EDF0EC; --card: #FFFFFF; --ink: #101711; --muted: #5B6A60;
    --line: #D2DAD3; --accent: #0E7A52; --accent-soft: #DCEBE2;
    --signal: #9C5B08; --signal-soft: #F5E7D2;
    --psy: #3B5C86; --psy-soft: #DEE7F2;
    --ok: #0E7A52; --ok-soft: #DCEBE2; --err: #A32C2C; --err-soft: #F6E0E0;
    --shadow: 0 1px 2px rgba(16,23,17,.06), 0 6px 16px rgba(16,23,17,.05);
    --r: 10px;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0B0F0C; --card: #141A15; --ink: #E4EAE5; --muted: #90A096;
      --line: #263028; --accent: #34B486; --accent-soft: #16301F;
      --signal: #D79A3C; --signal-soft: #302517;
      --psy: #8FB2DC; --psy-soft: #1B2634;
      --ok: #34B486; --ok-soft: #16301F; --err: #E08A8A; --err-soft: #331A1A;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 16px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --ground: #0B0F0C; --card: #141A15; --ink: #E4EAE5; --muted: #90A096;
    --line: #263028; --accent: #34B486; --accent-soft: #16301F;
    --signal: #D79A3C; --signal-soft: #302517;
    --psy: #8FB2DC; --psy-soft: #1B2634;
    --ok: #34B486; --ok-soft: #16301F; --err: #E08A8A; --err-soft: #331A1A;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 16px rgba(0,0,0,.3);
  }
  :root[data-theme="light"] {
    --ground: #EDF0EC; --card: #FFFFFF; --ink: #101711; --muted: #5B6A60;
    --line: #D2DAD3; --accent: #0E7A52; --accent-soft: #DCEBE2;
    --signal: #9C5B08; --signal-soft: #F5E7D2;
    --psy: #3B5C86; --psy-soft: #DEE7F2;
    --ok: #0E7A52; --ok-soft: #DCEBE2; --err: #A32C2C; --err-soft: #F6E0E0;
    --shadow: 0 1px 2px rgba(16,23,17,.06), 0 6px 16px rgba(16,23,17,.05);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--sans); font-size: 17px; line-height: 1.55;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 44rem; margin: 0 auto; padding: 0 14px 96px; }

  .top {
    position: sticky; top: 0; z-index: 20; background: var(--ground);
    border-bottom: 1px solid var(--line); margin: 0 -14px 16px; padding: 10px 14px 0;
  }
  .toprow { display: flex; align-items: baseline; gap: 10px; }
  .brand { font-size: 15px; font-weight: 680; letter-spacing: -.01em; }
  .countdown {
    margin-left: auto; font-family: var(--mono); font-size: 13px;
    font-variant-numeric: tabular-nums; color: var(--signal); font-weight: 600;
  }
  .bar { height: 3px; background: var(--line); margin-top: 9px; }
  .bar > i { display: block; height: 100%; background: var(--accent); transition: width .35s ease; }
  .barlbl {
    display: flex; justify-content: space-between; padding: 5px 0 8px;
    font-family: var(--mono); font-size: 11.5px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding-bottom: 10px; }
  .tab {
    padding: 8px 4px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--card); font-size: 14px; cursor: pointer;
  }
  .tab[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); font-weight: 600; }

  .today {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
    padding: 15px 16px; box-shadow: var(--shadow); margin-bottom: 18px;
  }
  .today h2 {
    margin: 0 0 3px; font-size: 12px; font-weight: 640; text-transform: uppercase;
    letter-spacing: .1em; color: var(--muted);
  }
  .bignum { font-size: 40px; font-weight: 720; letter-spacing: -.035em; line-height: 1.05; }
  .bignum span { font-size: 17px; font-weight: 500; letter-spacing: 0; color: var(--muted); }
  .today p { margin: 8px 0 0; font-size: 14.5px; color: var(--muted); }
  .queue { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .qchip {
    font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums;
    background: var(--accent-soft); color: var(--accent); border-radius: 5px;
    padding: 3px 7px; font-weight: 600;
  }

  .tools { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 16px; }
  button {
    font: inherit; font-size: 13.5px; cursor: pointer; border-radius: 7px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    padding: 7px 12px; transition: border-color .15s, background .15s;
  }
  button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tools button[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
  .primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }

  .view { display: none; }
  .view[data-on="1"] { display: block; }

  /* ── темы ── */
  .tier { margin: 26px 0 10px; }
  .tier h3 { margin: 0; font-size: 16px; font-weight: 680; letter-spacing: -.01em; }
  .tier p { margin: 3px 0 0; font-size: 13.5px; color: var(--muted); }

  .item {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
    margin-bottom: 7px; overflow: hidden; position: relative;
  }
  .item::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0;
    background: var(--accent); opacity: .85;
  }
  .item[data-tier="1"]::before { width: 5px; }
  .item[data-tier="2"]::before { width: 3px; }
  .item[data-tier="3"]::before { width: 1.5px; opacity: .5; }
  .item[data-done="1"] { opacity: .58; }
  .item[data-done="1"]::before { background: var(--muted); }

  .head {
    display: flex; align-items: flex-start; gap: 10px; width: 100%;
    text-align: left; background: none; border: 0; border-radius: 0;
    padding: 12px 13px 12px 20px;
  }
  .head:hover { border-color: transparent; background: var(--accent-soft); }
  .num {
    font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums;
    color: var(--muted); min-width: 2.1em; padding-top: 2px; font-weight: 600;
  }
  .ttl { flex: 1; font-size: 15.5px; line-height: 1.4; font-weight: 520; }
  .core-line { display: block; font-size: 14px; color: var(--muted); margin-top: 5px; line-height: 1.45; }
  .flags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
  .flag {
    font-size: 11px; font-weight: 640; letter-spacing: .03em; border-radius: 4px;
    padding: 2px 6px; text-transform: uppercase;
  }
  .f-aid { background: var(--signal-soft); color: var(--signal); }
  .f-psy { background: var(--psy-soft); color: var(--psy); }
  .f-core { background: var(--accent-soft); color: var(--accent); }
  .tick { font-size: 17px; color: var(--accent); padding-top: 1px; min-width: 1em; }

  .body { display: none; padding: 2px 15px 16px 20px; border-top: 1px solid var(--line); }
  .item[data-open="1"] .body { display: block; }
  .lbl {
    font-size: 11.5px; font-weight: 640; text-transform: uppercase; letter-spacing: .1em;
    color: var(--muted); margin: 16px 0 7px;
  }
  .core-box {
    background: var(--accent-soft); border-radius: 8px; padding: 11px 13px;
    font-size: 16px; line-height: 1.5; margin-top: 14px;
  }
  .anchors { display: flex; flex-wrap: wrap; gap: 6px; }
  .anchor {
    font-size: 13.5px; font-weight: 600; background: var(--card);
    border: 1.5px solid var(--accent); color: var(--accent);
    border-radius: 6px; padding: 4px 9px;
  }
  ul.simple { margin: 0; padding-left: 1.15em; list-style: disc; }
  ul.simple li { margin-bottom: 7px; font-size: 15.5px; line-height: 1.5; }
  ul.simple li::marker { color: var(--accent); }
  ul.retell { margin: 0; padding: 0; list-style: none; }
  ul.retell li {
    position: relative; margin: 0; padding: 9px 0 9px 15px;
    font-size: 16px; line-height: 1.5; border-bottom: 1px solid var(--line);
  }
  ul.retell li:last-child { border-bottom: 0; }
  ul.retell li::before {
    content: ""; position: absolute; left: 0; top: 13px; bottom: 13px; width: 3px;
    background: var(--accent); border-radius: 2px;
  }
  .core-box { font-weight: 520; }
  ol.kost { margin: 0; padding-left: 1.3em; }
  ol.kost li { margin-bottom: 9px; font-size: 15.5px; line-height: 1.52; }
  ol.kost li::marker { color: var(--accent); font-family: var(--mono); font-size: 13px; }
  .terms { display: flex; flex-wrap: wrap; gap: 5px; }
  .term {
    font-size: 13px; background: var(--ground); border: 1px solid var(--line);
    border-radius: 5px; padding: 3px 8px; color: var(--ink);
  }
  .note {
    border-left: 2px solid var(--psy); background: var(--psy-soft);
    padding: 9px 12px; border-radius: 0 6px 6px 0; margin-bottom: 8px; font-size: 14.5px;
  }
  .note b { display: block; font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--psy); margin-bottom: 3px; }
  .fu { border-top: 1px dashed var(--line); padding-top: 9px; margin-top: 9px; font-size: 14.5px; }
  .fu q { display: block; font-weight: 620; quotes: none; margin-bottom: 3px; }
  .fu q::before, .fu q::after { content: ""; }
  .fu div { color: var(--muted); }
  .done-btn { margin-top: 18px; width: 100%; }
  .empty { text-align: center; color: var(--muted); padding: 36px 0; font-size: 15px; }
  details.more { margin-top: 16px; }
  details.more > summary {
    cursor: pointer; font-size: 13.5px; color: var(--muted); padding: 6px 0; list-style: none;
  }
  details.more > summary::-webkit-details-marker { display: none; }
  details.more > summary::before { content: "▸ "; }
  details.more[open] > summary::before { content: "▾ "; }

  /* ── карточки ── */
  .flash {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); padding: 30px 22px; min-height: 40vh;
    display: flex; flex-direction: column; justify-content: center; text-align: center;
    cursor: pointer; margin-bottom: 14px;
  }
  .flash .side { font-size: 11.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 12px; }
  .flash .front { font-size: 25px; font-weight: 660; letter-spacing: -.02em; line-height: 1.3; text-wrap: balance; }
  .flash .back { font-size: 17px; line-height: 1.55; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
  .flash .tap { font-size: 13.5px; color: var(--muted); margin-top: 18px; }
  .fromtopic { font-size: 13px; color: var(--muted); margin-top: 16px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .deckinfo { text-align: center; color: var(--muted); font-size: 13.5px; margin-top: 12px; }

  /* ── тест ── */
  .qbox { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 17px 16px; box-shadow: var(--shadow); }
  .qtext { font-size: 18px; font-weight: 600; line-height: 1.42; margin-bottom: 14px; text-wrap: balance; }
  .opts { display: flex; flex-direction: column; gap: 8px; }
  .opt { text-align: left; padding: 12px 14px; font-size: 15.5px; line-height: 1.42; border-radius: 8px; white-space: normal; }
  .opt[data-state="ok"] { background: var(--ok-soft); border-color: var(--ok); }
  .opt[data-state="err"] { background: var(--err-soft); border-color: var(--err); }
  .opt[disabled] { cursor: default; }
  .why { margin-top: 14px; padding: 11px 13px; border-radius: 8px; background: var(--ground); font-size: 15px; }
  .why b { color: var(--accent); }
  .score { font-size: 42px; font-weight: 720; letter-spacing: -.035em; }
  .wrongitem { border-left: 3px solid var(--err); padding: 4px 0 4px 12px; margin-bottom: 12px; font-size: 15px; }
  .wrongitem b { display: block; font-weight: 620; margin-bottom: 2px; }
  .wrongitem span { color: var(--muted); }

  /* ── озвучка ── */
  .itemhead { display: flex; align-items: stretch; }
  .itemhead .head { flex: 1; min-width: 0; }
  .listen {
    flex: none; width: 48px; border: 0; border-left: 1px solid var(--line);
    border-radius: 0; background: none; color: var(--accent); font-size: 19px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .listen:hover { background: var(--accent-soft); border-color: var(--line); }
  .listen[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .item[data-playing="1"] { outline: 2px solid var(--accent); outline-offset: -1px; }
  .item[data-playing="1"]::before { opacity: 1; }

  .player {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
    background: var(--card); border-top: 1px solid var(--line);
    box-shadow: 0 -4px 18px rgba(0,0,0,.14);
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 10px;
  }
  .player[hidden] { display: none; }
  .pinfo { flex: 1; min-width: 0; font-size: 13px; line-height: 1.3; }
  .pinfo span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  .pinfo b { color: var(--accent); font-family: var(--mono); font-weight: 600; }
  .pctrl { display: flex; gap: 4px; flex: none; }
  .pctrl button { padding: 8px 9px; font-size: 15px; line-height: 1; }
  #pRate { font-size: 13px; font-weight: 600; min-width: 42px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (min-width: 640px) { body { font-size: 17.5px; } .wrap { padding: 0 20px 96px; } }
</style>

<div class="wrap">
  <div class="top">
    <div class="toprow">
      <div class="brand">Безопасность образовательной среды</div>
      <div class="countdown" id="cd"></div>
    </div>
    <div class="bar"><i id="bar" style="width:0%"></i></div>
    <div class="barlbl"><span id="pct">0%</span><span id="cnt">0 из 66</span></div>
    <div class="tabs">
      <button class="tab" id="tTopics" aria-pressed="true">Темы</button>
      <button class="tab" id="tCards" aria-pressed="false">Карточки</button>
      <button class="tab" id="tQuiz" aria-pressed="false">Тест</button>
    </div>
  </div>

  <div class="view" id="vTopics" data-on="1">
    <div class="today">
      <h2>Норма на сегодня</h2>
      <div class="bignum" id="rate">—</div>
      <p id="hint"></p>
      <div class="queue" id="queue"></div>
    </div>
    <div class="tools">
      <button class="primary" id="drillBtn">Случайная тема</button>
      <button id="playAll" title="Читать все видимые темы вслух подряд">▶ Слушать всё</button>
      <button id="fAll" aria-pressed="true">Все</button>
      <button id="fLeft" aria-pressed="false">Не пройдено</button>
      <button id="fAid" aria-pressed="false">Первая помощь</button>
      <button id="fPsy" aria-pressed="false">Его темы</button>
      <button id="reset">Сбросить</button>
    </div>
    <div id="list"></div>
  </div>

  <div class="view" id="vCards">
    <div class="tools">
      <button id="cAll" aria-pressed="true">Все карточки</button>
      <button id="cLeft" aria-pressed="false">Только неотмеченные</button>
      <button id="cShuffle">Перемешать</button>
    </div>
    <div id="cardArea"></div>
  </div>

  <div class="view" id="vQuiz">
    <div id="quizArea"></div>
  </div>
</div>

<div class="player" id="player" hidden>
  <div class="pinfo"><span id="pTitle"></span></div>
  <div class="pctrl">
    <button id="pPrev" aria-label="Предыдущая тема">⏮</button>
    <button id="pPlay" aria-label="Пауза">⏸</button>
    <button id="pNext" aria-label="Следующая тема">⏭</button>
    <button id="pRate" aria-label="Скорость">1×</button>
    <button id="pStop" aria-label="Остановить">✕</button>
  </div>
</div>

<script>
const TOPICS = [{"n": 1, "title": "Понятие «безопасность». Система «Природа – Общество – Человек»", "kostyak": ["«Безопасность — это состояние защищённости жизненно важных интересов человека, общества и государства от внутренних и внешних угроз. Это определение принято в отечественной науке и в законодательстве».", "«Второе прочтение, инженерное: безопасность — это состояние системы, при котором риск причинения вреда не превышает приемлемого уровня. То есть безопасность измерима через риск».", "«Ключевая мысль: безопасность — не отсутствие опасности, а её удержание в допустимых границах. Абсолютной безопасности не существует».", "«Система „Природа – Общество – Человек“ описывает три взаимодействующие среды. Человек одновременно и объект защиты, и источник угроз. Общество задаёт нормы и институты защиты. Природа — и ресурс, и источник опасностей, и сторона, страдающая от человека».", "«Объект безопасности — то, что защищаем: жизнь, здоровье, права личности, материальные и духовные ценности общества, конституционный строй и территориальная целостность государства».", "«Субъект безопасности — тот, кто обеспечивает защиту: государство, его органы, институты общества, сам человек. Отсюда важная деталь — человек и объект, и субъект собственной безопасности».", "«Предмет науки о безопасности — опасности, их источники, закономерности проявления и способы защиты. Методы: системный анализ, моделирование, статистический и вероятностный анализ, экспертные оценки, мониторинг и прогнозирование, нормирование».", "«Теория даёт понятийный аппарат и модели, практика — конкретные системы защиты. Системы безопасности выделяют по объекту: личная, коллективная, национальная, глобальная»."], "terms": ["жизненно важные интересы", "состояние защищённости", "объект и субъект безопасности", "приемлемый риск", "системный подход", "природно-социально-техническая среда", "мониторинг и прогнозирование", "нормирование"], "follow": [{"q": "Почему безопасность нельзя понимать как отсутствие опасности?", "a": "— Потому что любая деятельность потенциально опасна: это аксиома БЖД. Полностью убрать риск невозможно ни технически, ни экономически, поэтому цель — снижение до приемлемого уровня."}, {"q": "Человек — объект или субъект безопасности?", "a": "— И то, и другое. Его защищают, но и он сам через свою подготовку, поведение и решения обеспечивает или разрушает безопасность — свою и чужую."}], "notes": [], "block": "Теория, риск, ЗОЖ", "bk": "teor", "tier": 1, "psy": false, "aid": false, "core": "Безопасность — это не отсутствие опасности, а удержание риска в допустимых границах; абсолютной безопасности не существует. У понятия два определения — правовое и инженерное, — а человек в системе безопасности одновременно и тот, кого защищают, и тот, кто защищает.", "anchors": ["защищённость жизненно важных интересов", "измеримость через риск", "объект и субъект", "Природа–Общество–Человек"], "simple": ["Правовое определение: безопасность — состояние защищённости жизненно важных интересов человека, общества и государства от внутренних и внешних угроз; так закреплено в законодательстве.", "Инженерное определение: безопасность — состояние системы, при котором риск причинения вреда не превышает приемлемого уровня; его плюс — безопасность становится измеримой через риск.", "Любая деятельность потенциально опасна, поэтому цель — не убрать опасность полностью, а снизить риск до приемлемого. Приемлемый риск — уровень, с которым общество на данном этапе согласно мириться.", "Объект безопасности — что защищают: жизнь и здоровье, права личности, ценности общества, конституционный строй и целостность государства. Субъект — кто защищает: государство и его органы, институты общества, сам человек. Человек попадает в обе колонки.", "Система «Природа — Общество — Человек»: природа даёт ресурсы и несёт стихийные опасности, общество задаёт нормы и институты защиты, а человек и страдает от опасностей, и сам их порождает.", "Логика темы связывается в цепочку: опасность → источник → поражающий фактор → последствие → риск → управление риском."], "cards": [{"t": "Безопасность (правовое понимание)", "d": "состояние защищённости жизненно важных интересов человека, общества и государства от внутренних и внешних угроз"}, {"t": "Безопасность (инженерное понимание)", "d": "состояние системы, при котором риск причинения вреда не превышает приемлемого уровня"}, {"t": "Объект безопасности", "d": "то, что защищают: жизнь и здоровье, права личности, ценности общества, строй и целостность государства"}, {"t": "Субъект безопасности", "d": "тот, кто обеспечивает защиту: государство и его органы, институты общества, сам человек"}, {"t": "Приемлемый риск", "d": "уровень риска, с которым общество на данном этапе согласно мириться"}], "quiz": [{"q": "Какое утверждение верно для современного понимания безопасности?", "ok": "Безопасность — удержание риска в допустимых границах, абсолютной безопасности не бывает", "bad": ["Безопасность — полное отсутствие опасностей в среде обитания", "Безопасность достигается, когда вероятность любой аварии равна нулю", "Безопасность — характеристика только технических систем"], "why": "Любая деятельность потенциально опасна, поэтому цель — снижение риска до приемлемого, а не его устранение."}, {"q": "Человек в системе безопасности — это:", "ok": "и объект, и субъект безопасности", "bad": ["только объект защиты", "только субъект, обеспечивающий защиту", "ни то ни другое, он элемент природной среды"], "why": "Его защищают, но своим поведением и подготовкой он сам обеспечивает или разрушает безопасность — свою и чужую."}, {"q": "Что относится к методам науки о безопасности?", "ok": "Системный анализ, моделирование, вероятностный анализ, экспертные оценки, мониторинг и прогнозирование", "bad": ["Только лабораторный эксперимент", "Только правовая экспертиза документов", "Только опрос населения"], "why": "Наука о безопасности изучает опасности, их источники и способы защиты, и опирается на системный подход и вероятностные методы."}]}, {"n": 4, "title": "Понятие «опасность». Виды опасностей и их источники", "kostyak": ["«Опасность — свойство объектов, процессов или явлений причинять вред человеку, обществу или природной среде. Она существует всегда, вопрос только в вероятности реализации».", "«Отправная точка — аксиома о потенциальной опасности любой деятельности: не бывает деятельности с нулевым риском».", "«По происхождению опасности делят на природные, антропогенные, техногенные, социальные, биологические, экологические. Отдельно выделяют глобальные».", "«Природные — землетрясения, наводнения, ураганы, лесные пожары, оползни, эпидемии. Источник — процессы в природной среде, человек на них почти не влияет, но может усиливать последствия застройкой опасных территорий».", "«Антропогенные — вызванные непосредственно действием или бездействием человека: ошибка, нарушение правил, умысел, низкая квалификация».", "«Техногенные — связанные с работой технических систем: аварии на производстве, транспорте, энергетике, выбросы химически опасных и радиоактивных веществ. Причины — износ оборудования, конструктивные и технологические просчёты, отказ систем защиты».", "«Глобальные затрагивают человечество в целом: изменение климата, истощение ресурсов, загрязнение биосферы, пандемии, угроза применения оружия массового поражения».", "«Причины возникновения сводятся к трём группам: естественные процессы, несовершенство техники, человеческий фактор. И по статистике аварий человеческий фактор — ведущая группа причин»."], "terms": ["потенциальная опасность", "аксиома о потенциальной опасности деятельности", "номенклатура опасностей", "источник опасности", "человеческий фактор", "техногенная авария", "поражающий фактор", "глобальные опасности"], "follow": [{"q": "Чем антропогенная опасность отличается от техногенной?", "a": "— Антропогенная исходит непосредственно от человека и его действий, техногенная — от техники и технологий. Граница подвижная: авария по вине оператора техногенна по форме и антропогенна по причине."}, {"q": "Что такое номенклатура опасностей?", "a": "— Систематизированный перечень опасностей для конкретного объекта или вида деятельности. Составляется на этапе идентификации, чтобы ничего не пропустить при оценке риска."}], "notes": [], "block": "Теория, риск, ЗОЖ", "bk": "teor", "tier": 1, "psy": false, "aid": false, "core": "Опасность — свойство любого объекта, процесса или явления причинить вред, и она существует всегда. Отправная точка — аксиома о потенциальной опасности: деятельности с нулевым риском не бывает.", "anchors": ["аксиома о потенциальной опасности", "природные", "антропогенные", "техногенные", "номенклатура опасностей", "человеческий фактор"], "simple": ["Опасность — свойство объектов, процессов или явлений причинять вред человеку, обществу или природной среде; существует всегда, вопрос только в вероятности реализации.", "Аксиома о потенциальной опасности: любая деятельность потенциально опасна, деятельности с нулевым риском не существует. Отсюда прямо следует концепция приемлемого риска.", "По происхождению опасности делят на природные, антропогенные, техногенные, социальные, биологические, экологические; отдельно выделяют глобальные.", "Природные опасности (землетрясения, наводнения, ураганы, пожары) человек почти не создаёт, но усиливает последствия застройкой опасных территорий. Антропогенные исходят от действия или бездействия человека, техногенные — от работы технических систем; граница подвижна: авария по вине оператора техногенна по форме и антропогенна по причине.", "Глобальные опасности затрагивают человечество в целом: изменение климата, истощение ресурсов, загрязнение биосферы, пандемии, угроза оружия массового поражения.", "Номенклатура опасностей — систематизированный перечень опасностей для конкретного объекта; составляют его на этапе идентификации, чтобы ничего не пропустить при оценке риска. Причины сводятся к трём группам — природа, техника, человек, — и человеческий фактор по статистике ведущий."], "cards": [{"t": "Опасность", "d": "свойство объектов, процессов или явлений причинять вред человеку, обществу или природной среде"}, {"t": "Аксиома о потенциальной опасности", "d": "любая деятельность потенциально опасна, деятельности с нулевым риском не существует"}, {"t": "Антропогенная опасность", "d": "опасность, исходящая непосредственно от действия или бездействия человека"}, {"t": "Техногенная опасность", "d": "опасность, связанная с работой технических систем и технологий"}, {"t": "Номенклатура опасностей", "d": "систематизированный перечень опасностей для конкретного объекта или вида деятельности"}, {"t": "Глобальные опасности", "d": "опасности, затрагивающие человечество в целом: климат, истощение ресурсов, загрязнение биосферы, пандемии, ОМП"}], "quiz": [{"q": "Аксиома о потенциальной опасности деятельности утверждает, что:", "ok": "Любая деятельность потенциально опасна, нулевого риска не существует", "bad": ["Опасна только производственная деятельность", "Опасность проявляется лишь при нарушении правил", "Риск можно свести к нулю при достаточных затратах"], "why": "Из этой аксиомы прямо следует концепция приемлемого риска: раз ноль недостижим, снижаем до допустимого уровня."}, {"q": "Авария произошла из-за ошибки оператора. Как её квалифицировать?", "ok": "Техногенная по форме и антропогенная по причине", "bad": ["Только природная", "Только антропогенная, техника здесь ни при чём", "Опасность вообще не классифицируется по происхождению"], "why": "Граница между антропогенной и техногенной опасностью подвижна, и такие случаи как раз пограничные."}, {"q": "Номенклатура опасностей составляется:", "ok": "На этапе идентификации опасностей, чтобы ничего не пропустить при оценке риска", "bad": ["После ликвидации последствий аварии", "Только для природных явлений", "Вместо оценки риска"], "why": "Идентификация — первый шаг управления риском, и перечень опасностей нужен именно там."}]}, {"n": 3, "title": "Вред, ущерб, риск: виды и характеристики", "kostyak": ["«Три понятия выстроены в цепочку. Вред — само неблагоприятное изменение: утрата здоровья, повреждение имущества, ухудшение состояния природной среды. Ущерб — вред, выраженный количественно, чаще всего в деньгах. Риск — мера возможности того, что вред наступит».", "«Виды вреда: физический — травма, заболевание, гибель; имущественный; моральный; экологический».", "«Ущерб делят на прямой и косвенный. Прямой — разрушенное и утраченное сразу. Косвенный — упущенная выгода, простой производства, затраты на восстановление, отдалённые последствия для здоровья».", "«Риск — количественная характеристика опасности. Считается как отношение числа неблагоприятных событий к общему числу возможных за определённый период, либо как произведение вероятности на тяжесть последствий».", "«Индивидуальный риск — вероятность поражения конкретного человека за год от конкретного фактора. Социальный, или групповой, риск — зависимость между числом пострадавших и вероятностью такого события; он показывает опасность катастроф с массовыми жертвами».", "«Приемлемый риск — уровень, с которым общество на данном этапе согласно мириться, потому что дальнейшее снижение слишком дорого либо технически невозможно».", "«Ещё различают мотивированный и немотивированный риск. Мотивированный — осознанный, ради спасения людей или значимого результата: работа спасателя, пожарного. Немотивированный — риск от небрежности, лихачества, нарушения правил без всякой выгоды».", "«Отдельно — профессиональный, экологический, техногенный риск: это уже деление по природе источника»."], "terms": ["вред", "ущерб", "риск", "прямой и косвенный ущерб", "индивидуальный риск", "социальный (групповой) риск", "приемлемый риск", "мотивированный и немотивированный риск", "тяжесть последствий", "упущенная выгода"], "follow": [{"q": "Зачем нужен именно социальный риск, если есть индивидуальный?", "a": "— Индивидуальный риск может быть низким, но событие способно унести сотни жизней разом. Общество воспринимает одну катастрофу с массовыми жертвами гораздо острее, чем ту же смертность, размазанную по годам. Социальный риск это отражает."}, {"q": "Мотивированный риск — это всегда оправданно?", "a": "— Нет. Он оправдан, когда ожидаемая польза превышает возможный вред и когда приняты меры защиты. Иначе это уже авантюра, а не профессиональный риск."}], "notes": [], "block": "Теория, риск, ЗОЖ", "bk": "teor", "tier": 1, "psy": false, "aid": false, "core": "Вред — само повреждение, ущерб — тот же вред в цифрах и деньгах, риск — мера возможности того, что вред наступит. Три слова стоят в одной цепочке, и путать их нельзя.", "anchors": ["вред → ущерб → риск", "прямой и косвенный", "индивидуальный и социальный", "приемлемый риск"], "simple": ["Вред — само неблагоприятное изменение: утрата здоровья, повреждение имущества, ухудшение природной среды. Ущерб — вред, выраженный количественно, чаще всего в деньгах. Риск — мера возможности того, что вред наступит.", "Виды вреда: физический (травма, заболевание, гибель), имущественный, моральный, экологический.", "Ущерб делят на прямой и косвенный: прямой — разрушенное и утраченное сразу, косвенный — упущенная выгода, простой производства, затраты на восстановление, отдалённые последствия. Косвенный часто больше прямого.", "Индивидуальный риск — вероятность поражения конкретного человека за год от конкретного фактора. Социальный (групповой) риск — зависимость между числом пострадавших и вероятностью такого события; он показывает опасность катастроф с массовыми жертвами.", "Разделяют их потому, что индивидуальный риск от авиации мал, но одна катастрофа уносит сотни жизней разом, и общество реагирует на это острее, чем на ту же смертность, размазанную по годам, — это и ловит социальный риск.", "Ещё различают мотивированный риск (осознанный, ради спасения людей или значимого результата при принятых мерах защиты — спасатель, пожарный) и немотивированный (от небрежности, лихачества, нарушения правил без всякой выгоды)."], "cards": [{"t": "Вред", "d": "само неблагоприятное изменение: утрата здоровья, повреждение имущества, ухудшение состояния природной среды"}, {"t": "Ущерб", "d": "вред, выраженный количественно, чаще всего в денежной форме"}, {"t": "Прямой ущерб", "d": "разрушенное и утраченное непосредственно в результате события"}, {"t": "Косвенный ущерб", "d": "упущенная выгода, простой производства, затраты на восстановление, отдалённые последствия"}, {"t": "Индивидуальный риск", "d": "вероятность поражения конкретного человека за год от конкретного фактора"}, {"t": "Социальный (групповой) риск", "d": "зависимость между числом пострадавших и вероятностью такого события; показывает опасность катастроф с массовыми жертвами"}, {"t": "Мотивированный риск", "d": "осознанный риск ради спасения людей или значимого результата при принятых мерах защиты"}], "quiz": [{"q": "Чем ущерб отличается от вреда?", "ok": "Ущерб — это вред, выраженный количественно, чаще всего в деньгах", "bad": ["Ущерб касается только людей, а вред только имущества", "Вред наступает сразу, а ущерб всегда отсроченно", "Это полные синонимы"], "why": "Вред — само изменение, ущерб — его измеренная величина."}, {"q": "Социальный (групповой) риск описывает:", "ok": "Зависимость между числом пострадавших и вероятностью такого события", "bad": ["Вероятность поражения конкретного человека за год", "Отношение затрат на защиту к её эффективности", "Уровень тревожности населения по опросам"], "why": "Это про катастрофы с массовыми жертвами. Вероятность для одного человека — уже индивидуальный риск."}, {"q": "Приемлемый риск — это:", "ok": "Уровень риска, с которым общество на данном этапе согласно мириться", "bad": ["Риск, полностью устранённый техническими средствами", "Риск, который человек принимает на себя добровольно", "Риск, не подлежащий страхованию"], "why": "Дальнейшее снижение либо слишком дорого, либо технически невозможно, поэтому обществу приходится согласиться с остаточным уровнем."}, {"q": "Упущенная выгода от простоя предприятия после аварии — это:", "ok": "Косвенный ущерб", "bad": ["Прямой ущерб", "Моральный вред", "Экологический вред"], "why": "Прямой — то, что разрушено сразу. Простой и недополученная прибыль относятся к косвенному."}]}, {"n": 43, "title": "Поражающие факторы ЧС: классификация и характеристика", "kostyak": ["«Поражающий фактор — составляющая опасного явления, которая непосредственно воздействует на людей, объекты и природную среду и вызывает поражение. Сама ЧС — событие, поражающий фактор — механизм причинения вреда».", "«По природе воздействия выделяют механические, тепловые, химические, радиационные, биологические, а также акустические, электромагнитные и психологические факторы».", "«Механические — ударная волна, обломки, обрушение конструкций, оползневые массы, поток воды. Результат — травмы, переломы, баротравма, гибель под завалами».", "«Тепловые — световое излучение, пламя, горячие газы. Вызывают ожоги кожи и дыхательных путей, тепловой удар, воспламенение материалов».", "«Химические — воздействие аварийно химически опасных веществ: отравления, поражение органов дыхания, ожоги, заражение местности и воды».", "«Радиационные — ионизирующее излучение: острая и хроническая лучевая болезнь, отдалённые последствия».", "«Биологические — патогенные микроорганизмы и токсины: инфекционные заболевания, эпидемии, эпизоотии».", "«Отдельно называю психологический фактор: острая реакция на стресс, паника, ступор, дезорганизация поведения. Он не оставляет физических следов, но резко увеличивает потери — из-за паники людей гибнет иногда больше, чем от самого поражающего явления».", "«По времени действия факторы делят на первичные и вторичные: землетрясение — первичный, а вызванный им пожар или разрушение плотины — вторичный. По длительности — мгновенные и пролонгированные»."], "terms": ["поражающий фактор", "первичные и вторичные факторы", "ударная волна", "световое излучение", "ионизирующее излучение", "АХОВ (аварийно химически опасные вещества)", "очаг поражения", "зона заражения", "санитарные и безвозвратные потери"], "follow": [{"q": "Приведите пример цепочки первичных и вторичных факторов.", "a": "— Землетрясение: первичный — сейсмический удар и обрушение зданий; вторичные — пожары от повреждённых сетей, утечка АХОВ с предприятия, затопление при разрушении гидросооружения, вспышка инфекций из-за нарушения водоснабжения."}, {"q": "Почему психологический фактор относят к поражающим?", "a": "— Потому что он самостоятельно приводит к потерям: паника вызывает давку, ступор мешает эвакуироваться, дезорганизация срывает действия спасателей."}], "notes": [], "block": "Теория, риск, ЗОЖ", "bk": "teor", "tier": 1, "psy": false, "aid": false, "core": "ЧС — это событие, а поражающий фактор — механизм, которым оно калечит: ударная волна, излучение, химия, паника. Именно фактор причиняет вред, а не сама ЧС.", "anchors": ["механизм причинения вреда", "по природе воздействия", "первичные и вторичные", "психологический фактор"], "simple": ["Поражающий фактор — составляющая опасного явления, которая непосредственно воздействует на людей, объекты и среду и вызывает поражение. ЧС — событие, поражающий фактор — механизм причинения вреда: землетрясение это событие, обрушение и удар — фактор.", "По природе воздействия факторы делят на механические (ударная волна, обломки, обрушение), тепловые (пламя, световое излучение — ожоги), химические (АХОВ — отравления, заражение местности), радиационные (ионизирующее излучение — лучевая болезнь), биологические (микроорганизмы и токсины — эпидемии); плюс акустические, электромагнитные и психологический.", "По времени действия факторы делят на первичные и вторичные: первичный порождён самим явлением, вторичный — его разрушениями. Землетрясение первично, пожар от разорванной газовой трубы вторичен.", "Психологический фактор не оставляет следов на теле, но самостоятельно ведёт к потерям: паника вызывает давку, ступор мешает эвакуироваться, дезорганизация срывает работу спасателей, и людей от него гибнет иногда больше, чем от самого явления.", "Потери делят на санитарные (пострадавшие, нуждающиеся в помощи) и безвозвратные (погибшие и пропавшие без вести). Территория, где действуют поражающие факторы, — очаг поражения."], "cards": [{"t": "Поражающий фактор", "d": "составляющая опасного явления, которая непосредственно воздействует на людей, объекты и среду и вызывает поражение"}, {"t": "Первичный поражающий фактор", "d": "фактор, порождённый самим опасным явлением"}, {"t": "Вторичный поражающий фактор", "d": "фактор, возникший как следствие разрушений от первичного (пожар, утечка АХОВ, затопление)"}, {"t": "АХОВ", "d": "аварийно химически опасные вещества, вызывающие отравления, поражение дыхательных путей, заражение местности и воды"}, {"t": "Очаг поражения", "d": "территория, в пределах которой действуют поражающие факторы и сосредоточены поражения"}, {"t": "Санитарные и безвозвратные потери", "d": "санитарные — пострадавшие, нуждающиеся в помощи; безвозвратные — погибшие и пропавшие без вести"}], "quiz": [{"q": "Что такое поражающий фактор ЧС?", "ok": "Составляющая опасного явления, непосредственно воздействующая на людей и объекты и вызывающая поражение", "bad": ["Само чрезвычайное событие", "Территория, на которой произошла ЧС", "Количество пострадавших в результате события"], "why": "ЧС — событие, поражающий фактор — механизм причинения вреда внутри этого события."}, {"q": "Пожар, возникший после землетрясения из-за повреждения газовых сетей, — это:", "ok": "Вторичный поражающий фактор", "bad": ["Первичный поражающий фактор", "Самостоятельная ЧС, не связанная с землетрясением", "Не поражающий фактор, а последствие"], "why": "Первичный — сейсмический удар и обрушение. Всё, что порождено разрушениями, вторично."}, {"q": "Почему психологическое воздействие относят к поражающим факторам?", "ok": "Оно самостоятельно приводит к потерям: паника вызывает давку, ступор мешает эвакуироваться", "bad": ["Оно причиняет только моральный вред без физических последствий", "Его относят к поражающим факторам ошибочно", "Оно проявляется исключительно у спасателей"], "why": "Фактор считается поражающим, если самостоятельно ведёт к поражениям и потерям, а паника это условие выполняет."}]}, {"n": 26, "title": "РСЧС: структура, организация, цели, задачи, деятельность. Программы обеспечения БЖД", "kostyak": ["РСЧС — это единая государственная система предупреждения и ликвидации чрезвычайных ситуаций. Она объединяет органы управления, силы и средства федеральных органов исполнительной власти, органов власти субъектов, органов местного самоуправления и организаций, в полномочия которых входит решение вопросов защиты населения и территорий от ЧС.", "Создана система была в начале девяностых годов сначала как Российская система предупреждения и действий в чрезвычайных ситуациях, а в середине девяностых преобразована в единую государственную систему. Правовая основа — федеральный закон «О защите населения и территорий от чрезвычайных ситуаций природного и техногенного характера».", "Цель системы — предупреждение возникновения и развития ЧС, снижение размеров ущерба и потерь, ликвидация чрезвычайных ситуаций.", "Задачи назову основные: разработка и реализация правовых и экономических норм в этой области; осуществление целевых и научно-технических программ по повышению устойчивости объектов; обеспечение готовности органов управления, сил и средств; сбор и обмен информацией; подготовка населения к действиям в ЧС; прогнозирование и оценка последствий; создание резервов финансовых и материальных ресурсов; ликвидация ЧС и социальная защита пострадавших.", "Теперь структура, это костяк вопроса. РСЧС состоит из функциональных и территориальных подсистем. Функциональные создаются федеральными органами исполнительной власти по отраслевому принципу — например, подсистема надзора в сфере защиты прав потребителей или подсистема Минздрава. Территориальные создаются в субъектах Российской Федерации и действуют в границах своих территорий.", "Система имеет пять уровней: федеральный, межрегиональный, региональный, муниципальный и объектовый.", "На каждом уровне создаются одни и те же типы органов и элементов. Координационные органы — это комиссии по предупреждению и ликвидации чрезвычайных ситуаций и обеспечению пожарной безопасности, сокращённо КЧС и ОПБ. Постоянно действующие органы управления — МЧС России, главные управления МЧС по субъектам, органы, специально уполномоченные на решение задач в области защиты населения. Органы повседневного управления — центры управления в кризисных ситуациях и единые дежурно-диспетчерские службы.", "Кроме органов, на каждом уровне есть силы и средства, резервы финансовых и материальных ресурсов, системы связи и оповещения и системы информационного обеспечения.", "Режимов функционирования три: режим повседневной деятельности при отсутствии угрозы; режим повышенной готовности при угрозе возникновения ЧС; режим чрезвычайной ситуации при её возникновении и ликвидации. Отдельно предусмотрены уровни реагирования, которые определяют, должностное лицо какого уровня руководит ликвидацией.", "Про программы. Обеспечение безопасности реализуется через государственные программы федерального уровня — прежде всего программу в области защиты населения и территорий от чрезвычайных ситуаций и обеспечения пожарной безопасности, которую ведёт МЧС России, — а на уровне субъектов через аналогичные региональные государственные программы. В муниципалитетах и организациях им соответствуют планы действий по предупреждению и ликвидации ЧС."], "terms": ["единая государственная система предупреждения и ликвидации ЧС", "федеральный закон «О защите населения и территорий от ЧС природного и техногенного характера»", "функциональные и территориальные подсистемы", "федеральный", "межрегиональный", "региональный", "муниципальный", "объектовый уровни", "координационные органы", "КЧС и ОПБ", "постоянно действующие органы управления", "органы повседневного управления", "ЕДДС", "центр управления в кризисных ситуациях", "режим повседневной деятельности", "режим повышенной готовности", "режим чрезвычайной ситуации", "резервы финансовых и материальных ресурсов"], "follow": [{"q": "Чем режим повышенной готовности отличается от режима ЧС?", "a": "Повышенная готовность вводится при угрозе возникновения ЧС: усиливается наблюдение и контроль, приводятся в готовность силы и средства, уточняются планы, при необходимости проводится упреждающая эвакуация. Режим ЧС вводится, когда ситуация уже возникла, и означает переход к ликвидации: развёртывание сил, проведение АСДНР, организацию жизнеобеспечения пострадавших."}, {"q": "Что такое ЕДДС и зачем она нужна?", "a": "Единая дежурно-диспетчерская служба муниципального образования. Это орган повседневного управления, который круглосуточно принимает сообщения об угрозах и происшествиях, оценивает их и координирует действия всех дежурных служб на территории. Именно она обеспечивает единый номер вызова экстренных служб."}], "notes": [{"label": "Разворот на школу", "text": "образовательная организация — это объектовое звено РСЧС. Отсюда объектовая комиссия по предупреждению и ликвидации ЧС и обеспечению пожарной безопасности, план действий по предупреждению и ликвидации ЧС, назначенный ответственный, тренировки и обучение работников. Школа — не сторонний наблюдатель системы, а её нижний уровень."}], "block": "ЧС, ГО, РСЧС", "bk": "chs", "tier": 1, "psy": false, "aid": false, "core": "РСЧС — единая государственная система предупреждения и ликвидации ЧС, объединяющая органы управления, силы и средства всех уровней власти и организаций. Её каркас — две группы подсистем, пять уровней, одинаковый набор органов на каждом уровне и три режима функционирования.", "anchors": ["подсистемы функциональные и территориальные", "пять уровней", "КЧС и ОПБ", "ЦУКС и ЕДДС", "три режима"], "simple": ["РСЧС — единая государственная система предупреждения и ликвидации ЧС; объединяет органы управления, силы и средства федеральных органов, органов власти субъектов, местного самоуправления и организаций. Правовая основа — федеральный закон «О защите населения и территорий от чрезвычайных ситуаций природного и техногенного характера».", "Система состоит из подсистем двух видов: функциональные создаются федеральными органами исполнительной власти по отраслевому принципу, территориальные — в субъектах РФ в границах их территорий.", "Уровней пять: федеральный, межрегиональный, региональный, муниципальный, объектовый. Межмуниципального уровня в РСЧС нет, хотя межмуниципальная ЧС по масштабу существует.", "На каждом уровне создаются одни и те же органы: координационные — комиссии по предупреждению и ликвидации ЧС и обеспечению пожарной безопасности (КЧС и ОПБ); постоянно действующие органы управления — МЧС России и его главные управления по субъектам; органы повседневного управления — центры управления в кризисных ситуациях (ЦУКС) и единые дежурно-диспетчерские службы (ЕДДС). Плюс силы и средства, резервы, системы связи и оповещения.", "Режимов функционирования три, по нарастанию: повседневная деятельность при отсутствии угрозы, повышенная готовность при угрозе ЧС, режим чрезвычайной ситуации при её возникновении и ликвидации.", "Различие повышенной готовности и режима ЧС — угроза против факта: при угрозе усиливают наблюдение, приводят силы в готовность, могут провести упреждающую эвакуацию; при факте переходят к ликвидации. Образовательная организация — объектовое звено РСЧС, самый нижний уровень системы."], "cards": [{"t": "РСЧС", "d": "единая государственная система предупреждения и ликвидации чрезвычайных ситуаций, объединяющая органы управления, силы и средства федеральных органов, органов власти субъектов, местного самоуправления и организаций"}, {"t": "Подсистемы РСЧС", "d": "функциональные (создаются федеральными органами исполнительной власти по отраслевому принципу) и территориальные (создаются в субъектах РФ в границах своих территорий)"}, {"t": "Уровни РСЧС", "d": "федеральный, межрегиональный, региональный, муниципальный, объектовый"}, {"t": "Режимы функционирования РСЧС", "d": "повседневная деятельность, повышенная готовность, чрезвычайная ситуация"}, {"t": "Органы РСЧС на каждом уровне", "d": "координационные (КЧС и ОПБ), постоянно действующие органы управления, органы повседневного управления (ЦУКС, ЕДДС)"}, {"t": "ЕДДС", "d": "единая дежурно-диспетчерская служба муниципального образования, орган повседневного управления, круглосуточно принимающий сообщения и координирующий дежурные службы"}], "quiz": [{"q": "Назовите уровни РСЧС.", "ok": "федеральный, межрегиональный, региональный, муниципальный, объектовый", "bad": ["федеральный, региональный, межмуниципальный, муниципальный, объектовый", "федеральный, межрегиональный, региональный, межмуниципальный, муниципальный, объектовый", "федеральный, межрегиональный, региональный, муниципальный, локальный"], "why": "Уровней ровно пять. Межмуниципальный — это масштаб ЧС, а не уровень РСЧС; локальная — тоже масштаб."}, {"q": "Из каких подсистем состоит РСЧС?", "ok": "из функциональных и территориальных", "bad": ["из федеральных и региональных", "из отраслевых и объектовых", "из координационных и повседневного управления"], "why": "Координационные и повседневного управления — это типы органов внутри уровня, а не подсистемы."}, {"q": "Назовите режимы функционирования РСЧС.", "ok": "повседневная деятельность, повышенная готовность, чрезвычайная ситуация", "bad": ["повседневная деятельность, готовность, военное положение", "повышенная готовность, чрезвычайная ситуация, ликвидация последствий", "повседневная деятельность, повышенная готовность, чрезвычайная ситуация, восстановительный"], "why": "Режимов ровно три. Ликвидация и восстановление — это содержание работ в режиме ЧС, а не отдельные режимы. И держи различие: повышенная готовность — это угроза, режим ЧС — уже факт."}, {"q": "Что относится к координационным органам РСЧС?", "ok": "комиссии по предупреждению и ликвидации ЧС и обеспечению пожарной безопасности", "bad": ["центры управления в кризисных ситуациях", "единые дежурно-диспетчерские службы", "главные управления МЧС России по субъектам"], "why": "ЦУКС и ЕДДС — органы повседневного управления, главные управления — постоянно действующие органы управления."}]}, {"n": 19, "title": "Гражданская оборона: предназначение, задачи, организация управления", "kostyak": ["Гражданская оборона — это система мероприятий по подготовке к защите и по защите населения, материальных и культурных ценностей на территории Российской Федерации от опасностей, возникающих при военных конфликтах или вследствие этих конфликтов, а также при чрезвычайных ситуациях природного и техногенного характера. Определение дано федеральным законом «О гражданской обороне».", "Обращу внимание на важную деталь этого определения: с конца девяностых годов гражданская оборона решает задачи не только военного, но и мирного времени. Это принципиально, потому что именно здесь она смыкается с РСЧС.", "Исторически система идёт от местной противовоздушной обороны, МПВО, созданной в тридцатые годы. В шестьдесят первом году она была преобразована в гражданскую оборону страны, а в девяностые годы, после серии крупных техногенных аварий, руководство ею перешло к системе МЧС России.", "Задачи гражданской обороны перечислю по основным группам. Первая — подготовка населения в области ГО и оповещение о возникающих опасностях.", "Вторая — защита населения: эвакуация населения и материальных ценностей в безопасные районы, предоставление населению средств индивидуальной защиты и защитных сооружений.", "Третья — обеспечивающие мероприятия: световая и другие виды маскировки, борьба с пожарами, обнаружение и обозначение районов радиоактивного, химического и биологического заражения, санитарная обработка людей и обеззараживание техники, зданий и территорий.", "Четвёртая — восстановление и жизнеобеспечение: проведение аварийно-спасательных и других неотложных работ, первоочередное жизнеобеспечение пострадавшего населения, срочное восстановление функционирования коммунальных служб, поддержание порядка в пострадавших районах, срочное захоронение погибших, обеспечение устойчивости функционирования организаций в военное время.", "Теперь управление. Общее руководство гражданской обороной в стране осуществляет Правительство Российской Федерации. Федеральный орган, уполномоченный на решение задач в области ГО, — МЧС России.", "Далее по вертикали: в федеральных органах исполнительной власти и в организациях руководство ГО осуществляют их руководители, в субъектах и муниципальных образованиях — главы соответствующих администраций. Ключевой принцип: руководитель организации является по должности начальником гражданской обороны этой организации, эта обязанность не делегируется.", "Повседневное управление ведут органы, специально уполномоченные на решение задач в области гражданской обороны, — от главных управлений МЧС России по субъектам до структурных подразделений или отдельных работников в организациях."], "terms": ["федеральный закон «О гражданской обороне»", "МПВО", "МЧС России", "опасности", "возникающие при военных конфликтах", "защитные сооружения гражданской обороны", "световая маскировка", "АСДНР", "первоочередное жизнеобеспечение", "устойчивость функционирования организаций", "руководитель гражданской обороны", "орган", "уполномоченный на решение задач в области ГО"], "follow": [{"q": "Кто отвечает за гражданскую оборону в организации?", "a": "Руководитель организации по должности. Он отвечает за состояние ГО, а непосредственную работу ведёт назначенный им уполномоченный работник или структурное подразделение — в зависимости от численности и категории объекта."}, {"q": "Что такое нештатные формирования по обеспечению выполнения мероприятий по гражданской обороне?", "a": "Это формирования, создаваемые организациями из числа своих работников для выполнения мероприятий ГО на своей территории: обеспечение эвакуации, санитарная обработка, обслуживание защитных сооружений, восстановление коммуникаций. Они не входят в состав сил постоянной готовности, а комплектуются персоналом самой организации."}], "notes": [{"label": "Разворот на школу", "text": "директор школы — руководитель гражданской обороны образовательной организации. Из этого вырастает конкретный набор: приказ о назначении работника, уполномоченного на решение задач в области ГО и ЧС, план основных мероприятий по ГО на год, план гражданской обороны и защиты населения, обучение работников по программе ГО и объектовые тренировки."}], "block": "ЧС, ГО, РСЧС", "bk": "chs", "tier": 1, "psy": false, "aid": false, "core": "Гражданская оборона — система мероприятий по защите населения, материальных и культурных ценностей от опасностей военных конфликтов, а с конца девяностых — и от ЧС мирного времени. Управление в ней строго по вертикали, а руководитель организации является начальником её ГО по должности.", "anchors": ["военные конфликты и мирное время", "МПВО → ГО → МЧС", "четыре группы задач", "Правительство и МЧС России", "руководитель по должности"], "simple": ["Гражданская оборона — система подготовки к защите и защиты населения, материальных и культурных ценностей от опасностей при военных конфликтах, а также при ЧС природного и техногенного характера. Определение дано федеральным законом «О гражданской обороне».", "Важная деталь определения: с конца девяностых ГО решает задачи не только военного, но и мирного времени — именно здесь она смыкается с РСЧС.", "Исторически система идёт от местной противовоздушной обороны (МПВО) тридцатых годов; в шестьдесят первом преобразована в гражданскую оборону, а в девяностые, после серии крупных техногенных аварий, руководство ею перешло к МЧС России.", "Задачи делятся на четыре группы: подготовка населения и оповещение; защита населения (эвакуация, СИЗ, защитные сооружения); обеспечивающие мероприятия (световая маскировка, борьба с пожарами, разведка заражения, санитарная обработка и обеззараживание); восстановление и жизнеобеспечение (АСДНР, первоочередное жизнеобеспечение, восстановление коммунальных служб, порядок, срочное захоронение, устойчивость организаций).", "Управление идёт по вертикали: общее руководство — Правительство РФ; уполномоченный федеральный орган — МЧС России; в субъектах и муниципалитетах — главы администраций; в организациях — руководители по должности.", "Руководитель организации по должности является начальником её гражданской обороны, и эта обязанность не делегируется; назначить можно только уполномоченного работника, который ведёт текущую работу."], "cards": [{"t": "Гражданская оборона", "d": "система мероприятий по подготовке к защите и по защите населения, материальных и культурных ценностей от опасностей при военных конфликтах, а также при ЧС природного и техногенного характера"}, {"t": "Группы задач ГО", "d": "подготовка населения и оповещение; защита населения (эвакуация, СИЗ, защитные сооружения); обеспечивающие мероприятия (маскировка, борьба с пожарами, разведка заражения, санобработка); восстановление и жизнеобеспечение (АСДНР, первоочередное жизнеобеспечение, восстановление коммунальных служб, устойчивость организаций)"}, {"t": "Управление гражданской обороной", "d": "общее руководство — Правительство РФ; уполномоченный федеральный орган — МЧС России; в субъектах и муниципалитетах — главы администраций; в организациях — руководители по должности"}, {"t": "МПВО", "d": "местная противовоздушная оборона, созданная в тридцатые годы, предшественница гражданской обороны"}, {"t": "Нештатные формирования по обеспечению выполнения мероприятий ГО", "d": "формирования из работников организации для выполнения мероприятий ГО на своей территории; в силы постоянной готовности не входят"}], "quiz": [{"q": "Кто осуществляет общее руководство гражданской обороной в стране?", "ok": "Правительство Российской Федерации", "bad": ["МЧС России", "Президент Российской Федерации", "главы субъектов Российской Федерации"], "why": "МЧС России — федеральный орган, уполномоченный на решение задач в области ГО, но общее руководство за Правительством."}, {"q": "Кто является руководителем гражданской обороны организации?", "ok": "руководитель организации по должности", "bad": ["работник, назначенный приказом руководителя", "представитель главного управления МЧС по субъекту", "председатель комиссии по чрезвычайным ситуациям"], "why": "Обязанность не делегируется. Уполномоченный работник ведёт текущую работу, но отвечает руководитель."}, {"q": "На какие опасности рассчитана гражданская оборона?", "ok": "на опасности при военных конфликтах, а также при ЧС природного и техногенного характера", "bad": ["только на опасности при военных конфликтах", "только на опасности мирного времени", "на опасности при военных конфликтах и террористических актах"], "why": "С конца девяностых ГО решает задачи и мирного времени — именно поэтому она стыкуется с РСЧС."}]}, {"n": 64, "title": "Обеспечение безопасности образовательного учреждения", "kostyak": ["Начну с определения: безопасность образовательной организации — состояние защищённости обучающихся, работников и материальных ценностей от угроз любого происхождения, обеспечивающее нормальный ход образовательного процесса. Обязанность создавать безопасные условия закреплена в Федеральном законе «Об образовании в Российской Федерации», ответственность несёт образовательная организация.", "Дальше разложу по направлениям — их принято выделять восемь.", "Антитеррористическая защищённость. Категорирование объекта, паспорт безопасности, контрольно-пропускной и внутриобъектовый режим, охрана, инженерно-технические средства: ограждение, видеонаблюдение, тревожная кнопка с выводом на пульт, система оповещения. Плюс тренировки и инструктажи по действиям при угрозе.", "Пожарная безопасность. Автоматическая пожарная сигнализация и система оповещения, первичные средства пожаротушения, содержание путей эвакуации, планы эвакуации, назначение ответственного, обучение мерам пожарной безопасности, регулярные объектовые тренировки по эвакуации.", "Охрана труда и техника безопасности. Специальная оценка условий труда, инструктажи — вводный, первичный, повторный, целевой; расследование несчастных случаев с обучающимися и работниками, требования к кабинетам повышенной опасности: химия, физика, технология, спортзал.", "Электро- и энергобезопасность, санитарно-эпидемиологическая безопасность. Соблюдение санитарных правил, режим занятий, питание, медицинское сопровождение.", "Информационная безопасность. Контентная фильтрация, защита персональных данных обучающихся, ответственный за информационную безопасность, профилактика деструктивного контента и кибербуллинга.", "Профилактика детского травматизма. Организация перемен и дежурства, безопасность оборудования и спортивных снарядов, профилактика дорожно-транспортного травматизма, инструктажи перед выездными мероприятиями.", "Гражданская оборона и защита от ЧС. Планы действий, объектовое звено РСЧС, обучение работников и обучающихся, средства индивидуальной защиты.", "Психологическая безопасность образовательной среды. Об этом отдельно и подробнее — я вижу это направление как ключевое. Субъекты и ответственность - Учредитель — создаёт условия и финансирует мероприятия по безопасности. - Руководитель организации — несёт персональную ответственность за безопасность обучающихся и работников, утверждает паспорт безопасности, назначает ответственных приказом. - Заместитель руководителя по безопасности — организует всю работу по направлениям. - Преподаватель-организатор основ безопасности и защиты Родины — ведёт учебный предмет ОБЗР, организует объектовые тренировки и эвакуации, готовит инструктажи, участвует в разработке документации по гражданской обороне и антитеррористической защищённости, ведёт военно-патриотическую работу и подготовку к учебным сборам. Фактически это связующая фигура между учебным процессом и системой безопасности объекта. - Педагог-психолог и социальный педагог — психологическая безопасность, профилактика буллинга и деструктивного поведения, работа с группами риска. - Классный руководитель — инструктажи, ежедневный контроль, взаимодействие с семьёй. - Каждый педагог — отвечает за жизнь и здоровье обучающихся во время занятия и мероприятия. - Внешние субъекты — Росгвардия и охранная организация, органы внутренних дел, МЧС, Роспотребнадзор, комиссия по делам несовершеннолетних. Психологическая безопасность образовательной среды — вывод, к которому веду весь ответ", "Техническая защита закрывает внешние угрозы, но значительная часть угроз в школе рождается внутри неё самой: травля, конфликты, эмоциональное насилие, отвержение ребёнка группой. На эти угрозы не действуют ни турникет, ни камера.", "Понятие психологической безопасности образовательной среды разработано в отечественной психологии, ключевое имя здесь — И. А. Баева. В её подходе психологическая безопасность среды определяется через защищённость участников образовательного процесса от психологического насилия и через удовлетворённость средой, которая обеспечивает референтную значимость среды для человека.", "Три основных критерия по этому подходу: отношение к образовательной среде, защищённость от психологического насилия во взаимодействии, референтность среды — то есть значимость её для человека и желание в ней находиться.", "Формы психологического насилия в школе: публичное унижение, игнорирование, угрозы, принуждение, высмеивание — причём как по линии «ученик — ученик», так и по линии «педагог — ученик».", "Практический выход: мониторинг психологической безопасности среды, антибуллинговые программы, обучение педагогов распознаванию травли, работа с классом как с группой, а не только с отдельным ребёнком, служба медиации в школе.", "Логика связки простая: физическая безопасность — необходимое условие, психологическая — то, что определяет качество среды и в конечном счёте влияет на риск тяжёлых происшествий, включая нападения, где в предыстории почти всегда обнаруживается длительная социальная изоляция подростка."], "terms": ["комплексная безопасность образовательной организации", "антитеррористическая защищённость", "категорирование объекта", "паспорт безопасности", "контрольно-пропускной и внутриобъектовый режим", "инженерно-технические средства охраны", "охрана труда", "инструктаж", "объектовая тренировка", "детский травматизм", "гражданская оборона", "преподаватель-организатор ОБЗР", "психологическая безопасность образовательной среды", "психологическое насилие", "референтность среды", "буллинг", "служба медиации", "И. А. Баева"], "follow": [{"q": "Кто отвечает за безопасность в школе?", "a": "Персональную ответственность несёт руководитель организации, но система работает только при распределённой ответственности: каждый педагог отвечает за детей на своём занятии, ответственные по направлениям назначаются приказом."}, {"q": "Что такое паспорт безопасности?", "a": "Документ по антитеррористической защищённости объекта, который составляется после категорирования и содержит характеристику объекта, оценку уязвимости, перечень мер и порядок действий при угрозе. Документ ограниченного доступа."}, {"q": "Почему психологическая безопасность — часть комплексной безопасности, а не отдельная тема?", "a": "Потому что угрозы, вызревающие внутри коллектива, не блокируются техническими средствами, и потому что состояние среды влияет на поведение людей в самой критической ситуации."}, {"q": "Как измерить психологическую безопасность среды?", "a": "Через опросные методики, оценивающие отношение к среде, защищённость от психологического насилия и референтность; в отечественной практике опираются на подход И. А. Баевой."}], "notes": [{"label": "Заходит от психологии", "text": "тут вся вторая часть ответа. Буллинг и его структура — агрессор, жертва, свидетели; роль наблюдателя как ключевая точка вмешательства. Групповая динамика класса. Диагностика психологической безопасности среды. Профилактика через работу с климатом группы, а не только через реагирование на инцидент."}], "block": "Социальные угрозы", "bk": "soc", "tier": 1, "psy": false, "aid": false, "core": "Безопасность образовательной организации — состояние защищённости обучающихся, работников и материальных ценностей от угроз любого происхождения, обеспечивающее нормальный ход образовательного процесса; она комплексная, складывается из восьми направлений и завершается психологической безопасностью среды, которую техническими средствами не обеспечить.", "anchors": ["восемь направлений", "распределённая ответственность", "паспорт безопасности", "Баева", "защищённость от психологического насилия и референтность"], "simple": ["Определение и правовая рамка: безопасность образовательной организации — состояние защищённости обучающихся, работников и материальных ценностей от угроз любого происхождения. Обязанность создавать безопасные условия закреплена в Федеральном законе «Об образовании в Российской Федерации», персональную ответственность несёт руководитель организации.", "Направлений принято выделять восемь: антитеррористическая защищённость (категорирование объекта, паспорт безопасности, контрольно-пропускной и внутриобъектовый режим, охрана, инженерно-технические средства — ограждение, видеонаблюдение, тревожная кнопка, оповещение); пожарная безопасность (сигнализация и оповещение, средства пожаротушения, пути и планы эвакуации, объектовые тренировки); охрана труда (спецоценка условий труда, инструктажи, расследование несчастных случаев, кабинеты повышенной опасности); электро- и санитарно-эпидемиологическая безопасность; информационная безопасность; профилактика детского травматизма; гражданская оборона и защита от ЧС; психологическая безопасность образовательной среды.", "Ответственность распределённая: учредитель создаёт условия и финансирует, руководитель отвечает персонально, утверждает паспорт безопасности и назначает ответственных приказом, заместитель по безопасности организует работу, преподаватель-организатор ОБЗР связывает учебный процесс с системой безопасности объекта, педагог-психолог и социальный педагог держат психологический контур, классный руководитель ведёт ежедневный контроль и работу с семьёй, каждый педагог отвечает за детей на своём занятии. Внешние субъекты — Росгвардия и охранная организация, органы внутренних дел, МЧС, Роспотребнадзор, комиссия по делам несовершеннолетних.", "Техническая защита закрывает внешние угрозы, но значительная часть угроз в школе рождается внутри неё: травля, конфликты, эмоциональное насилие, отвержение ребёнка группой. На это не действуют ни турникет, ни камера.", "Понятие психологической безопасности образовательной среды разработано в отечественной психологии, ключевое имя — И. А. Баева. Среда безопасна, когда её участники защищены от психологического насилия и когда среда для них референтна, то есть значима. Три критерия: отношение к среде, защищённость от психологического насилия, референтность. Психологическое насилие (публичное унижение, игнорирование, угрозы, принуждение, высмеивание) идёт по линиям «ученик — ученик» и «педагог — ученик».", "Практический выход: мониторинг психологической безопасности среды, антибуллинговые программы, обучение педагогов распознаванию травли, работа с классом как с группой, служба медиации. Почему это часть комплексной безопасности, а не отдельная тема: в предыстории тяжёлых происшествий, включая нападения, почти всегда обнаруживается длительная социальная изоляция подростка."], "cards": [{"t": "Комплексная безопасность образовательной организации", "d": "Состояние защищённости обучающихся, работников и материальных ценностей от угроз любого происхождения, обеспечивающее нормальный ход образовательного процесса."}, {"t": "Антитеррористическая защищённость", "d": "Направление, включающее категорирование объекта, паспорт безопасности, режимные меры, охрану и инженерно-технические средства: ограждение, видеонаблюдение, тревожную кнопку, оповещение."}, {"t": "Паспорт безопасности", "d": "Документ ограниченного доступа по антитеррористической защищённости, составляемый после категорирования: характеристика объекта, оценка уязвимости, перечень мер и порядок действий при угрозе."}, {"t": "Контрольно-пропускной и внутриобъектовый режим", "d": "Порядок входа и выхода людей и въезда транспорта плюс правила поведения на территории, ограничивающие доступ посторонних."}, {"t": "Пожарная безопасность", "d": "Направление, включающее автоматическую пожарную сигнализацию и оповещение, первичные средства пожаротушения, содержание путей эвакуации, планы эвакуации и объектовые тренировки."}, {"t": "Охрана труда", "d": "Направление, включающее специальную оценку условий труда, систему инструктажей, расследование несчастных случаев и особые требования к кабинетам повышенной опасности."}, {"t": "Инструктаж", "d": "Обязательное доведение требований безопасности с регистрацией; различают вводный, первичный, повторный и целевой."}, {"t": "Профилактика детского травматизма", "d": "Направление, включающее организацию перемен и дежурства, исправность оборудования и спортивных снарядов, профилактику дорожно-транспортного травматизма и инструктажи перед выездными мероприятиями."}, {"t": "Информационная безопасность в образовательной организации", "d": "Направление, включающее контентную фильтрацию, защиту персональных данных обучающихся, назначение ответственного и профилактику деструктивного контента и кибербуллинга."}, {"t": "Психологическая безопасность образовательной среды", "d": "По подходу И. А. Баевой — состояние среды, свободной от проявлений психологического насилия, обеспечивающей удовлетворённость участников и референтную значимость среды для них."}, {"t": "Референтность среды", "d": "Значимость образовательной среды для человека и его желание в ней находиться; один из трёх критериев психологической безопасности наряду с отношением к среде и защищённостью от психологического насилия."}, {"t": "Психологическое насилие", "d": "Действия, унижающие достоинство и подрывающие чувство защищённости: публичное унижение, игнорирование, угрозы, принуждение, высмеивание; возможно как между учениками, так и со стороны педагога."}, {"t": "Служба медиации", "d": "Школьная структура, помогающая сторонам конфликта договориться при участии нейтрального посредника вместо административного наказания."}, {"t": "Преподаватель-организатор ОБЗР", "d": "Педагог, ведущий предмет «Основы безопасности и защиты Родины» и одновременно организующий объектовые тренировки, инструктажи и документацию по гражданской обороне и антитеррористической защищённости."}], "quiz": [{"q": "Кто несёт персональную ответственность за безопасность обучающихся и работников?", "ok": "Руководитель образовательной организации", "bad": ["Заместитель руководителя по безопасности", "Учредитель образовательной организации", "Преподаватель-организатор ОБЗР"], "why": "Учредитель создаёт условия и финансирует, заместитель организует работу, но персональная ответственность на руководителе; он же утверждает паспорт безопасности и назначает ответственных приказом."}, {"q": "Что представляет собой паспорт безопасности образовательной организации?", "ok": "Документ ограниченного доступа по антитеррористической защищённости, составляемый после категорирования объекта", "bad": ["Общедоступный документ с перечнем всех мер безопасности организации", "Журнал учёта инструктажей и объектовых тренировок", "Приложение к плану гражданской обороны с перечнем средств защиты"], "why": "Паспорт содержит характеристику объекта, оценку уязвимости и порядок действий при угрозе, поэтому доступ к нему ограничен."}, {"q": "Через что определяется психологическая безопасность образовательной среды в подходе И. А. Баевой?", "ok": "Через защищённость от психологического насилия и референтную значимость среды для участников", "bad": ["Через отсутствие конфликтов между обучающимися", "Через уровень тревожности обучающихся по результатам диагностики", "Через наличие в организации педагога-психолога и социального педагога"], "why": "Критериев три: отношение к среде, защищённость от психологического насилия и референтность. Полное отсутствие конфликтов не критерий и не цель."}, {"q": "Почему психологическая безопасность считается частью комплексной безопасности, а не самостоятельной темой?", "ok": "Угрозы, вызревающие внутри коллектива, не блокируются техническими средствами, а состояние среды влияет на поведение людей в критической ситуации", "bad": ["Психолог входит в состав комиссии по антитеррористической защищённости", "Требования к ней содержатся в тех же документах, что и требования к охране труда", "Психологическая диагностика проводится одновременно с объектовыми тренировками"], "why": "Турникет и камера закрывают внешний контур. Травля, отвержение и изоляция вызревают внутри, и именно они обнаруживаются в предыстории тяжёлых происшествий."}, {"q": "Какая мера относится к профилактике детского травматизма?", "ok": "Организация дежурства на переменах и контроль исправности спортивного оборудования", "bad": ["Контентная фильтрация на точках доступа в интернет", "Категорирование объекта и разработка паспорта безопасности", "Специальная оценка условий труда работников"], "why": "Остальные варианты — информационная безопасность, антитеррористическая защищённость и охрана труда соответственно."}, {"q": "Работа с классом как с группой, а не только с отдельным ребёнком, при профилактике буллинга нужна потому, что:", "ok": "Травля поддерживается позицией свидетелей, и именно они дают точку вмешательства", "bad": ["Индивидуальная работа с жертвой запрещена без согласия родителей", "Агрессор обычно не осознаёт своих действий", "Групповая работа требует меньше времени специалиста"], "why": "В структуре буллинга есть агрессор, жертва и свидетели. Меняется позиция свидетелей — травля лишается опоры и аудитории."}]}, {"n": 6, "title": "Предмет, цель и задачи БЖД и школьного курса ОБиЗР", "kostyak": ["Начну с разведения двух вещей: «Безопасность жизнедеятельности» — вузовская научная и учебная дисциплина, а «Основы безопасности и защиты Родины» — школьный предмет; у них общая идеология, но разный уровень и разные задачи.", "Предмет изучения БЖД — опасности среды обитания и способы защиты от них человека, то есть система «человек — среда обитания» и её взаимодействие.", "В основе дисциплины лежит аксиома о потенциальной опасности любой деятельности: абсолютной безопасности не бывает, любая деятельность несёт остаточный риск, и задача — управлять этим риском, а не устранять его полностью.", "Цель БЖД — сформировать у человека мышление, при котором безопасность рассматривается как условие любой деятельности; отсюда идея приемлемого риска вместо идеи нулевого риска.", "В школьном курсе цель звучит иначе — формирование культуры безопасности личности: не только знания, но и мотивы, ценности, готовность действовать. Это понятие в отечественной педагогике разрабатывали Мошкин и Гафнер.", "Задачи школьного курса я бы свёл к трём линиям: научить распознавать опасные и чрезвычайные ситуации, научить правильно действовать в них, включая первую помощь, и воспитать ответственное отношение к собственной жизни, здоровью и защите Отечества.", "С 2024 года к этим линиям добавилась военная составляющая: основы военной подготовки, элементы НВП, знакомство с современными средствами вооружённой борьбы. Это прямо следует из нового названия — «и защиты Родины».", "И последнее: результат курса измеряется не воспроизведением правил, а поведением в ситуации. Отсюда и специфика методики — акцент на практикумы, тренировки, ситуационные задачи."], "terms": ["система «человек — среда обитания»", "аксиома о потенциальной опасности деятельности", "приемлемый (остаточный) риск", "опасный фактор и поражающий фактор", "культура безопасности личности", "гомосфера и ноксосфера", "виктимность", "чрезвычайная ситуация", "федеральная рабочая программа", "компетентностный подход"], "follow": [{"q": "Чем ОБиЗР отличается от ОБЖ по содержанию?", "a": "Ядро сохранилось — ЧС, безопасность в быту, на транспорте, в природе, первая помощь, информационная безопасность. Добавились модули по военной подготовке и основам военных знаний, усилена линия противодействия экстремизму и терроризму, появились современные сюжеты вроде беспилотных систем."}, {"q": "Что такое
