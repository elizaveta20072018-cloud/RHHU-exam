тка педагог может заметить раньше остальных?", "ok": "Резкая смена круга общения и разрыв прежних связей", "bad": ["Снижение успеваемости по профильным предметам", "Пропуски занятий без уважительной причины", "Конфликт с одним из учителей"], "why": "Изоляция от прежнего окружения — обязательный шаг вербовки. Остальные признаки встречаются при десятке других причин."}]}, {"n": 65, "title": "Информационная безопасность в системе национальной безопасности РФ", "kostyak": ["Информационная безопасность — состояние защищённости личности, общества и государства от внутренних и внешних информационных угроз. Базовый документ — Доктрина информационной безопасности Российской Федерации.", "Классическая триада свойств информации: конфиденциальность, целостность, доступность. На ней строится вся техническая защита.", "Национальная безопасность включает несколько видов: военную, экономическую, экологическую, продовольственную, информационную и другие. Информационная безопасность занимает в этой системе особое место, потому что она пронизывает остальные: управление войсками, финансовая система, энергетика и транспорт работают на информационных системах.", "Объекты защиты: информационные ресурсы, информационная инфраструктура, права граждан в информационной сфере, и отдельно — сознание человека, то есть защита от деструктивного информационного воздействия.", "Угрозы делят на внешние и внутренние, а также на технические (кибератаки, вредоносное ПО, утечки данных) и информационно-психологические (деструктивный контент, вовлечение в опасные сообщества, мошенничество через социальную инженерию).", "Направления обеспечения: правовое регулирование, включая законодательство о персональных данных и о защите детей от вредной информации; организационные меры; программно-технические средства; и подготовка кадров.", "Отдельный контур — безопасность критической информационной инфраструктуры. Поворот в сторону школы — информационная безопасность детей. Скорее всего спросят именно про это. - Правовая рамка: Федеральный закон «О защите детей от информации, причиняющей вред их здоровью и развитию», возрастная маркировка контента, требования к контентной фильтрации в образовательных организациях. - Угрозы для ребёнка: деструктивный контент (суицидальный, экстремистский, пропаганда насилия и ПАВ), кибербуллинг, груминг, вовлечение в деструктивные сетевые сообщества, интернет-мошенничество и социальная инженерия, игровая и сетевая зависимость, утечка персональных данных. - Меры в школе: контент-фильтрация на всех точках доступа, назначение ответственного за информационную безопасность, уроки цифровой гигиены, работа с родителями, мониторинг цифровой активности обучающихся группы риска, алгоритм действий при выявлении деструктивного контента. - Роль психолога: диагностика последствий кибербуллинга, работа с жертвой и с агрессором, восстановление положения ребёнка в группе."], "terms": ["информационная безопасность", "Доктрина информационной безопасности РФ", "конфиденциальность", "целостность", "доступность", "национальная безопасность", "критическая информационная инфраструктура", "персональные данные", "контентная фильтрация", "деструктивный контент", "кибербуллинг", "груминг", "социальная инженерия", "цифровая гигиена"], "follow": [{"q": "Почему информационную безопасность выделяют отдельно от остальных видов?", "a": "Потому что она обеспечивающая: сбой в информационной сфере отражается на военной, экономической и социальной безопасности одновременно."}, {"q": "Что делать педагогу при обнаружении опасного контента у ученика?", "a": "Не вступать в конфронтацию с ребёнком, зафиксировать факт, сообщить администрации и ответственному за информационную безопасность, подключить психолога и родителей, при признаках противоправного содержания — обратиться в органы профилактики."}], "notes": [{"label": "Заходит от психологии", "text": "кибербуллинг как форма травли — отличия от офлайн-буллинга: анонимность агрессора, круглосуточность, неограниченная аудитория, сохранность следа. Плюс механика вовлечения подростка в деструктивное сообщество: подмена принадлежности, постепенное обособление, повышение порога вовлечённости."}], "block": "Социальные угрозы", "bk": "soc", "tier": 2, "psy": false, "aid": false, "core": "Информационная безопасность — защищённость личности, общества и государства от информационных угроз; она обеспечивающая, потому что через информационные системы работают все остальные виды безопасности, а в школе разворачивается в защиту детей.", "anchors": ["конфиденциальность", "целостность", "доступность", "технические и психологические угрозы", "контентная фильтрация", "кибербуллинг и груминг", "цифровая гигиена"], "simple": ["Определение: состояние защищённости личности, общества и государства от внутренних и внешних информационных угроз. Базовый документ — Доктрина информационной безопасности Российской Федерации.", "Классическая триада свойств информации: конфиденциальность, целостность, доступность. На ней держится вся техническая защита.", "Информационную безопасность выделяют отдельно, потому что она обеспечивающая: управление войсками, финансы, энергетика и транспорт работают на информационных системах, поэтому сбой отзывается в военной, экономической и социальной сферах одновременно.", "Объекты защиты: информационные ресурсы, информационная инфраструктура, права граждан в информационной сфере и отдельно сознание человека — защита от деструктивного информационного воздействия.", "Угрозы делят на внешние и внутренние, а также на технические (кибератаки, вредоносное ПО, утечки данных) и информационно-психологические (деструктивный контент, вовлечение в опасные сообщества, мошенничество через социальную инженерию).", "Школьный контур: контентная фильтрация на всех точках доступа, ответственный за информационную безопасность, уроки цифровой гигиены, работа с родителями, мониторинг цифровой активности детей группы риска, алгоритм действий при выявлении деструктивного контента. Правовая рамка — Федеральный закон «О защите детей от информации, причиняющей вред их здоровью и развитию».", "Кибербуллинг тяжелее офлайн-травли: агрессор анонимен, преследование круглосуточное, аудитория неограниченна, след сохраняется и всплывает снова."], "cards": [{"t": "Информационная безопасность", "d": "Состояние защищённости личности, общества и государства от внутренних и внешних информационных угроз."}, {"t": "Конфиденциальность, целостность, доступность", "d": "Триада свойств информации: доступ только у тех, кому положено; данные не искажены; данные получены тогда, когда нужны."}, {"t": "Критическая информационная инфраструктура", "d": "Информационные системы и сети объектов, нарушение работы которых влечёт тяжёлые последствия для государства."}, {"t": "Контентная фильтрация", "d": "Программно-технические средства, ограничивающие доступ обучающихся к информации, причиняющей вред их здоровью и развитию; устанавливаются на всех точках доступа организации."}, {"t": "Деструктивный контент", "d": "Материалы, формирующие установки на насилие, саморазрушение или противоправное поведение: суицидальные, экстремистские, пропаганда насилия и психоактивных веществ."}, {"t": "Кибербуллинг", "d": "Травля через цифровые каналы; отличается от офлайн-травли анонимностью агрессора, круглосуточностью, неограниченной аудиторией и сохранностью следа."}, {"t": "Груминг", "d": "Установление взрослым доверительного контакта с ребёнком в сети с целью последующего вовлечения в действия сексуального характера."}, {"t": "Социальная инженерия", "d": "Получение доступа к данным или деньгам через управление поведением человека: доверие, срочность, страх и авторитет вместо взлома системы."}, {"t": "Цифровая гигиена", "d": "Устойчивые привычки безопасного поведения в сети: пароли, приватность, проверка источника, отказ от передачи персональных данных незнакомым."}], "quiz": [{"q": "Почему информационную безопасность выделяют среди других видов национальной безопасности?", "ok": "Она обеспечивающая: сбой в информационной сфере отражается на военной, экономической и социальной безопасности одновременно", "bad": ["Она регулируется большим числом нормативных документов", "Угрозы в ней возникают чаще, чем в остальных сферах", "Она полностью относится к компетенции федерального уровня"], "why": "Управление войсками, финансы, энергетика и транспорт работают на информационных системах, поэтому эта сфера пронизывает остальные."}, {"q": "Что отличает кибербуллинг от офлайн-травли?", "ok": "Анонимность агрессора, круглосуточность и сохранность следа", "bad": ["Большая физическая опасность для жертвы", "Отсутствие фигуры свидетеля", "Меньшая длительность эпизодов"], "why": "Свидетелей в сети даже больше, а аудитория неограниченна. Уйти домой и оказаться в безопасности жертва не может."}, {"q": "Мошенник звонит и, ссылаясь на срочность, убеждает человека продиктовать код из сообщения. Это пример:", "ok": "Социальной инженерии", "bad": ["Кибератаки на информационную систему", "Нарушения целостности информации", "Дипфейка"], "why": "Систему никто не взламывает. Взламывают поведение человека через давление срочности и авторитета."}, {"q": "Какое первое действие педагога при обнаружении деструктивного контента у ученика?", "ok": "Зафиксировать факт и сообщить администрации и ответственному за информационную безопасность", "bad": ["Провести беседу с ребёнком и потребовать удалить материалы", "Сразу сообщить в органы профилактики", "Обсудить ситуацию с классом на классном часе"], "why": "Конфронтация толкает подростка к скрытности и разрыву контакта. Сначала фиксация и передача информации по линии, дальше подключаются психолог и родители."}]}, {"n": 51, "title": "Причины преступности в России. ЧС криминального характера", "kostyak": ["Преступность — социально-правовое явление, совокупность преступлений, совершённых на определённой территории за определённый период; она обладает собственными закономерностями и статистически устойчива.", "Причины в криминологии принято раскладывать по уровням. Социально-экономические: имущественное расслоение, безработица, бедность отдельных групп населения. Социально-психологические: деформация ценностей, алкоголизация и наркотизация, ослабление института семьи.", "Отдельно идут правовые и организационные факторы: пробелы в законодательстве, недостаточная эффективность профилактики, латентная преступность, которая не попадает в статистику.", "Есть и виктимологический фактор — поведение самой жертвы, которое повышает вероятность посягательства.", "ЧС криминального характера — это ситуации, где угроза исходит от противоправных действий: разбойное нападение, захват заложников, похищение человека, массовые беспорядки, вооружённое нападение на объект.", "Правила поведения при посягательстве строятся на приоритете жизни над имуществом: не вступать в конфликт из-за вещей, не провоцировать агрессию, стремиться увеличить дистанцию и выйти в людное место, привлечь внимание криком, при первой возможности сообщить в полицию.", "Профилактика делится на общесоциальную — то есть улучшение условий жизни, занятость, образование; специально-криминологическую — работа с группами риска; и индивидуальную — работа с конкретным человеком, склонным к правонарушению.", "В образовательной организации это профилактика правонарушений несовершеннолетних, совет профилактики, взаимодействие с подразделениями по делам несовершеннолетних."], "terms": ["криминология", "детерминанты преступности", "латентная преступность", "виктимология", "виктимное поведение", "делинквентное поведение", "общесоциальная и специально-криминологическая профилактика", "группа риска", "несовершеннолетние правонарушители"], "follow": [{"q": "Что такое латентная преступность?", "a": "Часть преступлений, не отражённая в официальной статистике: не выявленные и не заявленные. Из-за неё уровень преступности всегда оценивается с поправкой."}, {"q": "Как школа участвует в профилактике?", "a": "Через раннее выявление неблагополучия, внутришкольный учёт, занятость во внеурочной деятельности, работу психолога и социального педагога, взаимодействие с органами системы профилактики."}], "notes": [{"label": "Заходит от психологии", "text": "виктимология как отдельное направление — типы виктимного поведения, роль тревожности и заниженной самооценки, феномен «удобной жертвы». Плюс психология подростковой делинквентности: потребность в принадлежности к группе как механизм втягивания в противоправное поведение."}], "block": "Социальные угрозы", "bk": "soc", "tier": 2, "psy": false, "aid": false, "core": "Преступность — социально-правовое явление со своими закономерностями; её причины разбирают по уровням, а противодействие строят как трёхуровневую профилактику, а не как реакцию на отдельное преступление.", "anchors": ["детерминанты по уровням", "латентность", "виктимология", "три уровня профилактики", "школа и группа риска"], "simple": ["Преступность — социально-правовое явление, совокупность преступлений на определённой территории за период; она статистически устойчива и обладает собственными закономерностями.", "Причины раскладывают по уровням: социально-экономические (имущественное расслоение, безработица, бедность), социально-психологические (деформация ценностей, алкоголизация и наркотизация, ослабление института семьи), правовые и организационные (пробелы в законодательстве, слабая профилактика, латентная преступность).", "Латентная преступность — часть преступлений, не попавшая в статистику (не выявленные и не заявленные); из-за неё уровень преступности всегда оценивают с поправкой.", "Виктимологический фактор — поведение самой жертвы, повышающее вероятность посягательства: тревожность, заниженная самооценка, неумение обозначить границу.", "ЧС криминального характера — ситуации, где угроза исходит от противоправных действий: разбойное нападение, захват заложников, похищение человека, массовые беспорядки, вооружённое нападение на объект. При посягательстве действует приоритет жизни над имуществом: не вступать в конфликт из-за вещей, не провоцировать агрессию, увеличивать дистанцию, выходить в людное место, привлечь внимание криком, сообщить в полицию.", "Профилактика трёхуровневая: общесоциальная работает на условия жизни (занятость, образование), специально-криминологическая — на группы риска, индивидуальная — на конкретного человека. В образовательной организации это совет профилактики, внутришкольный учёт и взаимодействие с подразделениями по делам несовершеннолетних."], "cards": [{"t": "Криминология", "d": "Наука о преступности, её причинах, личности преступника и мерах предупреждения."}, {"t": "Детерминанты преступности", "d": "Совокупность причин и условий разных уровней, которые порождают преступность и способствуют её воспроизводству."}, {"t": "Латентная преступность", "d": "Часть преступлений, не попавшая в официальную статистику: не выявленные и не заявленные."}, {"t": "Виктимное поведение", "d": "Поведение человека, объективно повышающее риск стать жертвой: провокация, беспечность, демонстрация уязвимости или неспособности к сопротивлению."}, {"t": "Делинквентное поведение", "d": "Противоправное поведение, чаще подростковое, повторяющееся и связанное с потребностью в принадлежности к группе."}, {"t": "Специально-криминологическая профилактика", "d": "Меры, адресованные группам риска и конкретным криминогенным факторам, в отличие от общесоциальных мер, работающих на всё население."}], "quiz": [{"q": "Что относят к латентной преступности?", "ok": "Преступления, не выявленные и не заявленные, не попавшие в статистику", "bad": ["Преступления, совершённые несовершеннолетними", "Преступления, по которым обвиняемый не установлен, но дело возбуждено", "Преступления в сфере экономики"], "why": "Латентность — про отсутствие в учёте. Возбуждённое дело в статистику уже попало, значит латентным не считается."}, {"q": "Профилактика, направленная на конкретного подростка, состоящего на внутришкольном учёте, — это:", "ok": "Индивидуальная профилактика", "bad": ["Общесоциальная профилактика", "Специально-криминологическая профилактика", "Виктимологическая экспертиза"], "why": "Уровень определяется адресатом. Всё население — общесоциальная, группа риска — специально-криминологическая, конкретный человек — индивидуальная."}, {"q": "Какое правило поведения при разбойном нападении соответствует принципу приоритета жизни?", "ok": "Не вступать в борьбу за имущество, увеличить дистанцию и выйти к людям", "bad": ["Запомнить приметы и удерживать нападавшего до приезда полиции", "Вступить в переговоры и добиться возврата вещей", "Сохранять полную неподвижность и молчание до ухода нападавшего"], "why": "Имущество восполнимо, здоровье нет. Задача — разорвать контакт и оказаться там, где есть свидетели."}]}, {"n": 35, "title": "Первая помощь при травмах различных областей тела и отравлениях", "kostyak": ["Травмы — самое частое, с чем сталкивается педагог. Общий принцип для всех локализаций: обезболить положением, обездвижить, охладить, не пытаться «вправить».", "Голова. Признаки черепно-мозговой травмы: потеря сознания даже на секунды, тошнота и рвота, головная боль, человек не помнит момент травмы. Помощь — покой, положение лёжа, холод, контроль дыхания, вызов скорой. Любая потеря сознания после удара головой — повод для осмотра врачом.", "Позвоночник и шея. Здесь главное правило — не перемещать. Если есть подозрение на травму позвоночника (падение с высоты, ныряние, ДТП, боль в спине, онемение или слабость в конечностях), человека оставляют в том положении, в котором нашли, фиксируют голову руками и ждут скорую. Двигать можно только если оставаться на месте опаснее, чем перемещать — пожар, вода, угроза обрушения. Это тот момент, где самодеятельность калечит.", "Грудная клетка. Признаки: боль при дыхании, одышка. Положение полусидя. При проникающем ранении груди накладывают повязку, не пропускающую воздух, чтобы не нарастал пневмоторакс.", "Живот. Положение на спине с валиком под коленями, холод. Нельзя поить, кормить и давать обезболивающее. При выпадении внутренних органов их не вправляют — накрывают влажной чистой тканью.", "Конечности. Отличить перелом от ушиба на месте невозможно, поэтому действую как при переломе: иммобилизация с захватом двух соседних суставов, холод, покой. Открытый перелом — сначала останавливаю кровотечение и закрываю рану, потом фиксирую. Отломки не вправляю.", "Таз. Поза «лягушки»: на спине, ноги согнуты и разведены, под колени валик. Травма таза даёт большую скрытую кровопотерю, поэтому это всегда вызов скорой.", "Отравления. Путь поступления яда определяет помощь: через рот, через дыхательные пути, через кожу, через инъекцию или укус. Общий порядок: прекратить поступление яда, вынести из зоны, промыть кожу или желудок, дать сорбент, сохранить упаковку вещества или рвотные массы для врачей.", "Вызывать рвоту нельзя, если человек без сознания, если он отравился кислотой, щёлочью или нефтепродуктами, и у маленьких детей. При ожоге пищевода рвота повторно обжигает его на обратном пути."], "terms": ["черепно-мозговая травма", "ретроградная амнезия", "иммобилизация с захватом двух соседних суставов", "транспортная иммобилизация", "открытый и закрытый перелом", "проникающее ранение груди", "пневмоторакс", "поза «лягушки»", "травматический шок", "путь поступления яда", "энтеросорбент", "противопоказания к вызыванию рвоты"], "follow": [{"q": "Как понять, что у ребёнка травматический шок?", "a": "Бледная холодная влажная кожа, частый слабый пульс, заторможенность или наоборот возбуждение, жажда. Помощь: остановить кровотечение, уложить с приподнятыми ногами, укрыть, не поить, срочно вызвать скорую."}, {"q": "Можно ли снять шлем с упавшего мотоциклиста или подростка с самоката?", "a": "Нет, если он дышит. Снятие шлема — движение шеи. Исключение — если без снятия невозможна реанимация."}], "notes": [], "block": "Первая помощь", "bk": "pp", "tier": 2, "psy": false, "aid": true, "core": "При травме действуют по правилу «обездвижить, охладить, не вправлять», а при подозрении на позвоночник — не перемещать вообще. При отравлении сначала перекрывают путь поступления яда, и только потом всё остальное.", "anchors": ["не вправлять", "два соседних сустава", "позвоночник не двигать", "положение по области", "путь яда"], "simple": ["Общее правило для всех травм: обезболить положением, обездвижить, охладить, ничего не вправлять руками.", "Перелом от ушиба на месте не отличить, поэтому действуют как при переломе: иммобилизация с захватом двух соседних суставов — выше и ниже места травмы; открытый перелом — сначала остановить кровотечение и закрыть рану, потом фиксировать, отломки не вправлять.", "Позвоночник и шея — единственное место, где лучшая помощь ничего не делать: оставить в том положении, в котором нашли, зафиксировать голову руками, ждать скорую; двигать можно только если оставаться на месте опаснее — пожар, вода, угроза обрушения.", "Положение придают по области: голова — лёжа, покой, холод; грудь — полусидя, при проникающем ранении повязка, не пропускающая воздух, чтобы не нарастал пневмоторакс; живот — на спине с валиком под коленями, не поить, не кормить, не обезболивать; таз — поза «лягушки»; кровопотеря и шок — ноги приподняты.", "При выпадении внутренних органов из живота их не вправляют, а накрывают влажной чистой тканью.", "Отравление разбирают с пути поступления яда — через рот, дыхательные пути, кожу, инъекцию или укус: перекрыть поступление, вынести из зоны, промыть кожу или желудок, дать сорбент, сохранить упаковку или рвотные массы для врачей; рвоту не вызывают у человека без сознания, у маленьких детей и при отравлении кислотой, щёлочью, нефтепродуктами — обратный путь по пищеводу обжигает второй раз."], "cards": [{"t": "черепно-мозговая травма", "d": "потеря сознания даже на секунды, тошнота, рвота, головная боль и ретроградная амнезия — человек не помнит момент травмы"}, {"t": "иммобилизация с захватом двух суставов", "d": "обездвиживание конечности с фиксацией сустава выше и ниже места перелома"}, {"t": "пневмоторакс", "d": "попадание воздуха в грудную полость при проникающем ранении груди, поэтому повязка накладывается не пропускающая воздух"}, {"t": "поза «лягушки»", "d": "положение при травме таза: на спине, ноги согнуты и разведены, под коленями валик"}, {"t": "перемещение при травме позвоночника — спорное место", "d": "базовое правило — не двигать и ждать скорую, но перемещение допустимо, если оставаться на месте опаснее: пожар, вода, угроза обрушения"}, {"t": "противопоказания к вызыванию рвоты", "d": "без сознания, маленькие дети, отравление кислотой, щёлочью, нефтепродуктами"}], "quiz": [{"q": "Подозрение на травму позвоночника, человек лежит на земле в безопасном месте. Что делаете?", "ok": "Оставляю в том положении, в котором нашёл, фиксирую голову руками, жду скорую", "bad": ["Перекладываю на ровную твёрдую поверхность", "Перевожу в устойчивое боковое положение", "Сажаю, чтобы легче было дышать"], "why": "Любое лишнее движение может добавить повреждение спинного мозга. Двигают только тогда, когда оставаться на месте опаснее, чем перемещать."}, {"q": "Открытый перелом голени с кровотечением. Порядок действий?", "ok": "Остановить кровотечение, закрыть рану, затем обездвижить с захватом двух суставов", "bad": ["Сначала вправить отломки, потом наложить шину", "Сразу наложить шину, кровотечение остановится само от давления шины", "Обездвижить, потом промыть рану и вправить кость"], "why": "Кровопотеря убивает быстрее перелома, поэтому она первая. Отломки не вправляют никогда — этим рвут сосуды и мышцы."}, {"q": "Ребёнок выпил средство для чистки труб. Можно ли вызывать рвоту?", "ok": "Нет, при отравлении щёлочью рвота повторно обжигает пищевод", "bad": ["Да, чем быстрее вывести вещество, тем лучше", "Да, но только после стакана молока", "Да, если прошло меньше тридцати минут"], "why": "Едкое вещество обжигает пищевод на пути обратно. Плюс у маленьких детей рвоту не вызывают в принципе."}, {"q": "Травма живота, человек в сознании и просит пить. Что делаете?", "ok": "Кладу на спину с валиком под коленями, холод на живот, пить не даю", "bad": ["Даю воду мелкими глотками, чтобы не было обезвоживания", "Даю обезболивающее и усаживаю", "Кладу на бок с согнутыми ногами и кормлю сладким"], "why": "Питьё, еда и обезболивающее при травме живота опасны: возможна операция, а обезболивание смазывает картину."}]}, {"n": 53, "title": "Поражающие факторы ЧС (дословный дубль вопроса 43)", "kostyak": ["«Поражающий фактор — составляющая опасного явления, которая непосредственно воздействует на людей, объекты и природную среду и вызывает поражение. Сама ЧС — событие, поражающий фактор — механизм причинения вреда».", "«По природе воздействия выделяют механические, тепловые, химические, радиационные, биологические, а также акустические, электромагнитные и психологические факторы».", "«Механические — ударная волна, обломки, обрушение конструкций, оползневые массы, поток воды. Результат — травмы, переломы, баротравма, гибель под завалами».", "«Тепловые — световое излучение, пламя, горячие газы. Вызывают ожоги кожи и дыхательных путей, тепловой удар, воспламенение материалов».", "«Химические — воздействие аварийно химически опасных веществ: отравления, поражение органов дыхания, ожоги, заражение местности и воды».", "«Радиационные — ионизирующее излучение: острая и хроническая лучевая болезнь, отдалённые последствия».", "«Биологические — патогенные микроорганизмы и токсины: инфекционные заболевания, эпидемии, эпизоотии».", "«Отдельно называю психологический фактор: острая реакция на стресс, паника, ступор, дезорганизация поведения. Он не оставляет физических следов, но резко увеличивает потери — из-за паники людей гибнет иногда больше, чем от самого поражающего явления».", "«По времени действия факторы делят на первичные и вторичные: землетрясение — первичный, а вызванный им пожар или разрушение плотины — вторичный. По длительности — мгновенные и пролонгированные»."], "terms": ["поражающий фактор", "первичные и вторичные факторы", "ударная волна", "световое излучение", "ионизирующее излучение", "АХОВ (аварийно химически опасные вещества)", "очаг поражения", "зона заражения", "санитарные и безвозвратные потери"], "follow": [{"q": "Приведите пример цепочки первичных и вторичных факторов.", "a": "— Землетрясение: первичный — сейсмический удар и обрушение зданий; вторичные — пожары от повреждённых сетей, утечка АХОВ с предприятия, затопление при разрушении гидросооружения, вспышка инфекций из-за нарушения водоснабжения."}, {"q": "Почему психологический фактор относят к поражающим?", "a": "— Потому что он самостоятельно приводит к потерям: паника вызывает давку, ступор мешает эвакуироваться, дезорганизация срывает действия спасателей."}], "notes": [{"label": "Если достался вторым", "text": "Сказать: «эта тема повторяет вопрос сорок три, содержание то же; чтобы не повторяться, разверну подробнее классификацию по времени действия и по масштабу зоны поражения». Это выглядит как ориентированность в программе, а не как уход от ответа."}], "block": "Теория, риск, ЗОЖ", "bk": "teor", "tier": 3, "psy": false, "aid": false, "core": "Поражающие факторы ЧС в развёрнутой классификации: по времени действия — первичные и вторичные, мгновенные и пролонгированные, а также по масштабу самой ЧС и по зоне поражения. Отдельная составляющая потерь в очаге — психогенные.", "anchors": ["тот же материал", "другой разворот", "масштаб ЧС", "очаг и зона заражения", "комбинированные поражения", "психогенные потери"], "simple": ["По времени действия факторы делят на первичные и вторичные, а также на мгновенные и пролонгированные: взрыв мгновенен, радиационное загрязнение растянуто на годы.", "Масштаб ЧС выстраивают лестницей от малого к большому: локальная, муниципальная, межмуниципальная, региональная, межрегиональная, федеральная.", "Пространственные понятия: очаг поражения, зона заражения (где распространены опасные химические, радиоактивные или биологические агенты), зона действия поражающих факторов.", "Комбинированные поражения — сочетанное действие нескольких факторов, когда травма накладывается на ожог или облучение, и исход тяжелее, чем сумма частей.", "Потери делят на санитарные и безвозвратные. Отдельно — психогенные потери: доля людей в очаге с острой реакцией на стресс, утративших способность к целесообразным действиям.", "Психологическая помощь пострадавшим входит в состав аварийно-спасательных работ и оказывается прямо в очаге, потому что психогенные потери снижают эффективность эвакуации."], "cards": [{"t": "Мгновенные и пролонгированные факторы", "d": "мгновенные действуют кратковременно (ударная волна), пролонгированные растянуты во времени (радиационное загрязнение)"}, {"t": "Классификация ЧС по масштабу", "d": "локальная, муниципальная, межмуниципальная, региональная, межрегиональная, федеральная"}, {"t": "Зона заражения", "d": "территория, в пределах которой распространены опасные химические, радиоактивные или биологические агенты"}, {"t": "Комбинированные поражения", "d": "сочетанное действие нескольких факторов, когда травма накладывается на ожог или облучение и утяжеляет исход"}, {"t": "Психогенные потери", "d": "доля людей в очаге с острой реакцией на стресс, утративших способность к целесообразным действиям"}], "quiz": [{"q": "Классификация ЧС по масштабу выстроена так:", "ok": "Локальная, муниципальная, межмуниципальная, региональная, межрегиональная, федеральная", "bad": ["Первичная, вторичная, третичная", "Механическая, тепловая, химическая, радиационная", "Мгновенная, пролонгированная, отсроченная"], "why": "Второй и третий варианты — это классификации поражающих факторов, а не масштаба ЧС."}, {"q": "Комбинированное поражение — это:", "ok": "Сочетанное действие нескольких поражающих факторов, утяжеляющее исход", "bad": ["Поражение, полученное несколькими людьми одновременно", "Поражение, возникшее в двух разных очагах", "Любое поражение с длительным лечением"], "why": "Травма плюс ожог или облучение дают исход тяжелее, чем каждое повреждение по отдельности."}, {"q": "Психологическая помощь пострадавшим в очаге:", "ok": "Входит в состав аварийно-спасательных работ", "bad": ["Оказывается только после полного завершения спасательных работ", "Не относится к задачам служб, работающих в очаге", "Проводится исключительно в стационаре"], "why": "Психогенные потери снижают эффективность эвакуации, поэтому помощь оказывается непосредственно в очаге."}], "alias_of": 43}, {"n": 15, "title": "Экологические аспекты БЖД. Экологически опасные факторы", "kostyak": ["Экологический аспект безопасности жизнедеятельности состоит в том, что человек постоянно живёт в среде, изменённой его же деятельностью, и эта среда действует на здоровье не разово, как при ЧС, а хронически, малыми дозами и годами.", "Экологически опасный фактор — это любой компонент среды, который при определённой интенсивности вызывает негативные изменения в состоянии здоровья человека и в экосистемах. Делят такие факторы на три группы: физические, химические и биологические.", "Физические факторы: шум, инфразвук и ультразвук, вибрация, электромагнитные поля и излучения, ионизирующее излучение, тепловое и световое загрязнение, запылённость воздуха.", "Отдельно выделю ионизирующее излучение и радон в помещениях, а также электромагнитное загрязнение от линий электропередач и передающих устройств — это специфика именно городской среды.", "Химические факторы: тяжёлые металлы, свинец, ртуть, кадмий; оксиды серы и азота; угарный газ; нефтепродукты; пестициды; диоксины; синтетические поверхностно-активные вещества; формальдегид и летучие органические соединения в отделочных материалах.", "Биологические факторы: патогенные микроорганизмы, вирусы, грибы и продукты их жизнедеятельности, микотоксины; аллергены, включая пыльцу и плесень; продукты биотехнологического производства; последствия неконтролируемого распространения чужеродных видов.", "Механизм действия у этих факторов общий: эффект зависит от дозы и времени экспозиции, многие вещества обладают кумулятивным действием, то есть накапливаются, а некоторые дают отдалённые эффекты — канцерогенный, мутагенный, тератогенный, гонадотропный.", "Нормирование опирается на понятие предельно допустимой концентрации и предельно допустимого уровня. Причём для детей действуют более жёсткие требования, потому что детский организм чувствительнее к тем же дозам.", "Отсюда практический вывод: экологическая безопасность — это в первую очередь нормирование, контроль и мониторинг, а не ликвидация уже случившегося."], "terms": ["экологически опасный фактор", "экспозиция", "доза", "кумулятивный эффект", "канцерогенное", "мутагенное", "тератогенное действие", "предельно допустимая концентрация (ПДК)", "предельно допустимый уровень (ПДУ)", "тяжёлые металлы", "диоксины", "микотоксины", "санитарно-эпидемиологические требования"], "follow": [{"q": "Что такое ПДК и почему для одного вещества их несколько?", "a": "Предельно допустимая концентрация — это норматив содержания вещества, при котором оно не оказывает вредного воздействия на человека в течение всей жизни. Нормативов несколько, потому что они устанавливаются отдельно для воздуха рабочей зоны, атмосферного воздуха населённых мест, воды и почвы, а для атмосферного воздуха ещё различают максимальную разовую и среднесуточную концентрацию."}, {"q": "Какой физический фактор вы считаете самым недооценённым в школе?", "a": "Шум. Он не воспринимается как опасность, но при постоянном превышении даёт утомление, снижение концентрации внимания и рост тревожности, а у педагогов ещё и профессиональные нагрузки на голос."}], "notes": [{"label": "Разворот на школу", "text": "здесь напрямую работают санитарно-эпидемиологические требования к образовательным организациям — освещённость, воздушно-тепловой режим, проветривание, шум, мебель по росту, ограничение экранного времени. Это тот случай, когда экология из глобальной темы превращается в ежедневную работу с расписанием и кабинетом."}], "block": "ЧС, ГО, РСЧС", "bk": "chs", "tier": 3, "psy": false, "aid": false, "core": "Экологический аспект БЖД в том, что изменённая человеком среда действует на здоровье не разово, как ЧС, а хронически — малыми дозами и годами. Поэтому защита здесь строится на нормировании, контроле и мониторинге.", "anchors": ["хроническое действие", "три группы факторов", "доза и экспозиция", "кумуляция", "ПДК и ПДУ"], "simple": ["Экологически опасный фактор — любой компонент среды, который при определённой интенсивности вызывает негативные изменения в здоровье человека и в экосистемах. Такие факторы делят на три группы: физические, химические, биологические.", "Физические факторы: шум, инфразвук и ультразвук, вибрация, электромагнитные поля и излучения, ионизирующее излучение, тепловое и световое загрязнение, запылённость воздуха.", "Химические факторы: тяжёлые металлы (свинец, ртуть, кадмий), оксиды серы и азота, угарный газ, нефтепродукты, пестициды, диоксины, формальдегид и летучие органические соединения в отделочных материалах.", "Биологические факторы: патогенные микроорганизмы, вирусы, грибы и микотоксины, аллергены (пыльца, плесень), последствия распространения чужеродных видов.", "Механизм действия общий: эффект зависит от дозы и времени экспозиции, многие вещества обладают кумулятивным действием, то есть накапливаются, а некоторые дают отдалённые эффекты — канцерогенный, мутагенный, тератогенный, гонадотропный.", "Нормирование опирается на предельно допустимую концентрацию (ПДК) и предельно допустимый уровень (ПДУ); для детей требования жёстче, потому что организм чувствительнее. Отсюда вывод: экологическая безопасность — это нормирование, контроль и мониторинг, а не ликвидация уже случившегося."], "cards": [{"t": "Экологически опасный фактор", "d": "компонент среды, который при определённой интенсивности вызывает негативные изменения здоровья человека и состояния экосистем"}, {"t": "Группы экологически опасных факторов", "d": "физические, химические, биологические"}, {"t": "Физические экологические факторы", "d": "шум, инфразвук и ультразвук, вибрация, электромагнитные поля, ионизирующее излучение, тепловое и световое загрязнение, запылённость"}, {"t": "Отдалённые эффекты действия вредных веществ", "d": "канцерогенный, мутагенный, тератогенный, гонадотропный"}, {"t": "Предельно допустимая концентрация (ПДК)", "d": "норматив содержания вещества в среде, при котором оно не оказывает вредного воздействия на человека в течение всей жизни"}, {"t": "Кумулятивный эффект", "d": "накопление вещества или последствий его действия в организме при повторяющихся малых дозах"}], "quiz": [{"q": "На какие группы делят экологически опасные факторы?", "ok": "физические, химические, биологические", "bad": ["физические, химические, социальные", "природные, техногенные, биолого-социальные", "механические, химические, биологические"], "why": "Три группы: физические, химические, биологические. Биолого-социальные — это про классификацию ЧС, не про экологические факторы."}, {"q": "Чем действие экологических факторов отличается от поражающих факторов ЧС?", "ok": "действуют хронически, малыми дозами, с накоплением эффекта", "bad": ["действуют мгновенно и всегда в границах одной территории", "не поддаются нормированию", "затрагивают только производственную среду"], "why": "Отсюда и защита другая: не ликвидация, а нормирование, контроль и мониторинг."}, {"q": "Для чего устанавливается предельно допустимый уровень (ПДУ)?", "ok": "для физических воздействий — шума, вибрации, излучений", "bad": ["для содержания химических веществ в воздухе", "для объёма выбросов конкретного предприятия", "для предельного объёма размещения отходов"], "why": "ПДК — про концентрацию вещества, ПДУ — про уровень физического воздействия."}]}, {"n": 16, "title": "Антропогенное воздействие на окружающую среду. Глобальные экологические проблемы", "kostyak": ["Антропогенное воздействие — это влияние хозяйственной деятельности человека на природную среду, которое изменяет её состояние и структуру. Принципиально оно отличается от природных изменений скоростью: то, что биосфера проходила за тысячи лет, техносфера меняет за десятилетия.", "Виды воздействий удобно перечислить по средам. На атмосферу — выбросы промышленности, транспорта и энергетики, парниковые газы, озоноразрушающие вещества.", "На гидросферу — сброс сточных вод, эвтрофикация водоёмов, нефтяное загрязнение Мирового океана, зарегулирование стока рек плотинами.", "На литосферу и почву — эрозия, засоление, загрязнение пестицидами и тяжёлыми металлами, изъятие земель под свалки и карьеры, накопление твёрдых коммунальных отходов.", "На биоту — обезлесение, перепромысел, разрушение мест обитания, интродукция чужеродных видов, сокращение биологического разнообразия.", "Из этих воздействий складываются глобальные проблемы. Первая — изменение климата и усиление парникового эффекта. Вторая — разрушение озонового слоя. Третья — кислотные осадки.", "Дальше — опустынивание и деградация земель, обезлесение, дефицит пресной воды, сокращение биоразнообразия, загрязнение Мирового океана, включая пластиковое, и проблема накопления отходов.", "Общая черта у всех этих проблем одна: они трансграничны, то есть последствия не совпадают с границами государства-источника. Поэтому решаются они только международными соглашениями — рамочная конвенция по климату, конвенция о биоразнообразии, соглашения по озоновому слою.", "И концептуальный ответ на всё это — переход к устойчивому развитию: удовлетворение потребностей нынешнего поколения без ущерба возможностям будущих. Практические инструменты — нормирование, экологическая экспертиза, экологический мониторинг, наилучшие доступные технологии и экологическое образование."], "terms": ["антропогенное воздействие", "техносфера", "биосфера", "эвтрофикация", "интродукция чужеродных видов", "биологическое разнообразие", "трансграничный характер", "устойчивое развитие", "экологическая экспертиза", "экологический мониторинг", "наилучшие доступные технологии"], "follow": [{"q": "Что такое устойчивое развитие?", "a": "Модель развития, при которой удовлетворение потребностей нынешнего поколения не лишает будущие поколения возможности удовлетворять свои. Стоит на трёх опорах — экономической, социальной и экологической, и требует, чтобы решения принимались с учётом всех трёх сразу."}, {"q": "Может ли антропогенное воздействие быть положительным?", "a": "Да. Рекультивация нарушенных земель, лесовосстановление, создание особо охраняемых природных территорий, восстановление популяций редких видов. Термин описывает влияние человека, а знак этого влияния зависит от характера деятельности."}], "notes": [{"label": "Разворот на школу", "text": "экологическое образование в этой логике не факультатив, а элемент системы безопасности. Оно формирует ту самую культуру безопасности, из которой потом вырастает поведение взрослого человека — от раздельного сбора отходов до готовности соблюдать ограничения."}], "block": "ЧС, ГО, РСЧС", "bk": "chs", "tier": 3, "psy": false, "aid": false, "core": "Антропогенное воздействие — влияние хозяйственной деятельности человека на природную среду; от природных изменений оно отличается прежде всего скоростью. Вытекающие из него глобальные проблемы трансграничны, поэтому решаются только сообща — через международные соглашения и переход к устойчивому развитию.", "anchors": ["скорость изменений", "четыре среды", "трансграничность", "международные соглашения", "устойчивое развитие"], "simple": ["Антропогенное воздействие изменяет состояние и структуру природной среды; принципиально оно отличается от природных изменений скоростью — то, что биосфера проходила за тысячи лет, техносфера меняет за десятилетия.", "Воздействия удобно перечислять по средам: на атмосферу (выбросы промышленности, транспорта и энергетики, парниковые и озоноразрушающие газы); на гидросферу (сточные воды, эвтрофикация, нефтяное загрязнение океана, зарегулирование стока рек); на литосферу и почву (эрозия, засоление, загрязнение, свалки и карьеры, накопление отходов); на биоту (обезлесение, перепромысел, интродукция чужеродных видов, сокращение биоразнообразия).", "Из этих воздействий складываются глобальные проблемы: изменение климата и усиление парникового эффекта, разрушение озонового слоя, кислотные осадки, опустынивание, обезлесение, дефицит пресной воды, сокращение биоразнообразия, загрязнение Мирового океана, накопление отходов.", "Общая черта всех этих проблем — трансграничность: последствия не совпадают с границами государства-источника, поэтому решаются они только международными соглашениями — по климату, по биоразнообразию, по озоновому слою.", "Концептуальный ответ — переход к устойчивому развитию: удовлетворение потребностей нынешнего поколения без ущерба возможностям будущих; оно стоит на трёх опорах — экономической, социальной, экологической.", "Практические инструменты — нормирование, экологическая экспертиза, экологический мониторинг, наилучшие доступные технологии и экологическое образование."], "cards": [{"t": "Антропогенное воздействие", "d": "влияние хозяйственной деятельности человека на природную среду, изменяющее её состояние и структуру"}, {"t": "Виды антропогенных воздействий по средам", "d": "на атмосферу, на гидросферу, на литосферу и почву, на биоту"}, {"t": "Глобальные экологические проблемы", "d": "изменение климата, разрушение озонового слоя, кислотные осадки, опустынивание, обезлесение, дефицит пресной воды, сокращение биоразнообразия, загрязнение Мирового океана, накопление отходов"}, {"t": "Трансграничный характер проблем", "d": "последствия не совпадают с границами государства-источника, поэтому требуют международных соглашений"}, {"t": "Устойчивое развитие", "d": "удовлетворение потребностей нынешнего поколения без ущерба возможностям будущих; опоры — экономическая, социальная, экологическая"}, {"t": "Эвтрофикация", "d": "перенасыщение водоёма биогенными веществами со сбросами, ведущее к бурному росту водорослей и деградации водоёма"}], "quiz": [{"q": "Что принципиально отличает антропогенные изменения среды от природных?", "ok": "скорость: техносфера меняет за десятилетия то, что биосфера проходила за тысячи лет", "bad": ["масштаб: антропогенные изменения всегда локальны", "обратимость: антропогенные изменения всегда обратимы", "знак: антропогенное воздействие всегда отрицательно"], "why": "Знак зависит от характера деятельности — рекультивация и лесовосстановление тоже антропогенное воздействие."}, {"q": "Почему глобальные экологические проблемы решаются международными соглашениями?", "ok": "потому что они трансграничны и выходят за границы государства-источника", "bad": ["потому что этого требует национальное законодательство каждой страны", "потому что у отдельных стран нет технологий мониторинга", "потому что ущерб считается только в мировых ценах"], "why": "Трансграничность — общая черта всех глобальных проблем."}, {"q": "На каких трёх опорах стоит концепция устойчивого развития?", "ok": "экономическая, социальная, экологическая", "bad": ["экономическая, политическая, экологическая", "социальная, технологическая, правовая", "экологическая, демографическая, культурная"], "why": "Решения должны учитывать все три опоры одновременно."}]}, {"n": 50, "title": "Глобальные экологические проблемы. Критерии оценки качества окружающей среды", "kostyak": ["Разберу механизмы четырёх ключевых проблем, а затем перейду к критериям оценки качества среды.", "Парниковый эффект сам по себе — естественное явление. Атмосфера пропускает коротковолновое солнечное излучение к поверхности Земли, но задерживает длинноволновое тепловое излучение обратно в космос. Без него средняя температура планеты была бы примерно на тридцать градусов ниже и жизнь в нынешнем виде была бы невозможна.", "Проблема начинается тогда, когда концентрация парниковых газов растёт из-за человека. Основные газы — углекислый газ, метан, закись азота, водяной пар и фреоны. Источники — сжигание ископаемого топлива, сельское хозяйство, вырубка лесов, которые поглощали углекислый газ.", "Следствия глобального потепления — таяние ледников и многолетней мерзлоты, повышение уровня Мирового океана, рост частоты и силы опасных погодных явлений, смещение климатических зон и сельскохозяйственных поясов.", "Кислотные осадки образуются так: в атмосферу поступают оксиды серы и азота от энергетики, металлургии и транспорта, там они соединяются с водяным паром и превращаются в серную и азотную кислоты, которые выпадают с дождём и снегом. Последствия — закисление почв и водоёмов, гибель рыбы, усыхание лесов, разрушение зданий и памятников.", "Разрушение озонового слоя вызывают хлорфторуглероды, фреоны и галоны. Озоновый экран задерживает жёсткое ультрафиолетовое излучение, при его истончении растёт частота рака кожи, катаракты, снижается продуктивность растений и планктона.", "Четвёртая проблема — опустынивание и деградация земель из-за перевыпаса, сведения лесов, неправильного орошения с последующим засолением.", "Теперь критерии оценки качества среды. Качество окружающей среды — это степень соответствия её характеристик потребностям человека и требованиям экосистем. Оценивается по системе нормативов.", "Первая группа — санитарно-гигиенические нормативы: предельно допустимая концентрация, предельно допустимый уровень физического воздействия, ориентировочно безопасный уровень воздействия для веществ с неустановленной ПДК. Вторая — производственно-хозяйственные: предельно допустимый выброс в атмосферу и предельно допустимый сброс в водные объекты, лимиты на размещение отходов. Третья — комплексные, например индекс загрязнения атмосферы и классы качества воды.", "Инструменты применения этих нормативов — государственный экологический мониторинг, государственная экологическая экспертиза, экологический контроль и надзор."], "terms": ["парниковый эффект", "парниковые газы", "углекислый газ", "метан", "фреоны", "озоновый экран", "хлорфторуглероды", "кислотные осадки", "оксиды серы и азота", "опустынивание", "качество окружающей среды", "ПДК", "ПДУ", "ОБУВ", "ПДВ", "ПДС", "индекс загрязнения атмосферы", "государственный экологический мониторинг"], "follow": [{"q": "Чем ПДК отличается от ПДВ?", "a": "ПДК — концентрация вещества в среде, норматив качества самой среды. ПДВ — предельно допустимый выброс, то есть норматив для конкретного источника, установленный так, чтобы суммарный выброс всех источников не привёл к превышению ПДК в приземном слое."}, {"q": "Почему проблема озонового слоя считается наиболее успешно решаемой?", "a": "Потому что по ней удалось договориться о поэтапном отказе от озоноразрушающих веществ и заменить их технологически. Круг веществ был узкий, замена нашлась, и это дало измеримый результат — в отличие от климата, где источник выбросов — вся мировая энергетика сразу."}], "notes": [], "block": "ЧС, ГО, РСЧС", "bk": "chs", "tier": 3, "psy": false, "aid": false, "core": "В основе четырёх ключевых экологических проблем лежат конкретные механизмы — парниковый эффект, кислотные осадки, разрушение озонового слоя, опустынивание, — а качество окружающей среды измеряется системой нормативов трёх групп.", "anchors": ["механизм", "а не список", "парниковый эффект естественен", "оксиды серы и азота", "озоновый экран", "три группы нормативов"], "simple": ["Парниковый эффект сам по себе естественен и необходим: атмосфера пропускает коротковолновое солнечное излучение к поверхности, но задерживает длинноволновое тепловое обратно в космос; без него планета была бы примерно на тридцать градусов холоднее. Проблема начинается с роста концентрации парниковых газов — углекислого газа, метана, закиси азота, водяного пара, фреонов — из-за сжигания топлива, сельского хозяйства и вырубки лесов.", "Следствия глобального потепления — таяние ледников и многолетней мерзлоты, повышение уровня Мирового океана, рост числа опасных погодных явлений, смещение климатических и сельскохозяйственных зон.", "Кислотные осадки образуются в три шага: оксиды серы и азота от энергетики, металлургии и транспорта поступают в атмосферу → соединяются с водяным паром → выпадают с дождём и снегом серной и азотной кислотами. Последствия — закисление почв и водоёмов, гибель рыбы, усыхание лесов, разрушение зданий и памятников.", "Озоновый слой разрушают хлорфторуглероды, фреоны и галоны; озоновый экран задерживает жёсткий ультрафиолет, при его истончении растёт частота рака кожи и катаракты, падает продуктивность растений и планктона. Четвёртая проблема — опустынивание и деградация земель.", "Качество окружающей среды — степень соответствия её характеристик потребностям человека и требованиям экосистем; оценивается по трём группам нормативов.", "Нормативы: санитарно-гигиенические (ПДК, ПДУ, ОБУВ для веществ без установленной ПДК); производственно-хозяйственные (предельно допустимый выброс ПДВ, сброс ПДС, лимиты на отходы); комплексные (индекс загрязнения атмосферы, классы качества воды). Применяют их через государственный экологический мониторинг, экспертизу, контроль и надзор."], "cards": [{"t": "Парниковый эффект", "d": "атмосфера пропускает коротковолновое солнечное излучение к поверхности, но задерживает длинноволновое тепловое излучение обратно в космос"}, {"t": "Парниковые газы", "d": "углекислый газ, метан, закись азота, водяной пар, фреоны"}, {"t": "Механизм кислотных осадков", "d": "оксиды серы и азота поступают в атмосферу, соединяются с водяным паром и выпадают в виде серной и азотной кислот"}, {"t": "Качество окружающей среды", "d": "степень соответствия характеристик среды потребностям человека и требованиям экосистем"}, {"t": "Группы нормативов качества среды", "d": "санитарно-гигиенические (ПДК, ПДУ, ОБУВ), производственно-хозяйственные (ПДВ, ПДС, лимиты на размещение отходов), комплексные (индекс загрязнения атмосферы, классы качества воды)"}, {"t": "ПДК против ПДВ", "d": "ПДК — норматив качества самой среды, ПДВ — норматив выброса для конкретного источника, установленный так, чтобы суммарный выброс не превысил ПДК"}], "quiz": [{"q": "В чём состоит механизм парникового эффекта?", "ok": "атмосфера пропускает коротковолновое солнечное излучение к Земле и задерживает длинноволновое тепловое излучение обратно", "bad": ["атмосфера отражает солнечное излучение, не пропуская его к поверхности", "парниковые газы нагреваются сами и передают тепло поверхности Земли", "озоновый слой удерживает тепло у поверхности планеты"], "why": "Сам эффект естественный и необходим для жизни. Проблему создаёт рост концентрации парниковых газов."}, {"q": "Какие вещества дают кислотные осадки?", "ok": "оксиды серы и азота", "bad": ["хлорфторуглероды и галоны", "метан и закись азота", "тяжёлые металлы и диоксины"], "why": "Хлорфторуглероды и галоны разрушают озоновый слой, метан — парниковый газ."}, {"q": "К какой группе нормативов относятся ПДВ и ПДС?", "ok": "к производственно-хозяйственным", "bad": ["к санитарно-гигиеническим", "к комплексным", "к нормативам физического воздействия"], "why": "Санитарно-гигиенические — ПДК, ПДУ, ОБУВ, то есть про среду. ПДВ и ПДС адресованы конкретному источнику."}, {"q": "Для чего устанавливается ОБУВ?", "ok": "для веществ, у которых ПДК ещё не установлена", "bad": ["для оценки суммарного загрязнения атмосферы города", "для ограничения объёма размещаемых отходов", "для нормирования шума и вибрации"], "why": "Ориентировочно безопасный уровень воздействия — временный ориентир там, где норматив ПДК не выведен."}]}, {"n": 55, "title": "Угрозы гражданской безопасности. Природные явления, аварии и техногенные катастрофы", "kostyak": ["«Под гражданской безопасностью понимают защищённость населения, материальных и культурных ценностей от опасностей мирного и военного времени. Это поле гражданской обороны и единой государственной системы предупреждения и ликвидации ЧС — РСЧС».", "«Угрозы делят на природные, техногенные, биолого-социальные и социальные, включая террористические проявления».", "«Угрозы опасных природных явлений: геофизические — землетрясения, извержения; геологические — оползни, сели, лавины, обвалы; метеорологические — ураганы, смерчи, сильные морозы и жара, засухи; гидрологические — наводнения, паводки, заторы; природные пожары».", "«Их особенность — внезапность и большой охват территории. Управлять источником нельзя, снижают только уязвимость: прогноз, мониторинг, оповещение, инженерная защита, ограничения застройки».", "«Техногенные угрозы: аварии на радиационно и химически опасных объектах, пожары и взрывы, транспортные аварии, аварии на гидротехнических сооружениях, обрушения зданий, отказы систем жизнеобеспечения».", "«Катастрофа отличается от аварии масштабом последствий: гибель людей, тяжёлый ущерб, длительное нарушение жизнедеятельности территории».", "«Причины техногенных ЧС однотипны: износ фондов, нарушение технологической дисциплины, ошибки проектирования, экономия на защите и человеческий фактор в широком смысле».", "«Система противодействия строится на предупреждении и ликвидации: мониторинг и прогнозирование, оповещение населения, подготовка населения и обучение, силы и средства РСЧС, эвакуационные мероприятия, резервы»."], "terms": ["гражданская оборона", "РСЧС", "авария и катастрофа", "потенциально опасный объект", "радиационно и химически опасные объекты", "мониторинг и прогнозирование", "оповещение населения", "эвакуация", "уязвимость территории"], "follow": [{"q": "Чем ЧС отличается от происшествия?", "a": "— ЧС — обстановка на территории, сложившаяся в результате опасного события, которая повлекла или может повлечь жертвы, ущерб, нарушение условий жизнедеятельности и требует привлечения сил и средств вне обычного режима работы."}, {"q": "Что важнее — предупреждение или ликвидация?", "a": "— Предупреждение. Вложения в прогноз, инженерную защиту и обучение населения дают существенно больший эффект на единицу затрат, чем работа по последствиям. Конкретные соотношения по источникам расходятся, но вывод устойчивый."}], "notes": [], "block": "Теория, риск, ЗОЖ", "bk": "teor", "tier": 3, "psy": false, "aid": false, "core": "Гражданская безопасность — защищённость населения и ценностей от опасностей мирного и военного времени, поле гражданской обороны и РСЧС. Угрозы делят на природные, техногенные, биолого-социальные и социальные, и предупреждение всегда выгоднее ликвидации.", "anchors": ["гражданская оборона и РСЧС", "четыре группы угроз", "авария и катастрофа", "предупреждение важнее ликвидации"], "simple": ["Гражданская безопасность — защищённость населения, материальных и культурных ценностей от опасностей мирного и военного времени; это поле гражданской обороны и РСЧС. Угрозы делят на природные, техногенные, биолого-социальные и социальные.", "Природные угрозы по стихиям: геофизические (землетрясения, извержения), геологические (оползни, сели, лавины), метеорологические (ураганы, засухи, морозы), гидрологические (наводнения, паводки), природные пожары.", "Источником природных опасностей управлять нельзя, поэтому снижают уязвимость: прогноз, мониторинг, оповещение, инженерная защита, ограничения застройки.", "Авария и катастрофа различаются масштабом последствий: катастрофа — гибель людей, тяжёлый ущерб, длительное нарушение жизнедеятельности территории. Различие количественное, по тяжести, а не по типу события.", "Причины техногенных ЧС однотипны: износ фондов, нарушение технологической дисциплины, ошибки проектирования, экономия на защите, человеческий фактор.", "Предупреждение выгоднее ликвидации: вложения в прогноз, инженерную защиту и обучение дают больший эффект на единицу затрат (точные соотношения по источникам расходятся, вывод устойчив)."], "cards": [{"t": "Гражданская безопасность", "d": "защищённость населения, материальных и культурных ценностей от опасностей мирного и военного времени"}, {"t": "РСЧС", "d": "единая государственная система предупреждения и ликвидации чрезвычайных ситуаций"}, {"t": "Авария", "d": "повреждение или разрушение технической системы без масштабных последствий для территории"}, {"t": "Катастрофа", "d": "событие, отличающееся масштабом последствий: гибель людей, тяжёлый ущерб, длительное нарушение жизнедеятельности территории"}, {"t": "Чрезвычайная ситуация", "d": "обстановка на территории после опасного события, которая повлекла или может повлечь жертвы и ущерб и требует сил и средств вне обычного режима"}, {"t": "Уязвимость территории", "d": "степень подверженности территории и населения воздействию опасного явления; снижается прогнозом, защитой и ограничением застройки"}], "quiz": [{"q": "Чем катастрофа отличается от аварии?", "ok": "Масштабом последствий: гибель людей, тяжёлый ущерб, длительное нарушение жизнедеятельности территории", "bad": ["Тем, что катастрофа всегда природная, а авария техногенная", "Тем, что авария происходит на транспорте, а катастрофа на производстве", "Тем, что катастрофа не требует привлечения сил РСЧС"], "why": "Различие количественное, по тяжести, а не по типу события."}, {"q": "Оползни, сели и лавины относятся к угрозам:", "ok": "Геологическим", "bad": ["Геофизическим", "Метеорологическим", "Гидрологическим"], "why": "Геофизические — землетрясения и извержения, метеорологические — ураганы и засухи, гидрологические — наводнения и паводки."}, {"q": "Что эффективнее в системе защиты населения?", "ok": "Предупреждение: прогноз, инженерная защита, обучение населения", "bad": ["Ликвидация последствий, поскольку предупредить ЧС невозможно", "Только страхование имущества", "Только увеличение численности спасательных подразделений"], "why": "Вложения в предупреждение дают больший эффект на единицу затрат, чем работа по последствиям."}, {"q": "Управлять источником природной опасности нельзя, поэтому основной путь защиты — это:", "ok": "Снижение уязвимости: мониторинг, прогноз, оповещение, инженерная защита, ограничение застройки", "bad": ["Полное расселение опасных территорий", "Отказ от прогнозирования как ненадёжного метода", "Увеличение страховых выплат"], "why": "Землетрясение или ураган остановить невозможно, значит, работают с готовностью территории и населения."}]}, {"n": 57, "title": "Безопасность и демография. Демографическая и миграционная политика РФ", "kostyak": ["Демографическая безопасность — состояние защищённости общества от процессов, ведущих к депопуляции, разрушению возрастной структуры и утрате трудового потенциала. Это часть национальной безопасности, потому что численность и структура населения определяют и экономику, и обороноспособность.", "Основные демографические процессы, влияющие на безопасность: рождаемость, смертность, продолжительность жизни, миграция, возрастная структура населения.", "Тенденции, характерные для России и для большинства развитых стран: старение населения, снижение доли населения репродуктивного возраста, устойчиво низкая рождаемость по отношению к уровню простого воспроизводства, неравномерность расселения по территории страны. Формулирую именно как тенденции, точные показатели меняются.", "Демографическая политика — система мер государства, направленная на воспроизводство населения. Инструменты: меры материальной поддержки семей с детьми, развитие доступности жилья, здравоохранение и снижение смертности, поддержка семьи как ценности.", "Миграционная политика решает две задачи одновременно: восполнение трудовых ресурсов и обеспечение безопасности, включая противодействие незаконной миграции.", "Виды миграции: внутренняя и внешняя, постоянная и временная, трудовая, образовательная, вынужденная. Отдельно выделяют незаконную миграцию как источник криминальных и санитарно-эпидемиологических рисков.", "Риски миграции с точки зрения безопасности: социальная напряжённость в принимающих сообществах, сложности интеграции, формирование замкнутых анклавов, нагрузка на социальную инфраструктуру.", "Для образования это прямая задача: обучение детей мигрантов, языковая адаптация, профилактика межэтнических конфликтов в классе."], "terms": ["демографическая безопасность", "депопуляция", "воспроизводство населения", "суммарный коэффициент рождаемости", "старение населения", "демографическая политика", "миграционный прирост", "трудовая миграция", "незаконная миграция", "социокультурная адаптация", "аккультурация"], "follow": [{"q": "Почему демография — вопрос безопасности, а не только экономики?", "a": "Потому что структура населения определяет мобилизационный и трудовой ресурс, устойчивость пенсионной системы и способность удерживать освоенность территории."}, {"q": "В чём главная задача школы при работе с детьми мигрантов?", "a": "Языковая и социокультурная адаптация без вытеснения ребёнка в изолированную группу, то есть поддержка стратегии интеграции."}], "notes": [{"label": "Заходит от психологии", "text": "аккультурация и её стратегии — интеграция, ассимиляция, сепарация, маргинализация. Это классическая модель, она хорошо ложится на разговор об адаптации детей мигрантов в школе. Плюс тема этнических стереотипов и межгрупповых предубеждений."}], "block": "Социальные угрозы", "bk": "soc", "tier": 3, "psy": false, "aid": false, "core": "Численность и структура населения определяют экономику, оборону и освоенность территории, поэтому демографическая безопасность входит в национальную; миграционная политика решает две задачи сразу — восполнение трудовых ресурсов и противодействие незаконной миграции.", "anchors": ["депопуляция", "воспроизводство населения", "старение", "виды миграции", "аккультурация"], "simple": ["Демографическая безопасность — состояние защищённости общества от процессов, ведущих к депопуляции, разрушению возрастной структуры и утрате трудового потенциала. Это часть национальной безопасности: от структуры населения зависят трудовой ресурс, пенсионная система и способность удерживать освоенность территории.", "Процессы, которые на неё влияют: рождаемость, смертность, продолжительность жизни, миграция, возрастная структура населения.", "Тенденции России и большинства развитых стран: старение населения, снижение доли населения репродуктивного возраста, низкая рождаемость относительно простого воспроизводства, неравномерность расселения по территории страны.", "Демографическая политика — система мер государства по воспроизводству населения: материальная поддержка семей с детьми, доступность жилья, снижение смертности, поддержка семьи как ценности.", "Миграционная политика решает две задачи сразу: восполнение трудовых ресурсов и противодействие незаконной миграции. Виды миграции: внутренняя и внешняя, постоянная и временная, трудовая, образовательная, вынужденная; отдельно незаконная миграция как источник криминальных и санитарно-эпидемиологических рисков.", "Риски миграции по линии безопасности: социальная напряжённость в принимающих сообществах, сложности интеграции, замкнутые анклавы, нагрузка на инфраструктуру. Стратегии аккультурации — интеграция, ассимиляция, сепарация, маргинализация; в работе с детьми мигрантов задача — языковая и социокультурная адаптация через интеграцию, без вытеснения в изолированную группу."], "cards": [{"t": "Демографическая безопасность", "d": "Состояние защищённости общества от процессов, ведущих к депопуляции, разрушению возрастной структуры и утрате трудового потенциала."}, {"t": "Депопуляция", "d": "Устойчивое сокращение численности населения."}, {"t": "Воспроизводство населения", "d": "Процесс смены поколений через рождаемость и смертность; простое воспроизводство означает замещение поколения родителей поколением детей."}, {"t": "Незаконная миграция", "d": "Въезд, пребывание или трудовая деятельность с нарушением установленного порядка; рассматривается как источник криминальных и санитарно-эпидемиологических рисков."}, {"t": "Социокультурная адаптация", "d": "Приспособление человека к нормам, языку и повседневным правилам принимающего сообщества."}, {"t": "Аккультурация", "d": "Изменение культурных установок человека при длительном контакте с другой культурой; описывается четырьмя стратегиями — интеграция, ассимиляция, сепарация, маргинализация."}], "quiz": [{"q": "Какая стратегия аккультурации означает сохранение своей культуры при включении в принимающее сообщество?", "ok": "Интеграция", "bad": ["Ассимиляция", "Сепарация", "Маргинализация"], "why": "Ассимиляция — отказ от своей культуры, сепарация — замыкание в своей, маргинализация — потеря обеих. Интеграция сочетает своё и новое."}, {"q": "Почему демографию относят к вопросам национальной безопасности?", "ok": "Структура населения определяет трудовой и мобилизационный ресурс и освоенность территории", "bad": ["Численность населения — главный показатель уровня жизни", "Демографические процессы регулируются теми же органами, что и оборона", "Рождаемость напрямую влияет на объём государственного долга"], "why": "Речь о ресурсной базе государства: людей меньше — сжимается экономика, оборона и удержание пространства."}, {"q": "Какая задача школы при работе с детьми мигрантов соответствует стратегии интеграции?", "ok": "Языковая и социокультурная адаптация без вытеснения ребёнка в изолированную группу", "bad": ["Формирование отдельных классов по языковому признаку", "Освобождение от предметов, требующих свободного владения языком", "Сокращение контактов с классом до достижения языкового уровня"], "why": "Отдельные классы и сокращение контактов — это сепарация. Интеграция требует включённости в общую среду вместе с языковой поддержкой."}]}, {"n": 59, "title": "Источники международных опасностей", "kostyak": ["Международная безопасность — состояние отношений между государствами, при котором отсутствует угроза войны и обеспечены условия для устойчивого развития. Соответственно, международная опасность — фактор, способный это состояние нарушить.", "Источники удобно классифицировать по природе. Военно-политические: вооружённые конфликты, распространение оружия массового поражения, гонка вооружений, деятельность незаконных вооружённых формирований.", "Экономические: неравномерность развития, конкуренция за ресурсы, нестабильность мировых рынков, долговые кризисы.", "Природно-экологические: изменение климата, дефицит пресной воды, трансграничное загрязнение, крупные техногенные аварии с последствиями за пределами одной страны.", "Социально-гуманитарные: массовая вынужденная миграция, эпидемии и пандемии, голод, бедность.", "Информационные: информационные войны, кибератаки на критическую инфраструктуру, распространение недостоверной информации.", "Транснациональные криминальные: международный терроризм, наркотрафик, торговля людьми, отмывание денег, пиратство.", "Общая причина у большинства источников одна — неравномерность развития и рост взаимозависимости государств: глобализация повышает связанность, а вместе с ней растёт скорость распространения любой угрозы. Ни одна из этих опасностей не решается силами одного государства, отсюда и необходимость международного сотрудничества."], "terms": ["международная безопасность", "глобальные проблемы современности", "оружие массового поражения", "нераспространение", "транснациональная преступность", "критическая инфраструктура", "трансграничный характер угроз", "глобализация", "взаимозависимость"], "follow": [{"q": "Что такое глобальные проблемы?", "a": "Проблемы, которые затрагивают человечество в целом и не могут быть решены усилиями отдельных государств: экология, ресурсы, демография, разоружение, эпидемии."}, {"q": "Какие угрозы называют «новыми»?", "a": "Те, где источником выступает не государство: терроризм, кибератаки, пандемии, транснациональная преступность."}], "notes": [], "block": "Социальные угрозы", "bk": "soc", "tier": 3, "psy": false, "aid": false, "core": "Международная безопасность — состояние отношений между государствами без угрозы войны; источники международных опасностей раскладывают по природе на несколько групп, и почти у всех общий корень — неравномерность развития и рост взаимозависимости государств.", "anchors": ["военно-политические", "экономические", "экологические", "информационные", "транснациональные криминальные", "глобализация"], "simple": ["Международная безопасность — состояние отношений между государствами, при котором нет угрозы войны и обеспечены условия для устойчивого развития. Международная опасность — фактор, способный это состояние нарушить.", "Классификация по природе: военно-политические, экономические, природно-экологические, социально-гуманитарные, информационные, транснациональные криминальные.", "Военно-политические — вооружённые конфликты, распространение оружия массового поражения, гонка вооружений, незаконные вооружённые формирования. Экономические — неравномерность развития, конкуренция за ресурсы, нестабильность рынков, долговые кризисы. Природно-экологические — изменение климата, дефицит пресной воды, трансграничное загрязнение, крупные аварии.", "Социально-гуманитарные — массовая вынужденная миграция, эпидемии и пандемии, голод, бедность. Информационные — информационные войны, кибератаки на критическую инфраструктуру, недостоверная информация. Транснациональные криминальные — международный терроризм, наркотрафик, торговля людьми, отмывание денег, пиратство.", "Общий корень у большинства — неравномерность развития и рост взаимозависимости государств: глобализация повышает связанность мира, а вместе с ней растёт скорость распространения любой угрозы. Ни одна из этих опасностей не решается силами одного государства, отсюда необходимость международного сотрудничества.", "«Новыми» называют угрозы, где источник выступает не государство: терроризм, кибератаки, пандемии, транснациональная преступность."], "cards": [{"t": "Международная безопасность", "d": "Состояние отношений между государствами, при котором отсутствует угроза войны и обеспечены условия для устойчивого развития."}, {"t": "Глобальные проблемы современности", "d": "Проблемы, затрагивающие человечество в целом и не решаемые усилиями отдельных государств: экология, ресурсы, демография, разоружение, эпидемии."}, {"t": "Нераспространение", "d": "Режим ограничения расползания оружия массового поражения и технологий его создания."}, {"t": "Критическая инфраструктура", "d": "Объекты и системы, нарушение работы которых парализует жизнедеятельность государства: энергетика, транспорт, связь, финансы."}, {"t": "Транснациональная преступность", "d": "Преступная деятельность, ведущаяся на территории нескольких государств с трансграничным финансированием и логистикой."}, {"t": "Трансграничный характер угроз", "d": "Свойство угрозы распространяться за пределы одного государства независимо от границ и национального контроля."}], "quiz": [{"q": "Какие угрозы принято называть «новыми»?", "ok": "Те, где источником выступает не государство: терроризм, кибератаки, пандемии", "bad": ["Те, что возникли после появления ядерного оружия", "Те, что затрагивают только развивающиеся страны", "Те, что не описаны в международных конвенциях"], "why": "Классические угрозы исходили от государств. «Новые» связаны с негосударственными акторами и природными процессами."}, {"q": "Что объединяет большинство источников международных опасностей?", "ok": "Неравномерность развития и рост взаимозависимости государств", "bad": ["Военное происхождение", "Отсутствие правового регулирования", "Экономическая природа"], "why": "Глобализация делает мир связаннее, и по этим же связям быстрее распространяется любая угроза."}, {"q": "К какой группе международных опасностей относят кибератаки на энергетические и транспортные системы?", "ok": "К информационным", "bad": ["К военно-политическим", "К экономическим", "К транснациональным криминальным"], "why": "Средство воздействия здесь информационное, даже если поражается физическая инфраструктура. По природе воздействия это информационная угроза."}]}, {"n": 60, "title": "Международное сотрудничество в области БЖД", "kostyak": ["Смысл сотрудничества в том, что угрозы носят трансграничный характер: авария, эпидемия или загрязнение не останавливаются на границе, а значит и реагирование должно быть совместным.", "Направления сотрудничества: предупреждение и ликвидация чрезвычайных ситуаций, гуманитарная помощь, охрана окружающей среды, борьба с терроризмом и транснациональной преступностью, санитарно-эпидемиологическая безопасность, ядерная и радиационная безопасность, нераспространение оружия массового поражения.", "На глобальном уровне работают структуры системы ООН: сама Организация Объединённых Наций, Всемирная организация здравоохранения, ЮНЕСКО, МАГАТЭ по атомной энергии, Международная организация труда, Управление по координации гуманитарных вопросов.", "Отдельно — Международное движение Красного Креста и Красного Полумесяца как крупнейшая гуманитарная организация, и Международная организация гражданской обороны.", "На региональном уровне для России это сотрудничество в рамках СНГ, ШОС, БРИКС, ОДКБ — по линии реагирования на ЧС, гуманитарного разминирования, обмена информацией.", "Формы сотрудничества: международные договоры и конвенции, совместные учения, обмен информацией и технологиями, подготовка специалистов, направление спасательных отрядов и гуманитарных грузов.", "Россия участвует в этой работе через МЧС, которое направляет аэромобильные группировки и гуманитарные миссии в зоны бедствий за рубежом.", "Образовательная составляющая тоже есть: ЮНЕСКО и ООН продвигают образование в области снижения риска бедствий, и культура безопасности рассматривается как международная задача."], "terms": ["трансграничный характер угроз", "система ООН", "ВОЗ", "МАГАТЭ", "ЮНЕСКО", "Международное движение Красного Креста и Красного Полумесяца", "гуманитарное реагирование", "снижение риска бедствий", "международные конвенции", "гражданская оборона"], "follow": [{"q": "Зачем международное сотрудничество, если у страны есть своя система?", "a": "Потому что масштаб крупных бедствий превышает ресурсы одного государства, и потому что часть угроз в принципе не имеет территориальной привязки."}, {"q": "Что даёт участие в международных учениях?", "a": "Отработку совместимости процедур и связи между спасательными службами разных стран — без этого совместная операция теряет темп."}], "notes": [], "block": "Социальные угрозы", "bk": "soc", "tier": 3, "psy": false, "aid": false, "core": "Угрозы носят трансграничный характер и не останавливаются на границе, поэтому реагирование строится совместно — через систему ООН, региональные объединения и прямое участие спасательных служб.", "anchors": ["трансграничность", "система ООН", "Красный Крест", "региональный уровень", "формы сотрудничества"], "simple": ["Смысл сотрудничества: авария, эпидемия или загрязнение не останавливаются на границе, значит и реагировать надо совместно.", "Направления: предупреждение и ликвидация ЧС, гуманитарная помощь, охрана окружающей среды, борьба с терроризмом и транснациональной преступностью, санитарно-эпидемиологическая безопасность, ядерная и радиационная безопасность, нераспространение оружия массового поражения.", "Глобальный уровень — структуры системы ООН: сама ООН, ВОЗ, ЮНЕСКО, МАГАТЭ, Международная организация труда, Управление по координации гуманитарных вопросов. Отдельно — Международное движение Красного Креста и Красного Полумесяца и Международная организация гражданской обороны.", "Региональный уровень для России — СНГ, ШОС, БРИКС, ОДКБ: реагирование на ЧС, гуманитарное разминирование, обмен информацией.", "Формы сотрудничества: международные договоры и конвенции, совместные учения, обмен информацией и технологиями, подготовка специалистов, направление спасательных отрядов и гуманитарных грузов. Россия участвует через МЧС и его аэромобильные группировки. Учения отрабатывают совместимость процедур и связи между службами разных стран.", "Есть и образовательная составляющая: ЮНЕСКО и ООН продвигают образование в области снижения риска бедствий, культура безопасности рассматривается как международная задача."], "cards": [{"t": "Система ООН", "d": "Совокупность Организации Объединённых Наций и её специализированных учреждений, работающих по отдельным направлениям безопасности и развития."}, {"t": "МАГАТЭ", "d": "Международное агентство по атомной энергии, отвечающее за ядерную и радиационную безопасность и гарантии нераспространения."}, {"t": "Международное движение Красного Креста и Красного Полумесяца", "d": "Крупнейшая международная гуманитарная организация, оказывающая помощь пострадавшим независимо от стороны конфликта."}, {"t": "Гуманитарное реагирование", "d": "Совместные действия по оказанию помощи населению, пострадавшему от бедствия или конфликта."}, {"t": "Снижение риска бедствий", "d": "Международный подход, при котором приоритет отдаётся предупреждению и подготовке населения, а не только ликвидации последствий."}, {"t": "Гражданская оборона", "d": "Система мероприятий по защите населения и материальных ценностей от опасностей, возникающих при конфликтах и чрезвычайных ситуациях."}], "quiz": [{"q": "Почему международное сотрудничество нужно, если у государства есть своя система защиты?", "ok": "Масштаб крупных бедствий превышает ресурсы одного государства, а часть угроз не имеет территориальной привязки", "bad": ["Национальные системы защиты юридически подчинены международным", "Международные организации финансируют национальные службы", "Своя система работает только в мирное время"], "why": "Часть угроз в принципе безгранична, а на крупном бедствии одного государства не хватает ни сил, ни техники."}, {"q": "Какая международная организация отвечает за ядерную и радиационную безопасность?", "ok": "МАГАТЭ", "bad": ["ВОЗ", "ЮНЕСКО", "Международная организация труда"], "why": "ВОЗ — здравоохранение, ЮНЕСКО — образование, наука и культура, МОТ — труд. Атомная тематика у МАГАТЭ."}, {"q": "Что даёт участие в совместных международных учениях?", "ok": "Отработку совместимости процедур и связи между службами разных стран", "bad": ["Право на получение международной финансовой помощи", "Замену национальных тренировок по гражданской обороне", "Обязательное признание национальных сертификатов спасателей"], "why": "Главная проблема совместной операции — несостыковка процедур и связи. Учения снимают её заранее."}]}, {"n": 61, "title": "Продовольственная безопасность", "kostyak": ["Продовольственная безопасность — состояние экономики, при котором обеспечена физическая и экономическая доступность безопасных пищевых продуктов в объёмах, достаточных для активной и здоровой жизни населения. В России базовым документом выступает Доктрина продовольственной безопасности Российской Федерации.", "В понятии выделяют четыре измерения,
