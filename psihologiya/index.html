<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EFEFF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0D11" media="(prefers-color-scheme: dark)">
<meta name="description" content="Подготовка к вступительным испытаниям РГСУ по психологии, 3 и 7 августа 2026. 20 тем, костяки устных ответов, развороты к конфликтологии и к кризисным ситуациям.">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Психология">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#129504;</text></svg>">
<title>Психология РГСУ — подготовка к 3 и 7 августа</title>
<style>
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; }
  h1,h2,h3,p,ol,ul,figure { margin: 0; }
  ol,ul { padding: 0; list-style: none; }
  ol.kost { list-style: decimal; }
  button { font: inherit; color: inherit; }
  img { max-width: 100%; }
</style>
</head>
<body>
<style>
  :root {
    --ground: #EFEFF2; --card: #FFFFFF; --ink: #16171D; --muted: #5D5F6B;
    --line: #D6D7DE; --chip: #F3F3F6;
    --conf: #A63A4A; --conf-soft: #F5E3E5;
    --crisis: #1C6E72; --crisis-soft: #DDECEC;
    --shadow: 0 1px 2px rgba(22,23,29,.06), 0 6px 16px rgba(22,23,29,.05);
    --r: 10px;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0C0D11; --card: #15161B; --ink: #E5E6EC; --muted: #8E90A0;
      --line: #262832; --chip: #1C1E25;
      --conf: #E08894; --conf-soft: #33191E;
      --crisis: #4FB3B8; --crisis-soft: #10292B;
      --shadow: 0 1px 2px rgba(0,0,0,.45), 0 6px 16px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --ground: #0C0D11; --card: #15161B; --ink: #E5E6EC; --muted: #8E90A0;
    --line: #262832; --chip: #1C1E25;
    --conf: #E08894; --conf-soft: #33191E;
    --crisis: #4FB3B8; --crisis-soft: #10292B;
    --shadow: 0 1px 2px rgba(0,0,0,.45), 0 6px 16px rgba(0,0,0,.3);
  }
  :root[data-theme="light"] {
    --ground: #EFEFF2; --card: #FFFFFF; --ink: #16171D; --muted: #5D5F6B;
    --line: #D6D7DE; --chip: #F3F3F6;
    --conf: #A63A4A; --conf-soft: #F5E3E5;
    --crisis: #1C6E72; --crisis-soft: #DDECEC;
    --shadow: 0 1px 2px rgba(22,23,29,.06), 0 6px 16px rgba(22,23,29,.05);
  }
  /* режим экзамена задаёт рабочий акцент */
  body { --accent: var(--conf); --accent-soft: var(--conf-soft); }
  body[data-mode="crisis"] { --accent: var(--crisis); --accent-soft: var(--crisis-soft); }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--sans); font-size: 17px; line-height: 1.55;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 44rem; margin: 0 auto; padding: 0 14px 96px; }

  .top {
    position: sticky; top: 0; z-index: 20; background: var(--ground);
    border-bottom: 1px solid var(--line); margin: 0 -14px 16px; padding: 10px 14px 0;
  }
  .toprow { display: flex; align-items: baseline; gap: 10px; }
  .brand { font-size: 15px; font-weight: 680; letter-spacing: -.01em; }
  .countdown {
    margin-left: auto; font-family: var(--mono); font-size: 13px;
    font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 600;
  }
  .bar { height: 3px; background: var(--line); margin-top: 9px; }
  .bar > i { display: block; height: 100%; background: var(--accent); transition: width .35s ease; }
  .barlbl {
    display: flex; justify-content: space-between; padding: 5px 0 8px;
    font-family: var(--mono); font-size: 11.5px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  /* переключатель экзамена */
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 14px; }
  .mode {
    text-align: left; padding: 10px 12px; border-radius: var(--r);
    border: 1px solid var(--line); background: var(--card); cursor: pointer;
  }
  .mode b { display: block; font-size: 14.5px; font-weight: 640; }
  .mode span { font-size: 12.5px; color: var(--muted); }
  .mode[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .mode[aria-pressed="true"] b { color: var(--accent); }

  .today {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
    padding: 15px 16px; box-shadow: var(--shadow); margin-bottom: 18px;
  }
  .today h2 {
    margin: 0 0 3px; font-size: 12px; font-weight: 640; text-transform: uppercase;
    letter-spacing: .1em; color: var(--muted);
  }
  .bignum { font-size: 40px; font-weight: 720; letter-spacing: -.035em; line-height: 1.05; }
  .bignum span { font-size: 17px; font-weight: 500; letter-spacing: 0; color: var(--muted); }
  .today p { margin: 8px 0 0; font-size: 14.5px; color: var(--muted); }
  .queue { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .qchip {
    font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums;
    background: var(--accent-soft); color: var(--accent); border-radius: 5px;
    padding: 3px 7px; font-weight: 600;
  }

  .tools { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 16px; }
  button {
    font: inherit; font-size: 13.5px; cursor: pointer; border-radius: 7px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    padding: 7px 12px; transition: border-color .15s, background .15s;
  }
  button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tools button[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
  .primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }

  .tier { margin: 26px 0 10px; }
  .tier h3 { margin: 0; font-size: 16px; font-weight: 680; letter-spacing: -.01em; }
  .tier p { margin: 3px 0 0; font-size: 13.5px; color: var(--muted); }

  .item {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
    margin-bottom: 7px; overflow: hidden; position: relative;
  }
  .item::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0;
    background: var(--accent); opacity: .85;
  }
  .item[data-tier="1"]::before { width: 5px; }
  .item[data-tier="2"]::before { width: 3px; }
  .item[data-tier="3"]::before { width: 1.5px; opacity: .5; }
  .item[data-done="1"] { opacity: .58; }
  .item[data-done="1"]::before { background: var(--muted); }

  .head {
    display: flex; align-items: flex-start; gap: 10px; width: 100%;
    text-align: left; background: none; border: 0; border-radius: 0;
    padding: 12px 13px 12px 20px;
  }
  .head:hover { border-color: transparent; background: var(--accent-soft); }
  .num {
    font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums;
    color: var(--muted); min-width: 2.1em; padding-top: 2px; font-weight: 600;
  }
  .ttl { flex: 1; font-size: 15.5px; line-height: 1.4; font-weight: 520; }
  .sect { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; }
  .tick { font-size: 17px; color: var(--accent); padding-top: 1px; min-width: 1em; }

  .body { display: none; padding: 2px 15px 16px 20px; border-top: 1px solid var(--line); }
  .item[data-open="1"] .body { display: block; }
  .lbl {
    font-size: 11.5px; font-weight: 640; text-transform: uppercase; letter-spacing: .1em;
    color: var(--muted); margin: 16px 0 7px;
  }
  ol.kost { margin: 0; padding-left: 1.3em; }
  ol.kost li { margin-bottom: 9px; font-size: 15.5px; line-height: 1.52; }
  ol.kost li::marker { color: var(--accent); font-family: var(--mono); font-size: 13px; }
  .terms { display: flex; flex-wrap: wrap; gap: 5px; }
  .term {
    font-size: 13px; background: var(--chip); border: 1px solid var(--line);
    border-radius: 5px; padding: 3px 8px;
  }
  .para { margin: 0 0 8px; font-size: 15px; }
  .turn {
    border-left: 3px solid var(--accent); background: var(--accent-soft);
    padding: 10px 13px; border-radius: 0 7px 7px 0; margin-bottom: 8px; font-size: 15px;
  }
  .turn.off { border-left-color: var(--line); background: transparent; opacity: .62; }
  .turn b {
    display: block; font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--accent); margin-bottom: 4px;
  }
  .turn.off b { color: var(--muted); }
  .stance { border-left: 3px solid var(--muted); padding: 2px 0 2px 13px; margin-bottom: 9px; font-size: 15px; }
  .exp { background: var(--chip); border-radius: 7px; padding: 10px 13px; margin-bottom: 8px; font-size: 15px; }
  .fu { border-top: 1px dashed var(--line); padding-top: 9px; margin-top: 9px; font-size: 14.5px; }
  .fu q { display: block; font-weight: 620; quotes: none; margin-bottom: 3px; }
  .fu q::before, .fu q::after { content: ""; }
  .fu div { color: var(--muted); }
  .done-btn { margin-top: 18px; width: 100%; }
  .empty { text-align: center; color: var(--muted); padding: 36px 0; font-size: 15px; }

  .drill { position: fixed; inset: 0; background: var(--ground); z-index: 40; display: none; overflow-y: auto; }
  .drill[data-on="1"] { display: block; }
  .drill .inner { max-width: 44rem; margin: 0 auto; padding: 22px 16px 60px; }
  .drill .kicker { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 640; }
  .drill h2 { font-size: 25px; line-height: 1.24; letter-spacing: -.02em; margin: 7px 0 20px; text-wrap: balance; }
  .reveal { margin-top: 20px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (min-width: 640px) { body { font-size: 17.5px; } .wrap { padding: 0 20px 96px; } }
</style>

<div class="wrap">
  <div class="top">
    <div class="toprow">
      <div class="brand">Психология · РГСУ</div>
      <div class="countdown" id="cd"></div>
    </div>
    <div class="bar"><i id="bar" style="width:0%"></i></div>
    <div class="barlbl"><span id="pct">0%</span><span id="cnt">0 из 20</span></div>
  </div>

  <div class="modes">
    <button class="mode" id="mConf" aria-pressed="true">
      <b>3 августа</b><span>Общая психология → конфликтология</span>
    </button>
    <button class="mode" id="mCrisis" aria-pressed="false">
      <b>7 августа</b><span>Теория и практика → кризисные и ЧС</span>
    </button>
  </div>

  <div class="today">
    <h2>Норма на день</h2>
    <div class="bignum" id="rate">—</div>
    <p id="hint"></p>
    <div class="queue" id="queue"></div>
  </div>

  <div class="tools">
    <button class="primary" id="drillBtn">Случайная тема</button>
    <button id="fAll" aria-pressed="true">Все</button>
    <button id="fLeft" aria-pressed="false">Не пройдено</button>
    <button id="reset">Сбросить</button>
  </div>

  <div id="list"></div>
</div>

<div class="drill" id="drill">
  <div class="inner">
    <div class="kicker" id="dKick"></div>
    <h2 id="dTitle"></h2>
    <p style="color:var(--muted);font-size:15px">Проговори вслух две&nbsp;— три минуты. Потом открой костяк и сверься: что пропустил, какие имена и термины не прозвучали, была ли своя позиция.</p>
    <button class="primary" id="dShow">Показать костяк</button>
    <div class="reveal" id="dBody" hidden></div>
    <div class="tools" style="margin-top:22px">
      <button id="dNext">Следующая</button>
      <button id="dClose">Закрыть</button>
    </div>
  </div>
</div>

<script>
const TOPICS = [{"title": "Взгляды на предмет психологии ведущих зарубежных психологических школ", "kostyak": ["Разберу по одной схеме: что школа считала предметом, каким методом работала, что осталось в практике. Так виднее логику.", "Бихевиоризм. Уотсон в своём манифесте заявляет: сознание для науки недоступно, предмет психологии — поведение, схема S → R. Метод — объективное наблюдение и эксперимент, в том числе на животных. Опора — Павлов и Торндайк с его законом эффекта. Скиннер добавляет главное: оперантное обусловливание, поведение управляется своими последствиями, подкреплением. Отсюда выросли поведенческая терапия, жетонные системы, программированное обучение — практика огромная.", "Необихевиоризм — признание, что чистая схема не работает. Толмен вводит промежуточные переменные и говорит о когнитивных картах: крыса в лабиринте усваивает не цепочку движений, а пространственную схему. Халл строит формальную теорию с драйвом. Позже Бандура показывает научение через наблюдение, без прямого подкрепления. Это уже мостик к когнитивной психологии.", "Гештальтпсихология. Предмет — целостные структуры сознания, гештальты; исходный тезис: целое не сводится к сумме частей и первично по отношению к ним. Вертгеймер начинает с фи-феномена, кажущегося движения, которого нет ни в одном из двух стимулов по отдельности. Кёлер на Тенерифе показывает у шимпанзе решение задачи через инсайт, а не перебор. Коффка переносит принцип на развитие. Левин расширяет до теории поля: поведение — функция человека и среды в данный момент, жизненное пространство, валентности, конфликт как столкновение сил.", "Психоанализ. Предмет — бессознательное. Метод — свободные ассоциации, толкование сновидений, анализ оговорок и переноса. Фрейд даёт структуру: Оно, Я, Сверх-Я; вытеснение и защиты; конфликт влечения и запрета как двигатель психической жизни. Юнг расходится с ним по вопросу либидо и вводит коллективное бессознательное, архетипы, типологию установок — интроверсия и экстраверсия. Адлер строит индивидуальную психологию: чувство неполноценности и стремление к превосходству, компенсация, жизненный стиль, социальный интерес.", "Гуманистическая психология — „третья сила“ против бихевиоризма и психоанализа. Предмет — личность, её опыт и стремление к развитию. Роджерс: клиентоцентрированная терапия, конгруэнтность, эмпатия, безусловное позитивное принятие, Я-концепция и рассогласование между реальным и идеальным Я. Маслоу: иерархия потребностей и самоактуализация, изучение здоровых и продуктивных людей вместо больных. Рядом — экзистенциальная линия: Франкл с логотерапией и смыслом, найденным в страдании.", "Когнитивная психология и когнитивная революция середины XX века. Предмет — познавательные процессы, переработка информации. Метафора — человек как система, принимающая, кодирующая, хранящая и извлекающая информацию; отсюда модели памяти, внимания, схемы. Толчок дали кибернетика, теория информации, работы по языку и критика бихевиоризма со стороны Хомского. Найссер книгой „Когнитивная психология“ фактически даёт направлению имя, а позже сам критикует лабораторность и требует экологической валидности.", "Если свести: бихевиоризм отказался от сознания ради объективности и потерял содержание; гештальт вернул целостность, но остался в основном на восприятии; психоанализ дал глубину и потерял проверяемость; гуманистическая психология вернула личность и ценности; когнитивная — вернула внутренние процессы, но уже с моделями, которые можно проверять.", "И важно сказать, что сегодня чистых школ почти нет. Есть когнитивно-поведенческая терапия, выросшая из двух традиций сразу, есть эмоционально-фокусированная работа с гуманистическими корнями, есть современный психоанализ в теории объектных отношений и привязанности."], "terms": ["Уотсон", "S → R", "Торндайк", "закон эффекта", "Скиннер", "оперантное обусловливание и подкрепление", "Толмен", "когнитивные карты и промежуточные переменные", "Бандура", "научение через наблюдение", "Вертгеймер", "фи-феномен", "Кёлер", "инсайт", "Коффка", "Левин", "теория поля и жизненное пространство", "Фрейд", "Оно — Я — Сверх-Я", "вытеснение", "Юнг", "коллективное бессознательное и архетипы", "Адлер", "комплекс неполноценности и компенсация", "Роджерс", "конгруэнтность и безусловное принятие", "Маслоу", "самоактуализация", "Франкл", "логотерапия", "Найссер", "«Когнитивная психология»", "когнитивная революция", "экологическая валидность"], "exp": [], "stance": ["«Бихевиоризм я считаю честной, но чрезмерной платой за строгость. Он дал психологии стандарт доказательности, которого до него не было, и дал самую воспроизводимую практику — поведенческие методы работают до сих пор. Но за скобками остался человек: значение, цель, смысл. Толмен и Бандура фактически вернули их обратно, и это признание того, что без внутренних переменных объяснить поведение не получается.»", "«К психоанализу отношусь двойственно и говорю об этом прямо. Как теория он плохо фальсифицируем, и многое из фрейдовской метапсихологии я считаю устаревшим. Но именно он ввёл в психологию вещи, без которых сегодня не работает никто: бессознательное, защиты, перенос, идея внутреннего конфликта как нормы. Живёт не столько теория Фрейда, сколько её продолжение — Эриксон, Боулби, объектные отношения.»", "«Гуманистическую психологию ценю за поворот к здоровому человеку и за то, что роджерсовские условия эмпатии и принятия оказались подтверждены исследованиями терапевтического альянса. Слабость — расплывчатость понятий: самоактуализацию трудно измерить, и это до сих пор её уязвимое место.»"], "conf": ["Здесь материал прямой. Левин — фактически отец психологии конфликта: три типа внутриличностного конфликта (приближение — приближение, избегание — избегание, приближение — избегание), теория поля, групповая динамика, стили руководства и его же тренинговые группы, из которых выросла вся практика работы с группой. Фрейд задаёт модель интрапсихического конфликта: влечение против запрета, и защиты как способ его переработать. Адлер даёт социальную оптику — соперничество, компенсация, чувство общности как критерий здоровья. Бихевиоризм объясняет, почему конфликтное поведение закрепляется: оно подкрепляется, часто самим оппонентом. А когнитивная традиция даёт атрибутивные искажения и теорию когнитивного диссонанса Фестингера — то, чем сегодня объясняют эскалацию."], "crisis": ["Тоже прямой. Психоанализ дал понятие травматического невроза и защит, а после войн — практику работы с военной травмой. Гуманистическая линия дала отношение к пострадавшему как к человеку с ресурсом, а не с дефектом: в остром кризисе роджерсовские условия — присутствие, принятие, отражение — часто и есть вся возможная помощь в первые часы. Франкл здесь отдельно: смысл как опора в предельном страдании, опыт лагеря, положенный в основу логотерапии, — это то, на чём держится работа с утратой. Поведенческая и когнитивная традиции дали доказательную часть: экспозиция при посттравматическом расстройстве, работа с иррациональными убеждениями у Эллиса и Бека, которые сами вышли из психоанализа и разошлись с ним. Если попросят назвать метод с доказанной эффективностью при ПТСР — называй когнитивно-поведенческую терапию, сфокусированную на травме."], "follow": [{"q": "Чем необихевиоризм отличается от классического?", "a": "Тем, что между стимулом и реакцией допускаются внутренние переменные: у Толмена — когнитивные карты и ожидания, у Халла — драйв и навык. Формула становится S — O — R. Классический бихевиоризм считал внутреннее принципиально ненаблюдаемым и потому лишним, необихевиоризм — ненаблюдаемым напрямую, но выводимым из поведения."}, {"q": "Что такое когнитивная революция и почему она случилась?", "a": "Смена господствующего подхода в 1950–60-е: вместо поведения предметом снова становятся внутренние процессы, но описанные как переработка информации. Причины — предел объяснительных возможностей бихевиоризма (прежде всего на языке: критика Хомского), появление кибернетики и вычислительной метафоры, запрос на понимание памяти, внимания, принятия решений."}], "n": 3, "section": "Генезис психологии", "tier": 1}, {"title": "Культурно-исторический и деятельностный подход в психологии", "kostyak": ["Это отечественный ответ на кризис, и отвечу я именно так: не ещё одна школа рядом с зарубежными, а попытка построить психологию на другом основании — на культуре и на деятельности.", "Выготский начинает с различения натуральных и высших психических функций. Натуральные — непроизвольное внимание, механическая память — даны природой. Высшие — произвольное внимание, логическая память, понятийное мышление, воля — возникают в культуре, они социальны по происхождению и опосредствованы знаком.", "Ключевое понятие — опосредствование. Между человеком и задачей встаёт орудие; во внешней деятельности это инструмент, в психической — знак, прежде всего слово. Классический пример — узелок на память: человек управляет своей памятью не изнутри, а извне, через средство.", "Отсюда закон развития высших функций: всякая функция появляется дважды — сначала между людьми, как интерпсихическая, потом внутри человека, как интрапсихическая. Переход называется интериоризацией. Речь сначала обращена к другому, потом к себе — эгоцентрическая речь — и наконец становится внутренней речью и средством мышления. Это разбирается в „Мышлении и речи“.", "Практический выход — зона ближайшего развития: расстояние между тем, что ребёнок делает сам, и тем, что делает вместе со взрослым. Обучение ведёт за собой развитие, а ориентироваться надо на созревающее, а не на созревшее. На этом стоит вся развивающая педагогика и диагностика обучаемости.", "Ещё одна мысль Выготского, которую редко называют, а зря: единство аффекта и интеллекта. Он возражал против отрыва мышления от побуждений и говорил, что за мыслью стоит мотивирующая сфера. Для практика это принципиально: чисто когнитивная работа без обращения к аффекту не даёт изменений.", "Леонтьев продолжает линию, но переносит центр тяжести на деятельность. Строение деятельности: деятельность отвечает мотиву, действие — цели, операция — условиям. Психика формируется и проявляется в деятельности, внешняя и внутренняя деятельность имеют принципиально общее строение — это основание для интериоризации. Он же вводит ведущую деятельность как критерий периодизации развития: игра, учение, общение, труд. Главные его положения собраны в „Деятельности. Сознании. Личности“, там же — идея личностного смысла и сдвига мотива на цель.", "Рубинштейн формулирует принцип единства сознания и деятельности: психика не только проявляется, но и формируется в деятельности, при этом сознание и деятельность не тождественны. Его „Основы общей психологии“ на десятилетия стали базовым учебником. И его же формула о внешних причинах, действующих через внутренние условия, — то есть человек не отпечаток обстоятельств, а субъект.", "Здесь важно назвать расхождение. Для Леонтьева деятельность — объяснительный принцип и, по сути, исходная единица анализа психики. Для Рубинштейна первичен субъект, а деятельность — способ его существования; он возражал против того, чтобы выводить психику из деятельности, и настаивал на самостоятельности внутреннего. Спор не терминологический: от него зависит, считаем ли мы человека производным от того, что он делает, или деятельность производной от того, кто он."], "terms": ["Выготский", "натуральные и высшие психические функции", "знак как психологическое орудие", "опосредствование", "интериоризация", "закон «сначала между людьми", "потом внутри»", "зона ближайшего развития", "обучение ведёт за собой развитие", "единство аффекта и интеллекта", "«Мышление и речь»", "эгоцентрическая и внутренняя речь", "Леонтьев", "деятельность — действие — операция", "мотив — цель — условия", "ведущая деятельность", "личностный смысл", "сдвиг мотива на цель", "«Деятельность. Сознание. Личность»", "Рубинштейн", "принцип единства сознания и деятельности", "«внешние причины через внутренние условия»", "«Основы общей психологии»", "Лурия", "Запорожец", "Гальперин", "Эльконин"], "exp": [], "stance": ["«Считаю культурно-исторический подход самым сильным, что дала отечественная психология, и не из патриотизма. Он решает задачу, с которой не справились ни бихевиоризм, ни когнитивная психология: объясняет, откуда берётся произвольность. Не постулирует её, а показывает механизм — через средство, через другого человека. Мировое признание Выготского в последние десятилетия только выросло, его читают в образовании и в исследованиях развития по всему миру.»", "«В споре Рубинштейна и Леонтьева я ближе к Рубинштейну. Формула Леонтьева объясняет очень многое, но при последовательном проведении личность рискует раствориться в иерархии мотивов, а субъект — исчезнуть. Рубинштейновское „внешнее через внутреннее“ мне кажется точнее: оно оставляет место избирательности и ответственности, без которых не работает ни психотерапия, ни разговор о личности вообще.»", "«Слабое место подхода назову тоже: у Выготского многое осталось программой, а не проверенной теорией — он умер рано, часть понятий не доведена до операциональных определений. Зона ближайшего развития блестяща как идея и трудна как измеряемая величина.»"], "conf": ["Главный ход — социальное происхождение психики. Если высшие функции рождаются во взаимодействии, то и способы обращаться с противоречием человек тоже присваивает извне: сначала конфликт разрешают за него и при нём, потом он делает это сам. Внутренний спор с собой — интериоризованный внешний диалог; здесь уместно вспомнить Бахтина и диалогичность сознания. Дальше: у Леонтьева конфликт мотивов встроен в структуру личности — иерархия мотивов и означает, что они соперничают, а личность складывается в их столкновении. И совместная деятельность как понятие — прямая опора для конфликтологии: конфликт возникает не между людьми вообще, а между позициями в общем деле, и разрешается через изменение самой деятельности и её мотивов, а не только через переговоры о словах."], "crisis": ["Опосредствование — рабочая идея для помощи в кризисе. Человек в остром состоянии теряет произвольную регуляцию, откатывается к более натуральным формам реагирования; задача помогающего — вернуть средство: назвать словом, дать структуру, задать простую последовательность действий. Психолог здесь буквально работает как внешнее звено регуляции, которое пострадавший временно не может держать сам, — это и есть зона ближайшего развития применительно к взрослому в беде. Единство аффекта и интеллекта объясняет, почему информирование само по себе не помогает, пока не встретился с аффектом. А деятельностный подход даёт ориентир в реабилитации: восстановление идёт через возвращение человека в осмысленную деятельность и через перестройку мотивов, а не через одни лишь разговоры о состоянии. Здесь же уместно назвать Лурию: восстановление функций после ранений в годы войны строилось именно на идее перестройки функциональной системы с опорой на сохранное звено."], "follow": [{"q": "Что такое интериоризация и есть ли обратный процесс?", "a": "Переход внешнего, разделённого с другим действия во внутренний план. Обратный процесс — экстериоризация: развёртывание внутреннего действия вовне, когда оно затруднено или когда нужно передать его другому. У Гальперина это выражено в теории поэтапного формирования умственных действий: от материального действия через громкую речь и речь про себя к умственному."}, {"q": "Чем зона ближайшего развития отличается от простой подсказки?", "a": "Тем, что это не про облегчение задачи, а про диагностику потенциала. Ребёнок принимает помощь и переносит найденный способ на новый материал — значит, функция созревает. Два ребёнка с одинаковым актуальным уровнем могут иметь разную зону, и прогноз обучения у них разный. Отсюда идея обучающего эксперимента как метода диагностики."}], "n": 4, "section": "Генезис психологии", "tier": 1}, {"title": "Представления отечественных и зарубежных авторов о структуре личности", "kostyak": ["Начать с рамки: «Вопрос о структуре личности — это вопрос о том, из каких устойчивых составляющих она складывается и как они соотносятся. Единой общепринятой структуры нет до сих пор, и это не изъян науки, а следствие того, что школы отвечали на разные вопросы».", "Развести два больших способа отвечать: динамический (что движет личностью, какие силы внутри неё конфликтуют) и диспозиционный (какими устойчивыми чертами люди различаются между собой). Дальше идти по этой развилке — так ответ не рассыпается в перечисление фамилий.", "Динамическая линия за рубежом: Фрейд — трёхкомпонентная модель, Оно, Я и Сверх-Я, где Я работает на удержании равновесия между влечениями, требованиями реальности и интериоризованными запретами. Юнг — установки экстраверсии и интроверсии плюс четыре функции (мышление, чувство, ощущение, интуиция), и уровневая модель психики с личным и коллективным бессознательным, архетипами. Адлер — личность как целостный стиль жизни, выстроенный вокруг переживания неполноценности и компенсации, с социальным интересом как показателем зрелости.", "Диспозиционная линия: Олпорт ввёл черту как единицу анализа и различил кардинальные, центральные и вторичные черты. Кеттелл пошёл от факторного анализа — исходные и поверхностные черты, шестнадцать факторов в опроснике. Айзенк свёл структуру к небольшому числу суперфакторов — экстраверсия, нейротизм, позже психотизм — и пытался подвести под них нейрофизиологию. Сегодняшний рабочий консенсус в этой линии — «Большая пятёрка»: открытость опыту, добросовестность, экстраверсия, доброжелательность, нейротизм; модель хорошо воспроизводится в разных культурах и по разным языкам.", "Отдельно назвать гуманистическую линию: Роджерс — структура через Я-концепцию, реальное и идеальное Я, конгруэнтность как согласованность опыта и представления о себе. Маслоу — структура через иерархию потребностей и самоактуализацию как верхний уровень.", "Перейти к отечественным: «В нашей традиции структуру строили не от черт, а от деятельности и от отношений человека с миром».", "Рубинштейн — три плана: направленность (чего человек хочет), знания, умения и навыки (что он может), индивидуально-типологические особенности (как он это делает). Платонов — четыре подструктуры по критерию соотношения биологического и социального: направленность, опыт, особенности психических процессов, биопсихические свойства. Леонтьев — ядро личности не в чертах, а в иерархии мотивов, личность рождается дважды и определяется тем, какой мотив стал смыслообразующим. Мясищев — личность как система отношений к миру, к другим и к себе. Ананьев — самая ёмкая схема: индивид, личность, субъект деятельности, а индивидуальность как их интеграция. Божович — линия развития личности через внутреннюю позицию и иерархию мотивов в онтогенезе.", "Свести: «Диспозиционные модели дают операциональность и измеримость, динамические и деятельностные — объяснение, откуда структура берётся. Практически я работаю с обеими: одна отвечает на вопрос „какой“, другая — на вопрос „почему такой“»."], "terms": ["Оно", "Я", "Сверх-Я", "архетип и коллективное бессознательное", "стиль жизни и компенсация", "черта личности", "факторный анализ", "шестнадцать факторов Кеттелла", "суперфакторы Айзенка", "«Большая пятёрка»", "Я-концепция и конгруэнтность", "самоактуализация", "направленность личности", "иерархия мотивов", "подструктуры Платонова", "система отношений Мясищева", "индивид — личность — субъект деятельности — индивидуальность"], "exp": [], "stance": ["Рабочим считаю сочетание: «Большая пятёрка» как язык описания и измерения, деятельностный подход как язык объяснения. Пятифакторная модель честно признаёт, что она описательная — она не претендует объяснить, откуда черты берутся, и в этом её сила, а не слабость.", "Что устарело — не сами модели, а попытка выбрать одну «истинную структуру». Шестнадцать факторов Кеттелла по нынешним данным воспроизводятся плохо, факторное решение оказалось неустойчивым — это стоит сказать прямо. И типологии Юнга я бы отдал должное как исторической идее, но не как диагностическому инструменту: производные от неё популярные типологии психометрически слабы."], "conf": ["Через Фрейда и Мясищева. Структура личности изначально задумывалась как модель внутреннего конфликта: у Фрейда Я держит противоречие между влечением и запретом, у Леонтьева личность строится в столкновении мотивов, и выбор между конкурирующими смыслами — это и есть внутриличностный конфликт в чистом виде. У Мясищева невроз прямо выводится из противоречия в системе отношений. Дальше можно сказать: конфликтность как устойчивая характеристика в диспозиционном языке ложится на низкую доброжелательность и высокий нейротизм — и это уже мостик к прогнозу поведения в конфликте."], "crisis": ["Через Я и защиты: структура становится видна тогда, когда на неё давят. В экстремальной ситуации первым отказывает то, что держало равновесие, — отсюда классическая работа с защитными механизмами и с тем, как рушится Я-концепция при травме. У Роджерса это формулируется точно: травматический опыт не встраивается в представление о себе, возникает неконгруэнтность. Плюс диспозиционный слой: нейротизм и низкая добросовестность в исследованиях устойчиво связаны с худшим восстановлением после травматического события, и это уже прикладной прогноз для отбора и сопровождения."], "follow": [{"q": "Чем подструктуры Платонова отличаются от уровней Рубинштейна?", "a": "У Рубинштейна три плана отвечают на вопросы «чего хочет — что может — как делает», это функциональное разделение. У Платонова критерий один и сквозной: доля биологического и социального в подструктуре. От направленности, где почти всё социально, к биопсихическим свойствам, где преобладает врождённое. Платонов, по сути, попытался развести биологическое и социальное количественно, и за это его как раз критиковали — граница получается условной."}, {"q": "Почему „Большая пятёрка“, а не шестнадцать факторов?", "a": "Потому что пятифакторное решение устойчиво воспроизводится на разных выборках, языках и культурах, а шестнадцатифакторное — нет. Пятёрка выросла из психолексической гипотезы: значимые различия между людьми осели в естественном языке, и факторизация словаря сходится к пяти измерениям. Есть и конкурирующая шестифакторная модель HEXACO, где отдельно выделяется честность-скромность, — упомянуть её полезно, это показывает, что вопрос живой."}], "n": 9, "section": "Личность", "tier": 1}, {"title": "Задачи и проблемы современной социальной психологии", "kostyak": ["Начать с предмета: социальная психология изучает закономерности поведения и деятельности людей, обусловленные их включённостью в социальные группы, и характеристики самих этих групп. Формулировка Андреевой, её и стоит воспроизвести почти дословно — она принята в отечественной традиции.", "Сразу обозначить пограничность: дисциплина выросла на стыке психологии и социологии, и спор о её месте шёл всю историю. Отсюда два лица социальной психологии — психологическая (в центре индивид в социальном контексте) и социологическая (в центре групповые и массовые процессы).", "Дать историческую рамку коротко: описательный период (психология народов Вундта, психология масс Лебона и Тарда, теория инстинктов социального поведения Макдугалла), затем экспериментальный поворот в американской традиции, затем послевоенный расцвет — Левин, Фестингер, Аш, Милгрэм, Шериф.", "Отдельно — отечественная линия: дискуссия о предмете конца 1950-х — начала 1960-х, институционализация в 1960-е. Андреева, Парыгин, Петровский, Кузьмин, позже Донцов, Агеев. Особенность нашей традиции — деятельностный принцип: группа понимается через совместную деятельность, а не только через межличностные симпатии.", "Здесь же назвать кризис репликации. С 2010-х годов масштабные проверочные проекты показали, что заметная часть классических социально-психологических эффектов воспроизводится хуже, чем предполагалось; сильнее всего это ударило по прайминговым исследованиям. Это факт методологический, а не приговор дисциплине.", "Что из кризиса выросло: предрегистрация исследований, открытые данные, требование к размеру выборки и мощности, метаанализ как норма, осторожность с эффектами, полученными на одной студенческой выборке. Плюс критика WEIRD-выборок — большая часть классики построена на западных, образованных, богатых, демократических обществах и на молодёжи.", "Актуальная проблематика: цифровая среда и опосредованное общение, поляризация мнений и эхо-камеры, информационно-психологическое влияние и фейки, межгрупповая напряжённость, миграция и аккультурация, доверие к институтам, психология массовых настроений.", "Закрыть задачами: прикладные области — организационная психология, политическая, психология рекламы и массовых коммуникаций, психология конфликта, кросс-культурная психология."], "terms": ["Г. М. Андреева", "Б. Д. Парыгин", "А. В. Петровский", "Е. С. Кузьмин", "А. И. Донцов", "В. Вундт", "Г. Лебон", "Г. Тард", "У. Макдугалл", "К. Левин", "Л. Фестингер", "деятельностный принцип", "кризис репликации", "предрегистрация", "WEIRD-выборка", "метаанализ", "аккультурация", "эхо-камера"], "exp": ["Музафер Шериф, «Пещера разбойников»* — полевое исследование в летнем лагере для мальчиков. Незнакомых подростков разделили на две группы, дали им время сложиться, затем ввели соревнование за приз. Быстро возникли враждебность, обзывание, стычки — при том, что участники не различались ни по чему, кроме приписанной группы. Снять вражду простым контактом не удалось: сработали только надгрупповые цели, которых нельзя достичь поодиночке (общая поломка водопровода, застрявший грузовик). Отсюда теория реалистического конфликта: источник межгрупповой враждебности — не личные качества, а объективное столкновение интересов.", "Курт Левин с коллегами, исследование стилей руководства* — сравнивали авторитарный, демократический и попустительский стили в детских группах. Показали, что агрессия, продуктивность и поведение в отсутствие лидера зависят от стиля, а не от состава группы. Это же исследование — образец того, как Левин понимал социальную психологию: не описание, а экспериментальная проверка на реальных группах."], "stance": ["Кризис репликации я считаю не поражением, а взрослением дисциплины: физика и медицина прошли через то же самое, просто раньше. Тревожит другое — публичный оборот социальной психологии живёт вчерашним днём, в популярных текстах до сих пор цитируют эффекты, которые в оригинальном виде не подтвердились.", "Спор о том, психология это или социология, мне кажется исчерпанным на уровне теории и живым на уровне практики: заказчик прикладного исследования всегда хочет ответа про группу, а инструментарий у нас индивидуальный."], "conf": ["Тут разворот самый прямой, и стоит сделать его развёрнуто.", "Конфликтология выросла из социальной психологии и социологии одновременно, и её двойное происхождение видно в терминах. От социологической линии — Зиммель и его тезис о конфликте как форме социализации, Козер с функциями социального конфликта, Дарендорф с конфликтом как нормой общества, где есть распределение власти. От психологической — Левин с его теорией поля и типами внутриличностного конфликта, Дойч с различением конструктивного и деструктивного конфликта, Томас и Килманн со стратегиями поведения в конфликте.", "Дальше называю опоры конфликтологии, которые в чистом виде социально-психологические: теория реалистического конфликта Шерифа, теория социальной идентичности Тайфела, где вражда возникает и без объективного столкновения интересов, теория относительной депривации, где протест рождается не из бедности, а из разрыва между ожиданиями и реальностью.", "Отечественная линия: Анцупов и Шипилов как авторы систематизирующей работы по конфликтологии, Гришина в социально-психологической части, Хасан по конструктивной психологии конфликта. Отдельно стоит назвать Ершова и раннюю отечественную традицию изучения производственных конфликтов.", "Задачи современной конфликтологии, которые вытекают из перечисленных выше проблем: медиация и переговорные технологии, конфликтологическая экспертиза, работа с межэтнической и миграционной напряжённостью, конфликты в цифровой среде и агрессия в сети, организационная конфликтология. И тезис: поляризация — это форма межгруппового конфликта, где предмет спора вторичен, а первично разделение на «мы» и «они»."], "crisis": ["Социальная психология даёт кризисной психологии её массовый уровень. Индивидуальную травму описывает клиника, а поведение людей в ЧС — толпа, паника, слухи, вторичная виктимизация, феномен «эффекта свидетеля» — это социально-психологические явления. Плюс социальная поддержка как ключевой предиктор преодоления травматического стресса: у человека, включённого в устойчивую группу, прогноз лучше, и это один из самых воспроизводимых результатов в области. Сюда же — психология массовых настроений в период эпидемий и катастроф, доверие к официальной информации, инфодемия."], "follow": [{"q": "В чём именно проявился кризис репликации?", "a": "Крупные многолабораторные проекты по воспроизведению психологических исследований показали, что примерно у половины проверяемых работ эффект в повторе оказался слабее заявленного или не обнаружился. Сильнее всего пострадали исследования социального прайминга и эффекты, полученные на малых выборках. Причины методологические: подгонка гипотез под результат, избирательная публикация значимых результатов, недостаточная мощность."}, {"q": "Чем отличается отечественная традиция от западной?", "a": "Деятельностным принципом и вниманием к содержанию совместной деятельности. У Петровского уровень развития группы определяется тем, насколько межличностные отношения опосредованы содержанием общей деятельности, — в западной традиции группа чаще описывается через структуру взаимодействия и сплочённость безотносительно к тому, чем группа занята."}], "n": 13, "section": "Социальная психология", "tier": 1}, {"title": "Проблема возраста и возрастные периодизации психического развития", "kostyak": ["Начну с того, что само понятие возраста в психологии неоднородно. Различают хронологический возраст — число прожитых лет, биологический — степень зрелости организма и его систем, психологический — уровень развития психических функций и личности, и социальный — соответствие человека тем ролям и ожиданиям, которые общество связывает с этим этапом жизни.", "Эти четыре возраста у одного человека расходятся, и расхождение бывает диагностически значимым. Пятнадцатилетний подросток может быть биологически зрелым, психологически инфантильным и социально нагруженным взрослыми обязанностями одновременно.", "Дальше — проблема критериев периодизации. Здесь я бы опирался на классификацию, которую предложил Выготский. Первая группа периодизаций строится по внешнему признаку, аналогии со ступенями развития общества или образования. Вторая — по одному внутреннему признаку: смена зубов у Блонского, развитие сексуальности у Фрейда. Третья группа строится на системе существенных особенностей самого развития, и именно она продуктивна.", "Критика периодизаций по одному признаку в том, что признак берётся произвольный, чаще всего наблюдаемый со стороны, а не определяющий развитие изнутри. Такая периодизация описывает симптомы, но ничего не объясняет.", "Содержательное решение даёт Выготский. Возраст у него — целостное динамическое образование со своей структурой. Его определяют социальная ситуация развития, то есть неповторимое отношение ребёнка к среде в начале периода, и центральное новообразование, которое к концу периода эту ситуацию взрывает и требует новой. Развитие идёт чередованием стабильных и критических периодов. Отсюда же зона ближайшего развития — расстояние между тем, что ребёнок делает сам, и тем, что он делает в сотрудничестве.", "Линию продолжают Леонтьев и Эльконин. Леонтьев вводит ведущую деятельность — ту, внутри которой формируются главные новообразования периода. Эльконин достраивает это до полной периодизации: деятельности закономерно чередуются, освоение мотивационно-потребностной сферы, отношений «ребёнок — общественный взрослый», сменяется освоением операционально-технической сферы, отношений «ребёнок — общественный предмет». Отсюда его эпохи: раннее детство, детство, подростничество, каждая из двух периодов.", "Из зарубежных традиций назову две. Пиаже описал стадии развития интеллекта — сенсомоторную, дооперациональную, конкретных операций и формальных операций, с ключевыми понятиями эгоцентризма и децентрации. Эриксон предложил восемь стадий психосоциального развития по эпигенетическому принципу, где каждая стадия ставит свою задачу и разрешается через выбор между двумя полюсами.", "И назову сквозные принципы, без которых периодизации не работают: гетерохронность созревания разных функций, наличие сензитивных периодов, когда функция особенно восприимчива к средовым влияниям, и пластичность как способность развития к перестройке и компенсации."], "terms": ["хронологический", "биологический", "психологический и социальный возраст", "Выготский", "социальная ситуация развития", "психологическое новообразование", "стабильные и критические периоды", "зона ближайшего развития", "Леонтьев", "ведущая деятельность", "Эльконин", "мотивационно-потребностная и операционально-техническая сферы", "Пиаже", "эгоцентризм и децентрация", "Эриксон", "эпигенетический принцип", "гетерохронность", "сензитивный период", "пластичность"], "exp": [], "stance": ["Рабочей мне кажется схема Выготского — Эльконина: она объясняет механизм смены возрастов, а не только описывает их последовательность, и переносится на взрослость, хотя изначально строилась на детстве. Слабое место у неё то же, что у всей культурно-исторической традиции: она нормативна и слабо учитывает вариативность. Периодизации по одному признаку — фрейдовская прежде всего — сегодня имеют скорее историческое значение. А у Пиаже устарели не идеи, а границы: последующие исследования показали, что при изменении процедуры дети обнаруживают децентрацию и понимание сохранения заметно раньше, чем следовало из классических задач. То есть Пиаже недооценил ранние возможности ребёнка, потому что его задачи требовали речевого отчёта."], "conf": ["* периодизация даёт язык для анализа возрастного конфликта поколений. Разные когорты формировались в разных социальных ситуациях развития, и то, что для одной является нормой, для другой — нарушение. Плюс прикладной выход: в конфликте с участием подростка или пожилого человека понимание задач его возраста меняет тактику посредничества. Ещё точнее — расхождение психологического и социального возраста само по себе конфликтогенно, отсюда конфликты вокруг инфантилизма и вокруг преждевременной взрослости."], "crisis": ["* периодизация задаёт систему отсчёта для оценки последствий травмы. Одно и то же событие — эвакуация, потеря дома, гибель близкого — переживается принципиально по-разному в зависимости от возраста, потому что у ребёнка нет понятия необратимости смерти, у подростка страдает формирующаяся идентичность, у взрослого рушится жизненный проект. Отсюда требование к работе психолога в ЧС: протокол помощи должен быть дифференцирован по возрастам, а не един для всех пострадавших."], "follow": [{"q": "Что такое зона ближайшего развития и зачем она нужна практически?", "a": "Расстояние между актуальным уровнем, тем, что ребёнок делает самостоятельно, и уровнем потенциальным, тем, что он делает с помощью взрослого или более компетентного сверстника. Практически она обосновывает диагностику развития через обучающий эксперимент и принцип, что обучение ведёт за собой развитие, а не плетётся за ним."}, {"q": "Все ли периодизации применимы ко всему жизненному пути?", "a": "Нет, и это существенный разрыв. Большинство классических периодизаций строились на детстве и заканчивались юностью. Полный жизненный цикл охватывают Эриксон и работы в русле психологии жизненного пути и лайфспан-подхода, где развитие понимается как продолжающееся до конца жизни и включающее не только приобретения, но и потери."}], "n": 17, "section": "Возрастная психология", "tier": 1}, {"title": "Значение кризисов в развитии человека", "kostyak": ["Возрастной кризис в культурно-исторической традиции — это относительно короткий переходный период, на границе двух стабильных возрастов, когда прежняя социальная ситуация развития исчерпана, а новая ещё не сложилась. Ребёнок перерос отношения, в которых жил, и они начинают его ограничивать.", "Важно сразу сказать про его природу: кризис у Выготского — не поломка и не отклонение, а нормативный механизм развития. Через кризис происходит перестройка, без которой новообразование следующего возраста просто не возникает. Трудновоспитуемость в этот период — не причина, а симптом.", "Феноменология кризиса устойчива: границы размыты, поведение относительно трудноуправляемо, темп продвижения неравномерен, часть достигнутого выглядит утраченной. Причём острота кризиса сильно зависит от того, перестраивается ли вместе с ребёнком система требований взрослого.", "Перечислю кризисы детства. Кризис новорождённости — переход к внеутробному существованию, выделяется как особый и по биологическому основанию. Кризис одного года связан с ходьбой, автономной речью и первыми проявлениями воли, здесь появляются гипобулические реакции. Кризис трёх лет описан подробнее всех: семизвездие симптомов — негативизм, упрямство, строптивость, своеволие, протест-бунт, обесценивание взрослых, деспотизм или ревность в семье. За всем этим стоит появление системы «я сам» и личного действия.", "Кризис семи лет — утрата детской непосредственности, по выражению Выготского, вклинивание интеллектуального момента между переживанием и поступком. Появляются обобщение переживаний, внутренняя жизнь, самолюбие и самооценка, манерничанье и кривляние как внешние признаки. Формируется внутренняя позиция школьника.", "Подростковый кризис — самый развёрнутый: перестройка на фоне пубертата, чувство взрослости, ориентация на сверстника, эмансипация от семьи, задача идентичности в терминах Эриксона.", "Кризисы взрослости описаны менее строго и держатся скорее на клиническом материале, чем на возрастной норме. Обычно называют кризис перехода к взрослости, кризис около тридцати, кризис середины жизни, кризис ухода из профессии и старения. Здесь формулировки должны быть осторожнее: это уже не нормативные кризисы в смысле Выготского.", "И проведу главное различение. Возрастной кризис нормативен, ожидаем, привязан к логике развития и разрешается новообразованием. Биографический, или жизненный, кризис привязан к событию биографии — разводу, потере работы, вынужденному переезду — и не имеет обязательной возрастной привязки. Травматический кризис вызывается событием, выходящим за пределы обычного человеческого опыта, угрожающим жизни и целостности, и он не является этапом развития вообще.", "Итог: кризис как таковой — точка бифуркации. Он несёт риск дезадаптации и одновременно потенциал развития, и исход зависит не столько от силы события, сколько от ресурсов человека и от того, какую поддержку он получает."], "terms": ["возрастной кризис", "критический период", "Выготский", "социальная ситуация развития", "новообразование", "кризис новорождённости", "кризис одного года", "гипобулические реакции", "кризис трёх лет", "семизвездие симптомов", "негативизм", "строптивость", "своеволие", "обесценивание", "кризис семи лет", "утрата непосредственности", "обобщение переживаний", "внутренняя позиция школьника", "подростковый кризис", "чувство взрослости", "нормативный и ненормативный кризис", "биографический кризис", "травматический кризис"], "exp": [], "stance": ["Считаю, что понимание кризиса как нормы, а не патологии — сильнейшая идея отечественной традиции, и она до сих пор недоусвоена практикой: родители и педагоги по-прежнему читают кризис трёх лет как испорченный характер. При этом описания кризисов детства у Выготского опираются на наблюдение и клинический метод, они феноменологически точны, но их острота и даже само наличие сильно зависят от стиля семейного воспитания — то есть кризис нормативен по функции, но не обязателен по форме. А перенос понятия «кризис» на всю взрослость я считаю натяжкой: там, где нет закономерной смены ведущей деятельности, вернее говорить о переходах и задачах развития."], "conf": ["* возрастной кризис — по сути внутриличностный конфликт, который почти всегда выносится вовне. Механизм виден на кризисе трёх лет: негативизм есть протест против прежней системы требований, и семья превращает его в межличностный конфликт ровно в той мере, в какой отказывается перестраивать отношения. Дальше это масштабируется: подростковый кризис даёт конфликт поколений, кризис профессионального самоопределения — конфликт в организации. Отсюда практический тезис: часть конфликтов, которые предъявляются как межличностные, по происхождению возрастные, и работа с ними через переговоры без учёта задач развития даёт временный результат."], "crisis": ["*"], "follow": [{"q": "Всегда ли кризис заканчивается развитием?", "a": "Нет. Благополучный исход — появление новообразования и новой социальной ситуации. Неблагополучный — фиксация на кризисной симптоматике, закрепление регрессивных форм поведения, у взрослых — хронизация состояния, у детей — невротические реакции и школьная дезадаптация. Исход определяется ресурсами и средой, прежде всего поддержкой значимого окружения."}, {"q": "Чем острая реакция на стресс отличается от кризисного состояния?", "a": "Острая реакция на стресс — кратковременный ответ на исключительное воздействие, с выраженной вегетативной и аффективной симптоматикой, обычно редуцирующийся в течение часов или нескольких дней. Кризисное состояние разворачивается дольше, это процесс со своей фазовой динамикой, и центральным в нём является не физиологическая реакция, а невозможность привычными средствами разрешить ситуацию, значимую для человека."}], "n": 18, "section": "Возрастная психология", "tier": 1}, {"title": "Развитие психологии как самостоятельной науки", "kostyak": ["Дата, от которой отсчитывают: 1879 год, Вильгельм Вундт открывает в Лейпциге первую лабораторию экспериментальной психологии. Психология получает то, чего у неё не было в философии, — эксперимент и собственное учреждение.", "Почва была подготовлена физиологией. Измерили скорость проведения нервного импульса, появилась психофизика Фехнера и Вебера с их логарифмическим законом, Гельмгольц занимался восприятием. Стало ясно, что психическое поддаётся измерению — хотя бы на уровне ощущений.", "Предмет у Вундта — непосредственный опыт, содержание сознания. Метод — экспериментальная интроспекция: обученный испытуемый описывает свои переживания в стандартных условиях. Задача — разложить сознание на элементы: ощущения, чувства, представления, и найти законы их связи, включая апперцепцию.", "Сам Вундт считал, что эксперимент годится только для простейших процессов. Высшие — мышление, речь, воля — он изучал другим способом, через анализ языка, мифа, обычая. Это его „психология народов“, и для нас важно, что уже у основателя есть идея: высшее психическое надо искать в культуре. Выготский потом это подхватит с другой стороны.", "В США линию продолжает Титченер — структурализм. Задача та же, разложить сознание на элементарные составляющие, но доведённая до предела: перечень элементов и их свойств. Направление довольно быстро исчерпалось, интроспекция давала несовпадающие результаты в разных лабораториях, и это стало главным аргументом против неё.", "Ответ — функционализм Уильяма Джеймса. Вопрос не „из чего состоит сознание“, а „зачем оно, какую задачу решает“. Отсюда поток сознания вместо элементов, отсюда интерес к приспособлению, привычке, эмоции. Джеймс написал „Принципы психологии“, и после него психология в Америке разворачивается к практике: образование, отбор, тестирование.", "Российская линия идёт своим путём. Сеченов в „Рефлексах головного мозга“ утверждает, что все акты сознательной и бессознательной жизни по происхождению рефлекторны, и вводит мысль о торможении и о том, что мысль — это рефлекс с задержанным концом. Бехтерев создаёт объективную психологию, затем рефлексологию, организует Психоневрологический институт, работает с сочетательными рефлексами. Павлов даёт учение об условных рефлексах и высшей нервной деятельности — на него потом опирается весь мировой бихевиоризм.", "И к 1910-м годам наступает открытый кризис. Причина простая: одна наука, а предмет и метод у всех разные, результаты интроспекции невоспроизводимы, психология распадается на несовместимые куски. Выготский разбирает это в работе „Исторический смысл психологического кризиса“ и показывает, что дело не в нехватке фактов, а в отсутствии общей объяснительной системы.", "Кризис я бы назвал точкой ветвления: именно из него выходят бихевиоризм, гештальтпсихология, психоанализ. Каждая школа — свой ответ на вопрос, что делать с обанкротившимся сознанием как предметом."], "terms": ["1879 год", "Лейпциг", "Вундт", "экспериментальная интроспекция", "элементы сознания", "апперцепция", "«психология народов»", "Фехнер и Вебер", "психофизика", "Гельмгольц", "Титченер", "структурализм", "Джеймс", "функционализм", "поток сознания", "Сеченов", "«Рефлексы головного мозга»", "Бехтерев", "рефлексология", "Павлов", "условный рефлекс", "открытый кризис психологии", "Выготский", "«Исторический смысл психологического кризиса»"], "exp": [], "stance": ["«На мой взгляд, заслуга Вундта не в интроспекции, которая как метод провалилась, а в институте: лаборатория, ученики, журнал, стандарт процедуры. Науку делает не только идея, но и способ её воспроизводить и передавать. Из Лейпцига разъехались люди, основавшие психологию в США, Англии, России, — и это оказалось важнее конкретной теории.»", "«Кризис начала XX века я не считаю болезнью. Это нормальное состояние науки о человеке: у нас нет и, думаю, не будет единой теории, потому что объект слишком многоуровневый. Плохо не многообразие школ, плохо, когда практик берёт из них вперемешку что придётся и называет это интегративным подходом.»"], "conf": ["Кризис — образцовый пример научного конфликта: столкновение не людей, а исследовательских программ, где предмет спора — сам предмет науки. Полезно назвать это конфликтом парадигм и вспомнить Куна: развитие идёт не накоплением, а сменой несовместимых картин. И второе: у Вундта и особенно у Бехтерева уже есть выход к социальному — Бехтерев занимался коллективной рефлексологией, то есть поведением групп и внушением в толпе. Это прямое начало социальной психологии, на которой стоит конфликтология."], "crisis": ["Психология стала самостоятельной наукой во многом потому, что появился общественный запрос: отбор, обучение, потом — работа с последствиями войн. Учение Павлова об экспериментальных неврозах — фактически первая лабораторная модель срыва при столкновении возбуждения и торможения, то есть модель стрессового расстройства. Отсюда потом Селье с общим адаптационным синдромом. И Бехтерев с его психоневрологией — попытка соединить медицинский и психологический взгляд на человека в тяжёлом состоянии, ровно то, чего требует работа в чрезвычайных ситуациях."], "follow": [{"q": "Чем интроспекция Вундта отличается от обычного самонаблюдения?", "a": "Она стандартизована: специально обученный наблюдатель, заданный стимул, фиксированные условия, отчёт по определённой схеме. Вундт как раз настаивал, что бытовое самонаблюдение ненадёжно. Проблема в том, что и обученное не дало воспроизводимости между лабораториями."}, {"q": "В чём именно состоял кризис?", "a": "В том, что психология не могла ответить, что она изучает и как. Сознание оказалось недоступно объективной проверке, а объяснительные принципы заимствовались то из физиологии, то из философии. Выготский называл это разрывом между объяснительной и описательной психологией и считал, что нужна собственная общая психология, своя «методология среднего уровня»."}], "n": 2, "section": "Генезис психологии", "tier": 2}, {"title": "Мотивация и эмоции в психологии", "kostyak": ["«Начну с разведения понятий. Потребность — это состояние нужды организма или личности в чём-то, что лежит вне его. Мотив — предмет, который эту потребность удовлетворяет и ради которого совершается деятельность. Мотивация — вся совокупность побуждений, весь процесс запуска и поддержания активности».", "«Важный тезис отечественной традиции: реальная деятельность практически всегда полимотивирована. За одним действием стоит не один мотив, а иерархия — есть смыслообразующие мотивы и есть мотивы-стимулы».", "«Классификации потребностей строили многие, самая известная — иерархия Маслоу: физиологические, безопасность, принадлежность и любовь, уважение, самоактуализация. Модель удобна как язык описания, но её жёсткая последовательность эмпирически подтверждается плохо, и я к ней отношусь как к метафоре, а не как к проверенной теории».", "«В теории деятельности Леонтьева мотивация встроена в структуру деятельности: деятельность отвечает мотиву, действие — цели, операция — условиям. Отсюда механизм сдвига мотива на цель: то, что было промежуточной целью, приобретает самостоятельную побудительную силу и становится мотивом. Так рождаются новые мотивы — это, по сути, объяснение развития личности через деятельность».", "«Отдельная линия — внутренняя и внешняя мотивация. Внутренняя питается самим процессом и интересом, внешняя — наградой и наказанием извне. Практически значимо, что внешнее подкрепление способно подрывать внутренний интерес — эффект сверхоправдания».", "«Мотивация достижения: Макклелланд описал потребность в достижении как устойчивую диспозицию, Аткинсон построил модель, где поведение определяется борьбой стремления к успеху и стремления избежать неудачи, с учётом субъективной вероятности успеха и привлекательности результата. Отсюда практический вывод: люди, ориентированные на успех, выбирают задачи средней трудности, ориентированные на избегание — либо слишком лёгкие, либо заведомо непосильные».", "«Рядом стоит понятие уровня притязаний — линия Левина и его учеников: это трудность цели, которую человек ставит себе после успеха или неудачи. И эффект Зейгарник: незавершённое действие удерживает мотивационное напряжение и потому лучше запоминается».", "«Теперь эмоции. Функции: оценочная, побудительная, регулирующая, сигнальная, коммуникативная, следообразующая. Эмоция — это, если коротко, оценка ситуации по отношению к потребности, данная субъекту непосредственно, в форме переживания».", "«Теории перечислю в исторической логике. Джеймс-Ланге: сначала телесная реакция, эмоция — её осознание. Кеннон-Бард: телесные и эмоциональные компоненты возникают параллельно, через таламические механизмы. Шехтер и Зингер, двухфакторная теория: физиологическое возбуждение неспецифично, а качество эмоции задаёт когнитивная интерпретация ситуации. Симонов, информационная теория: эмоция зависит от потребности и от разности между информацией, необходимой для её удовлетворения, и информацией наличной. Экман — линия базовых эмоций и универсальной мимической экспрессии».", "«И два прикладных понятия, которые пригодятся дальше: стресс по Селье с общим адаптационным синдромом и различением эустресса и дистресса, и фрустрация — состояние при непреодолимом препятствии на пути к цели»."], "terms": ["потребность", "мотив", "полимотивированность", "смыслообразующий мотив и мотив-стимул", "сдвиг мотива на цель", "Леонтьев", "иерархия Маслоу", "внутренняя и внешняя мотивация", "мотивация достижения", "Макклелланд", "Аткинсон", "уровень притязаний", "эффект Зейгарник", "Джеймс-Ланге", "Кеннон-Бард", "двухфакторная теория Шехтера-Зингера", "информационная теория Симонова", "базовые эмоции Экмана", "общий адаптационный синдром Селье", "эустресс и дистресс", "фрустрация"], "exp": ["Зейгарник. Испытуемым давали серию небольших заданий, часть из них прерывали до завершения. Потом неожиданно просили вспомнить, какие задания были. Незавершённые воспроизводились заметно чаще завершённых. Объяснение в логике школы Левина: под задачу создаётся квазипотребность, при завершении напряжение разряжается, при прерывании сохраняется и удерживает материал в памяти. Ценность опыта в том, что он связывает мотивацию и память напрямую — память работает не сама по себе, а обслуживает актуальные незакрытые задачи. Оговорка честная: эффект чувствителен к условиям и воспроизводится не всегда.", "Шехтер и Зингер. Испытуемым вводили препарат, вызывающий физиологическое возбуждение, и по-разному объясняли, чего ждать; затем помещали в ситуацию с подставным человеком, ведущим себя либо весело, либо раздражённо. Те, кто не имел объяснения своему возбуждению, переживали его в тональности окружения — как радость или как гнев. Вывод: телесное возбуждение задаёт интенсивность эмоции, а её содержание достраивает интерпретация. Это опора всей когнитивной линии в психологии эмоций и, кстати, прямое обоснование техник переатрибуции в психотерапии."], "stance": ["«Сильная сторона мотивационной проблематики — что она соединяет физиологию, деятельность и личность в одном объяснении. Слабая — измеримость. Пирамида Маслоу вошла в массовую культуру и в учебники менеджмента, но проверок, подтверждающих именно жёсткий порядок удовлетворения уровней, мало, и результаты неоднозначные; сам Маслоу писал осторожнее, чем то, во что его схему превратили. Я пользуюсь ею как языком, а не как законом».", "«По эмоциям моя позиция такая: спор „что первично — телесное или когнитивное“ сегодня выглядит некорректно поставленным. Джеймс-Ланге, Кеннон-Бард и Шехтер описали разные звенья одного процесса, а современные данные скорее говорят о том, что эмоция собирается из физиологии, оценки и контекста одновременно. С базовыми эмоциями Экмана та же история: универсальность мимики подтверждается, но идея жёстко фиксированного набора отдельных эмоциональных программ сейчас оспаривается — есть сильная альтернативная линия, где эмоции понимаются как конструкции, зависящие от культуры и языка»."], "conf": ["«Мотивация — это прямой вход в конфликт. Конфликт по определению начинается со столкновения мотивов, целей или интересов, причём столкновение может быть и внутриличностным. Левин описал типы внутриличностного конфликта через векторы: стремление-стремление, избегание-избегание и стремление-избегание. Фрустрация даёт мостик к фрустрационно-агрессивной гипотезе Долларда и Миллера: препятствие на пути к цели повышает вероятность агрессии, хотя в исходной жёсткой формулировке гипотеза не подтвердилась и была смягчена — агрессия оказалась одним из возможных исходов фрустрации, наряду с уходом, регрессией и поиском обходного пути. Дальше эмоции работают как топливо эскалации: гнев сужает восприятие ситуации, обида фиксирует образ врага, и конфликт начинает поддерживать себя эмоционально уже независимо от исходного предмета спора. Поэтому в разрешении конфликта первый шаг — снятие эмоционального накала, а не поиск решения по существу: с человеком в аффекте предметный разговор не идёт»."], "crisis": ["«Отсюда прямой выход к стрессу. Селье описал общий адаптационный синдром — тревога, резистентность, истощение — и развёл эустресс и дистресс: сама по себе нагрузка не патогенна, патогенно её превышение над ресурсом. Лазарус добавил решающее звено: значимость имеет не событие, а его когнитивная оценка. Первичная оценка отвечает на вопрос „опасно ли это для меня“, вторичная — „справлюсь ли я“; отсюда копинг-стратегии, ориентированные на проблему и ориентированные на эмоцию. Практически в кризисной работе это означает, что мишенью становится не событие, а оценка и ресурс. И мотивационная сторона травмы: при остром стрессе рушится иерархия мотивов, сужается временная перспектива, человек проваливается в настоящее, а отдалённые цели теряют побудительную силу. Восстановление мотивации и способности планировать — один из индикаторов выхода из кризиса»."], "follow": [{"q": "Чем мотив отличается от стимула?", "a": "Стимул внешен и действует на человека, мотив внутренний и принадлежит ему. Один и тот же стимул у разных людей запускает разные мотивы, потому что попадает в разные потребности. В теории деятельности мотив ещё и опредмечен: он всегда мотив чего-то конкретного."}, {"q": "Может ли эмоция быть без физиологического возбуждения?", "a": "В чистом виде вряд ли: телесный компонент входит в эмоцию по определению. Но интенсивность возбуждения и качество переживания разводятся, что и показал эксперимент Шехтера. Слабые эмоциональные тона и настроения сопровождаются минимальными сдвигами и субъективно ощущаются скорее как фон, чем как реакция."}], "n": 5, "section": "Основные понятия", "tier": 2}, {"title": "Ощущение и восприятие в психологии", "kostyak": ["«Ощущение — отражение отдельных свойств предметов при непосредственном воздействии на органы чувств. Восприятие — отражение предмета как целого, в совокупности свойств. Разница не в сложности, а в единице отражения: в ощущении это свойство, в восприятии — предмет».", "«Классификация ощущений по Шеррингтону — самая удобная для ответа: экстероцептивные, интероцептивные, проприоцептивные. Экстероцептивные делятся на контактные и дистантные. Плюс традиционное деление по модальностям: зрение, слух, обоняние, вкус, кожная чувствительность».", "«Психофизика начинается с порогов. Абсолютный нижний порог — минимальная интенсивность, вызывающая ощущение; абсолютный верхний — та, за которой ощущение переходит в боль. Разностный порог — минимальное различие двух стимулов, которое замечается. Чувствительность обратно пропорциональна порогу».", "«Закон Вебера: отношение разностного порога к исходной величине стимула постоянно. Фехнер вывел из этого логарифмическую зависимость интенсивности ощущения от интенсивности стимула. Позже Стивенс предложил степенную функцию, которая лучше описывает данные по ряду модальностей — особенно там, где логарифмический закон явно не работает, как с болевой чувствительностью. Сегодня оба закона рассматриваются как приближения, а сама постановка вопроса дополнена теорией обнаружения сигнала, где вводится критерий принятия решения».", "«Основные свойства чувствительности: адаптация — изменение чувствительности при длительном действии раздражителя, сенсибилизация — её повышение под влиянием других анализаторов или упражнения, взаимодействие анализаторов и синестезия как её крайний случай — когда звук окрашен, а цвет имеет вкус».", "«Перехожу к восприятию. Его свойства называю списком: предметность, целостность, структурность, константность, осмысленность, избирательность. И апперцепция — зависимость восприятия от прошлого опыта, установок и всего склада личности».", "«Константность стоит объяснить отдельно: мы видим предмет неизменным по величине, форме и цвету при изменении расстояния, ракурса и освещения, хотя проекция на сетчатке меняется. Это доказывает, что восприятие — активный процесс построения образа, а не копирование».", "«Гештальтпсихология дала законы перцептивной организации: близость, сходство, замкнутость, хорошее продолжение, общая судьба, прегнантность — тенденция к простой и устойчивой форме. И фигура-фон как базовое членение поля».", "«Иллюзии восприятия — не ошибки системы, а свидетельство её правил: Мюллер-Лайер, Понцо, куб Неккера. Обратная сторона — перцептивная защита: повышение порогов опознания для эмоционально угрожающего материала. Здесь я оговорюсь, что часть исходных результатов по перцептивной защите объяснялась и методическими артефактами, вопрос обсуждаемый».", "«Итог: восприятие — процесс активный, гипотезный. Есть влиятельная линия Найссера с перцептивным циклом и Гибсона с экологическим подходом и понятием аффорданса, где информация о среде считается непосредственно доступной наблюдателю. Это два разных ответа на вопрос, достраивает ли мозг образ»."], "terms": ["экстероцептивные", "интероцептивные", "проприоцептивные ощущения", "Шеррингтон", "абсолютный и разностный порог", "закон Вебера-Фехнера", "степенной закон Стивенса", "теория обнаружения сигнала", "адаптация", "сенсибилизация", "синестезия", "предметность", "целостность", "константность", "структурность", "осмысленность", "апперцепция", "фигура и фон", "гештальт-принципы (близость, сходство, замкнутость, прегнантность)", "иллюзия Мюллера-Лайера", "перцептивная защита", "Гибсон и аффорданс"], "exp": ["Опыты со зрительной константностью и с искажающими очками (Стрэттон, позднее линия Келера и отечественные исследования). Испытуемый носит призматические очки, переворачивающие или смещающие изображение. Первые дни — полная дезорганизация действия, затем происходит перестройка: человек начинает адекватно действовать в среде, а после снятия очков переживает обратный эффект последействия. Показывает главное: перцептивный образ не задан анатомией сетчатки, он формируется в активном взаимодействии с миром и перестраивается. Точные сроки адаптации в разных исследованиях разные, поэтому я цифры называть не буду — важен сам факт обратимой перестройки.", "Иллюзия Мюллера-Лайера. Два равных отрезка со стрелками, направленными внутрь и наружу, воспринимаются как разные по длине. Эффект сохраняется даже когда испытуемый знает об обмане и измерил отрезки линейкой — это классическая демонстрация непроницаемости перцепции для знания. Отсюда важный теоретический вывод о модульности восприятия: знание не отменяет работы перцептивных механизмов. Есть и кросс-культурные данные о том, что выраженность иллюзии различается у людей из разной предметной среды, хотя эти результаты обсуждаются и не бесспорны."], "stance": ["«Психофизика — самая точная часть психологии и одновременно самая узкая. Она измерила чувствительность, но вопрос о содержании образа не решила. Мне ближе позиция, что восприятие — это построение перцептивной гипотезы: система строит наиболее вероятную интерпретацию сенсорных данных, а иллюзии показывают, по каким правилам она это делает. Иллюзия — не сбой, а окно в норму».", "«Спор Гибсона и когнитивистов до конца не закрыт, и это честнее признать, чем изображать единую картину. Гибсон прав в том, что классические опыты сильно оторвали восприятие от реального движущегося наблюдателя, и понятие аффорданса оказалось продуктивным далеко за пределами лаборатории — в дизайне, в эргономике. Но объяснить иллюзии и константность без внутренней переработки, на мой взгляд, не получается»."], "conf": ["«Апперцепция — это, по сути, психологическое объяснение того, почему участники конфликта описывают одно и то же событие несовместимо. Восприятие определяется прошлым опытом, установкой и актуальной потребностью, поэтому в конфликте стороны буквально видят разные ситуации, а не притворяются. Здесь работают явления избирательности и перцептивной защиты: информация, противоречащая своей позиции, опознаётся хуже и обесценивается. Дальше подключаются социально-перцептивные механизмы — эффект ореола, стереотипизация, фундаментальная ошибка атрибуции, когда своё поведение объясняется обстоятельствами, а чужое — характером. Отсюда образ врага: цельный, устойчивый и константный образ, который сопротивляется новой информации. Практический вывод для медиации: значительная часть работы посредника — это работа с перцептивными искажениями сторон, восстановление полноты картины, а не поиск компромисса по цифрам»."], "crisis": ["«В экстремальной ситуации восприятие перестраивается, и это надо описывать конкретно. Сужение поля внимания и восприятия, феномен туннельного зрения, искажение восприятия времени — субъективное растягивание секунд, выпадение фрагментов из последующего отчёта. При острых реакциях на стресс встречаются дереализация и деперсонализация: мир воспринимается как нереальный, а собственные действия — как чужие. При посттравматическом расстройстве характерны флешбэки, где травматический материал переживается не как воспоминание, а как повторное восприятие — с полной сенсорной насыщенностью, в настоящем времени. И повышенная сенсорная чувствительность к сигналам, связанным с травмой: хлопок, запах, звук мотора. Для практики важно, что показания пострадавших и очевидцев в силу этих искажений не могут считаться точной записью события — это отдельная тема на стыке с психологией памяти»."], "follow": [{"q": "Чем сенсибилизация отличается от адаптации?", "a": "Адаптация — изменение чувствительности под действием самого раздражителя, чаще всего снижение при длительном воздействии. Сенсибилизация — повышение чувствительности под влиянием других факторов: работы соседнего анализатора, значимости стимула, упражнения или компенсации при дефекте одного из органов чувств."}, {"q": "Восприятие врождённое или формируется прижизненно?", "a": "И то и другое. Базовые механизмы организации поля работают очень рано, что показывают исследования младенцев, например опыты с «зрительным обрывом» Гибсон и Уока. Но предметность и осмысленность восприятия формируются в опыте — об этом говорят и опыты с искажающими очками, и данные о людях, получивших зрение после долгой слепоты: физически они видят, а опознают предметы с большим трудом."}], "n": 6, "section": "Основные понятия", "tier": 2}, {"title": "Внимание и память в психологии", "kostyak": ["«Внимание отличается от других процессов тем, что у него нет собственного продукта. Это направленность и сосредоточенность сознания на объекте, то есть сторона любого другого процесса, а не отдельный процесс с собственным содержанием. Отсюда старый спор, самостоятелен ли этот процесс вообще».", "«Виды по Добрынину: непроизвольное внимание, вызванное свойствами самого объекта; произвольное, требующее волевого усилия и опосредованное целью; послепроизвольное, когда усилие снято, но сосредоточенность держится за счёт интереса к самой деятельности. Последнее — самое продуктивное состояние, и оно же ближе всего к тому, что позже описывали как поток».", "«Свойства внимания перечисляю все: объём, устойчивость, концентрация, переключение, распределение. И отвлекаемость с колебаниями как обратная сторона устойчивости».", "«Когнитивная линия начинается с моделей селекции. Бродбент предложил модель ранней фильтрации: система пропускает через узкое место один канал, отобранный по физическим признакам, остальное отсекается. Модель не выдержала критики — эффект собственного имени в нерелевантном канале, феномен вечеринки с коктейлем, показывает, что нерелевантный материал обрабатывается по смыслу. Трейсман переформулировала: фильтр не отсекает, а ослабляет сигнал, аттенюирует, и хорошо знакомые или значимые слова проходят через ослабление. Есть и линия поздней селекции — Дойч. Сегодня строгий выбор между ранней и поздней селекцией не считается продуктивным: место отбора зависит от нагрузки, это линия теории перцептивной нагрузки».", "«Отечественное объяснение принципиально другое. Гальперин рассматривал внимание как свёрнутое умственное действие контроля: контроль был развёрнутым и внешним, потом сократился и автоматизировался — и это и есть внимание. Отсюда прямой практический вывод: внимание можно формировать целенаправленно, обучая контролю».", "«Перехожу к памяти. Процессы: запоминание, сохранение, воспроизведение, узнавание, забывание. Виды по модальности — образная, словесно-логическая, эмоциональная, двигательная. По участию воли — произвольная и непроизвольная. По длительности — мгновенная сенсорная, кратковременная, долговременная».", "«Блоковая модель Аткинсона и Шиффрина: сенсорный регистр, кратковременное хранилище, долговременное; перевод из кратковременной в долговременную идёт за счёт повторения. Классическая опора этой модели — эффект края, точнее его двойная природа: эффект первичности связывают с переводом в долговременную память, эффект недавности — с содержимым кратковременной».", "«Про объём: миллеровская формула „семь плюс-минус два“ известна всем, но её надо называть с оговоркой. Во-первых, единица измерения — чанк, а не элемент, а укрупнение единиц раздвигает объём практически неограниченно. Во-вторых, современные оценки объёма рабочей памяти ниже, порядка четырёх единиц».", "«Баддели заменил однородное кратковременное хранилище моделью рабочей памяти: центральный исполнитель, фонологическая петля, зрительно-пространственный блокнот, позже добавлен эпизодический буфер. Это уже не склад, а рабочее пространство с активным управлением. Параллельно Крейк и Локхарт предложили уровни переработки: прочность следа определяется глубиной обработки материала, а не временем в хранилище — семантическая обработка даёт лучшее воспроизведение, чем фонетическая или зрительная
