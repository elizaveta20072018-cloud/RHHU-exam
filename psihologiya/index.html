».", "«Забывание. Кривая Эббингауза: наиболее резкое падение в первые часы после заучивания, дальше замедление. Механизмы забывания обсуждаются разные — угасание следа, интерференция проактивная и ретроактивная, вытеснение в психоаналитическом смысле, ошибка доступа при сохранности следа. Реминисценция — обратный эффект, когда отсроченное воспроизведение оказывается полнее непосредственного, особенно у детей и на осмысленном материале».", "«И линия, которая мне кажется самой важной: память не воспроизводит, а реконструирует. Бартлетт показал это на пересказах, Лофтус — на ложных воспоминаниях. Сюда же эффект Зейгарник и вся мотивационная обусловленность запоминания»."], "terms": ["непроизвольное", "произвольное", "послепроизвольное внимание", "Добрынин", "объём", "устойчивость", "концентрация", "переключение", "распределение", "Бродбент и ранняя фильтрация", "аттенюатор Трейсман", "феномен вечеринки с коктейлем", "внимание как действие контроля", "Гальперин", "Аткинсон и Шиффрин", "рабочая память Баддели", "фонологическая петля и центральный исполнитель", "чанк", "«семь плюс-минус два» Миллера", "уровни переработки", "Крейк и Локхарт", "кривая забывания Эббингауза", "проактивная и ретроактивная интерференция", "эффект края", "реминисценция", "эффект Зейгарник", "Бартлетт и реконструктивность памяти", "ложные воспоминания", "Лофтус"], "exp": ["Эббингауз и бессмысленные слоги. Он заучивал ряды бессмысленных слогов на себе и измерял не воспроизведение, а экономию при повторном заучивании через разные промежутки. Получил кривую забывания с крутым падением сразу после заучивания и последующим замедлением. Значение опыта двойное. Содержательное: забывание идёт неравномерно, поэтому повторение эффективнее всего сразу и распределённо во времени — отсюда весь практический эффект интервального повторения. И методологическое: Эббингауз первым показал, что высшие процессы поддаются экспериментальному измерению, а бессмысленный слог был попыткой очистить материал от прошлого опыта. Ирония в том, что дальнейшая история памяти доказала обратное — именно прошлый опыт и осмысленность определяют запоминание, и на бессмысленном материале мы изучаем скорее лабораторный артефакт, чем реальную память.", "Бартлетт, «Война призраков». Испытуемые-англичане читали индейскую легенду с непривычной для них логикой событий и пересказывали её через возрастающие промежутки. Пересказы систематически укорачивались, непонятные фрагменты выпадали или заменялись привычными деталями, история постепенно превращалась в европейскую по смыслу. Отсюда понятие схемы: память встраивает материал в имеющуюся структуру знаний и при воспроизведении достраивает по ней. Прямое продолжение — работы Лофтус: формулировка вопроса влияет на показания свидетеля, а внушённые детали могут встраиваться в воспоминание и переживаться как подлинные. Практический вывод, который я считаю принципиальным: субъективная уверенность в воспоминании не является гарантией его достоверности."], "stance": ["«Моя позиция по вниманию: спор о ранней и поздней селекции был поставлен как выбор „или-или“, а данные показали, что уровень отбора подвижен и зависит от нагрузки. Это хороший пример того, как психология уходит от жёстких моделей к параметрическим. И мне ближе гальперинская трактовка внимания как контроля, потому что она единственная из перечисленных даёт понятную технологию формирования, а не только описание».", "«По памяти считаю, что главный сдвиг последних десятилетий — отказ от метафоры хранилища. Блоковая модель Аткинсона-Шиффрина была очень полезна как каркас, но она задаёт память как склад с полками, а рабочая память Баддели и уровни переработки описывают её как процесс. Реконструктивная природа памяти при этом имеет прямые последствия за пределами лаборатории — в судебной практике и в психотерапии. Что до „семи плюс-минус двух“, это редкий случай, когда цифра стала культурным мемом и пережила данные, на которых стояла»."], "conf": ["«Память — источник конфликта, а не только его свидетель. Участники спора добросовестно помнят разные версии одного разговора, и это не ложь: реконструкция подгоняет прошлое под нынешнюю позицию, а схема достраивает недостающее. Отсюда типичная динамика — по мере эскалации воспоминания сторон расходятся всё сильнее, каждая помнит свои уступки и чужие нарушения. Селективность внимания работает в ту же сторону: в конфликте человек замечает подтверждения своей правоты и пропускает противоречащее. На этом стоит практика фиксации договорённостей письменно — не из недоверия, а потому что память сторон объективно ненадёжна. И более широкий уровень: коллективная память и её конструирование — самостоятельный фактор затяжных социальных и этнополитических конфликтов, где спор идёт о версии прошлого»."], "crisis": ["«Здесь память — центральная тема, потому что травма прежде всего расстройство памяти. При остром стрессе память работает избирательно: центральные детали события фиксируются с высокой яркостью, периферические выпадают — это описано как эффект фокусировки на оружии. Возможна частичная амнезия на период события, включая психогенную. При ПТСР травматическое воспоминание сохраняется в незаконченной, непереработанной форме — оно не встроено в биографию и потому вторгается в виде флешбэков и кошмаров; это перекликается с логикой эффекта Зейгарник, где незавершённое удерживает напряжение. Внимание при этом перестраивается на гипербдительность и на облегчённое обнаружение угрожающих стимулов. Отсюда логика терапии: значительная часть методов работы с травмой построена на том, чтобы травматическое воспоминание было проговорено, достроено и включено в связный нарратив о собственной жизни. И обязательная оговорка про свидетелей: реконструктивность памяти плюс стресс означают, что показания пострадавших требуют осторожного обращения, а повторные наводящие расспросы способны исказить воспоминание»."], "follow": [{"q": "Почему модель ранней фильтрации не устояла?", "a": "Из-за данных о семантической обработке нерелевантного канала. Если бы фильтр отсекал по физическим признакам полностью, собственное имя в игнорируемом ухе не могло бы прорываться в сознание, а оно прорывается. Трейсман сохранила идею фильтра, но сделала его ослабляющим, а не отсекающим."}, {"q": "Какая разница между кратковременной и рабочей памятью?", "a": "Кратковременная память в блоковой модели — пассивное хранилище с ограниченным объёмом и временем удержания. Рабочая память — система, которая не только хранит, но и оперирует материалом: у неё есть управляющий компонент и специализированные подсистемы под речевой и зрительно-пространственный материал. Разница принципиальна: рабочая память измеряется задачами с одновременным хранением и переработкой, и именно она предсказывает успешность мышления и обучения."}], "n": 7, "section": "Основные понятия", "tier": 2}, {"title": "Мышление и речь в психологии", "kostyak": ["«Мышление — опосредованное и обобщённое отражение действительности, процесс решения задачи, в котором открывается то, что не дано в восприятии непосредственно. Ключевые слова здесь опосредованность и обобщённость, ими мышление и отделяется от восприятия».", "«Виды: наглядно-действенное, наглядно-образное, словесно-логическое — это и генетический ряд развития, и три сосуществующих у взрослого способа. Плюс деление на теоретическое и практическое, дискурсивное и интуитивное, репродуктивное и продуктивное».", "«Операции мышления: анализ, синтез, сравнение, абстрагирование, обобщение, конкретизация, классификация, систематизация. Формы: понятие, суждение, умозаключение — индуктивное, дедуктивное, по аналогии».", "«Мышление начинается с проблемной ситуации. Это тезис, на котором сходятся и Рубинштейн с его формулой мышления как анализа через синтез, и вся линия проблемного обучения. Пока задача не стала проблемой для субъекта, мышление не запускается — воспроизводится готовый способ».", "«Гештальтисты описали продуктивное мышление через переструктурирование ситуации и инсайт: Вертгеймер, Дункер, Кёлер. У Дункера же — функциональная закреплённость: привычная функция предмета мешает увидеть его новое применение».", "«Гальперин дал теорию поэтапного формирования умственных действий: мотивационный этап, ориентировочная основа действия, действие в материальной или материализованной форме, внешнеречевое, речь про себя, умственное. Умственное действие рождается из внешнего, предметного, через последовательную интериоризацию и сокращение. Это не только теория, но и работающая технология обучения — тип ориентировочной основы прямо определяет качество усвоения».", "«Творческое мышление: Гилфорд развёл конвергентное и дивергентное мышление и предложил измерять беглость, гибкость, оригинальность, разработанность. Классическая четырёхстадийная схема творческого процесса — подготовка, инкубация, озарение, проверка».", "«Отдельная и, на мой взгляд, самая интересная современная линия — Канеман и Тверски: реальное мышление в условиях неопределённости идёт не по нормам логики, а по эвристикам. Доступность, репрезентативность, якорение с корректировкой. Отсюда систематические когнитивные искажения и двухсистемная модель — быстрое автоматическое мышление и медленное аналитическое».", "«Теперь речь. Функции: коммуникативная, сигнификативная — обозначения, обобщающая, регулирующая. Виды: внешняя устная — диалогическая и монологическая, письменная, и внутренняя речь как особое образование, свёрнутое и предикативное».", "«Соотношение мышления и речи — классический спор Выготского и Пиаже. У Пиаже эгоцентрическая речь — проявление эгоцентризма мышления, она отмирает с социализацией. У Выготского всё наоборот: речь исходно социальна, эгоцентрическая речь — переходная форма на пути от внешней к внутренней, она не исчезает, а уходит внутрь, становясь внутренней речью и средством планирования. Выготский подкрепил это тем, что при затруднении в задаче объём эгоцентрической речи возрастает — то есть она выполняет функцию, а не просто сопровождает. Пиаже впоследствии признал справедливость части этой критики».", "«И гипотеза лингвистической относительности Сепира-Уорфа: язык определяет мышление и картину мира. Сильная версия сегодня отвергнута, слабая — что язык влияет на категоризацию, внимание к признакам и скорость определённых различений — имеет умеренную эмпирическую поддержку, например в исследованиях цветовых категорий и пространственных ориентиров»."], "terms": ["наглядно-действенное", "наглядно-образное", "словесно-логическое мышление", "анализ", "синтез", "абстрагирование", "обобщение", "понятие", "суждение", "умозаключение", "проблемная ситуация", "анализ через синтез", "Рубинштейн", "инсайт и переструктурирование", "Дункер", "функциональная закреплённость", "Вертгеймер", "поэтапное формирование умственных действий", "Гальперин", "ориентировочная основа действия", "интериоризация", "дивергентное мышление", "Гилфорд", "эвристики доступности и репрезентативности", "Канеман и Тверски", "эгоцентрическая речь", "Выготский против Пиаже", "внутренняя речь", "её предикативность", "гипотеза Сепира-Уорфа"], "exp": ["Дункер, задача со свечой. Испытуемому дают свечу, коробок кнопок и спички и просят закрепить свечу на стене так, чтобы воск не капал на стол. Решение — использовать коробку как подставку, прикрепив её к стене. Большинство не находит решения быстро, потому что коробка воспринимается в своей функции вместилища для кнопок. Если те же кнопки лежат рядом, а коробка пуста, решение находится заметно чаще. Это и есть функциональная закреплённость: прошлый опыт, который обычно помогает, здесь блокирует переструктурирование ситуации. Вывод, который я считаю главным: препятствие в решении задачи часто лежит не в недостатке информации, а в способе, которым ситуация уже осмыслена. Отсюда практический ход — переформулирование задачи как основной инструмент выхода из тупика.", "Канеман и Тверски, задачи на эвристики. Классический пример — описание человека, подходящее под стереотип библиотекаря, после чего спрашивают, кто он вероятнее: библиотекарь или продавец. Люди уверенно отвечают «библиотекарь», игнорируя, что продавцов в популяции несравнимо больше. Это эвристика репрезентативности: суждение о вероятности подменяется оценкой сходства с типичным образцом, а базовая частота отбрасывается. Сюда же задача про Линду с ошибкой конъюнкции, когда сочетание двух признаков оценивается как более вероятное, чем один из них. Значение этих работ в том, что они сместили представление о мышлении: человек не плохой логик, он пользуется другими правилами — быстрыми и обычно работающими, но систематически ошибающимися в определённых классах ситуаций. Ошибки при этом предсказуемы, а значит, поддаются изучению и коррекции."], "stance": ["«Сильная сторона отечественной традиции — что она сразу дала технологию: у Гальперина теория мышления превращается в способ обучения с проверяемым результатом, и это редкость. Слабая — что деятельностный подход хуже описывает быстрые автоматические процессы, которыми занялись когнитивисты; здесь две традиции скорее дополняют друг друга, чем спорят».", "«Про Сепира-Уорфа моя позиция такая. Сильная версия — что язык определяет мышление и носители разных языков живут в разных мирах — не подтвердилась, и часть исходных примеров, вроде рассказов про множество слов для снега, оказалась преувеличением, кочующим по учебникам. Но полностью отбрасывать гипотезу тоже неверно: аккуратные исследования показывают влияние языка на категоризацию и на то, какие признаки человек привычно замечает. Правильная формулировка сегодня — язык не определяет мышление, а систематически смещает его. Разница между „определяет“ и „смещает“ здесь принципиальна»."], "conf": ["«Мышление в конфликте — это в основном разговор о когнитивных искажениях. Работает предвзятость подтверждения: аргументы своей стороны кажутся весомее, чужие обесцениваются. Работает фундаментальная ошибка атрибуции. Работает якорение — первое названное требование задаёт рамку всего последующего торга, что прямо используется в переговорной практике. Плюс сужение мышления при эмоциональном напряжении: конфликт почти всегда воспринимается как дилемма с двумя исходами, и способность увидеть третий вариант теряется первой. Это ровно то, что Дункер назвал бы функциональной закреплённостью, только применительно к социальной ситуации. Отсюда суть переговорной техники разведения позиций и интересов: позиция — заявленное требование, интерес — стоящая за ним потребность, и решение обычно находится на уровне интересов через переформулирование задачи. Речевая сторона тут не менее важна: в конфликте почти всегда есть расхождение в значениях употребляемых слов, и прояснение того, что каждая сторона вкладывает в спорное понятие, снимает часть противоречия ещё до содержательного обсуждения»."], "crisis": ["«При остром стрессе мышление меняется предсказуемо: сужается, теряет гибкость, сваливается в стереотипные схемы. Работает закон Йеркса-Додсона — эффективность растёт с ростом активации до определённого уровня, а дальше падает, причём для сложных задач оптимум ниже. Отсюда практическое следствие для спасателей и диспетчеров: сложные решения в остром состоянии человек принимает плохо, поэтому нужны заранее отработанные алгоритмы, а не импровизация. Появляется катастрофизация как устойчивый способ мышления, туннельное видение выхода из ситуации — в кризисной психологии это прямая мишень работы с суицидальным риском, где характерно именно сужение до единственного варианта. Речь в кризисе тоже меняется: обрывочность, нарушение связности, трудность построения последовательного рассказа о произошедшем. И здесь ключевой терапевтический механизм: перевод травматического опыта в связную речь — то самое означивание. Пока переживание не названо словами, оно не структурировано; работа с нарративом и есть основной инструмент. Это, если угодно, прикладное следствие идеи Выготского о том, что слово не только выражает мысль, но и завершает её»."], "follow": [{"q": "В чём суть спора Выготского и Пиаже об эгоцентрической речи?", "a": "В направлении развития. Пиаже вёл линию от индивидуального к социальному: речь ребёнка сначала эгоцентрична, потом социализируется. Выготский — от социального к индивидуальному: речь исходно средство общения, затем становится средством мышления, и эгоцентрическая речь — переходная стадия этой интериоризации, а не остаток аутизма. Проверялось это тем, что эгоцентрическая речь усиливается при затруднении и ослабевает, когда ребёнок не чувствует, что его слышат, — то есть она сохраняет социальную природу и функциональна."}, {"q": "Что такое ориентировочная основа действия и почему она важна?", "a": "Это система условий, на которую человек реально опирается при выполнении действия. Гальперин показал, что качество усвоения определяется типом этой основы: если она неполная и человек составляет её сам методом проб, усвоение медленное и неустойчивое; если полная и обобщённая, то есть даёт метод анализа любой задачи класса, а не готовый образец, — усвоение быстрое, безошибочное и переносится на новый материал. Практически это означает, что учить надо не действию, а способу его построения."}], "n": 8, "section": "Основные понятия", "tier": 2}, {"title": "Индивид, индивидуальность, личность", "kostyak": ["Сразу задать логику: «Это три разных среза одного человека, и путаются они потому, что в быту используются как синонимы. В психологии между ними — разные основания».", "Индивид — человек как представитель биологического вида, носитель природных свойств: пол, возраст, конституция, свойства нервной системы, задатки. То, что дано до всякой биографии.", "Личность — качество, приобретаемое в системе общественных отношений. Формула Леонтьева: «личностью не рождаются, личностью становятся». Личность возникает там, где появляется соподчинение мотивов и способность действовать не под давлением наличной ситуации.", "Индивидуальность — уникальность конкретного человека, неповторимое сочетание всех уровней. Здесь важно оговорить: в разных школах индивидуальность стоит в разном месте. У Ананьева она вершина и интеграция; у Асмолова часто цитируется формулировка, что индивидом рождаются, личностью становятся, а индивидуальность отстаивают.", "Развернуть схему Ананьева как несущую конструкцию ответа: индивид — личность — субъект деятельности — индивидуальность. Ценна она тем, что вводит четвёртый член: субъект деятельности, то есть человека как носителя активности, труда, познания. Этого члена нет в западных схемах, и он же связывает раздел с деятельностным подходом.", "Сказать про соотношение биологического и социального — это классический вопрос, его почти наверняка тронут. Позиция, которую стоит держать: не сложение и не борьба двух рядов, а преобразование природного в ходе присвоения культуры. Природное не исчезает и не остаётся в чистом виде — оно становится условием и материалом.", "Поставить вопрос о критериях сформированности личности: соподчинение мотивов и опосредованное поведение у Леонтьева, способность к сознательному руководству собственным поведением у Божович, ответственность и авторство собственной жизни в более поздних формулировках.", "Закрыть: «Практически это различение работает всякий раз, когда нужно понять, с чем мы имеем дело — с темпераментальной особенностью, которую бессмысленно переделывать, или с личностной позицией, которая меняема»."], "terms": ["Индивид", "природные свойства и задатки", "свойства нервной системы", "личность как системное качество", "«личностью не рождаются", "личностью становятся»", "соподчинение мотивов", "опосредованное поведение", "субъект деятельности", "индивидуальность как интеграция", "схема Ананьева", "биологическое и социальное", "присвоение общественного опыта", "внутренняя позиция (Божович)"], "exp": [], "stance": ["Схему Ананьева считаю самой удобной именно для практики: она единственная не даёт свести человека к одному основанию и заставляет каждый раз спрашивать, на каком уровне мы объясняем факт поведения.", "Спор о биологическом и социальном я бы не считал решённым, а считал бы переформулированным. После поведенческой генетики вопрос «сколько процентов от чего» перестал быть содержательным — данные говорят о заметной наследуемости практически всех личностных черт, но это ничего не сообщает о том, изменяем ли признак у конкретного человека. Наследуемость — статистика о популяции, а не приговор индивиду; эту разницу путают постоянно, включая профессиональные тексты."], "conf": ["Через уровень, на котором разворачивается конфликт. Столкновение на уровне индивида — это скорее конфликт темпераментов и ритмов, он снимается организационно: разведением, режимом, форматом взаимодействия. Столкновение на уровне личности — конфликт мотивов, ценностей и позиций, он организационно не снимается, только переговорами и работой со смыслами. Диагностическая ошибка здесь дорого стоит: пытаться договориться там, где людей просто нужно развести по графику, — и наоборот."], "crisis": ["В экстремальной ситуации уровни расслаиваются наглядно. Первые минуты работает индивидный уровень: тип нервной системы, скорость реакции, порог утомления — здесь личность мало что решает. Дальше включается личностный: смысл, который человек придаёт происходящему, и есть главный предиктор того, станет ли событие травмой. Отсюда классический тезис, что травмирует не событие само по себе, а его значение для человека. И третий уровень — субъектность: способность вернуть себе роль действующего лица, а не пострадавшего, во многом определяет исход реабилитации."], "follow": [{"q": "Всякий ли человек — личность?", "a": "Вопрос был острым в советской психологии, и ответ зависит от того, берём мы личность как качество или как степень. Если это системное качество, приобретаемое в отношениях, то у него есть порог: у младенца личности в этом смысле ещё нет, при глубоком органическом поражении она может не сформироваться. Если это степень — то говорить надо не «есть или нет», а о мере зрелости. Я держусь второго: этически безопаснее и практически точнее."}, {"q": "Чем индивидуальность отличается от индивидуальных различий?", "a": "Индивидуальные различия — это межиндивидуальная вариативность по отдельным измерениям, предмет дифференциальной психологии, язык шкал и норм. Индивидуальность — целостность и уникальность конкретного человека, которая по шкалам не собирается. Это разница между номотетическим и идиографическим подходами, и различал их ещё Олпорт."}], "n": 10, "section": "Личность", "tier": 2}, {"title": "Психология общения", "kostyak": ["Начать с того, что общение в отечественной традиции — самостоятельная категория, а не приложение к деятельности. У Ломова общение и деятельность — две стороны социального бытия человека, у Леонтьева общение вписано в деятельность. Разница принципиальная и стоит её обозначить.", "Дать структуру Андреевой сразу — это костяк всего ответа: три взаимосвязанные стороны, коммуникативная (обмен информацией), интерактивная (обмен действиями), перцептивная (восприятие и понимание друг друга). Дальше разворачиваю по очереди.", "Коммуникативная сторона: не передача информации по каналу, а обмен между активными субъектами, где есть общее поле значений. Вербальная и невербальная коммуникация, соотношение между ними, паралингвистика и экстралингвистика, проксемика Холла, кинесика.", "Здесь же — коммуникативные барьеры: смысловые, фонетические, стилистические, барьеры отношения. Обратная связь и её виды, активное слушание, эмпатическое слушание. Функции общения: информационная, регулятивная, аффективная.", "Интерактивная сторона: типы взаимодействия — кооперация и конкуренция как базовая дихотомия. Транзактный анализ Берна с эго-состояниями Родитель, Взрослый, Ребёнок, параллельными и пересекающимися транзакциями. Отсюда прямой ход к тому, что пересекающаяся транзакция — типовое начало бытового конфликта.", "Перцептивная сторона: механизмы межличностного восприятия — идентификация, эмпатия, рефлексия, аттракция. Каузальная атрибуция: Хайдер как основоположник, Келли с моделью ковариации и критериями консенсуса, постоянства и различения.", "Эффекты и искажения: фундаментальная ошибка атрибуции, эффект ореола, эффекты первичности и новизны, стереотипизация, различие атрибуции для себя и для другого.", "Закрыть прикладным: коммуникативная компетентность, социально-психологический тренинг общения как метод, работа с барьерами в консультировании и переговорах."], "terms": ["Г. М. Андреева", "Б. Ф. Ломов", "А. А. Леонтьев", "коммуникативная", "интерактивная", "перцептивная стороны", "вербальная и невербальная коммуникация", "проксемика", "Э. Холл", "коммуникативные барьеры", "обратная связь", "активное слушание", "Э. Берн", "транзактный анализ", "эго-состояния", "кооперация и конкуренция", "Ф. Хайдер", "Г. Келли", "каузальная атрибуция", "фундаментальная ошибка атрибуции", "эффект ореола", "идентификация", "эмпатия", "рефлексия", "аттракция", "стереотипизация"], "exp": ["Эдвард Джонс и Виктор Харрис, эффект соответствия.* Испытуемым давали читать эссе в поддержку или против политической позиции и прямо сообщали, что автор писал по заданию, тему выбрал не он. Читатели всё равно приписывали автору соответствующие убеждения. Отсюда фундаментальная ошибка атрибуции: мы переоцениваем личностные причины поведения и недооцениваем ситуационные. Позже показали, что выраженность эффекта зависит от культуры — в коллективистских культурах ситуационное объяснение используется чаще.", "Соломон Аш, формирование впечатления о личности.* Испытуемым зачитывали список качеств человека; менялось только одно слово — «тёплый» или «холодный», остальные оставались теми же. Общее впечатление менялось радикально, вплоть до приписывания качеств, которых в списке не было. Это одна из первых демонстраций того, что впечатление о человеке строится не суммированием черт, а как целостный образ вокруг центральной характеристики. Отсюда эффект ореола."], "stance": ["Мне ближе позиция Ломова: общение нельзя свести к деятельности, потому что в нём принципиально два активных субъекта, а не субъект и объект. В консультировании это чувствуется буквально — как только специалист начинает «осуществлять воздействие», контакт рассыпается.", "Про невербалику. В популярной литературе цифры вроде «93 процента информации передаётся невербально» разошлись как аксиома, хотя исходное исследование Мехрабиана касалось узкой ситуации — противоречия между словами и интонацией при передаче отношения. Как коллеге я бы сказал: невербальный канал важен, но точные проценты тут — миф."], "conf": ["Общение — та точка, где конфликт возникает и где он лечится, поэтому разворот делаю подробно.", "Первое: коммуникативные барьеры как источник конфликта. Значительная часть бытовых и организационных конфликтов начинается не с расхождения интересов, а со смыслового барьера — стороны вкладывают в одни и те же слова разное содержание. Отсюда практическая техника: прежде чем работать с предметом конфликта, надо восстановить общее поле значений.", "Второе: атрибуция как механизм эскалации. В конфликте работает атрибутивная асимметрия — своё враждебное действие я объясняю обстоятельствами и провокацией, чужое такое же действие объясняю характером оппонента. Это то, что в конфликтологии называют образом врага. Сюда же — двойной стандарт в оценке одних и тех же действий и приписывание оппоненту скрытых мотивов.", "Третье: транзактный анализ даёт готовую модель конфликтного взаимодействия. Пересекающаяся транзакция — когда один обращается по линии Взрослый—Взрослый, а отвечают ему из позиции Родитель к Ребёнку, — это типичный запуск скандала. Игры по Берну описывают повторяющиеся деструктивные сценарии, и это удобный язык для работы с семейными и организационными конфликтами.", "Четвёртое: конструктивная сторона. Дойч показал, что кооперативная и конкурентная ориентации создают самоподдерживающиеся коммуникативные циклы — кооперация порождает открытость и доверие, конкуренция порождает искажение информации и подозрительность. Отсюда весь инструментарий переговоров: разделение людей и проблемы, работа с интересами вместо позиций — гарвардский метод Фишера и Юри, техника Я-высказывания, активное слушание как базовый инструмент медиатора.", "Пятое: медиация технологически стоит на перцептивной стороне общения — задача посредника не рассудить, а восстановить взаимное понимание позиций."], "crisis": ["В экстренной ситуации структура общения меняется: сужается объём восприятия, растёт внушаемость, обычные барьеры падают, а доверие к источнику решает больше, чем содержание сообщения. Отсюда правила кризисной коммуникации — короткие однозначные фразы, простой синтаксис, обращение по имени, отсутствие частицы «не» в инструкции, повторение. В психологии экстренной помощи это оформлено как приёмы работы на месте ЧС: контакт, простые директивные инструкции, включение в деятельность. Отдельно — коммуникация с толпой и роль слухов как замещающего информационного канала: слух возникает там, где официальная информация отсутствует или ей не верят."], "follow": [{"q": "Что такое обратная связь и какой она должна быть?", "a": "Информация о том, как воспринято сообщение. В прикладном плане различают оценочную и безоценочную, отсроченную и немедленную. Правила подачи: описывать поведение, а не личность, говорить о своём восприятии, быть своевременным и конкретным, давать её тогда, когда человек может ей воспользоваться."}, {"q": "Чем идентификация отличается от эмпатии?", "a": "Идентификация — уподобление себя другому, попытка понять, поставив себя на его место. Эмпатия — эмоциональный отклик, сопереживание без слияния с позицией другого; здесь сохраняется различение «его чувства» и «мои чувства». Рефлексия в социально-психологическом смысле — осознание того, как меня воспринимает партнёр."}], "n": 14, "section": "Социальная психология", "tier": 2}, {"title": "Проблема групп в социальной психологии: классификации, основные характеристики", "kostyak": ["Начать с того, почему группа — проблема, а не просто объект: спор о том, обладает ли группа психологическими качествами, несводимыми к качествам её членов, идёт от Лебона и Макдугалла до современности. Отечественная традиция отвечает через совместную деятельность.", "Дать классификации сразу и системно: условные и реальные; лабораторные и естественные; большие и малые; формальные и неформальные; группы членства и референтные (различение Хаймена и Ньюкома); по уровню развития — от диффузной группы до коллектива.", "Малая группа: определение через непосредственный контакт и общую деятельность, вопрос о нижней и верхней границе численности. Структура группы — статус, роль, система связей; социометрия Морено как метод её диагностики.", "Групповая динамика: термин Левина. Основные процессы — образование группы, нормообразование, сплочённость, принятие решений, лидерство, давление группы. Нормы и санкции, групповое давление.", "Стадии развития группы: модель Такмена — формирование, шторм, нормирование, функционирование, распад. Отечественная альтернатива — стратометрическая концепция Петровского: три слоя, внешний слой эмоциональных отношений, слой ценностно-ориентационного единства, ядро — отношения, опосредованные содержанием совместной деятельности. Уровень развития группы определяется тем, насколько глубоки слои опосредования.", "Лидерство и руководство: различение по Парыгину — лидерство возникает стихийно в системе неформальных отношений, руководство назначается и регулируется официально. Стили по Левину, ситуационный подход, теория Фидлера.", "Групповые феномены — перечислять с именами: конформизм у Аша, подчинение авторитету у Милгрэма, групповая поляризация, огруппление мышления у Дженис, социальная фасилитация и ингибиция от Триплетта и Зайонца, социальная леность в опытах Рингельмана, деиндивидуализация, эффект свидетеля у Латане и Дарли.", "Большие группы: устойчивые (этнос, класс, профессиональная общность) и стихийные (толпа, масса, публика). Механизмы массового поведения — заражение, внушение, подражание. Типы толпы, паника, слухи и их виды, циркулярная реакция.", "Закрыть методами работы: социометрия, групповая сплочённость как измеряемый параметр, социально-психологический тренинг, командообразование, работа с групповыми нормами."], "terms": ["условные и реальные группы", "большие и малые", "формальные и неформальные", "референтная группа", "Г. Хаймен", "Я. Морено", "социометрия", "К. Левин", "групповая динамика", "Б. Такмен", "А. В. Петровский", "стратометрическая концепция", "ценностно-ориентационное единство", "Б. Д. Парыгин", "лидерство и руководство", "Ф. Фидлер", "С. Аш", "С. Милгрэм", "И. Дженис", "огруппление мышления", "групповая поляризация", "Н. Триплетт", "Р. Зайонц", "социальная фасилитация и ингибиция", "эффект Рингельмана", "деиндивидуализация", "Б. Латане и Дж. Дарли", "эффект свидетеля", "заражение", "внушение", "подражание", "циркулярная реакция"], "exp": ["Соломон Аш, конформность.* Испытуемый в группе подставных участников сравнивал длину отрезков — задача с очевидным правильным ответом. Когда все остальные единодушно называли заведомо неверный вариант, значительная часть испытуемых хотя бы раз соглашалась с большинством, хотя наедине ошибок практически не было. Ключевые находки в вариациях: достаточно одного союзника, дающего верный ответ, чтобы конформность резко упала; публичность ответа усиливает эффект, письменный ответ ослабляет. Методологическая оговорка: эффект воспроизводится, но его величина заметно зависит от культуры и исторического периода, что показали метаанализы.", "Стэнли Милгрэм, подчинение авторитету.* Испытуемый в роли «учителя» по указанию экспериментатора наносил «ученику» удары током возрастающей силы; ученик был подставным, разряда не было. Большинство участников доходило до максимальных значений шкалы, несмотря на выраженный стресс. Милгрэм объяснял результат переходом в «агентное состояние» — человек перестаёт видеть себя источником действия и передаёт ответственность авторитету. Оговорка обязательна и должна звучать методологически, а не разоблачительно: исследование не соответствует современным этическим стандартам и повторить его в исходном виде нельзя; кроме того, анализ архивов показал, что экспериментатор отклонялся от протокола и импровизировал в давлении на испытуемых. Частичные воспроизведения в облегчённом варианте базовый эффект подтверждают.", "Если зайдёт речь о Зимбардо и Стэнфордском тюремном эксперименте — я бы упомянул его как исторический сюжет, а не как доказательство. Там не было контроля, инструкции «охранникам» задавали ожидаемое поведение, и по современным меркам это скорее демонстрация, чем эксперимент."], "stance": ["Мне кажется, главный урок Милгрэма и Аша сместился. Долгое время из них делали вывод «человек слаб», а корректнее читать их как демонстрацию силы ситуации — и, что важнее, как указание на точки вмешательства: один несогласный рушит единодушие, физическое присутствие жертвы снижает подчинение, разделённая ответственность его повышает. Это операциональные вещи, из них строится профилактика.", "Стратометрическую концепцию Петровского считаю недооценённой. Она отвечает на вопрос, который западные модели обходят: почему сплочённая группа может быть при этом деструктивной. Ответ — сплочённость сама по себе ничего не говорит, важно, вокруг какого содержания она сложилась."], "conf": ["Это центральный разворот всего раздела, разворачиваю максимально.", "Первое — межгрупповой конфликт как отдельный предмет. Две конкурирующие объяснительные рамки: реалистический конфликт Шерифа, где вражда растёт из объективного столкновения интересов, и социальная идентичность Тайфела, где достаточно самой категоризации. Практический вывод разный: в первом случае работают надгрупповые цели и изменение структуры интересов, во втором — рекатегоризация, то есть построение общей идентичности более высокого порядка. Хорошее место, чтобы показать собственную позицию: обе рамки нужны, вопрос диагностики — с каким типом конфликта имеешь дело.", "Второе — гипотеза контакта Олпорта и её условия: равный статус сторон, общие цели, кооперация, поддержка со стороны институтов. Без этих условий контакт не снижает предубеждения, а иногда усиливает их. Это прямая рекомендация для программ по снятию межэтнической напряжённости.", "Третье — внутригрупповые механизмы эскалации. Огруппление мышления по Дженис: сплочённая изолированная группа с директивным лидером и без процедур критики принимает решения хуже, чем её участники по отдельности; симптомы — иллюзия неуязвимости, самоцензура, иллюзия единодушия, стереотипный образ противника, давление на несогласных. Отсюда практика: адвокат дьявола, независимые подгруппы, анонимный сбор мнений. Групповая поляризация — обсуждение сдвигает среднюю позицию группы в сторону исходной тенденции, что объясняет радикализацию сообществ, в том числе сетевых.", "Четвёртое — конфликт как элемент групповой динамики. В модели Такмена стадия шторма нормальна и необходима: группа, проскочившая её, платит псевдосогласием. Отсюда рабочий тезис — задача не устранить конфликт в команде, а провести её через него. Дойч с конструктивным и деструктивным конфликтом даёт критерий различения.", "Пятое — типология конфликтов по субъектам: внутриличностный, межличностный, между личностью и группой, межгрупповой. Структура конфликта: участники, предмет, объект, образы конфликтной ситуации, позиции сторон. Динамика: предконфликтная ситуация, инцидент, эскалация, кульминация, завершение, постконфликтная стадия. Механизмы эскалации — расширение предмета спора, переход от аргументов к личности, рост числа участников, потеря первоначальной цели.", "Шестое — статус, роль и власть как источники конфликта в организации: ролевой конфликт, конфликт ожиданий, конфликт между формальным руководителем и неформальным лидером, статусная несовместимость. Это самая частая практическая задача организационного конфликтолога."], "crisis": ["Большие стихийные группы — прямой предмет психологии ЧС.", "Толпа и её типы: случайная, конвенциональная, экспрессивная, действующая; действующая делится на агрессивную, паническую, стяжательную, повстанческую. Механизмы образования — циркулярная реакция, эмоциональное кружение, заражение и внушение при сниженной критичности. Деиндивидуализация объясняет, почему в толпе совершают то, чего не совершают поодиночке: анонимность, снижение самоосознания, размывание ответственности.", "Паника: условия возникновения — дефицит достоверной информации, ощущение угрозы, физическая скученность, отсутствие ясной инструкции и организующего центра. Способы прекращения — громкий уверенный голос с конкретной командой, включение людей в простое действие, разделение массы, работа с лидерами мнений. Здесь же — «паралич» и оцепенение как альтернатива бегству, и то, что в реальных ЧС массовая паника случается реже, чем принято думать, а чаще наблюдается просоциальное поведение.", "Слухи: классификации по эмоциональной окраске — слух-желание, слух-пугало, агрессивный слух — и по достоверности. Условие возникновения — значимость темы плюс неопределённость информации. Профилактика информационная, а не запретительная.", "Эффект свидетеля Латане и Дарли объясняет неоказание помощи через диффузию ответственности и плюралистическое неведение — люди ориентируются друг на друга и, видя внешнее спокойствие остальных, не оценивают ситуацию как экстренную. Практический вывод, который стоит произнести: адресное обращение к конкретному человеку снимает эффект.", "Плюс организационный слой — группа спасателей и её динамика, профессиональное выгорание, вторичная травматизация, необходимость дебрифинга и супервизии."], "follow": [{"q": "Чем референтная группа отличается от группы членства?", "a": "Группа членства — та, в которую человек фактически включён. Референтная — та, чьи нормы и ценности он использует как эталон при оценке себя и своих поступков; она может совпадать с группой членства, а может быть внешней и даже недоступной. Различение введено Хайменом, развито Ньюкомом. Практически важно, что конфликт нормативных требований группы членства и референтной группы — типичный источник внутриличностного напряжения, особенно у подростков и у людей в ситуации миграции."}, {"q": "Что такое ценностно-ориентационное единство и чем оно отличается от сплочённости?", "a": "Сплочённость в западной традиции измеряется чаще через взаимные симпатии и привлекательность группы для её членов. Ценностно-ориентационное единство у Петровского — совпадение оценок и позиций членов группы по значимым для совместной деятельности вопросам, при этом по вопросам, к деятельности не относящимся, расхождения допустимы и нормальны. Разница принципиальная: группа может быть эмоционально тёплой и при этом не иметь общей позиции по делу."}], "n": 16, "section": "Социальная психология", "tier": 2}, {"title": "Основные этапы развития представлений о предмете психологии в рамках философии", "kostyak": ["Начну с главного: история психологии — это история смены предмета. Душа, потом сознание, потом поведение, потом психика как таковая. Каждая смена — ответ на то, что предыдущий предмет оказался недоступен для проверки.", "Первый предмет — душа. У Платона она отделена от тела, бессмертна, а тело для неё скорее темница; знание — припоминание того, что душа видела до рождения. Психология здесь часть учения о бытии.", "Аристотель разворачивает это иначе. Душа — форма живого тела, способ его существования, отдельно от тела не бывает. Его трактат „О душе“ принято считать первым систематическим текстом о психике: там уже есть уровни — растительная, животная, разумная душа, есть ощущение, память, воображение.", "Средневековье встраивает душу в богословие, и предмет почти не движется. Но именно там копится интерес к внутреннему опыту — у Августина самонаблюдение становится способом познания.", "Перелом — Декарт, XVII век. Он разводит мыслящую и протяжённую субстанции: тело работает как машина, и его движения объясняются через рефлекс, без участия души. Душе остаётся мышление, точнее сознание. С этого момента предмет психологии — сознание, а метод — интроспекция.", "Дальше вопрос: откуда содержание сознания берётся? Ответ эмпиризма: из опыта. Локк говорит, что врождённых идей нет, сознание при рождении чистый лист, и вводит два источника опыта — ощущение и рефлексию, то есть наблюдение за собственными состояниями.", "Из эмпиризма вырастает ассоцианизм — первая по-настоящему объяснительная психологическая теория. Идеи связываются по смежности, сходству, контрасту; сложное складывается из простого. Гоббс, Юм, Гартли, позже Джеймс Милль и Бэн. Это работает почти два века и прямо готовит экспериментальную психологию.", "И ещё одна линия внутри философии — Спиноза с единством души и тела и Лейбниц с идеей малых, неосознаваемых восприятий. Лейбниц фактически ставит вопрос о бессознательном за двести лет до Фрейда.", "Итог: философия дала психологии проблемы — душа и тело, врождённое и приобретённое, сознание и его состав. Отделиться от философии психология смогла только тогда, когда появился способ измерять."], "terms": ["Платон", "Аристотель", "трактат «О душе»", "энтелехия", "Августин и самонаблюдение", "Декарт", "психофизический дуализм", "рефлекс", "Локк", "сенсуализм и эмпиризм", "рефлексия как внутренний опыт", "ассоцианизм", "Гоббс", "Юм", "Гартли", "Спиноза", "Лейбниц", "апперцепция", "психофизическая проблема"], "exp": [], "stance": ["«Считаю, что решающим здесь был не Платон, а Аристотель и Декарт, причём по противоположным причинам. Аристотель первым сказал, что душу нужно изучать через функции живого тела — это и есть будущий естественнонаучный подход. Декарт же расколол человека надвое, и этот раскол психология расхлёбывает до сих пор: вся психофизиологическая проблема, весь спор о соотношении мозга и психики растёт оттуда. Сильная сторона декартовского хода — идея рефлекса и вообще возможность объяснять поведение механически. Слабая — то, что сознание он сделал прозрачным для самого себя, а это оказалось неправдой.»", "«Ассоцианизм я считаю устаревшим как теория, но не как наблюдение. Сама идея, что психика складывается из элементов, не выдержала критики гештальтистов. А вот ассоциация как факт никуда не делась — она живёт в теориях научения и в современной когнитивной психологии под другими именами.»"], "conf": ["Психофизическая проблема — первый «конфликт» внутри самой науки: два объяснительных языка, которые не сводятся друг к другу. Дальше — Платон с его учением о трёх началах души, где разумное начало должно управлять яростным и вожделеющим: это первая модель внутреннего конфликта в европейской мысли, задолго до Фрейда. И Гоббс: «война всех против всех», человек как существо, чьи страсти сталкиваются, а порядок держится договором. То есть представление о конфликте как норме, а не поломке, приходит в психологию из философии."], "crisis": ["Стоицизм — фактически первая практическая психология совладания: различай то, что в твоей власти, и то, что вне её; страдает не от событий, а от суждений о них. Эпиктет и Марк Аврелий. Это прямой предок когнитивно-поведенческой терапии, Эллис и Бек на это ссылались открыто. Можно добавить: Спиноза с его анализом аффектов и мыслью, что аффект перестаёт быть страданием, как только мы составляем о нём ясное представление, — это ровно то, что мы делаем в дебрифинге и в работе с травматическим переживанием."], "follow": [{"q": "Почему именно Декарта считают точкой перелома, а не, скажем, Бэкона?", "a": "Потому что Декарт задал психологии предмет и метод одновременно: сознание, доступное самонаблюдению. И потому что понятие рефлекса дало возможность объяснять поведение без обращения к душе — из этой линии вырастут Сеченов и бихевиоризм."}, {"q": "Что такое tabula rasa и справедлива ли эта идея сегодня?", "a": "Тезис Локка: врождённого содержания в сознании нет, всё из опыта. Сегодня в буквальном виде идея не работает — есть темперамент, есть данные о врождённых предпосылках восприятия и языка. Но сама постановка вопроса о роли среды осталась, и в культурно-историческом подходе она решается сложнее: врождённое есть, но человеческим оно становится только в культуре."}], "n": 1, "section": "Генезис психологии", "tier": 3}, {"title": "Социальная роль и социальный статус личности", "kostyak": ["Начать с определений и с их связки: статус — позиция человека в системе общественных отношений, с закреплённым набором прав и обязанностей. Роль — динамическая сторона статуса, ожидаемое поведение того, кто эту позицию занимает. Статус занимают, роль исполняют.", "Развести предписанные и достигаемые статусы, назвать главный статус — тот, по которому человека прежде всего идентифицируют, и который у одного и того же человека может меняться по ходу жизни.", "Ввести ролевые ожидания (экспектации) и ролевой набор — совокупность ролей, связанных с одним статусом. Подчеркнуть, что ожидания задаются не только формально, но и неписаными нормами группы, и вторые обычно жёстче.", "Разобрать ролевой конфликт — здесь надо быть точным. Межролевой: несовместимы требования разных ролей одного человека (работник и родитель). Внутриролевой: разные группы предъявляют несовместимые требования к одной и той же роли (руководителя тянут в разные стороны подчинённые и вышестоящие). Плюс личностно-ролевой: роль противоречит ценностям и Я-концепции самого исполнителя.", "Назвать интернализацию роли — присвоение роли, когда она перестаёт быть внешним предписанием и становится частью представления о себе. И обратный полюс — ролевую дистанцию: способность обозначить, что ты больше, чем твоя роль.", "Теоретическая рамка: Дж. Г. Мид и символический интеракционизм — личность формируется во взаимодействии, через принятие роли другого; различение I и Me, где Me — усвоенная позиция обобщённого другого, а I — спонтанная активность. Детская игра как школа принятия ролей.", "Гофман и драматургический подход: социальное взаимодействие как представление, передний и задний план, управление впечатлением. Отдельно его работа о стигме — как испорченная идентичность и приписанный статус перестраивают всё взаимодействие.", "Эксперимент Зимбардо — и сразу с оговоркой. Стэнфордский тюремный эксперимент десятилетиями цитировался как доказательство того, что роль поглощает личность. Сейчас его методология оспорена всерьёз: обнародованы записи, показывающие, что участников инструктировали в нужную сторону, набор шёл по объявлению, прямо упоминавшему тюремную тематику, часть поведения была демонстративной, контроля не было. Прямой вывод из него делать нельзя. Что осталось — сам вопрос о силе ситуации, и он подтверждается на другом материале, прежде всего в исследованиях подчинения авторитету и в полевых работах по организационному поведению.", "Свести: «Ролевой подход хорош тем, что переводит разговор о человеке в разговор о позиции и ожиданиях — то есть в то, что можно менять переговорами и договорённостями»."], "terms": ["Социальный статус", "предписанный и достигаемый статус", "главный статус", "социальная роль", "ролевые ожидания (экспектации)", "ролевой набор", "межролевой конфликт", "внутриролевой конфликт", "личностно-ролевой конфликт", "интернализация роли", "ролевая дистанция", "символический интеракционизм", "Мид", "принятие роли другого", "обобщённый другой", "Гофман", "управление впечатлением", "стигма", "Стэнфордский тюремный эксперимент и его методологическая критика"], "exp": [], "stance": ["Ролевой подход считаю сильным инструментом и слабой теорией личности. Он отлично описывает регулярности взаимодействия и почти ничего не говорит о том, почему в одной и той же роли люди ведут себя по-разному. Поэтому применять его я бы стал как надстройку над личностной диагностикой, а не вместо неё.", "Про Стэнфорд отдельно: считаю правильным упоминать и результат, и критику. Дисциплина, которая пересматривает свою классику, выглядит здоровее той, которая её охраняет. Репликационный кризис психологию потрепал, но заодно вычистил изрядное количество красивых историй, державшихся на одном исследовании."], "conf": ["Это самый прямой мостик во всём разделе, на нём и стоит задержаться 3 августа. Ролевой конфликт — полноценный предмет конфликтологии, и его типология сразу даёт способ вмешательства: межролевой снимается пересмотром нагрузки и границ, внутриролевой — согласованием ожиданий сторон, личностно-ролевой чаще всего требует смены роли, потому что ценности не переговариваются. Дальше стоит сказать про статусный конфликт и про то, что значительная часть организационных конфликтов — не столкновение людей, а рассогласование нечётко описанных позиций. И про Гофмана: значительная доля эскалации в переговорах — это защита лица, а не защита интереса, и переговорщик, который даёт оппоненту выйти без потери лица, закрывает конфликт быстрее."], "crisis": ["Через слом ролевой структуры. Чрезвычайная ситуация обнуляет привычный статус и навязывает новый — «пострадавший», «эвакуированный», «беженец». Это принудительно приписанный статус со всеми признаками стигмы по Гофману, и он сам по себе травматизирующий фактор, отдельный от исходного события. Отсюда прикладной вывод, который в работе с пострадавшими считается принципиальным: как можно раньше возвращать человеку деятельные роли, поручать посильные задачи. Плюс ролевой конфликт у самих спасателей и специалистов — профессиональная роль требует включённости и одновременно дистанции, и хроническое напряжение между ними стоит за выгоранием и вторичной травматизацией."], "follow": [{"q": "Ролевая теория и деятельностный подход — они противоречат друг другу?", "a": "Скорее описывают разные срезы. Ролевая теория идёт снаружи внутрь: общество задаёт позиции, личность их присваивает. Деятельностный подход идёт от активности субъекта, который эти позиции и осваивает, и перестраивает. Точка стыковки — интернализация роли, а она у Мида и интериоризация у Выготского логически очень близки, обе про переход внешнего во внутреннее. Разница в том, что у Выготского опосредующим звеном становится знак."}, {"q": "Что конкретно не так со Стэнфордским экспериментом?", "a": "Основных претензий несколько: экспериментатор был одновременно руководителем тюрьмы и не был внешним наблюдателем; сохранившиеся записи показывают, что «охранников» подталкивали к жёсткости, то есть поведение было отчасти предписано, а не спонтанно; отбор участников был смещён самим текстом объявления о наборе; выборка мала, контрольной группы нет, поведение не кодировалось систематически. Позднейшая попытка воспроизвести исследование в другой стране дала другую динамику. Вывод «роль поглощает личность» из этих данных не следует — следует более осторожный: институциональные условия и легитимация со стороны авторитета сильно расширяют границы допустимого."}], "n": 11, "section": "Личность", "tier": 3}, {"title": "Динамика личности", "kostyak": ["Задать рамку: «Динамика личности — это про то, что происходит со структурой во времени. Здесь надо развести два масштаба: развитие через всю жизнь и текущее функционирование, то есть как личность справляется с нагрузкой здесь и сейчас».", "Развести развитие и формирование: развитие — процесс изменений с собственной логикой, формирование — результат направленных воздействий, воспитания и обучения. В отечественной традиции это различение принципиально.", "Движущие силы: в психоанализе — энергия влечений и конфликт инстанций; у Адлера — стремление к преодолению неполноценности; в гуманистической линии — тенденция к самоактуализации; в деятельностном подходе — противоречие между наличными возможностями и требованиями деятельности, разрешаемое через присвоение новых способов действия.", "Текущий срез: защитные механизмы (вытеснение, проекция, рационализация, замещение, сублимация) — бессознательные и искажающие реальность; копинг-стратегии — осознанные способы совладания, у Лазаруса и Фолкман это проблемно-ориентированный и эмоционально-ориентированный копинг, там же ключевое понятие когнитивной оценки ситуации. Сказать прямо: защиты снижают тревогу ценой искажения, копинг требует ресурса, но работает с самой ситуацией.", "Кризисы развития — узловые точки динамики. Обозначить, что кризис в возрастной психологии понимается как нормативный и продуктивный, а не как поломка: перестройка отношений с миром, без которой не появляется новообразование.", "Эриксон как самая удобная модель динамики через всю жизнь: восемь стадий, на каждой — задача в форме противопоставления, разрешаемая в пользу того или иного полюса. Обязательно назвать, что он первым распространил развитие на взрослость и старость, а не остановился на подростковом возрасте, и что центральное для него понятие — идентичность. Кризис идентичности в подростковом возрасте — его формулировка.", "Марсиа и статусы идентичности: достигнутая, мораторий, преждевременная (предрешённая) и диффузная. Критерии — наличие кризиса поиска и наличие принятых обязательств. Модель ценна тем, что операционализировала Эриксона и позволила его проверять эмпирически.", "Жизненный путь личности: Рубинштейн — человек как субъект собственной жизни, способный занять позицию по отношению к ней; Ананьев — биография как предмет исследования, понятия жизненного пути и субъективной картины жизненного пути; Абульханова-Славская — жизненная стратегия. Это самостоятельный вклад отечественной школы, стоит подать именно так.", "Закрыть современным акцентом: посттравматический рост — данные о том, что часть людей после тяжёлых событий сообщает о положительных изменениях: пересмотре ценностей, углублении отношений, ощущении собственной силы. Обязательно оговорить, что рост не отменяет страдания, не наступает автоматически и что значительная часть данных получена самоотчётами — это ограничение обсуждается в литературе."], "terms": ["Развитие и формирование", "движущие силы развития", "защитные механизмы: вытеснение", "проекция", "рационализация", "сублимация", "копинг-стратегии", "когнитивная оценка ситуации", "проблемно-ориентированный и эмоционально-ориентированный копинг", "нормативный кризис развития", "новообразование возраста", "эпигенетический принцип Эриксона", "идентичность и кризис идентичности", "статусы идентичности по Марсиа: достигнутая", "мораторий", "предрешённая", "диффузная", "самоактуализация", "жизненный путь личности", "субъект жизни (Рубинштейн)", "жизненная стратегия", "посттравматический рост"], "exp": [], "stance": ["Эриксона считаю до сих пор лучшей рамкой для разговора о динамике — не потому что стадии точны, а потому что он задал верную оптику: развитие идёт всю жизнь, и каждый её отрезок имеет собственную задачу, а не является спуском с вершины. Жёсткая привязка стадий к возрастам, конечно, не выдержала проверки, особенно сейчас, когда сроки взросления сдвинулись, — и в литературе на это давно указывают.", "Что считаю устаревшим — противопоставление защит и копинга как «плохого» и «хорошего». В острой фазе кризиса отрицание бывает адаптивным, оно даёт время. Вопрос не в типе механизма, а в его уместности и гибкости: ригидное использование любой стратегии, включая самую зрелую, работает против человека.", "Спор, который не решён, — насколько личность вообще изменчива во взрослости. Лонгитюдные данные показывают и высокую относительную стабильность черт, и закономерные средние сдвиги с возрастом — рост добросовестности и эмоциональной устойчивости. Как это сочетается со свидетельствами быстрых изменений в терапии, вопрос открытый, и я бы не делал вид, что он закрыт."], "conf": ["Через динамику самого конфликта и через личностные предпосылки. Конфликт имеет собственную динамику — предконфликтную стадию, инцидент, эскалацию, кульминацию, завершение и постконфликтную фазу, и на каждой работают разные средства: на эскалации переговоры бесполезны, нужно сначала сбить накал. Личностный слой: стиль поведения в конфликте по Томасу — соперничество, сотрудничество, компромисс, избегание, приспособление — это, по сути, копинг-репертуар, перенесённый в межличностную сферу. И вывод, за который стоит держаться: проблема не в том, что человек выбирает «плохой» стиль, а в том, что он использует один и тот же во всех ситуациях. Отдельно — что конструктивно разрешённый конфликт выполняет ту же функцию, что и нормативный кризис: перестраивает отношения и делает их жизнеспособнее."], "crisis": ["Это ядро подготовки к 7 августа, здесь можно говорить дольше всего. Развести нормативные кризисы развития и ненормативные — травматические, вызванные событием извне: у первых есть логика и предсказуемый исход, у вторых нет. Дальше — линия острого стресса: острая реакция на стресс, острое стрессовое расстройство, посттравматическое стрессовое расстройство с его тремя опорными группами проявлений — навязчивое переживание, избегание, гипервозбуждение, плюс негативные изменения в мыслях и настроении в современных классификациях. Обязательно сказать про комплексное ПТСР, выделенное в МКБ-11 отдельно, — это ровно то знание современных тенденций, которого ждут по четвёртому критерию. Практический слой: экстренная психологическая помощь и принцип работы в очаге, кризисное консультирование, дебрифинг — с оговоркой, что однократный психологический дебрифинг сразу после события по накопленным данным не показал профилактического эффекта, а по части исследований и ухудшал исход, из-за чего его перестали рекомендовать как универсальную процедуру. Из доказательных методов назвать травмофокусированную когнитивно-поведенческую терапию и EMDR. Замкнуть на посттравматическом росте и на понятиях жизнестойкости и резилентности — и на том, что защитные факторы (социальная поддержка, чувство контроля, осмысленность) в исследованиях устойчиво предсказывают исход лучше, чем тяжесть самого события."], "follow": [{"q": "Кризис — это всегда плохо?", "a": "Нет, и различение здесь принципиальное. Нормативный кризис развития — механизм перехода, без него не появляется новообразование, а «бескризисное» развитие обычно означает, что задача не решена, а отложена. Травматический кризис — другое дело, он не имеет развивающей функции сам по себе. Но и он может завершиться личностным изменением, если у человека есть ресурс и поддержка. Формулировка «кризис — это возможность» верна для первого случая и становится довольно бестактной во втором, особенно если произносится рано."}, {"q": "Чем комплексное ПТСР отличается от обычного?", "a": "Комплексное ПТСР в МКБ-11 включает все признаки ПТСР плюс три дополнительные группы: нарушения регуляции аффекта, устойчиво негативное представление о себе — чувство ничтожности, вины, стыда, и стойкие трудности в поддержании отношений и ощущение отчуждённости. Возникает типично после длительной, повторяющейся травматизации, из которой невозможно выйти: насилие в семье, плен, эксплуатация. Клинически это важно потому, что стандартный протокол работы с единичной травмой здесь недостаточен — сначала нужна фаза стабилизации и работы с регуляцией. В DSM-5 отдельной такой категории нет, и различие между классификациями стоит упомянуть — вопрос обсуждается."}], "n": 12, "section": "Личность", "tier": 3}, {"title": "Социально-психологические характеристики личности", "kostyak": ["Начать с постановки проблемы: социальная психология личности изучает не структуру личности вообще, а то, как личность формируется в группе и как она в группе себя предъявляет. Отечественная формулировка — личность как субъект социальных отношений и совместной деятельности.", "Социализация: усвоение и активное воспроизводство социального опыта. Три сферы по Андреевой — деятельность, общение, самосознание. Стадии: дотрудовая, трудовая, послетрудовая. Институты социализации — семья, образовательные учреждения, группа сверстников, трудовой коллектив, медиа. Отдельно назвать ресоциализацию и десоциализацию.", "Социальная установка: аттитюд, традиция Томаса и Знанецкого, трёхкомпонентная структура — когнитивный, аффективный, поведенческий компоненты. Обязательно упомянуть парадокс Лапьера: связь между декларируемой установкой и реальным поведением оказалась слабой, и это до сих пор одна из центральных проблем области.", "Диспозиционная концепция Ядова как отечественный ответ на эту проблему: иерархия диспозиций от элементарных фиксированных установок до ценностных ориентаций, и на каждом уровне поведение регулируется своим типом диспозиции. Поэтому расхождение установки и поступка — не аномалия, а следствие того, что измеряют один уровень, а предсказывают поведение на другом.", "Я-концепция: когнитивный, оценочный и поведенческий компоненты, самооценка, уровень притязаний. Формула самоуважения Джемса как исторический ориентир — самоуважение как отношение успеха к притязаниям.", "Социальная идентичность: Тайфел и Тёрнер, различение личностной и социальной идентичности, механизм межгруппового сравнения, внутригрупповой фаворитизм. Это ключевой пункт, к нему потом возвращаюсь в разговоре о конфликте.", "Локус контроля Роттера — интернальный и экстернальный, связь с ответственностью, копингом и уровнем тревоги. Рядом — выученная беспомощность Селигмана.", "Конформность и нонконформность как характеристики личности в группе, самостоятельность как третья позиция, а не середина. Здесь же коллективистское самоопределение по Петровскому.", "Закрыть компетентностным блоком: социальная компетентность, коммуникативная компетентность, социальный интеллект, эмоциональный интеллект — и оговорка, что последний конструкт до сих пор обсуждается на предмет того, отличается ли он от личностных черт и общего интеллекта."], "terms": ["социализация", "институты социализации", "ресоциализация", "аттитюд", "У. Томас и Ф. Знанецкий", "парадокс Лапьера", "В. А. Ядов", "диспозиционная концепция", "Я-концепция", "самооценка", "уровень притязаний", "У. Джемс", "Г. Тайфел", "Дж. Тёрнер", "социальная идентичность", "внутригрупповой фаворитизм", "Дж. Роттер", "локус контроля", "М. Селигман", "выученная беспомощность", "конформность и нонконформизм", "А. В. Петровский", "коллективистское самоопределение", "социальный интеллект"], "exp": ["Ричард Лапьер, установка и поведение.* Исследователь путешествовал по США с супружеской парой китайского происхождения, останавливаясь в гостиницах и ресторанах; отказов практически не было. Позже он разослал в те же заведения письма с вопросом, примут ли они китайских посетителей, — подавляющее большинство ответивших сказали «нет». Расхождение между декларируемой установкой и реальным поведением получило имя парадокса Лапьера. Методологически работа уязвима: неизвестно, отвечал ли на письмо тот же человек, который обслуживал гостей, — но проблему она поставила и с повестки не ушла.", "Анри Тайфел, парадигма минимальных групп.* Испытуемых делили на группы по заведомо незначимому признаку — например, по предпочтению одного из двух художников или по случайному жребию, — при этом участники не общались и не знали друг друга лично. При распределении вознаграждения они всё равно отдавали предпочтение своей группе, причём часто выбирали вариант с максимальным разрывом в пользу своих, а не с максимальной выгодой для своих в абсолютных числах. Вывод: для внутригруппового фаворитизма достаточно самого факта категоризации, объективный конфликт интересов не обязателен."], "stance": ["Тайфел для меня важнее Шерифа именно как объяснительная модель современных конфликтов. Шериф объясняет вражду там, где есть за что бороться, а сегодня чаще видишь противостояние, где предмет спора символический и вторичный по отношению к самому делению на «своих» и «чужих».", "Про социализацию добавлю: классическая схема с семьёй, школой и сверстниками описывает мир, где у институтов была монополия на трансляцию норм. Сейчас конкурирующим институтом стали платформы с алгоритмической выдачей, и это меняет не содержание социализации, а её механизм — норма усваивается не от значимого взрослого, а из среды, подобранной под пользователя."], "conf": ["Разворачиваю подробно, здесь материал ложится сам.", "Ядро — теория социальной идентичности. Если человек черпает самоуважение из принадлежности к группе, то потребность в позитивном отличии своей группы от других создаёт межгрупповую напряжённость без всякого столкновения интересов. Дальше работают механизмы: внутригрупповой фаворитизм, аутгрупповая дискриминация, эффект гомогенности чужой группы — «они все одинаковые», а «мы разные». Это объяснительный аппарат для этнических, политических и корпоративных конфликтов.", "Второй ход — конфликтная компетентность. У Хасана это способность удерживать противоречие в продуктивной форме, не сваливаясь ни в избегание, ни в разрушение. Рядом — стратегии поведения в конфликте по Томасу и Килманну: соперничество, сотрудничество, компромисс, избегание, приспособление. Важно проговорить, что это не типы личности, а репертуар, и профессиональная задача — расширить репертуар, а не назначить человеку одну «правильную» стратегию.", "Третий ход — личностные предикторы конфликтности: агрессивность, ригидность установок, экстернальный локус контроля как фактор перекладывания ответственности на других, завышенная и одновременно неустойчивая самооценка, низкая толерантность к неопределённости. Отдельно — авторитарная личность в традиции Адорно и современное понятие правого авторитаризма, с оговоркой, что исходная концепция многократно пересматривалась.", "Четвёртый ход — толерантность и её пределы: этническая толерантность и интолерантность, этноцентризм, аккультурационные стратегии Берри — интеграция, ассимиляция, сепарация, маргинализация. Это прямой мост от личности к миграционной проблематике, а она в конфликтологической повестке одна из главных."], "crisis": ["Локус контроля и выученная беспомощность — центральные конструкты для понимания того, кто справится с ЧС, а кто нет. Интернальность связана с активными копинг-стратегиями, экстернальность в ситуации реальной неподконтрольности может быть адаптивной, и это стоит проговорить как нюанс, а не как простое «интернальность лучше». Сюда же — Я-концепция после травмы: разрушение базовых убеждений о безопасности мира, справедливости и собственной неуязвимости, теория Янофф-Бульман. И противоположный полюс — посттравматический рост и жизнестойкость Мадди, где кризис становится точкой перестройки идентичности. Социальная поддержка как ресурс — снова через принадлежность к группе."], "follow": [{"q": "Как соотносятся социальная установка и ценностные ориентации?", "a": "В диспозиционной концепции Ядова это разные уровни одной иерархии. Элементарные фиксированные установки регулируют реакции в конкретных предметных ситуациях, социальные установки — поведение в типовых социальных ситуациях, а ценностные ориентации задают общую направленность личности и регулируют поведение на уровне жизненных выборов. Уровень регуляции определяется масштабом ситуации."}, {"q": "Конформность — это черта личности или ситуативное явление?", "a": "И то и другое, но исследования показали, что вклад ситуации больше, чем ожидалось. У Аша уровень уступчивости резко падал при появлении хотя бы одного союзника и зависел от единодушия большинства и от публичности ответа. Личностные корреляты есть — самооценка, тревожность, статус в группе, — но предсказательная сила ситуационных параметров выше."}], "n": 15, "section": "Социальная психология", "tier": 3}, {"title": "Возрастно-психологические особенности детского развития", "kostyak": ["Пойду по периодам, каждый через триаду: социальная ситуация развития, ведущая деятельность, новообразование. Границы называю в отечественной традиции и сразу оговорю, что они условны и у разных авторов расходятся.", "Младенчество, примерно до года. Социальная ситуация — ситуация «пра-мы» по Выготскому, полная слитность со взрослым при максимальной беспомощности. Ведущая деятельность — непосредственно-эмоциональное общение со взрослым. Первый показатель нормального развития — комплекс оживления в конце первого — начале второго месяца: сосредоточение на лице взрослого, улыбка, вокализации, двигательное оживление. Новообразования конца периода — ходьба и автономная речь.", "Здесь же уместно сказать про привязанность. Боулби показал, что связь с ухаживающим взрослым — самостоятельная мотивационная система, а не производная от кормления. Эйнсворт в процедуре незнакомой ситуации выделила надёжную привязанность, тревожно-избегающую и тревожно-амбивалентную, позже была описана дезорганизованная. Тип привязанности задаёт внутреннюю рабочую модель отношений и прогнозирует способы совладания в стрессе далеко за пределами детства.", "Раннее детство, примерно от года до трёх. Социальная ситуация — «ребёнок — предмет — взрослый», взрослый становится образцом действия. Ведущая деятельность — предметно-манипулятивная, ребёнок осваивает общественно закреплённые способы употребления вещей. Бурно развивается речь, появляется наглядно-действенное мышление, к концу периода — система «я сам» и кризис трёх лет.", "Дошкольный возраст, примерно от трёх до семи. Ведущая деятельность — сюжетно-ролевая игра. Через принятие роли и работу с мнимой ситуацией ребёнок осваивает смыслы человеческих отношений, учится подчинять поведение правилу и удерживать позицию другого. Эльконин показал, что игра — школа произвольности. Новообразования — соподчинение мотивов, первичные этические инстанции, произвольность поведения, начало самосознания и самооценки.", "Младший школьный возраст, примерно с семи до десяти-одиннадцати. Ведущая деятельность — учебная. Новообразования — произвольность, внутренний план действий и рефлексия, то есть способность осознавать основания собственных действий. Ключевое изменение социальной ситуации: появляется взрослый в общественной функции, учитель, и оценка становится опосредованной социально значимым критерием. По Эриксону это стадия трудолюбия против чувства неполноценности.", "Подростковый возраст, примерно с одиннадцати-двенадцати до пятнадцати. Ведущей деятельностью Эльконин считал интимно-личностное общение со сверстниками, ряд авторов говорит о социально значимой деятельности в целом. Центральное новообразование — чувство взрослости, притязание на новые права при сохранении прежних обязанностей. Отсюда реакции эмансипации и группирования со сверстниками.", "В юности на первый план выходит задача идентичности в терминах Эриксона: сведение представлений о себе в целостность, устойчивую во времени, с альтернативой смешения ролей. Здесь же — профессиональное и ценностное самоопределение.", "Замечу сквозное: развитие идёт гетерохронно, а среда работает через сензитивные периоды. Именно поэтому депривация в раннем возрасте, особенно эмоциональная, даёт последствия, которые труднее всего компенсировать позже."], "terms": ["социальная ситуация развития", "ведущая деятельность", "новообразование", "комплекс оживления", "ситуация «пра-мы»", "Боулби", "Эйнсворт", "незнакомая ситуация", "надёжная и ненадёжная привязанность", "внутренняя рабочая модель", "предметно-манипулятивная деятельность", "сюжетно-ролевая игра", "Эльконин", "мнимая ситуация", "соподчинение мотивов", "произвольность", "учебная деятельность", "внутренний план действий", "рефлексия", "чувство взрослости", "реакция эмансипации", "идентичность", "Эриксон", "депривация"], "exp": [], "stance": ["Наиболее подтверждённой временем и данными частью этого материала мне кажется теория привязанности: она выросла из наблюдения, но получила и лонгитюдную, и кросс-культурную проверку, и сегодня работает в диагностике, в семейной терапии и в кризисной помощи. Идея ведущей деятельности мне ближе как объяснительный принцип, чем как жёсткая схема: с изменением среды детства содержание ведущей деятельности меняется — цифровые формы игры и общения дают ту же функцию в другой оболочке, и здесь схема требует уточнения, а не защиты. Что действительно устарело — представление о ребёнке как о пассивном объекте воздействия среды; современные данные показывают ребёнка активным с первых недель."], "conf": ["* ранний опыт задаёт способ поведения в конфликте. Надёжная привязанность даёт способность выдерживать напряжение и договариваться, избегающая — уход и обесценивание отношений, амбивалентная — эскалацию с требованием подтверждения. Второе — игра: сюжетно-ролевая игра исторически первая площадка, где ребёнок учится согласовывать позиции, удерживать правило и разрешать столкновение интересов без разрушения отношений. Дефицит игры в дошкольном детстве отзывается дефицитом переговорных навыков во взрослости."], "crisis": ["* дети — отдельная категория пострадавших, и работа с ними строится иначе. Первое: сохранение или скорейшее восстановление контакта со значимым взрослым важнее любых техник, разлучение ребёнка с родителем в ЧС само по себе травматично. Второе: ребёнок не даёт вербального отчёта, поэтому диагностика идёт через игру, рисунок, наблюдение за регрессом и изменением сна и аппетита. Третье: состояние ребёнка в значительной мере вторично по отношению к состоянию взрослых рядом, отсюда правило — помогая родителю, помогаешь ребёнку. И четвёртое: возвращение режима и привычной деятельности, включая учебную и игровую, работает как основной стабилизирующий фактор."], "follow": [{"q": "Почему игра считается ведущей деятельностью, если ребёнок в ней ничему не учится напрямую?", "a": "Именно поэтому. Ведущая деятельность определяется не объёмом усваиваемых знаний, а тем, какие новообразования в ней складываются. В игре ребёнок впервые действует в поле смысла, а не в поле восприятия, отделяет значение от предмета, добровольно подчиняется правилу ради роли — так рождается произвольность, которая потом обеспечивает возможность учебной деятельности."}, {"q": "Что даёт знание типа привязанности практически?", "a": "Прогноз способа совладания и подсказку по формату помощи. С избегающим типом бесполезно наращивать эмоциональное давление, ему нужна предсказуемость и дистанция; амбивалентному нужны чёткие рамки контакта, иначе помощь превращается в бесконечное требование подтверждений. В работе с семьёй это ещё и мишень: изменение чувствительности родителя к сигналам ребёнка меняет тип привязанности, он не является пожизненным приговором."}], "n": 19, "section": "Возрастная психология", "tier": 3}, {"title": "Психологические проблемы зрелости и старения", "kostyak": ["Взрослость долгое время оставалась белым пятном возрастной психологии: развитие считали завершающимся к юности, а дальше видели плато и спад. Пересмотр этого взгляда связан с лайфспан-подходом и, в отечественной традиции, с акмеологией — направлением, идущим от Ананьева и Бодалёва, которое изучает закономерности достижения человеком вершины в профессиональном и личностном развитии.", "Задачи развития взрослости формулируются содержательно, а не по годам: построение устойчивых близких отношений и семьи, профессиональная реализация, принятие ответственности за других, а во второй половине — то, что Эриксон назвал генеративностью, вклад в следующее поколение, с альтернативой стагнации.", "Отдельно скажу про кризис середины жизни. Понятие пришло из клинической и психоаналитической традиции, широко разошлось в культуре — и здесь надо быть точным: как универсальный нормативный кризис определённого возраста он эмпирическими данными не подтверждается. Большинство людей проходят середину жизни без выраженного кризиса, а там, где он есть, он привязан скорее к событиям биографии — потере работы, разводу, болезни, уходу детей — чем к самому возрасту. Это хороший пример того, как популярный конструкт живёт дольше, чем стоящие за ним доказательства.", "Что в середине жизни действительно происходит и подтверждается: смена временной перспективы. Человек начинает считать время не от рождения, а до конца, и это перестраивает приоритеты — сужается круг контактов, растёт избирательность, ценность приобретают эмоционально значимые отношения. Это описано в теории социоэмоциональной селективности.", "Профессиональное развитие взрослости имеет и оборотную сторону — эмоциональное выгорание. Синдром описан Фрейденбергером, операционализирован Маслач через три компонента: эмоциональное истощение, деперсонализация или цинизм, редукция профессиональных достижений. Существенно, что современный взгляд считает выгорание преимущественно организационной, а не личностной проблемой: причины лежат в условиях труда, нагрузке и автономии, а не в слабости работника.", "Старение — процесс одновременно биологический, психологический и социальный, и эти три линии расходятся. Биологически идёт снижение функциональных резервов, психологически — перестройка деятельно for (const [k, id] of Object.entries(FBTN)) {
  el(id).addEventListener("click", () => {
    filter = k;
    for (const [k2, id2] of Object.entries(FBTN)) el(id2).setAttribute("aria-pressed", String(k2 === k));
    render(); window.scrollTo({ top: 0, behavior: "smooth" });
  });
}

el("reset").addEventListener("click", () => {
  if (confirm("Сбросить все отметки? Прогресс по " + done.size + " темам будет удалён.")) {
    done = new Set(); save(); render();
  }
});

let cur = null;
function pick() {
  const pool = TOPICS.filter(t => !done.has(t.n));
  const from = pool.length ? pool : TOPICS;
  cur = from[Math.floor(Math.random() * from.length)];
  el("dKick").textContent = "Тема " + cur.n + " · уровень " + cur.tier + " · " + cur.section;
  el("dTitle").textContent = cur.title;
  el("dBody").hidden = true; el("dBody").innerHTML = "";
  el("dShow").hidden = false;
  window.scrollTo(0, 0);
}
el("drillBtn").addEventListener("click", () => { pick(); el("drill").dataset.on = "1"; });
el("dShow").addEventListener("click", () => {
  el("dBody").innerHTML = bodyHTML(cur);
  el("dBody").hidden = false; el("dShow").hidden = true;
});
el("dNext").addEventListener("click", pick);
el("dClose").addEventListener("click", () => { el("drill").dataset.on = "0"; });

applyMode();
render();
</script>
</body>
</html>
